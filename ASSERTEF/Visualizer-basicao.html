<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Visualizer - Treino de Bike</title>
    <style>
        /* Estilos do monólito - Reset e Fundo */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #050505; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        
        #canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
            filter: contrast(1.2) brightness(1.1);
        }
        
        /* Interface de Upload com Vibe Neon */
        #ui { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            text-align: center; 
            color: white; 
            background: rgba(10, 10, 10, 0.85); 
            padding: 40px; 
            border-radius: 20px; 
            border: 2px solid #ff00ff; 
            box-shadow: 0 0 30px #ff00ff, inset 0 0 20px rgba(255, 0, 255, 0.2); 
            z-index: 10; 
            transition: opacity 0.5s ease-out; 
        }
        
        h1 { 
            margin-top: 0; 
            font-size: 28px; 
            text-transform: uppercase; 
            letter-spacing: 3px;
            text-shadow: 0 0 10px #ff00ff;
        }
        
        p {
            color: #ccc;
            margin-bottom: 30px;
        }
        
        input[type="file"] { 
            display: none; 
        }
        
        .custom-file-upload { 
            border: 2px solid #00ffff; 
            display: inline-block; 
            padding: 15px 30px; 
            cursor: pointer; 
            color: #00ffff; 
            font-size: 16px;
            font-weight: bold; 
            border-radius: 8px; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            box-shadow: 0 0 15px #00ffff; 
            transition: all 0.3s ease; 
        }
        
        .custom-file-upload:hover { 
            background: #00ffff; 
            color: #000; 
            box-shadow: 0 0 30px #00ffff;
        }
        
        audio { display: none; }
    </style>
</head>
<body>

    <!-- Interface Inicial -->
    <div id="ui">
        <h1>Visualizer do Pai</h1>
        <p>Selecione a track para gerar os fractais ao vivo</p>
        <label class="custom-file-upload">
            <input type="file" id="audio-upload" accept="audio/*">
            🚀 Carregar Música
        </label>
    </div>

    <!-- Tela do Show -->
    <canvas id="canvas"></canvas>
    <audio id="audio" controls></audio>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('audio');
        const upload = document.getElementById('audio-upload');
        const ui = document.getElementById('ui');

        let audioCtx, analyser, source;
        let dataArray;

        // Ajusta o tamanho da tela dinamicamente
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Lida com o upload do arquivo de áudio
        upload.addEventListener('change', function() {
            const files = this.files;
            if (files.length === 0) return;
            
            const file = files[0];
            const url = URL.createObjectURL(file);
            audio.src = url;
            audio.load();
            audio.play();

            // Esconde a interface suavemente
            ui.style.opacity = 0;
            setTimeout(() => ui.style.display = 'none', 500);

            // Inicializa a Web Audio API
            if (!audioCtx) {
                // Tenta criar o contexto (compatível com vários navegadores)
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256; // Define a resolução da análise de frequência
                
                source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                
                animate();
            }
        });

        let time = 0;

        // Loop de animação
        function animate() {
            requestAnimationFrame(animate);
            analyser.getByteFrequencyData(dataArray);

            // Efeito de rastro (motion blur/glow) no fundo
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // Calcula o grave médio (para fazer o "pumping" do EDM)
            let bass = 0;
            for(let i = 0; i < 5; i++) {
                bass += dataArray[i];
            }
            bass = bass / 5;

            // Velocidade de rotação aumenta com o grave
            time += 0.002 + (bass * 0.00002);
            
            // Tamanho do núcleo central pulsa com o grave
            const coreRadius = 80 + (bass * 0.8);
            
            const bars = 64; // Quantidade de linhas/fractais
            const step = (Math.PI * 2) / bars;
            
            // Desenha as formas reativas
            for (let i = 0; i < bars; i++) {
                // Pega a frequência e suaviza o valor
                const value = dataArray[i];
                const percent = value / 255;
                const height = percent * (canvas.height / 2.2);
                
                const angle = (i * step) + time;
                
                // Mapeia a cor com base na posição, frequência e tempo (Gera aquele neon vibrante)
                const hue = (i * (360 / bars) + (time * 100)) % 360;
                
                // --- LINHAS EXTERNAS (Raio Laser) ---
                ctx.strokeStyle = `hsl(${hue}, 100%, 60%)`;
                ctx.lineWidth = 2 + (percent * 4);
                
                ctx.beginPath();
                
                // Ponto inicial (borda do círculo central)
                const startX = centerX + Math.cos(angle) * coreRadius;
                const startY = centerY + Math.sin(angle) * coreRadius;
                
                // Ponto final (onda batendo pra fora)
                const endX = centerX + Math.cos(angle) * (coreRadius + height);
                const endY = centerY + Math.sin(angle) * (coreRadius + height);
                
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.stroke();

                // Partículas na ponta das linhas quando a música estoura
                if (value > 150) {
                    ctx.beginPath();
                    ctx.fillStyle = `hsl(${hue}, 100%, 80%)`;
                    ctx.arc(endX, endY, 3 + (percent * 5), 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Conexões tipo teia/fractal entre pontos distantes
                    ctx.beginPath();
                    ctx.strokeStyle = `hsla(${hue}, 100%, 50%, 0.3)`;
                    ctx.lineWidth = 1;
                    const prevAngle = ((i-2) * step) + time;
                    const prevX = centerX + Math.cos(prevAngle) * (coreRadius + (dataArray[Math.abs(i-2)]/255 * (canvas.height/2.2)));
                    const prevY = centerY + Math.sin(prevAngle) * (coreRadius + (dataArray[Math.abs(i-2)]/255 * (canvas.height/2.2)));
                    ctx.moveTo(endX, endY);
                    ctx.lineTo(prevX, prevY);
                    ctx.stroke();
                }
            }
            
            // --- NÚCLEO CENTRAL (O "Coração" do palco) ---
            ctx.beginPath();
            ctx.arc(centerX, centerY, coreRadius * 0.9, 0, Math.PI * 2);
            ctx.strokeStyle = `hsl(${(time * 150) % 360}, 100%, 50%)`;
            ctx.lineWidth = 5 + (bass * 0.05);
            ctx.stroke();
            
            // Círculo interno extra
            ctx.beginPath();
            ctx.arc(centerX, centerY, coreRadius * 0.6, 0, Math.PI * 2);
            ctx.strokeStyle = `hsla(${(time * 100 + 180) % 360}, 100%, 50%, 0.5)`;
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    </script>
</body>
</html>
