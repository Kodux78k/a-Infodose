<div class="app">

<header>
  <div class="logo">🔗 KODUX <span>Link Forge</span></div>
  <div class="sub">Gerador rápido de links JS · CSS · @import · Infodose</div>
</header>

<div class="card">

  <label>Caminho</label>

  <div class="row">
    <input id="path" autocomplete="off" spellcheck="false" placeholder="/oiDual/KODUX/78K/APPS/78iFSw/dual-ifswin/js/modules/resize-handles.js">
    <button class="primary" onclick="generate()">GERAR</button>
  </div>

  <div class="switch">
    <button id="httpsBtn" class="active" onclick="setMode('https')">
      HTTPS
    </button>
    <button id="pathBtn" onclick="setMode('path')">
      CAMINHO
    </button>
  </div>

</div>

<div id="outputs"></div>

<div class="card">

  <div class="output-title">
    <strong>⭐ Favoritos</strong>
    <button class="small" onclick="clearFavorites()">Limpar</button>
  </div>

  <div id="favorites"></div>

</div>

</div>

<script>
const HOST = "https://infodose.com.br";

const pathInput = document.getElementById("path");
const outputs = document.getElementById("outputs");
const favorites = document.getElementById("favorites");

let mode = localStorage.getItem("kodux-link-mode") || "https";

function normalizePath(value){
  value = value.trim();

  if(!value) return "";

  // Se o usuário colar uma URL completa,
  // extrai somente o pathname.
  try{
    if(value.startsWith("http://") || value.startsWith("https://")){
      value = new URL(value).pathname;
    }
  }catch(e){}

  if(!value.startsWith("/")){
    value = "/" + value;
  }

  return value;
}

function fullURL(path){
  return HOST + path;
}

function detectType(path){

  const clean = path.split("?")[0].toLowerCase();

  if(clean.endsWith(".js") || clean.endsWith(".mjs")){
    return "js";
  }

  if(clean.endsWith(".css")){
    return "css";
  }

  return "unknown";
}

function build(path){

  const type = detectType(path);
  const url = mode === "https" ? fullURL(path) : path;

  if(type === "js"){
    return [
      {
        title:"SCRIPT SRC",
        code:`<script src="${url}"><\/script>`
      }
    ];
  }

  if(type === "css"){
    return [
      {
        title:"STYLESHEET",
        code:`<link rel="stylesheet" href="${url}">`
      },
      {
        title:"@IMPORT",
        code:`@import url("${url}");`
      }
    ];
  }

  return [
    {
      title:"URL",
      code:url
    }
  ];
}

function generate(){

  const path = normalizePath(pathInput.value);

  if(!path){
    outputs.innerHTML = "";
    return;
  }

  pathInput.value = path;

  const items = build(path);

  outputs.innerHTML = items.map((item,index)=>`

    <div class="card output">

      <div class="output-title">
        <strong>${item.title}</strong>
        <span class="badge">${detectType(path).toUpperCase()}</span>
      </div>

      <pre id="code-${index}">${escapeHTML(item.code)}</pre>

      <div class="actions">
        <button class="primary"
          onclick="copyCode(${index})">
          📋 COPIAR
        </button>

        <button
          onclick="favorite()">
          ⭐ FAVORITAR
        </button>
      </div>

    </div>

  `).join("");

  window.currentItems = items;
  window.currentPath = path;
}

function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

async function copyCode(index){

  const code = window.currentItems?.[index]?.code;

  if(!code) return;

  try{
    await navigator.clipboard.writeText(code);
  }catch(e){

    const area = document.createElement("textarea");

    area.value = code;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();

  }

  const buttons = document.querySelectorAll(".actions button");

  if(buttons[index*2]){
    const old = buttons[index*2].textContent;
    buttons[index*2].textContent = "✓ COPIADO";

    setTimeout(()=>{
      buttons[index*2].textContent = old;
    },1000);
  }
}

function setMode(newMode){

  mode = newMode;

  localStorage.setItem(
    "kodux-link-mode",
    mode
  );

  document
    .getElementById("httpsBtn")
    .classList.toggle("active",mode==="https");

  document
    .getElementById("pathBtn")
    .classList.toggle("active",mode==="path");

  if(pathInput.value.trim()){
    generate();
  }
}

function getFavorites(){

  try{
    return JSON.parse(
      localStorage.getItem("kodux-link-favorites") || "[]"
    );
  }catch(e){
    return [];
  }

}

function saveFavorites(list){

  localStorage.setItem(
    "kodux-link-favorites",
    JSON.stringify(list)
  );

}

function favorite(){

  const path = window.currentPath;

  if(!path) return;

  const list = getFavorites();

  if(!list.some(x=>x.path===path)){

    list.unshift({
      path,
      type:detectType(path),
      created:Date.now()
    });

    saveFavorites(list);

  }

  renderFavorites();
}

function removeFavorite(path){

  const list = getFavorites()
    .filter(x=>x.path!==path);

  saveFavorites(list);

  renderFavorites();
}

function useFavorite(path){

  pathInput.value = path;
  generate();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function clearFavorites(){

  if(!confirm("Apagar todos os favoritos?")) return;

  localStorage.removeItem(
    "kodux-link-favorites"
  );

  renderFavorites();
}

function renderFavorites(){

  const list = getFavorites();

  if(!list.length){

    favorites.innerHTML = `
      <div class="empty">
        Nenhum link salvo ainda.
      </div>
    `;

    return;
  }

  favorites.innerHTML = list.map(item=>`

    <div class="card fav">

      <div class="fav-info">

        <div class="fav-path">
          ${escapeHTML(item.path)}
        </div>

        <div class="fav-meta">
          ${item.type.toUpperCase()} · Infodose
        </div>

      </div>

      <div class="fav-actions">

        <button
          class="small primary"
          onclick='useFavorite(${JSON.stringify(item.path)})'>
          USAR
        </button>

        <button
          class="small"
          onclick='removeFavorite(${JSON.stringify(item.path)})'>
          ×
        </button>

      </div>

    </div>

  `).join("");

}

pathInput.addEventListener("input",()=>{
  generate();
});

pathInput.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    generate();
  }
});

renderFavorites();

</script>

    };


    reader.readAsText(file, 'utf-8');

    // permite reimportar o mesmo arquivo
    input.value = '';

  };


  window.clearInline = function() {

    $('inline-html').value = '';

    sourceDocument = null;

    sourceURL = null;

    ['count-html','count-css','count-js','count-src']
      .forEach(id => { $(id).textContent = '0'; });

    status('inline limpo');

    log('Editor inline limpo.');

  };


  // =================================================
  // CSS
  // =================================================

  function injectCSS() {

    if (!sourceDocument)
      return;


    sourceDocument
      .querySelectorAll('style')
      .forEach(style => {

        const node =
          document.createElement('style');

        node.dataset.remoteInjector =
          'true';

        node.textContent =
          style.textContent;

        document.head.appendChild(node);

      });


    log(
      'CSS injetado.',
      'ok'
    );

  }


  // =================================================
  // HTML
  // =================================================

  function injectHTML() {

    if (!sourceDocument)
      return;


    const target =
      $('inject-target');


    const fragment =
      document.createDocumentFragment();


    Array.from(
      sourceDocument.body.childNodes
    )
    .forEach(node => {

      if (
        node.nodeName !== 'SCRIPT'
      ) {

        fragment.appendChild(
          document.importNode(
            node,
            true
          )
        );

      }

    });


    target.appendChild(
      fragment
    );


    log(
      'HTML injetado.',
      'ok'
    );

  }


  // =================================================
  // JS  (com suporte a import / modules)
  // =================================================

  function injectJS() {

    if (!sourceDocument)
      return;


    const base =
      baseURL();


    let classics = 0;
    let modules = 0;


    sourceDocument
      .querySelectorAll('script')
      .forEach(script => {


        const type =
          (script.getAttribute('type') || '')
            .trim()
            .toLowerCase();


        // Tipos que não são JavaScript (application/json,
        // text/template, importmap...) são ignorados.
        if (type && !JS_TYPES.has(type)) {

          log(`JS ignorado (type="${type}")`);

          return;

        }


        const src =
          script.getAttribute('src');

        const code =
          script.textContent || '';


        // ============================================
        // SCRIPT EXTERNO
        // ============================================

        if (src) {

          const node =
            document.createElement('script');

          copyAttributes(script, node);

          node.src =
            absoluteURL(src, base);

          node.dataset.remoteInjector =
            'script';

          document.body.appendChild(node);


          if (
            (node.getAttribute('type') || '')
              .toLowerCase() === 'module'
          ) {

            modules++;

            log(`JS módulo externo → ${node.src}`);

          }

          else {

            classics++;

            log(`JS externo → ${node.src}`);

          }

          return;

        }


        // ============================================
        // SCRIPT INLINE — MÓDULO (import / export)
        // ============================================

        if (
          type === 'module' ||
          looksLikeModule(code)
        ) {

          modules++;


          const result =
            rewriteModuleSpecifiers(code, base);


          const blobURL =
            URL.createObjectURL(
              new Blob(
                [result.code],
                { type: 'text/javascript' }
              )
            );

          injectedBlobURLs.push(blobURL);


          const node =
            document.createElement('script');

          node.type = 'module';

          node.src = blobURL;

          node.dataset.remoteInjector =
            'script';

          document.body.appendChild(node);


          log(
            `JS inline module → blob (${result.rewrites} import(s) resolvido(s))`,
            'ok'
          );


          if (/\bimport\s+[^(]*\bfrom\s*['"][^./]/.test(code)) {

            log(
              'Atenção: bare specifiers (ex.: "lodash") precisam de import map.',
              'error'
            );

          }

          return;

        }


        // ============================================
        // SCRIPT INLINE — CLÁSSICO
        // ============================================

        classics++;


        const node =
          document.createElement('script');

        copyAttributes(script, node);

        node.textContent = code;

        node.dataset.remoteInjector =
          'script';

        document.body.appendChild(node);


        log(
          'JS inline → executando...',
          'ok'
        );

      });


    log(
      `JS processado: ${classics} clássico(s), ${modules} módulo(s)`,
      'ok'
    );

  }


  // =================================================
  // PUBLIC ACTIONS
  // =================================================

  window.injectHTMLOnly =
    injectHTML;


  window.injectCSSOnly =
    injectCSS;


  window.injectJSOnly =
    injectJS;


  window.injectAll = function() {

    if (!sourceDocument) {

      log(
        'Nenhum HTML carregado.',
        'error'
      );

      return;

    }


    injectCSS();

    injectHTML();

    injectJS();


    status(
      'INJETADO',
      'ok'
    );


    log(
      '◆ Runtime completo executado.',
      'ok'
    );

  };


  // =================================================
  // CLEAR
  // =================================================

  window.clearInjected = function() {

    $('inject-target').innerHTML = '';


    document
      .querySelectorAll(
        'style[data-remote-injector="true"]'
      )
      .forEach(
        node =>
          node.remove()
      );


    document
      .querySelectorAll(
        'script[data-remote-injector="script"]'
      )
      .forEach(
        node =>
          node.remove()
      );


    injectedBlobURLs
      .forEach(url => {

        try { URL.revokeObjectURL(url); }
        catch {}

      });

    injectedBlobURLs.length = 0;


    status(
      'limpo'
    );


    log(
      'DOM injetado, CSS, módulos e blob URLs removidos.'
    );

  };


  // =================================================
  // ENTER
  // =================================================

  $('url')
    .addEventListener(
      'keydown',
      event => {

        if (
          event.key === 'Enter'
        ) {

          loadRemote();

        }

      }
    );


})();
</script></body></html>
