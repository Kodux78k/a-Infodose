<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧩 KOBLLUX · Editor Modular JS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0b0d12;
      color: #e0e4ed;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    h1 {
      font-weight: 300;
      font-size: 1.8rem;
      letter-spacing: -.02em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #b978ff, #67e6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .sub {
      color: #7a8499;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      border-left: 2px solid #2a2f3a;
      padding-left: 1rem;
    }
    .flex-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .toolbar {
      background: #14181f;
      border-radius: 1rem;
      padding: 1rem 1.5rem;
      border: 1px solid #252b36;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .toolbar button, .toolbar label {
      background: #1e2630;
      border: none;
      color: #c8d0dc;
      padding: 0.4rem 1rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      border: 1px solid transparent;
    }
    .toolbar button:hover {
      background: #2a3340;
      border-color: #4a5a70;
      color: #fff;
    }
    .toolbar button.primary {
      background: #6c5ce7;
      color: #fff;
      border-color: #6c5ce7;
    }
    .toolbar button.primary:hover {
      background: #5a4bd1;
    }
    .toolbar button.danger {
      background: #e74c6f;
      color: #fff;
      border-color: #e74c6f;
    }
    .toolbar button.danger:hover {
      background: #c0395b;
    }
    .toolbar input[type="file"] {
      display: none;
    }
    .toolbar .sep {
      width: 1px;
      height: 1.8rem;
      background: #2a2f3a;
    }
    textarea#sourceInput {
      width: 100%;
      min-height: 120px;
      background: #0f131a;
      border: 1px solid #252b36;
      border-radius: 1rem;
      padding: 1rem;
      color: #d0d8e4;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      resize: vertical;
      outline: none;
      transition: 0.2s;
    }
    textarea#sourceInput:focus {
      border-color: #6c5ce7;
      box-shadow: 0 0 0 3px #6c5ce733;
    }
    .stats {
      font-size: 0.8rem;
      color: #7a8499;
      margin: 0.5rem 0 1rem 0;
    }
    #blocksContainer {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1rem;
    }
    .block-card {
      background: #12171f;
      border: 1px solid #252b36;
      border-radius: 1rem;
      padding: 1rem 1.5rem;
      transition: 0.2s;
      position: relative;
    }
    .block-card.inactive {
      opacity: 0.5;
      border-color: #1a2028;
    }
    .block-card .head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.3rem;
    }
    .block-card .head .title {
      font-weight: 600;
      font-size: 1rem;
      color: #bcc4d2;
      flex: 1;
      min-width: 150px;
    }
    .block-card .head .title .badge {
      font-weight: 400;
      font-size: 0.65rem;
      background: #1e2630;
      padding: 0.1rem 0.6rem;
      border-radius: 1rem;
      color: #7a8499;
      margin-left: 0.5rem;
    }
    .block-card .head .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }
    .block-card .head .actions button {
      background: transparent;
      border: 1px solid #2a2f3a;
      color: #a0aab8;
      padding: 0.2rem 0.7rem;
      border-radius: 1.2rem;
      font-size: 0.7rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .block-card .head .actions button:hover {
      background: #1e2630;
      border-color: #4a5a70;
      color: #fff;
    }
    .block-card .head .actions button.export {
      border-color: #6c5ce766;
      color: #b8a8ff;
    }
    .block-card .head .actions button.export:hover {
      background: #6c5ce733;
    }
    .block-card .head input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      accent-color: #6c5ce7;
      cursor: pointer;
    }
    .block-card .preview {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: #6a7484;
      background: #0a0d14;
      padding: 0.4rem 0.8rem;
      border-radius: 0.6rem;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 60px;
      overflow: hidden;
      margin-top: 0.4rem;
      border-left: 2px solid #2a2f3a;
    }
    .block-card .preview.expanded {
      max-height: 600px;
      overflow-y: auto;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-box {
      background: #14181f;
      border: 1px solid #2a3340;
      border-radius: 1.5rem;
      max-width: 800px;
      width: 100%;
      padding: 1.5rem;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }
    .modal-box h2 {
      font-weight: 400;
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
      color: #c8d0dc;
    }
    .modal-box textarea {
      flex: 1;
      min-height: 200px;
      background: #0b0d12;
      border: 1px solid #252b36;
      border-radius: 0.8rem;
      padding: 0.8rem;
      color: #d0d8e4;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      resize: vertical;
      outline: none;
    }
    .modal-box textarea:focus {
      border-color: #6c5ce7;
    }
    .modal-box .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.8rem;
      margin-top: 1rem;
    }
    .modal-box .modal-actions button {
      background: #1e2630;
      border: none;
      color: #c8d0dc;
      padding: 0.4rem 1.2rem;
      border-radius: 2rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .modal-box .modal-actions button.primary {
      background: #6c5ce7;
      color: #fff;
    }
    .modal-box .modal-actions button.primary:hover {
      background: #5a4bd1;
    }
    .modal-box .modal-actions button.danger {
      background: #e74c6f;
      color: #fff;
    }
    .modal-box .modal-actions button.danger:hover {
      background: #c0395b;
    }
    .toast-container {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 2000;
    }
    .toast {
      background: #1e2630;
      border: 1px solid #2a3340;
      padding: 0.6rem 1.2rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      color: #d0d8e4;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      animation: fadeUp 0.3s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .inline-code {
      font-family: 'JetBrains Mono', monospace;
      background: #0a0d14;
      padding: 0.1rem 0.4rem;
      border-radius: 0.3rem;
      font-size: 0.7rem;
    }
    .flex-grow { flex: 1; }
    .text-muted { color: #6a7484; }
    .mt-1 { margin-top: 0.5rem; }
    .mb-1 { margin-bottom: 0.5rem; }
    .gap-1 { gap: 0.5rem; }
    .wrap { flex-wrap: wrap; }
    .items-center { align-items: center; }
    .select-all-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: #a0aab8;
      cursor: pointer;
    }
    .select-all-label input {
      accent-color: #6c5ce7;
    }
    @media (max-width: 600px) {
      body { padding: 0.8rem; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .block-card .head { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <h1>🧩 KOBLLUX · Editor Modular JS</h1>
  <div class="sub">Carregue ou cole o código · detecte blocos · ative/desative · exporte sob medida</div>

  <div class="toolbar">
    <button onclick="document.getElementById('fileInput').click()">📂 Carregar .js</button>
    <input type="file" id="fileInput" accept=".js,.txt" onchange="loadFile(event)">
    <button class="primary" onclick="parseBlocks()">🔍 Detectar Blocos</button>
    <button onclick="clearAll()">🗑️ Limpar</button>
    <span class="sep"></span>
    <label class="select-all-label">
      <input type="checkbox" id="selectAll" onchange="toggleAllCheckboxes(this.checked)"> Selecionar todos
    </label>
    <button onclick="exportActive()">⬇️ Exportar Ativos</button>
    <button onclick="exportAll()">⬇️ Exportar Todos</button>
    <button onclick="mergeSelected()">🔗 Agrupar Selecionados</button>
    <span class="sep"></span>
    <span id="blockStats" class="text-muted" style="font-size:0.8rem;">0 blocos · 0 ativos</span>
  </div>

  <textarea id="sourceInput" placeholder="Cole aqui o conteúdo do seu arquivo JS..." spellcheck="false"></textarea>

  <div id="blocksContainer"></div>

  <!-- Modal de edição -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <h2 id="editModalTitle">Editar Bloco</h2>
      <textarea id="editTextarea" spellcheck="false"></textarea>
      <div class="modal-actions">
        <button onclick="closeEditModal()">Cancelar</button>
        <button class="primary" onclick="saveEditModal()">Salvar</button>
        <button class="danger" onclick="splitBlockFromModal()">✂️ Dividir aqui</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    // ============================================================
    //  Estado
    // ============================================================
    let blocks = [];               // { id, title, content, active }
    let nextId = 1;
    let editTargetId = null;       // id do bloco sendo editado
    let splitMarker = '//---SPLIT---'; // marcador para divisão

    // ============================================================
    //  Toast
    // ============================================================
    function toast(msg) {
      const c = document.getElementById('toastContainer');
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      c.appendChild(el);
      setTimeout(() => el.remove(), 2800);
    }

    // ============================================================
    //  Carregar arquivo
    // ============================================================
    function loadFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        document.getElementById('sourceInput').value = ev.target.result;
        toast('📂 Carregado: ' + file.name);
        parseBlocks();
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    // ============================================================
    //  Parse de blocos baseado em marcadores ═══
    // ============================================================
    function parseBlocks() {
      const text = document.getElementById('sourceInput').value;
      if (!text.trim()) { toast('⚠️ Cole o código primeiro'); return; }

      // Regex para capturar os comentários com muitos ═
      const markerRegex = /\/\*\s*═══════════════════════════════════════════════════════════\s*([\s\S]*?)\s*═══════════════════════════════════════════════════════════\s*\*\//g;
      let match;
      const markers = [];
      while ((match = markerRegex.exec(text)) !== null) {
        markers.push({
          start: match.index,
          end: match.index + match[0].length,
          title: match[1].trim()
        });
      }

      // Se não encontrou marcadores, tratar todo o texto como um bloco
      if (markers.length === 0) {
        blocks = [{
          id: nextId++,
          title: 'Código completo',
          content: text,
          active: true
        }];
        renderBlocks();
        toast('📦 1 bloco detectado (sem marcadores)');
        return;
      }

      const newBlocks = [];
      // Primeiro bloco: do início ao início do primeiro marcador
      if (markers[0].start > 0) {
        const content = text.substring(0, markers[0].start).trim();
        if (content) {
          newBlocks.push({
            id: nextId++,
            title: 'Prólogo',
            content: content,
            active: true
          });
        }
      }

      // Para cada marcador, bloco desde o início do marcador até o início do próximo (ou fim)
      for (let i = 0; i < markers.length; i++) {
        const m = markers[i];
        const start = m.start;
        const end = (i + 1 < markers.length) ? markers[i + 1].start : text.length;
        const content = text.substring(start, end).trim();
        if (content) {
          newBlocks.push({
            id: nextId++,
            title: m.title || `Bloco ${i+1}`,
            content: content,
            active: true
          });
        }
      }

      blocks = newBlocks;
      renderBlocks();
      toast(`🔍 ${blocks.length} blocos detectados`);
    }

    // ============================================================
    //  Renderização dos blocos
    // ============================================================
    function renderBlocks() {
      const container = document.getElementById('blocksContainer');
      if (!blocks.length) {
        container.innerHTML = '<div class="text-muted" style="padding:2rem;text-align:center;">Nenhum bloco — cole o código e clique em "Detectar Blocos"</div>';
        updateStats();
        return;
      }

      let html = '';
      blocks.forEach((b, idx) => {
        const preview = b.content.length > 200 ? b.content.slice(0, 200) + '…' : b.content;
        const lines = b.content.split('\n').length;
        html += `
          <div class="block-card ${b.active ? '' : 'inactive'}" data-id="${b.id}">
            <div class="head">
              <input type="checkbox" ${b.active ? 'checked' : ''} onchange="toggleBlock(${b.id}, this.checked)">
              <span class="title">
                ${b.title}
                <span class="badge">${lines} linhas · ${b.content.length} caracteres</span>
              </span>
              <div class="actions">
                <button onclick="editBlock(${b.id})">✏️ Editar</button>
                <button class="export" onclick="exportBlock(${b.id})">⬇️ Exportar</button>
                <button onclick="splitBlock(${b.id})">✂️ Dividir</button>
                <button onclick="removeBlock(${b.id})">🗑️</button>
              </div>
            </div>
            <div class="preview" onclick="togglePreview(this)">${escapeHtml(preview)}</div>
          </div>
        `;
      });
      container.innerHTML = html;
      updateStats();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function togglePreview(el) {
      el.classList.toggle('expanded');
    }

    function updateStats() {
      const total = blocks.length;
      const active = blocks.filter(b => b.active).length;
      document.getElementById('blockStats').textContent = `${total} blocos · ${active} ativos`;
      // atualizar select all
      const allChecked = blocks.every(b => b.active);
      document.getElementById('selectAll').checked = allChecked && blocks.length > 0;
    }

    // ============================================================
    //  Toggle individual
    // ============================================================
    function toggleBlock(id, checked) {
      const b = blocks.find(block => block.id === id);
      if (b) {
        b.active = checked;
        renderBlocks();
      }
    }

    function toggleAllCheckboxes(checked) {
      blocks.forEach(b => b.active = checked);
      renderBlocks();
    }

    // ============================================================
    //  Remover bloco
    // ============================================================
    function removeBlock(id) {
      if (!confirm('Remover este bloco?')) return;
      blocks = blocks.filter(b => b.id !== id);
      renderBlocks();
      toast('Bloco removido');
    }

    // ============================================================
    //  Editar bloco (modal)
    // ============================================================
    function editBlock(id) {
      const b = blocks.find(block => block.id === id);
      if (!b) return;
      editTargetId = id;
      document.getElementById('editModalTitle').textContent = 'Editar: ' + b.title;
      document.getElementById('editTextarea').value = b.content;
      document.getElementById('editModal').classList.add('active');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('active');
      editTargetId = null;
    }

    function saveEditModal() {
      if (editTargetId === null) return;
      const newContent = document.getElementById('editTextarea').value;
      const b = blocks.find(block => block.id === editTargetId);
      if (b) {
        b.content = newContent;
        renderBlocks();
        toast('✅ Bloco atualizado');
      }
      closeEditModal();
    }

    // ============================================================
    //  Split: dividir bloco em dois com base no marcador ou linha
    // ============================================================
    function splitBlock(id) {
      const b = blocks.find(block => block.id === id);
      if (!b) return;
      // Abrir modal de edição com o conteúdo e um botão especial "Dividir aqui"
      editTargetId = id;
      document.getElementById('editModalTitle').textContent = '✂️ Dividir bloco: ' + b.title;
      document.getElementById('editTextarea').value = b.content;
      document.getElementById('editModal').classList.add('active');
      // Mostrar botão de split no modal (já existe)
      toast('Insira o marcador //---SPLIT--- no local desejado e clique em "Dividir aqui"');
    }

    function splitBlockFromModal() {
      if (editTargetId === null) return;
      const content = document.getElementById('editTextarea').value;
      const marker = '//---SPLIT---';
      const idx = content.indexOf(marker);
      if (idx === -1) {
        toast('⚠️ Não encontrou o marcador ' + marker + ' no texto');
        return;
      }
      const part1 = content.substring(0, idx).trim();
      const part2 = content.substring(idx + marker.length).trim();
      if (!part1 || !part2) {
        toast('⚠️ Ambas as partes devem ter conteúdo');
        return;
      }

      const b = blocks.find(block => block.id === editTargetId);
      if (!b) return;

      // Atualiza o bloco atual com a primeira parte
      b.content = part1;
      // Cria novo bloco com a segunda parte
      blocks.push({
        id: nextId++,
        title: b.title + ' (parte 2)',
        content: part2,
        active: b.active
      });
      renderBlocks();
      closeEditModal();
      toast('✂️ Bloco dividido em dois');
    }

    // ============================================================
    //  Exportar bloco individual
    // ============================================================
    function exportBlock(id) {
      const b = blocks.find(block => block.id === id);
      if (!b) return;
      downloadFile(b.content, `block_${b.title.replace(/[^a-zA-Z0-9]/g,'_')}.js`);
      toast('⬇️ Bloco exportado');
    }

    // ============================================================
    //  Exportar ativos / todos
    // ============================================================
    function exportActive() {
      const active = blocks.filter(b => b.active);
      if (!active.length) { toast('⚠️ Nenhum bloco ativo'); return; }
      const code = active.map(b => b.content).join('\n\n');
      downloadFile(code, 'kobllux_active.js');
      toast('⬇️ ' + active.length + ' blocos ativos exportados');
    }

    function exportAll() {
      if (!blocks.length) { toast('⚠️ Nenhum bloco'); return; }
      const code = blocks.map(b => b.content).join('\n\n');
      downloadFile(code, 'kobllux_full.js');
      toast('⬇️ Todos os blocos exportados');
    }

    function downloadFile(content, filename) {
      const blob = new Blob([content], { type: 'application/javascript' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ============================================================
    //  Agrupar (merge) selecionados
    // ============================================================
    function mergeSelected() {
      const selected = blocks.filter(b => b.active);
      if (selected.length < 2) {
        toast('⚠️ Selecione pelo menos dois blocos ativos para agrupar');
        return;
      }
      // Pega os títulos
      const titles = selected.map(b => b.title).join(' + ');
      const mergedContent = selected.map(b => b.content).join('\n\n// --- merge ---\n\n');
      // Remove os selecionados
      const ids = selected.map(b => b.id);
      blocks = blocks.filter(b => !ids.includes(b.id));
      // Adiciona o bloco agrupado no início
      blocks.unshift({
        id: nextId++,
        title: '🧩 ' + titles,
        content: mergedContent,
        active: true
      });
      renderBlocks();
      toast(`🔗 ${selected.length} blocos agrupados em um`);
    }

    // ============================================================
    //  Limpar tudo
    // ============================================================
    function clearAll() {
      if (!blocks.length && !document.getElementById('sourceInput').value) return;
      if (!confirm('Limpar todos os blocos e o código fonte?')) return;
      blocks = [];
      document.getElementById('sourceInput').value = '';
      renderBlocks();
      toast('🧹 Limpo');
    }

    // ============================================================
    //  Inicialização com exemplo (opcional)
    // ============================================================
    // Se o usuário quiser um exemplo, pode colar o código fornecido.
    // Deixamos em branco.

    // ============================================================
    //  Fechar modal com ESC
    // ============================================================
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (document.getElementById('editModal').classList.contains('active')) {
          closeEditModal();
        }
      }
    });

    // Fechar modal clicando fora
    document.getElementById('editModal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeEditModal();
    });

    // ============================================================
    //  Helper para selecionar todos os checkboxes via label
    // ============================================================
    // já implementado

    // ============================================================
    //  Se houver dados no localStorage, podemos restaurar? (não implementado)
    // ============================================================

    console.log('🧩 KOBLLUX Editor Modular JS carregado');
  </script>
</body>
</html>
