<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KODUX - Hub Uno</title>
    <!-- Google Fonts para tipografia premium -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --glass-bg: rgba(28, 28, 30, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-purple: #8e44ad;
            --accent-blue: #007aff;
            --text-main: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(80, 40, 120, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(40, 60, 150, 0.2) 0px, transparent 50%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- HEADER VISION OS STYLE --- */
        .header-vision {
            width: 100%;
            max-width: 500px;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            padding: 0 5px;
        }

        .nav-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo {
            width: 20px;
            filter: brightness(0) invert(1);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            opacity: 0.8;
        }

        .avatar-vinyl {
            width: 32px;
            height: 32px;
            background: #111;
            border-radius: 50%;
            border: 1px solid #333;
            position: relative;
            background-image: radial-gradient(circle, #333 1px, transparent 1px), radial-gradient(circle, #222 50%, #000 100%);
            background-size: 4px 4px, cover;
            animation: spin 4s linear infinite;
        }

        .avatar-vinyl::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background: #ff3b30;
            border-radius: 50%;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- MAIN CONTENT GRID --- */
        .dashboard {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 120px;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .card:active {
            transform: scale(0.98);
        }

        /* Profile Card Custom */
        .profile-card {
            padding: 30px;
            background: linear-gradient(135deg, rgba(142, 68, 173, 0.2), rgba(41, 128, 185, 0.2));
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
        }

        .vinyl-large {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .profile-info h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .profile-info p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .badge-icloud {
            margin-top: 15px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* List Cards (Drive / Notas) */
        .list-card {
            display: flex;
            flex-direction: column;
        }

        .card-header {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-box {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-title-group h3 {
            font-size: 18px;
        }

        .card-title-group span {
            font-size: 12px;
            color: var(--accent-blue);
        }

        .card-content {
            background: rgba(0,0,0,0.3);
            padding: 10px 0;
        }

        .list-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .item-icon {
            font-size: 20px;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-size: 14px;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 250px;
        }

        .item-meta {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        /* App Grid Component */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 10px 5px;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: white;
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .app-label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* --- FOOTER PERSISTENTE --- */
        .footer-vision {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(40, 40, 45, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 6px;
            display: flex;
            gap: 5px;
            z-index: 1000;
        }

        .footer-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .footer-btn.active {
            background: rgba(255,255,255,0.15);
            color: white;
        }

        .footer-btn-close {
            background: rgba(255,255,255,0.05);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 5px;
        }

        /* Helpers */
        .text-blue { color: var(--accent-blue); }
        .text-purple { color: var(--accent-purple); }

    </style>
</head>
<body>

    <!-- Header Vision Style -->
    <header class="header-vision">
        <div class="status-bar">
            <span>18:12</span>
            <div style="display: flex; gap: 6px; align-items: center;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21l-12-18h24z"/></svg>
                <span>5G</span>
                <div style="width: 25px; height: 12px; border: 1px solid white; border-radius: 3px; position: relative; padding: 1px;">
                    <div style="width: 70%; height: 100%; background: white;"></div>
                </div>
            </div>
        </div>

        <nav class="nav-glass">
            <div class="nav-left">
                <svg class="brand-logo" viewBox="0 0 24 24"><path d="M17.5,19c-3.6,0-6.5-2.9-6.5-6.5s2.9-6.5,6.5-6.5s6.5,2.9,6.5,6.5S21.1,19,17.5,19z M17.5,8c-2.5,0-4.5,2-4.5,4.5 s2,4.5,4.5,4.5s4.5-2,4.5-4.5S20,8,17.5,8z"/></svg>
                <span style="font-weight: 600; font-size: 18px;">iCloud</span>
            </div>
            <div class="nav-right">
                <button class="icon-btn">+</button>
                <button class="icon-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h4v4H4V4zm6 0h4v4h-4V4zm6 0h4v4h-4V4zM4 10h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zM4 16h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4z"/></svg>
                </button>
                <div class="avatar-vinyl"></div>
            </div>
        </nav>
    </header>

    <!-- Main Dashboard -->
    <main class="dashboard">
        
        <!-- Profile Component -->
        <section class="card profile-card">
            <div class="avatar-vinyl vinyl-large"></div>
            <div class="profile-info">
                <h1>Raphael</h1>
                <p>78frames@gmail.com</p>
                <div class="badge-icloud">iCloud+</div>
            </div>
        </section>

        <!-- Drive Component -->
        <section class="card list-card">
            <div class="card-header">
                <div class="icon-box" style="background: #007aff22;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="#007aff"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                </div>
                <div class="card-title-group">
                    <h3>Drive</h3>
                    <span>● Recentes</span>
                </div>
            </div>
            <div class="card-content">
                <div class="list-item">
                    <span class="item-icon">🎵</span>
                    <div class="item-info">
                        <span class="item-name">KDX_LAB_99.39_funky_botsy_v00...</span>
                        <span class="item-meta">MP3</span>
                    </div>
                </div>
                <div class="list-item">
                    <span class="item-icon">📕</span>
                    <div class="item-info">
                        <span class="item-name">FFC Full livro</span>
                        <span class="item-meta">PDF</span>
                    </div>
                </div>
                <div class="list-item" style="border: none;">
                    <span class="item-icon">📄</span>
                    <div class="item-info">
                        <span class="item-name">CheckMate v5.7.3</span>
                        <span class="item-meta">PDF</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Apps Grid Component -->
        <div class="app-grid">
            <a href="#" class="app-item">
                <div class="app-icon" style="background: linear-gradient(to bottom, #5AC8FA, #007AFF);">✉️</div>
                <span class="app-label">Mail</span>
            </a>
            <a href="#" class="app-item">
                <div class="app-icon" style="background: white; color: black;">🌸</div>
                <span class="app-label">Fotos</span>
            </a>
            <a href="#" class="app-item">
                <div class="app-icon" style="background: #1C1C1E;">📁</div>
                <span class="app-label">Drive</span>
            </a>
            <a href="#" class="app-item">
                <div class="app-icon" style="background: #FF9500;">📝</div>
                <span class="app-label">Notas</span>
            </a>
        </div>

        <!-- Progress Component -->
        <section class="card" style="padding: 20px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px;">
                <span>Seu armazenamento</span>
                <span style="color: var(--text-secondary);">1,75 TB / 2 TB</span>
            </div>
            <div style="width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; display: flex;">
                <div style="width: 40%; background: #FFCC00; height: 100%;"></div>
                <div style="width: 30%; background: #AF52DE; height: 100%;"></div>
                <div style="width: 15%; background: #34C759; height: 100%;"></div>
            </div>
        </section>

    </main>

    <!-- Floating Footer -->
    <footer class="footer-vision">
        <button class="footer-btn">Anos</button>
        <button class="footer-btn active">Meses</button>
        <button class="footer-btn">Tudo</button>
        <div class="footer-btn-close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </div>
    </footer>

    <script>
        // Interatividade simples para os botões do footer
        const buttons = document.querySelectorAll('.footer-btn');
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        // Simulação de clique nos cards
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            card.addEventListener('click', () => {
                console.log('Componente ativado:', card.querySelector('h3')?.innerText || 'Perfil');
            });
        });
    </script>
</body>
</html>
