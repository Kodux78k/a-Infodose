<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>KOBLLUX · UNO + DEVOS (Standalone Core)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* ============================================================
   TOKENS & BASE CSS (SEM CDNS DEPENDENTES)
   ============================================================ */
:root{
  --bg-void:#05070a; --bg-panel:#0b0e14; --bg-card:#11151d; --bg-raised:#161b26;
  --line:#232938; --line-soft:#1a1f2b;
  --cyan:#00e5ff; --magenta:#ff2ec4; --amber:#ffb020; --green:#3ddc84; --red:#ff5470;
  --text:#d7dbe4; --text-dim:#7d8496; --text-faint:#4b5266;
  --nav-h:58px; --head-h:52px; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif;
  --r-sm:6px; --r-md:10px; --r-lg:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg-void)}
body{
  font-family:var(--sans);color:var(--text);
  padding:var(--safe-t) 0 var(--safe-b) 0;
  display:flex;flex-direction:column;min-height:100dvh;
  font-size:14px;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   ICON UTILITIES
   ============================================================ */
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle;flex-shrink:0}
.ic-lg{width:20px;height:20px}
.ic-sm{width:13px;height:13px}
.ic-xs{width:11px;height:11px}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
#uno-root{display:flex;flex-direction:column;flex:1;min-height:0;position:relative}

/* Header */
#uno-head{
  height:var(--head-h);flex-shrink:0;display:flex;align-items:center;gap:8px;
  padding:0 10px;background:rgba(11,14,20,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);z-index:40;
}
#uno-head .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);white-space:nowrap}
#uno-head .brand small{color:var(--text-faint);font-weight:500;letter-spacing:.06em;text-transform:none}
#uno-head .ws-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--text-dim);font-family:var(--mono);text-align:center}
#uno-head .head-actions{display:flex;align-items:center;gap:4px}

/* Buttons */
.ibtn{
  width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:transparent;color:var(--text-dim);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s ease;position:relative;flex-shrink:0;
}
.ibtn:active{transform:scale(.92)}
.ibtn:hover{color:var(--text);border-color:#333c50}
.ibtn.on{color:var(--cyan);border-color:var(--cyan);background:rgba(0,229,255,.08)}
.ibtn.danger{color:var(--red)}
.ibtn.danger:hover{border-color:var(--red)}

.btn{flex:1;padding:11px;border-radius:var(--r-sm);border:1px solid var(--line);background:transparent;color:var(--text);font-weight:600;font-size:12.5px;letter-spacing:.03em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
.btn:active{transform:scale(.97)}
.btn.primary{border-color:var(--cyan);color:var(--cyan)}
.btn.primary:hover{background:rgba(0,229,255,.08)}
.btn.warning{border-color:var(--amber);color:var(--amber)}
.btn.warning:hover{background:rgba(255,176,32,.08)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:rgba(255,84,112,.08)}
.btn.ghost{color:var(--text-dim)}
.btn.ghost:hover{color:var(--text);background:var(--bg-card)}

/* Main Layout */
#uno-main{flex:1;min-height:0;display:flex;position:relative;overflow:hidden}
.uno-view{display:none;flex:1;min-height:0;flex-direction:column;overflow:hidden}
.uno-view.active{min-height:100%;display:flex}

/* Navigation */
#uno-nav{
  height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);flex-shrink:0;
  display:flex;background:rgba(11,14,20,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:40;
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-faint);font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  cursor:pointer;transition:color .15s ease;border:none;background:none;font-family:var(--sans);
}
.nav-btn .ic{transition:transform .15s ease}
.nav-btn.active{color:var(--cyan)}
.nav-btn.active .ic{transform:translateY(-2px)}
.nav-btn.active.is-runtime{color:var(--magenta)}

/* Drawer & Modals */
#uno-drawer{
  position:fixed;top:0;left:-320px;width:300px;bottom:0;background:var(--bg-panel);
  border-right:1px solid var(--line);z-index:200;transition:left .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;padding-top:var(--safe-t);
}
#uno-drawer.open{left:0}
#uno-drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);z-index:199;opacity:0;pointer-events:none;transition:opacity .28s}
#uno-drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer-head{padding:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.drawer-head strong{font-size:13px;font-weight:700;color:var(--cyan)}
.drawer-content{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px}

/* ====== ACCORDION GROUPS (DevOS Style) ====== */
.uno-accordion {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  overflow: auto;
  display: flex;
  flex-direction: column;
}
.uno-accordion-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  cursor: pointer;
  background: var(--bg-panel);
  user-select: none;
  transition: background 0.2s;
  border-bottom: 1px solid transparent;
}
.uno-accordion:not(.collapsed) .uno-accordion-head {
  border-bottom-color: var(--line-soft);
}
.uno-accordion-head:hover { background: var(--bg-raised); }
.uno-accordion-head .title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 8px;
}
.uno-accordion-head .chevron {
  color: var(--text-faint);
  transition: transform 0.3s ease;
  transform: rotate(0deg);
}
.uno-accordion.collapsed .chevron {
  transform: rotate(-90deg);
}
.uno-accordion-body {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.uno-accordion.collapsed .uno-accordion-body {
  display: none;
}

/* File Tree inside Accordion */
#uno-tree{display:flex;flex-direction:column;gap:2px}
.tree-node{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;font-size:12px;font-family:var(--mono);color:var(--text-dim);border-radius:var(--r-sm);transition:all .15s}
.tree-node:hover{background:rgba(255,255,255,.03);color:var(--text)}
.tree-node.active{background:rgba(0,229,255,.08);color:var(--cyan)}
.tree-node .ic{color:var(--text-faint);flex-shrink:0}
.tree-node.active .ic{color:var(--cyan)}
.tree-node .del{margin-left:auto;opacity:0;color:var(--text-faint);flex-shrink:0}
.tree-node:hover .del{opacity:1}
.tree-node .del:hover{color:var(--red)}
.tree-empty{padding:20px 10px;text-align:center;color:var(--text-faint);font-size:11px;line-height:1.5}

/* Toast & Modals */
#uno-toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 14px);left:50%;transform:translateX(-50%);background:rgba(17,21,29,.96);border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:999px;font-size:12.5px;z-index:9999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;backdrop-filter:blur(8px);white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis}
#uno-toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

.uno-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);z-index:500;display:none;align-items:flex-end;justify-content:center}
.uno-modal-bg.open{display:flex}
.uno-modal{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--r-lg) var(--r-lg) 0 0;width:100%;max-width:480px;padding:18px 18px calc(18px + var(--safe-b));animation:modal-up .22s ease}
@media(min-width:640px){.uno-modal-bg{align-items:center}.uno-modal{border-radius:var(--r-lg)}}
@keyframes modal-up{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.uno-modal h3{margin:0 0 14px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);display:flex;align-items:center;gap:8px}
.uno-field{margin-bottom:12px}
.uno-field label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:6px}
.uno-field input{width:100%;background:var(--bg-card);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:var(--r-sm);font-family:var(--mono);font-size:13px}
.uno-field input:focus{outline:none;border-color:var(--cyan)}
.uno-modal-actions{display:flex;gap:8px;margin-top:16px}

/* Editor Highlighting (Stand-alone Regex Engine) */
.line-numbers{
  width:44px;flex-shrink:0;background:var(--bg-panel);color:var(--text-faint);
  font-family:var(--mono);font-size:12.5px;line-height:20px;text-align:right;
  padding:12px 8px 12px 0;overflow:hidden;user-select:none;border-right:1px solid var(--line-soft);
}
.line-numbers div{height:20px}
#editor-scroll{background:var(--bg-void)}
#uno-syntax-layer,#uno-editor{
  position:absolute;inset:0;margin:0;padding:12px 14px;
  font-family:var(--mono);font-size:12.5px;line-height:20px;
  white-space:pre;tab-size:2;box-sizing:border-box;
}
#uno-syntax-layer{overflow:hidden;pointer-events:none;color:var(--text)}
#uno-syntax-layer code{white-space:pre;display:block}
#uno-editor{
  background:transparent;color:transparent;caret-color:var(--cyan);
  border:none;outline:none;resize:none;overflow:auto;z-index:1;
}
#uno-editor::selection{background:rgba(0,229,255,.25)}
.tok-comment{color:var(--text-faint);font-style:italic}
.tok-string{color:var(--green)}
.tok-tag{color:var(--cyan)}
.tok-attr{color:var(--amber)}
.tok-keyword{color:var(--magenta)}
.tok-number{color:var(--amber)}
.tok-key{color:var(--cyan)}
.tok-property{color:#7dd3fc}
.tok-atrule{color:var(--magenta)}
.tok-hex{color:var(--amber)}
.tok-punct{color:var(--text-faint)}

/* Runtime Console */
.log-line{padding:4px 0;border-bottom:1px solid var(--line-soft);word-break:break-word}
.log-error{color:var(--red)}.log-warn{color:var(--amber)}.log-sys{color:var(--cyan)}.log-info{color:var(--text-dim)}
.log-time{color:var(--text-faint);margin-right:8px;font-size:10px}

#preview-wrapper.runtime-fullscreen{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;z-index:99999!important;margin:0!important;background:#fff!important}
#btn-exit-full{display:none}
#preview-wrapper.runtime-fullscreen #btn-exit-full{display:flex!important}
</style>
</head>
<body>

<!-- SVG SPRITES (INLINE ZERO CDNS) -->
<svg hidden aria-hidden="true">
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"/></symbol>
  <symbol id="i-folder-open" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2l-1.5 8a2 2 0 0 1-2 1.7H5.3A2 2 0 0 1 3.3 18L3 8z"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 2h9l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><path d="M14 2v6h6"/></symbol>
  <symbol id="i-plus-file" viewBox="0 0 24 24"><path d="M6 2h9l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><path d="M14 2v6h6"/><path d="M9.5 14h5M12 11.5v5"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="m9 8-4 4 4 4M15 8l4 4-4 4"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m5 7 5 5-5 5M13 17h6"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8V4z"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M8 3v6h7V3M8 21v-7h8v7"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v13m0 0-4.5-4.5M12 16l4.5-4.5M4 20h16"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H4v4M16 3h4v4M4 16v4h4M20 16v4h-4"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>

  <symbol id="i-chevron-down" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>
  <symbol id="i-wand" viewBox="0 0 24 24"><path d="M15 4V2"/><path d="M15 16v-2"/><path d="M8 9h2"/><path d="M20 9h2"/><path d="M17.8 11.8l1.4 1.4"/><path d="M17.8 6.2l1.4-1.4"/><path d="M12.2 6.2l-1.4-1.4"/><path d="M12.2 11.8l-1.4 1.4"/><path d="M2 22l9-9"/></symbol>
  <symbol id="i-clean" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></symbol>
</svg>

<div id="uno-root">
  <!-- HEADER -->
  <header id="uno-head">
    <button class="ibtn" id="btn-drawer" onclick="App.toggleDrawer()"><svg class="ic"><use href="#i-menu"/></svg></button>
    <div class="brand"><svg class="ic" style="color:var(--magenta)"><use href="#i-orb"/></svg>UNO <small>/ KODUX</small></div>
    <div class="ws-name" id="ws-name">carregando…</div>
    <div class="head-actions">
      <button class="ibtn" onclick="App.saveActive(true)"><svg class="ic"><use href="#i-save"/></svg></button>
      <button class="ibtn" onclick="App.exportProject()"><svg class="ic"><use href="#i-download"/></svg></button>
      <button class="ibtn on" onclick="App.refreshPreview()"><svg class="ic"><use href="#i-play"/></svg></button>
    </div>
  </header>

  <!-- MAIN VIEWPORT -->
  <main id="uno-main">
    <!-- EDITOR -->
    <section class="uno-view active" id="view-editor">
      <div id="editor-tabbar" style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg-panel)">
        <svg class="ic-sm ic" id="editor-file-icon"><use href="#i-file"/></svg>
        <span id="editor-file-name" style="font-family:var(--mono);font-size:12px;color:var(--text-dim);flex:1">nenhum arquivo</span>
        <span id="editor-dirty-dot" style="width:6px;height:6px;border-radius:50%;background:var(--amber);display:none"></span>
        <button class="ibtn" style="width:28px;height:28px" onclick="UnoEditor.execCommand('find')"><svg class="ic-sm ic"><use href="#i-search"/></svg></button>
      </div>
      <div class="editor-shell" id="editor-shell" style="flex:1;position:relative;display:flex;overflow:hidden">
        <div class="line-numbers" id="uno-linenums"></div>
        <div id="editor-scroll" style="flex:1;position:relative;overflow:hidden">
          <pre id="uno-syntax-layer"><code id="uno-syntax-code"></code></pre>
          <textarea id="uno-editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
        </div>
      </div>
    </section>

    <!-- PREVIEW -->
    <section class="uno-view" id="view-preview">
      <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg-panel)">
        <span style="font-family:var(--mono);font-size:11px;color:var(--text-dim);flex:1">index.html · runtime local</span>
        <button class="ibtn" style="width:28px;height:28px" onclick="App.refreshPreview()"><svg class="ic-sm ic"><use href="#i-refresh"/></svg></button>
        <button class="ibtn" style="width:28px;height:28px" id="btn-full-preview" onclick="App.toggleFullscreenPreview()"><svg class="ic-sm ic"><use href="#i-expand"/></svg></button>
      </div>
      <div id="preview-wrapper" style="flex:1;background:#fff;position:relative">
        <button id="btn-exit-full" class="ibtn" onclick="App.exitFullscreenPreview()" style="position:absolute;top:14px;right:14px;z-index:999999;width:42px;height:42px;border-radius:12px;background:rgba(5,7,10,.82);color:#00e5ff;border:1px solid rgba(0,229,255,.45);backdrop-filter:blur(12px)">
          <svg class="ic"><use href="#i-x"/></svg>
        </button>
        <iframe id="uno-frame" sandbox="allow-scripts allow-same-origin allow-modals allow-forms" style="width:100%;height:100%;border:none"></iframe>
      </div>
    </section>

    <!-- CONSOLE -->
    <section class="uno-view" id="view-inspector">
      <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg-panel)">
        <span style="font-family:var(--mono);font-size:11px;color:var(--text-dim);flex:1">console output</span>
        <button class="ibtn" style="width:28px;height:28px" onclick="document.getElementById('uno-logs').innerHTML=''"><svg class="ic-sm ic"><use href="#i-trash"/></svg></button>
      </div>
      <div id="uno-logs" style="flex:1;overflow-y:auto;padding:10px 14px;font-family:var(--mono);font-size:11.5px;line-height:1.7"></div>
    </section>
  </main>

  <!-- BOTTOM NAV -->
  <nav id="uno-nav">
    <button class="nav-btn active" data-view="editor" onclick="App.switchView('editor',this)"><svg class="ic"><use href="#i-code"/></svg>Editor</button>
    <button class="nav-btn is-runtime" data-view="preview" onclick="App.switchView('preview',this)"><svg class="ic"><use href="#i-eye"/></svg>Preview</button>
    <button class="nav-btn" data-view="inspector" onclick="App.switchView('inspector',this)"><svg class="ic"><use href="#i-terminal"/></svg>Console</button>
  </nav>
</div>

<!-- ============================================================
     DRAWER COM ACCORDIONS ESTILO DEVOS (SEM TAILWIND)
     ============================================================ -->
<div id="uno-drawer-overlay" onclick="App.toggleDrawer()"></div>
<aside id="uno-drawer">
  <div class="drawer-head">
    <strong>MENU SISTEMA</strong>
    <button class="ibtn" style="width:28px;height:28px" onclick="App.toggleDrawer()"><svg class="ic-sm ic"><use href="#i-x"/></svg></button>
  </div>
  
  <div class="drawer-content">

    <!-- ACCORDION: AÇÕES & UPLOAD -->
    <div class="uno-accordion">
      <div class="uno-accordion-head" onclick="this.parentElement.classList.toggle('collapsed')">
        <span class="title">
          <svg class="ic"><use href="#i-orb"/></svg> Ações & Upload
        </span>
        <svg class="ic chevron"><use href="#i-chevron-down"/></svg>
      </div>
      <div class="uno-accordion-body">
        
        <!-- Input de Múltiplos Arquivos/Pasta -->

<!-- MODAIS -->
<div class="uno-modal-bg" id="modal-new-file">
  <div class="uno-modal">
    <h3><svg class="ic"><use href="#i-plus-file"/></svg>Novo arquivo</h3>
    <div class="uno-field">

      <button class="btn primary" onclick="App.confirmNewFile()">Criar</button>

<div class="uno-modal-bg" id="modal-reset">
  <div class="uno-modal">
    <h3 style="color:var(--red)"><svg class="ic"><use href="#i-trash"/></svg>Limpar workspace</h3>
    <p style="font-size:12.5px;color:var(--text-dim);line-height:1.6">Isso removerá os arquivos em cache no IndexedDB.</p>
    <div class="uno-modal-actions">
      <button class="btn ghost" onclick="App.closeModal('reset')">Cancelar</button>
      <button class="btn primary" style="border-color:var(--red);color:var(--red)" onclick="App.confirmReset()">Apagar tudo</button>
    </div>
  </div>

<div id="uno-toast"></div>

<script>
'use strict';

/* ============================================================
   STORAGE ENGINE (INDEXEDDB NATIVO) - ZERO DEPENDÊNCIAS
   ============================================================ */
const IDB = {
  _db: null,
  DB_NAME: 'kobllux_uno_standalone', DB_VERSION: 1, STORE_FILES: 'files', STORE_META: 'meta',

  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.DB_NAME, this.DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(this.STORE_FILES)) db.createObjectStore(this.STORE_FILES, { keyPath: 'path' });
        if (!db.objectStoreNames.contains(this.STORE_META)) db.createObjectStore(this.STORE_META, { keyPath: 'key' });
      };
      req.onsuccess = (e) => { this._db = e.target.result; resolve(this._db); };
      req.onerror = (e) => reject(e.target.error);
    });
  },
  async tx(storeName, mode) {
    const db = await this.open();
    return db.transaction(storeName, mode).objectStore(storeName);
  },
  async put(storeName, value) {
    const store = await this.tx(storeName, 'readwrite');
    return new Promise((res, rej) => { const r = store.put(value); r.onsuccess = () => res(value); r.onerror = () => rej(r.error); });
  },
  async get(storeName, key) {
    const store = await this.tx(storeName, 'readonly');
    return new Promise((res, rej) => { const r = store.get(key); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); });
  },
  async delete(storeName, key) {
    const store = await this.tx(storeName, 'readwrite');
    return new Promise((res, rej) => { const r = store.delete(key); r.onsuccess = () => res(true); r.onerror = () => rej(r.error); });
  },
  async getAll(storeName) {
    const store = await this.tx(storeName, 'readonly');
    return new Promise((res, rej) => { const r = store.getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); });
  },
  async clear(storeName) {
    const store = await this.tx(storeName, 'readwrite');
    return new Promise((res, rej) => { const r = store.clear(); r.onsuccess = () => res(true); r.onerror = () => rej(r.error); });
  }
};

const DEFAULT_PROJECT = {
  'index.html': `<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n<meta charset="utf-8">\n<title>Standalone App</title>\n<link rel="stylesheet" href="style.css">\n</head>\n<body>\n<div id="app">\n  <h1>UNO + KODUX Ready</h1>\n  <p>Ambiente local unificado sem dependências de CDNs externas.</p>\n</div>\n<script src="app.js"><\/script>\n</body>\n</html>\n`,
  'style.css': `body{\n  margin:0;\n  min-height:100vh;\n  display:flex;\n  align-items:center;\n  justify-content:center;\n  background:#05070a;\n  color:#d7dbe4;\n  font-family:sans-serif;\n}\n#app{ text-align:center; }\nh1{ color:#00e5ff; }\n`,
  'app.js': `console.log('Ambiente operando nativamente');\n`
};

const UNO = {
  supportsFS: 'showDirectoryPicker' in window,

  async init() {
    await IDB.open();
    const all = await IDB.getAll(IDB.STORE_FILES);
    if (all.length === 0) {
      for (const path in DEFAULT_PROJECT) {
        await IDB.put(IDB.STORE_FILES, { path, content: DEFAULT_PROJECT[path], updatedAt: Date.now() });
      }
      await IDB.put(IDB.STORE_META, { key: 'workspaceName', value: 'Projeto-Local' });
    }
  },

  async getWorkspaceName() {
    const m = await IDB.get(IDB.STORE_META, 'workspaceName');
    return (m && m.value) || 'Projeto-Local';
  },
  async setWorkspaceName(name) {
    await IDB.put(IDB.STORE_META, { key: 'workspaceName', value: name });
  },

  async list() {
    const all = await IDB.getAll(IDB.STORE_FILES);
    return all.map(f => f.path).sort();
  },

  async readFile(path) {
    const rec = await IDB.get(IDB.STORE_FILES, path);
    return rec ? rec.content : null;
  },

  async writeFile(path, content) {
    await IDB.put(IDB.STORE_FILES, { path, content, updatedAt: Date.now() });
    return true;
  },

  async createFile(path, content = '') {
    await IDB.put(IDB.STORE_FILES, { path, content, updatedAt: Date.now() });
    return true;
  },

  async delete(path) {
    await IDB.delete(IDB.STORE_FILES, path);
    return true;
  },

  async clearAll() {
    await IDB.clear(IDB.STORE_FILES);
  },

  async getAllFiles() {
    const all = await IDB.getAll(IDB.STORE_FILES);
    const map = {};
    all.forEach(f => map[f.path] = f.content);
    return map;
  },

  /* ============================================================
     EXPORTAÇÃO / DOWNLOAD DE ARQUIVOS (Extensão real mantida)
     ============================================================ */
  async exportProject() {
    const files = await this.getAllFiles();
    const paths = Object.keys(files);

    const getMIMEType = (filePath) => {
      const ext = filePath.split('.').pop().toLowerCase();
      switch (ext) {
        case 'html': case 'htm': return 'text/html';
        case 'css': return 'text/css';
        case 'js': case 'mjs': return 'text/javascript';
        case 'json': return 'application/json';
        case 'svg': return 'image/svg+xml';
        default: return 'text/plain';
      }
    };

    for (const path of paths) {
      const mime = getMIMEType(path);
      const blob = new Blob([files[path]], { type: `${mime};charset=utf-8` });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = path.replace(/\//g, '__');
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      await new Promise(r => setTimeout(r, 150));
    }
    return { mode: 'download', count: paths.length };
  }
};

/* ============================================================
   REGEX SYNTAX HIGHLIGHTER (NATIVO UNO)
   ============================================================ */
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function buildTokenizer(specs) {
  const pattern = specs.map(s => '(' + s.re.source + ')').join('|');
  const master = new RegExp(pattern, 'g');
  return function (text) {
    let out = '', last = 0, m;
    master.lastIndex = 0;
    while ((m = master.exec(text))) {
      if (m.index > last) out += escapeHtml(text.slice(last, m.index));
      for (let i = 0; i < specs.length; i++) {
        if (m[i + 1] !== undefined) {
          out += '<span class="' + specs[i].cls + '">' + escapeHtml(m[i + 1]) + '</span>';
          break;
        }
      }
      last = master.lastIndex;
      if (m[0] === '') master.lastIndex++;
    }
    if (last < text.length) out += escapeHtml(text.slice(last));
    return out;
  };
}

const TOKENIZERS = {
  html: buildTokenizer([
    { re: /<!--[\s\S]*?-->/, cls: 'tok-comment' },
    { re: /<!DOCTYPE[^>]*>/i, cls: 'tok-keyword' },
    { re: /"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'/, cls: 'tok-string' },
    { re: /<\/?[a-zA-Z][\w:-]*/, cls: 'tok-tag' },
    { re: /[\w-]+(?==)/, cls: 'tok-attr' },
    { re: /\/?>/, cls: 'tok-tag' }
  ]),
  css: buildTokenizer([
    { re: /\/\*[\s\S]*?\*\//, cls: 'tok-comment' },
    { re: /"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'/, cls: 'tok-string' },
    { re: /@[a-zA-Z-]+/, cls: 'tok-atrule' },
    { re: /#[0-9a-fA-F]{3,8}\b/, cls: 'tok-hex' },
    { re: /[a-zA-Z-]+(?=\s*:)/, cls: 'tok-property' },
    { re: /-?\b\d+\.?\d*(px|em|rem|%|vh|vw|s|ms|deg|fr)?\b/, cls: 'tok-number' }
  ]),
  js: buildTokenizer([
    { re: /\/\/.*$|\/\*[\s\S]*?\*\//m, cls: 'tok-comment' },
    { re: /`(?:[^`\\]|\\.)*`|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'/, cls: 'tok-string' },
    { re: /\b(const|let|var|function|return|if|else|for|while|switch|case|break|continue|class|new|this|async|await|import|export|default|null|undefined|true|false)\b/, cls: 'tok-keyword' },
    { re: /\b\d+\.?\d*\b/, cls: 'tok-number' }
  ]),
  txt: buildTokenizer([])
};

function langForPath(path) {
  const ext = (path.split('.').pop() || '').toLowerCase();
  if (ext === 'html' || ext === 'htm') return 'html';
  if (ext === 'css') return 'css';
  if (ext === 'js' || ext === 'mjs') return 'js';
  return 'txt';
}

const UnoEditor = {
  ta: null, syntax: null, lineNums: null, lang: 'html',

  init() {
    this.ta = document.getElementById('uno-editor');
    this.syntax = document.getElementById('uno-syntax-code');
    this.lineNums = document.getElementById('uno-linenums');

    this.ta.addEventListener('input', () => {
      this._highlightNow();
      App.markDirty();
    });
    this.ta.addEventListener('scroll', () => this._syncScroll());
  },

  setLanguage(lang) { this.lang = TOKENIZERS[lang] ? lang : 'txt'; },
  getValue() { return this.ta.value; },
  setValue(v) {
    this.ta.value = v;
    this._highlightNow();
  },

  execCommand(cmd) {
    if (cmd === 'find') {
      const term = prompt('Buscar no arquivo:');
      if (!term) return;
      const idx = this.ta.value.indexOf(term);
      if (idx >= 0) {
        this.ta.focus();
        this.ta.selectionStart = idx;
        this.ta.selectionEnd = idx + term.length;
      } else {
        App.toast('Texto não encontrado.');
      }
    }
  },

  _highlightNow() {
    const tokenize = TOKENIZERS[this.lang] || TOKENIZERS.txt;
    this.syntax.innerHTML = tokenize(this.ta.value) + '\n';
    const lines = this.ta.value.split('\n').length;
    let html = '';
    for (let i = 1; i <= lines; i++) html += '<div>' + i + '</div>';
    this.lineNums.innerHTML = html;
  },

  _syncScroll() {
    this.syntax.parentElement.scrollTop = this.ta.scrollTop;
    this.syntax.parentElement.scrollLeft = this.ta.scrollLeft;
    this.lineNums.scrollTop = this.ta.scrollTop;
  }
};

/* ============================================================
   RENDERER & BUNDLER LOCAL (SEM CARREGAMENTO REMOTO/CDN)
   ============================================================ */
const BridgeScript = `
<script id="kobllux-uno-bridge">
(function(){
  const post = (msg) => window.parent.postMessage(Object.assign({ __uno: true }, msg), '*');
  ['log','warn','error','info'].forEach((level) => {
    const orig = console[level];
    console[level] = function(...args){
      try { post({ type:'LOG', level, data: args.join(' ') }); } catch(e){}
      orig.apply(console, args);
    };
  });
})();
<\/script>
`;

const Renderer = {
  async render(files, entryPath = 'index.html') {
    let html = files[entryPath] || '';
    if (!html) return '<h3>index.html não encontrado</h3>';

    // Inlina CSS Local
    html = html.replace(/<link[^>]+href=["']([^"']+)["'][^>]*>/gi, (match, href) => {
      if (files[href] !== undefined) return `<style>\n${files[href]}\n</style>`;
      return match;
    });

    // Inlina JS Local
    html = html.replace(/<script[^>]+src=["']([^"']+)["'][^>]*><\/script>/gi, (match, src) => {
      if (files[src] !== undefined) return `<script>\n${files[src]}\n<\/script>`;
      return match;
    });

    return BridgeScript + html;
  }
};

/* ============================================================
   APP ORCHESTRATOR & AÇÕES EXCLUSIVAS DEVOS
   ============================================================ */
const App = {
  activePath: null, dirty: false,

  async init() {
    await UNO.init();
    UnoEditor.init();
    document.getElementById('ws-name').textContent = await UNO.getWorkspaceName();

    window.addEventListener('message', (e) => {
      if (e.data && e.data.__uno && e.data.type === 'LOG') {
        const logs = document.getElementById('uno-logs');
        const div = document.createElement('div');
        div.className = 'log-line log-' + e.data.level;
        div.innerHTML = `<span class="log-time">[${new Date().toLocaleTimeString()}]</span>${escapeHtml(e.data.data)}`;
        logs.appendChild(div);
      }
    });

    await this.renderTree();
    const paths = await UNO.list();
    if (paths.includes('index.html')) await this.openFile('index.html');
  },

  toast(msg) {
    const t = document.getElementById('uno-toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  },

  switchView(name, el) {
    document.querySelectorAll('.uno-view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + name).classList.add('active');
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    if (name === 'preview') this.refreshPreview();
  },

  toggleDrawer() {
    document.getElementById('uno-drawer').classList.toggle('open');
    document.getElementById('uno-drawer-overlay').classList.toggle('open');
  },

  markDirty() {
    this.dirty = true;
    document.getElementById('editor-dirty-dot').style.display = 'block';
  },

  /* RENDERIZAÇÃO ESTILO SNAPSHOT (No Accordion) */
  async renderTree() {
    const paths = await UNO.list();
    const tree = document.getElementById('uno-tree');
    if (!paths.length) {
      tree.innerHTML = '<div class="tree-empty">Workspace vazio</div>';
      return;
    }
    tree.innerHTML = paths.map(p => `
      <div class="tree-node ${p === this.activePath ? 'active' : ''}" onclick="App.openFile('${p}')">
        <svg class="ic"><use href="#i-file"/></svg>
        <span style="flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">${p}</span>
        <svg class="ic ic-xs del" onclick="event.stopPropagation();App.deleteFile('${p}')"><use href="#i-x"/></svg>
      </div>
    `).join('');
  },

  async openFile(path) {
    if (this.activePath && this.dirty) await this.saveActive(false);
    this.activePath = path;
    const content = await UNO.readFile(path);
    UnoEditor.setLanguage(langForPath(path));
    UnoEditor.setValue(content || '');
    document.getElementById('editor-file-name').textContent = path;
    document.getElementById('editor-dirty-dot').style.display = 'none';
    this.dirty = false;
    this.renderTree();
    if(window.innerWidth < 768) this.toggleDrawer();
  },

  async saveActive(showToast = true) {
    if (!this.activePath) return;
    await UNO.writeFile(this.activePath, UnoEditor.getValue());
    this.dirty = false;
    document.getElementById('editor-dirty-dot').style.display = 'none';
    if (showToast) this.toast('💾 Arquivo salvo com sucesso!');
  },

  async deleteFile(path) {
    await UNO.delete(path);
    if (this.activePath === path) this.activePath = null;
    await this.renderTree();
  },

  openModal(id) { document.getElementById('modal-' + id).classList.add('open'); },
  closeModal(id) { document.getElementById('modal-' + id).classList.remove('open'); },

  async confirmNewFile() {
    const path = document.getElementById('input-new-path').value.trim();
    if (path) {
      await UNO.createFile(path, '');
      this.closeModal('new-file');
      await this.openFile(path);
    }
  },

  async confirmReset() {
    await UNO.clearAll();
    await UNO.init();
    this.closeModal('reset');
    await this.renderTree();
  },

  /* ============================================================
     AÇÕES DE CONVERSÃO / LIMPEZA DEVOS
     ============================================================ */
  quickClean() {
    if (!this.activePath || !this.activePath.endsWith('.html')) return this.toast('Abra um arquivo HTML para limpar.');
    const code = UnoEditor.getValue();
    const parser = new DOMParser();
    const doc = parser.parseFromString(code, 'text/html');
    const seen = new Set();
    let rem = 0;
    
    doc.querySelectorAll('link[rel="stylesheet"], script[src]').forEach(el => {
      const attr = el.tagName === 'LINK' ? el.getAttribute('href') : el.getAttribute('src');
      if (attr) {
        if (seen.has(attr)) { el.remove(); rem++; }
        else seen.add(attr);
      }
    });

    if (rem > 0) {
      UnoEditor.setValue('<!DOCTYPE html>\n' + doc.documentElement.outerHTML);
      this.toast(`🔥 ${rem} referências duplicadas removidas!`);
      this.markDirty();
    } else {
      this.toast('✨ O código já está limpo.');
    }
    this.toggleDrawer();
  },

  refactorHTML() {
    if (!this.activePath || !this.activePath.endsWith('.html')) return this.toast('Abra um HTML para refatorar.');
    const code = UnoEditor.getValue();
    const parser = new DOMParser();
    const doc = parser.parseFromString(code, 'text/html');
    const head = doc.querySelector('head');
    
    if (head) {
      doc.querySelectorAll('style').forEach(el => head.appendChild(el));
    }
    
    UnoEditor.setValue('<!DOCTYPE html>\n' + doc.documentElement.outerHTML);
    this.toast('🚀 Estilos movidos para o Head. Refatoração concluída!');
    this.markDirty();
    this.toggleDrawer();
  },

  /* Importar Pasta ou Múltiplos Arquivos Sem Travar */
  async handleNexusFolderUpload(event) {
    const files = Array.from(event.target.files || []);
    if (!files.length) return;

    this.toast('Carregando arquivos (Nexus Upload)...');
    let imported = 0;
    for (const file of files) {
      const path = file.webkitRelativePath ? file.webkitRelativePath.split('/').slice(1).join('/') : file.name;
      if (path && /\.(html|htm|css|js|mjs|json|svg|txt|md)$/i.test(path)) {
        const text = await file.text();
        await UNO.writeFile(path, text);
        imported++;
      }
    }
    await this.renderTree();
    const paths = await UNO.list();
    if (paths.length) await this.openFile(paths[0]);
    
    event.target.value = ''; // Reset input
    this.toggleDrawer();
    this.toast(`✅ ${imported} arquivos importados com sucesso!`);
  },

  async refreshPreview() {
    if (this.activePath) await this.saveActive(false);
    const files = await UNO.getAllFiles();
    const html = await Renderer.render(files, 'index.html');
    document.getElementById('uno-frame').srcdoc = html;
  },

  async exportProject() {
    this.toggleDrawer();
    this.toast('Baixando arquivos com extensão correta...');
    await UNO.exportProject();
  },

  toggleFullscreenPreview() {
    document.getElementById('preview-wrapper').classList.toggle('runtime-fullscreen');
  },
  exitFullscreenPreview() {
    document.getElementById('preview-wrapper').classList.remove('runtime-fullscreen');
  }
};

window.addEventListener('DOMContentLoaded', () => App.init());
</script>
