<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="utf-8">
    <title>KOBLLUX Architect // JS Modular Engine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-main: #05070a;
            --bg-card: #0b0f17;
            --bg-input: #111823;
            --border-color: rgba(0, 240, 255, 0.15);
            --border-glow: rgba(0, 240, 255, 0.3);
            --neon-cyan: #00f0ff;
            --neon-purple: #bd00ff;
            --neon-green: #39ff14;
            --neon-amber: #ffaa00;
            --neon-red: #ff3b30;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --header-h: 65px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            overflow-x: hidden;
            background-image: linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Ambient Glows */
        .glow-orb {
            position: fixed; top: -100px; right: -100px;
            width: 400px; height: 400px; border-radius: 50%;
            background: radial-gradient(circle, rgba(189, 0, 255, 0.05) 0%, transparent 70%);
            pointer-events: none; z-index: -1;
        }
        .glow-orb-2 {
            position: fixed; bottom: -150px; left: -150px;
            width: 500px; height: 500px; border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.04) 0%, transparent 70%);
            pointer-events: none; z-index: -1;
        }

        /* Header */
        header {
            background: rgba(11, 15, 23, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 0 25px;
            height: var(--header-h);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .brand-logo { font-weight: 800; font-size: 1.3rem; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0, 240, 255, 0.5); }
        .brand-logo span { color: var(--neon-cyan); }
        .system-status {
            background: rgba(0, 240, 255, 0.07); border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan); padding: 4px 10px; border-radius: 4px;
            font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; text-transform: uppercase;
        }

        /* Layout */
        .container { padding: 25px; display: flex; flex-direction: column; gap: 20px; max-width: 1400px; margin: 0 auto; width: 100%; }

        /* Toolbar */
        .toolbar {
            display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
            background: var(--bg-card); padding: 15px; border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .btn {
            background: var(--bg-input); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main); padding: 8px 16px; border-radius: 6px;
            font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 0.8rem;
            cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px;
        }
        .btn:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.3); }
        .btn-primary { background: rgba(0, 240, 255, 0.1); border-color: var(--neon-cyan); color: var(--neon-cyan); }
        .btn-primary:hover { background: rgba(0, 240, 255, 0.2); box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); }
        .btn-export { background: linear-gradient(135deg, var(--neon-purple) 0%, #7000ff 100%); color: #fff; border: none; }
        .btn-export:hover { box-shadow: 0 0 15px rgba(189, 0, 255, 0.5); transform: translateY(-1px); }
        .toolbar-sep { width: 1px; height: 24px; background: rgba(255,255,255,0.1); margin: 0 5px; }

        /* Input Area */
        .source-panel {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px;
            display: flex; flex-direction: column; overflow: hidden; transition: 0.3s;
        }
        .source-panel.collapsed .source-editor { display: none; }
        .panel-header {
            padding: 12px 20px; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .panel-title { font-weight: 800; font-size: 0.9rem; text-transform: uppercase; display: flex; align-items: center; gap: 8px; color: var(--neon-cyan); }
        textarea.source-editor {
            width: 100%; height: 250px; background: var(--bg-input); border: none;
            padding: 15px; color: #a7f3d0; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
            resize: vertical; outline: none;
        }

        /* Blocks Grid */
        .blocks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .block-card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px;
            padding: 20px; display: flex; flex-direction: column; gap: 12px; transition: 0.3s; position: relative;
        }
        .block-card:hover { border-color: var(--border-glow); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .block-card.inactive { opacity: 0.6; border-color: rgba(255,255,255,0.05); filter: grayscale(0.5); }
        
        .block-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .block-title { font-weight: 700; font-size: 1rem; color: #fff; word-break: break-all; }
        .block-stats { font-size: 0.7rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; margin-top: 4px; }
        
        /* Switch (DashMark style) */
        .switch { position: relative; display: inline-block; width: 38px; height: 20px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #1e293b; transition: .3s; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: var(--text-muted); transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: rgba(0, 240, 255, 0.15); border-color: var(--neon-cyan); }
        input:checked + .slider:before { transform: translateX(18px); background-color: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan); }

        .block-preview {
            background: var(--bg-input); padding: 10px; border-radius: 4px;
            font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-muted);
            max-height: 80px; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
            border-left: 2px solid var(--neon-purple);
        }
        .block-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
        .btn-icon {
            background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted);
            padding: 6px 10px; border-radius: 4px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 5px; font-size: 0.75rem;
        }
        .btn-icon:hover { background: rgba(255,255,255,0.05); color: #fff; border-color: var(--neon-cyan); }

        /* Modal Editor */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: var(--bg-card); border: 1px solid var(--neon-cyan); border-radius: 8px;
            width: 100%; max-width: 900px; max-height: 90vh; display: flex; flex-direction: column;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
        }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; flex: 1; display: flex; flex-direction: column; min-height: 400px; }
        .modal-textarea {
            flex: 1; background: var(--bg-input); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
            padding: 15px; color: #e2e8f0; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; outline: none; resize: none;
        }
        .modal-textarea:focus { border-color: var(--neon-purple); box-shadow: inset 0 0 10px rgba(189,0,255,0.1); }
        .modal-footer { padding: 15px 20px; border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: flex-end; gap: 10px; }

        /* Toast */
        .toast {
            position: fixed; bottom: 25px; right: 25px; background: var(--bg-card); border: 1px solid var(--neon-green);
            color: #fff; padding: 12px 20px; border-radius: 6px; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateY(100px); opacity: 0; transition: all 0.3s; z-index: 2000;
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-cyan); }

        @media (max-width: 768px) {
            .blocks-grid { grid-template-columns: 1fr; }
            .toolbar { justify-content: center; }
            header { padding: 0 15px; }
        }
    </style>
</head>
<body>

    <div class="glow-orb"></div>
    <div class="glow-orb-2"></div>

    <header>
        <div class="brand-logo">KOBLLUX <span>ARCHITECT</span></div>
        <div class="system-status">JS Module Engine // Ativo</div>
    </header>

    <div class="container">
        <!-- Toolbar -->
        <div class="toolbar">
            <button class="btn" onclick="document.getElementById('fileInput').click()">
                <i data-lucide="folder-open"></i> Carregar .js
            </button>
            <input type="file" id="fileInput" accept=".js,.txt" style="display: none;" onchange="loadFile(event)">
            
            <button class="btn btn-primary" onclick="parseBlocks()">
                <i data-lucide="cpu"></i> Detetar Módulos
            </button>
            
            <div class="toolbar-sep"></div>
            
            <label style="display: flex; align-items: center; gap: 8px; font-size: 0.8rem; cursor: pointer;">
                <input type="checkbox" id="selectAll" onchange="toggleAllCheckboxes(this.checked)" checked style="accent-color: var(--neon-cyan);"> 
                Selecionar Todos
            </label>
            
            <button class="btn" onclick="mergeSelected()">
                <i data-lucide="link"></i> Agrupar
            </button>
            
            <div class="toolbar-sep"></div>
            
            <button class="btn" onclick="exportActiveJS()">
                <i data-lucide="download"></i> Exportar JS
            </button>
            <button class="btn btn-export" onclick="exportRuntimeApp()">
                <i data-lucide="zap"></i> Exportar Runtime App (HTML+JS)
            </button>
            
            <div style="margin-left: auto; font-size: 0.8rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace;" id="blockStats">
                0 Módulos
            </div>
        </div>

        <!-- Input Source -->
        <div class="source-panel" id="sourcePanel">
            <div class="panel-header" onclick="toggleSourcePanel()">
                <div class="panel-title"><i data-lucide="code-2"></i> Source Code Master</div>
                <i data-lucide="chevron-up" id="sourceChevron"></i>
            </div>
            <textarea id="sourceInput" class="source-editor" spellcheck="false" placeholder="Cola aqui o teu código JS ou HTML com Scripts..."></textarea>
        </div>

        <!-- Blocks Grid -->
        <div class="blocks-grid" id="blocksContainer">
            <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted); border: 1px dashed rgba(255,255,255,0.1); border-radius: 8px;">
                <i data-lucide="boxes" style="width: 48px; height: 48px; opacity: 0.5; margin-bottom: 15px;"></i>
                <p>Nenhum módulo processado. Cola o teu código acima e clica em "Detetar Módulos".</p>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 style="color: #fff; font-weight: 600; display: flex; align-items: center; gap: 10px;">
                    <i data-lucide="edit-3" style="color: var(--neon-cyan)"></i>
                    <span id="editModalTitle">Editar Módulo</span>
                </h3>
                <button class="btn-icon" onclick="closeEditModal()"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 10px;">
                    Dica: Insere <code style="color:var(--neon-purple)">//---SPLIT---</code> no local onde desejas cortar e clica em "Dividir Módulo".
                </p>
                <textarea id="editTextarea" class="modal-textarea" spellcheck="false"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeEditModal()">Cancelar</button>
                <button class="btn" style="color: var(--neon-amber); border-color: rgba(255,170,0,0.3);" onclick="splitBlockFromModal()">
                    <i data-lucide="scissors"></i> Dividir Módulo
                </button>
                <button class="btn btn-primary" onclick="saveEditModal()">
                    <i data-lucide="save"></i> Guardar Alterações
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i data-lucide="check-circle"></i>
        <span id="toast-msg">Sucesso!</span>
    </div>

    <script>
        // Configuração Inicial de Exemplo (O "Instagram do Funguei" / Hub)
        const sampleCode = `// ==== [Core: Registry] ====
const App = {
    modules: [],
    register(mod) {
        this.modules.push(mod);
        console.log(\`Módulo [\${mod.name}] registado com sucesso.\`);
    },
    init() {
        this.modules.forEach(m => {
            if(m.active !== false && m.onLoad) m.onLoad();
        });
    }
};

// ==== [Module: Media Hub Tab] ====
App.register({
    name: "MediaHub",
    description: "Instagram do Funguei - Player Integrado",
    active: true,
    onLoad() {
        const hubHtml = \`
            <div class="media-hub-grid">
                <div class="hub-tab active" data-target="yt">YouTube Picks</div>
                <div class="hub-tab" data-target="sc">SoundCloud Vibes</div>
                <div class="hub-tab" data-target="git">Git Gallery</div>
            </div>
            <div class="player-controls">
                <button class="play-btn">▶ Play All</button>
            </div>
        \`;
        document.getElementById('app-root').innerHTML = hubHtml;
        this.bindEvents();
    },
    bindEvents() {
        // Lógica de excepção para tocar sem precisar abrir link externo
        console.log("Player de média inicializado e a interceptar links.");
    }
});

// ==== [Module: Calendário Desportivo] ====
App.register({
    name: "SportsCal",
    active: false, // Pode ser ativado via painel
    onLoad() {
        console.log("Calendário Desportivo carregado (Em modo de espera).");
    }
});

// Inicializar o Runtime
document.addEventListener('DOMContentLoaded', () => App.init());
`;

        document.getElementById('sourceInput').value = sampleCode;

        // Estado do Editor
        let blocks = [];
        let nextId = 1;
        let editTargetId = null;

        // Inicializar Ícones
        lucide.createIcons();

        // Funções de UI
        function toastMsg(msg, isError = false) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.style.borderColor = isError ? 'var(--neon-red)' : 'var(--neon-green)';
            t.querySelector('i').setAttribute('data-lucide', isError ? 'alert-circle' : 'check-circle');
            lucide.createIcons();
            
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function toggleSourcePanel() {
            const panel = document.getElementById('sourcePanel');
            const chev = document.getElementById('sourceChevron');
            panel.classList.toggle('collapsed');
            if (panel.classList.contains('collapsed')) {
                chev.setAttribute('data-lucide', 'chevron-down');
            } else {
                chev.setAttribute('data-lucide', 'chevron-up');
            }
            lucide.createIcons();
        }

        function loadFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('sourceInput').value = ev.target.result;
                toastMsg('Ficheiro carregado: ' + file.name);
                document.getElementById('sourcePanel').classList.remove('collapsed');
                parseBlocks();
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        // Motor de Parsing (Deteta comentários do tipo // ==== Nome ==== ou /* --- Nome --- */)
        function parseBlocks() {
            const text = document.getElementById('sourceInput').value;
            if (!text.trim()) { toastMsg('Atenção: Cola algum código primeiro.', true); return; }

            // Expressão Regular Inteligente para apanhar cabeçalhos de blocos
            // Apanha // === Titulo === ou /* --- Titulo --- */ ou // [Modulo: Titulo]
            const markerRegex = /(?:\/\/\s*[-=]+\s*\[?(.+?)\]?\s*[-=]+)|(?:\/\*\s*[-=]+\s*\[?(.+?)\]?\s*[-=]+\s*\*\/)/g;
            
            let match;
            const markers = [];
            while ((match = markerRegex.exec(text)) !== null) {
                markers.push({
                    start: match.index,
                    title: (match[1] || match[2]).trim()
                });
            }

            blocks = [];
            nextId = 1;

            if (markers.length === 0) {
                // Sem marcadores = 1 bloco gigante
                blocks.push({
                    id: nextId++,
                    title: 'Core Engine (Unificado)',
                    content: text,
                    active: true
                });
            } else {
                // Cortar o prólogo (código antes do primeiro marcador)
                if (markers[0].start > 0) {
                    const prologue = text.substring(0, markers[0].start).trim();
                    if (prologue) {
                        blocks.push({ id: nextId++, title: 'Prólogo / Setup', content: prologue, active: true });
                    }
                }
                // Construir blocos baseados nos marcadores
                for (let i = 0; i < markers.length; i++) {
                    const start = markers[i].start;
                    const end = (i + 1 < markers.length) ? markers[i + 1].start : text.length;
                    const content = text.substring(start, end).trim();
                    if (content) {
                        blocks.push({ id: nextId++, title: markers[i].title, content: content, active: true });
                    }
                }
            }

            // Fechar o source panel para focar na grelha
            document.getElementById('sourcePanel').classList.add('collapsed');
            document.getElementById('sourceChevron').setAttribute('data-lucide', 'chevron-down');
            lucide.createIcons();

            renderBlocks();
            toastMsg(`Sucesso: ${blocks.length} módulo(s) detetado(s)`);
        }

        function renderBlocks() {
            const container = document.getElementById('blocksContainer');
            
            if (blocks.length === 0) {
                container.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted); border: 1px dashed rgba(255,255,255,0.1); border-radius: 8px;">
                    <p>Nenhum bloco disponível.</p>
                </div>`;
                updateStats();
                return;
            }

            let html = '';
            blocks.forEach(b => {
                const preview = b.content.substring(0, 150) + (b.content.length > 150 ? '...' : '');
                const lines = b.content.split('\n').length;
                html += `
                    <div class="block-card ${b.active ? '' : 'inactive'}">
                        <div class="block-header">
                            <div>
                                <div class="block-title">${escapeHtml(b.title)}</div>
                                <div class="block-stats">${lines} linhas | ID: SYS_${b.id}</div>
                            </div>
                            <label class="switch">
                                <input type="checkbox" ${b.active ? 'checked' : ''} onchange="toggleBlock(${b.id}, this.checked)">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="block-preview" onclick="editBlock(${b.id})">
                            ${escapeHtml(preview)}
                        </div>
                        <div class="block-actions">
                            <button class="btn-icon" onclick="editBlock(${b.id})" title="Editar"><i data-lucide="edit-2"></i></button>
                            <button class="btn-icon" onclick="removeBlock(${b.id})" title="Remover"><i data-lucide="trash-2"></i></button>
                            <div style="flex:1"></div>
                            <button class="btn-icon" style="color:var(--neon-purple)" onclick="exportSingleBlock(${b.id})" title="Exportar Snippet"><i data-lucide="code"></i> Snippet</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            lucide.createIcons();
            updateStats();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateStats() {
            const active = blocks.filter(b => b.active).length;
            document.getElementById('blockStats').innerHTML = `<span style="color:var(--neon-cyan)">${active} Ativos</span> / ${blocks.length} Total`;
            document.getElementById('selectAll').checked = (active === blocks.length && blocks.length > 0);
        }

        function toggleBlock(id, checked) {
            const b = blocks.find(x => x.id === id);
            if(b) b.active = checked;
            renderBlocks(); // re-render to apply inactive styling
        }

        function toggleAllCheckboxes(checked) {
            blocks.forEach(b => b.active = checked);
            renderBlocks();
        }

        function removeBlock(id) {
            if(!confirm('Tens a certeza que queres eliminar este módulo da arquitetura?')) return;
            blocks = blocks.filter(b => b.id !== id);
            renderBlocks();
        }

        // Lógica de Edição e Split
        function editBlock(id) {
            const b = blocks.find(x => x.id === id);
            if(!b) return;
            editTargetId = id;
            document.getElementById('editModalTitle').innerText = b.title;
            document.getElementById('editTextarea').value = b.content;
            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            editTargetId = null;
        }

        function saveEditModal() {
            if(!editTargetId) return;
            const content = document.getElementById('editTextarea').value;
            const b = blocks.find(x => x.id === editTargetId);
            if(b) {
                b.content = content;
                renderBlocks();
                toastMsg('Módulo atualizado no buffer.');
            }
            closeEditModal();
        }

        function splitBlockFromModal() {
            if(!editTargetId) return;
            const content = document.getElementById('editTextarea').value;
            const marker = '//---SPLIT---';
            const idx = content.indexOf(marker);
            
            if (idx === -1) {
                toastMsg('Para dividir, digita //---SPLIT--- no local desejado da área de texto.', true);
                return;
            }

            const p1 = content.substring(0, idx).trim();
            const p2 = content.substring(idx + marker.length).trim();

            const b = blocks.find(x => x.id === editTargetId);
            b.content = p1;
            
            blocks.push({
                id: nextId++,
                title: b.title + ' (Extensão)',
                content: p2,
                active: b.active
            });

            renderBlocks();
            closeEditModal();
            toastMsg('O módulo foi bifurcado com sucesso!');
        }

        // Agrupar Selecionados
        function mergeSelected() {
            const selected = blocks.filter(b => b.active);
            if (selected.length < 2) {
                toastMsg('Precisas de pelo menos 2 módulos ATIVOS para os agrupar.', true);
                return;
            }
            
            const mergedTitle = 'Pacote: ' + selected.map(b => b.title.split(' ')[0]).join('+');
            const mergedContent = selected.map(b => `// ==== [${b.title}] ====\n${b.content}`).join('\n\n');
            
            const idsToRemove = selected.map(b => b.id);
            blocks = blocks.filter(b => !idsToRemove.includes(b.id));
            
            blocks.unshift({
                id: nextId++,
                title: mergedTitle,
                content: mergedContent,
                active: true
            });
            
            renderBlocks();
            toastMsg(`Fusão concluída: ${selected.length} módulos combinados.`);
        }

        // ==========================================
        // EXPORTADORES (O Poder da Arquitetura)
        // ==========================================

        function downloadData(content, filename, type) {
            const blob = new Blob([content], { type: type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function exportSingleBlock(id) {
            const b = blocks.find(x => x.id === id);
            if(!b) return;
            downloadData(b.content, `mod_${b.title.replace(/[^a-zA-Z0-9]/g,'')}.js`, 'application/javascript');
            toastMsg('Snippet JS exportado.');
        }

        function exportActiveJS() {
            const active = blocks.filter(b => b.active);
            if(active.length === 0) { toastMsg('Nenhum módulo ativo para exportar.', true); return; }
            const code = active.map(b => b.content).join('\n\n');
            downloadData(code, 'kobllux_core.js', 'application/javascript');
            toastMsg('Bundle JS exportado.');
        }
