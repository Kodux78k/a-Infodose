<div class="v-glass overflow-hidden" id="global-player">
<div class="absolute top-3 right-3 z-20 flex gap-2">
<button class="w-8 h-8 rounded-full bg-black/50 backdrop-blur-md flex items-center justify-center hover:bg-white/20 transition border border-white/5" onclick="Player.minimize()"><i aria-hidden="true" class="w-3 h-3 text-white ico" style="font-size:.75rem">−</i></button>
<button class="w-8 h-8 rounded-full bg-black/50 backdrop-blur-md flex items-center justify-center hover:bg-[var(--active-color)]/40 transition border border-white/5" id="player-expand-btn" onclick="Player.expand()"><i aria-hidden="true" class="w-3 h-3 text-white ico" style="font-size:.75rem">⤢</i></button>
<button class="w-8 h-8 rounded-full bg-black/50 backdrop-blur-md flex items-center justify-center hover:bg-red-500/30 transition border border-white/5" onclick="Player.stop()"><i aria-hidden="true" class="w-3 h-3 text-white ico" style="font-size:.75rem">✕</i></button>
</div>
<div class="w-full h-full bg-black" id="player-frame-wrap"></div>
</div>
