<div aria-hidden="true" id="kca-panel">
<header><span>CSS App · pilares de cor</span><button id="kca-close" type="button">×</button></header>
<section>
<div class="kca-label">Cor do usuário (base de tudo)</div>
<label>Cor <input id="kca-user-color" type="color" value="#00f2ff"/><span class="kca-val" id="kca-user-hex">#00f2ff</span></label>
<div id="kca-presets">
<span class="kca-sw" data-c="#00f2ff" style="background:#00f2ff;color:#00f2ff"></span>
<span class="kca-sw" data-c="#a78bfa" style="background:#a78bfa;color:#a78bfa"></span>
<span class="kca-sw" data-c="#fbbf24" style="background:#fbbf24;color:#fbbf24"></span>
<span class="kca-sw" data-c="#34d399" style="background:#34d399;color:#34d399"></span>
<span class="kca-sw" data-c="#fb7185" style="background:#fb7185;color:#fb7185"></span>
<span class="kca-sw" data-c="#60a5fa" style="background:#60a5fa;color:#60a5fa"></span>
</div>
</section>
<section>
<div class="kca-label">Distribuir pilares (privado · secundário · soft)</div>
<div class="kca-seg" id="kca-mode">
<button class="kca-btn" data-mode="privado" type="button">Privado</button>
<button class="kca-btn" data-mode="secundario" type="button">Secund.</button>
<button class="kca-btn" data-mode="soft" type="button">Soft</button>
<button class="kca-btn" data-mode="misto" type="button">Misto</button>
</div>
</section>
<section>
<label>Borda variável <input id="kca-border" max="30" min="0" type="range" value="12"/><span class="kca-val" id="kca-border-v">1.2px</span></label>
<label>Transição <input id="kca-dur" max="80" min="8" type="range" value="28"/><span class="kca-val" id="kca-dur-v">0.28s</span></label>
<label class="kca-check"><input checked="" id="kca-fixtx" type="checkbox"/> Texto fixo na cor do usuário</label>
</section>
<section>
<div class="kca-label">Áudio · sensor + visual + waveform da trilha</div>
<div class="kca-aud">
<button class="kca-btn" id="kca-mic" type="button">Sensor de microfone<br/>OFF</button>
<button class="kca-btn" id="kca-amb" type="button">Pad ambiental<br/>OFF</button>
<button class="kca-btn" id="kca-tts" type="button">Testar voz<br/>podcast</button>
<button class="kca-btn kca-on" id="kca-orb-toggle" type="button">Visualizador<br/>ON</button>
</div>
</section>
<div class="kca-foot">KOB CSS-APP v3 · visualizador = botão do painel</div>
</div>
