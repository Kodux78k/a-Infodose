<div aria-labelledby="symbolModalTitle" aria-modal="true" id="symbol-edit-modal" role="dialog">
<div class="modal-card">
<h2 id="symbolModalTitle">⚙ Editar Symbol Bar<button aria-label="Fechar" class="close-modal" id="closeSymbolModal" type="button">✕</button></h2>
<div id="symbol-edit-list"></div>
<div class="add-btn-area">
<input autocomplete="off" id="newSymbolUrl" placeholder="URL ou arquivo (https://… / app.html)" spellcheck="false"/>
<input autocomplete="off" id="newSymbolLabel" placeholder="Rótulo"/>
<input autocomplete="off" id="newSymbolIcon" maxlength="4" placeholder="Ícone" title="Glifo do botão (opcional)"/>
<button class="sbx-mbtn primary" id="addSymbolBtn" type="button">Adicionar</button>
</div>
<div class="sbx-mrow">
<button class="sbx-mbtn" id="resetSymbolsBtn" type="button">↺ Restaurar padrão</button>
<button class="sbx-mbtn" id="closeSymbolModalBtn" style="margin-left:auto" type="button">Fechar</button>
</div>
</div>
</div>
