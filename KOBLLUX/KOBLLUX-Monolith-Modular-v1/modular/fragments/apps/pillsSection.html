<details class="section reveal" id="pillsSection" open="">
<summary class="section-head" style="cursor:pointer; list-style:none;">
<span class="section-num">05</span>
<div>
<div class="section-title">Pílulas · Docs</div>
<div class="section-sub">importe · exemplos · semente 🌱 + fusão 🪞 · 💊 abre a barra de pílulas</div>
</div>
<span class="ws-chevron" style="margin-left:auto; transition:transform .28s;">▾</span>
</summary>
<div id="nebulaRoot" style="padding:12px 0 0">
<div id="filterBar">
<button class="tab-pill on" data-f="all">Todos</button>
<button class="tab-pill" data-f="fav">★ Fav</button>
<button class="tab-pill" data-f="fused">⊕ Fusões</button>
<button class="tab-pill" data-f="md">MD</button>
<button class="tab-pill" data-f="html">HTML</button>
<button class="tab-pill" data-f="txt">TXT</button>
<button class="tab-pill" data-f="pdf">PDF</button>
<button class="tab-pill" data-f="today">Hoje</button>
<button class="tab-pill" data-f="week">Semana</button>
<button class="tab-pill" data-f="month">Mês</button>
</div>
<input id="q" placeholder="Buscar documentos..." type="search"/>
<div id="stage"></div>
<div id="dots"></div>
<div id="empty">Nenhum documento. Toque em <b>📥 Importar</b> ou <b>✨ Exemplos</b>.</div>
<div id="navDock" style="display:none">
<button id="prev" type="button">‹</button>
<button id="next" type="button">›</button>
</div>
<div id="docPillsBar"></div>
<div class="bota1" id="nebulaToolbar">
<button class="pill sm" data-dual-action="mente:import" data-dual-target="" id="btnImport">📥 Importar</button>
<button class="pill sm" data-dual-action="mente:paste" data-dual-target="" id="btnPaste" title="Colar do clipboard como pílula">📋 Colar</button>
<button class="pill sm" data-dual-action="mente:samples" data-dual-target="" id="btnSample">✨ Exemplos</button>
<button class="pill sm" data-dual-action="mente:pills" data-dual-target="" id="btnPills">💊 Pílulas</button>
<button class="pill sm" id="btnPillsExport" title="Exportar todas as pílulas em JSON" type="button">⤓ JSON</button>
<button class="pill sm" id="btnPillsImport" title="Importar pílulas de um JSON" type="button">⤒ JSON</button>
<input accept=".json,application/json" id="pillsJsonInput" multiple="" style="display:none" type="file"/>
<button class="pill sm" onclick="if(window.KOBLLUXWorkspace?.openRegistered){window.KOBLLUXWorkspace.openRegistered('s0').catch(e=&gt;window.KBLX_TOAST?.(e.message))}else{window.KOBWorkspace?.reveal?.('s0');document.getElementById('s0')?.scrollIntoView({behavior:'smooth',block:'start'})}">🧠 Espaço da Mente</button>
</div>
</div>
<input accept=".txt,.md,.html,.pdf,.json,.csv" id="nbFileInput" multiple="" style="display:none" type="file"/>
</details>
