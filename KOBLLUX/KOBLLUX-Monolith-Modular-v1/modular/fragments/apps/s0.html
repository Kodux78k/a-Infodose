<details class="section reveal" id="s0" open="">
<summary class="section-head" style="cursor:pointer; list-style:none;">
<span class="section-num">01</span>
<div>
<div class="section-title">Slicer · Nebula</div>
<div class="section-sub">Importe/cole → slices com voz</div>
</div>
<span class="ws-chevron" style="margin-left:auto; transition:transform .28s;">▾</span>
</summary>
<div class="session-window" id="readerApp">
<header class="reader-header">
<div class="brand">
<div class="brand-symbol">◉</div>
<div>
<div class="brand-title" id="documentTitle">ESPAÇO DA MENTE</div>
<div class="brand-subtitle">NEBULA · SLICE</div>
</div>
</div>
<div class="header-actions">
<button class="icon-btn" onclick="Nebula.openFile()">＋</button>
<button class="icon-btn" onclick="Nebula.pasteText()">✎</button>
<button class="icon-btn" onclick="Nebula.togglePlayer()">◌</button>
</div>
</header>
<div class="reader-viewport">
<div id="sliceStage"></div>
<div class="empty-state" id="emptyState">
<div class="empty-box">
<div class="empty-symbol">◉</div>
<h1>Espaço da Mente</h1>
<p>Importe um TXT / MD / JSON ou cole um texto.</p>
<button class="import-button" onclick="Nebula.openFile()">＋ Importar</button>
</div>
</div>
<div class="nav">
<button onclick="Nebula.previousSlice()">↑</button>
<button onclick="Nebula.nextSlice()">↓</button>
</div>
<div class="player" id="player">
<div class="player-main">
<button class="play-btn" id="playButton" onclick="Nebula.toggleSpeech()">▶</button>
</div>
<div class="player-info">
<div class="player-title" id="playerTitle">Nenhum</div>
<div class="player-state" id="playerState">Aguardando</div>
</div>
<div class="progress-wrap">
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
</div>
<div class="player-controls-secondary">
<button class="small-btn" onclick="Nebula.previousSlice()">‹</button>
<button class="small-btn" onclick="Nebula.nextSlice()">›</button>
<button class="small-btn" onclick="Nebula.stopSpeech()">■</button>
</div>
</div>
</div>
<input accept=".txt,.md,.markdown,.json,.csv,text/plain" id="fileInput" type="file"/>
</div>
</details>
