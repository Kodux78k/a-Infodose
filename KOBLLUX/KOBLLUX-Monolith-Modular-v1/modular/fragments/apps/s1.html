<details class="section reveal" id="s1">
<summary class="section-head" style="cursor:pointer; list-style:none;">
<span class="section-num">02</span>
<div>
<div class="section-title">Polo de Origem</div>
<div class="section-sub">Cole · importe · extraia · gere</div>
</div>
<span class="ws-chevron" style="margin-left:auto; transition:transform .28s;">▾</span>
</summary>
<div class="dose" style="--arch-color:var(--kob-voice-primary)">
<div class="input-head">
<span class="label">Texto Fonte</span>
<span class="counter" id="counter">0</span>
</div>
<textarea id="sourceText" placeholder="Cole qualquer texto aqui..." spellcheck="false"></textarea>

<div class="actions">
<button class="action" id="pasteBtn">◉ COLAR</button>
<button class="action" id="importBtn">⌲ IMPORTAR</button>
<button class="action" id="parseBtn">◇ EXTRAIR</button>
<button class="action primary" id="stepBtn">⇄ +15</button>
<button class="action primary" id="generateBtn">✦ GERAR TUDO</button>
<button class="action slicer full" id="sendSlicerBtn">→ SLICER</button>
<button class="action audio full" id="listenBtn">◉ OUVIR</button>
</div>
</div>
</details>
