<details class="section reveal" id="cortexSection">
<summary class="section-head" style="cursor:pointer; list-style:none;">
<span class="section-num">07</span>
<div>
<div class="section-title">Córtex · Neural View</div>
<div class="section-sub">sessions MXP/iFSw como neurônios · seções como lobos · cristais de memória</div>
</div>
<span class="ws-chevron" style="margin-left:auto; transition:transform .28s;">▾</span>
</summary>
<div id="cortexRoot">
<div class="kc-tabs" role="tablist">
<button class="kc-tab on" data-kc-tab="neural" type="button">⬡ NEURAL</button>
<button class="kc-tab" data-kc-tab="crystals" type="button">◈ CRISTAIS <span class="kc-count" id="kcCrystalCount">0</span></button>
<button class="kc-tab kc-tab-mini" data-kc-act="relayout" title="Reorganizar" type="button">⟳</button>
</div>
<div class="kc-pane" id="kcNeural">
<div class="kc-stage">
<svg aria-label="Rede neural de sessions" id="kcSvg" role="img" viewbox="0 0 360 360"></svg>
<div class="kc-legend">
<span class="lg a">● ativa</span>
<span class="lg d">◐ dock</span>
<span class="lg c">○ fechada</span>
<span class="lg l">⬡ lobo</span>
</div>
</div>
<div class="kc-info" id="kcInfo"><div class="kc-hint">Toque num neurônio · 2 toques abre</div></div>
</div>
<div class="kc-pane" hidden="" id="kcCrystals">
<div class="kc-search">
<input autocomplete="off" id="kcSearch" placeholder="Buscar nas matrizes…" type="search"/>
<button class="kc-btn" data-kc-act="crystal-new" type="button">＋ Cristal</button>
</div>
<div class="kc-form" hidden="" id="kcForm">
<textarea id="kcNewText" placeholder="Memória a cristalizar…" rows="4"></textarea>
<input id="kcNewTags" placeholder="tags, separadas, por vírgula" type="text"/>
<div class="kc-row">
<button class="kc-btn" data-kc-act="crystal-cancel" type="button">Cancelar</button>
<button class="kc-btn pri" data-kc-act="crystal-save" type="button">Cristalizar</button>
</div>
</div>
<div class="kc-list" id="kcList"></div>
</div>
</div>
</details>
