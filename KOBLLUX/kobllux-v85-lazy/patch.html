<script id="v81-js">
(function(){
"use strict";
const $=s=>document.querySelector(s);
/* ---- holograma no header: 2 linhas (♫ música · 🗣 TTS) ---- */
let holoT;
window.KOB_HOLO=function(kind,idx,text){
  const t=$('#hd2Title'),el=$('#hd2Holo '+(kind==='m'?'.hm':'.ht')); if(!t||!el||!text) return;
  let a=idx,b=idx; while(a>0&&text[a-1]!==' '&&text[a-1]!=='\n')a--; 
  const s=Math.max(0,a-12); const e=Math.min(text.length,idx+22);
  el.textContent=(kind==='m'?'♫ ':'🗣 ')+text.slice(s,e).replace(/\s+/g,' ');
  t.classList.add('holo-on'); clearTimeout(holoT); holoT=setTimeout(()=>{t.classList.remove('holo-on')},2600);
};
/* ---- TTS: troca de voz ao aparecer nome de arquétipo no texto (mesmo com texto longo) ---- */
if('speechSynthesis'in window&&!speechSynthesis.__v81){
  const sp=speechSynthesis.speak.bind(speechSynthesis); speechSynthesis.__v81=1;
  speechSynthesis.speak=function(u){
    try{
      const text=u.text||'', V=window.KBLX_VOICE; if(!V||text.length<3||u.__seg) return sp(u);
      const names=(window.ARCH_LIST||[]).slice().sort((a,b)=>b.length-a.length);
      const re=new RegExp('\\b('+names.join('|')+')\\b','gi'), cuts=[]; let m;
      while((m=re.exec(text))) cuts.push({i:m.index,a:m[1].toUpperCase()});
      let cur=(window.getArch&&getArch())||'KOBLLUX', segs=[], last=0;
      cuts.forEach(c=>{ if(c.i>last){segs.push({t:text.slice(last,c.i),a:cur,o:last});last=c.i;} cur=c.a; });
      segs.push({t:text.slice(last),a:cur,o:last});
      segs=segs.filter(s=>s.t.trim());
      const mixA=a=>{ const A=V.map[a]||{rate:1,pitch:1}, M=window.KOB_MIXVOICE?KOB_MIXVOICE(a):A; return {r:M.rate/(A.rate||1), p:M.pitch/(A.pitch||1)}; };
      if(segs.length<2){ { const x=mixA(segs[0]?segs[0].a:cur); u.rate=Math.max(.5,Math.min(2,u.rate*x.r)); u.pitch=Math.max(.2,Math.min(2,u.pitch*x.p)); } const o=u.onboundary; u.onboundary=e=>{window.KOB_HOLO&&KOB_HOLO('t',e.charIndex||0,text); o&&o.call(u,e)}; return sp(u); }
      segs.forEach((s,k)=>{
        const v=V.forArch(s.a,s.t); v.__seg=1; v.volume=u.volume; { const x=mixA(s.a); v.rate=Math.max(.5,Math.min(2,v.rate*x.r)); v.pitch=Math.max(.2,Math.min(2,v.pitch*x.p)); }
        v.onstart=()=>{ try{window.KOB_ARCHSWITCH&&KOB_ARCHSWITCH(s.a)}catch(e){} if(k===0&&u.onstart)u.onstart.call(u,{}); };
        v.onboundary=e=>{ const ci=(e.charIndex||0)+s.o; window.KOB_HOLO&&KOB_HOLO('t',ci,text); if(u.onboundary)u.onboundary.call(u,Object.assign({},e,{charIndex:ci})); };
        if(k===segs.length-1){ v.onend=e=>u.onend&&u.onend.call(u,e); }
        v.onerror=e=>u.onerror&&u.onerror.call(u,e);
        sp(v);
      });
    }catch(err){ sp(u); }
  };
}
/* ---- loader: barra + pílula enquanto arquivo grande é lido ---- */
const bar=document.createElement('div'); bar.id='kobLoad'; bar.innerHTML='<span>CARREGANDO…</span>'; document.body.appendChild(bar);
let busy=0,showT;
function ld(on){ busy+=on?1:-1; if(busy<0)busy=0; clearTimeout(showT);
  if(busy>0) showT=setTimeout(()=>bar.classList.add('on'),250); else bar.classList.remove('on'); }
window.KOB_LOADING=ld;
['readAsText','readAsArrayBuffer','readAsDataURL'].forEach(fn=>{ const o=FileReader.prototype[fn];
  FileReader.prototype[fn]=function(){ ld(true); this.addEventListener('loadend',()=>ld(false),{once:true}); return o.apply(this,arguments); }; });
['text','arrayBuffer'].forEach(fn=>{ const o=Blob.prototype[fn];
  Blob.prototype[fn]=function(){ if(this.size<200000) return o.call(this); ld(true); return o.call(this).finally(()=>ld(false)); }; });
})();
</script>

<script id="v82-js">
(function KOBSuspend(){
"use strict";
/* [v82] só o que está visível fica ativo; workspace/minimizado/dock = suspenso (CSS pausado, canvas e cortex param) */
const SEL=".app > section, #sessionsLayer > *, .session-window";
let q=0;
function off(e){ const c=e.classList; return c.contains("ws-off")||c.contains("minimized")||c.contains("suspended")||["closed","docked","dock"].includes(e.dataset.state); }
function sweep(){ q=0; document.querySelectorAll(SEL).forEach(e=>{ const v=off(e)?"1":"0"; if(e.dataset.suspended!==v){ e.dataset.suspended=v; e.dispatchEvent(new CustomEvent(v==="1"?"kob:suspend":"kob:resume",{bubbles:true})); } });
  const c=document.getElementById("cortexSection"); if(c&&c.dataset.suspended==="0"){ try{window.KOBCortex&&KOBCortex.refresh()}catch(e){} } }
function sched(){ if(!q) q=requestAnimationFrame(sweep); }
const mo=new MutationObserver(sched);
function arm(){ [document.querySelector(".app"),document.getElementById("sessionsLayer")].forEach(n=>n&&mo.observe(n,{attributes:true,attributeFilter:["class","data-state"],subtree:true})); sched(); }
[100,600,1800].forEach(t=>setTimeout(arm,t)); document.addEventListener("visibilitychange",()=>{ document.documentElement.dataset.hidden=document.hidden?"1":"0"; });
window.KOBSuspend={sweep};
})();
</script>


<script id="kob-state-bridge">
/* KOBLLUX State Core V86 · legacy writes synchronized
   Fonte observável para novos componentes; preserva as APIs e chaves antigas.
   Não substitui os controladores legados automaticamente.
*/
(() => {
  'use strict';
  if (window.KOBState) return;
  const KEYS = Object.freeze({
    user: 'di_userName', assistant: 'di_assistantName',
    model: 'di_modelName', infodose: 'di_infodoseName',
    conversation: 'di_conversation', theme: 'infodoseTheme'
  });
  const defaults = Object.freeze({
    user: 'Convidado', assistant: 'Dual',
    model: 'nvidia/nemotron-3-nano-30b-a3b:free',
    infodose: 'Infodose', conversation: '', theme: 'dark',
    audio: { playing: false, muted: false }, settings: {}, history: []
  });
  const listeners = new Set();
  let revision = 0;
  let internalWrite = false;
  const read = (key, fallback) => {
    try { const value = localStorage.getItem(key); return value == null ? fallback : value; }
    catch (_) { return fallback; }
  };
  let state = {
    ...defaults,
    user: read(KEYS.user, defaults.user),
    assistant: read(KEYS.assistant, defaults.assistant),
    model: read(KEYS.model, defaults.model),
    infodose: read(KEYS.infodose, defaults.infodose),
    conversation: read(KEYS.conversation, defaults.conversation),
    theme: read(KEYS.theme, defaults.theme)
  };
  const snapshot = () => Object.freeze({
    ...state, audio: { ...state.audio },
    settings: { ...state.settings }, history: [...state.history]
  });
  const emit = (reason, changedKey) => {
    revision += 1;
    const detail = Object.freeze({ state: snapshot(), revision, reason, changedKey });
    window.dispatchEvent(new CustomEvent('kob:statechange', { detail }));
    listeners.forEach(fn => {
      try { fn(detail.state, detail); }
      catch (error) { console.error('[KOBState] listener failed', error); }
    });
  };
  const set = (key, value, options = {}) => {
    if (!Object.prototype.hasOwnProperty.call(defaults, key))
      throw new Error('[KOBState] Unknown state key: ' + key);
    const next = value && typeof value === 'object'
      ? (Array.isArray(value) ? [...value] : { ...value }) : value;
    state = { ...state, [key]: next };
    if (options.persist !== false && KEYS[key]) {
      internalWrite = true;
      try { localStorage.setItem(KEYS[key], typeof next === 'string' ? next : JSON.stringify(next)); }
      catch (_) {}
      finally { internalWrite = false; }
    }
    emit(options.reason || 'set', key);
    return snapshot();
  };
  const patch = (partial, options = {}) => {
    if (!partial || typeof partial !== 'object' || Array.isArray(partial))
      throw new TypeError('[KOBState] patch expects an object');
    const next = { ...state };
    for (const [key, value] of Object.entries(partial)) {
      if (!Object.prototype.hasOwnProperty.call(defaults, key)) continue;
      next[key] = value && typeof value === 'object'
        ? (Array.isArray(value) ? [...value] : { ...value }) : value;
    }
    state = next;
    if (options.persist !== false) {
      for (const [key, value] of Object.entries(partial)) {
        if (!KEYS[key]) continue;
        internalWrite = true;
        try { localStorage.setItem(KEYS[key], typeof value === 'string' ? value : JSON.stringify(value)); }
        catch (_) {}
        finally { internalWrite = false; }
      }
    }
    emit(options.reason || 'patch', Object.keys(partial));
    return snapshot();
  };
  window.KOBState = Object.freeze({
    get: snapshot, set, patch,
    subscribe(fn, immediate = true) {
      if (typeof fn !== 'function') throw new TypeError('subscribe expects a function');
      listeners.add(fn);
      if (immediate) fn(snapshot(), { revision, reason: 'subscribe', changedKey: null });
      return () => listeners.delete(fn);
    },
    get revision() { return revision; },
    keys: KEYS,
    version: '86.0.0',
    compatibility: Object.freeze({ legacyStorageSync: true, legacyKeys: Object.freeze(Object.values(KEYS)) })
  });
  window.addEventListener('storage', event => {
    const key = Object.keys(KEYS).find(name => KEYS[name] === event.key);
    if (!key) return;
    state = { ...state, [key]: event.newValue == null ? defaults[key] : event.newValue };
    emit('storage', key);
  });
  /* V86: sincroniza escritas legadas feitas no mesmo documento.
     A chamada original acontece primeiro; a guarda evita recursão quando KOBState persiste. */
  try {
    const proto = Storage.prototype;
    if (!proto.__kobV86Wrapped) {
      const REV_KEYS = Object.create(null); Object.keys(KEYS).forEach(k => { if (!(KEYS[k] in REV_KEYS)) REV_KEYS[KEYS[k]] = k; });
      const nativeSet = proto.setItem;
      const nativeRemove = proto.removeItem;
      const nativeClear = proto.clear;
      Object.defineProperty(proto, '__kobV86Wrapped', { value: true, configurable: false });
      proto.setItem = function(key, value) {
        nativeSet.call(this, key, value);
        if (this !== window.localStorage || internalWrite) return;
        const name = REV_KEYS[String(key)];
        if (name) set(name, String(value), { persist: false, reason: 'legacy-storage' });
      };
      proto.removeItem = function(key) {
        nativeRemove.call(this, key);
        if (this !== window.localStorage || internalWrite) return;
        const name = REV_KEYS[String(key)];
        if (name) set(name, defaults[name], { persist: false, reason: 'legacy-storage-remove' });
      };
      proto.clear = function() {
        nativeClear.call(this);
        if (this !== window.localStorage || internalWrite) return;
        state = { ...state };
        Object.keys(KEYS).forEach(name => { state[name] = defaults[name]; });
        emit('legacy-storage-clear', Object.keys(KEYS));
      };
    }
  } catch (error) { console.warn('[KOBState] legacy storage hook unavailable', error); }
  window.KOB_ARCHETYPES = Object.freeze([
    { id: 'atlas', label: 'Atlas', role: 'estrutura' },
    { id: 'nova', label: 'Nova', role: 'expansão' },
    { id: 'vitalis', label: 'Vitalis', role: 'energia' },
    { id: 'pulse', label: 'Pulse', role: 'ritmo' },
    { id: 'kaos', label: 'Kaos', role: 'ruptura' },
    { id: 'kodux', label: 'Kodux', role: 'vigilância' },
    { id: 'lumine', label: 'Lumine', role: 'clareza' },
    { id: 'aion', label: 'Aion', role: 'continuidade' },
    { id: 'kobllux', label: 'KOBLLUX', role: 'integração' },
    { id: 'infodose', label: 'Infodose', role: 'contexto' },
    { id: 'trinity', label: 'Trinity', role: 'síntese' }
  ]);
})();
</script>

<script id="kob-v86-patch-js">
(function(){
  "use strict";

  /* ═══ Item 6: KOBLoadTone — Tone.js sob demanda (bundle inline em text/plain) ═══ */
  window.KOBLoadTone = (function(){
    var p = null;
    function waitForTone(res, tries){
      if (typeof Tone !== 'undefined' && Tone) { res(Tone); return; }
      if (tries <= 0) { console.warn('[KOBLoadTone] Tone não definido após espera'); res(null); return; }
      setTimeout(function(){ waitForTone(res, tries-1); }, 100);
    }
    return function(){
      if (typeof Tone !== 'undefined' && Tone) return Promise.resolve(Tone);
      if (p) return p;
      p = new Promise(function(res){
        var el = document.getElementById('kob-tone-inline');
        var code = el ? (el.textContent || el.innerText || '') : '';
        if (code && code.length > 1000) {
          try {
            var blob = new Blob([code], {type:'application/javascript'});
            var url = URL.createObjectURL(blob);
            var s = document.createElement('script');
            s.src = url;
            s.onload = function(){ try{ URL.revokeObjectURL(url); }catch(e){} waitForTone(res, 30); };
            s.onerror = function(){ console.warn('[KOBLoadTone] erro no blob, tentando CDN'); p=null; res(null); };
            document.head.appendChild(s);
            console.log('[KOBLoadTone] injetando via Blob URL (' + Math.round(code.length/1024) + 'KB)');
            return;
          } catch(e) { console.warn('[KOBLoadTone] blob falhou:', e); }
        }
        /* Fallback: CDN (se o bloco inline estiver ausente) */
        var s2 = document.createElement('script');
        s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js';
        s2.onload = function(){ waitForTone(res, 30); };
        s2.onerror = function(){ p = null; res(null); };
        document.head.appendChild(s2);
      });
      return p;
    };
  })();

  /* ═══ Item 3: KOBArch — Dois orbes separados (voice ↔ music) ═══ */
  window.KOBArch = window.KOBArch || (function(){
    var _voice = 'JESUS', _music = 'KOBLLUX', _listeners = [];
    function notify(type, cur, prev){
      _listeners.forEach(function(cb){ try{ cb({type:type, current:cur, previous:prev}); }catch(e){} });
    }
    return {
      get voice(){ return _voice; },
      get music(){ return _music; },
      setVoice: function(a){ var o=_voice; _voice=a; notify('voice',a,o); return this; },
      setMusic: function(a){ var o=_music; _music=a; notify('music',a,o); return this; },
      subscribe: function(cb){ _listeners.push(cb); return function(){ _listeners=_listeners.filter(function(l){return l!==cb;}); }; },
      /* Troca voz no meio da leitura: mata utterance atual e reinicia do charIndex capturado */
      restartFrom: function(charIndex, newArch){
        if(newArch) this.setVoice(newArch);
        try{
          if('speechSynthesis' in window) speechSynthesis.cancel();
          var holo = window.KOB_HOLO || window.KOBHolo;
          if(holo && holo.speakFrom && holo.fullText){
            setTimeout(function(){ holo.speakFrom(charIndex||0); }, 120);
          }
        }catch(e){}
        return this;
      }
    };
  })();
  window.KOBArch.subscribe(function(ev){
    if(ev.type==='voice'){
      try{ document.body.setAttribute('data-voice-arch', String(ev.current).toLowerCase()); }catch(e){}
    }
  });
  try{ document.body.setAttribute('data-voice-arch', String(window.KOBArch.voice).toLowerCase()); }catch(e){}

  /* ═══ Item 4: Workspace colapsável — botão ⌄ no wsMenu ═══ */

  /* ═══ Item 5: Pílulas ação-primeiro — reescreve nebulaToolbar ═══ */
  function pillAct(action){
    var NP = window.NebulaPills;
    var S = window.KOBSonoro;
    var doc = NP && NP.activeDoc ? NP.activeDoc() : null;
    if(!doc && action!=='list'){
      try{ window.KBLX_TOAST && KBLX_TOAST('Selecione um documento'); }catch(e){}
      return;
    }
    var text = (doc && (doc.content || doc.name)) || '';
    var nm = String((doc && doc.name) || '').replace(/\.[^.]+$/, '');
    switch(action){
      case 'seed':
        if(NP && NP.markSeed) NP.markSeed(doc);
        if(S && doc.content) S.toSeed(doc.content);
        try{ window.KBLX_TOAST && KBLX_TOAST('🌱 Semente'); }catch(e){}
        break;
      case 'mirror':
        if(S && doc.content){ S.toMirror(doc.content); try{ KBLX_TOAST && KBLX_TOAST('🪞 Espelho'); }catch(e){} }
        else { try{ KBLX_TOAST && KBLX_TOAST('sem texto'); }catch(e){} }
        break;
      case 'fuse':
        if(NP && NP.fundirComSemente) NP.fundirComSemente(doc);
        break;
      case 'speak':
        if(S) S.playText(text, nm);
        else if(NP && NP.speak) NP.speak(text.slice(0,5000));
        break;
      case 'open':
        if(NP && NP.openReader) NP.openReader(doc);
        break;
      case 'list':
        var bar = document.getElementById('docPillsBar');
        if(bar){ bar.style.display = (bar.style.display==='none') ? '' : 'none'; }
        var pillsBtn = document.getElementById('btnPills');
        if(pillsBtn) pillsBtn.click();
        break;
    }
    updateActiveDocChip();
  }

  function updateActiveDocChip(){
    var chip = document.getElementById('activeDocChip');
    if(!chip) return;
    try{
      var NP = window.NebulaPills;
      var doc = NP && NP.activeDoc ? NP.activeDoc() : null;
      chip.textContent = doc ? ('◉ ' + String(doc.name||'').slice(0,18)) : '';
    }catch(e){}
  }


  /* ── Boot ── */
  function boot(){
    try{ initWorkspaceCollapse(); }catch(e){ console.warn('[patch] ws collapse:', e); }
    try{ initPillActions(); }catch(e){ console.warn('[patch] pills:', e); }
    console.log('%c[V86-PATCH] ✓ Itens 1·2·3·4·5 aplicados', 'background:#38bdf8;color:#000;padding:2px 8px;border-radius:3px');
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
  /* fallback: tenta novamente após load (elementos injetados tardiamente) */
  window.addEventListener('load', function(){ setTimeout(boot, 300); setTimeout(boot, 1500); });
  /* [Item 6+] Preload do Tone na PRIMEIRA interação do usuário — fica pronto antes do play */
  (function(){
    function preloadOnce(){ try{ window.KOBLoadTone && KOBLoadTone(); }catch(e){} }
    document.addEventListener('pointerdown', preloadOnce, {once:true});
    document.addEventListener('keydown', preloadOnce, {once:true});
  })();
})();
</script>

<script id="kob-flow">
/* KobFlow · orquestração de comportamento (cores em cadeia · voz em etapas · idle/carga)
   Não substitui nada: observa o que já existe e muda o RITMO.
   Ciclo 3-6-9-12 (+1 de memória = 13): cada etapa dura k × unit (k = 3,6,9,12).
   API: KobFlow.config · .status() · .retarget() · .disable()/.enable() · .setUnit(ms)
   Desligar: localStorage.kob_flow='off' ou ?flow=off */
(function (w, d) {
  'use strict';
  if (w.KobFlow) return;
  try { if (/[?&]flow=off/.test(location.search) || localStorage.getItem('kob_flow') === 'off') return; } catch (e) {}

  var CFG = {
    unit: 700,                       /* ms por "1" do ciclo: etapas = 3u, 6u, 9u, 12u */
    mult: { btn: 3, hud: 6, blob: 9, root: 12 },
    order: ['btn', 'hud', 'blob', 'root'],   /* prioridade: botões → hud → blobs → resto */
    fps: 15,                         /* passos/s da transição (barato e suave p/ cor lenta) */
    voiceWindows: { rate: 3, pitch: 6, voice: 9 },   /* em unidades: rate→pitch→voz */
    voiceBlend: true,
    idleUnit: 10000,                 /* idle: 30s/60s/90s/120s */
    playUnit: 5000,                  /* música tocando: 15s/30s/45s/60s */
    tickMs: 2000
  };
  var VARS = { kp: '--kob-voice-primary', ks: '--kob-voice-secondary',
               bp: '--bllue-voice-primary', bs: '--bllue-voice-secondary',

    });

  var have = {};              /* quais vars existem */

  var run = null;             /* {st,t0,dur,from:{k:rgba}} */
  var pending = [];           /* etapas aguardando, na ordem de prioridade */
  var raf = 0, lastTs = 0;
  var stats = { retargets: 0, steps: 0, selectors: 0, skipped: 0 };
  var stageSel = { btn: [], hud: [], blob: [] };   /* seletores (sem @media) p/ saber se a etapa tem elementos */

    var nat = readNatural(); raw = nat;
    KEYS.forEach(function (k) { var c = parse(nat[k]); have[k] = !!nat[k]; if (c) tgt[k] = c; });
    CFG.order.forEach(function (st) { cur[st] = {}; KEYS.forEach(function (k) { if (tgt[k]) { cur[st][k] = tgt[k].slice(); writeStage(st, k, tgt[k]); } else if (nat[k]) writeStage(st, k, nat[k]); }); });

    sheetEl = d.createElement('style'); sheetEl.id = 'kob-flow-css'; sheetEl.textContent = built.css; d.head.appendChild(sheetEl);

  }
  function startStage(st, now) {

    if (run || pending.length) raf = requestAnimationFrame(loop);

  function kick() { if (!raf) raf = requestAnimationFrame(loop); }

    var changed = false;
    KEYS.forEach(function (k) {
      if (!nat[k]) return;
      var c = parse(nat[k]);
      if (!c) { CFG.order.forEach(function (st) { writeStage(st, k, nat[k]); }); return; }    /* não interpolável: direto */

      tgt[k] = c;
    });
    if (!changed) return;

    if (run) {   /* a etapa em curso continua de onde está (sem salto) rumo ao novo alvo */

  }
  var rtT = 0;
  function scheduleRetarget() { clearTimeout(rtT); rtT = setTimeout(retarget, 30); }

  /* ------------------------------------------------ voz em etapas (rate→pitch→voz) */
  var V = { applied: null, from: null, to: null, t0: 0, active: false, spoken: 0 };
  function tuneUtterance(u) {
    if (!enabled || !CFG.voiceBlend || reduce) return;
