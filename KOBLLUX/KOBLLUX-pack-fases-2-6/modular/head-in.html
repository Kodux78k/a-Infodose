  var pending = null, rafId = 0;
  var origSetProp = CSSStyleDeclaration.prototype.setProperty;
  var origGetProp = CSSStyleDeclaration.prototype.getPropertyValue;
  var origGetComputed = window.getComputedStyle;

  function flushTheme() {
    rafId = 0;

     7 observe() em atributos de arquétipo (data-arch, data-voice-arch,
     data-theme, data-art-voice-active) sobre body/root. Uma troca de
     arquétipo escreve 4 atributos → cada observer dispara 4x → cascata
     de kobEnterExternal/archMusicApply/schedule. Agrupamos cada callback
     desse tipo em 1 disparo por frame, com records acumulados. */
  var ARCH_ATTRS = {
    'data-arch': 1, 'data-voice-arch': 1, 'data-theme': 1,
    'data-art-voice-active': 1, 'data-art': 1

    var A = window.KOBArch;
    if (!A || A.__perfPatched || typeof A.restartFrom !== 'function') return;
    A.__perfPatched = true;
    A.restartFrom = function (charIndex, newArch) {

   2 fetch guard único: URLs mortas · cache archetypes 24h · memo oEmbed SoundCloud
   3 PDF.js sob demanda (KOBLoadPDF)

   ═══════════════════════════════════════════════════════════════════════════ */
(function KOBPerf(){
  "use strict";

  /* [V86-PATCH] Silencia avisos do Tone.js que são intencionais:
     - "Max polyphony exceeded. Note dropped." → harmonia toca só 1ª e 3ª, espaço entre acordes é proposital
     - "Events scheduled inside of scheduled callbacks" → padrão conhecido do Transport, não é erro */
  (function(){
    var _warn = console.warn.bind(console);
    var _log = console.log.bind(console);
    function isIgnored(args){
      try {
        var msg = Array.prototype.join.call(args, ' ');
        if (msg.indexOf('Max polyphony exceeded') !== -1) return true;
        if (msg.indexOf('Events scheduled inside of scheduled callbacks') !== -1) return true;
      } catch(e){}
      return false;
    }
    console.warn = function(){ if(!isIgnored(arguments)) _warn.apply(console, arguments); };
    console.log = function(){ if(!isIgnored(arguments)) _log.apply(console, arguments); };
  })();
  if (window.KOB_PERF) return;
  var root = document.documentElement;
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function toast(m){ try{ window.KBLX_TOAST && window.KBLX_TOAST(m); }catch(e){} }
  function mm(q){ try{ return matchMedia(q).matches; }catch(e){ return false; } }

  /* 1 ── perf-lite ─────────────────────────────────────────── */
  var LITE_KEY = 'kob:perf:lite';
  var auto = !!(navigator.deviceMemory && navigator.deviceMemory <= 4)
          || mm('(prefers-reduced-motion: reduce)') || mm('(max-width: 760px)');
  var saved = lsGet(LITE_KEY);                       // só existe se o usuário escolheu
  root.classList.toggle('kob-perf-lite', saved == null ? auto : saved === '1');
  function isLite(){ return root.classList.contains('kob-perf-lite'); }
  function setLite(on){ root.classList.toggle('kob-perf-lite', !!on); lsSet(LITE_KEY, on ? '1' : '0'); syncUI(); toast('perf-lite: ' + (on ? 'ON' : 'OFF')); }
  function setFrozen(on){ root.classList.toggle('kob-frozen', !!on); syncUI(); toast(on ? '❄ congelado' : '▶ retomado'); }

  /* 2 ── fetch guard (um único wrapper) ───────────────────── */
  var DEAD   = [/oembed.*_0x01h_/, /oembed.*0x01_-kdx/, /oembed.*0x08-trilhas-set-governante/, /oembed.*ZaS4eux4tmpD0jSnyp/];

    var u = typeof input === 'string' ? input : (input && input.url) || String(input || '');

      }catch(e){}
      return _fetch.call(self, input, init).then(function(r){

        return r;
      });
    }
    if (/oembed/.test(u) && /soundcloud/i.test(u)){
      if (!sc[u]) sc[u] = _fetch.call(self, input, init).then(function(r){ if (!r.ok) delete sc[u]; return r; }, function(e){ delete sc[u]; throw e; });
      return sc[u].then(function(r){ return r.clone(); });
    }
    return _fetch.call(self, input, init);
  };

  var PDF = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/', pdfP = null;
  window.KOBLoadPDF = function(){

      var el = document.createElement('script');
      el.src = PDF + 'pdf.min.js';
      el.onload  = function(){ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDF + 'pdf.worker.min.js'; }catch(e){} res(window.pdfjsLib || null); };
      el.onerror = function(){ pdfP = null; res(null); };
      document.head.appendChild(el);
    });
    return pdfP;
  };

  /* 4 ── botões no Cockpit ────────────────────────────────── */
  function syncUI(){
    var a = document.getElementById('kobPerfToggle'), b = document.getElementById('kobPerfFreeze');
    if (a) a.textContent = 'perf-lite: ' + (isLite() ? 'ON' : 'OFF');

  function mountCockpit(){

    var row = document.createElement('div');
    row.className = 'cockpit-item'; row.id = 'kobPerfRow';
    row.innerHTML = '<div class="cockpit-label">⚡ Performance</div><div class="control-row">'
      + '<button class="btn-block" id="kobPerfToggle" type="button"></button>'
      + '<button class="btn-block" id="kobPerfFreeze" type="button"></button></div>';
    body.appendChild(row);
    document.getElementById('kobPerfToggle').onclick = function(){ setLite(!isLite()); };
    document.getElementById('kobPerfFreeze').onclick = function(){ setFrozen(!root.classList.contains('kob-frozen')); };
    syncUI();
  }
  document.addEventListener('DOMContentLoaded', mountCockpit);
  window.addEventListener('load', function(){ [300, 2500, 5000].forEach(function(t){ setTimeout(mountCockpit, t); }); });

  /* 5 ── diagnóstico ──────────────────────────────────────── */
  function report(){
    var rules = 0, sheets = document.styleSheets.length, mem = performance.memory;
    for (var i = 0; i < sheets; i++){ try{ rules += document.styleSheets[i].cssRules.length; }catch(e){} }

      nodes: document.getElementsByTagName('*').length, stylesheets: sheets, cssRules: rules,
      iframes: document.getElementsByTagName('iframe').length, imgs: document.images.length,
      scripts: document.scripts.length, lite: isLite(), frozen: root.classList.contains('kob-frozen')
    };
    console.log('%c[KOB-PERF]', 'background:#0af;color:#000;padding:2px 6px;border-radius:3px', o);
    return o;
  }
  window.KOB_PERF = {
    report: report, setLite: setLite, toggle: function(){ setLite(!isLite()); }, freeze: setFrozen,
    get lite(){ return isLite(); },
    clearCache: function(){ try{ localStorage.removeItem(AR_KEY); }catch(e){} sc = Object.create(null); }
  };
})();

body[data-voice-arch=bllue] {
  --kob-voice-primary:#3ab6ff;
  --kob-voice-secondary:#1E40AF;
}
#arch-bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(
      900px 700px at 50% 10%,
      color-mix(in srgb, var(--kob-voice-primary) 10%, transparent),
      transparent 80%),
    radial-gradient(
      600px 600px at 75% 95%,
      color-mix(in srgb, var(--kob-voice-secondary) 7%, transparent),
      transparent 80%);
  transition:background 0.18s ease;
}
.kob-orb-core {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background:
    radial-gradient(
      circle at 30% 30%,
      rgba(255, 255, 255, .85) 0%,
      rgba(255, 255, 255, .04) 10%,
      transparent 55%),
    radial-gradient(
      circle at 70% 70%,
      var(--kob-voice-primary) 0%,
      var(--kob-voice-secondary) 100%);
  box-shadow:
    0 0 40px color-mix(in srgb, var(--kob-voice-primary) 50%, transparent),
    0 0 80px color-mix(in srgb, var(--kob-voice-secondary) 25%, transparent),
    inset 0 0 30px rgba(255, 255, 255, .06);
  animation: kobOrbSpin var(--orb-speed) linear infinite;
  transition:box-shadow 0.18s ease, background 0.18s ease;
}
@keyframes kobOrbSpin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes kobOrbPulse {
  from {
    transform: scale(1);
  }
  to {
    transform: scale(1.12);
  }
}
.kob-orb-core.speaking {
  animation: kobOrbSpin 1.4s linear infinite, kobOrbPulse .4s ease-in-out infinite alternate !important;
}
body.speaking #orb-sphere {
  animation: kobOrbSpin 1.4s linear infinite, kobOrbPulse .4s ease-in-out infinite alternate !important;
}
#orb-sync-ring.playing {
  border-color: var(--kob-voice-primary) !important;
  box-shadow: 0 0 30px color-mix(in srgb, var(--kob-voice-primary) 60%, transparent), 0 0 60px color-mix(in srgb, var(--kob-voice-secondary) 30%, transparent) !important;
}
.orb-bg {
  display: none !important;
}

  font-size: 9px;

.ambient-light {
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  contain: strict;
  overflow: hidden;
}
.nova_blob,
.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  opacity: .10;
  animation: nova_float 25s infinite alternate ease-in-out;
  will-change: transform;
}
.nova_blob.orb-a,
.blob-1 {
  width: 40vw;
  height: 40vw;
  background: var(--kob-voice-primary);
  top: -15%;
  left: -15%;
}
.nova_blob.orb-b,
.blob-2 {
  width: 35vw;
  height: 35vw;
  background: var(--kob-voice-secondary);
  bottom: -15%;
  right: -15%;
  animation-delay: -5s;
}
@keyframes nova_float {
  from {
    transform: translate(0, 0);
  }
  to {
    transform: translate(30px, 40px);
  }
}
@keyframes float {
  from {
    transform: translate(0, 0);
  }
  to {
    transform: translate(30px, 40px);
  }
}
#serena_bg,
#bg-fake-custom {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-size: cover;
  background-position: center;
  opacity: var(--dv-bg-opacity);
  mix-blend-mode: var(--dv-bg-blend);
  transition:opacity .4s, mix-blend-mode .4s;
}
.lumine_camada,
.theme-layer {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: var(--dv-BG);
  transition:background 0.18s;
}
.lumine_grad,
.theme-grad {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background:
    radial-gradient(
      circle at 20% 10%,
      color-mix(in srgb, var(--vd-active-color) 9%, transparent),
      transparent 42%),
    radial-gradient(
      circle at 85% 60%,
      color-mix(in srgb, var(--vd-active-secondary) 7%, transparent),
      transparent 45%);
}
.lumine_grid,
.theme-grid {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  background-image:
    linear-gradient(var(--dv-GRID) 1px, transparent 1px),
    linear-gradient(
      90deg,
      var(--dv-GRID) 1px,
      transparent 1px);
  background-size: 52px 52px;
  mask-image:
    radial-gradient(
      circle at 50% 40%,
      #000 20%,
      transparent 75%);
  -webkit-mask-image:
    radial-gradient(
      circle at 50% 40%,
      #000 20%,
      transparent 75%);
}
#nova_loader,
#loader {
  position: fixed;
  inset: 0;
  background: var(--dv-BG);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  transition:opacity .7s ease, visibility .7s ease;
  pointer-events: auto;
}
#nova_loader.hide,
#nova_loader.kobllux_oculto,
#loader.hide,
#loader.kobllux_oculto {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.kobllux_loader_orb,
.loader-orb {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background:
    radial-gradient(
      circle at 35% 30%,
      var(--bllue-voice-primary) 0%,
      rgba(255, 255, 255, .05) 20%,
      transparent 55%),
    radial-gradient(
      circle at 70% 72%,
      var(--bllue-voice-secondary) 0%,
      var(--bllue-voice-primary) 100%);
  box-shadow: 0 0 60px var(--bllue-voice-primary), 0 0 120px var(--bllue-voice-secondary);
  animation: kobllux_orbSpin 7.2s linear infinite;
  position: relative;
}
.kobllux_loader_orb::after,
.loader-orb::after {
  content: "\2206";
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 40px;
  font-weight: 900;
  color: var(--dv-BG);
  animation: kobllux_orbSpin 7.2s linear infinite reverse;
}
@keyframes kobllux_orbSpin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes orbSpin {
  to {
    transform: rotate(360deg);
  }
}
#aion_progress,
.progress {
  position: fixed;
  left: 0;
  top: 0;
  height: 2px;
  background:
    linear-gradient(
      90deg,
      var(--vd-active-color),
      var(--vd-active-secondary));
  z-index: 200;
  width: 0;
  transition:width .15s linear;
}
#pulse_chroma,
.chroma-ripple {
  position: fixed;
  inset: 0;
  z-index: 8999;
  pointer-events: none;
  opacity: 0;
  background:
    radial-gradient(
      circle at var(--pulse-x,var(--ripple-x,50%)) var(--pulse-y,var(--ripple-y,50%)),
      var(--bllue-voice-primary) 0%,
      color-mix(in srgb, var(--bllue-voice-secondary) 60%, transparent) 30%,
      transparent 70%);
}
#pulse_chroma.fire,
.chroma-ripple.fire {
  animation: pulse_chromaFire .75s var(--ease-smooth) forwards;
}
@keyframes pulse_chromaFire {
  0% {
    opacity: .24;
    transform: scale(.2);
  }
  40% {
    opacity: .18;
    transform: scale(1.4);
  }
  100% {
    opacity: 0;
    transform: scale(2.2);
  }
}
@keyframes chromaFire {
  0% {
    opacity: .24;
    transform: scale(.2);
  }
  40% {
    opacity: .18;
    transform: scale(1.4);
  }
  100% {
    opacity: 0;
    transform: scale(2.2);
  }
}
.atlas_stack,
.header-stack {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 2;
  padding-top: var(--dv-safe-top);
  background: transparent;
  overflow: hidden;
  pointer-events: none;
}
.atlas_topbar,
.sys-topbar {
  position: relative;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 6px var(--dv-gutter);
  min-height: var(--atlas-sysbar-h);
  background:
    linear-gradient(
      180deg,
      color-mix(in srgb, var(--dv-BG) 96%, transparent),
      color-mix(in srgb, var(--dv-BG) 72%, transparent));
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--dv-LINE);
  pointer-events: auto;
}
.atlas_header,
.main-header {
  position: absolute;
  top: calc(var(--dv-safe-top) + var(--atlas-sysbar-h));
  left: 0;
  right: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px var(--dv-gutter);
  min-height: var(--atlas-header-h);
  background:
    linear-gradient(
      180deg,
      color-mix(in srgb, var(--dv-BG) 96%, transparent),
      color-mix(in srgb, var(--dv-BG) 72%, transparent));
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--dv-LINE);
  pointer-events: auto;
  transition:transform .28s var(--ease-standard), opacity .22s ease;
  transform: translateY(0);
  opacity: 1;
}
.atlas_header.header-hidden,
.main-header.header-hidden {
  transform: translateY(calc(-1 * (var(--atlas-sysbar-h) + var(--atlas-header-h))));
  opacity: 0;
  pointer-events: none;
}
.atlas_brand,
.sys-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--dv-DIM);
  font-weight: 800;
  flex-shrink: 0;
}
.atlas_brand-dot,
.brand-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--vd-active-color);
  box-shadow: 0 0 10px var(--vd-active-color);
  animation: pulse_beat 2s infinite;
  flex-shrink: 0;
}
@keyframes pulse_beat {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: .35;
  }
}
@keyframes pulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: .35;
  }
}
.atlas_actions,
.sys-actions {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-shrink: 0;
}
.genus_icon-btn,
.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  border: 1px solid var(--dv-CARD-BRD);
  background: var(--dv-CARD);
  color: var(--dv-FG);
  cursor: pointer;
  font-size: 14px;
  display: grid;
  place-items: center;
  transition:.2s;
  flex-shrink: 0;
}
.genus_icon-btn:hover,
.icon-btn:hover {
  background: color-mix(in srgb, var(--bllue-voice-primary) 15%, transparent);
  border-color: color-mix(in srgb, var(--bllue-voice-primary) 45%, transparent);
}
.genus_icon-btn.lumine_tema-dot::before,
.icon-btn.theme-dot::before {
  content: "";
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--bllue-voice-primary);
  box-shadow: 0 0 10px var(--bllue-voice-primary);
}
.atlas_navrow,
.win-navrow {
  display: flex;
  gap: 5px;
  align-items: center;
  flex: 1;
  min-width: 0;
  padding: 2px 5px;
  border-radius: 11px;
  background: var(--dv-CARD);
  border: 1px solid var(--dv-CARD-BRD);
}
.atlas_urlbar,
.win-urlbar {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: 0;
  outline: none;
  color: var(--dv-FG);
  font-family: var(--kodux-mono);
  font-size: 11px;
  padding: 6px;
}
.atlas_urlbar::placeholder,
.win-urlbar::placeholder {
  color: color-mix(in srgb, var(--dv-FG) 40%, transparent);
}
.atlas_gobtn,
.win-go-btn {
  padding: 5px 10px;
  border-radius: 9px;
  border: 1px solid color-mix(in srgb, var(--bllue-voice-primary) 40%, transparent);
  background: color-mix(in srgb, var(--bllue-voice-primary) 12%, transparent);
  color: var(--bllue-voice-primary);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .1em;
  cursor: pointer;
  font-family: inherit;
  flex-shrink: 0;
}
.kobllux_launcher,
.launcher-btn {
  width: 34px;
  height: 34px;
  border-radius: 11px;
  border: 1px solid var(--dv-CARD-BRD);
  background: var(--dv-CARD);
  color: var(--bllue-voice-primary);
  cursor: pointer;
  font-size: 14px;
  flex-shrink: 0;
}
.kobllux_pills,
.top-pills {
  display: flex;
  gap: 5px;
  align-items: center;
  flex-shrink: 0;
}
.kobllux_pill,
.pill {
  font-size: 9px;
  letter-spacing: .12em;
  text-transform: uppercase;
  font-weight: 800;
  padding: 4px 9px;
  border-radius: 999px;
  border: 1px solid var(--dv-CARD-BRD);
  background: var(--dv-CARD);
  color: var(--dv-DIM);
  font-family: var(--kodux-mono);
  white-space: nowrap;
}
.kobllux_pill.jesus_arch,
.pill.arch {
  border-color: color-mix(in srgb, var(--bllue-voice-primary) 50%, transparent);
  color: var(--bllue-voice-primary);
  background: color-mix(in srgb, var(--bllue-voice-primary) 12%, transparent);
}
@media (max-width: 520px) {
  .kobllux_pills .kobllux_pill:not(.jesus_arch),
  .top-pills .pill:not(.arch) {
    display: none;
  }
}
.genus_app,
.app {
  position: relative;
  z-index: 3;
  width: 100%;
  margin: 0 auto;
  min-height: 100vh;
  padding: calc(var(--atlas-sysbar-h) + var(--atlas-header-h) + var(--dv-safe-top) + 20px) 0 110px;
  overflow: hidden;
}
.genus_almasliber,
.genus_shell,
.almasliber,
.shell {
  position: relative;
  width: 100%;
  min-width: 0;
}
.atlas_hero,
.hero {
  position: relative;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 50px var(--dv-gutter) 30px;
  overflow: hidden;
}
.atlas_hero-layer,
.hero-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.atlas_layer-ring,
.layer-ring {
  border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--vd-active-color) 18%, transparent);
  left: 50%;
  top: 50%;

}
.ring-1 {
  width: 300px;

.ring-3 {
  width: 600px;

.ring-4 {

}
.atlas_layer-orb,
.layer-orb {
  position: absolute;
  border-radius: 50%;

  opacity: .42;
}
.orb-a {
  width: 220px;
  height: 220px;
  background: var(--vd-active-color);
  top: 15%;
  left: -60px;
}
.orb-b {
  width: 260px;
  height: 260px;

}
.orb-c {
  width: 180px;
  height: 180px;
  background: var(--vd-KBLX_F);
  top: 45%;
  right: 20%;
}
.atlas_hero-content,
.hero-content {
  position: relative;
  z-index: 5;
  text-align: center;
  width: 100%;
}
.jesus_kicker,
.kicker {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  letter-spacing: .22em;
  text-transform: uppercase;

  border-radius: 999px;
  border: 1px solid var(--dv-CARD-BRD);

.jesus_kicker span,
.kicker span {

.jesus_word-main,
.word-main {
  font-size: clamp(32px, 9vw, 52px);

  line-height: 1;
  background:
    linear-gradient(
      180deg,
      var(--dv-FG),
      color-mix(in srgb, var(--dv-FG) 75%, transparent));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  position: relative;
}
.jesus_word-main::after,
.word-main::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -8px;
  transform: translateX(-50%);
  width: 70px;
  height: 2px;
  background:
    linear-gradient(
      90deg,
      transparent,
      var(--bllue-voice-primary),
      transparent);
}
.jesus_dual-scripts,
.dual-scripts {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-top: 20px;
  align-items: center;
}
.jesus_script-hi,
.script-hi {
  font-size: 20px;

}
.jesus_script-ur,
.script-ur {

  color: var(--vd-KBLX_N);
  text-shadow: 0 0 24px rgba(6, 182, 212, .35);

.jesus_meaning-short,
.meaning-short {
  margin-top: 18px;
  font-size: 11px;
  color: var(--dv-DIM);

  margin-left: auto;
  margin-right: auto;
  font-family: var(--kodux-mono);
}
#jesus_trinity,
#trinityBar {
  position: relative;
  z-index: 5;
  display: flex;
  align-items: stretch;
  justify-content: center;
  gap: 5px;
  padding: 6px var(--dv-gutter) 10px;
  width: 100%;
}
.jesus_tri-seg,
.tri-seg {
  flex: 1;
  max-width: 180px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 7px 5px;
  border-radius: 12px;
  border: 1px solid var(--dv-CARD-BRD);
  background: var(--dv-CARD);

}
.jesus_tri-seg.active,
.jesus_tri-seg.atlas_active,
.tri-seg.active {
  opacity: 1;
  border-color: var(--jesus-tri-c,var(--tri-c,var(--vd-active-color)));

.jesus_tri-seg.jesus_tri-master,
.jesus_tri-seg.jesus_master,

.jesus_tri-seg[data-tri=DUO],

.jesus_tri-k,
.tri-k {

.jesus_tri-n,
.tri-n {
  font-size: 11px;
  font-weight: 800;
  color: var(--dv-FG);

}
.jesus_tri-r,
.tri-r {
  font-family: var(--kodux-mono);

.jesus_tri-v,

.jesus_tri-arrow,
.tri-arrow {

  .tri-v {
    display: none;
  }

.genus_section,
.section {
  padding: 20px var(--dv-gutter) 0;
  position: relative;
  width: 100%;
}
.genus_section-head,
.section-head {
  display: flex;

  gap: 10px;
  margin-bottom: 12px;
}
.genus_section-num,
.section-num {
  font-size: 10px;
  letter-spacing: .2em;
  color: var(--bllue-voice-primary);

  font-family: var(--kodux-mono);

.genus_section-title,
.section-title {
  font-size: 18px;

  color: var(--dv-FG);
}
.genus_section-sub,
.section-sub {
  font-size: 11px;

}
.genus_dose,
.dose {
  position: relative;
  padding: 16px 14px;
  border: 1px solid var(--dv-CARD-BRD);

}
.genus_dose::before,
.dose::before {
  content: "";
  position: absolute;

  top: 0;
  bottom: 0;

    linear-gradient(
      180deg,
      var(--genus-arch-color,var(--arch-color,var(--vd-active-color))),
      transparent);

}
textarea {
  width: 100%;
  min-height: 130px;
  resize: vertical;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid var(--dv-CARD-BRD);
  background: color-mix(in srgb, var(--dv-BG) 60%, transparent);
  color: var(--dv-FG);

}
textarea:focus {

.aion_counter,
.counter {
  font-size: 9px;
  color: var(--dv-DIM);
  font-family: var(--kodux-mono);
}
.genus_input-head,
.input-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.genus_label,
.label {
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--dv-DIM);
}
.genus_actions,
.actions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 7px;
  margin-top: 8px;
}
.genus_action,
.action {
  min-height: 42px;
  padding: 9px 10px;
  border: 1px solid var(--dv-CARD-BRD);

  border-color:rgba(255,255,255,.16);

.tab-switcher-panel .panel-actions button:active{
  transform:scale(.96);
}

/* GRID */

.tab-grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(210px,1fr));

  gap:10px;
}

/* CARD */

.tab-card{
  position:relative;
  min-height:126px;

  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  gap:7px;

  padding:15px;

  overflow:hidden;

  border:1px solid rgba(255,255,255,.075);
  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.065),
      rgba(255,255,255,.025)
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.035);

  cursor:pointer;

  transition:transform .18s ease,
    border-color 0.18s ease,
    background 0.18s ease,
    box-shadow 0.18s ease;
}

.tab-card::before{
  content:"";
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle at 15% 0%,
      rgba(0,229,255,.11),
      transparent 48%
    );

  opacity:0;
  transition:opacity .18s ease;
  pointer-events:none;
}

.tab-card:hover{
  transform:translateY(-2px);
  border-color:rgba(0,229,255,.20);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.035)
    );

  box-shadow:
    0 12px 30px rgba(0,0,0,.24);
}

.tab-card:hover::before{
  opacity:1;
}

/* ACTIVE */

.tab-card.active{
  border-color:rgba(0,229,255,.48);

  background:
    linear-gradient(
      145deg,
      rgba(0,229,255,.12),
      rgba(255,255,255,.035)
    );

  box-shadow:
    0 0 0 1px rgba(0,229,255,.08),
    0 12px 35px rgba(0,0,0,.28),
    inset 0 0 30px rgba(0,229,255,.035);
}

.tab-card.active::after{
  content:"ATIVA";

  position:absolute;
  top:11px;
  left:12px;

  padding:4px 7px;

  border-radius:999px;

  background:rgba(0,229,255,.10);
  border:1px solid rgba(0,229,255,.18);

  color:#00e5ff;

  font-size:8px;
  font-weight:800;
  letter-spacing:.08em;
}

/* ICON / ORB */

.tab-card::marker{
  display:none;
}

.tab-card .tab-icon{
  width:38px;
  height:38px;

  display:grid;
  place-items:center;

  margin-bottom:auto;

  border-radius:13px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.10),
      rgba(255,255,255,.035)
    );

  border:1px solid rgba(255,255,255,.08);

  font-size:18px;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07);
}

/* TITLE */

.tab-card .tab-title{
  position:relative;
  z-index:1;

  padding-right:28px;

  font-size:13px;
  line-height:1.2;
  font-weight:720;

  color:#fff;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* URL */

.tab-card .tab-url{
  position:relative;
  z-index:1;

  font-size:9px;
  line-height:1.25;

  color:rgba(255,255,255,.43);

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* STATE */

.tab-card .tab-state{
  position:absolute;
  right:12px;
  bottom:13px;

  display:flex;
  align-items:center;
  gap:5px;

  font-size:8px;
  font-weight:750;
  letter-spacing:.05em;

  color:rgba(255,255,255,.42);
}

.tab-card .tab-state-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#777;
}

.tab-card[data-state="active"] .tab-state-dot{
  background:#39ffb6;
  box-shadow:0 0 8px rgba(57,255,182,.6);
}

.tab-card[data-state="loading"] .tab-state-dot{
  background:#00e5ff;
  animation:tabStatePulse 1s infinite;
}

.tab-card[data-state="idle"] .tab-state-dot{
  background:#ffd60a;
}

.tab-card[data-state="suspended"] .tab-state-dot{
  background:#ff6b6b;
}

.tab-card[data-keepalive="true"] .tab-state::after{
  content:" · KEEP";
  color:#00e5ff;
}

@keyframes tabStatePulse{
  50%{opacity:.3;transform:scale(.65)}
}

/* CLOSE */

.tab-card .tab-close{
  position:absolute;
  top:9px;
  right:9px;

  width:28px;
  height:28px;

  display:grid;
  place-items:center;

  border:1px solid rgba(255,255,255,.07);
  border-radius:10px;

  background:rgba(0,0,0,.18);
  color:rgba(255,255,255,.45);

  opacity:0;

  cursor:pointer;

  transition:opacity .15s ease,
    background 0.15s ease,
    color 0.15s ease;
}

.tab-card:hover .tab-close,
.tab-card:focus-within .tab-close{
  opacity:1;
}

.tab-card .tab-close:hover{
  background:rgba(255,70,90,.14);
  color:#ff6b6b;
}

/* FAVORITE */

.tab-card .tab-fav{
  position:absolute;
  top:10px;
  left:10px;

  width:27px;
  height:27px;

  display:grid;
  place-items:center;

  border:0;
  background:transparent;

  color:rgba(255,255,255,.3);

  opacity:.7;
}

.tab-card .tab-fav.active{
  color:#ffd60a;
  opacity:1;
}

/* EMPTY */

.tab-empty{
  grid-column:1/-1;

  padding:42px 20px;

  text-align:center;

  border:
    1px dashed rgba(255,255,255,.10);

  border-radius:20px;

  background:rgba(255,255,255,.025);
}

.tab-empty-icon{
  font-size:34px;
  margin-bottom:8px;
  opacity:.5;
}

.tab-empty-title{
  font-size:14px;
  font-weight:700;
}

.tab-empty-text{
  margin-top:5px;
  font-size:11px;
  color:rgba(255,255,255,.42);
}

/* MOBILE */

@media(max-width:600px){

  .tab-switcher-overlay{
    padding:
      calc(8px + var(--safe-top,0px))
      8px
      calc(8px + var(--safe-bottom,0px));
    align-items:flex-end;
  }

  .tab-switcher-panel{
    width:100%;
    max-height:92dvh;
    border-radius:25px;
    padding:12px;
  }

  .tab-grid{
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  .tab-card{
    min-height:118px;
    padding:12px;
    border-radius:17px;
  }

  .tab-card .tab-close{
    opacity:1;
  }
}

@media(max-width:390px){
  .tab-grid{
    grid-template-columns:1fr;
  }
}

.topbar {
    position:
        fixed;
    top:
        0;
    left:
        0;

        1000;
    display:

    transform:

    transition:transform
        .32s

        var(--transition);

#kobVoiceBaseSelect { width:100%; min-height:42px; color:inherit; background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:9px 11px; font:inherit; }
#kobVoiceBaseStatus { display:block; margin-top:7px; font-size:11px; line-height:1.45; opacity:.66; }
#kobVoiceBaseTest { margin-top:8px; min-height:36px; border:1px solid rgba(255,255,255,.16); border-radius:999px; padding:7px 13px; background:rgba(255,255,255,.055); color:inherit; }
</style>


<style id="kob-session-glass-v1">
/* [V5.11] session windows flutuantes: fundo transparente, só backdrop (sem sombra). Cards de pílula não são afetados.
   Mais específico que isto: html.kob-perf-lite continua desligando o blur (modo leve). */
.session-window,.mxp-window{
  background:transparent !important;
  -webkit-backdrop-filter:blur(var(--kob-glass-blur,14px)) saturate(150%) !important;
  backdrop-filter:blur(var(--kob-glass-blur,14px)) saturate(150%) !important;
}
html[data-glass="off"] .session-window,html[data-glass="off"] .mxp-window{-webkit-backdrop-filter:none !important;backdrop-filter:none !important}
#readerBody iframe.html-frame{width:100%;height:72vh;border:0;border-radius:12px;background:#fff}
.session-window .win-hdr,.session-window .win-frame,.mxp-window .win-frame{background:transparent !important}
</style>
<style id="kob-fix-btn-no-shadow-v1">
/* FIX perf: hover/active de botões não desenham box-shadow/drop-shadow/filter (repaint caro).
   Feedback visual fica por conta de cor/borda/opacidade, que não geram camada de blur. */

:is(button,[role="button"],.btn,.nav-btn,.btn-create,.btn-save,.orb-btn,.trigger-btn,.toggleBtn,.symbol-button,.theme-dot,.header-orb){

#pillsSection .card.is-seed .card-acts [data-ca="fuse"]{border-color:var(--kob-L-fuse-a,var(--kob-voice-primary,#7bf3ff));color:var(--kob-L-fuse-a,#fff)}

<body>
  
  <style id="kob-color-override">
/* ═══════════════════════════════════════════════════════════════
   KOBLLUX · Color Override Patch (minimal)
   Respeita data-user / arquétipo ativo via KOBLayers.
   Uso: injetar este CSS em qualquer versão (v4+) depois de todo
   o estilo original. NÃO mexe na estrutura HTML — só override.
   ── Variáveis resolvidas ──
   --kob-L-primary   = primária do usuário (estável, identidade)
   --kob-L-secondary = secundária do arquétipo ativo (segue troca)
   --kob-L-u1/u2     = cores brutas do usuário
   --kob-L-a1/a2     = cores brutas do arquétipo ativo
   ═══════════════════════════════════════════════════════════════ */

:root{
  --kob-v5-user:var(--kob-L-primary,var(--kob-voice-primary,#22D3EE));
  --kob-v5-user-2:var(--kob-L-u2,var(--kob-L-secondary,#0E7C9E));
  --kob-v5-arch:var(--kob-L-secondary,var(--kob-voice-secondary,#b68cff));
  --kob-v5-arch-2:var(--kob-L-a2,var(--kob-v5-arch));
}

/* ── Botão DT / nav-cta → TRAVADO na primária do usuário ── */
.nav-cta,
#navDualTube,
#navMente,
#navStep{
  --kob-v5-c:var(--kob-v5-user);
  color:var(--kob-v5-c) !important;
  border-color:color-mix(in srgb, var(--kob-v5-c) 55%, transparent) !important;
  background:color-mix(in srgb, var(--kob-v5-c) 14%, transparent) !important;
  transition:background .18s, border-color .18s, transform .14s;
}
.nav-cta:hover{
  background:color-mix(in srgb, var(--kob-v5-c) 26%, transparent) !important;
  border-color:color-mix(in srgb, var(--kob-v5-c) 80%, transparent) !important;
}
.nav-cta:active{ transform:scale(.94); }

/* nav-dot ativa trava no user-primary */
.nav-dot.on{ background:var(--kob-v5-user) !important; }

/* ── Slot footer = carrossel lateral (scroll-snap, igual topo) ──
   (CSS apenas, não remove elemento nenhum) */
.mxp-footer-slot,
.genus_footer-slot{
  flex:1 1 auto !important;
  flex-wrap:nowrap !important;
  overflow-x:auto !important;
  overflow-y:hidden !important;
  scroll-snap-type:x mandatory !important;
  scrollbar-width:none !important;
  -webkit-overflow-scrolling:touch !important;
  padding:2px 2px 4px !important;
  min-width:0 !important;
  mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);
}
.mxp-footer-slot::-webkit-scrollbar,
.genus_footer-slot::-webkit-scrollbar{ display:none !important; }
.mxp-footer-slot .mxp-slot,
.genus_footer-slot .mxp-slot{
  display:flex !important;
  flex-direction:row !important;
  flex-wrap:nowrap !important;
  gap:6px !important;
  align-items:center !important;
}
.mxp-btn.slot-footer,
.genus_btn.genus_footer-slot{
  flex:0 0 auto !important;
  scroll-snap-align:start !important;
  white-space:nowrap !important;
  /* SEGUE arquétipo ativo (secundária) — contrasta com DT travado no user */
  --kob-v5-c:var(--kob-v5-arch);
  border-color:color-mix(in srgb, var(--kob-v5-c) 45%, transparent) !important;
  background:color-mix(in srgb, var(--kob-v5-c) 10%, transparent) !important;
  color:color-mix(in srgb, var(--kob-v5-c) 85%, #fff) !important;
  transition:border-color .18s, background .18s, box-shadow .18s;
}
.mxp-btn.slot-footer .mxp-icon,
.genus_btn.genus_footer-slot .genus_icon{
  color:var(--kob-v5-user) !important;  /* ícone trava no user-primary */
}
.mxp-btn.slot-footer:hover,
.genus_btn.genus_footer-slot:hover{
  border-color:color-mix(in srgb, var(--kob-v5-c) 75%, transparent) !important;
  background:color-mix(in srgb, var(--kob-v5-c) 20%, transparent) !important;
}
.mxp-btn.slot-footer.is-firing,
.genus_btn.genus_footer-slot.is-firing{
  box-shadow:0 0 0 3px color-mix(in srgb, var(--kob-v5-c) 55%, transparent),
             0 0 24px color-mix(in srgb, var(--kob-v5-c) 45%, transparent) !important;
}

/* ── Bordas globais: tudo que tem borda recebe tom do arquétipo ── */
:root{
  --CARD-BRD:color-mix(in srgb, var(--kob-v5-arch) 28%, rgba(255,255,255,.08)) !important;
  --dv-CARD-BRD:color-mix(in srgb, var(--kob-v5-arch) 28%, rgba(255,255,255,.08)) !important;
}
.pill, .action, .sb-act, .win-slot-bar .mxp-btn.slot-session{
  border-color:color-mix(in srgb, var(--kob-v5-arch) 40%, transparent) !important;
  transition:border-color .18s, background .18s;
}
.card, details.section, .win, .monolith, .mono-header{
  border-color:color-mix(in srgb, var(--kob-v5-arch) 22%, rgba(255,255,255,.07)) !important;
}
input, textarea, select{
  border-color:color-mix(in srgb, var(--kob-v5-user) 35%, transparent) !important;
  transition:border-color .18s, box-shadow .18s;
}
input:focus, textarea:focus, select:focus{
  border-color:var(--kob-v5-user) !important;
  outline:none;
  box-shadow:0 0 0 2px color-mix(in srgb, var(--kob-v5-user) 30%, transparent);
}

/* ── Botões header/aside → travados no user-primary ── */
.mxp-btn.slot-header, .mxp-btn.slot-aside,
#symbolBar .sb-extras .mxp-btn,
#symbolBar .sb-act{
  --kob-v5-c:var(--kob-v5-user);
  border-color:color-mix(in srgb, var(--kob-v5-c) 40%, transparent) !important;
  color:color-mix(in srgb, var(--kob-v5-c) 80%, #fff) !important;
}
.mxp-btn.slot-header .mxp-icon, .mxp-btn.slot-aside .mxp-icon{
  color:var(--kob-v5-c) !important;
}

/* ── Botões secundários (pill sm, action genérico) → seguem arquétipo ── */
.pill.sm, .action:not(.slicer):not(.audio){
  --kob-v5-c:var(--kob-v5-arch);
  border-color:color-mix(in srgb, var(--kob-v5-c) 45%, transparent) !important;
  color:color-mix(in srgb, var(--kob-v5-c) 85%, #fff) !important;
}

/* ── Pulse bar do footer segue user-primary ── */
.mono-footer #pulseBar,
#pulseBar{
  background:linear-gradient(90deg,transparent,var(--kob-v5-user),transparent) !important;
}

.mxp-footer-slot{ scroll-padding-left:4px; }

</style>
<script id="kob-color-override-js">
/* ═══════════════════════════════════════════════════════════════
   KOBLLUX · Color Override Patch — JS mínimo
   Uso: injetar DEPOIS do kob-profile-player-voice (KOBLayers).
   Não mexe em estrutura — só garante que as vars --kob-v5-*
   sejam re-resolvidas ao trocar arquétipo e dá fallback de
   toque no carrossel do footer.
   ═══════════════════════════════════════════════════════════════ */
(function(){
  "use strict";

  /* Feedback tátil nos nav-cta (DT / Mente / Step) */
  document.querySelectorAll('.nav-cta').forEach(function(btn){
    if(btn.dataset.kobV5Bound) return;
    btn.dataset.kobV5Bound='1';
    btn.addEventListener('click',function(){
      try{ btn.style.transform='scale(.94)'; setTimeout(function(){btn.style.transform='';},140); }catch(_){}
    });
  });

  /* Fallback de scroll touch no slot footer (carrossel) */
  var slot=document.querySelector('.mxp-footer-slot');
  if(slot){
    var downX=null,scrollLeft=0;
    slot.addEventListener('touchstart',function(e){ downX=e.touches[0].clientX; scrollLeft=slot.scrollLeft; },{passive:true});
    slot.addEventListener('touchmove',function(e){
      if(downX===null)return;
      slot.scrollLeft=scrollLeft-(e.touches[0].clientX-downX);
    },{passive:true});
    slot.addEventListener('touchend',function(){ downX=null; },{passive:true});
  }

  /* Ao trocar arquétipo, KOBLayers.refresh reescreve --kob-L-*.
     Como nossas vars --kob-v5-* apontam pra elas via var(), o CSS
     já resolve sozinho. Este wrapper só força um repaint leve
     para navegadores que não propagam var() aninhada na hora. */
  try{
    if(window.KOBLayers && typeof window.KOBLayers.refresh==='function'){
      var orig=window.KOBLayers.refresh;
      window.KOBLayers.refresh=function(){
        var r=orig.apply(this,arguments);
        try{
          var el=document.documentElement;
          el.style.setProperty('--kob-v5-reflow','1');
          setTimeout(function(){ try{ el.style.removeProperty('--kob-v5-reflow'); }catch(_){} },30);
        }catch(_){}
        return r;
      };
    }
  }catch(_){}
})();

</script>
