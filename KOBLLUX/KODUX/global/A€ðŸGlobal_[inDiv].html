  <style> @import "https://infodose.com.br/oiDual/KODUX/78K/APPS/78GLOBAL/dual-global-bundle-m0d/css/bundle.css"; </style>



    <script
      type="module"
      src="https://www.infodose.com.br/js/modules/kob-outline-uni-3.js">
    </script>

  <script>
  (function DUAL_UNIFIED_CORE(global) {
    'use strict';

    if (global.DUAL_CORE_READY) return;
    global.DUAL_CORE_READY = true;

    const ROOT = document.documentElement;
    const getBody = () => document.body;

    /* 17 ARQUÉTIPOS UNIFICADOS */
    const ARCHETYPES = {
      KOBLLUX:  { n:'KOBLLUX',  sym:'△', hz:528, opcode:'0x0C', regra:'CONCLUIR',   v:'Luciana', l:'pt-BR', r:0.98,  p:0.48, c1:'#22D3EE', c2:'#0E7C9E', sig:[57,[0,3,7,10,14,10],0.15,0.09,'triangle'] },
      ATLAS:    { n:'ATLAS',    sym:'▦', hz:432, opcode:'0x02', regra:'INTEGRAR',   v:'Daniel',  l:'en-US', r:1.02,  p:1.39, c1:'#78E3FF', c2:'#B978FF', sig:[57,[0,4,7,12,7,4],0.12,0.09,'triangle'] },
      NOVA:     { n:'NOVA',     sym:'✧', hz:528, opcode:'0x01', regra:'PULSAR',     v:'Luciana', l:'pt-BR', r:1.063, p:1.34, c1:'#FF6FB5', c2:'#FFB347', sig:[57,[0,7,11,16,11],0.15,0.08,'sine'] },
      VITALIS:  { n:'VITALIS',  sym:'≠', hz:528, opcode:'0x03', regra:'EXPANDIR',   v:'Rocko',   l:'pt-BR', r:0.96,  p:1.42, c1:'#00F5A0', c2:'#45B7D1', sig:[57,[0,7,4,0,-5],0.10,0.05,'triangle'] },
      PULSE:    { n:'PULSE',    sym:'♫', hz:639, opcode:'0x0B', regra:'RESSONAR',   v:'Reed',    l:'pt-BR', r:1.00,  p:1.78, c1:'#A259FF', c2:'#D4A5A5', sig:[45,[0,3,7,10,7,3],0.12,0.06,'square'] },
      ARTEMIS:  { n:'ARTEMIS',  sym:'🏹', hz:432, opcode:'0x05', regra:'FOCAR',      v:'Paulina', l:'es-MX', r:1.00,  p:1.23, c1:'#FFD93D', c2:'#FF9F1C', sig:[45,[0,3,7,12,15],0.14,0.08,'sine'] },
      SERENA:   { n:'SERENA',   sym:'❀', hz:528, opcode:'0x06', regra:'ACOLHER',    v:'Joana',   l:'pt-BR', r:0.92,  p:0.90, c1:'#B8E1FF', c2:'#A0B9FF', sig:[57,[0,4,9,14,9,4],0.16,0.10,'sine'] },
      KAOS:     { n:'KAOS',     sym:'☢', hz:741, opcode:'0x04', regra:'DISSOLVER',  v:'Rocko',   l:'pt-BR', r:1.28,  p:0.67, c1:'#FF5C8A', c2:'#B624FF', sig:[33,[0,1,3,8,3,1,0],0.09,0.04,'sawtooth'] },
      GENUS:    { n:'GENUS',    sym:'◈', hz:528, opcode:'0x07', regra:'CONSTRUIR',  v:'Reed',    l:'pt-BR', r:0.98,  p:1.20, c1:'#95E1D3', c2:'#F38181', sig:[45,[0,3,7,8,7,3],0.13,0.08,'sine'] },
      LUMINE:   { n:'LUMINE',   sym:'☀', hz:528, opcode:'0x08', regra:'ILUMINAR',   v:'Flo',     l:'fr-FR', r:1.03,  p:1.87, c1:'#F9F3B2', c2:'#FFE69B', sig:[57,[0,4,9,12,16,12],0.11,0.06,'triangle'] },
      SOLUS:    { n:'SOLUS',    sym:'☉', hz:432, opcode:'0x09', regra:'CONTEMPLAR', v:'Satu',    l:'fi-FI', r:0.90,  p:0.58, c1:'#FFB347', c2:'#FF8C42', sig:[45,[0,2,7,2,-5],0.20,0.14,'sine'] },
      RHEA:     { n:'RHEA',     sym:'☾', hz:528, opcode:'0x0A', regra:'NUTRIR',     v:'Alice',   l:'it-IT', r:1.02,  p:1.44, c1:'#B5EAEA', c2:'#80B3FF', sig:[57,[0,5,7,12,7,5,0],0.13,0.09,'sine'] },
      AION:     { n:'AION',     sym:'∞', hz:963, opcode:'0x0D', regra:'TRANSCENDER',v:'Milena',  l:'ru-RU', r:1.07,  p:1.08, c1:'#C79AFF', c2:'#9F7AFF', sig:[45,[0,3,8,12,8,3],0.14,0.09,'sine'] },
      KODUX:    { n:'KODUX',    sym:'⌂', hz:528, opcode:'0x02', regra:'CODIFICAR',  v:'Rocko',   l:'pt-BR', r:1.00,  p:0.07, c1:'#F97316', c2:'#FB923C', sig:[33,[0,3,6,3,0,-5],0.10,0.05,'sawtooth'] },
      BLLUE:    { n:'BLLUE',    sym:'≈', hz:432, opcode:'0x0B', regra:'FLUIR',     v:'Zuzana',  l:'cs-CZ', r:0.94,  p:1.69, c1:'#3AB6FF', c2:'#B8E1FF', sig:[45,[0,3,7,6,3,0],0.12,0.07,'triangle'] },
      JESUS:    { n:'JESUS',    sym:'✝', hz:888, opcode:'0x0E', regra:'UNIFICAR',   v:'Sara',    l:'da-DK', r:1.09,  p:0.03, c1:'#FFD700', c2:'#FFB84D', sig:[57,[0,7,12,19,12],0.22,0.16,'sine'] },
      INFODOSE: { n:'INFODOSE', sym:'💊', hz:528, opcode:'0x0F', regra:'SINTETIZAR', v:'Luciana', l:'pt-BR', r:1.06,  p:0.96, c1:'#22C55E', c2:'#166534', sig:[57,[0,2,5,7,9,12,9],0.11,0.06,'sine'] }
    };

    const ARCH_KEYS = Object.keys(ARCHETYPES);

    function getActiveArchKey() {
      const body = getBody();
      const raw = body?.dataset?.arch || 'KOBLLUX';
      const upper = String(raw).toUpperCase();
      return ARCHETYPES[upper] ? upper : 'KOBLLUX';
    }

    function hexToRgb(h) {
      h = String(h).replace('#', '');
      if (h.length === 3) h = h.split('').map(c => c + c).join('');
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }

    function mixHex(a, b, t) {
      const A = hexToRgb(a), B = hexToRgb(b);
      return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
    }

    function adjustForDayIfNeeded(hex, theme) {
      if (theme !== 'day') return hex;
      const [r, g, b] = hexToRgb(hex);
      const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return lum > 0.68 ? mixHex(hex, '#0f172a', 0.42) : hex;
    }

    /* KOBSONORO · MOTOR DE ÁUDIO & SFX ON/OFF */
    const KOBSonoro = global.KOBSonoro = global.KOBSonoro || {};
    const SND = { enabled: true, started: false, playing: false, part: null, synths: {}, reverb: null, delay: null };

    function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

    async function ensureAudio() {
      if (!SND.enabled) return false;
      if (SND.started) return true;
      if (typeof Tone === 'undefined') {
        await new Promise(r => {
          const t = setInterval(() => {
            if (typeof Tone !== 'undefined' || performance.now() > 6000) { clearInterval(t); r(); }
          }, 100);
        });
      }
      if (typeof Tone === 'undefined') return false;
      try {
        await Tone.start();
        const lim = new Tone.Limiter(-2).toDestination();
        SND.reverb = new Tone.Reverb({ decay: 3.2, wet: 0.38 }).connect(lim);
        SND.delay  = new Tone.FeedbackDelay('8n', 0.24).connect(SND.reverb);

        SND.synths.lead    = new Tone.PolySynth(Tone.Synth, { oscillator: { type: 'triangle' }, envelope: { attack: .02, decay: .3, sustain: .2, release: 1.1 } }).connect(SND.delay);
        SND.synths.lead.volume.value = -9;
        SND.synths.bubble  = new Tone.Synth({ oscillator: { type: 'sine' }, envelope: { attack: .01, decay: .14, sustain: 0, release: .2 } }).connect(SND.reverb);
        SND.synths.crystal = new Tone.PolySynth(Tone.FMSynth, { harmonicity: 3, modulationIndex: 6, envelope: { attack: .005, decay: .38, sustain: 0, release: 1.1 } }).connect(SND.reverb);
        SND.synths.impact  = new Tone.MembraneSynth({ pitchDecay: .05, octaves: 4, envelope: { attack: .001, decay: .28, sustain: 0, release: .38 } }).connect(lim);
        SND.synths.portal  = new Tone.Synth({ oscillator: { type: 'sawtooth' }, envelope: { attack: .15, decay: .4, sustain: .2, release: .8 } }).connect(SND.delay);

        SND.started = true;
        return true;
      } catch (_) { return false; }
    }

    function hslToBaseFreq(h1, h2) {
      return { f1: 200 + (h1 / 360) * 700, f2: 200 + (h2 / 360) * 700 };
    }

    KOBSonoro.sfx = async function(desc, colorCtx) {
      if (!SND.enabled) return false;
      if (!await ensureAudio()) return false;
      const body = getBody();
      const d = String(desc || '').toLowerCase();
      const now = Tone.now();
      const h1 = parseInt(colorCtx?.h1 || body?.dataset?.hue1 || '188', 10);
      const h2 = parseInt(colorCtx?.h2 || body?.dataset?.hue2 || '210', 10);
      const { f1, f2 } = hslToBaseFreq(h1, h2);

      try {
        if (/bolha|bubble|gota|pingo|click|nav/.test(d)) {
          const b = f1 * (0.85 + Math.random() * 0.3);
          SND.synths.bubble.triggerAttackRelease(b, .11, now);
          SND.synths.bubble.triggerAttackRelease(b * 1.48, .09, now + .075);
        } else if (/cristal|crystal|vidro|sino/.test(d)) {
          [f1, f1 * 1.5, f1 * 2].forEach((f, i) => {
            try { SND.synths.crystal.triggerAttackRelease(f, .28, now + i * .045); } catch (_) {}
          });
        } else if (/impacto|impact|pancada/.test(d)) {
          SND.synths.impact.triggerAttackRelease('C1', .22, now);
        } else if (/sopro|whoosh|swoosh|drag/.test(d)) {
          const swFilter = new Tone.Filter({ type: 'bandpass', frequency: f1 * 0.8, Q: 3.9 }).connect(SND.reverb);
          const swNoise  = new Tone.NoiseSynth({ noise: { type: 'pink' }, envelope: { attack: .22, decay: .16, sustain: .15, release: .34 } }).connect(swFilter);
          swFilter.frequency.setValueAtTime(f1 * 0.1, now);
          swFilter.frequency.exponentialRampToValueAtTime(f2 * 0.4, now + 0.26);
          swFilter.frequency.exponentialRampToValueAtTime(f1 * 0.1, now + 0.62);
          swNoise.triggerAttackRelease(0.38, now);
          setTimeout(() => { try { swNoise.dispose(); swFilter.dispose(); } catch (_) {} }, 1100);
        } else if (/portal|transition/.test(d)) {
          SND.synths.portal.frequency.cancelScheduledValues(now);
          SND.synths.portal.frequency.setValueAtTime(f1 * 0.5, now);
          SND.synths.portal.frequency.exponentialRampToValueAtTime(f2 * 2, now + .45);
          SND.synths.portal.triggerAttackRelease('A3', .36, now);
        } else {
          SND.synths.bubble.triggerAttackRelease(f2 * 0.9, .09, now);
          SND.synths.bubble.triggerAttackRelease(f2 * 1.35, .09, now + .07);
        }
        return true;
      } catch (_) { return false; }
    };

    KOBSonoro.transition = async function(archName) {
      if (!SND.enabled) return false;
      const key = String(archName || getActiveArchKey()).toUpperCase();
      const cfg = ARCHETYPES[key] || ARCHETYPES.KOBLLUX;
      const sig = cfg.sig;
      if (!await ensureAudio()) return false;
      try { SND.synths.lead.set({ oscillator: { type: sig[4] } }); } catch (_) {}
      try { SND.synths.lead.releaseAll(Tone.now()); } catch (_) {}
      let t = Tone.now() + 0.04;
      sig[1].forEach(off => {
        try { SND.synths.lead.triggerAttackRelease(mtof(sig[0] + off), sig[2], t); } catch (_) {}
        t += sig[3];
      });
      return true;
    };

    KOBSonoro.stop = function() {
      if (SND.part) { try { SND.part.dispose(); } catch (_) {} SND.part = null; }
      try { Tone.Transport.stop(); Tone.Transport.cancel(0); } catch (_) {}
      try { Object.keys(SND.synths).forEach(k => SND.synths[k]?.releaseAll?.()); } catch (_) {}
      SND.playing = false;
    };

    /* SISTEMA DE VOZ TTS POR ARQUÉTIPO */
    let voices = [];
    function loadVoices() {
      voices = ('speechSynthesis' in window) ? window.speechSynthesis.getVoices() : [];
    }
    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
      setTimeout(loadVoices, 400);
    }

    const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

    function findVoiceForArch(cfg) {
      if (!voices.length) loadVoices();
      const targetName = norm(cfg.v || '');
      const targetLang = norm(cfg.l || 'pt-BR').split('-')[0];
      return voices.find(v => norm(v.name).includes(targetName) && norm(v.lang).startsWith(targetLang))
          || voices.find(v => norm(v.lang).startsWith(targetLang))
          || voices.find(v => norm(v.lang).startsWith('pt'))
          || voices[0] || null;
    }

    function createUtterance(text, archName) {
      const key = String(archName || getActiveArchKey()).toUpperCase();
      const cfg = ARCHETYPES[key] || ARCHETYPES.KOBLLUX;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = cfg.l;
      u.rate = cfg.r;
      u.pitch = cfg.p;
      const v = findVoiceForArch(cfg);
      if (v) { u.voice = v; u.lang = v.lang || cfg.l; }
      return u;
    }

    /* KOB BUS · PONTE UNIVERSAL (PARENT + IFRAMES + TTS) */
    const BUS_STATE = { ttsEnabled: true, documents: new WeakSet(), lastText: '', lastTime: 0 };

    function cleanText(text) {
      return String(text || '').replace(/\u200B/g, '').replace(/\u00A0/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 1200);
    }

    function extractText(target) {
      if (!target || target.nodeType !== 1) return '';
      let el = target;
      if (['SVG', 'PATH', 'USE', 'LINE', 'POLYGON', 'CIRCLE', 'POLYLINE'].includes(el.tagName)) {
        el = el.closest?.('button,a,[role="button"]') || el.parentElement;
      }
      if (!el || ['SCRIPT', 'STYLE', 'NOSCRIPT', 'INPUT', 'TEXTAREA', 'SELECT', 'OPTION'].includes(el.tagName)) return '';
      if (el.closest?.('[data-kob-ignore],[data-tts-ignore],.kob-tts-ignore,#main-header,#cardHeader,.card-top-bar')) return '';

      const control = el.closest?.('button,a,[role="button"]');
      if (control) {
        if (control.hasAttribute('data-speak')) return cleanText(control.getAttribute('data-speak'));
        if (control.hasAttribute('data-kob-tts')) return cleanText(control.innerText || control.getAttribute('aria-label') || '');
        return '';
      }

      const block = el.closest?.('p,li,h1,h2,h3,h4,h5,h6,blockquote,pre,td,th,[data-kob-content]') || el;
      return cleanText(block.innerText || block.textContent || '');
    }

    function speakText(text, opts = {}) {
      if (!BUS_STATE.ttsEnabled && !opts.force) return false;
      text = cleanText(text);
      if (text.length < 2) return false;

      const now = Date.now();
      if (text === BUS_STATE.lastText && now - BUS_STATE.lastTime < 180 && !opts.force) return false;
      BUS_STATE.lastText = text;
      BUS_STATE.lastTime = now;

      if (!('speechSynthesis' in window)) return false;
      try {
        window.speechSynthesis.cancel();
        const u = createUtterance(text, opts.arch);
        if (opts.rate) u.rate = opts.rate;
        if (opts.pitch) u.pitch = opts.pitch;
        window.speechSynthesis.speak(u);
        return true;
      } catch (_) { return false; }
    }

    function stopSpeech() {
      try { window.speechSynthesis?.cancel(); } catch (_) {}
    }

    function isSameOrigin(iframe) {
      try {
        const origin = new URL(iframe.src || iframe.getAttribute('src') || location.href, location.href).origin;
        return origin === location.origin;
      } catch (_) { return false; }
    }

    function syncFrameState(iframe) {
      const theme = ROOT.dataset.theme || 'night';
      const arch  = getActiveArchKey();

      if (isSameOrigin(iframe)) {
        try {
          const doc = iframe.contentDocument || iframe.contentWindow?.document;
          if (doc?.documentElement) {
            doc.documentElement.dataset.theme = theme;
            doc.documentElement.dataset.user = ROOT.dataset.user || 'convidado';
            if (doc.body) {
              doc.body.dataset.mode = theme;
              doc.body.dataset.arch = arch.toLowerCase();
            }
          }
        } catch (_) {}
      }
      try {
        iframe.contentWindow?.postMessage({
          type: 'KOB_SYNC_STATE',
          theme,
          mode: theme,
          arch,
          user: ROOT.dataset.user || 'convidado',
          ttsEnabled: BUS_STATE.ttsEnabled,
          sfxEnabled: SND.enabled
        }, '*');
      } catch (_) {}
    }

    function connectFrame(iframe) {
      if (!iframe) return;
      if (!iframe.__kobBound) {
        iframe.__kobBound = true;
        iframe.addEventListener('load', () => connectFrame(iframe), true);
      }
      syncFrameState(iframe);

      if (isSameOrigin(iframe)) {
        try {
          const doc = iframe.contentDocument || iframe.contentWindow?.document;
          if (doc && !BUS_STATE.documents.has(doc)) {
            BUS_STATE.documents.add(doc);
            doc.addEventListener('click', e => {
              if (!BUS_STATE.ttsEnabled) return;
              const txt = extractText(e.target);
              if (txt) speakText(txt);
            }, true);
          }
        } catch (_) {}
      }
    }

    function broadcastAllFrames() {
      document.querySelectorAll('iframe').forEach(syncFrameState);
    }

    document.addEventListener('click', e => {
      if (!BUS_STATE.ttsEnabled) return;
      if (e.target?.closest?.('iframe')) return;
      const txt = extractText(e.target);
      if (txt) speakText(txt);
    }, true);

    window.addEventListener('message', event => {
      const data = event.data;
      if (!data || typeof data.type !== 'string') return;
      if (data.type === 'KOB_TTS' && data.text) speakText(data.text);
      if (data.type === 'KOB_SFX') KOBSonoro.sfx(data.desc || 'bubble');
      if (data.type === 'KOB_SET_THEME' && data.theme && global.DualTheme) global.DualTheme.set(data.theme);
      if (data.type === 'KOB_SET_ARCH' && data.arch && global.DualArch) global.DualArch.set(data.arch);
      if (data.type === 'KOB_SET_TTS' && typeof data.enabled === 'boolean' && global.DualTTS) global.DualTTS.set(data.enabled);
      if (data.type === 'KOB_SET_SFX' && typeof data.enabled === 'boolean' && global.DualSFX) global.DualSFX.set(data.enabled);
    });

    /* APIs GLOBAIS UNIFICADAS */
    const THEMES = ['night', 'day', 'sunset'];

    function applyArchColors(archKey) {
      const cfg = ARCHETYPES[archKey] || ARCHETYPES.KOBLLUX;
      const theme = ROOT.dataset.theme || 'night';
      const p1 = adjustForDayIfNeeded(mixHex(cfg.c1, cfg.c2, 0.25), theme);
      const p2 = adjustForDayIfNeeded(cfg.c2, theme);
      const v1 = adjustForDayIfNeeded(cfg.c1, theme);
      const body = getBody();
      if (!body) return;

      const s = body.style;
      s.setProperty('--arch-primary',        p1);
      s.setProperty('--arch-secondary',      p2);
      s.setProperty('--arch-voice',          v1);
      s.setProperty('--kob-L-primary',       p1);
      s.setProperty('--kob-L-secondary',     p2);
      s.setProperty('--kob-voice-primary',   v1);
      s.setProperty('--kob-voice-secondary', p2);

      const [r, g, b] = hexToRgb(cfg.c1).map(v => v / 255);
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h = 0;
      if (max !== min) {
        const d = max - min;
        h = max === r ? ((g - b) / d + (g < b ? 6 : 0))
          : max === g ? ((b - r) / d + 2)
          : ((r - g) / d + 4);
        h = Math.round(h * 60);
      }
      body.dataset.hue1 = String(h);
      body.dataset.hue2 = String((h + 48) % 360);
    }

    global.DualArch = {
      list: ARCH_KEYS,
      map: ARCHETYPES,
      set(name, silent = false) {
        const key = String(name || 'KOBLLUX').toUpperCase();
        const valid = ARCHETYPES[key] ? key : 'KOBLLUX';
        const cfg = ARCHETYPES[valid];
        const body = getBody();

        if (body) {
          body.dataset.arch = valid.toLowerCase();
          body.dataset.voiceArch = valid.toLowerCase();
          applyArchColors(valid);
        } else {
          window.addEventListener('DOMContentLoaded', () => {
            const b = getBody();
            if (b) {
              b.dataset.arch = valid.toLowerCase();
              b.dataset.voiceArch = valid.toLowerCase();
              applyArchColors(valid);
            }
          }, { once: true });
        }

        try { localStorage.setItem('di_activeArch', valid); } catch (_) {}
        broadcastAllFrames();

        if (!silent) KOBSonoro.transition(valid);

        window.dispatchEvent(new CustomEvent('dual:arch-change', { detail: { arch: valid, config: cfg } }));
        window.dispatchEvent(new CustomEvent('kob:arch', { detail: { arch: valid } }));
        return valid;
      },
      next() {
        const cur = getActiveArchKey();
        const nextKey = ARCH_KEYS[(ARCH_KEYS.indexOf(cur) + 1) % ARCH_KEYS.length];
        return this.set(nextKey);
      },
      get() { return getActiveArchKey(); }
    };

    global.DualTheme = {
      modes: THEMES,
      set(theme) {
        const normTheme = theme === 'light' ? 'day' : theme === 'dark' ? 'night' : (THEMES.includes(theme) ? theme : 'night');
        ROOT.dataset.theme = normTheme;
        const body = getBody();
        if (body) body.dataset.mode = normTheme;

        const metaColors = { night: '#0b1020', day: '#d0e9ff', sunset: '#fb923c' };
        document.getElementById('metaThemeColor')?.setAttribute('content', metaColors[normTheme]);

        applyArchColors(getActiveArchKey());

        try {
          localStorage.setItem('dual-theme', normTheme);
          localStorage.setItem('di_themeMode', normTheme);
        } catch (_) {}

        broadcastAllFrames();
        KOBSonoro.sfx('cristal');
        window.dispatchEvent(new CustomEvent('dual:theme-change', { detail: { theme: normTheme, mode: normTheme } }));
        return normTheme;
      },
      toggle() {
        const cur = ROOT.dataset.theme || 'night';
        return this.set(THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length]);
      },
      get() { return ROOT.dataset.theme || 'night'; }
    };

    global.DualTTS = {
      set(enabled) {
        BUS_STATE.ttsEnabled = Boolean(enabled);
        ROOT.dataset.tts = BUS_STATE.ttsEnabled ? 'on' : 'off';
        if (!BUS_STATE.ttsEnabled) stopSpeech();
        try { localStorage.setItem('di_ttsEnabled', String(BUS_STATE.ttsEnabled)); } catch (_) {}
        broadcastAllFrames();
        window.dispatchEvent(new CustomEvent('dual:tts-change', { detail: { enabled: BUS_STATE.ttsEnabled } }));
        return BUS_STATE.ttsEnabled;
      },
      toggle() { return this.set(!BUS_STATE.ttsEnabled); },
      get() { return BUS_STATE.ttsEnabled; },
      speak: speakText,
      stop: stopSpeech
    };

    global.DualSFX = {
      set(enabled) {
        SND.enabled = Boolean(enabled);
        ROOT.dataset.sfx = SND.enabled ? 'on' : 'off';
        if (!SND.enabled) KOBSonoro.stop();
        else KOBSonoro.sfx('bubble');
        try { localStorage.setItem('di_sfxEnabled', String(SND.enabled)); } catch (_) {}
        broadcastAllFrames();
        window.dispatchEvent(new CustomEvent('dual:sfx-change', { detail: { enabled: SND.enabled } }));
        return SND.enabled;
      },
      toggle() { return this.set(!SND.enabled); },
      get() { return SND.enabled; },
      sfx: KOBSonoro.sfx
    };

    global.KOBBus = {
      speak: speakText,
      say: speakText,
      stop: stopSpeech,
      nextArch: () => global.DualArch.next(),
      currentArch: () => global.DualArch.get(),
      scan: () => document.querySelectorAll('iframe').forEach(connectFrame)

    global.KOB_BUS = global.KOBBus;
    global.applyArch = name => global.DualArch.set(name);
    global.KOBLLUX = Object.assign(global.KOBLLUX || {}, { speakText, stopSpeech });

    window.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('iframe').forEach(connectFrame);
      const obs = new MutationObserver(muts => {
        muts.forEach(m => m.addedNodes.forEach(n => {
          if (n.nodeType !== 1) return;
          if (n.matches?.('iframe')) connectFrame(n);
          n.querySelectorAll?.('iframe').forEach(connectFrame);

      });
      obs.observe(document.documentElement, { childList: true, subtree: true });
    });

  <script>
  (() => {
    'use strict';

    const byId = id => document.getElementById(id);
    const $all = sel => document.querySelectorAll(sel);
    const $one = sel => document.querySelector(sel);

    function escapeHtml(v) {
      if (v == null) return '';
      return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
    }

    function toast(msg, type = 'default') {
      const wrap = byId('toasterWrap');
      if (!wrap) return;
      const el = document.createElement('div');
      el.className = `toaster ${type}`;
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => el.classList.add('show'), 10);
      setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2500);
    }
    window.toast = toast;

    /* ─── ORB AVATAR GENERATOR ─── */
    function makeOrbAvatar(name = 'DUAL', size = 64) {
      const safe = String(name || 'DUAL').trim() || 'DUAL';
      const { h1, h2, seed } = hashName(safe);
      const uid = Math.random().toString(36).slice(2, 7);
      const base = `orb_${seed.toString(36)}_${uid}`;
      return `<div class="dual-orb-wrap" style="--orb-size:${size}px;--user-primary:hsl(${h1},100%,62%);--user-secondary:hsl(${h2},92%,48%);" aria-label="${escapeHtml(safe)}" role="img">
        <svg class="dual-orb-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <radialGradient id="${base}_c" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="hsl(${h1},100%,66%)" stop-opacity="1"/>
              <stop offset="55%" stop-color="hsl(${h2},92%,46%)" stop-opacity=".9"/>
              <stop offset="100%" stop-color="hsl(${h2},100%,12%)" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="${base}_r" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="hsl(${h1},100%,76%)"/>
              <stop offset="100%" stop-color="hsl(${h2},100%,58%)"/>
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="46" fill="#05070c"/>
          <circle cx="50" cy="50" r="40" fill="url(#${base}_c)" opacity=".28"/>
          <circle cx="50" cy="50" r="38" fill="none" stroke="url(#${base}_r)" stroke-width="1"/>
          <circle cx="50" cy="50" r="46" fill="none" stroke="url(#${base}_r)" stroke-width="2.5" stroke-dasharray="70 20 10 30" stroke-linecap="round" opacity=".86"/>
          <circle cx="50" cy="50" r="8" fill="#ffffff" opacity=".22"/>
          <circle cx="50" cy="50" r="3" fill="#ffffff" opacity=".85"/>
        </svg>
        <div class="dual-orb-shell"><div class="dual-orb-halo"></div><div class="dual-orb-core"></div></div>
      </div>`;
    }
    window.makeOrbAvatar = makeOrbAvatar;

    /* ─── FUSION CORE STATE & PERSISTENCE STORE ─── */
    const UI_STATE_KEY = 'fusion_os_ui_state';
    const FC_STATE = { keys: [], user: 'Convidado', isEncrypted: false, encryptedData: null };
    let apiKey       = localStorage.getItem('di_apiKey') || '';
    let modelName    = localStorage.getItem('di_modelName') || 'nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free';
    let userName     = localStorage.getItem('di_userName') || '';
    let infodoseName = localStorage.getItem('di_infodoseName') || '';

    const CRYPTO = {
      algo:   { name: 'AES-GCM', length: 256 },
      pbkdf2: { name: 'PBKDF2', hash: 'SHA-256', iterations: 100000 },
      async getKey(password, salt) {
        const enc = new TextEncoder();
        const mat = await window.crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
        return window.crypto.subtle.deriveKey({ ...this.pbkdf2, salt }, mat, this.algo, false, ['encrypt', 'decrypt']);
      },
      async encrypt(data, password) {
        const salt = window.crypto.getRandomValues(new Uint8Array(16));
        const iv   = window.crypto.getRandomValues(new Uint8Array(12));
        const key  = await this.getKey(password, salt);
        const enc  = await window.crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(data)));
        return JSON.stringify({ s: Array.from(salt), iv: Array.from(iv), d: Array.from(new Uint8Array(enc)) });
      },
      async decrypt(bundle, password) {
        try {
          const b = JSON.parse(bundle);
          const key = await this.getKey(password, new Uint8Array(b.s));
          const dec = await window.crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(b.iv) }, key, new Uint8Array(b.d));
          return JSON.parse(new TextDecoder().decode(dec));
        } catch (_) { throw new Error('Senha incorreta'); }
      }
    };

    const Store = Object.freeze({
      KEY: 'fusion_os_data_v2',
      async save(state, pass) {
        const payload = { keys: state.keys, user: state.user };
        if (pass) {
          const data = await CRYPTO.encrypt(payload, pass);
          localStorage.setItem(this.KEY, JSON.stringify({ isEncrypted: true, data }));
          state.isEncrypted = true;
          state.encryptedData = data;
          updateSecurityUI();
        } else {
          try { localStorage.setItem(this.KEY, JSON.stringify({ isEncrypted: false, data: payload })); } catch (_) {}
        }
      },
      async load() {
        const raw = localStorage.getItem(this.KEY);
        return raw ? JSON.parse(raw) : null;
      }
    });

    function saveData() {
      return Store.save(FC_STATE, Vault.pass).catch(console.error);
    }

    async function loadData() {
      try {
        const p = await Store.load();
        if (!p) {
          updateInterface(userName || 'Convidado');
        } else if (p.isEncrypted) {
          FC_STATE.isEncrypted = true;
          FC_STATE.encryptedData = p.data;
          updateSecurityUI();
        } else {
          FC_STATE.keys = p.data?.keys || [];
          FC_STATE.user = p.data?.user || 'Convidado';
          const ak = FC_STATE.keys.find(k => k.active);
          if (ak?.token) { localStorage.setItem('di_apiKey', ak.token); apiKey = ak.token; }
          if (FC_STATE.user !== 'Convidado') { localStorage.setItem('di_userName', FC_STATE.user); userName = FC_STATE.user; }
          updateInterface(FC_STATE.user);
          renderKeysList();
        }
      } catch (e) { console.error('Load error:', e); }

      if (byId('apiKeyInput')) byId('apiKeyInput').value = apiKey;
      if (byId('infodoseNameInput')) byId('infodoseNameInput').value = infodoseName;
      if (byId('modelSelect')) byId('modelSelect').value = modelName;
    }

    /* ─── PURE FUNCTIONS & ISOLATED UI PAINTERS ─── */
    const hashName = name => {
      const seed = [...name].reduce((a, c) => a + c.charCodeAt(0), 0);
      return {
        seed,
        h1: seed % 360,
        h2: (seed * 37) % 360,
        sat1: 80 + (seed % 20),
        lit1: 55 + (seed % 15),
        sat2: 75 + ((seed * 3) % 18),
        lit2: 44 + ((seed * 7) % 12)
      };
    };

    const renderActivationText = (name, arch) => {
      const W = 35, top = `+${'-'.repeat(W)}+`;
      return [
        top,
        `| ${`CÉREBRO-ORÁCULO · ${arch}`.padEnd(W - 2)} |`,
        top,
        `Ativar: ${name}.Dual Infodose [${arch}]`
      ].join('\n');
    };

    function paintUserColors({ h1, h2, sat1 = 80, lit1 = 60, sat2 = 78, lit2 = 48 }) {
      const r = document.documentElement.style;
      const c1 = `hsl(${h1}, ${sat1}%, ${lit1}%)`;
      const c2 = `hsl(${h2}, ${sat2}%, ${lit2}%)`;
      r.setProperty('--user-base-primary',   c1);
      r.setProperty('--user-base-secondary', c2);
      const flipped = document.documentElement.dataset.userFlip === '1';
      r.setProperty('--user-primary',   flipped ? c2 : c1);
      r.setProperty('--user-secondary', flipped ? c1 : c2);
    }

    function flipUserPolarity() {
      const root = document.documentElement;
      const nextFlip = root.dataset.userFlip === '1' ? '0' : '1';
      root.dataset.userFlip = nextFlip;
      const c1 = getComputedStyle(root).getPropertyValue('--user-base-primary').trim();
      const c2 = getComputedStyle(root).getPropertyValue('--user-base-secondary').trim();
      if (c1 && c2) {
        root.style.setProperty('--user-primary',   nextFlip === '1' ? c2 : c1);
        root.style.setProperty('--user-secondary', nextFlip === '1' ? c1 : c2);
      }
    }

    function paintAvatars(name) {
      $all('[data-region="avatar"]').forEach(el => {
        el.innerHTML = makeOrbAvatar(name, +el.dataset.size || 64);
      });
    }

    function paintLabels(name) {
      $all('[data-bind="user-label"]').forEach(el => { el.textContent = name; });
      const inp = $one('[data-bind="user-input"]');
      if (inp && inp.value !== name) inp.value = name;

      const ak = Array.isArray(FC_STATE.keys) ? FC_STATE.keys.find(k => k.active) : null;
      $all('[data-bind="small-ident"]').forEach(el => { el.textContent = ak?.name || '--'; });
      $all('[data-bind="small-status"]').forEach(el => {
        el.textContent = ak ? `${ak.name} [ATIVO]` : (name === 'Convidado' ? 'Aguardando...' : `${name} · Foco estável.`);
      });
    }

    function paintActivation(name) {
      const clean = String(name || '').trim() || 'Convidado';
      const arch = window.DualArch?.get() || 'KOBLLUX';
      const pre = $one('[data-region="activation-pre"]');
      if (pre) pre.textContent = renderActivationText(clean, arch);

      const { seed } = hashName(clean);
      let n = seed;
      while (n > 9) n = String(n).split('').reduce((a, b) => a + +b, 0);
      const ak = Array.isArray(FC_STATE.keys) ? FC_STATE.keys.find(k => k.active) : null;
      $all('[data-bind="act-badge"]').forEach(el => {
        el.textContent = ak ? `key:${ak.name}` : `v:${n}`;
      });
    }

    function updateInterface(name) {
      const safe = String(name || 'Convidado').trim() || 'Convidado';
      FC_STATE.user = userName = safe;
      const hash = hashName(safe);
      document.documentElement.dataset.user = safe.toLowerCase();
      document.documentElement.dataset.seed = String(hash.seed);

      paintUserColors(hash);
      paintAvatars(safe);
      paintLabels(safe);
      paintActivation(safe);

      try { localStorage.setItem('di_userName', safe); } catch (_) {}
      window.dispatchEvent(new CustomEvent('dual:user-change', { detail: { name: safe, ...hash } }));
    }
    window.updateInterface = updateInterface;

    function updateSecurityUI() {
      const vs = $one('[data-bind="vault-status"]');
      const lb = $one('[data-bind="vault-lock-label"]');
      if (!vs || !lb) return;
      if (Vault.isUnlocked) {
        vs.textContent = 'Cofre Protegido (Destrancado)';
        lb.textContent = 'TRANCAR';
      } else if (FC_STATE.isEncrypted) {
        vs.textContent = 'Cofre Trancado';
        lb.textContent = 'REDEFINIR';
      } else {
        vs.textContent = 'Cofre Aberto (Sem senha)';
        lb.textContent = 'CRIAR SENHA';
      }
    }

    function renderKeysList() {
      const kl = $one('[data-region="key-list"]');
      if (!kl) return;
      kl.replaceChildren();
      if (!FC_STATE.keys.length) {
        kl.innerHTML = `<div class="empty-state">Nenhuma chave armazenada.</div>`;
        return;
      }
      const tpl = byId('tpl-key-item');
      FC_STATE.keys.forEach(k => {
        const node = tpl.content.cloneNode(true);
        node.querySelector('[data-field="name"]').textContent = k.name;
        node.querySelector('[data-action="activate-key"]').dataset.keyId = k.id;
        node.querySelector('[data-action="remove-key"]').dataset.keyId = k.id;
        node.querySelector('.key-item').classList.toggle('active-item', Boolean(k.active));
        kl.appendChild(node);
      });
    }

    function openKeysModal() {
      const km = byId('keysModal');
      if (km) { km.style.display = 'flex'; km.setAttribute('aria-hidden', 'false'); }
    }
    function closeKeysManager() {
      const km = byId('keysModal');
      if (km) { km.style.display = 'none'; km.setAttribute('aria-hidden', 'true'); }
    }
    function closeVaultModal() {
      const vm = byId('vaultModal');
      if (vm) { vm.style.display = 'none'; vm.setAttribute('aria-hidden', 'true'); }
    }
    function openManager() {
      if (FC_STATE.isEncrypted && !Vault.isUnlocked) {
        const vm = byId('vaultModal');
        if (vm) { vm.style.display = 'flex'; vm.setAttribute('aria-hidden', 'false'); }
        byId('vaultPassInput')?.focus();
      } else {
        openKeysModal();
      }
    }

    const Vault = {
      pass: null,
      get isUnlocked() { return !!this.pass; },
      async unlock() {
        const pass = byId('vaultPassInput')?.value || '';
        if (!pass) return toast('Digite a senha.', 'error');
        try {
          const dec = await CRYPTO.decrypt(FC_STATE.encryptedData, pass);
          this.pass = pass;
          FC_STATE.keys = dec.keys || [];
          FC_STATE.user = dec.user || 'Convidado';
          const ak = FC_STATE.keys.find(k => k.active);
          if (ak?.token) { localStorage.setItem('di_apiKey', ak.token); apiKey = ak.token; }
          if (FC_STATE.user) { localStorage.setItem('di_userName', FC_STATE.user); userName = FC_STATE.user; }
          closeVaultModal();
          openKeysModal();
          if (byId('vaultPassInput')) byId('vaultPassInput').value = '';
          renderKeysList();
          updateInterface(FC_STATE.user);
          updateSecurityUI();
          toast('Cofre destrancado.', 'success');
        } catch (_) { toast('Senha incorreta.', 'error'); }
      },
      lock() {
        if (!this.isUnlocked && !FC_STATE.isEncrypted) {
          const np = prompt('Defina uma senha para o Cofre:');
          if (np) { this.pass = np; saveData(); toast('Cofre protegido.', 'success'); }
        } else if (this.isUnlocked) {
          this.pass = null;
          closeKeysManager();
          toast('Sessão encerrada.', 'success');
        } else {
          toast('Cofre criptografado. Desbloqueie para redefinir.', 'error');
        }
        updateSecurityUI();
      },
      addKey() {
        const name = byId('keyNameInput')?.value.trim();
        const token = byId('keyTokenInput')?.value.trim();
        if (!name) return toast('Nome obrigatório', 'error');
        const nk = { id: Date.now().toString(36), name, token, active: FC_STATE.keys.length === 0 };
        FC_STATE.keys.push(nk);
        if (nk.active && nk.token) { localStorage.setItem('di_apiKey', nk.token); apiKey = nk.token; }
        saveData(); renderKeysList(); updateInterface(FC_STATE.user);
        if (byId('keyNameInput')) byId('keyNameInput').value = '';
        if (byId('keyTokenInput')) byId('keyTokenInput').value = '';
        toast('Chave adicionada!', 'success');
      },
      removeKey(id) {
        if (!confirm('Remover chave permanentemente?')) return;
        const rm = FC_STATE.keys.find(k => k.id === id);
        FC_STATE.keys = FC_STATE.keys.filter(k => k.id !== id);
        if (rm?.active) { localStorage.removeItem('di_apiKey'); apiKey = ''; }
        saveData(); renderKeysList(); updateInterface(FC_STATE.user);
      },
      setActive(id) {
        let token = null;
        FC_STATE.keys.forEach(k => { k.active = k.id === id; if (k.active) token = k.token; });
        if (token) {
          localStorage.setItem('di_apiKey', token); apiKey = token;
          if (byId('apiKeyInput')) byId('apiKeyInput').value = token;
          toast('Chave sincronizada.', 'success');
        } else {
          localStorage.removeItem('di_apiKey'); apiKey = '';
        }
        saveData(); renderKeysList(); updateInterface(FC_STATE.user);
      }
    };

    /* ─── FUSION CARD MODE ENGINE (CARD · ORB · HUD · DOCK-BOTTOM) ─── */
    const card = byId('mainCard');
    const fcUI = { isOrb: false, isHud: false, isDockBottom: false, isDragging: false, timer: null, startX: 0, startY: 0, dragOffsetX: 0, dragOffsetY: 0, pointerId: null };
    const HUD_SNAP = 90, DOCK_SNAP = 60, SWIPE_DN = 80, LP_MS = 350;

    function saveUIState() {
      const mode = fcUI.isOrb ? 'orb' : fcUI.isHud ? 'hud' : fcUI.isDockBottom ? 'dock-bottom' : 'card';
      try {
        localStorage.setItem(UI_STATE_KEY, JSON.stringify({ mode, left: card?.style.left || '', top: card?.style.top || '' }));
      } catch (_) {}
    }

    function updateModeBtns(mode) {
      $all('[data-action="set-mode"]').forEach(btn => {
        btn.classList.toggle('active-mode', btn.dataset.mode === mode);
      });
    }

    function revertToCard() {
      fcUI.isOrb = fcUI.isHud = fcUI.isDockBottom = false;
      card.style.cssText = '';
      card.classList.remove('orb', 'hud', 'dock-bottom', 'closed');
      card.dataset.mode = 'card';
      setTimeout(() => card.classList.add('content-visible'), 250);
    }

    function setMode(mode, init = false) {
      if (!card) return;
      updateModeBtns(mode);
      if (mode === 'card') {
        revertToCard();
      } else if (mode === 'orb') {
        fcUI.isOrb = true; fcUI.isHud = fcUI.isDockBottom = false;
        card.classList.add('orb', 'closed'); card.classList.remove('hud', 'dock-bottom', 'content-visible');
        card.style.transform = 'none';
        if (!card.style.left) card.style.left = 'calc(100vw - 86px)';
        if (!card.style.top)  card.style.top  = '74px';
      } else if (mode === 'hud') {
        fcUI.isHud = true; fcUI.isOrb = fcUI.isDockBottom = false;
        card.classList.add('hud', 'closed'); card.classList.remove('orb', 'dock-bottom', 'content-visible');
        card.style.top = card.style.left = card.style.transform = '';
      } else if (mode === 'dock-bottom') {
        fcUI.isDockBottom = true; fcUI.isHud = fcUI.isOrb = false;
        card.classList.add('dock-bottom', 'closed'); card.classList.remove('orb', 'hud', 'content-visible');
        card.style.top = card.style.left = card.style.transform = '';
      }
      card.dataset.mode = mode;
      if (!init) saveUIState();
    }
    window.setMode = setMode;

    function toggleCardState() {
      if (card.classList.contains('animating')) return;
      const closed = card.classList.contains('closed');
      card.classList.add('animating');
      if (closed) {
        card.classList.remove('closed');
        card.animate([{ transform: 'scale(.95)', opacity: .8 }, { transform: 'scale(1)', opacity: 1 }], { duration: 350 }).onfinish = () => {
          card.classList.remove('animating'); card.classList.add('content-visible');
        };
      } else {
        card.classList.remove('content-visible');
        card.animate([{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(8px)', opacity: 1 }], { duration: 200 }).onfinish = () => {
          card.classList.add('closed'); card.classList.remove('animating');
        };
      }
    }

    function toggleSection(id, forceOpen = null) {
      const el = byId(id); if (!el) return;
      const hidden = el.classList.contains('activation-hidden');
      const shouldOpen = forceOpen !== null ? forceOpen : hidden;
      el.classList.toggle('activation-hidden', !shouldOpen);
      el.classList.toggle('activation-open', shouldOpen);
    }
    window.toggleSection = toggleSection;

    async function copyActivation() {
      const text = $one('[data-region="activation-pre"]')?.innerText || '';
      try {
        await navigator.clipboard.writeText(text);
        toast('Ativação copiada', 'success');
      } catch (_) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        toast('Ativação copiada', 'success');
      }
    }

    function saveSystem() {
      infodoseName = byId('infodoseNameInput')?.value.trim() || '';
      const nk = byId('apiKeyInput')?.value.trim() || '';
      const nm = byId('modelSelect')?.value.trim() || '';

        localStorage.setItem('di_apiKey', apiKey);
        const ak = FC_STATE.keys.find(k => k.active);
        if (ak) { ak.token = nk; saveData(); }
      }
      if (nm) { modelName = nm; localStorage.setItem('di_modelName', modelName); }
      localStorage.setItem('di_infodoseName', infodoseName);
      toggleSection('systemCard', false);
      toast('Configurações salvas.', 'success');
    }

    /* ─── DATE & CLOCK WIDGET CONTROLLER ─── */
    let dateFormatIndex = 0;
    function formatDualDate(now, mode) {
      const months = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];
      const days = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      const mon = months[now.getMonth()];
      const dow = days[now.getDay()];

      if (mode === 1) return `${dd}/${mm}/${yyyy}`;
      if (mode === 2) {
        const start = new Date(yyyy, 0, 0);
        const diff = now - start;
        const doy = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(3, '0');
        return `DIA ${doy} · ${dow}`;
      }
      return `${dd} ${mon} · ${dow}`;
    }

    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      const dateStr = formatDualDate(now, dateFormatIndex);
      $all('[data-bind="clock"]').forEach(el => { el.textContent = time; });
      $all('[data-bind="date-label"]').forEach(el => { el.textContent = dateStr; });
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* ─── UMA PONTE ÚNICA DE AÇÕES PARA TODA A UI ─── */
    const ACTIONS = {
      'cycle-arch':        () => window.DualArch.next(),
      'toggle-sfx':        () => window.DualSFX.toggle(),
      'toggle-tts':        () => window.DualTTS.toggle(),
      'cycle-theme':       () => window.DualTheme.toggle(),
      'cycle-date-format': () => {
        dateFormatIndex = (dateFormatIndex + 1) % 3;
        updateClock();
        window.DualSFX?.sfx('bubble');
      },
      'set-mode':          btn => {
        setMode(btn.dataset.mode);
        window.DualSFX?.sfx(btn.dataset.mode === 'card' ? 'bubble' : 'swoosh');
      },
      'toggle-panel':      btn => {
        toggleSection(btn.dataset.panel);
        window.DualSFX?.sfx('cristal');
      },
      'open-menu-system':  () => {
        setMode('card');
        toggleSection('systemCard', true);
        window.DualSFX?.sfx('bubble');
      },
      'activate-portal':   () => {
        setMode('orb');
        window.DualSFX?.sfx('portal');

      },
      'open-vault':        () => openManager(),
      'close-vault':       () => { closeKeysManager(); closeVaultModal(); },
      'unlock-vault':      () => Vault.unlock(),
      'lock-vault':        () => Vault.lock(),
      'add-key':           () => Vault.addKey(),
      'remove-key':        btn => Vault.removeKey(btn.dataset.keyId),
      'activate-key':      btn => Vault.setActive(btn.dataset.keyId),
      'copy-activation':   () => copyActivation(),
      'save-system':       () => saveSystem()
    };

    document.addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const fn = ACTIONS[btn.dataset.action];
      if (fn) {
        e.preventDefault();
        e.stopPropagation();
        fn(btn);
      }
    }, { passive: false });

    /* ─── GESTOS & POINTER DRAG DO FUSION CARD ─── */
    function transmuteToOrb(e) {
      if (!e || e.clientX == null) return;
      navigator.vibrate?.(40);
      card.classList.add('orb', 'closed'); card.classList.remove('hud', 'dock-bottom', 'content-visible');
      card.style.left = `${e.clientX - 34}px`;
      card.style.top  = `${e.clientY - 34}px`;
      fcUI.isOrb = true; fcUI.isHud = fcUI.isDockBottom = false; fcUI.isDragging = true;
      card.dataset.mode = 'orb';
      if (e.pointerId) {
        fcUI.pointerId = e.pointerId;
        try { card.setPointerCapture(e.pointerId); } catch (_) {}
        const r = card.getBoundingClientRect();
        fcUI.dragOffsetX = e.clientX - r.left; fcUI.dragOffsetY = e.clientY - r.top;
      }
      updateModeBtns('orb');
      window.DualSFX?.sfx('swoosh');
    }

    const snapZone = byId('snap-zone'), snapZoneB = byId('snap-zone-bottom');

    card?.addEventListener('pointerdown', e => {
      const tag = e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.target.closest('[data-action]')) return;
      const isFloat = fcUI.isOrb || fcUI.isHud || fcUI.isDockBottom;
      if (!isFloat && !byId('cardHeader')?.contains(e.target)) return;
      fcUI.startX = e.clientX; fcUI.startY = e.clientY; fcUI.pointerId = e.pointerId;
      if (isFloat) {
        fcUI.isDragging = true;
        try { card.setPointerCapture(e.pointerId); } catch (_) {}
        const r = card.getBoundingClientRect();
        fcUI.dragOffsetX = e.clientX - r.left; fcUI.dragOffsetY = e.clientY - r.top;
        card.style.transition = 'none';
        return;
      }
      fcUI.timer = setTimeout(() => { transmuteToOrb(e); saveUIState(); }, LP_MS);
    }, { passive: false });

    window.addEventListener('pointermove', e => {
      if (!fcUI.isOrb && !fcUI.isHud && !fcUI.isDockBottom && fcUI.timer) {
        const dx = e.clientX - fcUI.startX, dy = e.clientY - fcUI.startY;
        if (Math.hypot(dx, dy) > 12 && (dy < -10 || Math.abs(dx) > 18)) {
          clearTimeout(fcUI.timer); fcUI.timer = null;
          transmuteToOrb(e);
          const r = card.getBoundingClientRect();
          fcUI.dragOffsetX = e.clientX - r.left; fcUI.dragOffsetY = e.clientY - r.top;
          try { card.setPointerCapture(e.pointerId); } catch (_) {}
          card.style.transition = 'none';
        }
      }
      if (!fcUI.isDragging) return;
      e.preventDefault();
      const vh = window.innerHeight, cardH = card.offsetHeight || 68;
      if (fcUI.isOrb) {
        const x = e.clientX - fcUI.dragOffsetX, y = e.clientY - fcUI.dragOffsetY;
        card.style.left = `${x}px`; card.style.top = `${y}px`;
        if (y < HUD_SNAP) { snapZone?.classList.add('active'); snapZoneB?.classList.remove('active'); }
        else if (y + cardH > vh - DOCK_SNAP) { snapZoneB?.classList.add('active'); snapZone?.classList.remove('active'); }
        else { snapZone?.classList.remove('active'); snapZoneB?.classList.remove('active'); }
      } else if (fcUI.isHud) {
        const dy = e.clientY - fcUI.startY;
        if (dy > 0) {
          card.style.transform = `translateX(-50%) translateY(${dy * .4}px)`;
          dy > SWIPE_DN ? snapZone?.classList.add('active') : snapZone?.classList.remove('active');
        }
      } else if (fcUI.isDockBottom) {
        const dy = e.clientY - fcUI.startY;
        if (dy < 0) {
          card.style.transform = `translateX(-50%) translateY(${dy * .4}px)`;
          dy < -SWIPE_DN ? snapZoneB?.classList.add('active') : snapZoneB?.classList.remove('active');
        }
      }
    }, { passive: false });

    window.addEventListener('pointerup', e => {
      if (fcUI.timer) { clearTimeout(fcUI.timer); fcUI.timer = null; }
      if (fcUI.isDragging) {
        fcUI.isDragging = false;
        try { card.releasePointerCapture?.(fcUI.pointerId); } catch (_) {}
        card.style.transition = '';
        snapZone?.classList.remove('active'); snapZoneB?.classList.remove('active');
        const vh = window.innerHeight;
        if (fcUI.isOrb) {
          const r = card.getBoundingClientRect();
          if (r.top < HUD_SNAP) { setMode('hud'); window.DualSFX?.sfx('swoosh'); }
          else if (r.bottom > vh - DOCK_SNAP) { setMode('dock-bottom'); window.DualSFX?.sfx('swoosh'); }
          else saveUIState();
        } else if (fcUI.isHud) {
          const dy = e.clientY - fcUI.startY;
          if (dy > SWIPE_DN) { card.style.left = `${e.clientX - 34}px`; card.style.top = `${e.clientY - 10}px`; setMode('orb'); window.DualSFX?.sfx('swoosh'); }
          else card.style.transform = 'translateX(-50%) translateY(0)';
        } else if (fcUI.isDockBottom) {
          const dy = e.clientY - fcUI.startY;
          if (dy < -SWIPE_DN) { card.style.left = `${e.clientX - 34}px`; card.style.top = `${e.clientY - 34}px`; setMode('orb'); window.DualSFX?.sfx('swoosh'); }
          else card.style.transform = 'translateX(-50%) translateY(0)';
        }
      } else {
        if (!fcUI.isOrb && !fcUI.isHud && !fcUI.isDockBottom && byId('cardHeader')?.contains(e.target) && !e.target.closest('#avatarTarget') && !e.target.closest('[data-action]')) {
          toggleCardState();
        }
      }
      fcUI.pointerId = null;
    }, { passive: false });

    byId('avatarTarget')?.addEventListener('click', e => {
      e.stopPropagation();
      if (!fcUI.isOrb && !fcUI.isHud && !fcUI.isDockBottom) openManager();
    });
    byId('smallPreview')?.addEventListener('click', e => {
      if (!e.target.closest('[data-action]')) toggleCardState();

    byId('cardHeader')?.addEventListener('click', e => {
      if ((fcUI.isHud || fcUI.isDockBottom) && !fcUI.isDragging && !e.target.closest('[data-action]')) {
        setMode('card');
        window.DualSFX?.sfx('swoosh');

    card?.addEventListener('contextmenu', e => {

    });

    $one('[data-bind="user-input"]')?.addEventListener('input', e => {
      updateInterface(e.target.value);
      saveData();

    const MAIN   = byId('main-content');

    const THEME_LABELS = { night: 'Noite (Night)', day: 'Dia (Day)', sunset: 'Pôr do Sol (Sunset)' };

          if (cur <= 10 || cur < lastScrollY - 8) {

          lastScrollY = cur;
          ticking = false;

        ticking = true;

    /* ── BOOT UNIFICADO ── */
    (async function bootMonolith() {
      const savedTheme = localStorage.getItem('di_themeMode') || localStorage.getItem('dual-theme') || 'night';
      const savedArch  = localStorage.getItem('di_activeArch') || 'KOBLLUX';
      const savedTTS   = localStorage.getItem('di_ttsEnabled') !== 'false';
      const savedSFX   = localStorage.getItem('di_sfxEnabled') !== 'false';

      window.DualArch.set(savedArch, true);
      window.DualTheme.set(savedTheme);
      window.DualTTS.set(savedTTS);
      window.DualSFX.set(savedSFX);

      card?.classList.add('active');
      byId('avatarTarget')?.classList.add('shown');
      await loadData();
      updateInterface(FC_STATE.user || userName || 'Convidado');

        const r = JSON.parse(localStorage.getItem(UI_STATE_KEY) || '{}');
        savedMode = r.mode || 'card'; sl = r.left || null; st = r.top || null;
      } catch (_) {}

      if (card) {
        card.style.opacity = '0';
        card.style.transition = 'opacity 400ms ease';
        requestAnimationFrame(() => { card.style.opacity = '1'; });

        if (savedMode === 'orb') {
          if (sl) card.style.left = sl;
          if (st) card.style.top  = st;
          setMode('orb', true);
        } else if (savedMode === 'hud') {
          setMode('hud', true);
        } else if (savedMode === 'dock-bottom') {

  <script>
  (() => {
    'use strict';

    const ICONS = {
     
      night: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>',
      day: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>',
      sunset: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><path d="M17 18a5 5 0 0 0-10 0"></path><line x1="12" y1="9" x2="12" y2="2"></line><line x1="4.22" y1="10.22" x2="5.64" y2="11.64"></line><line x1="1" y1="18" x2="3" y2="18"></line><line x1="21" y1="18" x2="23" y2="18"></line><line x1="18.36" y1="11.64" x2="19.78" y2="10.22"></line><line x1="23" y1="22" x2="1" y2="22"></line><polyline points="16 5 12 9 8 5"></polyline></svg>'
    };

    const LABELS = {
      night: 'Noite (Night)',
      day: 'Dia (Day)',
      sunset: 'Pôr do Sol (Sunset)'
    };

    const CYCLE = ['night', 'day', 'sunset'];

    // Busca SEMPRE dentro do <body>
    const byId = (id) => document.body.querySelector('#' + id);

    function applyTheme(t) {
      // <html data-theme>
      document.documentElement.setAttribute('data-theme', t);
      // <body data-mode>
      document.body.setAttribute('data-mode', t);
      // meta theme-color
      const meta = byId('metaThemeColor');
      if (meta) {
        const colors = { night: '#0b1020', day: '#f5f7fb', sunset: '#1a0e1f' };
        meta.setAttribute('content', colors[t] || '#0b1020');
      }
      // ícone do botão
      const dot = byId('theme-dot');
      if (dot) {
        dot.innerHTML = ICONS[t] || ICONS.night;
        dot.setAttribute('title', `Tema: ${LABELS[t] || t} (toque para alternar)`);
        dot.dataset.theme = t;
      }
      // persiste
      localStorage.setItem('di_themeMode', t);
      localStorage.setItem('dual-theme', t);
      // avisa o resto do sistema
      window.dispatchEvent(new CustomEvent('dual:theme-change', { detail: { theme: t } }));
    }

    function nextTheme() {
      const cur = document.documentElement.getAttribute('data-theme') || 'night';
      const idx = CYCLE.indexOf(cur);
      return CYCLE[(idx + 1) % CYCLE.length];
    }

    function boot() {
      const dot = byId('theme-dot');
      if (!dot) return;

      dot.addEventListener('click', (e) => {
        e.stopPropagation();
        applyTheme(nextTheme());
      });

      // estado inicial
      const saved =
        localStorage.getItem('di_themeMode') ||
        localStorage.getItem('dual-theme') ||
        document.documentElement.getAttribute('data-theme') ||
        'night';
      applyTheme(saved);
    }

    // espera body + botão existirem
    function waitForBody(cb) {
      if (document.body) return cb();
      new MutationObserver((_, obs) => {
        if (document.body) { obs.disconnect(); cb(); }
      }).observe(document.documentElement, { childList: true });
    }

    function waitForId(id, timeout = 3000) {
      return new Promise(res => {
        const el = byId(id);
        if (el) return res(el);
        const obs = new MutationObserver(() => {
          const f = byId(id);
          if (f) { obs.disconnect(); res(f); }
        });
        obs.observe(document.body, { childList: true, subtree: true });
        setTimeout(() => { obs.disconnect(); res(byId(id)); }, timeout);
      });
    }

    waitForBody(async () => {
      await waitForId('theme-dot');
      boot();
    });

    // expõe API mínima (opcional)
    window.DualTheme = window.DualTheme || {
      set: applyTheme,
      next: () => applyTheme(nextTheme()),
      toggle: () => applyTheme(nextTheme()),
      current: () => document.documentElement.getAttribute('data-theme')
    };
  })();
  </script>
