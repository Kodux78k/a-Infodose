/* =========================================================
   ALMASLIBER / iFSw — UNIFIED CORE  (u-base / clamp edition)
   HEADER + SESSION + DOCK + MAXIMIZE/MINIMIZE + TABS
   Conversão: 1u ≈ 10px no caso base (--u-base ≈ 10px)
   ========================================================= */
:root {
  /* ── UNIDADE-BASE FLUIDA (portada da FULL) ── */
  --u-base: clamp(3px, calc(100vw / 44), 20px);

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);

  /* ── Tokens convertidos px → calc(var(--u-base) * N/10) ── */
  --topbar-h:          calc(var(--u-base) * 5.8);
  --header-h:          calc(var(--u-base) * 5.2);
  --session-radius:    calc(var(--u-base) * 2.9);
  --session-gap:       calc(var(--u-base) * 2.0);
  --collapsed-h:       calc(var(--u-base) * 5.2);
  --peek-h:            calc(var(--u-base) * 17.8);
  --resize-hit:        0px;
  --resize-corner:     calc(var(--u-base) * 5.4);
  --dock-bottom-gap:   calc(var(--u-base) * 8.0);
  --dock-offset-x:     calc(var(--u-base) * -1.2);

  /* z-index permanece abstrato — não escala */
  --z-base: 1;
  --z-content: 100;
  --z-header-system: 900;
  --z-header-main: 910;
  --z-session: 1000;
  --z-session-header: 1010;
  --z-session-controls: 1020;
  --z-maximized: 94000;
  --z-maximized-header: 94010;
  --z-maximized-controls: 94020;
  --z-resize: 94030;
  --z-dock: 97000;
  --z-tab-switcher: 98000;
}
* { box-sizing: border-box; }
html, body {
  width: 100%;
  min-width: 0;
  min-height: 100%;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}
html { overflow-y: auto; -webkit-overflow-scrolling: touch; }
body {
  min-height: 100dvh;
  background: radial-gradient(circle at 50% 0%, #2a2a35 0%, #0f0f15 100%);
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
body.ui-safe-vertical {
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}
body.ui-immersive { padding: 0; overflow: hidden !important; }
#kxtsk-shell {
  position: relative;
  width: 100%;
  min-height: 100dvh;
  overflow: visible;
  z-index: var(--z-base);
}
.almasliber, .almasliber .shell, #main-content {
  position: relative;
  width: 100%;
  min-width: 0;
}
.almasliber { min-height: 100dvh; }
/* HEADER SYSTEM */
.topbar {
  position: relative;
  width: 100%;
  min-width: 0;
  height: var(--topbar-h);
  min-height: var(--topbar-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: calc(var(--u-base) * 1.2);
  padding: 0 calc(var(--u-base) * 1.2);
  z-index: var(--z-header-system);
  isolation: isolate;
}
#system-topbar { z-index: var(--z-header-system); }
#main-header { z-index: var(--z-header-main); }
#main-header.header-visible {
  transform: translateY(0);
  opacity: 1;
  pointer-events: auto;
}
#main-header.header-hidden {
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
}
#main-header { transition: transform .25s ease, opacity .2s ease; }
.brand, .brandX, .os-brand {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  min-width: 0;
  font-weight: 800;
}
.brandX { gap: calc(var(--u-base) * 0.7); font-size: calc(var(--u-base) * 1.3); letter-spacing: 1.3px; }
.badgeX { font-size: calc(var(--u-base) * 0.9); opacity: .55; }
.top-actions {
  min-width: 0;
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: calc(var(--u-base) * 0.8);
}
.icon-btn, .soft-btn, .launcher-btn, .win-go-btn {
  flex: 0 0 auto;
  border: 0;
  border-radius: calc(var(--u-base) * 1.2);
  min-height: calc(var(--u-base) * 3.0);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  cursor: pointer;
  font-weight: 600;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.icon-btn { width: calc(var(--u-base) * 3.4); height: calc(var(--u-base) * 3.4); padding: 0; background: rgba(255,255,255,.08); }
.soft-btn { padding: calc(var(--u-base) * 1.0) calc(var(--u-base) * 1.2); background: rgba(255,255,255,.08); }
.launcher-btn { padding: calc(var(--u-base) * 1.0) calc(var(--u-base) * 1.2); background: rgba(0,242,255,.12); border: 1px solid rgba(0,242,255,.3); }
.win-go-btn { padding: calc(var(--u-base) * 1.0) calc(var(--u-base) * 1.2); background: rgba(0,242,255,.12); }
.icon-btn:active, .win-controls button:active, .dock-bubble:active { transform: scale(.94); }
.win-navrow {
  display: flex;
  align-items: center;
  gap: calc(var(--u-base) * 0.8);
  flex: 1 1 auto;
  min-width: 0;
  max-width: calc(var(--u-base) * 34);
  padding: 0 calc(var(--u-base) * 1.6) calc(var(--u-base) * 1.0);
}
.win-urlbar {
  flex: 1 1 auto;
  min-width: 0;
  padding: calc(var(--u-base) * 1.1) calc(var(--u-base) * 1.3);
  border-radius: calc(var(--u-base) * 1.3);
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.06);
  color: #fff;
  outline: none;
  font-size: calc(var(--u-base) * 1.0);
}
.win-urlbar::placeholder { color: rgba(255,255,255,.45); }
.win-urlbar:focus {
  border-color: rgba(0,242,255,.45);
  background: rgba(255,255,255,.09);
  box-shadow: 0 0 0 calc(var(--u-base) * 0.3) rgba(0,242,255,.08);
}
main, #main-content { position: relative; z-index: var(--z-content); }
#stackWrap {
  position: relative;
  width: 100%;
  max-width: calc(var(--u-base) * 80);
  min-height: calc(100dvh - var(--topbar-h));
  margin: 0 auto;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--session-gap);
  overflow: visible;
  z-index: var(--z-content);
  isolation: isolate;
}
/* SESSION WINDOW */
.session-window {
  position: relative;
  width: 100%;
  height: calc(100dvh - var(--topbar-h));
  min-height: 0;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: rgba(30,30,35,.40);
  backdrop-filter: blur(calc(var(--u-base) * 2.0));
  -webkit-backdrop-filter: blur(calc(var(--u-base) * 2.0));
  border: 1px solid rgba(255,255,255,.08);
  border-radius: var(--session-radius);
  z-index: var(--z-session);
  transition: height .28s cubic-bezier(.16,1,.3,1), width .28s cubic-bezier(.16,1,.3,1), transform .28s ease, opacity .28s ease;
}
.session-window .win-hdr {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  width: 100%;
  height: var(--header-h);
  min-height: var(--header-h);
  display: flex;
  align-items: center;
  padding: calc(var(--u-base) * 1.0) calc(var(--u-base) * 1.4);
  z-index: var(--z-session-header);
  background: transparent;
  user-select: none;
  -webkit-user-select: none;
  pointer-events: none;
  touch-action: manipulation;
  isolation: isolate;
}
.win-controls {
  position: relative;
  z-index: var(--z-session-controls);
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: calc(var(--u-base) * 0.7);
  pointer-events: auto;
}
.win-controls button {
  width: calc(var(--u-base) * 3.0);
  height: calc(var(--u-base) * 3.0);
  min-width: calc(var(--u-base) * 3.0);
  min-height: calc(var(--u-base) * 3.0);
  padding: 0;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.10);
  color: #fff;
  cursor: pointer;
  font-family: "Noto Sans Symbols 2", "Noto Sans Symbols", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: calc(var(--u-base) * 1.7);
  font-weight: 300;
  line-height: 1;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.win-controls button:hover { background: rgba(255,255,255,.17); }
/* Tab counter button */
.win-controls .tab-counter {
  width: auto;
  min-width: calc(var(--u-base) * 3.0);
  padding: 0 calc(var(--u-base) * 1.0);
  border-radius: calc(var(--u-base) * 2.0);
  background: rgba(0,242,255,.15);
  font-size: calc(var(--u-base) * 1.2);
  font-weight: 600;
  color: #7af;
  letter-spacing: 0.3px;
}
.session-window .win-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  border: 0;
  background: transparent;
  z-index: 1;
  display: block;
}
.session-window.collapsed {
  height: var(--collapsed-h) !important;
  min-height: var(--collapsed-h) !important;
  overflow: hidden !important;
}
.session-window.collapsed .win-frame { visibility: hidden; pointer-events: none; }
.session-window.peeked {
  height: var(--peek-h) !important;
  min-height: var(--peek-h) !important;
}
.session-window.peeked .win-frame { visibility: visible; pointer-events: auto; }
.session-window.minimized {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  min-width: 1px !important;
  min-height: 1px !important;
  opacity: 0 !important;
  pointer-events: none !important;
  transform: scale(.90) translateY(50px);
  overflow: hidden !important;
}
.session-window.maximized {
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100dvh !important;
  min-width: 0 !important;
  min-height: 0 !important;
  max-width: none !important;
  max-height: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  overflow: hidden !important;
  z-index: var(--z-maximized) !important;
  transition: none !important;
}
.session-window.maximized .win-hdr {
  position: absolute !important;
  inset: 0 0 auto 0 !important;
  width: 100% !important;
  height: var(--header-h) !important;
  z-index: var(--z-maximized-header) !important;
  pointer-events: none !important;
}
.session-window.maximized .win-controls { pointer-events: auto !important; z-index: var(--z-maximized-controls) !important; }
.session-window.maximized .win-frame {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  z-index: 1 !important;
}
body.has-maximized { overflow: hidden !important; }
body.has-maximized .topbar { pointer-events: none; }
body.has-maximized .session-window.maximized .win-controls,
body.has-maximized .session-window.maximized .win-hdr { pointer-events: auto; }
/* Resize handles */
.session-window .resize-handle {
  position: absolute;
  z-index: var(--z-resize);
  background: transparent;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.session-window .resize-y { left: 0; right: 0; bottom: 0; height: var(--resize-hit); cursor: ns-resize; }
.session-window .resize-x { top: var(--header-h); right: 0; bottom: 0; width: var(--resize-hit); cursor: ew-resize; }
.session-window .resize-corner { right: 0; bottom: 0; width: var(--resize-corner); height: var(--resize-corner); cursor: nwse-resize; }
.session-window .resize-corner::before {
  content: "";
  position: absolute;
  right: calc(var(--u-base) * 1.0);
  bottom: calc(var(--u-base) * 1.0);
  width: calc(var(--u-base) * 1.6);
  height: calc(var(--u-base) * 1.6);
  border-radius: 50%;
  background: rgba(255,255,255,.18);
  border: 1px solid rgba(255,255,255,.25);
  box-shadow: 0 0 calc(var(--u-base) * 1.4) rgba(0,242,255,.18);
  pointer-events: none;
}
.session-window.maximized .resize-handle { display: none !important; }
.session-window.suspended .win-frame { display: none; }
.session-window.suspended::after {
  content: "⏸";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: calc(var(--u-base) * 2.0);
  opacity: .3;
  pointer-events: none;
}
/* SESSION LIFECYCLE — indicador visual de estado */
.session-window.state-idle { filter: saturate(.82); }
.session-window.state-idle .win-hdr::before {
  content: "";
  position: absolute;
  top: calc(var(--u-base) * 0.8);
  right: calc(var(--u-base) * 0.8);
  width: calc(var(--u-base) * 0.6);
  height: calc(var(--u-base) * 0.6);
  border-radius: 50%;
  background: rgba(255, 200, 60, .75);
  pointer-events: none;
}
.session-window.state-loading .win-hdr::before {
  content: "";
  position: absolute;
  top: calc(var(--u-base) * 0.8);
  right: calc(var(--u-base) * 0.8);
  width: calc(var(--u-base) * 0.6);
  height: calc(var(--u-base) * 0.6);
  border-radius: 50%;
  background: rgba(0, 242, 255, .8);
  animation: session-loading-pulse 1s ease-in-out infinite;
  pointer-events: none;
}
@keyframes session-loading-pulse {
  0%, 100% { opacity: .3; }
  50% { opacity: 1; }
}
/* DOCK */
#dock {
  position: fixed;
  left: var(--dock-offset-x);
  bottom: calc(var(--dock-bottom-gap) + var(--safe-bottom));
  z-index: var(--z-dock);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--u-base) * 1.0);
  padding: calc(var(--u-base) * 1.2) calc(var(--u-base) * 1.0);
  border-radius: calc(var(--u-base) * 2.4);
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(calc(var(--u-base) * 1.5));
  -webkit-backdrop-filter: blur(calc(var(--u-base) * 1.5));
  border: 1px solid rgba(255,255,255,.1);
}
#dock:empty { opacity: 0; pointer-events: none; }
.dock-bubble {
  width: calc(var(--u-base) * 4.2);
  height: calc(var(--u-base) * 4.2);
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(255,255,255,.10);
  border: 1px solid rgba(255,255,255,.20);
  color: #fff;
  cursor: pointer;
  font-family: "Noto Sans Symbols 2", "Noto Sans Symbols", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: calc(var(--u-base) * 1.9);
  line-height: 1;
  touch-action: manipulation;
}
/* TAB SWITCHER OVERLAY */
.tab-switcher-overlay {
  position: fixed;
  inset: 0;
  z-index: var(--z-tab-switcher);
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(calc(var(--u-base) * 1.0));
  display: none;
  align-items: center;
  justify-content: center;
  padding: calc(var(--u-base) * 2.0);
  opacity: 0;
  transition: opacity .25s ease;
}
.tab-switcher-overlay.open {
  display: flex;
  opacity: 1;
}
.tab-switcher-panel {
  background: rgba(30,30,40,0.95);
  backdrop-filter: blur(calc(var(--u-base) * 2.0));
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: calc(var(--u-base) * 3.2);
  max-width: calc(var(--u-base) * 64);
  width: 100%;
  max-height: 80vh;
  padding: calc(var(--u-base) * 2.4) calc(var(--u-base) * 2.0) calc(var(--u-base) * 2.0);
  box-shadow: 0 calc(var(--u-base) * 2.0) calc(var(--u-base) * 6.0) rgba(0,0,0,0.7);
  overflow-y: auto;
}
.tab-switcher-panel .panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: calc(var(--u-base) * 1.8);
}
.tab-switcher-panel .panel-header h2 {
  font-size: calc(var(--u-base) * 1.8);
  font-weight: 700;
  letter-spacing: 0.5px;
}
.tab-switcher-panel .panel-actions {
  display: flex;
  gap: calc(var(--u-base) * 1.0);
}
.tab-switcher-panel .panel-actions button {
  background: rgba(255,255,255,0.08);
  border: 0;
  border-radius: calc(var(--u-base) * 3.0);
  padding: calc(var(--u-base) * 0.8) calc(var(--u-base) * 1.6);
  color: #fff;
  font-size: calc(var(--u-base) * 1.3);
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: calc(var(--u-base) * 0.6);
}
.tab-switcher-panel .panel-actions button:hover { background: rgba(255,255,255,0.15); }
.tab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(calc(var(--u-base) * 18), 1fr));
  gap: calc(var(--u-base) * 1.2);
}
.tab-card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: calc(var(--u-base) * 1.8);
  padding: calc(var(--u-base) * 1.4) calc(var(--u-base) * 1.2);
  cursor: pointer;
  transition: background .15s, transform .15s;
  display: flex;
  flex-direction: column;
  gap: calc(var(--u-base) * 0.6);
  position: relative;
}
.tab-card:hover { background: rgba(255,255,255,0.10); transform: scale(1.01); }
.tab-card.active { border-color: #4af; background: rgba(0,150,255,0.12); }
.tab-card .tab-title {
  font-size: calc(var(--u-base) * 1.3);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tab-card .tab-url {
  font-size: calc(var(--u-base) * 1.0);
  opacity: 0.5;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tab-card .tab-close {
  position: absolute;
  top: calc(var(--u-base) * 0.6);
  right: calc(var(--u-base) * 0.6);
  width: calc(var(--u-base) * 2.4);
  height: calc(var(--u-base) * 2.4);
  border-radius: 50%;
  border: 0;
  background: rgba(255,0,0,0.2);
  color: #f66;
  display: grid;
  place-items: center;
  cursor: pointer;
  opacity: 0;
  transition: opacity .15s;
  font-size: calc(var(--u-base) * 1.4);
}
.tab-card:hover .tab-close { opacity: 1; }
.tab-card .tab-close:hover { background: rgba(255,0,0,0.4); }
.tab-card .tab-fav {
  position: absolute;
  top: calc(var(--u-base) * 0.6);
  left: calc(var(--u-base) * 0.6);
  width: calc(var(--u-base) * 2.4);
  height: calc(var(--u-base) * 2.4);
  border-radius: 50%;
  border: 0;
  background: transparent;
  color: #fa0;
  display: grid;
  place-items: center;
  cursor: pointer;
  font-size: calc(var(--u-base) * 1.4);
  opacity: 0.4;
  transition: opacity .15s;
}
.tab-card .tab-fav.active { opacity: 1; }
.tab-card .tab-fav:hover { opacity: 1; }
/* Responsive */
@media (max-width: 600px) {
  :root { --session-radius: calc(var(--u-base) * 2.2); --session-gap: calc(var(--u-base) * 1.0); }
  .session-window { width: 100%; }
  .tab-grid { grid-template-columns: 1fr 1fr; }
}
@media (hover:none) and (pointer:coarse) {
  .session-window .resize-corner { width: calc(var(--u-base) * 5.8); height: calc(var(--u-base) * 5.8); }
  .tab-card .tab-close { opacity: 1; }
}

<script>
/* ═══════════════════════════════════════════════════════════════
   u-base persistence — salva e restaura --u-base no localStorage
   ─ Colar DEPOIS do core, ANTES de </body>
   ─ Chave: 'u_base_value'
   ─ Valor: número em px (ex.: 14, 10.5)
   ═══════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  const LS_KEY = 'u_base_value';
  const ROOT = document.documentElement;

  /* ─────────── 1) RESTAURA ANTES DO PRIMEIRO PAINT ───────────
     Roda o mais cedo possível. Se houver valor salvo, aplica
     inline (sobrescreve o clamp). Se não, remove inline (clamp age). */
  function restore() {
    let v = null;
    try { v = localStorage.getItem(LS_KEY); } catch (_) {}
    if (v != null && v !== '' && !Number.isNaN(parseFloat(v))) {
      ROOT.style.setProperty('--u-base', parseFloat(v) + 'px');
    } else {
      ROOT.style.removeProperty('--u-base');
    }
  }

  /* ─────────── 2) SALVA O VALOR ATUAL DO SLIDER ─────────── */
  function save(value) {
    const v = (value != null ? value : readSlider());
    if (v == null || Number.isNaN(v)) return;
    try { localStorage.setItem(LS_KEY, String(v)); } catch (_) {}
  }

  function readSlider() {
    const input = document.querySelector('.scale-slider');
    if (!input) return null;
    const v = parseFloat(input.value);
    return Number.isNaN(v) ? null : v;
  }

  /* ─────────── 3) SINCRONIZA O SLIDER COM O VALOR SALVO ───────────
     Se restauramos `14px`, o slider precisa mostrar 14 (não 10).
     Isso roda quando o slider já existe no DOM. */
  function syncSliderToRestored() {
    const input = document.querySelector('.scale-slider');
    if (!input) return;
    let v = null;
    try { v = localStorage.getItem(LS_KEY); } catch (_) {}
    if (v != null && v !== '' && !Number.isNaN(parseFloat(v))) {
      input.value = String(parseFloat(v));
    }
    /* liga listeners de salvamento */
    if (input.dataset.ubaseWired === '1') return;
    input.dataset.ubaseWired = '1';
    input.addEventListener('input', function () { save(this.value); });
    input.addEventListener('change', function () { save(this.value); });
    /* duplo clique = reset para o clamp */
    input.addEventListener('dblclick', function () {
      try { localStorage.removeItem(LS_KEY); } catch (_) {}
      ROOT.style.removeProperty('--u-base');
      /* re-sincroniza o slider com o valor efetivo do clamp */
      requestAnimationFrame(() => {
        const effective = parseFloat(getComputedStyle(ROOT).getPropertyValue('--u-base'));
        if (!Number.isNaN(effective)) this.value = String(effective);
      });
    });
  }

  /* ─────────── 4) BOOT ─────────── */
  /* Restaura IMEDIATAMENTE (o <script> já está no fim do body,
     então a página está parseada — dá pra aplicar antes do primeiro paint). */
  restore();

  /* Sincroniza o slider + listeners quando o DOM estiver pronto.
     Como o <script> está no fim do body, o DOM já existe; mas
     garantimos via rAF para evitar corrida com o core. */
  requestAnimationFrame(() => {
    syncSliderToRestored();
    save(); // se estiver vazio e o slider estiver em 10, salva 10 (opcional, idempotente)
  });

  /* Rede de segurança: salva no unload / aba escondida */
  window.addEventListener('beforeunload', () => save());
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') save();
  });

  /* API mínima (opcional, útil no console) */
  window.UBaseStore = {
    get() { try { return parseFloat(localStorage.getItem(LS_KEY)); } catch (_) { return NaN; } },
    set(v) { save(v); ROOT.style.setProperty('--u-base', parseFloat(v) + 'px'); syncSliderToRestored(); },
    clear() {
      try { localStorage.removeItem(LS_KEY); } catch (_) {}
      ROOT.style.removeProperty('--u-base');
    }
  };
})();
</script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   iFSw — PERSIST + AUDIO-GUARD  (override de fechamento)
   ─ Colar DEPOIS do core e do u-base-store, ANTES de </body>
   ─
   FUNÇÕES:
   1) Persiste session-window (URL, tabs, classe, posição, audio-state)
      em localStorage['dual_sessions_v1']
   2) Restaura no load (recria as que faltam, re-aquece o core)
   3) Detecta áudio tocando (postMessage + mediaSession + atributo)
   4) Impede idle/suspend/minimize-dock de matar áudio ativo
   ═══════════════════════════════════════════════════════════════════ */
(function (global) {
  'use strict';
  if (global.__IFSW_PERSIST_AUDIO__) return;
  global.__IFSW_PERSIST_AUDIO__ = true;

  /* ─────────── CONFIG ─────────── */
  const LS_SESSIONS   = 'dual_sessions_v1';
  const LS_TABS_PFX   = 'dual_tabs_';
  const SESSION_SEL   = '.session-window:not(.tab-switcher-overlay)';
  const INITIAL_ID    = 'session-iframe';
  const SAVE_DEBOUNCE = 250;
  const AUDIO_POLL_MS = 2000;   // fallback de poll (mediaSession)
  const AUDIO_STALE_MS = 8000;  // se não receber update por 8s, considera parado (evita "grudar" true)

  /* ─────────── ESTADO ─────────── */
  // Mapa: id → { playing: bool, source: 'postMessage'|'mediaSession'|'attr', at: ts }
  const audioState = new Map();
  const stack = document.getElementById('stackWrap');

  /* ═══════════════════════════════════════════════════════════
     1) AUDIO DETECTION
     ═══════════════════════════════════════════════════════════ */

  /* 1a) postMessage bridge (recomendado — o app do iframe reporta)
     O iframe manda: window.parent.postMessage({type:'ifsw:media', playing:true}, '*')
     Aqui só associamos ao iframe mais próximo via event.source */
  window.addEventListener('message', function (ev) {
    const d = ev.data;
    if (!d || d.type !== 'ifsw:media') return;
    // identifica a session dona desse iframe
    const iframe = [...document.querySelectorAll('iframe.win-frame')].find(f => f.contentWindow === ev.source);
    if (!iframe) return;
    const win = iframe.closest('.session-window');
    if (!win) return;
    setAudio(win.id, !!d.playing, 'postMessage');
    win.dataset.audio = d.playing ? '1' : '0';
  }, false);

  /* 1b) atributo data-audio="1" — você pode setar manualmente (ex.: via devtools ou se injetar script no app) */
  function readAttr() {
    document.querySelectorAll(SESSION_SEL).forEach(win => {
      if (win.dataset.audio === '1') setAudio(win.id, true, 'attr');
    });
  }

  /* 1c) mediaSession heurístico — o browser expõe metadata global.
     Não sabemos de qual iframe veio, mas se estiver tocando, marcamos
     a session *ativa* (focused/última com pointerdown) como "com áudio".
     É fallback, não confiável sozinho. */
  function readMediaSession() {
    try {
      if (!('mediaSession' in navigator)) return;
      const st = navigator.mediaSession.playbackState; // 'playing' | 'paused' | 'none'
      if (st === 'playing' && global.__lastActiveSessionId) {
        setAudio(global.__lastActiveSessionId, true, 'mediaSession');
      }
    } catch (_) {}
  }

  /* 1d) Áudio do próprio parent (AudioContext global) — cobre se o parent
     também tocar (ex.: TTS do próprio OS via speechSynthesis) */
  function readParentSpeech() {
    try {
      if (typeof speechSynthesis !== 'undefined' && speechSynthesis.speaking) {
        // marca o parent como "tocando" — não é session, mas impede o idle global
        global.__parentSpeaking = true;
      } else {
        global.__parentSpeaking = false;
      }
    } catch (_) {}
  }

  /* setter central */
  function setAudio(id, playing, source) {
    if (!id) return;
    const prev = audioState.get(id);
    audioState.set(id, { playing: !!playing, source: source || (prev && prev.source) || 'unknown', at: Date.now() });
    // reflete no DOM pra CSS/inspeção
    const win = document.getElementById(id);
    if (win) win.dataset.audio = playing ? '1' : '0';
    // se voltou a tocar, "acorda" a sessão (sai de idle)
    if (playing && win) {
      const st = win.dataset.state;
      if (st === 'idle' && global.SessionLifecycle) global.SessionLifecycle.touch(id);
    }
  }

  function isPlaying(id) {
    const s = audioState.get(id);
    if (!s || !s.playing) return false;
    // stale check — evita "grudar" true se o iframe parou de reportar
    if (Date.now() - s.at > AUDIO_STALE_MS) {
      audioState.set(id, { ...s, playing: false });
      return false;
    }
    return true;
  }

  /* limpa audioState quando a session sai do DOM */
  function pruneAudioState() {
    const alive = new Set([...document.querySelectorAll(SESSION_SEL)].map(w => w.id));
    [...audioState.keys()].forEach(id => { if (!alive.has(id)) audioState.delete(id); });
  }

  /* ═══════════════════════════════════════════════════════════
     2) HOOK NO SessionLifecycle DO CORE
     Impede que sessões com áudio virem IDLE/SUSPENDED.
     O core atual NÃO tem callback público pra isso, mas o
     setInterval dele chama setSessionState(..., 'idle') e
     suspendSession(id). Vamos interceptar via monkey-patch.
     ═══════════════════════════════════════════════════════════ */
  function installAudioGuard() {
    if (!global.SessionLifecycle) return;

    /* 2a) patch em suspend: se tocar áudio, NÃO suspende */
    const _suspend = global.SessionLifecycle.suspend;
    if (typeof _suspend === 'function') {
      global.SessionLifecycle.suspend = function (id) {
        if (isPlaying(id)) {
          console.debug('[audio-guard] suspend bloqueado para', id, '(áudio tocando)');
          return;
        }
        return _suspend.call(this, id);
      };
    }

    /* 2b) patch em touch — sempre permitido (acorda), sem mudança */

    /* 2c) patch no minimizeWindow global (que chama suspendSession) */
    if (typeof global.minimizeWindow === 'function' && !global.minimizeWindow.__audioGuarded) {
      const _min = global.minimizeWindow;
      global.minimizeWindow = function (id) {
        if (isPlaying(id)) {
          // NÃO suspende — só esconde com CSS e joga no dock
          const win = document.getElementById(id);
          if (win) {
            win.classList.add('minimized', 'audio-minimized');
            // esconde mas NÃO remove o iframe — áudio continua
            win.style.position = 'absolute';
            win.style.width = '1px';
            win.style.height = '1px';
            win.style.opacity = '0';
            win.style.pointerEvents = 'none';
            win.style.overflow = 'hidden';
            // registra no dock
            addDockBubble(id);
          }
          return;
        }
        return _min.call(this, id);
      };

    }

  }

  /* bubble de dock "manual" (o core cria um ao minimizar; aqui replicamos
     pra quando o áudio-guard bloqueia o suspend) */
  function addDockBubble(id) {
    const dock = document.getElementById('dock');
    if (!dock) return;
    if (document.getElementById('dock-' + id)) return;
    const bubble = document.createElement('button');
    bubble.type = 'button';
    bubble.className = 'dock-bubble audio-dot';
    bubble.id = 'dock-' + id;
    bubble.title = 'Restaurar janela (áudio ativo)';
    bubble.setAttribute('aria-label', 'Restaurar janela');
    bubble.textContent = '🎵';
    bubble.addEventListener('click', function (e) {
      e.preventDefault(); e.stopPropagation();
      const win = document.getElementById(id);
      if (win) {
        win.classList.remove('minimized', 'audio-minimized');
        win.style.position = '';
        win.style.width = '';
        win.style.height = '';
        win.style.opacity = '';
        win.style.pointerEvents = '';
        win.style.overflow = '';
      }
      bubble.remove();
    });
    dock.appendChild(bubble);
  }

  /* ═══════════════════════════════════════════════════════════
     3) PERSISTÊNCIA DE SESSÕES
     ═══════════════════════════════════════════════════════════ */

  function serialize(win) {
    if (!win || win.id === 'tabSwitcherOverlay') return null;
    const frame = win.querySelector('.win-frame');
    let url = null, srcdoc = null;
    if (frame) {
      if (frame.src && !frame.src.startsWith('about:') && !frame.src.startsWith('blob:')) url = frame.src;
      else if (frame.srcdoc) srcdoc = frame.srcdoc.slice(0, 50000);
    }
    let tabs = null;
    try {
      const raw = localStorage.getItem(LS_TABS_PFX + win.id);
      if (raw) tabs = JSON.parse(raw);
    } catch (_) {}
    const cls = [...win.classList].filter(c =>
      ['peeked','collapsed','maximized','minimized','suspended','audio-minimized'].includes(c)
    );
    const stylePos = {};
    ['left','top','right','bottom','width','height','position','opacity','pointerEvents'].forEach(p => {
      if (win.style[p]) stylePos[p] = win.style[p];
    });
    const a = audioState.get(win.id);
    return {
      id: win.id,
      isInitial: win.id === INITIAL_ID,
      url, srcdoc,
      tabs,
      cls,
      state: win.dataset.state || null,
      audio: a ? { playing: a.playing, source: a.source } : null,
      stylePos,
      order: [...stack.children].indexOf(win)
    };
  }

  function saveSessions() {
    if (!stack) return;
    const list = [];
    stack.querySelectorAll(SESSION_SEL).forEach(win => {
      const s = serialize(win);
      if (s) list.push(s);
    });
    try {
      localStorage.setItem(LS_SESSIONS, JSON.stringify(list));
    } catch (e) {
      try {
        const light = list.map(({ srcdoc, ...rest }) => rest);
        localStorage.setItem(LS_SESSIONS, JSON.stringify(light));
        console.warn('[persist] quota — salvando sem srcdoc');
      } catch (_) {}
    }
  }

  let saveTimer = null;
  function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveSessions, SAVE_DEBOUNCE); }

  /* reconstrói o HTML de uma session a partir do registro salvo */
  function buildSession(s) {
    const win = document.createElement('section');
    win.className = ['session-window', ...(s.cls || [])].join(' ');
    win.id = s.id;
    if (s.state) win.dataset.state = s.state;
    if (s.audio && s.audio.playing) win.dataset.audio = '1';
    // restaura posição inline (se houver)
    Object.entries(s.stylePos || {}).forEach(([k, v]) => { win.style[k] = v; });

    // tabs (o core lê de localStorage no wire)
    if (s.tabs) {
      try { localStorage.setItem(LS_TABS_PFX + s.id, JSON.stringify(s.tabs)); } catch (_) {}
    }
    const tabsCount = s.tabs && s.tabs.tabs ? s.tabs.tabs.length : 1;
    const activeTab = s.tabs && s.tabs.tabs ? (s.tabs.tabs.find(t => t.id === s.tabs.activeId) || s.tabs.tabs[0]) : null;
    const src = (activeTab && activeTab.url) || s.url || 'https://www.infodose.com.br/splash';

    win.innerHTML = `
      <div class="win-hdr">
        <div class="win-controls">
          <button type="button" data-action="collapse" title="Colapsar" aria-label="Colapsar">−</button>
          <button type="button" data-action="tab-switcher" class="tab-counter">${tabsCount}</button>
          <button type="button" data-action="maximize" title="Maximizar" aria-label="Maximizar">⛶</button>
          <button type="button" data-action="minimize" title="Minimizar" aria-label="Minimizar">۞</button>
          <button type="button" data-action="close" title="Fechar" aria-label="Fechar">×</button>
        </div>
        <div class="win-navrow" style="flex:2;min-width:0;pointer-events:auto;">
          <input class="win-urlbar" type="text" value="${(src || '').replace(/"/g,'&quot;')}" placeholder="Digite uma URL..." spellcheck="false" autocomplete="off">
          <button class="win-go-btn" type="button">Go</button>
        </div>
      </div>
      ${s.srcdoc
        ? `<iframe class="win-frame" data-runtime="nav" srcdoc="${s.srcdoc.replace(/"/g,'&quot;')}"></iframe>`
        : `<iframe class="win-frame" data-runtime="nav" src="${(src || 'about:blank').replace(/"/g,'&quot;')}"></iframe>`}
    `;
    // mantém audioState sincronizado
    if (s.audio && s.audio.playing) {
      setAudio(s.id, true, s.audio.source || 'restored');
    }
    return win;
  }

  function restoreSessions() {
    if (!stack) return;
    let list = [];
    try { list = JSON.parse(localStorage.getItem(LS_SESSIONS) || '[]'); } catch (_) {}
    if (!Array.isArray(list) || !list.length) return;
    list.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

    let created = 0;
    list.forEach(s => {
      if (!s || !s.id) return;
      if (s.id === INITIAL_ID) return; // já está no HTML
      if (document.getElementById(s.id)) return;
      const node = buildSession(s);
      stack.appendChild(node);
      created++;
    });

    if (created > 0) {
      // "adota" as novas sessions no core: como o core já rodou, ele não
      // vai wireSession automático. O jeito mais seguro é chamar wireSession
      // via createSessionWindow? Não — usamos SessionLifecycle.touch + wire manual.
      adoptSessions();
    }
  }

  /* wire mínimo em sessions restauradas (mesmo contrato do core) */
  function adoptSessions() {
    if (typeof global.__wireSessionAdopt === 'function') return global.__wireSessionAdopt();
    // fallback: liga controles manualmente
    document.querySelectorAll(SESSION_SEL).forEach(win => {
      if (win.dataset.adopted === '1') return;
      if (win.dataset.wired === '1') return;
      win.dataset.adopted = '1';
      wireRestoredSession(win);
    });
  }

  function wireRestoredSession(win) {
    // controles
    win.querySelector('.win-controls')?.addEventListener('click', function (e) {
      const btn = e.target.closest('button'); if (!btn) return;
      const a = btn.dataset.action;
      if (a === 'collapse' && global.toggleCollapse) global.toggleCollapse(win.id);
      else if (a === 'maximize' && global.maximizeWindow) global.maximizeWindow(win.id);
      else if (a === 'minimize' && global.minimizeWindow) global.minimizeWindow(win.id);
      else if (a === 'close' && global.closeWindow) global.closeWindow(win.id);
      else if (a === 'tab-switcher') {
        // abre o switcher do core se existir
        document.querySelector('#tabCounterInit')?.click?.();
      }
    });
    // urlbar + go
    const input = win.querySelector('.win-urlbar');
    const go = win.querySelector('.win-go-btn');
    go?.addEventListener('click', function (e) {
      e.preventDefault(); e.stopPropagation();
      if (!input) return;
      let url = input.value.trim(); if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      const frame = win.querySelector('.win-frame');
      if (frame) frame.src = url;
      input.value = url;
      // atualiza tab salva
      try {
        const raw = localStorage.getItem(LS_TABS_PFX + win.id);
        if (raw) {
          const d = JSON.parse(raw);
          const idx = d.tabs.findIndex(t => t.id === d.activeId);
          if (idx >= 0) { d.tabs[idx].url = url; d.tabs[idx].title = url.replace(/^https?:\/\//,'').split('/')[0]; localStorage.setItem(LS_TABS_PFX + win.id, JSON.stringify(d)); }
        }
      } catch (_) {}
      scheduleSave();
    });
    input?.addEventListener('keydown', e => { if (e.key === 'Enter') { e.stopPropagation(); go?.click(); } });
    // touch no pointerdown
    win.addEventListener('pointerdown', () => {
      if (global.SessionLifecycle) global.SessionLifecycle.touch(win.id);
    }, { passive: true });
  }

  /* ═══════════════════════════════════════════════════════════
     4) OBSERVERS / HOOKS
     ═══════════════════════════════════════════════════════════ */

  function observeStack() {
    if (!stack) return;
    const mo = new MutationObserver(() => { scheduleSave(); pruneAudioState(); });
    mo.observe(stack, { childList: true, subtree: true, attributes: true, attributeFilter: ['class','id','data-state','data-audio'] });
  }

  function hookCreateButton() {
    const btn = document.getElementById('openKobBtn');
    if (!btn || btn.dataset.persistHook === '1') return;
    btn.dataset.persistHook = '1';
    btn.addEventListener('click', () => {
      setTimeout(scheduleSave, 300);
      setTimeout(() => { adoptSessions(); readAttr(); }, 400);
    }, { passive: true });
  }

  function hookLastActiveSession() {
    document.addEventListener('pointerdown', function (e) {
      const win = e.target.closest && e.target.closest('.session-window');
      if (win) global.__lastActiveSessionId = win.id;
    }, { passive: true, capture: true });
  }

  /* ═══════════════════════════════════════════════════════════
     5) BOOT
     ═══════════════════════════════════════════════════════════ */

  function boot() {
    // 1) restaura sessions (após core ter rodado)
    setTimeout(() => {
      restoreSessions();
      adoptSessions();
    }, 60);

    // 2) instala guard de áudio (depois do core — pra monkey-patch pegar as refs certas)
    setTimeout(installAudioGuard, 100);

    // 3) observers + hooks
    observeStack();
    hookCreateButton();
    hookLastActiveSession();
    readAttr();

    // 4) poll de fallback (mediaSession + speech + attr)
    setInterval(() => {
      readMediaSession();
      readParentSpeech();
      readAttr();
    }, AUDIO_POLL_MS);

    // 5) salva no unload
    window.addEventListener('beforeunload', saveSessions);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') saveSessions();
    });

    console.log('%c[persist+audio] override instalado', 'background:#0f0;color:#000;padding:2px 6px;border-radius:4px;font-weight:700');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  /* ═══════════════════════════════════════════════════════════
     6) API PÚBLICA (pra debug/manual)
     ═══════════════════════════════════════════════════════════ */
  global.IFSWPersist = {
    save: saveSessions,
    restore: restoreSessions,
    clear() { try { localStorage.removeItem(LS_SESSIONS); } catch (_) {} },
    dump() { try { return JSON.parse(localStorage.getItem(LS_SESSIONS) || '[]'); } catch (_) { return []; } },
    /* áudio */
    setAudio(id, playing, source) { setAudio(id, playing, source || 'manual'); },
    isPlaying,
    listAudio() { return [...audioState.entries()].map(([id, v]) => ({ id, ...v })); }
  };
})(window);
</script>
</body></html>
