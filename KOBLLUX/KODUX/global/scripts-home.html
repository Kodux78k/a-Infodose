<script id="kob-soneto-core">
(function KOB_SONETO(){
  'use strict';
  if (window.KOB_SONETO) { return; }
  window.KOB_SONETO = '1.1';

  if (!window.KOB_SPEECH && 'speechSynthesis' in window) {
    var ss = window.speechSynthesis, native = ss.speak.bind(ss), stages = [];
    var at = function(i){ return function(u){ return i < stages.length ? stages[i].run(u, at(i+1)) : native(u); }; };
    window.KOB_SPEECH = {
      use: function(name, order, run){ stages = stages.filter(function(s){ return s.name !== name; }); stages.push({name:name, order:order, run:run}); stages.sort(function(a,b){ return a.order - b.order; }); return true; },
      has: function(name){ return stages.some(function(s){ return s.name === name; }); },
      list: function(){ return stages.map(function(s){ return s.name + ':' + s.order; }); }
    };
    ss.speak = function(u){ return at(0)(u); };
  }

  window.KOB_TTS_CHUNK = window.KOB_TTS_CHUNK || function(txt, max){
    max = max || 220;
    var atoms = [];
    function hard(s){
      var cur = '', ws = s.split(' ');
      for (var i = 0; i < ws.length; i++){
        var w = ws[i];
        if (w.length > max){ if (cur){ atoms.push(cur); cur = ''; } for (var k = 0; k < w.length; k += max) atoms.push(w.slice(k, k+max)); continue; }
        if ((cur ? cur.length+1 : 0) + w.length > max){ atoms.push(cur); cur = w; } else cur = cur ? cur+' '+w : w;
      }
      if (cur) atoms.push(cur);
    }
    String(txt == null ? '' : txt).split(/\n+/).forEach(function(line){
      line = line.replace(/\s+/g,' ').trim(); if (!line) return;
      line.split(/(?<=[.!?…;:])\s+/).forEach(function(sent){
        if (sent.length <= max){ atoms.push(sent); return; }
        sent.split(/(?<=[,)\]—–])\s+/).forEach(function(part){
          if (part.length <= max) atoms.push(part); else hard(part);
        });
      });
    });
    var out = [], buf = '';
    atoms.forEach(function(a){ if (buf && buf.length+1+a.length > max){ out.push(buf); buf = a; } else buf = buf ? buf+' '+a : a; });
    if (buf) out.push(buf);
    return out;
  };

  var ARC = {
    ATLAS:   {n:'Atlas',    v:'Daniel',  l:'en-US', r:1.02,  p:1.39, c1:'#78e3ff', c2:'#b978ff'},
    NOVA:    {n:'Nova',     v:'Luciana', l:'pt-BR', r:1.063, p:1.34, c1:'#ff6b6b', c2:'#ffb347'},
    VITALIS: {n:'Vitalis',  v:'Rocko',   l:'pt-BR', r:0.96,  p:1.42, c1:'#4ecdc4', c2:'#45b7d1'},
    PULSE:   {n:'Pulse',    v:'Reed',    l:'pt-BR', r:1.00,  p:1.78, c1:'#a8e6cf', c2:'#d4a5a5'},
    ARTEMIS: {n:'Artemis',  v:'Paulina', l:'es-MX', r:1.00,  p:1.23, c1:'#ffd93d', c2:'#ff9f1c'},
    SERENA:  {n:'Serena',   v:'Joana',   l:'pt-BR', r:0.92,  p:0.90, c1:'#b8e1ff', c2:'#a0b9ff'},
    KAOS:    {n:'Kaos',     v:'Rocko',   l:'pt-BR', r:1.28,  p:0.67, c1:'#ff8066', c2:'#b624ff'},
    GENUS:   {n:'Genus',    v:'Reed',    l:'pt-BR', r:0.98,  p:1.20, c1:'#95e1d3', c2:'#f38181'},
    LUMINE:  {n:'Lumine',   v:'Flo',     l:'fr-FR', r:1.03,  p:1.87, c1:'#f9f3b2', c2:'#ffe69b'},
    SOLUS:   {n:'Solus',    v:'Satu',    l:'fi-FI', r:0.90,  p:0.58, c1:'#ffb347', c2:'#ff8c42'},
    RHEA:    {n:'Rhea',     v:'Alice',   l:'it-IT', r:1.02,  p:1.44, c1:'#b5eaea', c2:'#80b3ff'},
    AION:    {n:'Aion',     v:'Milena',  l:'ru-RU', r:1.07,  p:1.08, c1:'#c79aff', c2:'#9f7aff'},
    KODUX:   {n:'Kodux',    v:'Rocko',   l:'pt-BR', r:1.00,  p:0.07, c1:'#F97316', c2:'#fb923c'},
    BLLUE:   {n:'Bllue',    v:'Zuzana',  l:'cs-CZ', r:0.94,  p:1.69, c1:'#8fd3ff', c2:'#b8e1ff'},
    JESUS:   {n:'Jesus',    v:'Sara',    l:'da-DK', r:1.09,  p:0.03, c1:'#FFD700', c2:'#FFB84D'},
    KOBLLUX: {n:'KOBLLUX',  v:'Luciana', l:'pt-BR', r:0.98,  p:0.48, c1:'#22D3EE', c2:'#0E7C9E'},
    INFODOSE:{n:'Infodose', v:'Luciana', l:'pt-BR', r:1.06,  p:0.96, c1:'#22C55E', c2:'#166534'}
  };
  var ARCH_LIST = Object.keys(ARC);
  window.KOB_SONETO_ARCH = 'KOBLLUX';

  var voices = [];
  function loadVoices(){ voices = ('speechSynthesis' in window) ? speechSynthesis.getVoices() : []; }
  if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; setTimeout(loadVoices, 400); }
  var norm = function(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); };
  function findVoice(cfg){
    if (!voices.length) loadVoices();
    var n = norm(cfg.v || cfg.nome || ''), l = norm(cfg.l || cfg.lang || '').split('-')[0];
    return voices.find(function(v){ return norm(v.name).includes(n) && norm(v.lang).startsWith(l); })
        || voices.find(function(v){ return norm(v.lang).startsWith(l); })
        || voices.find(function(v){ return norm(v.lang).startsWith('pt'); })
        || voices[0] || null;
  }
  function forArch(name, text){
    var cfg = ARC[String(name||'KOBLLUX').toUpperCase()] || ARC.KOBLLUX;
    var u = new SpeechSynthesisUtterance(text || '');
    u.lang = cfg.l; u.rate = cfg.r; u.pitch = cfg.p;
    var v = findVoice(cfg);
    if (v){ u.voice = v; u.lang = v.lang || cfg.l; }
    return u;
  }
  window.KBLX_VOICE = window.KBLX_VOICE || { map: ARC, find: findVoice, forArch: forArch };

  var root = document.documentElement;
  function hexToRgb(h){ h = String(h).replace('#',''); if (h.length===3) h=h.split('').map(function(c){return c+c}).join(''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
  function mix(a,b,t){ var A=hexToRgb(a),B=hexToRgb(b); return '#'+A.map(function(v,i){ var x=Math.round(v+(B[i]-v)*t); return x.toString(16).padStart(2,'0'); }).join(''); }
  function applyLayers(activeArch){
    var A = ARC[String(activeArch||'KOBLLUX').toUpperCase()] || ARC.KOBLLUX;
    root.style.setProperty('--kob-L-primary',   A.c1);
    root.style.setProperty('--kob-L-secondary', A.c2);
    root.style.setProperty('--active-color',    A.c1);
    root.style.setProperty('--active-secondary',A.c2);
    root.style.setProperty('--active-glow',     mix(A.c1, '#000000', 0.5));
  }
  function setArch(name){
    name = String(name||'KOBLLUX').toUpperCase();
    if (!ARC[name]) name = 'KOBLLUX';
    window.KOB_SONETO_ARCH = name;
    document.body.setAttribute('data-arch', name.toLowerCase());
    document.body.setAttribute('data-voice-arch', name.toLowerCase());
    applyLayers(name);
    try { window.dispatchEvent(new CustomEvent('kob:arch', { detail: { arch: name } })); } catch(e){}
    paintHeader();
    try { KOBSonoro && KOBSonoro.transition(name); } catch(e){}
    return name;
  }
  window.applyArch = window.applyArch || function(n){ return setArch(n); };

  var busClickMode = 'auto';
  try { busClickMode = localStorage.getItem('kob:voice:click') || 'auto'; } catch(e){}
  var KOBBus = window.KOBBus = {
    get clickMode(){ return busClickMode; },
    setClickMode: function(m){ busClickMode = m; try { localStorage.setItem('kob:voice:click', m); } catch(e){} return m; },
    cycleClickMode: function(){ var m = ['auto','labels','off']; return this.setClickMode(m[(m.indexOf(busClickMode)+1)%3]); },
    currentArch: function(){ return window.KOB_SONETO_ARCH || 'KOBLLUX'; },
    extractText: function(target){
      if (!target || target.nodeType !== 1) return '';
      var ctl = target.closest && target.closest('button,a,[role="button"]');
      if (ctl){
        if (ctl.hasAttribute('data-speak')) return ctl.getAttribute('data-speak');
        if (busClickMode === 'labels'){
          var lab = ctl.getAttribute('aria-label') || ctl.getAttribute('title') || (ctl.innerText||'').trim();
          if (lab && lab.length < 80) return lab;
        }
        return '';
      }
      var blk = target.closest && target.closest('p,li,h1,h2,h3,h4,h5,h6,blockquote,pre,td,th');
      if (blk) return (blk.innerText || '').replace(/\s+/g,' ').trim();
      return '';
    },
    speak: function(text, opts){
      text = String(text||'').replace(/\s+/g,' ').trim();
      if (!text || busClickMode === 'off') return false;
      try { speechSynthesis.cancel(); } catch(e){}
      var u = forArch(this.currentArch(), text);
      if (opts){ if (opts.rate) u.rate = opts.rate; if (opts.pitch) u.pitch = opts.pitch; if (opts.onend) u.onend = opts.onend; if (opts.onstart) u.onstart = opts.onstart; if (opts.onerror) u.onerror = opts.onerror; }
      speechSynthesis.speak(u);
      return true;
    },
    say: function(text, opts){ return this.speak(text, opts); },
    stop: function(){ try { speechSynthesis.cancel(); } catch(e){} },
    nextArch: function(){ var i = ARCH_LIST.indexOf(this.currentArch()); var n = ARCH_LIST[(i+1)%ARCH_LIST.length]; setArch(n); return n; }
  };

  document.addEventListener('click', function(e){
    if (busClickMode === 'off') return;
    var t = e.target;
    if (!t || t.closest && t.closest('#kob-soneto-header, .kob-soneto-ignore, button, input, textarea, select, a, [data-kob-ignore]')) {
      if (!(t.closest && t.closest('[data-speak]'))) return;
    }
    var text = KOBBus.extractText(t);
    if (text) KOBBus.speak(text);
  }, true);

  var outline = document.getElementById('kob-soneto-outline');
  var KOBTTS = {
    blocks: [], curBlock: 0, speaking: false, chunkList: [], chunkIdx: 0, gen: 0,
    scan: function(){
      var r = document.querySelector('.kb-page.active') || document.querySelector('main') || document.body;
      var sel = 'h1,h2,h3,h4,p,li,blockquote,pre,td,th';
      this.blocks = Array.prototype.slice.call(r.querySelectorAll(sel)).filter(function(n){ return (n.innerText||'').trim().length > 0; });
      this.curBlock = 0;
      return this.blocks;
    },
    start: function(){
      this.scan();
      if (!this.blocks.length) return;
      if (this.speaking) { this.stop(); return; }
      this.speaking = true; this.gen++;
      try { speechSynthesis.cancel(); } catch(e){}
      var btn = document.getElementById('kob-soneto-tts'); if (btn) btn.classList.add('playing');
      var self = this;
      setTimeout(function(){ self.speakBlock(self.curBlock, 0); }, 60);
    },
    stop: function(){
      this.gen++;
      this.speaking = false;
      try { speechSynthesis.cancel(); } catch(e){}
      var btn = document.getElementById('kob-soneto-tts'); if (btn) btn.classList.remove('playing');
      if (outline) outline.style.display = 'none';
    },
    toggle: function(){ if (this.speaking) this.stop(); else this.start(); },
    speakBlock: function(idx, fromChunk){
      if (!this.speaking) return;
      if (idx >= this.blocks.length) { this.stop(); return; }
      this.curBlock = idx;
      var el = this.blocks[idx];
      var txt = String(el.innerText || '').replace(/\s+/g,' ').trim();
      if (!txt) { this.speakBlock(idx+1, 0); return; }
      this.chunkList = window.KOB_TTS_CHUNK(txt, 220);
      this.chunkIdx = fromChunk || 0;
      this.speakChunk();
    },
    speakChunk: function(){
      if (!this.speaking) return;
      if (this.chunkIdx >= this.chunkList.length) { this.speakBlock(this.curBlock+1, 0); return; }
      var self = this;
      var u = forArch(window.KOB_SONETO_ARCH, this.chunkList[this.chunkIdx]);
      u.onstart = function(){ if (self.chunkIdx === 0) self.showOutline(self.blocks[self.curBlock]); };
      u.onend = function(){ if (!self.speaking) return; self.chunkIdx++; setTimeout(function(){ self.speakChunk(); }, 60); };
      u.onerror = function(ev){ if (!self.speaking) return; if (ev && (ev.error === 'interrupted' || ev.error === 'canceled')) return; self.chunkIdx++; setTimeout(function(){ self.speakChunk(); }, 100); };
      try { speechSynthesis.speak(u); } catch(e){}
    },
    showOutline: function(el){
      if (!el || !outline) return;
      var r = el.getBoundingClientRect();
      if (r.top + r.height < 0 || r.top > innerHeight){ outline.style.display = 'none'; return; }
      outline.style.left = (r.left-4) + 'px';
      outline.style.top  = (r.top-4) + 'px';
      outline.style.width = (r.width+8) + 'px';
      outline.style.height = (r.height+8) + 'px';
      outline.style.display = 'block';
    }
  };

  window.KOBLLUX = window.KOBLLUX || {};
  window.KOBLLUX.speakText = function(txt, opts){ return KOBBus.speak(txt, opts); };
  window.KOBLLUX.startSpeech = function(){ KOBTTS.start(); };
  window.KOBLLUX.stopSpeech  = function(){ KOBTTS.stop(); };
  window.KOBLLUX.toggleSpeech = function(){ KOBTTS.toggle(); };
  window.KOBLLUX.rebuildBlocks = function(){ return KOBTTS.scan(); };

  window.addEventListener('scroll', function(){ if (outline && outline.style.display !== 'none') outline.style.display = 'none'; }, {passive:true, capture:true});
  window.addEventListener('resize', function(){ if (outline && outline.style.display !== 'none') outline.style.display = 'none'; }, {passive:true});

  /* ══ KOBSONORO ══ */
  var KOBSonoro = window.KOBSonoro = window.KOBSonoro || {};
  var SCALES = {
    melancolia: ['A3','B3','C4','D4','E4','F4','G#4','A4','B4','C5','D5','E5','F5','G#5','A5'],
    alegria:    ['C4','D4','E4','G4','A4','C5','D5','E5','G5','A5','C6','D6','E6','G6','A6'],
    misterio:   ['C4','D4','E4','F#4','G#4','A#4','C5','D5','E5','F#5','G#5','A#5','C6','D6','E6'],
    sonho:      ['F3','G3','A3','B3','C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F5'],
    oriental:   ['A3','A#3','D4','E4','F4','A4','A#4','D5','E5','F5','A5']
  };
  var MODES = {ionian:[0,2,4,5,7,9,11],dorian:[0,2,3,5,7,9,10],phrygian:[0,1,3,5,7,8,10],lydian:[0,2,4,6,7,9,11],mixolydian:[0,2,4,5,7,9,10],aeolian:[0,2,3,5,7,8,10],harmMinor:[0,2,3,5,7,8,11],pentMaj:[0,2,4,7,9],pentMin:[0,3,5,7,10],blues:[0,3,5,6,7,10],hirajoshi:[0,2,3,7,8]};
  var ARCH_MUSIC = {
    ATLAS:['dorian','triangle',.55], NOVA:['lydian','sine',.6], VITALIS:['mixolydian','triangle',.45],
    PULSE:['pentMin','square',.3], ARTEMIS:['aeolian','sine',.65], SERENA:['pentMaj','sine',.7],
    KAOS:['phrygian','triangle',.6], GENUS:['harmMinor','sine',.59], LUMINE:['ionian','triangle',.5],
    SOLUS:['hirajoshi','sine',.8], RHEA:['mixolydian','sine',.55], AION:['harmMinor','sine',.7],
    KODUX:['phrygian','sawtooth',.47], BLLUE:['blues','triangle',.5], JESUS:['ionian','sine',.75],
    KOBLLUX:['dorian','triangle',.5], INFODOSE:['mixolydian','sine',.55]
  };
  var ALPHA = 'abcdefghijklmnopqrstuvwxyzáàãâéêíóôõúçñ';
  var SND = { started: false, playing: false, part: null, synths: {}, reverb: null, delay: null };

  async function ensureAudio(){
    if (SND.started) return true;
    if (typeof Tone === 'undefined'){ await new Promise(function(r){ var t = setInterval(function(){ if (typeof Tone !== 'undefined' || performance.now() > 5000){ clearInterval(t); r(); } }, 100); }); }
    if (typeof Tone === 'undefined') return false;
    try { await Tone.start(); } catch(e){}
    try {
      var lim = new Tone.Limiter(-2).toDestination();
      SND.reverb = new Tone.Reverb({decay:3.5, wet:0.4}).connect(lim);
      SND.delay  = new Tone.FeedbackDelay('8n', 0.25).connect(SND.reverb);
      SND.synths.lead = new Tone.PolySynth(Tone.Synth, {oscillator:{type:'triangle'}, envelope:{attack:.02,decay:.3,sustain:.2,release:1.2}}).connect(SND.delay);
      SND.synths.lead.volume.value = -8;
      SND.synths.bubble = new Tone.Synth({oscillator:{type:'sine'}, envelope:{attack:.01,decay:.15,sustain:0,release:.2}}).connect(SND.reverb);
      SND.synths.crystal = new Tone.PolySynth(Tone.FMSynth, {harmonicity:3, modulationIndex:6, envelope:{attack:.005,decay:.4,sustain:0,release:1.2}}).connect(SND.reverb);
      SND.synths.impact = new Tone.MembraneSynth({pitchDecay:.05, octaves:4, envelope:{attack:.001,decay:.3,sustain:0,release:.4}}).connect(lim);
      SND.synths.noise = new Tone.NoiseSynth({noise:{type:'white'}, envelope:{attack:.001,decay:.2,sustain:0,release:.3}}).connect(SND.reverb);
      SND.synths.portal = new Tone.Synth({oscillator:{type:'sawtooth'}, envelope:{attack:.15,decay:.4,sustain:.2,release:.8}}).connect(SND.delay);
      SND.started = true;
      return true;
    } catch(e){ return false; }
  }
  function mtof(m){ return 440 * Math.pow(2, (m-69)/12); }

  var SIG = {
    ATLAS:[57,[0,4,7,12,7,4],0.12,0.09,'triangle'], NOVA:[57,[0,7,11,16,11],0.15,0.08,'sine'],
    VITALIS:[57,[0,7,4,0,-5],0.10,0.05,'triangle'], PULSE:[45,[0,3,7,10,7,3],0.12,0.06,'square'],
    ARTEMIS:[45,[0,3,7,12,15],0.14,0.08,'sine'], SERENA:[57,[0,4,9,14,9,4],0.16,0.10,'sine'],
    KAOS:[33,[0,1,3,8,3,1,0],0.09,0.04,'sawtooth'], GENUS:[45,[0,3,7,8,7,3],0.13,0.08,'sine'],
    LUMINE:[57,[0,4,9,12,16,12],0.11,0.06,'triangle'], SOLUS:[45,[0,2,7,2,-5],0.20,0.14,'sine'],
    RHEA:[57,[0,5,7,12,7,5,0],0.13,0.09,'sine'], AION:[45,[0,3,8,12,8,3],0.14,0.09,'sine'],
    KODUX:[33,[0,3,6,3,0,-5],0.10,0.05,'sawtooth'], BLLUE:[45,[0,3,7,6,3,0],0.12,0.07,'triangle'],
    JESUS:[57,[0,7,12,19,12],0.22,0.16,'sine'], KOBLLUX:[57,[0,3,7,10,14,10],0.15,0.09,'triangle'],
    INFODOSE:[57,[0,2,5,7,9,12,9],0.11,0.06,'sine']
  };

  KOBSonoro.transition = async function(arch){
    var a = String(arch||window.KOB_SONETO_ARCH||'KOBLLUX').toUpperCase();
    var sig = SIG[a] || SIG.KOBLLUX;
    if (!await ensureAudio()) return;
    try { SND.synths.lead.set({oscillator:{type:sig[4]}}); } catch(e){}
    try { SND.synths.lead.releaseAll(Tone.now()); } catch(e){}
    var t = Tone.now() + 0.05;
    sig[1].forEach(function(off){
      var f = mtof(sig[0] + off);
      try { SND.synths.lead.triggerAttackRelease(f, sig[2], t); } catch(e){}
      t += sig[3];
    });
  };
  KOBSonoro.sfx = async function(desc){
    if (!await ensureAudio()) return;
    var d = String(desc||'').toLowerCase(); var now = Tone.now();
    try {
      if (/bolha|bubble|gota|pingo/.test(d)){ var b = 600 + Math.random()*400; SND.synths.bubble.triggerAttackRelease(b, .12, now); SND.synths.bubble.triggerAttackRelease(b*1.5, .1, now+.08); }
      else if (/cristal|crystal|vidro|sino/.test(d)){ [800,1200,1600].forEach(function(f,i){ SND.synths.crystal.triggerAttackRelease(f, .3, now+i*.04); }); }
      else if (/impacto|impact|pancada|thud|boom/.test(d)){ SND.synths.impact.triggerAttackRelease('C1', .2, now); }
      else if (/sopro|whoosh|ruído|noise/.test(d)){ SND.synths.noise.triggerAttackRelease(.25, now); }
      else if (/portal|transição|transition/.test(d)){ SND.synths.portal.frequency.cancelScheduledValues(now); SND.synths.portal.frequency.setValueAtTime(200, now); SND.synths.portal.frequency.exponentialRampToValueAtTime(1800, now+.5); SND.synths.portal.triggerAttackRelease('A3', .4, now); }
      else { SND.synths.bubble.triggerAttackRelease(800, .1, now); SND.synths.bubble.triggerAttackRelease(1200, .1, now+.08); }
    } catch(e){}
  };
  KOBSonoro.play = async function(text){
    if (!await ensureAudio()) return false;
    if (SND.playing) { KOBSonoro.stop(); return false; }
    text = String(text || active.text || 'KOBLLUX').trim();
    if (!text) return false;
    var cfg = ARCH_MUSIC[window.KOB_SONETO_ARCH] || ARCH_MUSIC.KOBLLUX;
    try { SND.reverb.wet.rampTo(cfg[2], 0.4); } catch(e){}
    var base = SCALES.melancolia;
    var rootMidi = Tone.Frequency(base[0]).toMidi();
    var mode = MODES[cfg[0]] || MODES.dorian;
    var notes = [];
    for (var i = 0; i < 15; i++) notes.push(Tone.Frequency(rootMidi + Math.floor(i/mode.length)*12 + mode[i%mode.length], 'midi').toNote());
    var evs = []; var step = 0; var SD = Tone.Time('16n').toSeconds();
    for (var j = 0; j < text.length; j++){
      var ch = text[j], lo = ch.toLowerCase();
      if (ch === ' ' || ch === '\n'){ step += ch === '\n' ? 3 : 1; continue; }
      if (ch === '.' || ch === '!' || ch === '?'){ step += 4; continue; }
      if (ch === ',' || ch === ';'){ step += 2; continue; }
      var ai = ALPHA.indexOf(lo);
      if (ai !== -1){
        evs.push({t: step*SD, note: notes[ai % notes.length], d: ch === ch.toUpperCase() ? '8n' : '16n'});
        step += ch === ch.toUpperCase() ? 1.8 : 1.4;
      }
    }
    if (!evs.length) return false;
    try { Tone.Transport.stop(); Tone.Transport.cancel(0); } catch(e){}
    SND.part = new Tone.Part(function(time, ev){
      try { SND.synths.lead.triggerAttackRelease(mtof(Tone.Frequency(ev.note).toMidi()), ev.d, time); } catch(e){}
    }, evs).start(0);
    Tone.Transport.bpm.value = 130;
    Tone.Transport.start();
    SND.playing = true;
    var btn = document.getElementById('kob-soneto-music'); if (btn) btn.classList.add('playing');
    try { window.dispatchEvent(new CustomEvent('kob:sonoro-state', {detail:{playing:true}})); } catch(e){}
    return true;
  };
  KOBSonoro.stop = function(){
    if (SND.part){ try { SND.part.dispose(); } catch(e){} SND.part = null; }
    try { Tone.Transport.stop(); Tone.Transport.cancel(0); } catch(e){}
    try { Object.keys(SND.synths).forEach(function(k){ SND.synths[k].releaseAll && SND.synths[k].releaseAll(); }); } catch(e){}
    SND.playing = false;
    var btn = document.getElementById('kob-soneto-music'); if (btn) btn.classList.remove('playing');
    try { window.dispatchEvent(new CustomEvent('kob:sonoro-state', {detail:{playing:false}})); } catch(e){}
  };
  KOBSonoro.isPlaying = function(){ return SND.playing; };
  KOBSonoro.toggle = function(text){ if (SND.playing) return KOBSonoro.stop(); return KOBSonoro.play(text); };

  var active = { title: 'KOBLLUX', text: '' };
  var LIM = 16;
  function paintHeader(){
    var sh = document.getElementById('kob-soneto-short');
    var fu = document.getElementById('kob-soneto-full');
    if (!sh) return;
    var t = String(active.title || 'KOBLLUX').trim();
    sh.textContent = t.length > LIM ? t.slice(0, LIM-1) + '…' : t;
    if (fu) fu.textContent = t;
    var holo = document.querySelector('#kob-soneto-holo .ha');
    if (holo) holo.textContent = window.KOB_SONETO_ARCH + ' · ' + (ARCH_MUSIC[window.KOB_SONETO_ARCH]||['dorian','tri',.5])[0];
  }
  function toast(msg){
    var el = document.getElementById('toast');
    if (el){ el.textContent = msg; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove('show'); }, 2200); }

  var btnArch  = document.getElementById('kob-soneto-arch-btn');

  if (btnDl) btnDl.addEventListener('click', function(){
    var t = active.text || document.title;
    var b = new Blob([t], {type:'text/plain;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = (active.title || 'kob-soneto').replace(/[^\w\-]+/g,'_') + '.txt';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
    toast('⤓ Baixado');
  });
  if (btnTheme) btnTheme.addEventListener('click', function(){

<!-- ═══════════════════════════════════════════════════════════════════
     KOBLLUX — HOST ENGINE (drag dock · collapse player-only · nav)
     ═══════════════════════════════════════════════════════════════════ -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  'use strict';

  const dock            = document.getElementById('floating-dock');
  const topDropZone     = document.getElementById('top-drop-zone');
  const bottomDropZone  = document.getElementById('bottom-drop-zone');
  const dockPosTag      = document.getElementById('dock-pos-tag');
  const collapseBtn     = document.getElementById('dock-collapse-btn');

  const playPauseBtn    = document.getElementById('play-pause-btn');
  const nextTrackBtn    = document.getElementById('next-track-btn');
  const openGpBtn       = document.getElementById('open-gp-btn');
  const iconPlay        = document.getElementById('icon-play');
  const iconPause       = document.getElementById('icon-pause');
  const progressContainer = document.getElementById('progress-container');
  const progressFill    = document.getElementById('progress-fill');
  const progressThumb   = document.getElementById('progress-thumb');
  const currentTimeEl   = document.getElementById('current-time');
  const totalTimeEl     = document.getElementById('total-time');
  const trackNameEl     = document.getElementById('track-name');

  const MARGIN_Y_TOP    = 54;
  const MARGIN_Y_BOTTOM = 16;

  let currentPosition = localStorage.getItem('kob:dock:pos') || 'header';
  let isCollapsed     = localStorage.getItem('kob:dock:collapsed') === '1';
  let isDragging = false;
  let startY = 0;
  let startTop = 0;
  let hasMoved = false;

  function applyCollapseState(collapsed) {
    isCollapsed = !!collapsed;
    dock.classList.toggle('collapsed', isCollapsed);
    document.body.classList.toggle('dock-collapsed', isCollapsed);
    try { localStorage.setItem('kob:dock:collapsed', isCollapsed ? '1' : '0'); } catch(e){}
    // Recalcula posição vertical após transição de altura do dock
    requestAnimationFrame(() => snapToPosition(currentPosition));
    setTimeout(() => { if (!isDragging) snapToPosition(currentPosition); }, 310);
  }

  function snapToPosition(position) {
    currentPosition = position;
    try { localStorage.setItem('kob:dock:pos', position); } catch(e){}
    const dockHeight   = dock.offsetHeight;
    const windowHeight = window.innerHeight;

    if (position === 'header') {
      dock.style.top = `${MARGIN_Y_TOP}px`;
      if (dockPosTag) dockPosTag.textContent = isCollapsed ? 'PLAYER · TOP' : 'HEADER';
      document.body.classList.add('dock-header');
      document.body.classList.remove('dock-footer');
    } else {
      dock.style.top = `${windowHeight - dockHeight - MARGIN_Y_BOTTOM}px`;
      if (dockPosTag) dockPosTag.textContent = isCollapsed ? 'PLAYER · FOOTER' : 'FOOTER';
      document.body.classList.add('dock-footer');
      document.body.classList.remove('dock-header');
    }
  }

  applyCollapseState(isCollapsed);
  snapToPosition(currentPosition);
  window.addEventListener('resize', () => { if (!isDragging) snapToPosition(currentPosition); });

  /* BOTÃO DE COLAPSAR DOCK (DEIXA SÓ O PLAYER) */
  collapseBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    applyCollapseState(!isCollapsed);
    try { window.KOBSonoro && KOBSonoro.sfx('bubble'); } catch(_) {}
  });

  /* DRAG DO DOCK */
  function onDragStart(e) {
    if (e.target.closest('#progress-container') || e.target.closest('#dock-collapse-btn')) return;
    isDragging = true; hasMoved = false;
    startY   = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    startTop = dock.getBoundingClientRect().top;
    dock.classList.add('dragging');
    topDropZone.style.opacity = '1';
    bottomDropZone.style.opacity = '1';
  }
  function onDragMove(e) {
    if (!isDragging) return;
    const currentY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    const deltaY   = currentY - startY;
    if (Math.abs(deltaY) > 6) hasMoved = true;
    if (!hasMoved) return;
    if (e.cancelable) e.preventDefault();

    const dockHeight = dock.offsetHeight;
    const maxTop     = window.innerHeight - dockHeight - MARGIN_Y_BOTTOM;
    const minTop     = MARGIN_Y_TOP;
    let newTop       = startTop + deltaY;

    if (newTop < minTop)         newTop = minTop - (minTop - newTop) * 0.25;
    else if (newTop > maxTop)    newTop = maxTop + (newTop - maxTop) * 0.25;

    dock.style.top = `${newTop}px`;

    const midScreen  = window.innerHeight / 2;
    const dockCenter = newTop + dockHeight / 2;
    if (dockCenter < midScreen) {
      topDropZone.classList.add('highlight');
      bottomDropZone.classList.remove('highlight');
    } else {
      bottomDropZone.classList.add('highlight');
      topDropZone.classList.remove('highlight');
    }
  }
  function onDragEnd() {
    if (!isDragging) return;
    isDragging = false;
    dock.classList.remove('dragging');
    topDropZone.style.opacity = '0';
    bottomDropZone.style.opacity = '0';
    topDropZone.classList.remove('highlight');
    bottomDropZone.classList.remove('highlight');

    if (hasMoved) {
      const rect       = dock.getBoundingClientRect();
      const dockCenter = rect.top + rect.height / 2;
      const midScreen  = window.innerHeight / 2;
      snapToPosition(dockCenter < midScreen ? 'header' : 'footer');
      try { window.KOBSonoro && KOBSonoro.sfx('whoosh'); } catch(_) {}
    } else {
      snapToPosition(currentPosition);
    }
  }

  dock.addEventListener('mousedown', onDragStart);
  window.addEventListener('mousemove', onDragMove);
  window.addEventListener('mouseup',   onDragEnd);
  dock.addEventListener('touchstart', onDragStart, { passive: false });
  window.addEventListener('touchmove', onDragMove, { passive: false });
  window.addEventListener('touchend',  onDragEnd);

  /* NAVEGAÇÃO ENTRE PÁGINAS */
  const navButtons = document.querySelectorAll('.kb-nav-btn');
  const pages      = document.querySelectorAll('.kb-page');

  window.switchTab = function(tabName) {
    navButtons.forEach(b => b.classList.toggle('active', b.dataset.tab === tabName));
    pages.forEach(p => p.classList.toggle('active', p.id === `page-${tabName}`));

    const activeBtn = document.querySelector(`.kb-nav-btn[data-tab="${tabName}"]`);
    if (activeBtn && window.kobSetActiveDoc) {
      window.kobSetActiveDoc(
        `${activeBtn.dataset.title} — KOBLLUX`,
        `${activeBtn.dataset.title}. ${activeBtn.dataset.desc}`
      );
    }
    if (tabName === 'profile' && window.Profile) window.Profile.render();
  };

  navButtons.forEach(btn => {
    btn.addEventListener('click', (e) => {
      if (hasMoved) { e.preventDefault(); return; }
      window.switchTab(btn.dataset.tab);
      try { window.KOBSonoro && KOBSonoro.sfx('bubble'); } catch(_) {}
    });
  });

  /* SINCRONIA DO MINI-PLAYER DA BARRA COM O GLOBAL PLAYER */
  function formatTime(secs) {
    if (!secs || isNaN(secs)) return '0:00';
    const m = Math.floor(secs / 60);
    const s = Math.floor(secs % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  window.syncDockPlayerUI = function({ title, playing, current, duration }) {
    if (title !== undefined) {
      if (trackNameEl) trackNameEl.textContent = title;
      const gpMiniTitle = document.getElementById('gp-mini-title');
      if (gpMiniTitle) gpMiniTitle.textContent = title;
    }
    if (playing !== undefined) {
      iconPlay.classList.toggle('hidden', playing);
      iconPause.classList.toggle('hidden', !playing);
    }
    if (current !== undefined && duration !== undefined && duration > 0) {
      const pct = Math.min(100, Math.max(0, (current / duration) * 100));
      progressFill.style.width = `${pct}%`;
      progressThumb.style.left = `${pct}%`;
      currentTimeEl.textContent = formatTime(current);
      totalTimeEl.textContent = formatTime(duration);
    }
  };

  playPauseBtn.addEventListener('click', (e) => {
    if (hasMoved) return;
    if (window.Player) window.Player.toggle(e);
  });

  nextTrackBtn.addEventListener('click', () => {
    if (hasMoved) return;
    if (window.Player) window.Player.next();
  });

  openGpBtn.addEventListener('click', () => {
    if (hasMoved) return;
    if (window.Player) window.Player.reopenIfActive();
  });

  /* SCRUBBING DA BARRA DE PROGRESSO */
  let isScrubbing = false;
  function scrubToEvent(e) {
    const rect    = progressContainer.getBoundingClientRect();
    const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
    const ratio   = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    if (window.Player && window.Player.seekRatio) window.Player.seekRatio(ratio);
  }

  progressContainer.addEventListener('mousedown', (e) => {
    e.stopPropagation(); isScrubbing = true;
    progressContainer.classList.add('scrubbing');
    scrubToEvent(e);
  });
  progressContainer.addEventListener('touchstart', (e) => {
    e.stopPropagation(); isScrubbing = true;
    progressContainer.classList.add('scrubbing');
    scrubToEvent(e);
  }, { passive: true });

  window.addEventListener('mousemove', (e) => { if (isScrubbing) scrubToEvent(e); });
  window.addEventListener('touchmove', (e) => { if (isScrubbing) scrubToEvent(e); }, { passive: true });

  function endScrub() { isScrubbing = false; progressContainer.classList.remove('scrubbing'); }
  window.addEventListener('mouseup', endScrub);
  window.addEventListener('touchend', endScrub);
});
</script>

const toast = (msg) => {

  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 2200);
};

function normalizeUrl(raw){
  let url = String(raw||'').trim();
  if(!url) return '';
  if(url.includes('soundcloud.com')||url.includes('on.soundcloud.com')){
    try{ const u=new URL(url); if(u.hostname.startsWith('m.')) u.hostname=u.hostname.replace(/^m\./,''); url=u.toString(); }
    catch(e){ url=url.replace('://m.soundcloud.com','://soundcloud.com'); }
  }
  if(url.includes('youtube.com')||url.includes('youtu.be')||url.includes('youtube-nocookie.com')){
    try{
      const u=new URL(url);
      if(u.hostname.startsWith('m.'))     u.hostname='youtube.com';
      if(u.hostname.startsWith('music.')) u.hostname='youtube.com';
      let id=null;
      if(u.hostname.includes('youtu.be'))       id=u.pathname.replace('/','').trim();
      else if(u.pathname.startsWith('/watch'))   id=u.searchParams.get('v');
      else if(u.pathname.startsWith('/shorts/')) id=u.pathname.split('/')[2];
      else if(u.pathname.startsWith('/embed/'))  id=u.pathname.split('/')[2];
      if(id) url=`https://youtu.be/${id}`;
    }catch(e){
      url=url.replace('://m.youtube.com','://youtube.com').replace('://music.youtube.com','://youtube.com');
    }
  }
  return url;
}

function extractYouTubeId(raw){
  try{
    const u=new URL(raw);
    if(u.hostname.includes('youtu.be')) return u.pathname.replace('/','').trim();
    if(u.pathname.startsWith('/watch')) return u.searchParams.get('v');
    if(u.pathname.startsWith('/shorts/')) return u.pathname.split('/')[2];
    if(u.pathname.startsWith('/embed/')) return u.pathname.split('/')[2];
  }catch(e){}
  const m=String(raw).match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([0-9A-Za-z_-]{11})/);
  return m?m[1]:null;
}
function extractPlaylistId(raw){
  try{ return new URL(raw).searchParams.get('list'); }catch(e){}
  const m=String(raw).match(/[?&]list=([0-9A-Za-z_-]+)/);
  return m?m[1]:null;
}

function normalizeTrack(t){
  const type = t.type || 'local';
  let id = t.id || uid('trk');
  if(type==='youtube' && t.id && t.id.length===11) id = t.id;
  let cover = t.cover;
  if(!cover){
    if(type==='youtube' && id.length===11) cover=`https://img.youtube.com/vi/${id}/hqdefault.jpg`;
    else if(type==='soundcloud') cover='https://i1.sndcdn.com/artworks-default-t500x500.jpg';
    else cover='https://picsum.photos/200';
  }
  return {
    id, type,
    url: normalizeUrl(t.url||''),
    name: t.name || 'Sem título',
    artist: t.artist || 'Web',
    cover,
    blob: t.blob || null,
    favorite: !!t.favorite,
    playlistId: t.playlistId || null
  };
}

}

function migrate(){
  const v3 = localStorage.getItem(DB_NAME);
  if(v3){
    try{
      const p = JSON.parse(v3);
      db = {
        version:3,
        library: Array.isArray(p.library) && p.library.length ? p.library.map(normalizeTrack) : PRELOADED.map(normalizeTrack),
        playlists: Array.isArray(p.playlists)?p.playlists:[],
        activePlaylistId:p.activePlaylistId||ALL_ID
      };
      return;
    }catch(e){}
  }
  const legacy = localStorage.getItem(LEGACY_DB);
  if(legacy){
    try{
      const arr = JSON.parse(legacy);
      if(Array.isArray(arr) && arr.length){
        db = createDefaultDB();
        db.library = arr.map(normalizeTrack);
        saveDB(); return;
      }
    }catch(e){}
  }
  db = createDefaultDB();
  saveDB();
}

let ytPlayer=null, scWidget=null, ytReady=false;
let currentTrackId=null, isPlaying=false, activeEngine=null, progressTimer=null;
const audioEl = () => document.getElementById('local-audio');

const Player = {
  loadAndPlay(id){
    const t = db.library.find(x=>x.id===id);
    if(!t) return;

    currentTrackId = id;
    activeEngine = t.type;
    Player._stopEnginesOnly();
    Player._syncUI(t);
    Player._openGlobalPlayer(t);

    if(t.type==='youtube'||t.type==='youtube_playlist') Player._playYT(t);
    else if(t.type==='soundcloud') Player._playSC(t.url);
    else if(t.type==='local'){
      const a = audioEl();
      if(!a) return;
      a.src = t.blob ? URL.createObjectURL(t.blob) : t.url;
      a.play().catch(()=>toast('Toque em Play novamente'));
      isPlaying = true; Player._syncIcons();
    }
    renderShortsQueue();
    Player._startProgressPoll();
  },
  _openGlobalPlayer(t){
    const gp = document.getElementById('global-player');
    const wrap = document.getElementById('player-frame-wrap');
    if(!gp || !wrap) return;

    wrap.innerHTML = '';
    if(t.type==='youtube' || t.type==='youtube_playlist'){
      wrap.innerHTML = `<div id="yt-container" style="width:100%;height:100%"></div>`;
    } else if(t.type==='soundcloud'){
      wrap.innerHTML = `<div id="sc-container" style="width:100%;height:100%"></div>`;
    } else {
      wrap.innerHTML = `
        <div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:10px;background:radial-gradient(circle,rgba(124,58,237,.22),#050408)">
          <div style="width:68px;height:68px;border-radius:18px;background:url('${t.cover}') center/cover;border:1px solid rgba(255,255,255,.2)"></div>
          <div style="font-size:13px;font-weight:700;text-align:center;max-width:85%">${t.name}</div>
          <div style="font-size:10px;color:var(--kb-cyan);letter-spacing:.15em;text-transform:uppercase">${t.artist}</div>
        </div>`;
    }

    gp.classList.add('active');
    gp.classList.remove('minimized');
  },
  reopenIfActive(){
    const gp = document.getElementById('global-player');
    if(!currentTrackId){
      const first = db.library[0];
      if(first) Player.loadAndPlay(first.id);
      return;
    }
    if(gp){
      gp.classList.add('active');
      gp.classList.remove('minimized');
    }
  },
  toggleMinimize(){
    const gp = document.getElementById('global-player');
    if(gp) gp.classList.toggle('minimized');
  },
  toggleFullscreen(){
    const gp = document.getElementById('global-player');
    if(!gp) return;
    gp.classList.remove('minimized');
    gp.classList.toggle('player-fullscreen');
    const btn = document.getElementById('gp-expand-btn');
    if(btn) btn.textContent = gp.classList.contains('player-fullscreen') ? '🗗' : '⛶';
  },
  toggle(e){
    if(e) e.stopPropagation();
    if(!currentTrackId){
      const first = db.library[0];
      if(first) Player.loadAndPlay(first.id);
      return;
    }
    if(isPlaying){
      if((activeEngine==='youtube'||activeEngine==='youtube_playlist')&&ytPlayer&&ytPlayer.pauseVideo) ytPlayer.pauseVideo();
      else if(activeEngine==='soundcloud'&&scWidget) scWidget.pause();
      else if(audioEl()) audioEl().pause();
      isPlaying = false;
    } else {
      if((activeEngine==='youtube'||activeEngine==='youtube_playlist')&&ytPlayer&&ytPlayer.playVideo) ytPlayer.playVideo();
      else if(activeEngine==='soundcloud'&&scWidget) scWidget.play();
      else if(activeEngine==='local'&&audioEl()) audioEl().play();
      isPlaying = true;
    }
    Player._syncIcons();
  },
  next(){
    if(!db.library.length) return;
    const i = db.library.findIndex(t=>t.id===currentTrackId);
    const next = db.library[(i+1)%db.library.length];
    if(next) Player.loadAndPlay(next.id);
  },
  seekRatio(ratio){
    if((activeEngine==='youtube'||activeEngine==='youtube_playlist') && ytPlayer && ytPlayer.getDuration){
      const d = ytPlayer.getDuration();
      if(d) ytPlayer.seekTo(d * ratio, true);
    } else if(activeEngine==='local' && audioEl() && audioEl().duration){
      audioEl().currentTime = audioEl().duration * ratio;
    }
  },
  _stopEnginesOnly(){
    try{ audioEl()?.pause(); }catch(e){}
    try{ ytPlayer?.destroy?.(); ytPlayer = null; }catch(e){}
    try{ scWidget = null; }catch(e){}
    isPlaying = false;
    clearInterval(progressTimer);
    Player._syncIcons();
  },
  stop(){
    Player._stopEnginesOnly();
    const gp = document.getElementById('global-player');
    if(gp){
      gp.classList.remove('active', 'minimized', 'player-fullscreen');
    }
    const wrap = document.getElementById('player-frame-wrap');
    if(wrap) wrap.innerHTML = '';
  },
  _syncUI(t){
    const c = document.getElementById('main-cover');
    const ti = document.getElementById('main-title');
    const ar = document.getElementById('main-artist');
    const badge = document.getElementById('dock-mode-label');
    if(c) c.style.backgroundImage = `url(${t?.cover||'https://picsum.photos/100'})`;
    if(ti) ti.textContent = t?.name || 'KOBLLUX';
    if(ar) ar.textContent = t?.artist || 'Infodose';
    if(badge) badge.textContent = `GLOBAL PLAYER · ${t?.type?.toUpperCase() || 'ATIVO'}`;
    if(window.syncDockPlayerUI){
      window.syncDockPlayerUI({ title: t?.name || 'KOBLLUX', playing: isPlaying, current: 0, duration: 100 });
    }
  },
  _syncIcons(){
    if(window.syncDockPlayerUI) window.syncDockPlayerUI({ playing: isPlaying });
  },
  _startProgressPoll(){
    clearInterval(progressTimer);
    progressTimer = setInterval(()=>{
      if(!isPlaying || !window.syncDockPlayerUI) return;
      if((activeEngine==='youtube'||activeEngine==='youtube_playlist') && ytPlayer && ytPlayer.getCurrentTime){
        const cur = ytPlayer.getCurrentTime() || 0;
        const dur = ytPlayer.getDuration() || 0;
        if(dur > 0) window.syncDockPlayerUI({ current: cur, duration: dur });
      } else if(activeEngine==='local' && audioEl()){
        const cur = audioEl().currentTime || 0;
        const dur = audioEl().duration || 0;
        if(dur > 0) window.syncDockPlayerUI({ current: cur, duration: dur });
      }
    }, 800);
  },
  _playYT(t){
    if(!ytReady || !window.YT || !window.YT.Player){
      setTimeout(()=>Player._playYT(t), 300);
      return;
    }
    ytPlayer = new window.YT.Player('yt-container', {
      height:'100%', width:'100%',
      videoId: t.type==='youtube' ? t.id : '',
      playerVars:{autoplay:1, playsinline:1, modestbranding:1, rel:0},
      events:{
        onReady:(e)=>{
          if(t.type==='youtube_playlist'&&t.playlistId) e.target.loadPlaylist({list:t.playlistId,index:0});
          else e.target.loadVideoById(t.id);
          e.target.playVideo();
          isPlaying = true; Player._syncIcons();
        },
        onStateChange:(e)=>{
          if(e.data===window.YT.PlayerState.ENDED) Player.next();
          isPlaying = (e.data===window.YT.PlayerState.PLAYING);
          Player._syncIcons();
        }
      }
    });
  },
  _playSC(url){
    const c = document.getElementById('sc-container');
    if(!c) return;
    c.innerHTML = `<iframe id="sc-frame" allow="autoplay" style="width:100%;height:100%;border:0"
      src="https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=true"></iframe>`;
    if(window.SC && window.SC.Widget){
      scWidget = window.SC.Widget('sc-frame');
      scWidget.bind(window.SC.Widget.Events.READY, ()=>{ scWidget.play(); isPlaying=true; Player._syncIcons(); });
      scWidget.bind(window.SC.Widget.Events.FINISH, ()=>Player.next());
      scWidget.bind(window.SC.Widget.Events.PLAY, ()=>{ isPlaying=true; Player._syncIcons(); });
      scWidget.bind(window.SC.Widget.Events.PAUSE, ()=>{ isPlaying=false; Player._syncIcons(); });
    }
  }
};

const HeroCarousel = (()=>{
  let current = 0;
  let timer = null;
  const INTERVAL = 5500;

  function slides(){
    return db.library.filter(t => t.type==='youtube'||t.type==='youtube_playlist'||t.type==='soundcloud').slice(0, 12);
  }

  function renderInstance(slidesId, dotsId, counterId){
    const trackList = slides();
    const wrap = document.getElementById(slidesId);
    const dots = document.getElementById(dotsId);
    if(!wrap||!dots) return;
    wrap.innerHTML = '';
    dots.innerHTML = '';
    if(!trackList.length){
      wrap.innerHTML = `<div class="hero-card"><div class="hero-content"><h2 class="hero-title">Sem mídia ainda</h2><p class="hero-subtitle">Importe na aba Criar (+)</p></div></div>`;
      return;
    }
    trackList.forEach((t, i)=>{
      const slide = document.createElement('article');
      slide.className = 'hero-slide' + (i===current?' active':'');
      slide.innerHTML = `
        <div class="hero-card" style="--hero-img-url:url('${t.cover}')">
          <div class="hero-bg"></div>
          <div class="hero-gradient"></div>
          <div class="hero-content">
            <div class="hero-tag-row">
              <span class="hero-tag">${t.type==='youtube_playlist'?'PLAYLIST':t.type.toUpperCase()}</span>
              <span style="font-size:10px;color:rgba(255,255,255,.75)">${t.artist}</span>
            </div>
            <h2 class="hero-title">${t.name}</h2>
            <p class="hero-subtitle">${t.artist} · Global Player</p>
            <div class="hero-actions">
              <button type="button" class="btn-primary" data-play="${t.id}">▶ Assistir</button>
              <button type="button" class="tts-btn" data-tts="${t.id}" title="Ouvir título">◎</button>
            </div>
          </div>
        </div>`;
      wrap.appendChild(slide);

      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = i===current?'active':'';
      dot.addEventListener('click', ()=>{ go(i); start(); });
      dots.appendChild(dot);
    });

    wrap.querySelectorAll('[data-play]').forEach(b=>{
      b.addEventListener('click', e=>{ e.stopPropagation(); Player.loadAndPlay(b.dataset.play); });
    });
    wrap.querySelectorAll('[data-tts]').forEach(b=>{
      b.addEventListener('click', e=>{
        e.stopPropagation();
        const t = db.library.find(x=>x.id===b.dataset.tts);
        if(t && window.KOBSoneto) window.KOBSoneto.speak(t.name + '. ' + t.artist);
      });
    });

    const el = document.getElementById(counterId);
    if(el) el.textContent = `${String(current+1).padStart(2,'0')} / ${String(trackList.length).padStart(2,'0')}`;
  }

  function render(){
    renderInstance('heroSlides', 'heroDots', 'heroCounter');
    renderInstance('shortsHeroSlides', 'shortsHeroDots', 'shortsHeroCounter');
  }

  function go(i){
    const list = slides();
    if(!list.length) return;
    current = ((i%list.length)+list.length)%list.length;
    ['heroSlides', 'shortsHeroSlides'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.querySelectorAll('.hero-slide').forEach((s,idx)=>s.classList.toggle('active', idx===current));
    });
    ['heroDots', 'shortsHeroDots'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.querySelectorAll('button').forEach((d,idx)=>d.classList.toggle('active', idx===current));
    });
    const txt = `${String(current+1).padStart(2,'0')} / ${String(list.length).padStart(2,'0')}`;
    const c1 = document.getElementById('heroCounter');
    const c2 = document.getElementById('shortsHeroCounter');
    if(c1) c1.textContent = txt;
    if(c2) c2.textContent = txt;
  }

  function next(){ go(current+1); }
  function prev(){ go(current-1); }
  function start(){ stop(); timer = setInterval(next, INTERVAL); }
  function stop(){ if(timer) clearInterval(timer); timer=null; }

  function attachTouch(elId){
    const root = document.getElementById(elId);
    if(!root) return;
    root.addEventListener('touchstart', e=>{
      root._tx = e.touches[0].clientX; root._ty = e.touches[0].clientY;
    }, {passive:true});
    root.addEventListener('touchend', e=>{
      const dx = e.changedTouches[0].clientX - root._tx;
      const dy = e.changedTouches[0].clientY - root._ty;
      if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)){ dx<0?next():prev(); start(); }
    }, {passive:true});
  }

  function init(){
    render();
    document.getElementById('heroNext')?.addEventListener('click', ()=>{ next(); start(); });
    document.getElementById('heroPrev')?.addEventListener('click', ()=>{ prev(); start(); });
    document.getElementById('shortsHeroNext')?.addEventListener('click', ()=>{ next(); start(); });
    document.getElementById('shortsHeroPrev')?.addEventListener('click', ()=>{ prev(); start(); });
    attachTouch('heroCarousel');
    attachTouch('shortsHeroCarousel');
    start();
  }

  return { init, render, next, prev, go };
})();

   7. PÁGINA CRIAR (PILLS / IMPORTAÇÃO)
   ──────────────────────────────────────────────────────────────── */
const Pills = (()=>{
  const chips = [
    {label:'+ YouTube',     icon:'▶',  type:'youtube'},
    {label:'+ Playlist YT', icon:'≡',  type:'youtube_playlist'},
    {label:'+ SoundCloud',  icon:'☁',  type:'soundcloud'},
    {label:'+ Áudio Local', icon:'⤒',  type:'local'},
    {label:'+ JSON',        icon:'{}', type:'json'}
  ];

  function renderChips(){
    const wrap = document.getElementById('pillChips');
    if(!wrap) return;
    wrap.innerHTML = chips.map(c=>`
      <button type="button" class="pill-chip" data-type="${c.type}">
        <span class="icon">${c.icon}</span>${c.label}
      </button>`).join('');
    wrap.querySelectorAll('[data-type]').forEach(b=>{
      b.addEventListener('click', ()=>openImportModal(b.dataset.type));
    });
  }

  function openImportModal(type){
    if(type==='local'){
      const inp = document.createElement('input');
      inp.type='file'; inp.accept='audio/*'; inp.multiple=true;
      inp.onchange = ()=>{
        Array.from(inp.files||[]).forEach(f=>{
          const track = normalizeTrack({type:'local', url:URL.createObjectURL(f), name:f.name.replace(/\.[^.]+$/,''), artist:'Local', blob:f});
          db.library.unshift(track);
        });
        saveDB(); renderAll(); toast('Áudio importado');
      };
      inp.click();
      return;
    }
    if(type==='json'){
      const inp = document.createElement('input');
      inp.type='file'; inp.accept='.json,application/json';
      inp.onchange = async ()=>{
        try{
          const text = await inp.files[0].text();
          const arr = JSON.parse(text);
          if(Array.isArray(arr)){
            arr.forEach(t=>db.library.unshift(normalizeTrack(t)));
            saveDB(); renderAll(); toast(`+${arr.length} faixas`);
          }
        }catch(e){ toast('JSON inválido'); }
      };
      inp.click();
      return;
    }
    openModal(`
      <h3>Importar ${type}</h3>
      <input class="modal-input" id="importUrl" placeholder="Cole o link https://...">
      <div class="modal-actions">
        <button type="button" class="mini-btn" onclick="document.getElementById('modal-overlay').classList.remove('open')">Cancelar</button>
        <button type="button" class="mini-btn active" id="importConfirm">Importar</button>
      </div>`);
    document.getElementById('importConfirm').addEventListener('click', async ()=>{
      const url = document.getElementById('importUrl').value.trim();
      if(!url) return;
      document.getElementById('modal-overlay').classList.remove('open');
      toast('Importando...');
      try{
        const track = await buildTrackFromUrl(url);
        db.library.unshift(track);
        saveDB(); renderAll(); toast('✓ '+track.name);
      }catch(e){ toast('Erro: '+e.message); }
    });
  }

  async function buildTrackFromUrl(url){
    const clean = normalizeUrl(url);
    if(!clean) throw new Error('URL vazia');
    const t = {id:uid('trk'), type:'local', url:clean, name:'Carregando...', artist:'Web'};

    const ytId = extractYouTubeId(clean);
    const ytList = extractPlaylistId(clean);
    const isYT = clean.includes('youtube.com')||clean.includes('youtu.be');
    const isSC = clean.includes('soundcloud.com');

    if(isYT){
      if(ytList && !ytId){
        t.type='youtube_playlist'; t.playlistId=ytList; t.name='YouTube Playlist'; t.artist='YouTube';
        t.cover='https://picsum.photos/200';
        return normalizeTrack(t);
      }
      if(!ytId) throw new Error('Link YouTube inválido');
      t.type='youtube'; t.id=ytId;
      t.cover=`https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
      try{
        const r = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(clean)}`);
        const d = await r.json();
        t.name = d.title || 'YouTube'; t.artist = d.author_name || 'YouTube';
      }catch(e){ t.name='YouTube'; t.artist='YouTube'; }
    } else if(isSC){
      t.type='soundcloud'; t.cover='https://i1.sndcdn.com/artworks-default-t500x500.jpg';
      try{
        const r = await fetch(`https://soundcloud.com/oembed?url=${encodeURIComponent(clean)}&format=json`);
        const d = await r.json();
        t.name = d.title || 'SoundCloud'; t.artist = d.author_name || 'SoundCloud';
        t.cover = d.thumbnail_url || t.cover;
      }catch(e){ t.name='SoundCloud'; t.artist='SoundCloud'; }
    } else {
      t.name = clean.split('/').pop() || 'Link'; t.artist='Web';
    }
    return normalizeTrack(t);
  }

  function renderPills(){
    const grid = document.getElementById('pillsGrid');
    const count = document.getElementById('pillsCount');
    if(!grid) return;
    const pills = db.library.filter(t => !PRELOADED.some(p => p.url && p.url===t.url)).slice(0, 40);
    if(count) count.textContent = `${pills.length} itens`;
    if(!pills.length){
      grid.innerHTML = `<div class="empty-state"><div class="icon">✦</div><p>Nenhuma pílula importada ainda. Use os botões acima.</p></div>`;
      return;
    }
    grid.innerHTML = pills.map(t=>`
      <div class="pill-card" data-id="${t.id}">
        <div class="pill-card-cover" style="background-image:url('${t.cover}')"></div>
        <div class="pill-card-info">
          <div class="pill-card-title">${t.name}</div>
          <div class="pill-card-artist">${t.artist}</div>
          <span class="pill-card-tag">${t.type.toUpperCase()}</span>
        </div>
        <div class="pill-card-actions">
          <button type="button" class="pill-action" data-action="play" title="Tocar">▶</button>
          <button type="button" class="pill-action fav ${t.favorite?'active':''}" data-action="fav" title="Favoritar">${t.favorite?'★':'☆'}</button>
          <button type="button" class="pill-action" data-action="del" title="Remover">×</button>
        </div>
      </div>`).join('');
    grid.querySelectorAll('.pill-card').forEach(card=>{
      const id = card.dataset.id;
      card.querySelectorAll('[data-action]').forEach(btn=>{
        btn.addEventListener('click', e=>{
          e.stopPropagation();
          const a = btn.dataset.action;
          if(a==='play') Player.loadAndPlay(id);
          else if(a==='fav'){
            const t = db.library.find(x=>x.id===id);
            if(t){ t.favorite=!t.favorite; saveDB(); renderPills(); }
          } else if(a==='del'){
            db.library = db.library.filter(x=>x.id!==id);
            saveDB(); renderAll(); toast('Removido');
          }
        });
      });
    });
  }

  return { init(){ renderChips(); renderPills(); }, renderPills, buildTrackFromUrl };
})();

  overlay.classList.add('open');
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.classList.remove('open'); };
}
window.openModal = openModal;

function renderAll(){
  HeroCarousel.render();
  renderMediaGrid();
  renderShortsQueue();
  Pills.renderPills();
  Profile.render();
}

/* ────────────────────────────────────────────────────────────────
   10. BOOT
   ──────────────────────────────────────────────────────────────── */
function boot(){
  migrate();
  HeroCarousel.init();
  Pills.init();
  Profile.init();
  renderMediaGrid();
  renderShortsQueue();
  updateHomeGreeting();

  // Filtros rápidos da Home
  document.querySelectorAll('.q-pill[data-filter]').forEach(pill=>{
    pill.addEventListener('click', ()=>{
      document.querySelectorAll('.q-pill[data-filter]').forEach(p=>p.classList.toggle('active', p===pill));
      renderMediaGrid(pill.dataset.filter);
    });
  });

  // Sincroniza visual quando arquétipo muda pelo Soneto Header
  window.addEventListener('kob:arch', ()=>{
    Profile.syncOrbWithArch();
  });

  const savedTheme = localStorage.getItem('kob:theme');
  if(savedTheme) document.body.dataset.mode = savedTheme;

  if(db.library[0]){
    Player._syncUI(db.library[0]);
  }

  if(window.innerWidth < 600 || navigator.hardwareConcurrency <= 4){
    document.documentElement.classList.add('kob-perf-lite');
  }

  window.Player = Player;
  window.HeroCarousel = HeroCarousel;
  window.Pills = Pills;
  window.Profile = Profile;
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
