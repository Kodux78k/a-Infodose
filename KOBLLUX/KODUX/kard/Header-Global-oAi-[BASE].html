<!DOCTYPE html>
<html lang="pt-BR" data-theme="night" data-user-arch="KOBLLUX" data-tts="on" data-sfx="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020" id="metaThemeColor">
  <title>dual-global · FUSION OS</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- Tone.js · CDN primário com fallback local -->
  <script
    src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"
    onerror="var s=document.createElement('script');s.src='vendor/Tone.js';s.onerror=function(){console.warn('[KOB-SONORO] Tone.js indisponível')};document.head.appendChild(s);this.onerror=null">
  </script>

  <style>
  /* =========================================================
     ALMASLIBER / iFSw — UNIFIED CORE
     HEADER + SESSION + DOCK + MAXIMIZE/MINIMIZE + TABS
     ========================================================= */

  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);

    --topbar-h: 58px;
    --header-h: 52px;

    --session-radius: 29px;
    --session-gap: 20px;

    --collapsed-h: 52px;
    --peek-h: 178px;

    --resize-hit: 0px;
    --resize-corner: 54px;

    --dock-bottom-gap: 80px;
    --dock-offset-x: -12px;

    --z-base: 0;
    --z-content: 100;
    --z-header-system: 900;
    --z-header-main: 910;
    --z-session: 1000;
    --z-session-header: 1010;
    --z-session-controls: 1020;
    --z-maximized: 94000;
    --z-maximized-header: 94010;
    --z-maximized-controls: 94020;
    --z-resize: 94030;
    --z-dock: 97000;
    --z-tab-switcher: 98000;
  }

  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    min-width: 0;
    min-height: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }
  html { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  body {
    min-height: 100dvh;
    background: radial-gradient(circle at 50% 0%, #2a2a35 0%, #0f0f15 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body.ui-safe-vertical {
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
  }
  body.ui-immersive { padding: 0; overflow: hidden !important; }

  #kxtsk-shell {
    position: relative;
    width: 100%;
    min-height: 100dvh;
    overflow: visible;
    z-index: var(--z-base);
  }
  .almasliber, .almasliber .shell, #main-content {
    position: relative;
    width: 100%;
    min-width: 0;
  }
  .almasliber { min-height: 100dvh; }

  /* HEADER SYSTEM */
  .topbar {
    position: relative;
    width: 100%;
    min-width: 0;
    height: var(--topbar-h);
    min-height: var(--topbar-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 12px;
    z-index: var(--z-header-system);
    isolation: isolate;
  }
  #system-topbar { z-index: var(--z-header-system); }
  #main-header { z-index: var(--z-header-main); }

  #main-header.header-visible {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  #main-header.header-hidden {
    transform: translateY(-100%);
    opacity: 0;
    pointer-events: none;
  }
  #main-header { transition: transform .25s ease, opacity .2s ease; }

  .brand, .brandX, .os-brand {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    min-width: 0;
    font-weight: 800;
  }
  .brandX { gap: 7px; font-size: 13px; letter-spacing: 1.3px; }
  .badgeX { font-size: 9px; opacity: .55; }

  .top-actions {
    min-width: 0;
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }
  .icon-btn, .soft-btn, .launcher-btn, .win-go-btn {
    flex: 0 0 auto;
    border: 0;
    border-radius: 12px;
    min-height: 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    cursor: pointer;
    font-weight: 600;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn { width: 34px; height: 34px; padding: 0; background: rgba(255,255,255,.08); }
  .soft-btn { padding: 10px 12px; background: rgba(255,255,255,.08); }
  .launcher-btn { padding: 10px 12px; background: rgba(0,242,255,.12); border: 1px solid rgba(0,242,255,.3); }
  .win-go-btn { padding: 10px 12px; background: rgba(0,242,255,.12); }
  .icon-btn:active, .win-controls button:active, .dock-bubble:active { transform: scale(.94); }

  .win-navrow {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-width: 0;
    padding: 0 16px 10px;
  }
  .win-urlbar {
    flex: 1 1 auto;
    min-width: 139px;
    padding: 11px 13px;
    border-radius: 13px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.06);
    color: #fff;
    outline: none;
    font-size: 10px;
  }
  .win-urlbar::placeholder { color: rgba(255,255,255,.45); }
  .win-urlbar:focus {
    border-color: rgba(0,242,255,.45);
    background: rgba(255,255,255,.09);
    box-shadow: 0 0 0 3px rgba(0,242,255,.08);
  }

  main, #main-content { position: relative; z-index: var(--z-content); }

  #stackWrap {
    position: relative;
    width: 100%;
    max-width: 800px;
    min-height: calc(100dvh - var(--topbar-h));
    margin: 0 auto;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: var(--session-gap);
    overflow: visible;
    z-index: var(--z-content);
    isolation: isolate;
  }

  /* SESSION WINDOW */
  .session-window {
    position: relative;
    width: 100%;
    height: calc(100dvh - var(--topbar-h));
    min-height: 0;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: rgba(30,30,35,.40);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: var(--session-radius);
    z-index: var(--z-session);
    transition: height .28s cubic-bezier(.16,1,.3,1), width .28s cubic-bezier(.16,1,.3,1), transform .28s ease, opacity .28s ease;
  }

  .session-window .win-hdr {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    height: var(--header-h);
    min-height: var(--header-h);
    display: flex;
    align-items: center;
    padding: 10px 14px;
    z-index: var(--z-session-header);
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none;
    touch-action: manipulation;
    isolation: isolate;
  }

  .win-controls {
    position: relative;
    z-index: var(--z-session-controls);
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 7px;
    pointer-events: auto;
  }
  .win-controls button {
    width: 30px;
    height: 30px;
    min-width: 30px;
    min-height: 30px;
    padding: 0;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,.10);
    color: #fff;
    cursor: pointer;
    font-family: "Noto Sans Symbols 2", "Noto Sans Symbols", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 17px;
    font-weight: 300;
    line-height: 1;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .win-controls button:hover { background: rgba(255,255,255,.17); }

  /* Tab counter button */
  .win-controls .tab-counter {
    width: auto;
    min-width: 30px;
    padding: 0 10px;
    border-radius: 20px;
    background: rgba(0,242,255,.15);
    font-size: 12px;
    font-weight: 600;
    color: #7af;
    letter-spacing: 0.3px;
  }

  .session-window .win-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    border: 0;
    background: transparent;
    z-index: 1;
    display: block;
  }

  .session-window.collapsed {
    height: var(--collapsed-h) !important;
    min-height: var(--collapsed-h) !important;
    overflow: hidden !important;
  }
  .session-window.collapsed .win-frame { visibility: hidden; pointer-events: none; }

  .session-window.peeked {
    height: var(--peek-h) !important;
    min-height: var(--peek-h) !important;
  }
  .session-window.peeked .win-frame { visibility: visible; pointer-events: auto; }

  .session-window.minimized {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    min-width: 1px !important;
    min-height: 1px !important;
    opacity: 0 !important;
    pointer-events: none !important;
    transform: scale(.90) translateY(50px);
    overflow: hidden !important;
  }

  .session-window.maximized {
    position: fixed !important;
    inset: 0 !important;
    width: 100vw !important;
    height: 100dvh !important;
    min-width: 0 !important;
    min-height: 0 !important;
    max-width: none !important;
    max-height: none !important;
    margin: 0 !important;
    padding: 0 !important;
    border: 0 !important;
    border-radius: 0 !important;
    overflow: hidden !important;
    z-index: var(--z-maximized) !important;
    transition: none !important;
  }
  .session-window.maximized .win-hdr {
    position: absolute !important;
    inset: 0 0 auto 0 !important;
    width: 100% !important;
    height: var(--header-h) !important;
    z-index: var(--z-maximized-header) !important;
    pointer-events: none !important;
  }
  .session-window.maximized .win-controls { pointer-events: auto !important; z-index: var(--z-maximized-controls) !important; }
  .session-window.maximized .win-frame {
    position: absolute !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    z-index: 1 !important;
  }

  body.has-maximized { overflow: hidden !important; }
  body.has-maximized .topbar { pointer-events: none; }
  body.has-maximized .session-window.maximized .win-controls,
  body.has-maximized .session-window.maximized .win-hdr { pointer-events: auto; }

  /* Resize handles */
  .session-window .resize-handle {
    position: absolute;
    z-index: var(--z-resize);
    background: transparent;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .session-window .resize-y { left: 0; right: 0; bottom: 0; height: var(--resize-hit); cursor: ns-resize; }
  .session-window .resize-x { top: var(--header-h); right: 0; bottom: 0; width: var(--resize-hit); cursor: ew-resize; }
  .session-window .resize-corner { right: 0; bottom: 0; width: var(--resize-corner); height: var(--resize-corner); cursor: nwse-resize; }
  .session-window .resize-corner::before {
    content: "";
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.25);
    box-shadow: 0 0 14px rgba(0,242,255,.18);
    pointer-events: none;
  }
  .session-window.maximized .resize-handle { display: none !important; }

  .session-window.suspended .win-frame { display: none; }
  .session-window.suspended::after {
    content: "⏸";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2rem;
    opacity: .3;
    pointer-events: none;
  }

  /* SESSION LIFECYCLE — indicador visual de estado */
  .session-window.state-idle { filter: saturate(.82); }
  .session-window.state-idle .win-hdr::before {
    content: "";
    position: absolute;
    top: 8px;
    right: 8px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255, 200, 60, .75);
    pointer-events: none;
  }
  .session-window.state-loading .win-hdr::before {
    content: "";
    position: absolute;
    top: 8px;
    right: 8px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(0, 242, 255, .8);
    animation: session-loading-pulse 1s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes session-loading-pulse {
    0%, 100% { opacity: .3; }
    50% { opacity: 1; }
  }

  /* DOCK */
  #dock {
    position: fixed;
    left: var(--dock-offset-x);
    bottom: calc(var(--dock-bottom-gap) + var(--safe-bottom));
    z-index: var(--z-dock);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 12px 10px;
    border-radius: 24px;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,.1);
  }
  #dock:empty { opacity: 0; pointer-events: none; }
  .dock-bubble {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.20);
    color: #fff;
    cursor: pointer;
    font-family: "Noto Sans Symbols 2", "Noto Sans Symbols", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 19px;
    line-height: 1;
    touch-action: manipulation;
  }

  /* TAB SWITCHER OVERLAY */
  .tab-switcher-overlay{
    position:fixed;
    inset:0;
    z-index:var(--z-tab-switcher,98000);
    display:none;
    align-items:center;
    justify-content:center;
    padding:
      calc(16px + var(--safe-top,0px))
      14px
      calc(16px + var(--safe-bottom,0px));
    background:
      radial-gradient(
        circle at 50% 0%,
        rgba(0,229,255,.10),
        transparent 42%
      ),
      rgba(2,3,8,.78);
    backdrop-filter:blur(24px) saturate(1.2);
    -webkit-backdrop-filter:blur(24px) saturate(1.2);
    opacity:0;
    transition:opacity .722s ease;
  }

  .tab-switcher-overlay.open{
    display:flex;
    opacity:1;
  }

  .tab-switcher-panel{
    position:relative;
    width:min(760px,100%);
    max-height:min(86dvh,900px);
    overflow:auto;
    padding:16px;
    border: 1px solid rgba(255,255,255,.11);
    border-radius: clamp(22px,5vw,32px);
    background:
      linear-gradient(
        145deg,
        rgba(22,23,31,.94),
        rgba(8,9,14,.91)
      );
    box-shadow:
      0 30px 90px rgba(0,0,0,.65),
      inset 0 1px 0 rgba(255,255,255,.06);
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }

  .tab-switcher-panel::-webkit-scrollbar{ display:none; }

  .tab-switcher-panel .panel-header{
    position:sticky;
    top:0;
    z-index:3;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin:-4px -4px 14px;
    padding:10px 8px 14px;
    background:
      linear-gradient(
        to bottom,
        rgba(15,16,22,.98),
        rgba(15,16,22,.82),
        transparent
      );
    backdrop-filter:blur(12px);
  }

  .tab-switcher-panel .panel-header h2{
    margin:0;
    font-size:18px;
    line-height:1.1;
    font-weight:750;
    letter-spacing:-.02em;
    color:var(--text,#f5f5f7);
  }

  .tab-switcher-panel .panel-header h2::before{
    content:"◉";
    margin-right:8px;
    color:var(--cyan,#00e5ff);
    font-size:.72em;
    vertical-align:2px;
  }

  .tab-switcher-panel .panel-actions{
    display:flex;
    align-items:center;
    gap:7px;
  }

  .tab-switcher-panel .panel-actions button{
    min-height:34px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:7px 11px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:12px;
    background:rgba(255,255,255,.055);
    color:rgba(255,255,255,.86);
    font-size:12px;
    font-weight:650;
    cursor:pointer;
    transition: transform .16s ease, background .16s ease, border-color .16s ease;
  }

  .tab-switcher-panel .panel-actions button:hover{
    background:rgba(255,255,255,.10);
    border-color:rgba(255,255,255,.16);
  }

  .tab-switcher-panel .panel-actions button:active{ transform:scale(.96); }

  .tab-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill,minmax(210px,1fr));
    gap:10px;
  }

  .tab-card{
    position:relative;
    min-height:126px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    gap:7px;
    padding:15px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.075);
    border-radius:20px;
    background: linear-gradient(145deg, rgba(255,255,255,.065), rgba(255,255,255,.025));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
    cursor:pointer;
    transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
  }

  .tab-card::before{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(circle at 15% 0%, rgba(0,229,255,.11), transparent 48%);
    opacity:0;
    transition:opacity .18s ease;
    pointer-events:none;
  }

  .tab-card:hover{
    transform:translateY(-2px);
    border-color:rgba(0,229,255,.20);
    background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.035));
    box-shadow: 0 12px 30px rgba(0,0,0,.24);
  }

  .tab-card:hover::before{ opacity:1; }

  .tab-card.active{
    border-color:rgba(0,229,255,.48);
    background: linear-gradient(145deg, rgba(0,229,255,.12), rgba(255,255,255,.035));
    box-shadow: 0 0 0 1px rgba(0,229,255,.08), 0 12px 35px rgba(0,0,0,.28), inset 0 0 30px rgba(0,229,255,.035);
  }

  .tab-card.active::after{
    content:"ATIVA";
    position:absolute;
    top:11px;
    left:12px;
    padding:4px 7px;
    border-radius:999px;
    background:rgba(0,229,255,.10);
    border:1px solid rgba(0,229,255,.18);
    color:#00e5ff;
    font-size:8px;
    font-weight:800;
    letter-spacing:.08em;
  }

  .tab-card::marker{ display:none; }

  .tab-card .tab-icon{
    width:38px;
    height:38px;
    display:grid;
    place-items:center;
    margin-bottom:auto;
    border-radius:13px;
    background: linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.035));
    border:1px solid rgba(255,255,255,.08);
    font-size:18px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.07);
  }

  .tab-card .tab-title{
    position:relative;
    z-index:1;
    padding-right:28px;
    font-size:13px;
    line-height:1.2;
    font-weight:720;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .tab-card .tab-url{
    position:relative;
    z-index:1;
    font-size:9px;
    line-height:1.25;
    color:rgba(255,255,255,.43);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .tab-card .tab-state{
    position:absolute;
    right:12px;
    bottom:13px;
    display:flex;
    align-items:center;
    gap:5px;
    font-size:8px;
    font-weight:750;
    letter-spacing:.05em;
    color:rgba(255,255,255,.42);
  }

  .tab-card .tab-state-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#777;
  }

  .tab-card[data-state="active"] .tab-state-dot{
    background:#39ffb6;
    box-shadow:0 0 8px rgba(57,255,182,.6);
  }

  .tab-card[data-state="loading"] .tab-state-dot{
    background:#00e5ff;
    animation:tabStatePulse 1s infinite;
  }

  .tab-card[data-state="idle"] .tab-state-dot{ background:#ffd60a; }
  .tab-card[data-state="suspended"] .tab-state-dot{ background:#ff6b6b; }

  .tab-card[data-keepalive="true"] .tab-state::after{
    content:" · KEEP";
    color:#00e5ff;
  }

  @keyframes tabStatePulse{ 50%{opacity:.3;transform:scale(.65)} }

  .tab-card .tab-close{
    position:absolute;
    top:9px;
    right:9px;
    width:28px;
    height:28px;
    display:grid;
    place-items:center;
    border:1px solid rgba(255,255,255,.07);
    border-radius:10px;
    background:rgba(0,0,0,.18);
    color:rgba(255,255,255,.45);
    opacity:0;
    cursor:pointer;
    transition: opacity .15s ease, background .15s ease, color .15s ease;
  }

  .tab-card:hover .tab-close,
  .tab-card:focus-within .tab-close{ opacity:1; }

  .tab-card .tab-close:hover{
    background:rgba(255,70,90,.14);
    color:#ff6b6b;
  }

  .tab-card .tab-fav{
    position:absolute;
    top:10px;
    left:10px;
    width:27px;
    height:27px;
    display:grid;
    place-items:center;
    border:0;
    background:transparent;

      KODUX:    { n:'KODUX',    sym:'⌂', hz:528, v:'Rocko',   l:'pt-BR', r:1.00,  p:0.07, c1:'#F97316', c2:'#FB923C', sig:[33,[0,3,6,3,0,-5],0.10,0.05,'sawtooth'] },
      BLLUE:    { n:'BLLUE',    sym:'≈', hz:432, v:'Zuzana',  l:'cs-CZ', r:0.94,  p:1.69, c1:'#3AB6FF', c2:'#B8E1FF', sig:[45,[0,3,7,6,3,0],0.12,0.07,'triangle'] },
      JESUS:    { n:'JESUS',    sym:'✝', hz:888, v:'Sara',    l:'da-DK', r:1.09,  p:0.03, c1:'#FFD700', c2:'#FFB84D', sig:[57,[0,7,12,19,12],0.22,0.16,'sine'] },
      INFODOSE: { n:'INFODOSE', sym:'💊', hz:528, v:'Luciana', l:'pt-BR', r:1.06,  p:0.96, c1:'#22C55E', c2:'#166534', sig:[57,[0,2,5,7,9,12,9],0.11,0.06,'sine'] }
    };

    const ARCH_KEYS = Object.keys(ARCHETYPES);

    function getActiveArchKey() {
      const body = getBody();
      const raw = body?.dataset?.arch || ROOT.dataset.userArch || 'KOBLLUX';
      const upper = String(raw).toUpperCase();
      return ARCHETYPES[upper] ? upper : 'KOBLLUX';
    }

    function hexToRgb(h) {
      h = String(h).replace('#', '');
      if (h.length === 3) h = h.split('').map(c => c + c).join('');
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }

    function mixHex(a, b, t) {
      const A = hexToRgb(a), B = hexToRgb(b);
      return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
    }

    function adjustForDayIfNeeded(hex, theme) {
      if (theme !== 'day') return hex;
      const [r, g, b] = hexToRgb(hex);
      const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return lum > 0.68 ? mixHex(hex, '#0f172a', 0.42) : hex;
    }

    /* ═══════════════════════════════════════════════════════════
       2. KOBSONORO · MOTOR DE ÁUDIO & SFX ON/OFF (Tone.js)
    ═══════════════════════════════════════════════════════════ */
    const KOBSonoro = global.KOBSonoro = global.KOBSonoro || {};
    const SND = {
      enabled: true,
      started: false,
      playing: false,
      part: null,
      synths: {},
      reverb: null,
      delay: null
    };

    function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

    async function ensureAudio() {
      if (!SND.enabled) return false;
      if (SND.started) return true;
      if (typeof Tone === 'undefined') {
        await new Promise(r => {
          const t = setInterval(() => {
            if (typeof Tone !== 'undefined' || performance.now() > 6000) { clearInterval(t); r(); }
          }, 100);
        });
      }
      if (typeof Tone === 'undefined') return false;
      try {
        await Tone.start();
        const lim = new Tone.Limiter(-2).toDestination();
        SND.reverb = new Tone.Reverb({ decay: 3.2, wet: 0.38 }).connect(lim);
        SND.delay  = new Tone.FeedbackDelay('8n', 0.24).connect(SND.reverb);

        SND.synths.lead    = new Tone.PolySynth(Tone.Synth, { oscillator: { type: 'triangle' }, envelope: { attack: .02, decay: .3, sustain: .2, release: 1.1 } }).connect(SND.delay);
        SND.synths.lead.volume.value = -9;
        SND.synths.bubble  = new Tone.Synth({ oscillator: { type: 'sine' }, envelope: { attack: .01, decay: .14, sustain: 0, release: .2 } }).connect(SND.reverb);
        SND.synths.crystal = new Tone.PolySynth(Tone.FMSynth, { harmonicity: 3, modulationIndex: 6, envelope: { attack: .005, decay: .38, sustain: 0, release: 1.1 } }).connect(SND.reverb);
        SND.synths.impact  = new Tone.MembraneSynth({ pitchDecay: .05, octaves: 4, envelope: { attack: .001, decay: .28, sustain: 0, release: .38 } }).connect(lim);
        SND.synths.portal  = new Tone.Synth({ oscillator: { type: 'sawtooth' }, envelope: { attack: .15, decay: .4, sustain: .2, release: .8 } }).connect(SND.delay);

        SND.started = true;
        return true;
      } catch (e) {
        return false;
      }
    }

    function hslToBaseFreq(h1, h2) {
      const f1 = 200 + (h1 / 360) * 700;
      const f2 = 200 + (h2 / 360) * 700;
      return { f1, f2 };
    }

    KOBSonoro.sfx = async function(desc, colorCtx) {
      if (!SND.enabled) return false;
      if (!await ensureAudio()) return false;
      const body = getBody();
      const d = String(desc || '').toLowerCase();
      const now = Tone.now();
      const h1 = parseInt(colorCtx?.h1 || body?.dataset?.hue1 || '188', 10);
      const h2 = parseInt(colorCtx?.h2 || body?.dataset?.hue2 || '210', 10);
      const { f1, f2 } = hslToBaseFreq(h1, h2);

      try {
        if (/bolha|bubble|gota|pingo|click|nav/.test(d)) {
          const b = f1 * (0.85 + Math.random() * 0.3);
          SND.synths.bubble.triggerAttackRelease(b, .11, now);
          SND.synths.bubble.triggerAttackRelease(b * 1.48, .09, now + .075);
        } else if (/cristal|crystal|vidro|sino/.test(d)) {
          [f1, f1 * 1.5, f1 * 2].forEach((f, i) => {
            try { SND.synths.crystal.triggerAttackRelease(f, .28, now + i * .045); } catch (_) {}
          });
        } else if (/impacto|impact|pancada/.test(d)) {
          SND.synths.impact.triggerAttackRelease('C1', .22, now);
        } else if (/sopro|whoosh|swoosh|drag/.test(d)) {
          const swFilter = new Tone.Filter({ type: 'bandpass', frequency: f1 * 0.8, Q: 3.9 }).connect(SND.reverb);
          const swNoise  = new Tone.NoiseSynth({ noise: { type: 'pink' }, envelope: { attack: .22, decay: .16, sustain: .15, release: .34 } }).connect(swFilter);
          swFilter.frequency.setValueAtTime(f1 * 0.1, now);
          swFilter.frequency.exponentialRampToValueAtTime(f2 * 0.4, now + 0.26);
          swFilter.frequency.exponentialRampToValueAtTime(f1 * 0.1, now + 0.62);
          swNoise.triggerAttackRelease(0.38, now);
          setTimeout(() => { try { swNoise.dispose(); swFilter.dispose(); } catch (_) {} }, 1100);
        } else if (/portal|transition/.test(d)) {
          SND.synths.portal.frequency.cancelScheduledValues(now);
          SND.synths.portal.frequency.setValueAtTime(f1 * 0.5, now);
          SND.synths.portal.frequency.exponentialRampToValueAtTime(f2 * 2, now + .45);
          SND.synths.portal.triggerAttackRelease('A3', .36, now);
        } else {
          SND.synths.bubble.triggerAttackRelease(f2 * 0.9, .09, now);
          SND.synths.bubble.triggerAttackRelease(f2 * 1.35, .09, now + .07);
        }
        return true;
      } catch (_) {
        return false;
      }
    };

    KOBSonoro.transition = async function(archName) {
      if (!SND.enabled) return false;
      const key = String(archName || getActiveArchKey()).toUpperCase();
      const cfg = ARCHETYPES[key] || ARCHETYPES.KOBLLUX;
      const sig = cfg.sig;
      if (!await ensureAudio()) return false;
      try { SND.synths.lead.set({ oscillator: { type: sig[4] } }); } catch (_) {}
      try { SND.synths.lead.releaseAll(Tone.now()); } catch (_) {}
      let t = Tone.now() + 0.04;
      sig[1].forEach(off => {
        try { SND.synths.lead.triggerAttackRelease(mtof(sig[0] + off), sig[2], t); } catch (_) {}
        t += sig[3];
      });
      return true;
    };

    KOBSonoro.stop = function() {
      if (SND.part) { try { SND.part.dispose(); } catch (_) {} SND.part = null; }
      try { Tone.Transport.stop(); Tone.Transport.cancel(0); } catch (_) {}
      try { Object.keys(SND.synths).forEach(k => SND.synths[k]?.releaseAll?.()); } catch (_) {}
      SND.playing = false;
    };

    /* ═══════════════════════════════════════════════════════════
       3. SISTEMA DE VOZ TTS POR ARQUÉTIPO (LÊ DO BODY)
    ═══════════════════════════════════════════════════════════ */
    let voices = [];
    function loadVoices() {
      voices = ('speechSynthesis' in window) ? window.speechSynthesis.getVoices() : [];
    }
    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
      setTimeout(loadVoices, 400);
    }

    const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

    function findVoiceForArch(cfg) {
      if (!voices.length) loadVoices();
      const targetName = norm(cfg.v || '');
      const targetLang = norm(cfg.l || 'pt-BR').split('-')[0];
      return voices.find(v => norm(v.name).includes(targetName) && norm(v.lang).startsWith(targetLang))
          || voices.find(v => norm(v.lang).startsWith(targetLang))
          || voices.find(v => norm(v.lang).startsWith('pt'))
          || voices[0] || null;
    }

    function createUtterance(text, archName) {
      const key = String(archName || getActiveArchKey()).toUpperCase();
      const cfg = ARCHETYPES[key] || ARCHETYPES.KOBLLUX;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = cfg.l;
      u.rate = cfg.r;
      u.pitch = cfg.p;
      const v = findVoiceForArch(cfg);
      if (v) { u.voice = v; u.lang = v.lang || cfg.l; }
      return u;
    }

    /* ═══════════════════════════════════════════════════════════
       4. KOB BUS · PONTE UNIVERSAL (PARENT + IFRAMES + TTS)
    ═══════════════════════════════════════════════════════════ */
    const BUS_STATE = {
      ttsEnabled: true,
      frames: new Map(),
      documents: new WeakSet(),
      lastText: '',
      lastTime: 0
    };

    function cleanText(text) {
      return String(text || '')
        .replace(/\u200B/g, '')
        .replace(/\u00A0/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .slice(0, 1200);
    }

    function extractText(target) {
      if (!target || target.nodeType !== 1) return '';
      let el = target;
      if (['SVG', 'PATH', 'USE', 'LINE', 'POLYGON', 'CIRCLE', 'POLYLINE'].includes(el.tagName)) {
        el = el.closest?.('button,a,[role="button"]') || el.parentElement;
      }
      if (!el || ['SCRIPT', 'STYLE', 'NOSCRIPT', 'INPUT', 'TEXTAREA', 'SELECT', 'OPTION'].includes(el.tagName)) return '';
      if (el.closest?.('[data-kob-ignore],[data-tts-ignore],.kob-tts-ignore,#main-header')) return '';

      const control = el.closest?.('button,a,[role="button"]');
      if (control) {
        if (control.hasAttribute('data-speak')) return cleanText(control.getAttribute('data-speak'));
        if (control.hasAttribute('data-kob-tts')) return cleanText(control.innerText || control.getAttribute('aria-label') || '');
        return '';
      }

      const block = el.closest?.('p,li,h1,h2,h3,h4,h5,h6,blockquote,pre,td,th,.card,[data-kob-content]') || el;
      return cleanText(block.innerText || block.textContent || '');
    }

    function speakText(text, opts = {}) {
      if (!BUS_STATE.ttsEnabled && !opts.force) return false;
      text = cleanText(text);
      if (text.length < 2) return false;

      const now = Date.now();
      if (text === BUS_STATE.lastText && now - BUS_STATE.lastTime < 180 && !opts.force) return false;
      BUS_STATE.lastText = text;
      BUS_STATE.lastTime = now;

      if (!('speechSynthesis' in window)) return false;
      try {
        window.speechSynthesis.cancel();
        const u = createUtterance(text, opts.arch);
        if (opts.rate) u.rate = opts.rate;
        if (opts.pitch) u.pitch = opts.pitch;
        if (opts.onstart) u.onstart = opts.onstart;
        if (opts.onend) u.onend = opts.onend;
        window.speechSynthesis.speak(u);
        return true;
      } catch (_) {
        return false;
      }
    }

    function stopSpeech() {
      try { window.speechSynthesis?.cancel(); } catch (_) {}
    }

    function isSameOrigin(iframe) {
      try {
        const origin = new URL(iframe.src || iframe.getAttribute('src') || location.href, location.href).origin;
        return origin === location.origin;
      } catch (_) {
        return false;
      }
    }

    function syncFrameState(iframe) {
      const theme    = ROOT.dataset.theme || 'night';
      const userArch = ROOT.dataset.userArch || 'KOBLLUX';
      const arch     = getActiveArchKey();

      if (isSameOrigin(iframe)) {
        try {
          const doc = iframe.contentDocument || iframe.contentWindow?.document;
          if (doc?.documentElement) {
            doc.documentElement.dataset.theme    = theme;
            doc.documentElement.dataset.userArch = userArch;
            if (doc.body) {
              doc.body.dataset.mode = theme;
              doc.body.dataset.arch = arch.toLowerCase();
            }
          }
        } catch (_) {}
      }
      try {
        iframe.contentWindow?.postMessage({
          type: 'KOB_SYNC_STATE',
          theme,
          mode: theme,
          userArch,
          arch,
          ttsEnabled: BUS_STATE.ttsEnabled,
          sfxEnabled: SND.enabled
        }, '*');
      } catch (_) {}
    }

    function connectFrame(iframe) {
      if (!iframe) return;
      if (!iframe.__kobBound) {
        iframe.__kobBound = true;
        iframe.addEventListener('load', () => connectFrame(iframe), true);
      }
      syncFrameState(iframe);

      if (isSameOrigin(iframe)) {
        try {
          const doc = iframe.contentDocument || iframe.contentWindow?.document;
          if (doc && !BUS_STATE.documents.has(doc)) {
            BUS_STATE.documents.add(doc);
            doc.addEventListener('click', e => {
              if (!BUS_STATE.ttsEnabled) return;
              const txt = extractText(e.target);
              if (txt) speakText(txt);
            }, true);
          }
        } catch (_) {}
      }
    }

    function broadcastAllFrames() {
      document.querySelectorAll('iframe').forEach(syncFrameState);
    }

    document.addEventListener('click', e => {
      if (!BUS_STATE.ttsEnabled) return;
      if (e.target?.closest?.('iframe')) return;
      const txt = extractText(e.target);
      if (txt) speakText(txt);
    }, true);

    window.addEventListener('message', event => {
      const data = event.data;
      if (!data || typeof data.type !== 'string') return;
      if (data.type === 'KOB_TTS' && data.text) speakText(data.text);
      if (data.type === 'KOB_SFX') KOBSonoro.sfx(data.desc || 'bubble');
      if (data.type === 'KOB_SET_THEME' && data.theme && global.DualTheme) global.DualTheme.set(data.theme);
      if (data.type === 'KOB_SET_ARCH' && data.arch && global.DualArch) global.DualArch.set(data.arch);
      if (data.type === 'KOB_SET_USER_ARCH' && data.arch && global.DualUserArch) global.DualUserArch.set(data.arch);
      if (data.type === 'KOB_SET_TTS' && typeof data.enabled === 'boolean' && global.DualTTS) global.DualTTS.set(data.enabled);
      if (data.type === 'KOB_SET_SFX' && typeof data.enabled === 'boolean' && global.DualSFX) global.DualSFX.set(data.enabled);
    });

    /* ═══════════════════════════════════════════════════════════
       5. APIs GLOBAIS UNIFICADAS
          • ROOT (<html>): data-theme, data-user-arch, data-tts, data-sfx
          • BODY (<body>): data-arch, data-voice-arch, data-mode, tokens do arquétipo
    ═══════════════════════════════════════════════════════════ */
    const THEMES = ['night', 'day', 'sunset'];

    function applyUserColors(userArchKey) {
      const cfg = ARCHETYPES[userArchKey] || ARCHETYPES.KOBLLUX;
      const currentTheme = ROOT.dataset.theme || 'night';
      const u1 = adjustForDayIfNeeded(mixHex(cfg.c1, cfg.c2, 0.25), currentTheme);
      const u2 = adjustForDayIfNeeded(cfg.c2, currentTheme);

      ROOT.style.setProperty('--user-primary', u1);
      ROOT.style.setProperty('--user-secondary', u2);
    }

    function applyArchColors(archKey) {
      const cfg = ARCHETYPES[archKey] || ARCHETYPES.KOBLLUX;
      const currentTheme = ROOT.dataset.theme || 'night';
      const p1 = adjustForDayIfNeeded(mixHex(cfg.c1, cfg.c2, 0.25), currentTheme);
      const p2 = adjustForDayIfNeeded(cfg.c2, currentTheme);

      const target = getBody() || ROOT;

      target.style.setProperty('--primary', p1);
      target.style.setProperty('--kob-L-primary', p1);
      target.style.setProperty('--kob-L-secondary', p2);
      target.style.setProperty('--kob-voice-primary', cfg.c1);
      target.style.setProperty('--kob-voice-secondary', cfg.c2);
      target.style.setProperty('--orb-primary', cfg.c1);
      target.style.setProperty('--orb-secondary', cfg.c2);
      target.style.setProperty('--active-color', p1);
      target.style.setProperty('--active-secondary', p2);

      // Atualiza Hues numéricas no BODY para o motor KOBSonoro
      const [r, g, b] = hexToRgb(cfg.c1).map(v => v / 255);
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h = 0;
      if (max !== min) {
        const d = max - min;
        h = max === r ? ((g - b) / d + (g < b ? 6 : 0)) : max === g ? ((b - r) / d + 2) : ((r - g) / d + 4);
        h = Math.round(h * 60);
      }
      target.dataset.hue1 = String(h);
      target.dataset.hue2 = String((h + 48) % 360);
    }

    /* Arquétipo Base do Usuário (fica no <html>) */
    global.DualUserArch = {
      set(name) {
        const key = String(name || 'KOBLLUX').toUpperCase();
        const valid = ARCHETYPES[key] ? key : 'KOBLLUX';
        ROOT.dataset.userArch = valid;
        applyUserColors(valid);
        try { localStorage.setItem('di_userArch', valid); } catch (_) {}
        broadcastAllFrames();
        window.dispatchEvent(new CustomEvent('dual:user-arch-change', { detail: { arch: valid, config: ARCHETYPES[valid] } }));
        return valid;
      },
      get() { return ROOT.dataset.userArch || 'KOBLLUX'; }
    };

    /* Arquétipo Ativo da Sessão/Voz (mutação ocorre exclusivamente no <body>) */
    global.DualArch = {
      list: ARCH_KEYS,
      map: ARCHETYPES,
      set(name, silent = false) {
        const key = String(name || 'KOBLLUX').toUpperCase();
        const valid = ARCHETYPES[key] ? key : 'KOBLLUX';
        const cfg = ARCHETYPES[valid];
        const body = getBody();

        // Garante que o <html> NÃO receba mutação de data-arch
        if (ROOT.hasAttribute('data-arch')) ROOT.removeAttribute('data-arch');

        if (body) {
          body.dataset.arch = valid.toLowerCase();
          body.dataset.voiceArch = valid.toLowerCase();
        } else {
          // Caso seja chamado antes do <body> existir no parser, agenda para o DOMContentLoaded
          window.addEventListener('DOMContentLoaded', () => {
            const b = getBody();
            if (b) {
              b.dataset.arch = valid.toLowerCase();
              b.dataset.voiceArch = valid.toLowerCase();
              applyArchColors(valid);
            }
          }, { once: true });
        }

        applyArchColors(valid);

        try { localStorage.setItem('di_activeArch', valid); } catch (_) {}
        broadcastAllFrames();

        if (!silent) KOBSonoro.transition(valid);

        window.dispatchEvent(new CustomEvent('dual:arch-change', { detail: { arch: valid, config: cfg } }));
        window.dispatchEvent(new CustomEvent('kob:arch', { detail: { arch: valid } }));
        return valid;
      },
      next() {
        const cur = getActiveArchKey();
        const nextKey = ARCH_KEYS[(ARCH_KEYS.indexOf(cur) + 1) % ARCH_KEYS.length];
        return this.set(nextKey);
      },
      get() { return getActiveArchKey(); }
    };

    global.DualTheme = {
      modes: THEMES,
      set(theme) {
        const normTheme = theme === 'light' ? 'day' : theme === 'dark' ? 'night' : (THEMES.includes(theme) ? theme : 'night');
        ROOT.dataset.theme = normTheme;
        const body = getBody();
        if (body) body.dataset.mode = normTheme;

        const metaColors = { night: '#0b1020', day: '#d0e9ff', sunset: '#fb923c' };
        document.getElementById('metaThemeColor')?.setAttribute('content', metaColors[normTheme]);

        applyUserColors(ROOT.dataset.userArch || 'KOBLLUX');
        applyArchColors(getActiveArchKey());

        try {
          localStorage.setItem('dual-theme', normTheme);
          localStorage.setItem('di_themeMode', normTheme);
        } catch (_) {}

        broadcastAllFrames();
        KOBSonoro.sfx('cristal');
        window.dispatchEvent(new CustomEvent('dual:theme-change', { detail: { theme: normTheme, mode: normTheme } }));
        return normTheme;
      },
      toggle() {
        const cur = ROOT.dataset.theme || 'night';
        return this.set(THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length]);
      },
      get() { return ROOT.dataset.theme || 'night'; }
    };

    global.DualTTS = {
      set(enabled) {
        BUS_STATE.ttsEnabled = Boolean(enabled);
        ROOT.dataset.tts = BUS_STATE.ttsEnabled ? 'on' : 'off';
        if (!BUS_STATE.ttsEnabled) stopSpeech();
        try { localStorage.setItem('di_ttsEnabled', String(BUS_STATE.ttsEnabled)); } catch (_) {}
        broadcastAllFrames();
        window.dispatchEvent(new CustomEvent('dual:tts-change', { detail: { enabled: BUS_STATE.ttsEnabled } }));
        return BUS_STATE.ttsEnabled;
      },
      toggle() { return this.set(!BUS_STATE.ttsEnabled); },
      get() { return BUS_STATE.ttsEnabled; },
      speak: speakText,
      stop: stopSpeech
    };

    global.DualSFX = {
      set(enabled) {
        SND.enabled = Boolean(enabled);
        ROOT.dataset.sfx = SND.enabled ? 'on' : 'off';
        if (!SND.enabled) KOBSonoro.stop();
        else KOBSonoro.sfx('bubble');
        try { localStorage.setItem('di_sfxEnabled', String(SND.enabled)); } catch (_) {}
        broadcastAllFrames();
        window.dispatchEvent(new CustomEvent('dual:sfx-change', { detail: { enabled: SND.enabled } }));
        return SND.enabled;
      },
      toggle() { return this.set(!SND.enabled); },
      get() { return SND.enabled; },
      sfx: KOBSonoro.sfx
    };

    /* Aliases de compatibilidade com todo o ecossistema KOBLLUX / Soneto */
    global.KOBBus = {
      speak: speakText,
      say: speakText,
      stop: stopSpeech,
      nextArch: () => global.DualArch.next(),
      currentArch: () => global.DualArch.get(),
      scan: () => document.querySelectorAll('iframe').forEach(connectFrame)
    };
    global.KOB_BUS = global.KOBBus;
    global.applyArch = name => global.DualArch.set(name);
    global.KOBLLUX = Object.assign(global.KOBLLUX || {}, {
      speakText,
      stopSpeech
    });

    /* Observa novos iframes inseridos dinamicamente no #kxtsk-shell */
    window.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('iframe').forEach(connectFrame);
      const obs = new MutationObserver(muts => {
        muts.forEach(m => m.addedNodes.forEach(n => {
          if (n.nodeType !== 1) return;
          if (n.matches?.('iframe')) connectFrame(n);
          n.querySelectorAll?.('iframe').forEach(connectFrame);
        }));
      });
      obs.observe(document.documentElement, { childList: true, subtree: true });
    });
  })(window);
  </script>
</head>

<body data-mode="night" data-arch="kobllux" data-voice-arch="kobllux">

  <div class="almasliber" data-app="almasliber">
    <div class="shell">
      <div class="wrap">

        <!-- ═══════════════════════════════════════════════════════
             HEADER GLOBAL UNIFICADO
             1. Toque no Header → Colapsa/Expande #main-content
             2. #arch-dot  → Cicla 17 Arquétipos no <body> (Voz + Cor + Assinatura)
             3. #sfx-dot   → Liga/Desliga Efeitos Sonoros no <html> (Tone.js)
             4. #tts-dot   → Liga/Desliga Click-to-Speech no <html>
             5. #theme-dot → Cicla Night → Day → Sunset no <html> + <body>
        ═══════════════════════════════════════════════════════ -->
        <header class="topbar header-visible" id="main-header">
          <div class="brandX">
            <span>DUAL</span>
            <span style="color:var(--text);" class="badgeX">GLOBAL</span>
            <span class="arch-pill-tag" id="headerArchBadge" title="Arquétipo ativo">△ KOBLLUX</span>
          </div>

          <!-- CONTROLES DO HEADER (SVGs Inline) -->
          <div class="top-actions" data-tts-ignore>

            <!-- 1. ARQUÉTIPO (Aplica no <body>) -->
            <button id="arch-dot" class="header-dot-btn arch-dot" type="button" data-active="true" aria-label="Trocar arquétipo" title="Arquétipo: KOBLLUX (toque para alternar)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
                <polygon points="12 3 21 19 3 19"></polygon>
                <circle cx="12" cy="14" r="1.5"></circle>
              </svg>
            </button>

            <!-- 2. SFX ON/OFF -->
            <button id="sfx-dot" class="header-dot-btn sfx-dot" type="button" data-active="true" aria-pressed="true" aria-label="Alternar efeitos sonoros" title="SFX Sonoro: ATIVO">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
                <path d="M9 18V5l12-2v13"></path>
                <circle cx="6" cy="18" r="3"></circle>
                <circle cx="18" cy="16" r="3"></circle>
              </svg>
            </button>

            <!-- 3. TTS ON/OFF -->
            <button id="tts-dot" class="header-dot-btn tts-dot" type="button" data-active="true" aria-pressed="true" aria-label="Alternar leitura ao clicar" title="Click-to-Speech: ATIVO">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
              </svg>
            </button>

            <!-- 4. TEMA (NIGHT · DAY · SUNSET) -->
            <button id="theme-dot" class="header-dot-btn theme-dot" type="button" data-active="true" aria-label="Alternar tema" title="Tema: Noite (Night)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </button>

          </div>
        </header>

        <!-- MAIN · hospeda o #kxtsk-shell -->
        <main>
          <div id="main-content">
            <div id="kxtsk-shell">
              <div id="inject-here"></div>
              <div id="dock"></div>
            </div>
          </div>
        </main>

        <!-- BOTTOM NAV -->
        <nav style="display:none" class="symbol-bar bottom-nav" data-module="navigation" aria-label="Navegação principal">
          <button class="nav-item active" data-tab="home"><span class="nav-icon">⌂</span><span>Início</span></button>
          <button class="nav-item" id="navLibraryBtn"><span class="nav-icon">▣</span><span>Library</span></button>
          <button class="nav-main" id="navCreateBtn">+</button>
          <button class="nav-item" id="navResultsBtn"><span class="nav-icon">▥</span><span>Resultados</span></button>
          <button class="nav-item" id="navProfileBtn"><span class="nav-icon">♙</span><span>Perfil</span></button>
        </nav>

      </div>
    </div>
  </div>

  <!-- TOASTER & OUTLINE -->
  <div class="toaster-wrap" id="toasterWrap"></div>
  <div id="kob-tts-outline"></div>
  <input type="file" id="nebulaFileInput" multiple accept=".txt,.md,.html,.pdf" style="display:none">

  <!-- ═══════════════════════════════════════════════════════════
       HEADER UI CONTROLLER · WIRING DOS BOTÕES + SMART HEADER
  ═══════════════════════════════════════════════════════════ -->
  <script>
  (() => {
    'use strict';

    const HEADER    = document.getElementById('main-header');
    const MAIN      = document.getElementById('main-content');
    const ARCH_DOT  = document.getElementById('arch-dot');
    const ARCH_BADGE= document.getElementById('headerArchBadge');
    const SFX_DOT   = document.getElementById('sfx-dot');
    const TTS_DOT   = document.getElementById('tts-dot');
    const THEME_DOT = document.getElementById('theme-dot');

    const ICONS = {
      sfxOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>',
      sfxOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><line x1="2" y1="2" x2="22" y2="22"></line></svg>',
      ttsOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>',
      ttsOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>',
      night: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>',
      day: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>',
      sunset: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><path d="M17 18a5 5 0 0 0-10 0"></path><line x1="12" y1="9" x2="12" y2="2"></line><line x1="4.22" y1="10.22" x2="5.64" y2="11.64"></line><line x1="1" y1="18" x2="3" y2="18"></line><line x1="21" y1="18" x2="23" y2="18"></line><line x1="18.36" y1="11.64" x2="19.78" y2="10.22"></line><line x1="23" y1="22" x2="1" y2="22"></line><polyline points="16 5 12 9 8 5"></polyline></svg>'
    };

    const THEME_LABELS = {
      night: 'Noite (Night)',
      day: 'Dia (Day)',
      sunset: 'Pôr do Sol (Sunset)'
    };

    /* Sincroniza UI quando os estados mudam */
    window.addEventListener('dual:arch-change', e => {
      const { arch, config } = e.detail;
      if (ARCH_BADGE) ARCH_BADGE.textContent = `${config.sym} ${arch}`;
      if (ARCH_DOT) ARCH_DOT.setAttribute('title', `Arquétipo (Body): ${arch} · ${config.hz}Hz (toque para alternar)`);
    });

    window.addEventListener('dual:sfx-change', e => {
      const on = e.detail.enabled;
      if (!SFX_DOT) return;
      SFX_DOT.innerHTML = on ? ICONS.sfxOn : ICONS.sfxOff;
      SFX_DOT.dataset.active = String(on);
      SFX_DOT.setAttribute('aria-pressed', String(on));
      SFX_DOT.setAttribute('title', on ? 'SFX Sonoro: ATIVO (toque para mutar)' : 'SFX Sonoro: OFF (toque para ativar)');
    });

    window.addEventListener('dual:tts-change', e => {
      const on = e.detail.enabled;
      if (!TTS_DOT) return;
      TTS_DOT.innerHTML = on ? ICONS.ttsOn : ICONS.ttsOff;
      TTS_DOT.dataset.active = String(on);
      TTS_DOT.setAttribute('aria-pressed', String(on));
      TTS_DOT.setAttribute('title', on ? 'Click-to-Speech: ATIVO (toque para silenciar)' : 'Click-to-Speech: OFF (toque para ativar)');
    });

    window.addEventListener('dual:theme-change', e => {
      const t = e.detail.theme;
      if (!THEME_DOT) return;
      THEME_DOT.innerHTML = ICONS[t] || ICONS.night;
      THEME_DOT.setAttribute('title', `Tema: ${THEME_LABELS[t] || t} (toque para alternar)`);
    });

    /* Eventos de clique nos 4 botões */
    ARCH_DOT?.addEventListener('click', e => { e.stopPropagation(); window.DualArch.next(); });
    ARCH_BADGE?.addEventListener('click', e => { e.stopPropagation(); window.DualArch.next(); });
    SFX_DOT?.addEventListener('click', e => { e.stopPropagation(); window.DualSFX.toggle(); });
    TTS_DOT?.addEventListener('click', e => { e.stopPropagation(); window.DualTTS.toggle(); });
    THEME_DOT?.addEventListener('click', e => { e.stopPropagation(); window.DualTheme.toggle(); });

    /* Colapso do #main-content ao tocar no Header */
    if (HEADER && MAIN) {
      HEADER.addEventListener('click', e => {
        if (e.target.closest('.top-actions, .arch-pill-tag, #theme-dot, #tts-dot, #sfx-dot, #arch-dot')) return;
        MAIN.classList.toggle('hidden');
        const collapsed = MAIN.classList.contains('hidden');
        HEADER.classList.toggle('is-collapsed', collapsed);
        window.DualSFX.sfx('swoosh');
        window.dispatchEvent(new CustomEvent('dual:content-collapse', { detail: { collapsed } }));
      });
    }

    /* Smart Header (Scroll Down → Esconde | Scroll Up → Mostra) */
    let lastScrollY = window.scrollY;
    let ticking = false;
    window.addEventListener('scroll', () => {
      if (!ticking && HEADER) {
        window.requestAnimationFrame(() => {
          const cur = window.scrollY;
          if (cur <= 10 || cur < lastScrollY - 8) {
            HEADER.classList.remove('header-hidden');
            HEADER.classList.add('header-visible');
          } else if (cur > lastScrollY + 8) {
            HEADER.classList.remove('header-visible');
            HEADER.classList.add('header-hidden');
          }
          lastScrollY = cur;
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: true });

    /* ── BOOT INICIAL DO ESTADO SALVO ── */
    const savedTheme    = localStorage.getItem('di_themeMode') || localStorage.getItem('dual-theme') || 'night';
    const savedUserArch = localStorage.getItem('di_userArch') || 'KOBLLUX';
    const savedArch     = localStorage.getItem('di_activeArch') || 'KOBLLUX';
    const savedTTS      = localStorage.getItem('di_ttsEnabled') !== 'false';
    const savedSFX      = localStorage.getItem('di_sfxEnabled') !== 'false';

    window.DualUserArch.set(savedUserArch); // Fixa identidade do usuário no <html>
    window.DualArch.set(savedArch, true);   // Aplica arquétipo dinâmico no <body> (silent=true no boot)
    window.DualTheme.set(savedTheme);
    window.DualTTS.set(savedTTS);
    window.DualSFX.set(savedSFX);

    console.log('%c[DUAL GLOBAL · FUSION OS]%c ✓ HTML(User/TTS/SFX) · BODY(17 Arquétipos) prontos',
      'background:#22d3ee;color:#000;font-weight:800;padding:2px 8px;border-radius:4px', 'color:#22d3ee');
  })();
  </script>

  <!-- SCRIPTS DO KXTSK-SHELL / STACKWRAP -->
  <script src="https://kodux78k.github.io/a-Infodose/js/modules/iFSw-base.js"></script>
