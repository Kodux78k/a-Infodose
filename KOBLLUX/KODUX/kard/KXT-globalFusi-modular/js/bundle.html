<script data-kxt-js="card-fix">(() => {
    if (window.__DI_FUSION_FIX__) return;
    window.__DI_FUSION_FIX__ = true;
    
    /* ══════════════════════════════════════════════════
       FUSION CARD FIX — Atualização de Interface & Orb
       ══════════════════════════════════════════════════ */
    
    let _lastOrbName = null;
    
    window.updateInterface = function updateInterfaceFixed(name) {
      const safe = (name || '').trim() || 'Convidado';
      
      // Atualiza textos
      const lblName = document.getElementById('lblName');
      if (lblName) lblName.innerText = safe;
      
      const input = document.getElementById('inputUserCard');
      if (input && document.activeElement !== input) input.value = safe;
      const cockpitInput = document.getElementById('inputUserId');
      if (cockpitInput && document.activeElement !== cockpitInput) cockpitInput.value = safe;
      const usernameDisplay = document.getElementById('usernameDisplay');
      if (usernameDisplay) usernameDisplay.textContent = safe;
      
      const actName = document.getElementById('actName');
      if (actName) actName.innerText = safe;
      
      // Avatar principal (só recria se o nome mudou para preservar animação)
      const avatarTgt = document.getElementById('avatarTarget');
      if (avatarTgt && typeof window.makeOrbAvatar === 'function') {
        if (_lastOrbName !== safe) {
          avatarTgt.innerHTML = window.makeOrbAvatar(safe, 64);
          avatarTgt.classList.add('shown');
          _lastOrbName = safe;
        }
      }
      
      // Mini avatares
      const smallMini = document.getElementById('smallMiniAvatar');
      if (smallMini && typeof window.makeOrbAvatar === 'function') {
        if (smallMini.dataset.orbName !== safe) {
          smallMini.innerHTML = window.makeOrbAvatar(safe, 24);
          smallMini.dataset.orbName = safe;
        }
      }
      
      const actMini = document.getElementById('actMiniAvatar');
      if (actMini && typeof window.makeOrbAvatar === 'function') {
        if (actMini.dataset.orbName !== safe) {
          actMini.innerHTML = window.makeOrbAvatar(safe, 36);
          actMini.dataset.orbName = safe;
        }
      }
      
      // Badge / identificador da chave ativa
      const keys = (window.STATE && window.STATE.keys) || [];
      const active = keys.find(k => k.active);
      const smallIdent = document.getElementById('smallIdent');
      if (smallIdent) smallIdent.innerText = active ? active.name : '--';
      const actBadge = document.getElementById('actBadge');
      if (actBadge) actBadge.innerText = active ? `key:${active.name}` : 'v:--';
      
      // Texto do preview
      const smallText = document.getElementById('smallText');
      if (smallText) {
        smallText.innerText = active ?
          `${active.name} [ATIVO]` :
          (safe === 'Convidado' ? 'Aguardando...' : `${safe} · canal ASCII ativo`);
      }
      
      // Bloco ASCII de ativação
      const actPre = document.getElementById('actPre');
      if (actPre) {
        const line = `+${'-'.repeat(safe.length + 4)}+`;
        const hash = (s) => {
          let h = 0xdeadbeef;
          for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 2654435761);
          return ((h ^ (h >>> 16)) >>> 0).toString(16);
        };
        actPre.innerText = `${line}\n| ${safe.toUpperCase()} |\n${line}\nID: ${hash(safe)}`;
      }
      
      // Sincronização externa (di_overrideSync)
      if (typeof window.di_overrideSync === 'function') {
        try { window.di_overrideSync(safe); } catch (_) {}
      }
    };
    
    /* ══════════════════════════════════════════════════
       Reforço: re-renderiza o orb ao voltar para o CARD
       ══════════════════════════════════════════════════ */
    const mainCard = document.getElementById('mainCard');
    if (mainCard) {
      let wasOrb = mainCard.classList.contains('orb');
      let wasHud = mainCard.classList.contains('hud');
      
      const classMo = new MutationObserver(() => {
        const isOrb = mainCard.classList.contains('orb');
        const isHud = mainCard.classList.contains('hud');
        
        // Saiu de ORB/HUD e voltou para o CARD principal
        if ((wasOrb || wasHud) && !isOrb && !isHud) {
          const name =
            localStorage.getItem('di_userName') ||
            document.getElementById('inputUserCard')?.value?.trim() ||
            document.getElementById('inputUserId')?.value?.trim() ||
            'Convidado';
          _lastOrbName = null; // Força recriação limpa do orb
          window.updateInterface(name);
        }
        
        wasOrb = isOrb;
        wasHud = isHud;
      });
      classMo.observe(mainCard, { attributes: true, attributeFilter: ['class'] });
    }
    
    /* ══════════════════════════════════════════════════
       Inicialização
       ══════════════════════════════════════════════════ */
    const initName = () => {
      const name =
        localStorage.getItem('di_userName') ||
        document.getElementById('inputUserCard')?.value?.trim() ||
        document.getElementById('inputUserId')?.value?.trim() ||
        'Convidado';
      _lastOrbName = null;
      window.updateInterface(name);
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initName);
    } else {
      initName();
    }
    
    console.log('[DI_FUSION_FIX] Patch limpo aplicado com sucesso.');
  })();</script>
<script data-kxt-js="bg-thumbs">(function(){
  if (window.diBgOverrideInitialized) return;
  window.diBgOverrideInitialized = true;

  // ===== Helpers de storage
  window.di_getBgImages = function(){
    try {
      const raw = localStorage.getItem('di_bgImages');
      if (!raw) return [];
      return JSON.parse(raw);
    } catch(e){ console.warn('di_getBgImages parse error', e); return []; }
  };

  window.di_saveBgImages = function(list){
    try {
      localStorage.setItem('di_bgImages', JSON.stringify(list || []));
      return true;
    } catch(e){
      console.warn('di_saveBgImages (quota?)', e);
      try { window.App && App.showToast('Armazenamento cheio: remova backgrounds antigos.', true); } catch(_){}
      return false;
    }
  };

  // comprime (máx 1280px, JPEG) pra caber no localStorage
  window.di_fileToDataUrl = function(file){
    return new Promise((resolve) => {
      const fr = new FileReader();
      fr.onerror = () => resolve(null);
      fr.onload = () => {
        const src = fr.result;
        const img = new Image();
        img.onerror = () => resolve(src);
        img.onload = () => {
          try {
            const max = 1280, r = Math.min(1, max / Math.max(img.width, img.height));
            const c = document.createElement('canvas');
            c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            resolve(c.toDataURL('image/jpeg', 0.82));
          } catch (e) { resolve(src); }
        };
        img.src = src;
      };
      fr.readAsDataURL(file);
    });
  };

  // Migração simples: di_bgImage (single) -> di_bgImages (array)
  (function migrateSingleBg(){
    try {
      const single = localStorage.getItem('di_bgImage');
      const arr = di_getBgImages();
      if (single && (!arr || arr.length === 0)) {
        const id = 'bg_' + Date.now();
        di_saveBgImages([ { id, name: 'migrated-bg', data: single, active: true } ]);
      }
    } catch(e){}
  })();

  // ===== Aplicar background visual
  window.di_applyBackground = function(dataUrl){
    const el = document.getElementById('bg-fake-custom');
    if (!el) return;
    el.style.backgroundImage = dataUrl ? `url("${dataUrl}")` : '';
    // transição sutil
    el.style.transition = 'opacity 450ms ease, background-image 300ms ease';
    el.style.opacity = dataUrl ? '0.12' : '0';
    el.style.filter = 'saturate(0.9) contrast(1.05)';
    // atualiza texto de status se existir
    const s = document.getElementById('bgStatusText');
    if (s) s.textContent = dataUrl ? 'Ativo' : 'Nenhum';
  };

  // ===== Ativar por id
  window.di_setActiveBg = function(id){
    const list = di_getBgImages();
    const next = list.map(b => ({ ...b, active: b.id === id }));
    di_saveBgImages(next);
    const active = next.find(b => b.active);
    if (active) di_applyBackground(active.data);
    di_renderBgPanel();
  };

  // ===== Remover
  window.di_removeBg = function(id){
    let list = di_getBgImages().filter(b => b.id !== id);
    // se remover o ativo, ativa o primeiro restante
    if (!list.some(b => b.active) && list[0]) {
      list[0].active = true;
      di_applyBackground(list[0].data);
    }
    // se vazio, limpa bg
    if (list.length === 0) di_applyBackground(null);
    di_saveBgImages(list);
    di_renderBgPanel();
  };

  // ===== Render thumbnails (melhorado)
  window.di_renderBgPanel = function(){
    const panel = document.getElementById('bgThumbPanel');
    if (!panel) return;
    const list = di_getBgImages();
    panel.innerHTML = '';

    if (list.length === 0) {
      panel.innerHTML = '<div style="grid-column:1/-1;color:var(--text-muted);text-align:center;font-size:0.85rem">Nenhum background salvo. Faça upload.</div>';
      return;
    }

    list.forEach(bg => {
      const wrapper = document.createElement('div');
      wrapper.className = 'di-bg-thumb';
      wrapper.style.position = 'relative';
      wrapper.style.height = '70px';
      wrapper.style.borderRadius = '8px';
      wrapper.style.cursor = 'pointer';
      wrapper.style.backgroundImage = `url("${bg.data}")`;
      wrapper.style.backgroundSize = 'cover';
      wrapper.style.backgroundPosition = 'center';
      wrapper.style.overflow = 'hidden';
      wrapper.style.border = bg.active ? '2px solid var(--primary)' : '1px solid rgba(255,255,255,0.12)';
      wrapper.title = bg.name || bg.id || 'background';

      // overlay dim (sutil)
      const overlay = document.createElement('div');
      overlay.style.position = 'absolute';
      overlay.style.inset = '0';
      overlay.style.background = 'linear-gradient(to top, rgba(0,0,0,0.25), rgba(0,0,0,0))';
      wrapper.appendChild(overlay);

      // botões container
      const btns = document.createElement('div');
      btns.style.position = 'absolute';
      btns.style.right = '6px';
      btns.style.top = '6px';
      btns.style.display = 'flex';
      btns.style.gap = '6px';
      wrapper.appendChild(btns);

      // remover
      const btnRemove = document.createElement('button');
      btnRemove.className = 'di-bg-remove';
      btnRemove.innerText = '✕';
      btnRemove.title = 'Remover';
      btnRemove.style.background = 'rgba(0,0,0,0.6)';
      btnRemove.style.border = 'none';
      btnRemove.style.color = '#fff';
      btnRemove.style.fontSize = '11px';
      btnRemove.style.borderRadius = '6px';
      btnRemove.style.padding = '4px 6px';
      btns.appendChild(btnRemove);

      // aplicar (ícone)
      const btnApply = document.createElement('button');
      btnApply.innerText = '▶';
      btnApply.title = 'Aplicar';
      btnApply.style.background = 'rgba(0,0,0,0.45)';
      btnApply.style.border = 'none';
      btnApply.style.color = '#fff';
      btnApply.style.fontSize = '11px';
      btnApply.style.borderRadius = '6px';
      btnApply.style.padding = '4px 6px';
      btns.appendChild(btnApply);

      // clique no card aplica
      wrapper.addEventListener('click', (e) => {
        // evita conflito se clicar em botão
        if (e.target === btnRemove) return;
        di_setActiveBg(bg.id);
      });

      btnApply.addEventListener('click', (e) => {
        e.stopPropagation();
        di_setActiveBg(bg.id);
      });

      btnRemove.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!confirm('Remover background?')) return;
        di_removeBg(bg.id);
      });

      panel.appendChild(wrapper);
    });
  };

  // ===== Upload handler seguro (evita múltiplos binds)
  function bindUploadInput(){
    const inp = document.getElementById('bgUploadInput');
    if (!inp) return;
    if (inp._diBound) return;
    inp._diBound = true;

    inp.addEventListener('change', async e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const data = await di_fileToDataUrl(file);
      if (!data) return;
      let list = di_getBgImages().map(b => ({ ...b, active: false }));
      list.unshift({ id: 'bg_' + Date.now(), name: file.name || 'bg', data, active: true });
      if (list.length > 8) list = list.slice(0, 8);          // limite de 8 thumbs
      if (di_saveBgImages(list)) { di_applyBackground(data); di_renderBgPanel(); }
      try { inp.value = ''; } catch(_){}
    });
  }

  // ===== Inicialização segura
  function initOnce(){
    // injeta estilos locais mínimos (se ainda não tiver)
    if (!document.getElementById('di-bg-thumb-styles')) {
      const s = document.createElement('style');
      s.id = 'di-bg-thumb-styles';
      s.innerHTML = `
        #bgThumbPanel .di-bg-thumb{ box-shadow: 0 6px 18px rgba(0,0,0,0.35); transition: transform .15s ease, box-shadow .15s ease; }
        #bgThumbPanel .di-bg-thumb:hover{ transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.45); }
      `;
      document.head.appendChild(s);
    }

    // apply active bg if exists
    const list = di_getBgImages();
    const active = list.find(b => b.active);
    if (active) di_applyBackground(active.data);

    // render panel and bind upload input
    di_renderBgPanel();
    bindUploadInput();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initOnce);
  } else {
    setTimeout(initOnce, 0);
  }

  // expõe init pra debug
  window.di_initBackgrounds = initOnce;

})();</script>
<script data-kxt-js="bridge">(() => {
  if (window.__KXT_FINAL_BRIDGE__) return;
  window.__KXT_FINAL_BRIDGE__ = true;

  const LS = localStorage;
  const $ = (id) => document.getElementById(id);
  const DEFAULT_MODEL = 'arcee-ai/trinity-mini:free';
  const log = (...a) => console.log('[KXT]', ...a);

  // `let STATE` do card não vira window.STATE — expõe pra quem precisar
  try { Object.defineProperty(window, 'STATE', { get: () => STATE, configurable: true }); } catch (e) {}

  /* ───────────────────────── Drawers (menu único: Cockpit) ───────────────────────── */
  const syncDrawerFlag = () => document.body.classList.toggle('has-drawer', !!document.querySelector('.drawer.open'));
  const _toggle = window.toggleDrawer;
  window.toggleDrawer = function (id) {
    if (typeof _toggle === 'function') _toggle(id); else $(id).classList.toggle('open');
    syncDrawerFlag();
  };
  document.querySelectorAll('.drawer').forEach((d) => {
    d.addEventListener('click', (e) => { if (e.target === d) { d.classList.remove('open'); syncDrawerFlag(); } }); // toque no fundo fecha
    new MutationObserver(syncDrawerFlag).observe(d, { attributes: true, attributeFilter: ['class'] });
  });

  const SECS = ['solar', 'neural', 'usage', 'id', 'bg', 'sys'];
  const secEl = (s) => document.querySelector(`#drawerProfile section.cockpit-sec[data-sec="${s}"]`);
  function markNav(sec) {
    document.querySelectorAll('#cockpitNav button').forEach((b) => b.classList.toggle('active', b.dataset.sec === sec));
  }
  function scrollToSection(sec) {
    const el = secEl(sec), body = $('cockpitBody');
    if (!el || !body) return;
    const top = el.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop - 4;
    body.scrollTo({ top, behavior: 'smooth' });
    markNav(sec);
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }
  window.openCockpit = function (sec) {
    const d = $('drawerProfile'); if (!d) return;
    d.classList.add('open'); syncDrawerFlag();
    if (sec) setTimeout(() => scrollToSection(sec), 200);
  };
  window.scrollCockpit = scrollToSection;

  document.querySelectorAll('#cockpitNav button').forEach((b) => b.addEventListener('click', () => scrollToSection(b.dataset.sec)));
  $('cockpitBody')?.addEventListener('scroll', () => {
    const body = $('cockpitBody'), bt = body.getBoundingClientRect().top;
    let cur = SECS[0];
    SECS.forEach((s) => { const el = secEl(s); if (el && el.getBoundingClientRect().top - bt <= 40) cur = s; });
    markNav(cur);
  }, { passive: true });

  /* ───────────────────────── Persistência (fonte única = localStorage) ───────────────────────── */
  const saveRole = (v) => { LS.setItem('di_trainingText', v); LS.setItem('di_systemRole', v); };
  const loadRole = () => { const a = LS.getItem('di_trainingText'); return a !== null ? a : LS.getItem('di_systemRole'); };

  function ensureOption(sel, m) {
    if (!sel || !m) return;
    if (![...sel.options].some((o) => o.value === m)) {
      const o = document.createElement('option'); o.value = m; o.textContent = m;
      sel.insertBefore(o, sel.firstChild);
    }
  }

  function setModel(id, opts) {
    if (!id) return;
    LS.setItem('di_modelName', id);
    const inp = $('inputModel'); if (inp && inp.value !== id) inp.value = id;
    const sel = $('modelSelect'); if (sel) { ensureOption(sel, id); sel.value = id; }
    try { modelName = id; } catch (e) {}
    document.querySelectorAll('.model-item').forEach((el) => el.classList.toggle('active', el.dataset.id === id));
    log('[MODEL]', id);
    if (!(opts && opts.silent) && typeof window.showToaster === 'function') window.showToaster('Modelo: ' + id, 'success');
  }

  function syncAll() {
    const key = LS.getItem('di_apiKey') || '';
    ['apiKeyInput', 'apiKeyInputNeural'].forEach((id) => { const e = $(id); if (e && document.activeElement !== e && e.value !== key) e.value = key; });

    const model = LS.getItem('di_modelName') || DEFAULT_MODEL;
    const sel = $('modelSelect'), inp = $('inputModel');
    ensureOption(sel, model);
    if (sel && document.activeElement !== sel) sel.value = model;
    if (inp && document.activeElement !== inp) inp.value = model;

    const inf = LS.getItem('di_infodoseName') || 'KOBLLUX';
    ['infodoseNameInput', 'cockpitInfodoseName'].forEach((id) => { const e = $(id); if (e && document.activeElement !== e && e.value !== inf) e.value = inf; });

    const role = loadRole();
    if (role !== null) ['systemRoleInput', 'systemRoleInputNeural'].forEach((id) => { const e = $(id); if (e && document.activeElement !== e && e.value !== role) e.value = role; });

    const seal = $('kxtSealToggle'), kod = $('kxtKoduxToggle');
    if (seal) seal.checked = LS.getItem('di_kobSeal') !== '0';
    if (kod) kod.checked = LS.getItem('di_kodux') !== '0';
  }

  window.di_saveNeural = function () {
    const key = (($('apiKeyInput') && $('apiKeyInput').value) || ($('apiKeyInputNeural') && $('apiKeyInputNeural').value) || '').trim();
    if (typeof window.di_setApiKey === 'function') window.di_setApiKey(key); else LS.setItem('di_apiKey', key);
    const roleEl = $('systemRoleInput'); if (roleEl) saveRole(roleEl.value);
    const inf = (($('cockpitInfodoseName') && $('cockpitInfodoseName').value) || ($('infodoseNameInput') && $('infodoseNameInput').value) || 'KOBLLUX').trim() || 'KOBLLUX';
    LS.setItem('di_infodoseName', inf); try { infodoseName = inf; } catch (e) {}
    const m = ($('inputModel') && $('inputModel').value || '').trim(); if (m) setModel(m, { silent: true });
    syncAll();
    log('[CONFIG] salvo', { hasKey: !!LS.getItem('di_apiKey'), model: LS.getItem('di_modelName'), infodose: inf, roleChars: (LS.getItem('di_trainingText') || '').length });
  };

  /* ───────────────────────── Espelhos card ⇄ cockpit ───────────────────────── */
  function mirror(aId, bId, onChange) {
    const a = $(aId), b = $(bId); if (!a || !b) return;
    a.addEventListener('input', () => { if (b.value !== a.value) b.value = a.value; });
    b.addEventListener('input', () => { if (a.value !== b.value) a.value = b.value; });
    if (onChange) [a, b].forEach((el) => { el.addEventListener('change', () => onChange(el.value)); el.addEventListener('blur', () => onChange(el.value)); });
  }
  mirror('apiKeyInput', 'apiKeyInputNeural');                       // SK (persistência: di_setApiKey do card no change/blur)
  mirror('systemRoleInput', 'systemRoleInputNeural', saveRole);     // system role
  mirror('infodoseNameInput', 'cockpitInfodoseName', (v) => { LS.setItem('di_infodoseName', v.trim() || 'KOBLLUX'); try { infodoseName = v.trim() || 'KOBLLUX'; } catch (e) {} });

  $('btnToggleKey')?.addEventListener('click', () => {
    const show = $('apiKeyInput').type === 'password';
    ['apiKeyInput', 'apiKeyInputNeural'].forEach((id) => { const e = $(id); if (e) e.type = show ? 'text' : 'password'; });
  });
  $('saveSystemBtn')?.addEventListener('click', () => { const r = $('systemRoleInputNeural'); if (r) saveRole(r.value); setTimeout(syncAll, 40); });
  $('addKeyBtn')?.addEventListener('click', () => setTimeout(syncAll, 40));
  $('vaultUnlockBtn')?.addEventListener('click', () => setTimeout(syncAll, 400));
  ['setActiveKey', 'removeKey'].forEach((fn) => {
    const orig = window[fn];
    if (typeof orig === 'function' && !orig.__kxt) {
      window[fn] = function () { const r = orig.apply(this, arguments); setTimeout(syncAll, 40); return r; };
      window[fn].__kxt = true;
    }
  });

  $('modelSelect')?.addEventListener('change', (e) => setModel(e.target.value));
  $('inputModel')?.addEventListener('change', (e) => setModel(e.target.value.trim()));

  $('kxtSealToggle')?.addEventListener('change', (e) => LS.setItem('di_kobSeal', e.target.checked ? '1' : '0'));
  $('kxtKoduxToggle')?.addEventListener('change', (e) => LS.setItem('di_kodux', e.target.checked ? '1' : '0'));
  $('cssUploadInput')?.addEventListener('change', async (e) => { const f = e.target.files[0]; if (f) $('customCssInput').value = await f.text(); });

  /* ───────────────────────── Busca de modelos OpenRouter (card + cockpit) ───────────────────────── */
  const OR = { list: null, loading: null };
  const CACHE_KEY = 'di_orModelsCache', TTL = 6 * 3600e3;
  const UIS = [
    { q: 'modelSearchCard', free: 'modelFreeOnlyCard', res: 'modelResultsCard', st: 'modelSearchStatusCard' },
    { q: 'modelSearchCockpit', free: 'modelFreeOnlyCockpit', res: 'modelResultsCockpit', st: 'modelSearchStatusCockpit' }
  ];
  const setStatus = (t) => UIS.forEach((u) => { const e = $(u.st); if (e) e.textContent = t; });

  const norm = (m) => {
    const p = m.pricing || {}; const pp = Number(p.prompt), pc = Number(p.completion);
    const free = /:free$/i.test(m.id) || (pp === 0 && pc === 0);
    return { id: m.id, name: m.name || m.id, ctx: m.context_length || 0, free, price: free ? 0 : (pp || 0) * 1e6, priceOut: free ? 0 : (pc || 0) * 1e6 };
  };

  async function loadCatalog(force) {
    if (OR.list && !force) return OR.list;
    if (!force) {
      try { const c = JSON.parse(LS.getItem(CACHE_KEY) || 'null'); if (c && c.v === 2 && Date.now() - c.ts < TTL && c.list && c.list.length) { OR.list = c.list; return OR.list; } } catch (e) {}
    }
    if (OR.loading) return OR.loading;
    setStatus('Consultando catálogo do OpenRouter…');
    OR.loading = (async () => {
      try {
        const r = await fetch('https://openrouter.ai/api/v1/models', { headers: { Accept: 'application/json' } });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        const list = (j.data || []).map(norm).sort((a, b) => a.name.localeCompare(b.name));
        OR.list = list;
        try { LS.setItem(CACHE_KEY, JSON.stringify({ v: 2, ts: Date.now(), list })); } catch (e) {}
        return list;
      } catch (e) {
        setStatus('Não foi possível carregar agora: ' + e.message);

<script data-kxt-js="usage">/* ═══════════ KXT USAGE · log didático de uso (tokens, modelo, custo, tempo) ═══════════ */

  const save = (l) => { try { LS.setItem(KEY, JSON.stringify(l.slice(-MAX))); } catch (e) { console.warn('[USAGE] sem espaço', e); } };
  const fmtN = (n) => Number(n || 0).toLocaleString('pt-BR');
  const fmtCost = (c, unknown) => {
    if (c === 0) return 'Grátis';
    if (c == null) return unknown ? '—' : 'Grátis';
    if (c < 0.0001) return '< US$ 0,0001';
    return 'US$ ' + c.toFixed(c < 0.01 ? 4 : 3).replace('.', ',');

  const fmtMs = (ms) => !ms ? '—' : ms < 1000 ? ms + ' ms' : (ms / 1000).toFixed(1).replace('.', ',') + ' s';
  const fmtTime = (t) => { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const catalog = () => { try { const c = JSON.parse(LS.getItem('di_orModelsCache') || 'null'); return (c && c.list) || []; } catch (e) { return []; } };
  const meta = (id) => catalog().find((m) => m.id === id) || null;
  const pretty = (s) => s.replace(/[-_]+/g, ' ').replace(/\b([a-z])/g, (c) => c.toUpperCase());
  const shortName = (id) => { const m = meta(id); const n = m ? m.name : pretty(String(id || '?').split('/').pop().replace(/:free$/i, '')); return n.replace(/\s*\(free\)\s*$/i, ''); };

  function record(e) {

    const costTxt = oks.length && known.length === 0 ? '—' : fmtCost(cost, false);

      <div class="u-card accent"><div class="u-ico">🔤</div><div class="u-val">${fmtN(tin + tout)}</div><div class="u-lbl">Tokens</div><div class="u-sub">↑ ${fmtN(tin)} enviados · ↓ ${fmtN(tout)} recebidos${anyEst ? ' (estimado)' : ''}</div></div>
      <div class="u-card"><div class="u-ico">💸</div><div class="u-val">${esc(costTxt)}</div><div class="u-lbl">Custo</div><div class="u-sub">${esc(costSub)}</div></div>
      <div class="u-card"><div class="u-ico">🤖</div><div class="u-val" title="${esc(fav || '')}">${esc(fav ? shortName(fav) : '—')}</div><div class="u-lbl">Modelo mais usado</div><div class="u-sub">${fav ? counts[fav] + '× nesse período' : ''}</div></div>
    </div>`;
    // medidor de contexto da última chamada
    const last = [...all].reverse().find((x) => x.ok);
    let meter = '';
    if (last) {
      const used = last.pt, ctx = last.ctx || 0, pct = ctx ? Math.min(100, used / ctx * 100) : 0;
      meter = `<div class="u-meter"><div class="u-mt"><span>📚 Memória da conversa</span><b>${fmtN(used)} tokens${ctx ? ' de ' + fmtN(ctx) : ''}</b></div><div class="u-track"><i class="u-in" style="width:${ctx ? Math.max(pct, 1.5) : 0}%"></i></div><div class="u-sub" style="font-size:.62rem;color:var(--ck-dim);margin-top:6px">${ctx ? pct.toFixed(1).replace('.', ',') + '% do limite do modelo. Quando enche, a IA esquece o começo.' : 'Busque o modelo no catálogo (Neural) para ver o limite dele.'}</div></div>`;
    }

      return `<div class="u-row ${x.ok ? '' : 'err'}">

    box.innerHTML = chips + cards + meter + `<div class="u-h">Últimas respostas</div><div class="u-list">${rows}</div>` +
      `<div class="u-sub" style="font-size:.6rem;color:var(--ck-dim);text-align:center">↑ roxo/ciano = enviado · ↓ = recebido · "~" = estimado (a API não informou)</div>` + help + actions();
    bind(box);
  }

  function actions() { return `<div class="u-actions"><button type="button" class="btn-block" id="usageExport">Exportar log</button><button type="button" class="btn-block" id="usageClear">Limpar</button></div>`; }

  function bind(box) {
    box.querySelectorAll('.u-chip').forEach((b) => b.addEventListener('click', () => { LS.setItem(RKEY, b.dataset.r); render(); }));
    const ex = $('usageExport'), cl = $('usageClear');

      else { const u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); }

<script data-kxt-js="tts">/* ═══════════ KXT TTS · liga/desliga GERAL da voz (botão do topo) ═══════════ */
(() => {
  if (window.KXT_TTS) return;
  const LS = localStorage, KEY = 'di_ttsOn';
  const T = { on: LS.getItem(KEY) !== '0' };
  const ss = window.speechSynthesis;

  // porteiro: bloqueia QUALQUER fala (App, card, patches) quando o som está desligado.
  // precisa ser o wrapper mais externo (carregado depois da ponte, que marca os orbs).
  if (ss && !ss.__kxtGate) {
    const orig = ss.speak.bind(ss);
    ss.speak = function (u) { if (!T.on && !(u && u.__force)) return; return orig(u); };
    ss.__kxtGate = true;
  }

  const btn = () => document.getElementById('solarH2TTS');
  function paint() {
    document.body.classList.toggle('tts-off', !T.on);
    const b = btn(); if (!b) return;
    b.textContent = T.on ? '🔊' : '🔇';
    b.classList.toggle('tts-off', !T.on);
    b.setAttribute('aria-pressed', String(T.on));
    b.title = T.on ? 'Som ligado — toque para silenciar · segure para ouvir a última resposta' : 'Som desligado — toque para ligar';
  }
  function toast(msg) { try { if (typeof window.showToaster === 'function') window.showToaster(msg, 'success'); } catch (e) {} }

  function set(on, opts) {
    T.on = !!on; LS.setItem(KEY, on ? '1' : '0');
    if (!on) { try { ss && ss.cancel(); } catch (e) {} document.querySelectorAll('.dual-orb-wrap').forEach((el) => el.classList.remove('speaking')); }
    paint();
    if (!(opts && opts.silent)) {
      toast(on ? '🔊 Som ligado' : '🔇 Som desligado');
      if (on && ss) { try { const u = new SpeechSynthesisUtterance('Som ligado'); u.lang = 'pt-BR'; u.__force = true; ss.speak(u); } catch (e) {} }
    }
  }

  function readLast() {
    if (!T.on) { toast('🔇 Ligue o som para ouvir'); return; }
    const msgs = (window.App && App.state && App.state.messages) || [];
    let last = null; for (let i = msgs.length - 1; i >= 0; i--) if (msgs[i].role === 'assistant') { last = msgs[i]; break; }
    if (!last) { toast('Nenhuma resposta da IA ainda'); return; }
    const text = String(last.content).replace(/<[^>]*>/g, '').trim(); if (!text || !ss) return;

  }

    if (!b || b.__kxtTts) return; b.__kxtTts = true;
    let timer = null, long = false;
    b.addEventListener('pointerdown', () => { long = false; clearTimeout(timer); timer = setTimeout(() => { long = true; readLast(); }, 600); }, { passive: true });

    paint();
  }

  window.KXT_TTS = { get on() { return T.on; }, set, toggle: () => set(!T.on), bindButton, paint, readLast };
  if (window.KXT_ready) KXT_ready(paint);
})();</script>
<script data-kxt-js="text-beauty">(()=>{'use strict';
if(window.__TEXT_BEAUTY_V3__) return; window.__TEXT_BEAUTY_V3__=true;

/* Utilitários */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=(s)=>s.replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));

/* 0) Toggle edição rápida */
let EDIT_ON=false;
const toggleEdit=()=>{
  EDIT_ON=!EDIT_ON;
  document.body.toggleAttribute('data-edit', EDIT_ON);
  const host = document.getElementById('CONTENT') || document.querySelector('main, article, .render, .reader, body');
  if(host) host.contentEditable = EDIT_ON ? 'plaintext-only' : 'false';
};
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='e'){ e.preventDefault(); toggleEdit(); }
});

/* 1) Key:Value negrito (palavra:) + parênteses + chips [ ]
   - roda apenas em blocos de texto (p, li) e não mexe dentro de code/pre */
const processInline = (root=document)=>{
  const targets = $$('p, li, h1, h2, h3, h4, h5, h6', root).filter(n=>!n.closest('pre, code, .no-beauty'));
  const rxKV = /(^|\s)([A-Za-zÀ-ÿ0-9_]+):(?=\s|$)/g; // Palavra:
  const rxParen = /\(([^\n)]+)\)/g;                  // ( … )
  const rxChip  = /\[\[([^[\]]+)\]\]|\[([^[\]]+)\]/g; // [[a]] | [a]

  for(const el of targets){
    // evita processar múltiplas vezes
    if(el.dataset.inlineProcessed==='1') continue;
    el.dataset.inlineProcessed='1';

    const html = el.innerHTML;
    if(/<pre|<code|contenteditable/i.test(html)) continue;

    let out = html;

    // 1. Palavra:  → <strong>
    out = out.replace(rxKV, (m, sp, key)=> `${sp}<strong class="kv-key">${key}:</strong>`);

    // 2. ( ... )   → span-paren
    out = out.replace(rxParen, (m, inside)=> `<span class="span-paren">(${inside})</span>`);

    // 3. [ ... ] / [[ ... ]]  → chip/chip-btn
    out = out.replace(rxChip, (m, dbl, sgl)=>{
      const label = (dbl||sgl||'').trim();
      return `<span class="${dbl?'chip-btn':'chip'}" data-chip="${esc(label)}">${esc(label)}</span>`;
    });

    el.innerHTML = out;
  }
};

/* 2) Perguntas → .q-card (frases que terminam com '?') */
const processQuestions=(root=document)=>{
  const paras = $$('p', root).filter(n=>!n.closest('.q-card, pre, code, .no-beauty'));
  for(const p of paras){
    const txt = (p.innerText||'').trim();
    if(txt.endsWith('?') && !p.dataset.qProcessed){
      p.dataset.qProcessed='1';
      const wrap=document.createElement('div'); wrap.className='q-card';
      wrap.innerHTML = `<div class="q-ico">?</div><div class="q-body">${esc(txt)}</div>`;
      p.replaceWith(wrap);
    }
  }
};

/* 3) Flow text: melhora texto corrido, cria heading leve se linha for "Algo:" sozinha */
const beautifyFlow=(root=document)=>{
  const container = root.querySelector('.flow-text') || root; // se já tiver classe, usa; senão aplica heurística suave
  $$('p', container).forEach(p=>{
    const t=(p.innerText||'').trim();
    if(/^[^:\n]{3,}:\s*$/.test(t)){ // linha que termina com ":" vira heading leve
      p.classList.add('kv-head');
    }
    // Quebra parágrafos absurdamente longos em dois (heurística)
    if(t.length>600 && t.includes('. ')){
      const mark = t.indexOf('. ', Math.floor(t.length/2));
      if(mark>0){
        const a=t.slice(0, mark+1), b=t.slice(mark+1);

      }

const enableCopyLists=(root=document)=>{

    const badge = document.createElement('div');

/* 5) HTML/SVG pass-through

   - <div data-raw-html>…(escapado)…</div> → renderiza
*/
const renderRawHTML=(root=document)=>{
  // code fence transform
  $$('pre code', root).forEach(code=>{
    const cls = (code.className||'').toLowerCase();
    if(cls.includes('language-html-raw') || cls.includes('lang-html-raw')){
      const raw = code.textContent;
      const box = document.createElement('div');
      box.className='raw-html-card';
      box.innerHTML = `<div class="raw-note">HTML/SVG renderizado a partir de bloco <code>html-raw</code></div>`;
      const slot = document.createElement('div');
      slot.className='raw-slot';
      // injeta SEM esc, assumindo que o autor confia no conteúdo
      slot.innerHTML = raw;
      box.appendChild(slot);
      const pre = code.closest('pre');
      pre.replaceWith(box);
    }

  $$('div[data-raw-html]', root).forEach(div=>{

const wrapLists=(root=document)=>{

  }

const asciiScore = t=>{
  const box=/[─│┌┐└┘╭╮╰╯═╬╠╣╦╩]+/g, grid=/[-_=+*#\\/|]{3,}/g;
  const L=t.split('\n'); let h=0;
  for(const ln of L){ if(box.test(ln)||grid.test(ln)||ln.trim().startsWith('> ')) h++; }
  return h>=Math.max(2,Math.ceil(L.length*0.2));
};

const enhanceASCII=(root=document)=>{
  const cand=new Set([...q('pre',root),...q('code.language-text, code[class*="language-plaintext"]',root)]);
  q('p',root).forEach(p=>{ const x=p.innerText||''; if(x.includes('\n')&&asciiScore(x)) cand.add(p); });
  for(const el of cand){
    if(el.closest('.ascii-card,.no-beauty')) continue;
    const txt=(el.innerText||'').trim(); if(!asciiScore(txt)) continue;
    const fig=document.createElement('figure'); fig.className='ascii-card';
    const pre=document.createElement('pre'); pre.textContent=txt; fig.appendChild(pre);
    if(!el.closest('pre')){ const fc=document.createElement('figcaption'); fc.className='ascii-cap'; fc.textContent='ASCII • renderizado em bloco'; fig.appendChild(fc); }
    el.replaceWith(fig);
  }
};

const applyDashCapsuleByAttr=(root=document)=>{

};

};

            +   '<div class="control-row" style="margin-top:6px">'
            +     '<button class="btn-block" id="solarBackupExport" type="button">⬇ Exportar</button>'
            +     '<button class="btn-block" id="solarBackupImport" type="button">⬆ Importar</button>'
            +   '</div>'
            +   '<button class="btn-block" id="solarResetAll" type="button" style="width:100%;margin-top:8px;border-color:rgba(255,80,100,.4);color:#ff6b6b">⌦ Resetar tudo</button>'
            + '</div>'
            + '<div class="cockpit-item" style="margin-top:10px">'
            +   '<div class="cockpit-label">⚡ Preferências</div>'
            +   '<label style="font-size:.75rem;color:var(--text-muted);display:flex;justify-content:space-between;margin-top:6px">'
            +     '<span>Vidro (blur)</span><span id="solarGlassVal" style="font-family:var(--font-code);color:var(--primary)">20px</span>'
            +   '</label>'
            +   '<input id="solarGlass" type="range" min="0" max="32" step="1" value="20" style="width:100%;accent-color:var(--primary);margin-top:4px">'
            +   '<label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.8rem;cursor:pointer">'
            +     '<input type="checkbox" id="solarPerfLite" style="width:16px;height:16px;accent-color:var(--primary)">'
            +     '<span>Performance lite (sem blur/animação)</span>'
            +   '</label>'
            + '</div>';

        // distribui nas seções do cockpit único: Background Engine → Background · Backup/Preferências → Sistema
        var bgSec = document.getElementById('cockpitBg'), sysSec = document.getElementById('cockpitSystem');
        var kids = Array.prototype.slice.call(section.children);
        if (bgSec && sysSec && kids.length >= 3) { bgSec.appendChild(kids[0]); kids.slice(1).forEach(function (k) { sysSec.appendChild(k); }); }
        else body.appendChild(section);

        // ── Background opacity ──
        var bgOp = $('#solarBgOp'), bgOpVal = $('#solarBgOpVal'), bgLayer = $('#bg-fake-custom');
        var savedOp = localStorage.getItem('solar:bg:opacity') || '12';
        bgOp.value = savedOp; bgOpVal.textContent = savedOp + '%';
        if (bgLayer) bgLayer.style.opacity = (parseInt(savedOp, 10) / 100).toString();

        bgOp.addEventListener('input', function () {
            var v = bgOp.value;
            bgOpVal.textContent = v + '%';
            if (bgLayer) bgLayer.style.opacity = (parseInt(v, 10) / 100).toString();
            localStorage.setItem('solar:bg:opacity', v);
        });

        section.querySelectorAll('.solar-preset').forEach(function (b) {
            b.style.cssText = 'padding:6px 0;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:var(--text-main);cursor:pointer;font-family:var(--font-code);font-size:.7rem';
            b.addEventListener('click', function () { bgOp.value = b.dataset.op; bgOp.dispatchEvent(new Event('input')); });
        });

        // ── Blend ──
        var bgBlend = $('#solarBgBlend'), savedBlend = localStorage.getItem('solar:bg:blend') || 'lighten';
        bgBlend.value = savedBlend;
        if (bgLayer) bgLayer.style.mixBlendMode = savedBlend;
        bgBlend.addEventListener('change', function () {
            if (bgLayer) bgLayer.style.mixBlendMode = bgBlend.value;
            localStorage.setItem('solar:bg:blend', bgBlend.value);
        });

        // ── Chave SK compartilhada ──
        var cockpitKey = $('#cockpitApiKey');
        if (cockpitKey) {
          cockpitKey.value = localStorage.getItem('di_apiKey') || '';
          cockpitKey.addEventListener('change', function(){ window.di_setApiKey(cockpitKey.value); });
          cockpitKey.addEventListener('blur', function(){ window.di_setApiKey(cockpitKey.value); });
        }

        // busca de modelos OpenRouter: ver ponte final (card + cockpit)

        // ── Backup ──
        $('#solarBackupExport').addEventListener('click', function () {
            var data = {};
            for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                if (/^(di_|solar|fusion_os)/.test(k)) data[k] = localStorage.getItem(k);
            }
            var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'solar-backup-' + Date.now() + '.json';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
            showToast('⬇ Backup exportado');
        });

        $('#solarBackupImport').addEventListener('click', function () {
            var inp = document.createElement('input');
            inp.type = 'file'; inp.accept = '.json,application/json';
            inp.addEventListener('change', function () {
                var f = inp.files && inp.files[0]; if (!f) return;
                f.text().then(function (txt) {
                    try {
                        var d = JSON.parse(txt);
                        if (!d || typeof d !== 'object') throw 0;
                        if (!confirm('Importar backup? Substitui configs atuais.')) return;
                        Object.keys(d).forEach(function (k) { try { localStorage.setItem(k, d[k]); } catch (_) {} });
                        showToast('⬆ Importado — recarregando…');
                        setTimeout(function () { location.reload(); }, 700);
                    } catch (_) { showToast('❌ JSON inválido'); }
                });
            });
            inp.click();
        });

        $('#solarResetAll').addEventListener('click', function () {
            if (!confirm('Apagar TUDO e recarregar?')) return;
            ['di_apiKey','di_modelName','di_userName','di_trainingText','di_systemRole','di_bgImages','di_orModelsCache','di_kobSeal','di_kodux','di_usageLog','di_usageRange','di_ttsOn','di_blobOp','di_infodoseName','di_solarMode',
             'di_solarAuto','solar:bg:opacity','solar:bg:blend','solar:bg:mode','solar:glass','solar:perf-lite',
             'fusion_os_data_v2','fusion_os_ui_state','fusion_os_state_v2_3'].forEach(function (k) {
                try { localStorage.removeItem(k); } catch (_) {}
            });
            try { indexedDB.deleteDatabase('InfodoseDB'); } catch (_) {}
            showToast('⌦ Resetado — recarregando…');
            setTimeout(function () { location.reload(); }, 700);
        });

        // ── Glass blur ──
        var glass = $('#solarGlass'), glassVal = $('#solarGlassVal');
        var savedGlass = localStorage.getItem('solar:glass') || '20';
        glass.value = savedGlass; glassVal.textContent = savedGlass + 'px';
        function applyGlass(v) {
            document.querySelectorAll('.drawer-content, .fusion-card, .keys-card').forEach(function (el) {
                el.style.backdropFilter = 'blur(' + v + 'px) saturate(180%)';
                el.style.webkitBackdropFilter = 'blur(' + v + 'px) saturate(180%)';
            });
        }
        applyGlass(savedGlass);
        glass.addEventListener('input', function () {
            glassVal.textContent = glass.value + 'px';
            localStorage.setItem('solar:glass', glass.value);
            applyGlass(glass.value);
        });

        // ── Perf-lite ──
        var perfLite = $('#solarPerfLite');
        var isLite = localStorage.getItem('solar:perf-lite') === '1';
        perfLite.checked = isLite;
        togglePerfLite(isLite);
        perfLite.addEventListener('change', function () {
            togglePerfLite(perfLite.checked);
            localStorage.setItem('solar:perf-lite', perfLite.checked ? '1' : '0');
            showToast('⚡ Perf-lite: ' + (perfLite.checked ? 'ON' : 'OFF'));
        });

        function togglePerfLite(on) {
            document.documentElement.classList.toggle('solar-perf-lite', on);
            var st = document.getElementById('solar-perf-css');
            if (on) {
                if (!st) { st = document.createElement('style'); st.id = 'solar-perf-css'; document.head.appendChild(st); }
                st.textContent = '.solar-perf-lite *{animation-duration:0s!important;transition-duration:0s!important}'
                    + '.solar-perf-lite .blob,.solar-perf-lite .sun-background,.solar-perf-lite #particles-js{display:none!important}'
                    + '.solar-perf-lite .drawer-content,.solar-perf-lite .fusion-card{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}';
            } else if (st) st.remove();
        }

        return true;
    }

    // ═══════════════════════════════════════════════════════════════
    // 4. Utilitário: toast
    // ═══════════════════════════════════════════════════════════════
    function showToast(msg) {
        var t = document.getElementById('nv-toast');
        if (t) {
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(function () { t.classList.remove('show'); }, 2500);
            return;
        }
        if (typeof window.KBLX_TOAST === 'function') { try { window.KBLX_TOAST(msg); return; } catch (_) {} }
        console.log('[solar]', msg);
    }

    // ═══════════════════════════════════════════════════════════════
    // 5. Scroll hide/show do header 2
    // ═══════════════════════════════════════════════════════════════
    function installScrollHide() {
        var h2 = document.getElementById('solarHeader2');
        if (!h2) return;
        var lastY = window.scrollY, ticking = false;
        window.addEventListener('scroll', function () {
            if (ticking) return;
            requestAnimationFrame(function () {
                var y = window.scrollY;
                if (y <= 10) h2.classList.remove('hidden');
                else if (y > lastY + 8) h2.classList.add('hidden');
                else if (y < lastY - 8) h2.classList.remove('hidden');
                document.body.classList.toggle('h2-hidden', h2.classList.contains('hidden'));
                lastY = y; ticking = false;
            });
            ticking = true;
        }, { passive: true });
    }

    // ═══════════════════════════════════════════════════════════════
    // 6. BOOT com retry
    // ═══════════════════════════════════════════════════════════════
    var bootTries = 0;
    function boot() {
        bootTries++;
        var allOk = true;

        if (!document.getElementById('solarHeader2')) {
            buildHeader2();
            installScrollHide();
        }
        if (!expandCockpit()) allOk = false;

        try {
            var cur = (App && App.state && App.state.solarMode) || 'night';
            applyModeVisual(cur, true);
        } catch (_) {}

        if (bootTries === 1) watchActiveDoc();

        if (!allOk && bootTries < 30) setTimeout(boot, 300);
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(boot, 100); });
    else setTimeout(boot, 100);
    KXT_ready(function () { setTimeout(boot, 500); setTimeout(function () { window.__kxtUiReady = true; }, 2200); });

    // Re-monta o cockpit quando o drawer abre
    document.addEventListener('click', function (e) {
        if (e.target.closest('#orbToggle') || e.target.closest('[onclick*="toggleDrawer"]')) {
            setTimeout(expandCockpit, 150);
        }
    }, { passive: true });

    // ═══════════════════════════════════════════════════════════════
    // 7. API pública
    // ═══════════════════════════════════════════════════════════════
    window.SolarUpgrade = {
        setMode: applyModeVisual,
        rebuild: boot,
        updateTitle: updateTitle,
        get mode() { try { return (App && App.state && App.state.solarMode) || 'night'; } catch (_) { return 'night'; } }
    };

    console.log('%c[SOLAR-UPGRADE]%c ✓ Header 2 + Cockpit expandido + Solar cycle fix',
        'background:#00f5ff;color:#000;padding:2px 8px;border-radius:3px',
        'color:#00f5ff');
})();</script>
