      --kob-letter-space: 3px;

    * { box-sizing: border-box; }

      height: 100vh;
      background: radial-gradient(ellipse at center, var(--kob-bg-2), var(--kob-bg-1));

      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }

    #main-center-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      width: 100%;
      pointer-events: none;
    }

    #symbolBar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 120px;
      pointer-events: auto;
    }

    #btn-arch {
      position: relative;
      width: 60px;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      border: none;
      cursor: pointer;
      scale: 2.87;
      transition: transform 0.3s ease;
      background: radial-gradient(circle at 30% 30%, var(--kob-voice-primary), transparent 60%),
                  radial-gradient(circle at 70% 70%, var(--kob-voice-primary), var(--kob-voice-secondary));
      box-shadow: var(--kob-voice-primary);
    }

    .orb {
      position: absolute;
      width: 100%;
      height: 100%;
      animation: orbSpin 112s linear infinite;
    }

    .orb-core {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--kob-voice-secondary), transparent 60%),
                  radial-gradient(circle at 70% 70%, var(--kob-voice-primary), var(--kob-voice-secondary));
      box-shadow: var(--kob-voice-primary);
      z-index: 991;
      animation: orbSpin var(--kob-orb-spin) linear infinite;
    }

    .logo-overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      color: var(--kob-voice-secondary);
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.12));
    }

    @keyframes orbSpin { to { transform: rotate(720deg); } }

    .hud-info {
      color: var(--kob-voice-primary);
      letter-spacing: 5px;
      font-size: 0.7rem;
      text-transform: uppercase;
      margin-top: 10px;
    }

    .status-text {
      margin-top: 20px;
      color: var(--kob-voice-secondary);
      letter-spacing: var(--kob-letter-space);
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    .theme-switch {
      position: absolute;
      top: 35px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 4px;
      background: rgba(255,255,255,0.4);
      border-radius: 2px;
      cursor: pointer;
      z-index: 1000;
    }
  </style>

  <style data-inlined-from="https://kodux78k.github.io/oiDual--Y-/css/kob-dox-nanai-v4.css">/* =====================================================================
   ARQUITETURA VEEB – SISTEMA DE INTERFACE VIVA
   12 ARQUÉTIPOS APLICADOS AO HUD MAGNÉTICO
   ===================================================================== */

/* ---------------------------------------------------------------------
   1. ATLAS – FUNDAÇÃO E VARIÁVEIS GLOBAIS
      O alicerce do sistema. Define o espaço, as forças primordiais
      e as constantes que governam todos os elementos.
   --------------------------------------------------------------------- */
:root {
  /* Cores base – matéria‑prima do universo visual */
  --bg-dark: #02040a;
  --ink: #eaf6ff;
  --text: #f0f3f9;
  --muted: rgba(255, 255, 255, 0.45);

  /* Tipografia – a voz do sistema */
  --font-main: 'Inter', system-ui, -apple-system, sans-serif;

  /* Campos magnéticos – limite de atracação (threshold) */
  --snap-threshold: 40px;

  /* Arquétipo VEEB – Kob (voz primária e secundária) */
  --kob-voice-primary: #00e28b;
  --kob-voice-secondary: #0EA5E9;

  /* Derivadas da voz – criadas com color-mix para consistência dinâmica */
  --kob-voice-bg-soft: color-mix(in srgb, var(--kob-voice-primary) 20%, transparent);
  --kob-voice-bg-strong: color-mix(in srgb, var(--kob-voice-primary) 40%, black);
  --kob-voice-glow: color-mix(in srgb, var(--kob-voice-primary) 60%, white);

  /* Painéis e superfícies – transparência controlada pela voz */
  --panel-bg: color-mix(in srgb, var(--kob-voice-primary) 10%, #0b0f18);

  /* Bordas – vivas, mas sutis */
  --border: color-mix(in srgb, var(--kob-voice-primary) 30%, rgba(255,255,255,0.1));

  /* Gradiente de fundo – céu noturno com aurora da voz */
  --bg-gradient:
    radial-gradient(
      circle at 50% -10%,
      color-mix(in srgb, var(--kob-voice-primary) 35%, #1a224f) 0%,
      #050714 60%,
      #000
    );

  /* Gradiente para textos e destaques */
  --grad-a: var(--kob-voice-primary);
  --grad-b: var(--kob-voice-secondary);
}

/* Reset – limpeza do terreno */
* {
  box-sizing: border-box;
}

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg-dark) var(--bg-gradient);  /* Sobreposição do céu estrelado */
  color: var(--text);
  font-family: var(--font-main);
  overflow: auto;
}

/* ---------------------------------------------------------------------
   2. NOVA – O HUD FLUTUANTE (MOVIMENTO)
      O elemento que viaja pelo espaço da tela. Sua natureza é ser livre,
      mas responde a campos gravitacionais.
   --------------------------------------------------------------------- */
.symbol-bar {
  position: fixed;
  /* left: 20px; */
  top: auto;
  bottom: auto;
  right: auto;
  z-index: 9999;

  display: flex;
  gap: 10px;
  padding: 12px;
  align-items: center;
  justify-content: center;

  /* Estética – superfície vítrea */
  background: rgba(10, 12, 20, 0.85);
  backdrop-filter: blur(15px) saturate(180%);
  -webkit-backdrop-filter: blur(15px) saturate(180%);
  border: 1px solid var(--border);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
  border-radius: 28px;

  /* Comportamento – arrasto nativo desabilitado */
  user-select: none;
  touch-action: none;

  /* Transições – base para o movimento elástico (Vitalis) */
  transition:
    opacity 0.6s ease,
    top 0.35s cubic-bezier(0.175,0.885,0.32,1.275),
    left 0.35s cubic-bezier(0.175,0.885,0.32,1.275),
    border-radius 0.25s ease,
    background 0.4s ease,
    border-color 0.5s ease;
}

/* ---------------------------------------------------------------------
   3. VITALIS – TRANSIÇÕES ELÁSTICAS E VIDA ORGÂNICA
      A curva cúbica que simula uma mola física. Faz o HUD parecer vivo,
      como se fosse puxado por campos magnéticos.
   --------------------------------------------------------------------- */
/* As transições já estão definidas no bloco .symbol-bar; aqui apenas
   documentamos o arquétipo. O cubic-bezier(0.175,0.885,0.32,1.275)
   gera um efeito de “estica‑e‑encaixa”, essencial para o snap vetorial. */

/* ---------------------------------------------------------------------
   4. PULSE – ESTADOS DE INTERAÇÃO E RESPOSTA IMEDIATA
      O HUD reage à presença do usuário: fica mais visível ao hover,
      opaco quando ocioso, e perde transições durante o arrasto.
   --------------------------------------------------------------------- */
.symbol-bar.idle {
  opacity: 0.2;
}
.symbol-bar.idle:hover {
  opacity: 1;
}

.symbol-bar.is-dragging {
  opacity: 0.9;
  transition: none !important;          /* Remove qualquer animação durante o arrasto */
  transform: none !important;
  will-change: top, left;                /* Otimização para movimento fluido */
}

/* ---------------------------------------------------------------------
   5. ARTEMIS – ESTADOS DE ENCAIXE (SNAP)
      Classes que transformam a aparência do HUD conforme a borda dominante.
      Elas são ativadas pelo campo vetorial calculado em JavaScript.
   --------------------------------------------------------------------- */
/* Snap à esquerda – formato vertical, borda esquerda zero */
.symbol-bar.snap-side {
  flex-direction: column;
  border-radius: 0 24px 24px 0;
  border-left: 0;
}

/* Snap à direita – espelho do anterior */
.symbol-bar.snap-side-right {
  flex-direction: column;
  border-radius: 24px 0 0 24px;
  border-right: 0;
}

/* Snap ao topo – horizontal, sem borda superior */
.symbol-bar.snap-top {
  flex-direction: row;
  border-radius: 0 0 24px 24px;
  border-top: 0;
}

/* Limites para evitar overflow */
.symbol-bar.snap-side,
.symbol-bar.snap-side-right,
.symbol-bar.snap-top {
  max-width: 90vw;
  max-height: 90vh;
}

/* Estado totalmente livre – flutuante puro */
.symbol-bar.floating {
  flex-direction: column;
  border-radius: 28px;
  inset: auto;
}

/* ---------------------------------------------------------------------
   6. SERENA – COLAPSO E ECONOMIA DE ESPAÇO
      O HUD pode se contrair a um pequeno núcleo, escondendo os símbolos.
      Útil para quando se quer apenas o ponto de referência visual.
   --------------------------------------------------------------------- */
.symbol-bar.collapsed {
  min-width: 44px;
  min-height: 44px;
}

.symbol-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
}

.symbol-bar.collapsed .symbol-wrap {
  width: 0;
  height: 0;
  margin: 0;
  opacity: 0;
  pointer-events: none;
  transform: scale(0);
}

/* ---------------------------------------------------------------------
   7. KAOS – BOTÕES E AÇÕES TÁTEIS
      Elementos que o usuário toca, com feedbacks imediatos.
      Pequenas explosões de cor e escala.
   --------------------------------------------------------------------- */
.symbol-button {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  border: 1px solid var(--border);

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(255,255,255,0.05);
  color: var(--text);
  font-size: 18px;

  cursor: pointer;
  flex-shrink: 0;
  position: relative;

  transition: all 0.2s ease;
}

.symbol-button:hover {
  background: rgba(255,255,255,0.12);
  border-color: var(--kob-voice-primary);
  color: var(--kob-voice-primary);
}

.symbol-button:active {
  transform: scale(0.9);                /* Sensação de pressão */
}

/* Botão principal – destaque com gradiente e glow da voz */
.symbol-button.main-toggle {
  background: linear-gradient(135deg,#1a1d29,#05070a);
  color: var(--kob-voice-primary);
  border-color: var(--kob-voice-primary);
  font-weight: bold;
  box-shadow: 0 0 10px rgba(0,0,0,0.5);
}

/* ---------------------------------------------------------------------
   8. LUMINE – INDICADORES LUMINOSOS E FEEDBACK VISUAL
      Pequenos pontos de luz que mostram estado ativo, como a voz falando.
   --------------------------------------------------------------------- */
.voice-indicator {
  position: absolute;
  bottom: -2px;
  right: -2px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--kob-voice-primary);
  border: 2px solid #000;
  box-shadow: 0 0 5px var(--kob-voice-primary);
  transition: background 0.5s ease, box-shadow 0.5s ease;
}

/* Informação textual complementar – como um sussurro */
.hud-info {
  font-size: 10px;
  color: var(--kob-voice-primary);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;

  display: flex;
  align-items: center;
  padding: 0 10px;
  border-left: 1px solid var(--border);
  pointer-events: none;
}

.symbol-bar.snap-top .hud-info {
  display: none;                        /* Esconde info no topo para economizar espaço */
}

/* ---------------------------------------------------------------------
   9. SOLUS – FOCO NO TEXTO E LEITURA (TTS)
      O elemento que “fala” é destacado por um outline vivo.
   --------------------------------------------------------------------- */
#kob-tts-outline {
  position: absolute;
  z-index: 19998;
  pointer-events: none;

  border: 2px solid var(--kob-voice-primary);
  border-radius: 8px;
  background: var(--kob-voice-bg-soft);
  box-shadow: 0 0 15px var(--kob-voice-primary);

  transition: all 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
  display: none;                         /* Só aparece quando ativo */
}

/* Atributo que marca o elemento sendo lido */
[data-tts-current="true"] {
  background: var(--kob-voice-bg-soft);
  border-radius: 8px;
  border-color: var(--kob-voice-primary) !important;
  box-shadow:
    0 0 15px var(--kob-voice-bg-soft),
    inset 0 0 10px var(--kob-voice-bg-soft);
  transform: scale(1.02);
  transition: all 0.3s ease;
}

/* ---------------------------------------------------------------------
   10. RHEA – ESTRUTURA DE PAINÉIS E CONTEÚDO
       Os blocos que organizam a informação de forma adaptável.
   --------------------------------------------------------------------- */
.app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}

.system-title {
  font-weight: 800;
  font-size: 1.2rem;
  background: -webkit-linear-gradient(0deg, var(--grad-a), var(--grad-b));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 2px;
}

#clock {
  font-family: monospace;
  font-size: 1.1rem;
  color: var(--kob-voice-primary);
  transition: color 0.5s ease;
}

.content-box {
  max-width: 278px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

/* ---------------------------------------------------------------------
   11. GENUS – ACORDEÕES MODULARES
       Componentes expansíveis que se adaptam ao conteúdo.
   --------------------------------------------------------------------- */
.accordion {
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: all 0.3s ease;
  backdrop-filter: blur(10px);
}

.accordion-header {
  padding: 15px 20px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
  user-select: none;
}

.accordion-header:hover {
  background: rgba(255, 255, 255, 0.05);
}

.accordion-content {
  max-height: 0;
  padding: 0 20px;
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.accordion.open .accordion-content {
  max-height: 2500px;                    /* Suficiente para qualquer conteúdo */
  padding: 15px 20px;
  opacity: 1;
  border-top: 1px solid var(--border);
}

.indicator {
  transition: transform 0.3s ease;
}

.accordion.open .indicator {
  transform: rotate(180deg);
}

/* ---------------------------------------------------------------------
   12. AION – CAMPOS DE ENTRADA E INTERAÇÕES FINAS
       Elementos que recebem dados do usuário, com feedback da voz.
   --------------------------------------------------------------------- */
input[type="text"] {
  width: 100%;
  padding: 10px;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: white;
  font-family: var(--font-main);
  margin-bottom: 15px;
  margin-top: 5px;
}

input[type="text"]:focus {
  outline: none;
  border-color: var(--kob-voice-primary);
}

/* ---------------------------------------------------------------------
   ÁREA DE TEXTO PARA LEITURA TTS
   (Mantida como referência, pode ser estendida pelos 12 arquétipos)
   --------------------------------------------------------------------- */
#reader-content p {
  padding: 12px 16px;
  margin-bottom: 10px;
  border-radius: 8px;
  border: 1px solid transparent;
  transition: all 0.3s ease;
}

#reader-content p strong {
  color: var(--kob-voice-primary);
  transition: color 0.5s ease;
}

/* =====================================================================
   FIM DA ARQUITETURA VEEB
   Cada seção incorpora um dos 12 arquétipos, formando um sistema coeso
   onde o HUD se move, atraca e reage como um organismo vivo.
   ===================================================================== */
.kob-tts-dock{
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
    /* Variáveis base de cor para o Dock funcionar isoladamente */
    :root {
      --grad-a: #78e3ff;
      --grad-b: #b978ff;
      --bg: #070b14;
      --ink: #eaf6ff;
      --tts-left: 16px;
      --tts-bottom: 20px;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 0px;
      line-height: 1.6;
    }

    /* O conteúdo da página para teste */
    .content-box {
      max-width: 600px;
      margin: 0 auto;
      background: rgba(255,255,255,0.05);
      padding: 0px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* =========================================================
       CSS DO KOBLLUX TTS DOCK V32
       ========================================================= */
    .kob-tts-dock {
      position: fixed; 
      z-index: 9999; 
      left: var(--tts-left);
      bottom: calc(var(--tts-bottom) + env(safe-area-inset-bottom,0px));
      display: flex; 
      flex-direction: column; 
      gap: 8px;
      padding: 6px; 
      border-radius: 14px;
      background: rgba(15,18,28,.38);
      border: 1px solid rgba(255,255,255,.12);
      -webkit-backdrop-filter: blur(10px) saturate(1.1);
      backdrop-filter: blur(10px) saturate(1.1);
      box-shadow: 0 3px 6px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.05);
      touch-action: none; 
      cursor: grab;
    }
    
    .kob-tts-dock.is-drag { 
      cursor: grabbing;

/* kob-hud.css — estilos do HUD / symbol-bar */
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  color: var(--text);
  background: rgba(0,0,0,0);
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: auto;
}

.wrap { width: 100%; min-height: 100vh; height: 100%; display: flex; flex-direction: column; }
iframe#frame, iframe#content-frame { width: 100%; min-height: 100vh; height: 100%; border: 0; border-radius: 8px; transition: opacity .3s; }


/* Barra de Símbolos */
.symbol-bar {
  position: fixed;
  z-index: 9999;
  display: flex;
  gap: 2px;
  padding: 7px;
  background: var(--bg-blur);
  backdrop-filter: blur(15px) saturate(160%);
  -webkit-backdrop-filter: blur(15px) saturate(160%);
  border: 1px solid var(--border);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  transition:
    opacity 0.8s ease,
    left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
    top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
    border-radius 0.3s ease,
    padding 0.3s ease;
  user-select: none;
  touch-action: none;
  opacity: 0.96;
}




/* Estado Inativo */
.symbol-bar.idle { opacity: 0.18; }
.symbol-bar.idle:hover { opacity: 0.96; }

/* Variações de Snap */
.symbol-bar.snap-side {bottom:28%; flex-direction: column; border-radius: 0 20px 20px 0; border-left: 0; }

.symbol-bar.snap-side-right { bottom:28%; flex-direction: column; border-radius: 20px 0 0 20px; border-right: 0; }

/* Snap Topo */
.symbol-bar.snap-top {
  flex-direction: row;
  border-radius: 0 0 20px 20px;
  border-top: 0;
  align-items: center;
  justify-content: center;
}

.symbol-bar.floating { flex-direction: column; border-radius:  24px; }

/* Botões */
.symbol-button {
  width: 48px; height: 48px; border-radius: 12px;
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  background: var(--card-bg);
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s ease;
  -webkit-tap-highlight-color: transparent;
  font-size: 18px;
  flex-shrink: 0;
}
.symbol-button:active { transform: scale(0.9); }
.symbol-button.toggle {
  background: linear-gradient(135deg, #1a1d29, #0f111a);
  color: var(--accent);
  border-color: rgba(50, 215, 203, 0.4);
  font-weight: bold;
   
}

/* Recolhimento */
.symbol-bar.collapsed .symbol-wrap { width: 0; height: 0; margin: 0; opacity: 0; pointer-events: none; transform: scale(0); }
.symbol-bar.collapsed.snap-side, .symbol-bar.collapsed.snap-side-right { padding: 10px 5px; }
.symbol-bar.collapsed.snap-top { padding: 5px 10px; }

.symbol-wrap {
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}

/* KOBLLUX: Apply variables in the HUD, dock, and outline */

}

@keyframes orb-float {
  0%, 100% {
    transform: translateY(0) scale(1);

  }
  50% {
    transform: translateY(-6px) scale(1.05);

  }

/* ===== WINDOW SYSTEM ===== */
.k-window {
  position: fixed;
  z-index: 5000;
  background: var(--panel-bg);
  backdrop-filter: var(--panel-blur);
  -webkit-backdrop-filter: var(--panel-blur);
  border: 1px solid var(--border);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
  overflow: hidden;
  min-width: 280px;
  min-height: 180px;
  transition: opacity 0.3s, transform 0.3s;
}

.k-window.active {
  border-color: var(--border-active);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 20px rgba(120, 227, 255, 0.1);
}

.k-window.minimized {
  transform: scale(0.8) translateY(100px);
  opacity: 0;
  pointer-events: none;
}

.k-header {
  padding: 12px 16px;
  background: rgba(0, 0, 0, 0.2);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: grab;
}

.k-header:active {
  cursor: grabbing;
}

.k-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--text-muted);
}

.k-controls {
  display: flex;
  gap: 6px;
}

.k-btn {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
}

.k-close { background: #ff5f56; }
.k-min   { background: #ffbd2e; }
.k-max   { background: #27c93f; }

.k-body {
  flex: 1;
  padding: 15px;
  overflow: auto;
  font-size: 14px;
  line-height: 1.5;
}

/* ===== VIEWS (HOME, CHAT, BRAIN) ===== */
.views {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 10;
  overflow: hidden;
  pointer-events: none;
}

.view {
  display: none;
  position: absolute;
  inset: 0;
  padding: 80px 24px 160px;
  overflow-y: auto;
  pointer-events: auto;
}

.view.active {
  display: block;
}

.view .card {
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 20px;
  backdrop-filter: blur(20px);
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
}

.arch-hero {
  text-align: center;
  padding: 30px 0;
}

.arch-symbol {
  font-size: 4rem;
  text-shadow: 0 0 30px var(--arch-color);
  animation: float 6s infinite;
  display: block;
}

.arch-name {
  font-family: 'Montserrat', sans-serif;
  font-weight: 900;
  font-size: 2.2rem;
  background: linear-gradient(180deg, #fff, var(--text-muted));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-12px); }
}

.arch-selector-row {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding: 10px 4px;
  scrollbar-width: none;
}

.arch-chip {
  flex-shrink: 0;
  padding: 10px 20px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.05);

  cursor: pointer;
  transition: all 0.3s;
  font-weight: 600;
  color: var(--text-muted);

.arch-chip.active {

.chat-container {
  display: flex;
  flex-direction: column;
  gap: 10px;
  height: 300px;
  overflow-y: auto;

.glass-input {

      max-height:85vh; overflow-y:auto; overflow-x:hidden;
      background:var(--glass-surface); backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px);

      will-change: transform, width, height, border-radius, left, top;
      touch-action: pan-y;

    .fusion-card.orb{

  const TARGET_ORIGIN = location.origin && location.origin !== 'null' ? location.origin : '*';

  function el(id) {
    return document.getElementById(id);
  }

  function safeParse(raw, fallback) {
    try {
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      return fallback;
    }
  }

  function getBgLayer() {
    return el('bg-fake-custom');
  }

  function getStoredState() {
    const list = safeParse(localStorage.getItem(KEYS.images), []);
    const activeIndexRaw = localStorage.getItem(KEYS.active);
    const opacityRaw = localStorage.getItem(KEYS.opacity);
    const blendRaw = localStorage.getItem(KEYS.blend);
    const autoRaw = localStorage.getItem(KEYS.auto);

    let url = '';
    let label = 'Nenhum';
    let activeIndex = null;

    if (activeIndexRaw !== null && activeIndexRaw !== '') {
      const idx = Number(activeIndexRaw);
      if (Number.isFinite(idx) && list[idx]?.data) {
        url = list[idx].data;
        label = list[idx].name || list[idx].id || 'background';
        activeIndex = idx;
      }
    }

    if (!url) {
      const activeItem = list.find(item => item && item.active && item.data);
      if (activeItem) {
        url = activeItem.data;
        label = activeItem.name || activeItem.id || 'background';
      }
    }

    return {
      url,
      label,
      opacity: opacityRaw !== null && opacityRaw !== '' ? Number(opacityRaw) : 18,
      blend: blendRaw || 'overlay',
      auto: autoRaw === '1',
      activeIndex
    };
  }

  function applyStateToUI(state) {
    const layer = getBgLayer();
    if (layer) {
      layer.style.opacity = String(Math.max(0, Math.min(1, state.opacity / 100)));
      layer.style.mixBlendMode = state.blend || 'overlay';
      layer.style.backgroundImage = state.url ? `url("${state.url}")` : 'none';
    }

    const status = el('bgStatusText');
    if (status) status.textContent = state.label || (state.url ? 'Ativo' : 'Nenhum');

    const opacityLabel = el('val-op') || el('bgOpacityLabel');
    if (opacityLabel) opacityLabel.textContent = `${state.opacity}%`;

    const opacityInput = el('bgOpacity');
    if (opacityInput && String(opacityInput.value) !== String(state.opacity)) {
      opacityInput.value = String(state.opacity);
    }

    const blendSelect = el('bgBlend') || el('select-blend');
    if (blendSelect && blendSelect.value !== state.blend) {
      blendSelect.value = state.blend;
    }

    const autoBtn = el('btnAutoBgSync');
    if (autoBtn) autoBtn.textContent = `Auto BG: ${state.auto ? 'ON' : 'OFF'}`;

    const counter = el('ui-catalog-counter');
    if (counter && state.activeIndex !== null) {
      counter.dataset.bgActive = String(state.activeIndex);
    }

    if (typeof window.di_renderBgThumbs === 'function') {
      window.di_renderBgThumbs();
    } else if (typeof window.renderLibrary === 'function') {
      window.renderLibrary();
    } else if (typeof window.di_renderBgPanel === 'function') {
      window.di_renderBgPanel();
    }
  }

  function syncFromStorage() {
    const state = getStoredState();
    applyStateToUI(state);
    window.dispatchEvent(new CustomEvent('di:bg:sync', { detail: state }));

    if (IS_IFRAME && window.parent && window.parent !== window) {
      window.parent.postMessage(
        { type: 'DI_BG_SYNC', payload: state },
        TARGET_ORIGIN
      );
    }
  }

  function patchLocalStorage() {
    const _setItem = localStorage.setItem.bind(localStorage);
    const _removeItem = localStorage.removeItem.bind(localStorage);
    const _clear = localStorage.clear.bind(localStorage);

    localStorage.setItem = function(key, value) {
      const oldValue = localStorage.getItem(key);
      _setItem(key, value);
      window.dispatchEvent(new CustomEvent('di:storage', {
        detail: { key, oldValue, newValue: String(value) }
      }));
    };

    localStorage.removeItem = function(key) {
      const oldValue = localStorage.getItem(key);
      _removeItem(key);
      window.dispatchEvent(new CustomEvent('di:storage', {
        detail: { key, oldValue, newValue: null }
      }));
    };

    localStorage.clear = function() {
      _clear();
      window.dispatchEvent(new CustomEvent('di:storage', {
        detail: { key: null, oldValue: null, newValue: null, clear: true }
      }));
    };
  }

  function bindEvents() {
    window.addEventListener('storage', (e) => {
      if (!e || !Object.values(KEYS).includes(e.key)) return;
      syncFromStorage();
    });

    window.addEventListener('di:storage', (e) => {
      const key = e?.detail?.key;
      if (key && !Object.values(KEYS).includes(key)) return;
      syncFromStorage();
    });

    window.addEventListener('di:bg:requestSync', syncFromStorage);

    window.addEventListener('message', (e) => {
      const data = e?.data;
      if (!data || data.type !== 'DI_BG_SYNC') return;
      syncFromStorage();
    });
  }

  function startPollingFallback() {
    let last = JSON.stringify([
      localStorage.getItem(KEYS.images) || '',
      localStorage.getItem(KEYS.opacity) || '',
      localStorage.getItem(KEYS.blend) || '',
      localStorage.getItem(KEYS.active) || '',
      localStorage.getItem(KEYS.auto) || ''
    ]);

    setInterval(() => {
      const now = JSON.stringify([
        localStorage.getItem(KEYS.images) || '',
        localStorage.getItem(KEYS.opacity) || '',
        localStorage.getItem(KEYS.blend) || '',
        localStorage.getItem(KEYS.active) || '',
        localStorage.getItem(KEYS.auto) || ''
      ]);

      if (now !== last) {
        last = now;
        syncFromStorage();
      }
    }, 800);
  }

  function init() {
    patchLocalStorage();
    bindEvents();
    syncFromStorage();
    startPollingFallback();
  }

  window.di_syncBgFromStorage = syncFromStorage;
  window.di_requestBgSync = syncFromStorage;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

  });

    if (!target) return;

      if (window.KOBLLUX && typeof window.KOBLLUX.rebuildBlocks === 'function') {
        window.KOBLLUX.rebuildBlocks();
      }

      const blocks = [...doc.querySelectorAll(selector)].filter(n => (n.innerText || '').trim().length > 0);
      let idx = blocks.findIndex(b => b.isEqualNode && b.isEqualNode(target));

      if (idx < 0) {
        const ttext = (target.innerText || '').trim();
        idx = blocks.findIndex(b => (b.innerText || '').trim() === ttext);
      }

      if (idx >= 0 && window.KOBLLUX && window.KOBLLUX.state) {
        window.KOBLLUX.state.currentBlockIdx = idx;

      if (!doc) return;

      const selected = String(doc.getSelection ? doc.getSelection() : window.getSelection());
      if (!selected || !selected.trim()) return;

      if (window.KOBLLUX && typeof window.KOBLLUX.speakText === 'function') {
        window.KOBLLUX.speakText(text, {});
      }

    }

  function bindIframeDoc() {

      console.log('KOBTTS click trigger bound ✓');
    } catch (err) {
      console.warn('bindIframeDoc failed:', err);
    }
  }

  function rebindAll() {

    <script>(() => {
  if (window.__DI_OVERRIDE_READY__) return;
  window.__DI_OVERRIDE_READY__ = true;

  const NAME_KEYS = ['di_userName', 'userName'];

  const SEL = {
    inputA: '#inputUser',
    inputB: '#infodoseNameInput',
    lblName: '#lblName',
    actName: '#actName',
    smallText: '#smallText',
    hudStatus: '#hudStatus',

    mainOrb: '#main-orb',
    avatarTarget: '#avatarTarget',
    smallMiniAvatar: '#smallMiniAvatar',
    actMiniAvatar: '#actMiniAvatar'
  };

  const $ = (s) => document.querySelector(s);

  function safeName(v) {
    return (v || '').trim() || 'DUAL';
  }

  function seed(name) {
    return [...name].reduce((a, c) => a + c.charCodeAt(0), 0);
  }

  function compute(name) {
    const s = seed(name);
    return {
      name,
      seed: s,
      h1: s % 360,
      h2: (s * 37) % 360
    };
  }

  function applyRoot(name) {
    const d = compute(name);
    const root = document.documentElement;

    root.style.setProperty('--kob-voice-primary', `hsl(${d.h1} 100% 55%)`);
    root.style.setProperty('--kob-voice-secondary', `hsl(${d.h2} 90% 45%)`);
    root.dataset.diName = d.name;
    root.dataset.arch = d.name;
  }

  function renderOrb(selector, name, size) {
    const el = $(selector);
    if (!el) return;

    if (typeof window.makeOrbAvatar === 'function') {
      el.innerHTML = window.makeOrbAvatar(name, size);
    }
  }

  function setText(selector, value) {
    const el = $(selector);
    if (el) el.textContent = value;
  }

  function sync(name) {
    const safe = safeName(name);

    localStorage.setItem('di_userName', safe);
    localStorage.setItem('userName', safe);

    applyRoot(safe);

    setText(SEL.lblName, safe);
    setText(SEL.actName, safe);
    setText(SEL.smallText, safe);
    setText(SEL.hudStatus, safe);

    const activeKey = window.STATE?.keys?.find?.(k => k.active);
    const keyName = activeKey ? activeKey.name : '--';

    setText(SEL.smallIdent, keyName);
    setText(SEL.actBadge, activeKey ? `key:${keyName}` : 'v:--');

    renderOrb(SEL.mainOrb, safe, 48);
    renderOrb(SEL.avatarTarget, safe, 64);
    renderOrb(SEL.smallMiniAvatar, safe, 24);
    renderOrb(SEL.actMiniAvatar, safe, 36);
  }

  function bind() {
    const inputs = [$(SEL.inputA), $(SEL.inputB)].filter(Boolean);
    const initial = safeName(
      $(SEL.inputA)?.value ||
      $(SEL.inputB)?.value ||
      localStorage.getItem('di_userName') ||
      localStorage.getItem('userName')
    );

    inputs.forEach((inp) => {
      if (!inp.value) inp.value = initial;
      inp.addEventListener('input', () => sync(inp.value));
      inp.addEventListener('change', () => sync(inp.value));
    });

    sync(initial);

    window.addEventListener('storage', (e) => {
      if (NAME_KEYS.includes(e.key)) sync(e.newValue);
    });

    document.addEventListener('di:name:update', (e) => {
      sync(e.detail?.name);
    });
  }

  window.di_overrideSync = sync;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bind);
  } else {
    bind();
  }
})();

})();

    <script>/* ===== DI FUSION HANDLE — LOAD LAST ===== */
(() => {
  if (window.__DI_FUSION_HANDLE_READY__) return;
  window.__DI_FUSION_HANDLE_READY__ = true;

  const card = document.querySelector('#mainCard');
  const bar = document.querySelector('#symbolBar');
  const handle = document.querySelector('.drag-handle');
  const archBtn = document.querySelector('#btn-arch');

  if (!card || !bar || !handle) return;

  const LONG_PRESS_MS = 450;
  const FUSE_DISTANCE = 120;
  const FUSE_MIN_DISTANCE = 88;
  const RETURN_DISTANCE = 160;

  let pressTimer = null;
  let dragging = false;
  let pointerId = null;
  let startX = 0;
  let startY = 0;
  let cardX = 0;
  let cardY = 0;
  let holdTriggered = false;
  let fused = false;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  function centerOf(el) {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2, r };
  }

  function setFused(on) {
    fused = !!on;
    card.classList.toggle('di-fused', fused);
    card.classList.toggle('di-near-bar', fused);
    bar.classList.toggle('di-fuse-glow', fused);
    archBtn?.classList.toggle('di-orb-returning', fused);
    if (fused) {
      archBtn?.classList.add('di-orb-pulse');
      setTimeout(() => archBtn?.classList.remove('di-orb-pulse'), 480);
    }
  }

  function updateProximity() {
    const c = centerOf(card);
    const b = centerOf(bar);
    const d = dist(c, b);

    if (dragging) {
      const near = d <= FUSE_DISTANCE;
      card.classList.toggle('di-near-bar', near);
      bar.classList.toggle('di-fuse-glow', near);

      if (near) {
        const t = clamp((FUSE_DISTANCE - d) / (FUSE_DISTANCE - FUSE_MIN_DISTANCE), 0, 1);
        card.style.transform = `scale(${(.965 - t * 0.065).toFixed(3)})`;
        card.style.opacity = (0.82 - t * 0.24).toFixed(3);
      } else {
        card.style.transform = '';
        card.style.opacity = '';
      }

      if (d <= FUSE_MIN_DISTANCE) setFused(true);
      if (fused && d >= RETURN_DISTANCE) setFused(false);
    }
  }

  function beginHold(e) {
    if (e.button === 2) return;
    pointerId = e.pointerId;
    startX = e.clientX;
    startY = e.clientY;
    holdTriggered = false;

    try { handle.setPointerCapture(pointerId); } catch {}

    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => {
      holdTriggered = true;
      card.classList.add('di-near-bar');
      bar.classList.add('di-fuse-glow');
      // se o usuário só segurar, abre o painel direto
      window.setMode?.('card', true);
    }, LONG_PRESS_MS);
  }

  function onMove(e) {
    if (pointerId !== e.pointerId) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if (!dragging && Math.hypot(dx, dy) > 6) {
      dragging = true;
      clearTimeout(pressTimer);
    }

    if (!dragging) return;

    // não interfere no teu sistema; só reage ao estado visual
    updateProximity();
  }

  function endGesture() {
    clearTimeout(pressTimer);

    if (dragging) {
      updateProximity();
      if (!fused) {
        card.classList.remove('di-near-bar');
        bar.classList.remove('di-fuse-glow');
      }
    } else if (holdTriggered) {
      window.setMode?.('card', true);
    }

    dragging = false;
    pointerId = null;
    holdTriggered = false;
  }

  handle.addEventListener('pointerdown', beginHold, { passive: true });
  handle.addEventListener('pointermove', onMove, { passive: true });
  handle.addEventListener('pointerup', endGesture, { passive: true });
  handle.addEventListener('pointercancel', endGesture, { passive: true });
  handle.addEventListener('pointerleave', () => {
    clearTimeout(pressTimer);
  }, { passive: true });

  // botão do orb: segurar = abre painel; arrastar pra fora = retorna orb
  if (archBtn) {
    let archTimer = null;
    let archDragging = false;
    let archStart = { x: 0, y: 0 };

    archBtn.addEventListener('pointerdown', (e) => {
      archDragging = false;
      archStart = { x: e.clientX, y: e.clientY };
      clearTimeout(archTimer);

      archTimer = setTimeout(() => {
        window.setMode?.('card', true);
      }, LONG_PRESS_MS);
    }, { passive: true });

    archBtn.addEventListener('pointermove', (e) => {
      const dx = e.clientX - archStart.x;
      const dy = e.clientY - archStart.y;

      if (!archDragging && Math.hypot(dx, dy) > 8) {
        archDragging = true;
        clearTimeout(archTimer);
      }

      if (archDragging) {
        const b = centerOf(bar);
        const btn = centerOf(archBtn);
        const d = dist(btn, b);

        if (d > RETURN_DISTANCE) setFused(false);
        if (d <= FUSE_DISTANCE) setFused(true);
      }
    }, { passive: true });

    archBtn.addEventListener('pointerup', () => clearTimeout(archTimer), { passive: true });
    archBtn.addEventListener('pointercancel', () => clearTimeout(archTimer), { passive: true });
  }

  window.addEventListener('resize', updateProximity);
})();</script>
    <script>(() => {
  const CACHE_KEY = 'di_btn_icon_cache_v2';
  const STORAGE_PREFIX = 'symbol_button_';

  const buttons = () =>
    Array.from(document.querySelectorAll('.symbol-button[data-url]'));

  const storageGet = (storage, key) => {
    try {
      const raw = storage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch {
      return null;
    }
  };

  const storageSet = (storage, key, value) => {
    try {
      storage.setItem(key, JSON.stringify(value));
    } catch {}
  };

  const storageRemove = (storage, key) => {
    try {
      storage.removeItem(key);
    } catch {}
  };

  const loadCache = () => storageGet(localStorage, CACHE_KEY) || {};
  const saveCache = (cache) => storageSet(localStorage, CACHE_KEY, cache);

  const cache = loadCache();

  const normKey = (url) => {
    try {
      return new URL(url, location.href).href;
    } catch {
      return String(url || '');
    }
  };

  const getStorageKey = (btn) => {
    if (!btn) return null;
    if (btn.id) return `${STORAGE_PREFIX}${btn.id}`;
    if (btn.dataset.storeKey) return `${STORAGE_PREFIX}${btn.dataset.storeKey}`;
    return null;
  };

  async function fetchText(url) {
    const res = await fetch(url, { mode: 'cors', credentials: 'omit' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.text();
  }

  async function fetchJSON(url) {
    const res = await fetch(url, { mode: 'cors', credentials: 'omit' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  }

  function pickBestIcon(icons = []) {
    if (!Array.isArray(icons) || !icons.length) return null;

    const parsed = icons
      .map(i => ({
        ...i,
        sizeNum: (() => {
          const m = String(i.sizes || '').match(/(\d+)\s*x\s*(\d+)/i);
          return m ? Math.max(+m[1], +m[2]) : 0;
        })()
      }))
      .sort((a, b) => b.sizeNum - a.sizeNum);

    return (
      parsed.find(i => String(i.sizes || '').includes('192')) ||
      parsed.find(i => i.sizeNum >= 192) ||
      parsed[0] ||
      null
    );
  }

  async function resolveIcon(url) {
    const key = normKey(url);
    if (cache[key]) return cache[key];

    try {
      const base = new URL(key);
      const html = await fetchText(base.href);
      const doc = new DOMParser().parseFromString(html, 'text/html');

      const manifestLink = doc.querySelector('link[rel="manifest"]');
      if (manifestLink) {
        const manifestUrl = new URL(
          manifestLink.getAttribute('href'),
          base
        ).href;

        try {
          const manifest = await fetchJSON(manifestUrl);
          const icon = pickBestIcon(manifest?.icons);

          if (icon?.src) {
            const resolved = new URL(icon.src, manifestUrl).href;
            cache[key] = resolved;
            saveCache(cache);
            return resolved;
          }
        } catch {}
      }

      const apple = doc.querySelector(
        'link[rel="apple-touch-icon"], link[rel="apple-touch-icon-precomposed"]'
      );

      if (apple?.getAttribute('href')) {
        const resolved = new URL(apple.getAttribute('href'), base).href;
        cache[key] = resolved;
        saveCache(cache);
        return resolved;
      }

      const shortcut = doc.querySelector(
        'link[rel="shortcut icon"], link[rel="icon"]'
      );

      if (shortcut?.getAttribute('href')) {
        const resolved = new URL(shortcut.getAttribute('href'), base).href;
        cache[key] = resolved;
        saveCache(cache);
        return resolved;
      }

      const fallback = new URL('/favicon.ico', base).href;
      cache[key] = fallback;
      saveCache(cache);
      return fallback;
    } catch {
      const fallback = (() => {
        try {
          return new URL('/favicon.ico', new URL(key, location.href)).href;
        } catch {
          return null;
        }
      })();

      if (fallback) {
        cache[key] = fallback;
        saveCache(cache);
      }

      return fallback;
    }
  }

  function paintButton(btn, iconUrl) {
    if (!btn || !iconUrl) return;

    btn.classList.add('di-icon-ready');
    btn.dataset.diIconDone = '1';

    btn.innerHTML = '';

    const img = document.createElement('img');
    img.className = 'di-btn-icon-img';
    img.alt = '';
    img.loading = 'lazy';
    img.decoding = 'async';
    img.src = iconUrl;

    img.onerror = () => {
      const fallback = document.createElement('span');
      fallback.className = 'di-btn-icon-fallback';
      fallback.textContent = btn.dataset.fallback || '◉';
      btn.innerHTML = '';
      btn.appendChild(fallback);
    };

    btn.appendChild(img);
  }

  async function processButton(btn) {
    const url = btn?.dataset?.url;
    if (!url) return;

    const icon = await resolveIcon(url);
    if (icon) paintButton(btn, icon);
  }

  async function run() {
    await Promise.all(buttons().map(processButton));
  }

  function restoreButtons() {
    document.querySelectorAll('.symbol-button').forEach((btn) => {
      const key = getStorageKey(btn);
      if (!key) return;

      const sessionData = storageGet(sessionStorage, key);
      const localData = storageGet(localStorage, key);
      const data = sessionData || localData;

      if (!data) return;

      if (data.url) {
        btn.dataset.url = data.url;
      }

      if (data.iconUrl) {
        paintButton(btn, data.iconUrl);
      } else if (btn.dataset.url) {
        btn.dataset.diIconDone = '';
        processButton(btn);
      }
    });
  }

  async function updateAttrBtn(
    btn,
    {
      url,
      save = true,
      session = true,
      refresh = true,
      fallback = '◉'
    } = {}
  ) {
    if (!btn || !url) return null;

    const cleanUrl = String(url).trim();
    if (!cleanUrl) return null;

    btn.dataset.url = cleanUrl;
    btn.dataset.fallback = fallback;
    btn.dataset.diIconDone = '';

    let iconUrl = null;

    if (refresh) {
      iconUrl = await resolveIcon(cleanUrl);
      if (iconUrl) paintButton(btn, iconUrl);
    }

    const payload = {
      id: btn.id || '',
      url: cleanUrl,
      iconUrl: iconUrl || '',
      updatedAt: Date.now()
    };

    const key = getStorageKey(btn);
    if (key) {
      if (session) storageSet(sessionStorage, key, payload);
      if (save) storageSet(localStorage, key, payload);
      if (!session && !save) {
        storageRemove(sessionStorage, key);
        storageRemove(localStorage, key);
      }
    }

    window.dispatchEvent(
      new CustomEvent('di-button-updated', { detail: payload })
    );

    return payload;
  }

  function observeDynamicButtons() {
    const root = document.body;
    if (!root) return;

    const mo = new MutationObserver((mutations) => {
      for (const m of mutations) {
        if (m.type === 'childList') {
          m.addedNodes.forEach((node) => {
            if (!(node instanceof Element)) return;

            if (node.matches?.('.symbol-button[data-url]')) {
              processButton(node);
            }

            node
              .querySelectorAll?.('.symbol-button[data-url]')
              .forEach((btn) => processButton(btn));
          });
        }

        if (m.type === 'attributes' && m.attributeName === 'data-url') {
          const btn = m.target;
          if (btn?.classList?.contains('symbol-button')) {
            btn.dataset.diIconDone = '';
            processButton(btn);
          }
        }
      }
    });

    mo.observe(root, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ['data-url']
    });
  }

    refresh: run,
    clearCache() {
      Object.keys(cache).forEach((k) => delete cache[k]);
      saveCache(cache);

  };

  function init() {

    run();
    observeDynamicButtons();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init, { once: true });
  } else {
    init();
  }
})();
