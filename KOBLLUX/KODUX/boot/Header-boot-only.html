<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KOB · Soneto Bundle</title>
<style id="kob-soneto-css">
/* ═════════ HEADER 2 (Soneto) ═════════ */
#kob-soneto-header{position:fixed;top:0;left:0;right:0;z-index:9000;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:nowrap;min-height:44px;padding:7px 14px;background:linear-gradient(180deg,color-mix(in srgb,var(--kob-L-primary,#22d3ee) 8%,transparent),transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--kob-L-secondary,#0E7C9E) 40%,transparent);font-family:system-ui,-apple-system,sans-serif;color:#e8f4ff;transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .22s ease}
#kob-soneto-header.hidden{transform:translateY(-100%);opacity:0;pointer-events:none}
#kob-soneto-header .hd2-title{flex:1 1 auto;min-width:0;max-width:44vw;overflow:hidden;text-align:left;background:none;border:0;color:inherit;padding:2px 4px;cursor:pointer;height:26px;display:flex;align-items:center}
#kob-soneto-header .hd2-short{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;font:700 10.5px/1.1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase}
#kob-soneto-header .hd2-full{display:none;white-space:nowrap;font:700 10.5px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase}
#kob-soneto-header .hd2-title.mq .hd2-short{display:none}
#kob-soneto-header .hd2-title.mq .hd2-full{display:inline-block;animation:hd2Slide var(--mq-dur,9s) linear 1 both}
#kob-soneto-header .hd2-title.playing .hd2-short{color:var(--kob-L-primary,#22d3ee)}
@keyframes hd2Slide{from{transform:translateX(44vw)}to{transform:translateX(-100%)}}
#kob-soneto-header .hd2-btns{display:flex;gap:6px;flex:0 0 auto}
#kob-soneto-header .hd2-b{width:34px;height:34px;border-radius:50%;border:1px solid color-mix(in srgb,var(--kob-L-secondary,#0E7C9E) 60%,transparent);background:color-mix(in srgb,var(--kob-L-primary,#22d3ee) 8%,transparent);color:inherit;font-size:15px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;transition:border-color .18s,color .18s,background-color .18s}
#kob-soneto-header .hd2-b:hover{border-color:var(--kob-L-primary,#22d3ee);background:color-mix(in srgb,var(--kob-L-primary,#22d3ee) 16%,transparent)}
#kob-soneto-header .hd2-b.playing{border-color:var(--kob-L-primary,#22d3ee);color:var(--kob-L-primary,#22d3ee)}
#kob-soneto-header .hd2-holo{display:none;flex-direction:column;gap:1px;min-width:0;overflow:hidden;white-space:nowrap;font:700 9.5px/1.15 ui-monospace,Menlo,monospace;letter-spacing:.05em}
#kob-soneto-header .hd2-title.holo-on .hd2-short{display:none}
#kob-soneto-header .hd2-title.holo-on .hd2-holo{display:flex}
#kob-soneto-header .hd2-holo i{font-style:normal;overflow:hidden;text-overflow:clip}
#kob-soneto-header .hd2-holo .hm{color:var(--kob-L-primary,#22d3ee)}
#kob-soneto-header .hd2-holo .ht{opacity:.8}
#kob-soneto-header .hd2-holo .ha{font-size:8px;opacity:.6}

/* ═════════ BARRA DE CARREGAMENTO ═════════ */
#kob-soneto-load{position:fixed;left:0;right:0;top:0;height:3px;z-index:96000;display:none;overflow:hidden;pointer-events:none}
#kob-soneto-load.on{display:block}
#kob-soneto-load:before{content:"";position:absolute;top:0;height:100%;width:35%;background:var(--kob-L-primary,#22d3ee);animation:kobLoadSlide 1s linear infinite}
#kob-soneto-load span{position:fixed;top:6px;left:50%;transform:translateX(-50%);font:700 10px ui-monospace,monospace;letter-spacing:.08em;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff}
@keyframes kobLoadSlide{from{left:-35%}to{left:100%}}

/* ═════════ TTS OUTLINE ═════════ */
#kob-soneto-outline{position:fixed;display:none;pointer-events:none;z-index:2147483000;border:1px dashed var(--kob-L-primary,#22d3ee);border-radius:9px;box-shadow:0 6px 20px color-mix(in srgb,var(--kob-L-primary,#22d3ee) 30%,transparent);background:linear-gradient(0deg,rgba(255,255,255,.02),transparent);will-change:top,left,width,height;transition:all .15s cubic-bezier(.175,.885,.32,1.275)}

/* ═════════ VISUALIZADOR (KCA) ═════════ */
#kob-soneto-viz{display:inline-flex;align-items:center;gap:5px;height:20px;padding:1px 6px;border-radius:6px;cursor:pointer;border:1px solid color-mix(in srgb,var(--kob-L-secondary,#0E7C9E) 60%,transparent);background:color-mix(in srgb,var(--kob-L-primary,#22d3ee) 6%,transparent);line-height:0;transition:border-color .25s,box-shadow .25s,opacity .3s}
#kob-soneto-viz:hover{border-color:var(--kob-L-primary,#22d3ee);box-shadow:0 0 12px color-mix(in srgb,var(--kob-L-primary,#22d3ee) 40%,transparent)}
#kob-soneto-viz.pulse{animation:kobVizPulse 1.4s ease-in-out infinite}
@keyframes kobVizPulse{0%,100%{box-shadow:0 0 6px color-mix(in srgb,var(--kob-L-primary,#22d3ee) 30%,transparent)}50%{box-shadow:0 0 18px color-mix(in srgb,var(--kob-L-primary,#22d3ee) 40%,transparent)}}
#kob-soneto-viz canvas{width:96px;height:16px;display:block}

/* ═════════ CHIPS/ORBEZINHOS ═════════ */
.kob-soneto-chip{display:inline-flex;align-items:center;justify-content:center;min-width:22px;max-width:38px;height:22px;padding:0 6px;border-radius:999px;font-size:8px;line-height:1;letter-spacing:.04em;text-transform:uppercase;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid color-mix(in srgb,var(--kob-L-primary,#22d3ee) 35%,transparent);color:var(--kob-L-primary,#22d3ee);background:color-mix(in srgb,var(--kob-L-primary,#22d3ee) 10%,transparent);box-sizing:border-box}

/* ═════════ PERF LITE ═════════ */
html.kob-perf-lite #kob-soneto-header{backdrop-filter:none;-webkit-backdrop-filter:none}
html.kob-perf-lite #kob-soneto-outline{box-shadow:none;transition:none}
</style>
</head>
<body>

<div id="kob-soneto-load"><span>CARREGANDO…</span></div>
<header id="kob-soneto-header" data-kob-soneto>
  <button type="button" class="hd2-b" id="kob-soneto-arch-btn" title="Trocar arquétipo de voz">◐</button>
  <button type="button" class="hd2-title" id="kob-soneto-title" title="Arquivo ativo">
    <span class="hd2-short" id="kob-soneto-short">KOBLLUX</span>
    <span class="hd2-full" id="kob-soneto-full"></span>
    <span class="hd2-holo" id="kob-soneto-holo"><i class="hm"></i><i class="ht"></i><b class="ha"></b></span>
  </button>
  <div class="hd2-btns">
    <button type="button" class="hd2-b" id="kob-soneto-copy" title="Copiar">⧉</button>
    <button type="button" class="hd2-b" id="kob-soneto-dl" title="Baixar TXT">↓</button>
    <button type="button" class="hd2-b" id="kob-soneto-tts" title="Ouvir / parar">🎧</button>
    <button type="button" class="hd2-b" id="kob-soneto-music" title="Trilha sonora">🎵</button>
  </div>
  <button type="button" class="hd2-b" id="kob-soneto-theme" title="Tema claro/escuro">◑</button>
</header>

<div id="kob-soneto-outline"></div>

<script id="kob-soneto-js">
(function KOB_SONETO(){
  'use strict';
  if (window.KOB_SONETO_BUNDLE) { console.log('[KOB-SONETO] já instalado'); return; }
  window.KOB_SONETO_BUNDLE = '1.0';

  /* ════════ 1. SPEECH PIPELINE (registro de estágios) ════════ */
  if (!window.KOB_SPEECH && 'speechSynthesis' in window) {
    var ss = window.speechSynthesis, native = ss.speak.bind(ss), stages = [];
    var at = function(i){ return function(u){ return i < stages.length ? stages[i].run(u, at(i+1)) : native(u); }; };
    window.KOB_SPEECH = {
      use: function(name, order, run){ stages = stages.filter(function(s){ return s.name !== name; }); stages.push({name:name,order:order,run:run}); stages.sort(function(a,b){return a.order-b.order;}); return true; },
      has: function(name){ return stages.some(function(s){ return s.name === name; }); },
      list: function(){ return stages.map(function(s){ return s.name+':'+s.order; }); }
    };
    ss.speak = function(u){ return at(0)(u); };
  }

  /* ════════ 2. CHUNKER (evita corte do Chrome em >15s) ════════ */
  window.KOB_TTS_CHUNK = window.KOB_TTS_CHUNK || function(txt, max){
    max = max || 220;
    var atoms = [];
    function hard(s){
      var cur = '', ws = s.split(' ');
      for (var i = 0; i < ws.length; i++){
        var w = ws[i];
        if (w.length > max){ if (cur){ atoms.push(cur); cur = ''; } for (var k = 0; k < w.length; k += max) atoms.push(w.slice(k, k+max)); continue; }
        if ((cur ? cur.length+1 : 0) + w.length > max){ atoms.push(cur); cur = w; } else cur = cur ? cur+' '+w : w;
      }
      if (cur) atoms.push(cur);
    }
    String(txt == null ? '' : txt).split(/\n+/).forEach(function(line){
      line = line.replace(/\s+/g,' ').trim(); if (!line) return;
      line.split(/(?<=[.!?…;:])\s+/).forEach(function(sent){
        if (sent.length <= max){ atoms.push(sent); return; }
        sent.split(/(?<=[,)\]—–])\s+/).forEach(function(part){
          if (part.length <= max) atoms.push(part); else hard(part);
        });
      });
    });
    var out = [], buf = '';
    atoms.forEach(function(a){ if (buf && buf.length+1+a.length > max){ out.push(buf); buf = a; } else buf = buf ? buf+' '+a : a; });
    if (buf) out.push(buf);
    return out;
  };

  /* ════════ 3. 17 ARQUÉTIPOS (compacto) ════════ */
  var ARC = {
    ATLAS:   {n:'Atlas',    v:'Daniel',  l:'en-US', r:1.02,  p:1.39,  c1:'#78e3ff', c2:'#b978ff'},
    NOVA:    {n:'Nova',     v:'Luciana', l:'pt-BR', r:1.063, p:1.34,  c1:'#ff6b6b', c2:'#ffb347'},
    VITALIS: {n:'Vitalis',  v:'Rocko',   l:'pt-BR', r:0.96,  p:1.42,  c1:'#4ecdc4', c2:'#45b7d1'},
    PULSE:   {n:'Pulse',    v:'Reed',    l:'pt-BR', r:1.00,  p:1.78,  c1:'#a8e6cf', c2:'#d4a5a5'},
    ARTEMIS: {n:'Artemis',  v:'Paulina', l:'es-MX', r:1.00,  p:1.23,  c1:'#ffd93d', c2:'#ff9f1c'},
    SERENA:  {n:'Serena',   v:'Joana',   l:'pt-BR', r:0.92,  p:0.90,  c1:'#b8e1ff', c2:'#a0b9ff'},
    KAOS:    {n:'Kaos',     v:'Rocko',   l:'pt-BR', r:1.28,  p:0.67,  c1:'#ff8066', c2:'#b624ff'},
    GENUS:   {n:'Genus',    v:'Reed',    l:'pt-BR', r:0.98,  p:1.20,  c1:'#95e1d3', c2:'#f38181'},
    LUMINE:  {n:'Lumine',   v:'Flo',     l:'fr-FR', r:1.03,  p:1.87,  c1:'#f9f3b2', c2:'#ffe69b'},
    SOLUS:   {n:'Solus',    v:'Satu',    l:'fi-FI', r:0.90,  p:0.58,  c1:'#ffb347', c2:'#ff8c42'},
    RHEA:    {n:'Rhea',     v:'Alice',   l:'it-IT', r:1.02,  p:1.44,  c1:'#b5eaea', c2:'#80b3ff'},
    AION:    {n:'Aion',     v:'Milena',  l:'ru-RU', r:1.07,  p:1.08,  c1:'#c79aff', c2:'#9f7aff'},
    KODUX:   {n:'Kodux',    v:'Rocko',   l:'pt-BR', r:1.00,  p:0.07,  c1:'#F97316', c2:'#fb923c'},
    BLLUE:   {n:'Bllue',    v:'Zuzana',  l:'cs-CZ', r:0.94,  p:1.69,  c1:'#8fd3ff', c2:'#b8e1ff'},
    JESUS:   {n:'Jesus',    v:'Sara',    l:'da-DK', r:1.09,  p:0.03,  c1:'#FFD700', c2:'#FFB84D'},
    KOBLLUX: {n:'KOBLLUX',  v:'Luciana', l:'pt-BR', r:0.98,  p:0.48,  c1:'#22D3EE', c2:'#0E7C9E'},
    INFODOSE:{n:'Infodose', v:'Luciana', l:'pt-BR', r:1.06,  p:0.96,  c1:'#22C55E', c2:'#166534'}
  };
  var ARCH_LIST = Object.keys(ARC);

  /* ════════ 4. VOZES ════════ */
  var voices = [];
  function loadVoices(){ voices = ('speechSynthesis' in window) ? speechSynthesis.getVoices() : []; }
  if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; setTimeout(loadVoices, 400); }
  var norm = function(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); };
  function findVoice(cfg){
    if (!voices.length) loadVoices();
    var n = norm(cfg.v || cfg.nome || ''), l = norm(cfg.l || cfg.lang || '').split('-')[0];
    return voices.find(function(v){ return norm(v.name).includes(n) && norm(v.lang).startsWith(l); })
        || voices.find(function(v){ return norm(v.lang).startsWith(l); })
        || voices.find(function(v){ return norm(v.lang).startsWith('pt'); })
        || voices[0] || null;
  }
  function forArch(name, text){
    var cfg = ARC[String(name||'KOBLLUX').toUpperCase()] || ARC.KOBLLUX;
    var u = new SpeechSynthesisUtterance(text || '');
    u.lang = cfg.l; u.rate = cfg.r; u.pitch = cfg.p;
    var v = findVoice(cfg);
    if (v){ u.voice = v; u.lang = v.lang || cfg.l; }
    return u;
  }
  window.KBLX_VOICE = window.KBLX_VOICE || { map: ARC, find: findVoice, forArch: forArch };

  /* ════════ 5. CORES (KOBLayers) ════════ */
  var root = document.documentElement;
  var voice = 'KOBLLUX';
  function hexToRgb(h){ h = String(h).replace('#',''); if (h.length===3) h=h.split('').map(function(c){return c+c}).join(''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
  function mix(a,b,t){ var A=hexToRgb(a),B=hexToRgb(b); return '#'+A.map(function(v,i){ var x=Math.round(v+(B[i]-v)*t); return x.toString(16).padStart(2,'0'); }).join(''); }
  function applyLayers(userArch, activeArch){
    var U = ARC[String(userArch||'KOBLLUX').toUpperCase()] || ARC.KOBLLUX;
    var A = ARC[String(activeArch||userArch||'KOBLLUX').toUpperCase()] || U;
    root.style.setProperty('--kob-L-primary',   mix(U.c1, U.c2, 0.35));
    root.style.setProperty('--kob-L-secondary', mix(A.c1, A.c2, 0.35));
    root.style.setProperty('--kob-L-u1', U.c1); root.style.setProperty('--kob-L-u2', U.c2);
    root.style.setProperty('--kob-L-a1', A.c1); root.style.setProperty('--kob-L-a2', A.c2);
    root.style.setProperty('--kob-voice-primary', U.c1);
    root.style.setProperty('--kob-voice-secondary', A.c1);
    root.style.setProperty('--kob-blob-primary', U.c1);
    root.style.setProperty('--kob-blob-secondary', A.c2);
    root.style.setProperty('--active-color', U.c1);
    root.style.setProperty('--active-secondary', A.c1);
    root.style.setProperty('--active-glow', mix(U.c1, '#000000', 0.6));
  }
  function setArch(name){
    name = String(name||'KOBLLUX').toUpperCase();
    if (!ARC[name]) name = 'KOBLLUX';
    voice = name;
    document.body.setAttribute('data-arch', name.toLowerCase());
    document.body.setAttribute('data-voice-arch', name.toLowerCase());
    applyLayers(name, name);
    try { window.dispatchEvent(new CustomEvent('kob:arch', { detail: { arch: name } })); } catch(e){}
    paint();
    return name;
  }
  window.applyArch = window.applyArch || function(n){ return setArch(n); };

  /* ════════ 6. TONE.JS LAZY LOAD ════════ */
  var tonePromise = null;
  window.KOBLoadTone = window.KOBLoadTone || function(){
    if (typeof Tone !== 'undefined' && Tone) return Promise.resolve(Tone);
    if (tonePromise) return tonePromise;
    tonePromise = new Promise(function(res){
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js';
      s.onload = function(){ setTimeout(function(){ res(window.Tone || null); }, 100); };
      s.onerror = function(){ tonePromise = null; res(null); };
      document.head.appendChild(s);
    });
    return tonePromise;
  };

  /* ════════ 7. MOTOR SONORO (escalas + playback) ════════ */
  var SONORO_SCALES = {
    melancolia: ['A3','B3','C4','D4','E4','F4','G#4','A4','B4','C5','D5','E5','F5','G#5','A5'],
    alegria:    ['C4','D4','E4','G4','A4','C5','D5','E5','G5','A5','C6','D6','E6','G6','A6'],
    misterio:   ['C4','D4','E4','F#4','G#4','A#4','C5','D5','E5','F#5','G#5','A#5','C6','D6','E6'],
    sonho:      ['F3','G3','A3','B3','C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F5'],
    oriental:   ['A3','A#3','D4','E4','F4','A4','A#4','D5','E5','F5','A5']
  };
  var KOB_MODES = {ionian:[0,2,4,5,7,9,11],dorian:[0,2,3,5,7,9,10],phrygian:[0,1,3,5,7,8,10],lydian:[0,2,4,6,7,9,11],mixolydian:[0,2,4,5,7,9,10],aeolian:[0,2,3,5,7,8,10],harmMinor:[0,2,3,5,7,8,11],pentMaj:[0,2,4,7,9],pentMin:[0,3,5,7,10],blues:[0,3,5,6,7,10],hirajoshi:[0,2,3,7,8]};
  var KOB_ARCH_MUSIC = {
    ATLAS:['dorian','triangle',.55], NOVA:['lydian','sine',.6], VITALIS:['mixolydian','triangle',.45],
    PULSE:['pentMin','square',.3], ARTEMIS:['aeolian','sine',.65], SERENA:['pentMaj','sine',.7],
    KAOS:['phrygian','triangle',.6], GENUS:['harmMinor','sine',.59], LUMINE:['ionian','triangle',.5],
    SOLUS:['hirajoshi','sine',.8], RHEA:['mixolydian','sine',.55], AION:['harmMinor','sine',.7],
    KODUX:['phrygian','sawtooth',.47], BLLUE:['blues','triangle',.5], JESUS:['ionian','sine',.75],
    KOBLLUX:['dorian','triangle',.5], INFODOSE:['mixolydian','sine',.55]
  };
  var SON_ALPHA = 'abcdefghijklmnopqrstuvwxyzáàãâéêíóôõúçñ';
  var sonoro = { started: false, playing: false, part: null, synths: {}, reverb: null, delay: null };

  async function ensureAudio(){
    if (sonoro.started) return true;
    await window.KOBLoadTone();
    if (typeof Tone === 'undefined' || !Tone) return false;
    try { await Tone.start(); } catch(e){}
    try {
      var lim = new Tone.Limiter(-2).toDestination();
      sonoro.reverb = new Tone.Reverb({decay:3.5, wet:0.4}).connect(lim);
      sonoro.delay  = new Tone.FeedbackDelay('8n', 0.25).connect(sonoro.reverb);
      sonoro.synths.lead = new Tone.PolySynth(Tone.Synth, {oscillator:{type:'triangle'}, envelope:{attack:.02,decay:.3,sustain:.2,release:1.2}}).connect(sonoro.delay);
      sonoro.synths.lead.volume.value = -8;
      sonoro.synths.pad = new Tone.PolySynth(Tone.Synth, {oscillator:{type:'triangle'}, envelope:{attack:.35,decay:.4,sustain:.55,release:1.8}}).connect(sonoro.reverb);
      sonoro.synths.pad.volume.value = -27;
      sonoro.synths.bubble = new Tone.Synth({oscillator:{type:'sine'}, envelope:{attack:.01,decay:.15,sustain:0,release:.2}}).connect(sonoro.reverb);
      sonoro.synths.crystal = new Tone.PolySynth(Tone.FMSynth, {harmonicity:3, modulationIndex:6, envelope:{attack:.005,decay:.4,sustain:0,release:1.2}}).connect(sonoro.reverb);
      sonoro.synths.impact = new Tone.MembraneSynth({pitchDecay:.05, octaves:4, envelope:{attack:.001,decay:.3,sustain:0,release:.4}}).connect(lim);
      sonoro.synths.noise = new Tone.NoiseSynth({noise:{type:'white'}, envelope:{attack:.001,decay:.2,sustain:0,release:.3}}).connect(sonoro.reverb);
      sonoro.synths.portal = new Tone.Synth({oscillator:{type:'sawtooth'}, envelope:{attack:.15,decay:.4,sustain:.2,release:.8}}).connect(sonoro.delay);
      sonoro.started = true;
      return true;
    } catch(e){ console.warn('[KOB-SONETO] audio err', e); return false; }
  }

  function mtof(m){ return 440 * Math.pow(2, (m-69)/12); }

  function parseEvents(text){
    var cfg = KOB_ARCH_MUSIC[voice] || KOB_ARCH_MUSIC.KOBLLUX;
    var base = SONORO_SCALES.melancolia;
    var rootMidi = Tone.Frequency(base[0]).toMidi();
    var mode = KOB_MODES[cfg[0]] || KOB_MODES.dorian;
    var notes = [];
    for (var i = 0; i < 15; i++) notes.push(Tone.Frequency(rootMidi + Math.floor(i/mode.length)*12 + mode[i%mode.length], 'midi').toNote());
    var evs = []; var inQuote = false; var step = 0; var SD = Tone.Time('16n').toSeconds();
    for (var i = 0; i < text.length; i++){
      var ch = text[i], lo = ch.toLowerCase();
      if (ch === '"' || ch === '“' || ch === '”' || ch === "'"){ inQuote = !inQuote; step += 1; continue; }
      if (ch === ' ' || ch === '\n'){ step += ch === '\n' ? 3 : 1; continue; }
      if (ch === '.' || ch === '!' || ch === '?'){ evs.push({t: step*SD, type:'rest', d:'4n'}); step += 4; continue; }
      if (ch === ',' || ch === ';'){ step += 2; continue; }
      var ai = SON_ALPHA.indexOf(lo);
      if (ai !== -1){
        var mi = ai % notes.length;
        var note = notes[mi];
        evs.push({t: step*SD, type:'note', note: note, d: ch === ch.toUpperCase() ? '8n' : '16n', chord: ch === ch.toUpperCase()});
        step += ch === ch.toUpperCase() ? 1.8 : 1.4;
      }
    }
    return evs;
  }

  async function startSonoro(){
    var ok = await ensureAudio(); if (!ok) return;
    var text = window.KOBActive ? window.KOBActive.text : '';
    if (!text) { toast('▣ Selecione/abra um documento primeiro'); return; }
    if (sonoro.playing) { stopSonoro(); return; }
    try { Tone.Transport.stop(); Tone.Transport.cancel(0); } catch(e){}
    var cfg = KOB_ARCH_MUSIC[voice] || KOB_ARCH_MUSIC.KOBLLUX;
    try { sonoro.reverb.wet.rampTo(cfg[2], 0.4); } catch(e){}
    var evs = parseEvents(text);
    if (!evs.length) return;
    sonoro.part = new Tone.Part(function(time, ev){
      if (ev.type === 'note'){
        try { sonoro.synths.lead.triggerAttackRelease(mtof(Tone.Frequency(ev.note).toMidi()), ev.d, time); } catch(e){}
      }
    }, evs).start(0);
    Tone.Transport.bpm.value = 130;
    Tone.Transport.start();
    sonoro.playing = true;
    toast('▶ Trilha: ' + voice);
    document.getElementById('kob-soneto-music').classList.add('playing');
  }
  function stopSonoro(){
    if (sonoro.part){ try { sonoro.part.dispose(); } catch(e){} sonoro.part = null; }
    try { Tone.Transport.stop(); Tone.Transport.cancel(0); } catch(e){}
    try { Object.keys(sonoro.synths).forEach(function(k){ sonoro.synths[k].releaseAll && sonoro.synths[k].releaseAll(); }); } catch(e){}
    sonoro.playing = false;
    document.getElementById('kob-soneto-music').classList.remove('playing');
    toast('⏸ Trilha parada');
  }

  /* ════════ 8. MELODIAS POR ARQUÉTIPO ════════ */
  var SIG = {
    ATLAS:   [57,[0,4,7,12,7,4],      0.12, 0.09, 'triangle'],
    NOVA:    [57,[0,7,11,16,11],      0.15, 0.08, 'sine'    ],
    VITALIS: [57,[0,7,4,0,-5],        0.10, 0.05, 'triangle'],
    PULSE:   [45,[0,3,7,10,7,3],      0.12, 0.06, 'square'  ],
    ARTEMIS: [45,[0,3,7,12,15],       0.14, 0.08, 'sine'    ],
    SERENA:  [57,[0,4,9,14,9,4],      0.16, 0.10, 'sine'    ],
    KAOS:    [33,[0,1,3,8,3,1,0],     0.09, 0.04, 'sawtooth'],
    GENUS:   [45,[0,3,7,8,7,3],       0.13, 0.08, 'sine'    ],
    LUMINE:  [57,[0,4,9,12,16,12],    0.11, 0.06, 'triangle'],
    SOLUS:   [45,[0,2,7,2,-5],        0.20, 0.14, 'sine'    ],
    RHEA:    [57,[0,5,7,12,7,5,0],    0.13, 0.09, 'sine'    ],
    AION:    [45,[0,3,8,12,8,3],      0.14, 0.09, 'sine'    ],
    KODUX:   [33,[0,3,6,3,0,-5],      0.10, 0.05, 'sawtooth'],
    BLLUE:   [45,[0,3,7,6,3,0],       0.12, 0.07, 'triangle'],
    JESUS:   [57,[0,7,12,19,12],      0.22, 0.16, 'sine'    ],
    KOBLLUX: [57,[0,3,7,10,14,10],    0.15, 0.09, 'triangle'],
    INFODOSE:[57,[0,2,5,7,9,12,9],    0.11, 0.06, 'sine'    ]
  };
  async function transition(arch){
    var a = String(arch||voice).toUpperCase();
    var sig = SIG[a] || SIG.KOBLLUX;
    var ok = await ensureAudio(); if (!ok) return;
    try { sonoro.synths.lead.set({oscillator:{type:sig[4]}}); } catch(e){}
    try { sonoro.synths.lead.releaseAll(Tone.now()); } catch(e){}
    var t = Tone.now() + 0.05;
    sig[1].forEach(function(off){
      var f = mtof(sig[0] + off);
      try { sonoro.synths.lead.triggerAttackRelease(f, sig[2], t); } catch(e){}
      t += sig[3];
    });
  }

  /* ════════ 9. SFX (sons de interface) ════════ */
  async function sfx(desc){
    var ok = await ensureAudio(); if (!ok) return;
    var d = String(desc||'').toLowerCase(); var now = Tone.now();
    try {
      if (/bolha|bubble|gota|pingo/.test(d)){ var b = 600 + Math.random()*400; sonoro.synths.bubble.triggerAttackRelease(b, .12, now); sonoro.synths.bubble.triggerAttackRelease(b*1.5, .1, now+.08); }
      else if (/cristal|crystal|vidro|sino/.test(d)){ [800,1200,1600].forEach(function(f,i){ sonoro.synths.crystal.triggerAttackRelease(f, .3, now+i*.04); }); }
      else if (/impacto|impact|pancada|thud|boom/.test(d)){ sonoro.synths.impact.triggerAttackRelease('C1', .2, now); }
      else if (/sopro|whoosh|ruído|noise/.test(d)){ sonoro.synths.noise.triggerAttackRelease(.25, now); }
      else if (/portal|transição|transition/.test(d)){ sonoro.synths.portal.frequency.cancelScheduledValues(now); sonoro.synths.portal.frequency.setValueAtTime(200, now); sonoro.synths.portal.frequency.exponentialRampToValueAtTime(1800, now+.5); sonoro.synths.portal.triggerAttackRelease('A3', .4, now); }
      else { sonoro.synths.bubble.triggerAttackRelease(800, .1, now); sonoro.synths.bubble.triggerAttackRelease(1200, .1, now+.08); }
    } catch(e){}
  }

  /* ════════ 10. TTS OUTLINE + BLOCOS ════════ */
  var outline = document.getElementById('kob-soneto-outline');
  var blocks = [], curBlock = 0, speaking = false, speakingAll = false, gen = 0, tk = 0, chunkIdx = 0, chunkList = [], inFlight = false, lastBeat = 0;
  var outlineSyncInstalled = false;
  function hideOutline(){ if (outline){ outline.style.display = 'none'; } }
  function showOutline(el){
    if (!outline || !el) return;
    try {
      var r = el.getBoundingClientRect();
      if (r.top + r.height < 0 || r.top > innerHeight){ outline.style.display = 'none'; return; }
      outline.style.left = (r.left-4) + 'px';
      outline.style.top  = (r.top-4) + 'px';
      outline.style.width = (r.width+8) + 'px';
      outline.style.height = (r.height+8) + 'px';
      outline.style.display = 'block';
      if (!outlineSyncInstalled){ outlineSyncInstalled = true; window.addEventListener('scroll', function(){ if (outline.style.display !== 'none') hideOutline(); }, {passive:true, capture:true}); window.addEventListener('resize', function(){ if (outline.style.display !== 'none') hideOutline(); }, {passive:true}); }
    } catch(e){}
  }
  function scanBlocks(){
    var root = document.querySelector('#kob-soneto-mount, #kd-inject-target, #readerBody, main, article') || document.body;
    var sel = 'h1,h2,h3,h4,p,li,blockquote,pre,td,th';
    blocks = Array.prototype.slice.call(root.querySelectorAll(sel)).filter(function(n){ return (n.innerText||'').trim().length > 0; });
    curBlock = 0;
    return blocks;
  }
  function sanitize(t){ return String(t||'').replace(/\bCopiar\b/g,' ').replace(/\s{2,}/g,' ').trim(); }
  function speakBlock(el, fromChunk){
    if (!speaking) return;
    if (!blocks.length) scanBlocks();
    var idx = blocks.indexOf(el);
    if (idx < 0) idx = curBlock;
    curBlock = idx;
    var txt = sanitize(el && el.innerText ? el.innerText : '');
    if (!txt){ curBlock++; if (curBlock >= blocks.length) stopSpeak(); else speakBlock(blocks[curBlock], 0); return; }
    chunkList = window.KOB_TTS_CHUNK(txt, 220);
    chunkIdx = fromChunk || 0;
    _speakChunk();
  }
  function _speakChunk(){
    if (!speaking || chunkIdx >= chunkList.length){
      if (chunkIdx >= chunkList.length){ curBlock++; if (curBlock >= blocks.length){ stopSpeak(); return; } speakBlock(blocks[curBlock], 0); }
      return;
    }
    var u = forArch(voice, chunkList[chunkIdx]);
    u.onstart = function(){ if (chunkIdx === 0) showOutline(blocks[curBlock]); };
    u.onend = function(){ if (!speaking) return; chunkIdx++; setTimeout(_speakChunk, 60); };
    u.onerror = function(ev){ if (!speaking) return; if (ev && (ev.error === 'interrupted' || ev.error === 'canceled')) return; chunkIdx++; setTimeout(_speakChunk, 100); };
    try { speechSynthesis.speak(u); } catch(e){}
  }
  function startSpeak(){
    if (!blocks.length) scanBlocks();
    if (!blocks.length){ toast('▣ Nenhum bloco para ler'); return; }
    if (speaking){ stopSpeak(); return; }
    gen++; speaking = true;
    try { speechSynthesis.cancel(); } catch(e){}
    document.getElementById('kob-soneto-tts').classList.add('playing');
    setTimeout(function(){ speakBlock(blocks[curBlock], 0); }, 60);
  }
  function stopSpeak(){
    gen++; speaking = false;
    try { speechSynthesis.cancel(); } catch(e){}
    document.getElementById('kob-soneto-tts').classList.remove('playing');
    hideOutline();
  }
  function nextBlock(){ if (!blocks.length) scanBlocks(); curBlock = Math.min(blocks.length-1, curBlock+1); if (speaking){ stopSpeak(); startSpeak(); } else showOutline(blocks[curBlock]); }
  function prevBlock(){ if (!blocks.length) scanBlocks(); curBlock = Math.max(0, curBlock-1); if (speaking){ stopSpeak(); startSpeak(); } else showOutline(blocks[curBlock]); }

  /* ════════ 11. HEADER (KOBActive) ════════ */
  var active = { title: '', text: '' };
  function paint(){
    var sh = document.getElementById('kob-soneto-short'); if (!sh) return;
    var LIM = 16;
    var short = active.title && active.title.length > LIM ? active.title.slice(0, LIM-1) + '…' : (active.title || 'KOBLLUX');
    sh.textContent = short;
    var full = document.getElementById('kob-soneto-full'); if (full) full.textContent = active.title || '';
    var holo = document.getElementById('kob-soneto-holo');
    if (holo){ var ha = holo.querySelector('.ha'); if (ha) ha.textContent = voice + ' · ' + (KOB_ARCH_MUSIC[voice]||['dorian','triangle',.5])[0]; }
  }
  function holo(kind, idx, text){
    var title = document.getElementById('kob-soneto-title');
    var el = document.querySelector('#kob-soneto-holo ' + (kind==='m' ? '.hm' : '.ht'));
    if (!title || !el || !text) return;
    var a = idx, b = idx;
    while (a > 0 && text[a-1] !== ' ' && text[a-1] !== '\n') a--;
    var s = Math.max(0, a-12), e = Math.min(text.length, idx+22);
    el.textContent = (kind==='m'?'♫ ':'🗣 ') + text.slice(s, e).replace(/\s+/g, ' ');
    title.classList.add('holo-on');
    clearTimeout(holo._t); holo._t = setTimeout(function(){ title.classList.remove('holo-on'); }, 2600);
  }

  /* ════════ 12. WIRE BOTÕES ════════ */
  function toast(msg){ if (window.KBLX_TOAST) { try { KBLX_TOAST(msg); } catch(e){} } else { console.log('[KOB-SONETO]', msg); } }

  document.getElementById('kob-soneto-tts').addEventListener('click', startSpeak);
  document.getElementById('kob-soneto-music').addEventListener('click', startSonoro);
  document.getElementById('kob-soneto-copy').addEventListener('click', async function(){
    var t = active.text || '';
    if (!t){ toast('▣ Sem documento ativo'); return; }
    try { await navigator.clipboard.writeText(t); toast('⧉ Copiado'); } catch(e){ toast('❌ Erro'); }
  });
  document.getElementById('kob-soneto-dl').addEventListener('click', function(){
    var t = active.text || '';
    if (!t){ toast('▣ Sem documento ativo'); return; }
    var blob = new Blob([t], {type:'text/plain;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (active.title || 'kob-soneto').replace(/[^\w\-]+/g,'_') + '.txt';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
    toast('⤓ Baixado');
  });
  document.getElementById('kob-soneto-arch-btn').addEventListener('click', function(){
    var i = ARCH_LIST.indexOf(voice);
    setArch(ARCH_LIST[(i+1) % ARCH_LIST.length]);
    toast('◐ ' + voice);
  });
  document.getElementById('kob-soneto-theme').addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('kobllux-theme', next); } catch(e){}
    toast('◑ Tema: ' + next);
  });

  /* clique no texto → TTS (modo texto) */
  document.addEventListener('click', function(e){
    var t = e.target;
    if (t.closest && t.closest('#kob-soneto-header, #kob-soneto-mount, #kob-soneto-mount *, button, input, textarea, select, a')) return;
    var blk = t.closest && t.closest('p, li, h1, h2, h3, h4, blockquote, pre, td, th');
    if (!blk) return;
    scanBlocks();
    var idx = blocks.indexOf(blk);
    if (idx >= 0){ curBlock = idx; showOutline(blk); }
    if (!speaking){ speaking = true; document.getElementById('kob-soneto-tts').classList.add('playing'); speakBlock(blk, 0); }
  }, true);

  /* marquee ao tocar */
  document.addEventListener('animationend', function(e){
    if (e.target && e.target.id === 'kob-soneto-full'){ document.getElementById('kob-soneto-title').classList.remove('mq'); }
  });

  /* hook no KOB_SPEECH para carimbar a voz do arquétipo (opcional, garante que qualquer utterance pase pelo forArch) */
  if (window.KOB_SPEECH && !KOB_SPEECH.has('soneto-arch')) {
    KOB_SPEECH.use('soneto-arch', 40, function(u, next){
      if (u && u.text && !u.voice){
        var v = findVoice(ARC[voice] || ARC.KOBLLUX);
        if (v){ u.voice = v; u.lang = v.lang || (ARC[voice]||ARC.KOBLLUX).l; }
      }
      return next(u);
    });
  }

  /* carregar doc ativo (interface com KOBActive ou via window.kobSetActiveDoc) */
  window.kobSetActiveDoc = function(title, text){
    active.title = String(title||'');
    active.text = String(text||'');
    paint();
    scanBlocks();
    toast('▣ ' + (active.title || 'documento'));
  };
  if (window.KOBActive) { active.title = KOBActive.title; active.text = KOBActive.text; }

  /* ════════ 13. VISUALIZADOR (pulso de cor) ════════ */
  function mountViz(){
    if (document.getElementById('kob-soneto-viz')) return;
    var viz = document.createElement('div');
    viz.id = 'kob-soneto-viz';
    viz.innerHTML = '<canvas width="192" height="32"></canvas>';
    viz.title = 'Visualizador de cor · ' + voice;
    viz.addEventListener('click', function(){ setArch(ARCH_LIST[(ARCH_LIST.indexOf(voice)+1) % ARCH_LIST.length]); });
    var hdr = document.getElementById('kob-soneto-header');
    if (hdr) hdr.appendChild(viz);
  }
  function drawViz(){
    var c = document.querySelector('#kob-soneto-viz canvas'); if (!c) return;
    var ctx = c.getContext('2d'); var w = c.width, h = c.height;
    ctx.clearRect(0,0,w,h);
    var cfg = ARC[voice] || ARC.KOBLLUX;
    var grad = ctx.createLinearGradient(0,0,w,0);
    grad.addColorStop(0, cfg.c1 + '22'); grad.addColorStop(.5, cfg.c1); grad.addColorStop(1, cfg.c2 + '22');
    ctx.strokeStyle = grad; ctx.lineWidth = 1.5; ctx.beginPath();
    for (var x = 0; x <= w; x += 2){ var y = h/2 + (h/2-3) * 0.5 * Math.sin(x*0.15 + Date.now()*0.004); if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
    ctx.stroke();
  }
  setInterval(drawViz, 80);

  /* ════════ 14. LOADING BAR ════════ */
  var busy = 0, showT;
  window.KOB_LOADING = function(on){
    busy += on ? 1 : -1; if (busy < 0) busy = 0;
    clearTimeout(showT);
    var bar = document.getElementById('kob-soneto-load');
    if (busy > 0){ showT = setTimeout(function(){ bar.classList.add('on'); }, 250); } else { bar.classList.remove('on'); }
  };
  ['readAsText','readAsArrayBuffer','readAsDataURL'].forEach(function(fn){
    var o = FileReader.prototype[fn];
    FileReader.prototype[fn] = function(){ window.KOB_LOADING(true); this.addEventListener('loadend', function(){ window.KOB_LOADING(false); }, {once:true}); return o.apply(this, arguments); };
  });

  /* ════════ 15. BOOT ════════ */
  setArch(voice); paint(); mountViz(); scanBlocks();
  window.addEventListener('load', function(){ setTimeout(scanBlocks, 400); });
  // carregar tema salvo
  try { var t = localStorage.getItem('kobllux-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch(e){}

  /* API pública */
  window.KOBSoneto = {
    version: '1.0',
    get arch(){ return voice; },
    setArch: setArch, list: function(){ return ARCH_LIST.slice(); },
    speak: function(txt){ var u = forArch(voice, txt); speechSynthesis.cancel(); speechSynthesis.speak(u); },
    start: startSpeak, stop: stopSpeak, next: nextBlock, prev: prevBlock,
    play: startSonoro, stopMusic: stopSonoro,
    transition: transition, sfx: sfx,
    setDoc: window.kobSetActiveDoc,
    get doc(){ return {title: active.title, text: active.text}; },
    holo: holo
  };
  console.log('%c[KOB-SONETO] ✓ bundle v1.0 · 17 arquétipos · TTS + Sonoro + Cores + Sons',
    'background:#22d3ee;color:#000;padding:2px 8px;border-radius:3px');
})();
</script>
