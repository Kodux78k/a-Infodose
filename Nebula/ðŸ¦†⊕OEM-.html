<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Espaço da Mente · Fractal 369</title>

<style>

:root{
  --bg:#05060a;
  --glass:rgba(255,255,255,.04);
  --border:rgba(255,255,255,.08);
  --text:#e8e8f0;
  --muted:#8a8aa3;
  --glow:#7b61ff;
  --glow2:#00f5ff;

  --z-base:0;
  --z-content:100;
  --z-widget:500;
  --z-overlay:1000;
  --z-system:5000;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  min-height:100%;
  background:var(--bg);
}

body{
  background:var(--bg);
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  min-height:100vh;

  overflow-x:hidden;

  display:flex;
  flex-direction:column;
  align-items:center;

  padding:
    calc(40px + env(safe-area-inset-top))
    20px
    calc(40px + env(safe-area-inset-bottom));
}


/* =========================================================
   FUNDO
========================================================= */

.blob{
  position:fixed;

  border-radius:50%;

  filter:blur(80px);

  opacity:.4;

  animation:
    float 20s ease-in-out infinite;

  pointer-events:none;

  z-index:var(--z-base);
}

.blob1{
  width:400px;
  height:400px;

  background:var(--glow);

  top:-100px;
  left:-100px;
}

.blob2{
  width:300px;
  height:300px;

  background:var(--glow2);

  bottom:-80px;
  right:-80px;

  animation-delay:5s;
}

@keyframes float{

  0%,100%{
    transform:
      translate(0,0)
      scale(1);
  }

  50%{
    transform:
      translate(30px,-30px)
      scale(1.1);
  }

}


/* =========================================================
   APP
========================================================= */

.dual-app{
  width:100%;
  min-height:100vh;

  position:relative;

  z-index:var(--z-content);
}


/* =========================================================
   HEADER GLOBAL
========================================================= */

.topbar{
  width:100%;
  max-width:520px;

  min-height:48px;

  margin:0 auto 20px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:8px 12px;

  background:var(--glass);

  border:1px solid var(--border);

  border-radius:18px;

  backdrop-filter:blur(20px);
}

.brand{
  display:flex;

  align-items:center;

  gap:8px;

  font-size:12px;

  font-weight:700;

  letter-spacing:1.5px;
}

.badge{
  padding:4px 7px;

  border:1px solid var(--border);

  border-radius:7px;

  color:var(--muted);

  font-size:8px;

  letter-spacing:1px;
}

.theme-dot{
  width:32px;
  height:32px;

  display:grid;

  place-items:center;

  padding:0;

  border:1px solid var(--border);

  border-radius:10px;

  background:rgba(255,255,255,.035);

  color:var(--muted);

  cursor:pointer;
}


/* =========================================================
   MAIN
========================================================= */

#main-content{
  width:100%;
}

.content{
  width:100%;
}

.wrap{
  width:100%;

  max-width:520px;

  margin:0 auto;

  position:relative;

  z-index:var(--z-content);

  display:flex;

  flex-direction:column;

  gap:16px;
}


/* =========================================================
   TÍTULO
========================================================= */

.title{
  font-size:28px;

  font-weight:200;

  letter-spacing:-1px;

  text-align:center;

  margin-bottom:10px;
}

.sub{
  font-size:12px;

  color:var(--muted);

  text-align:center;

  margin-bottom:20px;

  text-transform:uppercase;

  letter-spacing:2px;
}


/* =========================================================
   DETAILS / SESSÕES
========================================================= */

.collapse-section{

  width:100%;

  background:var(--glass);

  border:1px solid var(--border);

  border-radius:24px;

  overflow:hidden;

  backdrop-filter:blur(20px);

  transition:
    border-color .25s,
    box-shadow .25s,
    background .25s;
}

.collapse-section[open]{

  border-color:
    rgba(123,97,255,.35);

  box-shadow:
    0 0 28px
    rgba(123,97,255,.08);
}


/* =========================================================
   SUMMARY / BARRA MXP
========================================================= */

.collapse-summary{

  min-height:58px;

  display:flex;

  align-items:center;

  gap:10px;

  padding:10px 10px 10px 13px;

  cursor:pointer;

  list-style:none;

  user-select:none;

  -webkit-tap-highlight-color:transparent;
}

.collapse-summary::-webkit-details-marker{
  display:none;
}

.collapse-summary::marker{
  display:none;
  content:"";
}


/* =========================================================
   IDENTIDADE DA SESSÃO
========================================================= */

.summary-left{

  min-width:0;

  flex:1;

  display:flex;

  align-items:center;

  gap:10px;
}

.summary-index{

  width:30px;
  height:30px;

  flex:0 0 30px;

  display:grid;

  place-items:center;

  border:1px solid var(--border);

  border-radius:10px;

  background:
    rgba(255,255,255,.035);

  color:var(--glow);

  font-size:9px;

  font-weight:700;

  letter-spacing:1px;
}

.summary-info{

  min-width:0;
}

.summary-title{

  font-size:11px;

  font-weight:700;

  letter-spacing:1.4px;

  text-transform:uppercase;

  color:var(--text);
}

.summary-sub{

  margin-top:3px;

  color:var(--muted);

  font-size:9px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* =========================================================
   AÇÕES RÁPIDAS MXP
========================================================= */

.summary-actions{

  display:flex;

  align-items:center;

  gap:5px;

  flex-shrink:0;
}

.mxp-action{

  width:32px;
  height:32px;

  display:grid;

  place-items:center;

  padding:0;

  appearance:none;

  border:1px solid var(--border);

  border-radius:9px;

  background:
    rgba(255,255,255,.035);

  color:var(--muted);

  font-family:inherit;

  font-size:15px;

  font-weight:600;

  line-height:1;

  cursor:pointer;

  transition:
    background .2s,
    border-color .2s,
    color .2s,
    transform .15s;
}

.mxp-action:hover{

  color:var(--text);

  border-color:var(--glow);

  background:
    rgba(255,255,255,.08);
}

.mxp-action:active{
  transform:scale(.9);
}

.mxp-action[data-action="import"]{
  font-size:18px;
}

.mxp-action[data-action="paste"]{
  font-size:16px;
}


/* =========================================================
   CHEVRON
========================================================= */

.summary-chevron{

  width:32px;
  height:32px;

  flex:0 0 32px;

  display:grid;

  place-items:center;

  border:1px solid var(--border);

  border-radius:9px;

  color:var(--muted);

  font-size:14px;

  transition:
    transform .25s,
    color .25s,
    border-color .25s;
}

.collapse-section[open]
.summary-chevron{

  transform:rotate(180deg);

  color:var(--text);

  border-color:
    rgba(123,97,255,.45);
}


/* =========================================================
   CONTEÚDO
========================================================= */

.collapse-body{

  padding:
    0
    16px
    16px;
}

.collapse-inner{

  padding-top:16px;

  border-top:
    1px solid var(--border);
}


/* =========================================================
   INPUT
========================================================= */

.input-label{

  display:block;

  font-size:10px;

  color:var(--muted);

  text-transform:uppercase;

  letter-spacing:1px;

  margin-bottom:10px;
}

textarea{

  width:100%;

  min-height:120px;

  background:transparent;

  border:none;

  outline:none;

  color:var(--text);

  font-size:16px;

  line-height:1.6;

  resize:vertical;

  font-family:inherit;
}

textarea::placeholder{
  color:var(--muted);
}


/* =========================================================
   AÇÕES INTERNAS
========================================================= */

.field-actions{

  display:flex;

  gap:8px;

  margin-top:10px;
}

.field-action{

  flex:1;

  appearance:none;

  border:1px solid var(--border);

  background:
    rgba(255,255,255,.035);

  color:var(--muted);

  border-radius:12px;

  min-height:38px;

  padding:8px 10px;

  font:
    600 11px/1.2
    inherit;

  cursor:pointer;

  transition:
    background .2s,
    border-color .2s,
    color .2s,
    transform .15s;
}

.field-action:hover{

  color:var(--text);

  border-color:var(--glow);

  background:
    rgba(255,255,255,.07);
}

.field-action:active{
  transform:scale(.97);
}

input[type=file]{
  display:none;
}


/* =========================================================
   BOTÃO FUNDIR
========================================================= */

.btn{

  width:100%;

  padding:18px;

  background:
    linear-gradient(
      135deg,
      var(--glow),
      var(--glow2)
    );

  border:none;

  border-radius:20px;

  color:#fff;

  font-size:16px;

  font-weight:600;

  cursor:pointer;

  transition:
    transform .2s,
    filter .2s;

  letter-spacing:.5px;
}

.btn:active{
  transform:scale(.98);
}

.btn:hover{
  filter:brightness(1.08);
}

.btn-78k{

  background:
    linear-gradient(
      135deg,
      #ff6b6b,
      #ffa502
    );

  margin-top:10px;
}


/* =========================================================
   RESULTADO
========================================================= */

.output-wrap{

  background:
    rgba(0,0,0,.08);

  border:
    1px solid var(--border);

  border-radius:18px;

  overflow:hidden;
}

.output-header{

  min-height:48px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  padding:
    8px
    10px
    8px
    16px;

  border-bottom:
    1px solid var(--border);

  background:
    rgba(255,255,255,.025);
}

.output-title{

  min-width:0;

  font-size:10px;

  font-weight:700;

  letter-spacing:1.5px;

  text-transform:uppercase;

  color:var(--muted);

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.output-controls{

  display:flex;

  align-items:center;

  gap:5px;

  flex-shrink:0;
}

.output-control{

  width:32px;
  height:32px;

  display:grid;

  place-items:center;

  padding:0;

  appearance:none;

  border:1px solid var(--border);

  background:
    rgba(255,255,255,.035);

  color:var(--muted);

  border-radius:9px;

  font-family:inherit;

  font-size:13px;

  font-weight:600;

  line-height:1;

  cursor:pointer;

  transition:
    background .2s,
    border-color .2s,
    color .2s,
    transform .15s;
}

.output-control:hover{

  color:var(--text);

  border-color:var(--glow);

  background:
    rgba(255,255,255,.08);
}

.output-control:active{
  transform:scale(.9);
}

.output-control.primary{
  color:var(--text);
}

.output-control.swap{
  font-size:16px;
}


/* =========================================================
   OUTPUT
========================================================= */

.output{

  max-height:42vh;

  min-height:180px;

  overflow-y:auto;

  overflow-x:hidden;

  overscroll-behavior:contain;

  -webkit-overflow-scrolling:touch;

  padding:18px;

  background:
    rgba(0,0,0,.12);

  font-size:18px;

  line-height:1.8;

  white-space:pre-wrap;

  overflow-wrap:anywhere;

  scrollbar-width:thin;
}


/* =========================================================
   SELECT
========================================================= */

.arch-select{

  background:var(--glass);

  border:1px solid var(--border);

  border-radius:12px;

  padding:10px;

  color:var(--text);

  width:100%;

  margin-top:10px;

  font-size:14px;
}


/* =========================================================
   HINT
========================================================= */

.hint{

  font-size:10px;

  color:var(--muted);

  text-align:center;

  margin-top:20px;
}


/* =========================================================
   ANIMAÇÃO
========================================================= */

@keyframes fadeIn{

  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:420px){

  body{
    padding-left:14px;
    padding-right:14px;
  }

  .collapse-summary{
    min-height:54px;

    padding-left:10px;
    padding-right:10px;

    gap:6px;
  }

  .summary-left{
    gap:7px;
  }

  .summary-index{
    width:28px;
    height:28px;
    flex-basis:28px;
  }

  .summary-actions{
    gap:3px;
  }

  .mxp-action,
  .summary-chevron{
    width:30px;
    height:30px;
    flex-basis:30px;
  }

  .summary-title{
    font-size:10px;
  }

  .summary-sub{
    font-size:8px;
  }

  .output{
    max-height:46vh;
    font-size:16px;
  }

  .output-header{
    padding-left:13px;
  }

  .output-control{
    width:30px;
    height:30px;
  }

  .output-title{
    font-size:9px;
  }

  .field-actions{
    gap:6px;
  }

}

</style>

</head>


<body>


<script
type="module"
src="https://www.infodose.com.br/js/modules/Dual_[Theme]-semDiv.js">
</script>


<div class="dual-app">


<!-- ========================================================
     HEADER
========================================================= -->

<header
  class="topbar header-visible"
  id="main-header">

  <div class="brand">

    <span>
      DUAL
    </span>

    <span class="badge">
      GLOBAL
    </span>

  </div>


  <button
    id="theme-dot"
    class="theme-dot"
    type="button"
    aria-label="Alternar tema"
    title="Alternar tema">

    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      style="width:14px;height:14px;">

      <circle
        cx="12"
        cy="12"
        r="5">
      </circle>

      <path
        d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l-1.42 1.42">
      </path>

    </svg>

  </button>

</header>


<!-- ========================================================
     MAIN
========================================================= -->

<main id="main-content">

<div id="inject-here" class="content">


<div class="blob blob1"></div>
<div class="blob blob2"></div>


<div class="wrap">


<!-- =====================================================
     TÍTULO
====================================================== -->

<div>

  <h1 class="title">
    ESPAÇO DA MENTE
  </h1>

  <p class="sub">
    Fusor Fractal 369 · Merge sem A e B
  </p>

</div>


<!-- =====================================================
     SEMENTE
====================================================== -->

<details
  id="sessionSeed"
  class="collapse-section">

  <summary
    class="collapse-summary">

    <div class="summary-left">

      <span class="summary-index">
        01
      </span>

      <div class="summary-info">

        <div class="summary-title">
          Semente
        </div>

        <div class="summary-sub">
          Texto 1 · entrada principal
        </div>

      </div>

    </div>


    <!-- AÇÕES MXP -->

    <div
      class="summary-actions"
      data-mxp-actions>

      <button
        type="button"
        class="mxp-action"
        data-action="import"
        data-target="t1"
        data-file="f1"
        title="Importar"
        aria-label="Importar">

        +

      </button>


      <button
        type="button"
        class="mxp-action"
        data-action="paste"
        data-target="t1"
        title="Colar"
        aria-label="Colar">

        ⧋

      </button>

    </div>


    <!-- CHEVRON -->

    <span
      class="summary-chevron"
      aria-hidden="true">

      ↓

    </span>

  </summary>


  <div class="collapse-body">

    <div class="collapse-inner">

      <label
        class="input-label"
        for="t1">

        Texto 1 · Semente

      </label>


      <textarea
        id="t1"
        placeholder="Cola tua ideia aqui... ou áudio transcrito..."></textarea>


      <div class="field-actions">

        <button
          type="button"
          class="field-action"
          data-action="import"
          data-target="t1"
          data-file="f1">

          + Importar

        </button>


        <button
          type="button"
          class="field-action"
          data-action="paste"
          data-target="t1">

          ⧋ Colar

        </button>

      </div>


      <input
        type="file"
        id="f1"
        accept=".txt,.html,.md">

    </div>

  </div>

</details>


<!-- =====================================================
     ESPELHO
====================================================== -->

<details
  id="sessionMirror"
  class="collapse-section">

  <summary
    class="collapse-summary">

    <div class="summary-left">

      <span class="summary-index">
        02
      </span>

      <div class="summary-info">

        <div class="summary-title">
          Espelho
        </div>

        <div class="summary-sub">
          Texto 2 · segunda entrada
        </div>

      </div>

    </div>


    <!-- AÇÕES MXP -->

    <div
      class="summary-actions"
      data-mxp-actions>

      <button
        type="button"
        class="mxp-action"
        data-action="import"
        data-target="t2"
        data-file="f2"
        title="Importar"
        aria-label="Importar">

        +

      </button>


      <button
        type="button"
        class="mxp-action"
        data-action="paste"
        data-target="t2"
        title="Colar"
        aria-label="Colar">

        ⧋

      </button>

    </div>


    <!-- CHEVRON -->

    <span
      class="summary-chevron"
      aria-hidden="true">

      ↓

    </span>

  </summary>


  <div class="collapse-body">

    <div class="collapse-inner">

      <label
        class="input-label"
        for="t2">

        Texto 2 · Espelho

      </label>


      <textarea
        id="t2"
        placeholder="Cola outro texto pra fundir..."></textarea>


      <div class="field-actions">

        <button
          type="button"
          class="field-action"
          data-action="import"
          data-target="t2"
          data-file="f2">

          + Importar

        </button>


        <button
          type="button"
          class="field-action"
          data-action="paste"
          data-target="t2">

          ⧋ Colar

        </button>

      </div>


      <input
        type="file"
        id="f2"
        accept=".txt,.html,.md">

    </div>

  </div>

</details>


<!-- =====================================================
     FUNDIR
====================================================== -->

<button
  class="btn"
  type="button"
  onclick="fractalMerge()">

  ⊕ FUNDIR FRACTAL

</button>


<!-- =====================================================
     RESULTADO
====================================================== -->

<details
  id="sessionResult"
  class="collapse-section">

  <summary
    class="collapse-summary">

    <div class="summary-left">

      <span class="summary-index">
        03
      </span>

      <div class="summary-info">

        <div class="summary-title">
          Resultado
        </div>

        <div
          id="resultSummaryText"
          class="summary-sub">

          Resultado Fractal · 369

        </div>

      </div>

    </div>


    <!-- AÇÕES MXP DO RESULTADO -->

    <div
      class="summary-actions"
      data-mxp-actions>

      <button
        type="button"
        class="mxp-action"
        data-action="copy-result"
        title="Copiar resultado"
        aria-label="Copiar resultado">

        ⧉

      </button>


      <button
        type="button"
        class="mxp-action"
        data-action="download-result"
        title="Baixar resultado"
        aria-label="Baixar resultado">

        ↓

      </button>

    </div>


    <span
      class="summary-chevron"
      aria-hidden="true">

      ↓

    </span>

  </summary>


  <div class="collapse-body">

    <div class="collapse-inner">

      <div
        id="resultPanel"
        class="output-wrap"
        style="display:none">


        <div class="output-header">

          <div class="output-title">
            Resultado Fractal · 369
          </div>


          <div class="output-controls">

            <button
              type="button"
              class="output-control primary"
              data-action="copy-result"
              title="Copiar resultado"
              aria-label="Copiar resultado">

              ⧉

            </button>


            <button
              type="button"
              class="output-control"
              data-action="download-result"
              title="Baixar TXT"
              aria-label="Baixar TXT">

              ↓

            </button>


            <button
              type="button"
              class="output-control"
              data-action="result-to-seed"
              title="Resultado para Semente"
              aria-label="Resultado para Semente">

              →S

            </button>


            <button
              type="button"
              class="output-control"
              data-action="result-to-mirror"
              title="Resultado para Espelho"
              aria-label="Resultado para Espelho">

              →E

            </button>


            <button
              type="button"
              class="output-control swap"
              data-action="swap"
              title="Inverter Semente e Espelho"
              aria-label="Inverter Semente e Espelho">

              ⇄

            </button>

          </div>

        </div>


        <div
          id="out"
          class="output"
          role="region"
          aria-label="Resultado fractal">
        </div>

      </div>

    </div>

  </div>

</details>


<!-- =====================================================
     ARQUÉTIPO
====================================================== -->

<select
  id="archSelect"
  class="arch-select"
  style="display:none">

  <option value="">
    Escolher Arquétipo 78K...
  </option>

  <option value="kodux">
    KODUX · Laranja Violeta
  </option>

  <option value="kobllux">
    KOBLLUX · Ciano
  </option>

  <option value="atlas">
    ATLAS · azul Dourado
  </option>

    NOVA · Rosa Xoq
  </option>

    BLLUE · Azul Blue 
  </option>

</select>


<button
  id="btn78k"
  class="btn btn-78k"
  style="display:none"
  type="button"
  onclick="enviar78K()">

  ENVIAR PRO 78K E OUVIR

</button>


<p class="hint">
  Salva esta página. É o anúncio. É o motor. É teu.
</p>

<script>

/* =========================================================
   MOTOR FRACTAL 369
========================================================= */

const motor369 = {

  merge(a,b){

    const s1 =
      a
        .split(/[.!?]+/)
        .filter(s => s.trim());


    const s2 =
      b
        .split(/[.!?]+/)
        .filter(s => s.trim());


    const max =
      Math.max(
        s1.length,
        s2.length
      );


    let res = '';


    for(
      let i=0;
      i<max;
      i++
    ){

      const padrao =
        i % 3;


      if(
        padrao === 0 &&
        s1[i]
      ){

        res +=
          s1[i].trim() +
          '. ';

      }

      else if(
        padrao === 1 &&
        s2[i]
      ){

        res +=
          s2[i].trim() +
          '. ';

      }

      else if(
        padrao === 2 &&
        s1[i]
      ){

        res +=
          s1[i].trim() +
          '. ';

      }

      else if(s2[i]){

        res +=
          s2[i].trim() +
          '. ';

      }

    }


    return res;

  }

};


/* =========================================================
   CHAVES DE MEMÓRIA
========================================================= */

const SESSION_KEYS = {

  seed:
    'fractal_session_seed_open',

  mirror:
    'fractal_session_mirror_open',

  result:
    'fractal_session_result_open'

};


/* =========================================================
   PERSISTÊNCIA DOS DETAILS
========================================================= */

function bindDetailsPersistence(){

  const sessions = [

    [
      'sessionSeed',
      SESSION_KEYS.seed
    ],

    [
      'sessionMirror',
      SESSION_KEYS.mirror
    ],

    [
      'sessionResult',
      SESSION_KEYS.result
    ]

  ];


  sessions.forEach(
    ([id,key]) => {

      const el =
        document.getElementById(id);


      if(!el)
        return;


      const saved =
        localStorage.getItem(key);


      el.open =
        saved === '1';


      el.addEventListener(
        'toggle',
        () => {

          localStorage.setItem(
            key,
            el.open ? '1' : '0'
          );

        }
      );

    }
  );

}


/* =========================================================
   ABRIR SESSÃO
========================================================= */

function abrirSessao(id){

  const el =
    document.getElementById(id);


  if(!el)
    return;


  el.open = true;

}


/* =========================================================
   AÇÕES MXP
========================================================= */

document.addEventListener(
  'click',
  event => {

    const action =
      event.target.closest(
        '[data-action]'
      );


    if(!action)
      return;


    /*
     * Ações dentro do summary não devem
     * alternar o details.
     */

    event.preventDefault();

    event.stopPropagation();


    const tipo =
      action.dataset.action;


    const target =
      action.dataset.target;


    if(tipo === 'import'){

      const fileId =
        action.dataset.file;


      const input =
        document.getElementById(
          fileId
        );


      if(input){

        input.click();

      }

      return;

    }


    if(tipo === 'paste'){

      colarNoCampo(target);

      return;

    }


    if(tipo === 'copy-result'){

      copiarResultado();

      return;

    }


    if(tipo === 'download-result'){

      baixarResultado();

      return;

    }


    if(tipo === 'result-to-seed'){

      resultadoParaSemente();

      return;

    }


    if(tipo === 'result-to-mirror'){

      resultadoParaEspelho();

      return;

    }


    if(tipo === 'swap'){

      inverterSementeEspelho();

      return;

    }

  },
  true
);


/* =========================================================
   FUNDIR
========================================================= */

function fractalMerge(){

  const t1 =
    document
      .getElementById('t1')
      .value
      .trim();


  const t2 =
    document
      .getElementById('t2')
      .value
      .trim();


  if(!t1 || !t2){

    alert(
      'Cola 2 textos primeiro'
    );

    return;

  }


  const fundido =
    motor369.merge(
      t1,
      t2
    );


  const out =
    document.getElementById(
      'out'
    );


  const resultPanel =
    document.getElementById(
      'resultPanel'
    );


  resultPanel.style.display =
    'block';


  out.textContent =
    fundido;


  out.scrollTop =
    0;


  localStorage.setItem(
    'fractal_ultimo',
    fundido
  );


  localStorage.setItem(
    'fractal_t1',
    t1
  );


  localStorage.setItem(
    'fractal_t2',
    t2
  );


  document
    .getElementById('archSelect')
    .style.display =
    'block';


  document
    .getElementById('btn78k')
    .style.display =
    'block';


  const resultSession =
    document.getElementById(
      'sessionResult'
    );


  if(resultSession){

    resultSession.open =
      true;

    localStorage.setItem(
      SESSION_KEYS.result,
      '1'
    );

  }

}


/* =========================================================
   GET RESULTADO
========================================================= */

function getResultado(){

  const out =
    document.getElementById(
      'out'
    );


  return (
    out?.textContent ||
    localStorage.getItem(
      'fractal_ultimo'
    ) ||
    ''
  ).trim();

}


/* =========================================================
   COLAR
========================================================= */

async function colarNoCampo(id){

  const campo =
    document.getElementById(id);


  if(!campo)
    return;


  try{

    const texto =
      await navigator
        .clipboard
        .readText();


    if(!texto){

      alert(
        'O clipboard está vazio'
      );

      return;

    }


    campo.value =
      texto;


    campo.dispatchEvent(
      new Event(
        'input',
        {
          bubbles:true
        }
      )
    );


    localStorage.setItem(
      id === 't1'
        ? 'fractal_t1'
        : 'fractal_t2',
      texto
    );


    campo.focus();


  }

  catch(err){

    alert(
      'O acesso ao clipboard foi bloqueado. Toque no campo e use o comando Colar do sistema.'
    );

  }

}


/* =========================================================
   COPIAR
========================================================= */

async function copiarResultado(){

  const texto =
    getResultado();


  if(!texto){

    alert(
      'Gera um resultado primeiro'
    );

    return;

  }


  try{

    await navigator
      .clipboard
      .writeText(texto);


    alert(
      'Resultado copiado'
    );

  }

  catch(e){

    const ta =
      document.createElement(
        'textarea'
      );


    ta.value =
      texto;


    ta.style.position =
      'fixed';


    ta.style.opacity =
      '0';


    document.body.appendChild(
      ta
    );


    ta.select();


    document.execCommand(
      'copy'
    );


    ta.remove();


    alert(
      'Resultado copiado'
    );

  }

}


/* =========================================================
   DOWNLOAD
========================================================= */

function baixarResultado(){

  const texto =
    getResultado();


  if(!texto){

    alert(
      'Gera um resultado primeiro'
    );

    return;

  }


  const blob =
    new Blob(
      [texto],
      {
        type:
          'text/plain;charset=utf-8'
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      'a'
    );


  const stamp =
    new Date()
      .toISOString()
      .replace(
        /[:.]/g,
        '-'
      );


  a.href =
    url;


  a.download =
    `espaco-da-mente-fractal-${stamp}.txt`;


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  setTimeout(
    () =>
      URL.revokeObjectURL(url),
    1000
  );

}


/* =========================================================
   RESULTADO → SEMENTE
========================================================= */

function resultadoParaSemente(){

  const texto =
    getResultado();


  if(!texto){

    alert(
      'Gera um resultado primeiro'
    );

    return;

  }


  const campo =
    document.getElementById(
      't1'
    );


  campo.value =
    texto;


  localStorage.setItem(
    'fractal_t1',
    texto
  );


  abrirSessao(
    'sessionSeed'
  );


  campo.focus();

}


/* =========================================================
   RESULTADO → ESPELHO
========================================================= */

function resultadoParaEspelho(){

  const texto =
    getResultado();


  if(!texto){

    alert(
      'Gera um resultado primeiro'
    );

    return;

  }


  const campo =
    document.getElementById(
      't2'
    );


  campo.value =
    texto;


  localStorage.setItem(
    'fractal_t2',
    texto
  );


  abrirSessao(
    'sessionMirror'
  );


  campo.focus();

}


/* =========================================================
   INVERTER
========================================================= */

function inverterSementeEspelho(){

  const t1 =
    document.getElementById(
      't1'
    );


  const t2 =
    document.getElementById(
      't2'
    );


  const valor1 =
    t1.value;


  t1.value =
    t2.value;


  t2.value =
    valor1;


  localStorage.setItem(
    'fractal_t1',
    t1.value
  );


  localStorage.setItem(
    'fractal_t2',
    t2.value
  );


  t1.dispatchEvent(
    new Event(
      'input',
      {
        bubbles:true
      }
    )
  );


  t2.dispatchEvent(
    new Event(
      'input',
      {
        bubbles:true
      }
    )
  );

}


/* =========================================================
   IMPORTAÇÃO
========================================================= */

function lerArquivo(
  input,
  textareaId
){

  if(!input)
    return;


  input.addEventListener(
    'change',
    e => {

      const file =
        e.target.files[0];


      if(!file)
        return;


      const reader =
        new FileReader();


      reader.onload =
        ev => {

          let txt =
            ev.target.result;


          if(
            file.name
              .toLowerCase()
              .endsWith('.html')
          ){

            const div =
              document.createElement(
                'div'
              );


            div.innerHTML =
              txt;


            txt =
              div.textContent ||
              div.innerText ||
              '';

          }


          const campo =
            document.getElementById(
              textareaId
            );


          campo.value =
            txt;


          campo.dispatchEvent(
            new Event(
              'input',
              {
                bubbles:true
              }
            )
          );


          localStorage.setItem(
            textareaId === 't1'
              ? 'fractal_t1'
              : 'fractal_t2',
            txt
          );


          abrirSessao(
            textareaId === 't1'
              ? 'sessionSeed'
              : 'sessionMirror'
          );


          /*
           * Permite importar o mesmo
           * arquivo novamente.
           */

          input.value =
            '';

        };


      reader.readAsText(
        file
      );

    }
  );

}


lerArquivo(
  document.getElementById('f1'),
  't1'
);


lerArquivo(
  document.getElementById('f2'),
  't2'
);


/* =========================================================
   RESTAURAR
========================================================= */

window.addEventListener(
  'load',
  () => {

    const t1 =
      localStorage.getItem(
        'fractal_t1'
      );


    const t2 =
      localStorage.getItem(
        'fractal_t2'
      );


    const ult =
      localStorage.getItem(
        'fractal_ultimo'
      );


    if(t1){

      document
        .getElementById('t1')
        .value =
        t1;

    }


    if(t2){

      document
        .getElementById('t2')
        .value =
        t2;

    }


    if(ult){

      document
        .getElementById(
          'resultPanel'
        )
        .style.display =
        'block';


      document
        .getElementById('out')
        .textContent =
        ult;


      document
        .getElementById('out')
        .scrollTop =
        0;


      document
        .getElementById('archSelect')
        .style.display =
        'block';


      document
        .getElementById('btn78k')
        .style.display =
        'block';

    }


    bindDetailsPersistence();

  }
);


/* =========================================================
   TEMA
========================================================= */

const themeDot =
  document.getElementById(
    'theme-dot'
  );


if(themeDot){

  themeDot.addEventListener(
    'click',
    () => {

      document.body.classList.toggle(
        'light'
      );

    }
  );

}

</script>
