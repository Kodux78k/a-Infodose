<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HTML → JS Injector Studio</title>
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
:root{
  --bg:#050607;
  --panel:#0c0f12;
  --panel2:#11151a;
  --line:#242a31;
  --text:#edf2f7;
  --muted:#89939f;
  --accent:#00f5d4;
  --accent2:#7c3aed;
  --danger:#ff4d6d;
}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 0%,rgba(0,245,212,.08),transparent 35%),
    radial-gradient(circle at 90% 100%,rgba(124,58,237,.1),transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.app{
  width:min(1100px,100%);
  margin:auto;
  padding:18px;
}
header{
  padding:12px 4px 20px;
}
h1{
  margin:0;
  font-size:clamp(24px,5vw,42px);
  letter-spacing:-1.5px;
}
h1 span{
  color:var(--accent);
}
.subtitle{
  margin-top:7px;
  color:var(--muted);
  font-size:14px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
@media(max-width:800px){
  .grid{
    grid-template-columns:1fr;
  }
}
.card{
  background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.card-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 15px;
  border-bottom:1px solid var(--line);
}
.card-title{
  font-size:13px;
  font-weight:700;
  letter-spacing:.5px;
}
.badge{
  font-size:10px;
  padding:4px 8px;
  border-radius:999px;
  background:rgba(0,245,212,.08);
  color:var(--accent);
  border:1px solid rgba(0,245,212,.2);
}
textarea{
  display:block;
  width:100%;
  min-height:400px;
  resize:vertical;
  border:0;
  outline:0;
  padding:16px;
  background:#080a0d;
  color:#d9e1e8;
  font-family:"SFMono-Regular",Consolas,monospace;
  font-size:12px;
  line-height:1.6;
}
#output{
  color:#b8f7ee;
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:12px;
  border-top:1px solid var(--line);
}
button,
.file-label{
  appearance:none;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:10px;
  padding:10px 13px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}
button:hover,
.file-label:hover{
  border-color:var(--accent);
  transform:translateY(-1px);
}
.primary{
  background:var(--accent);
  color:#00110e;
  border-color:var(--accent);
}
.purple{
  background:rgba(124,58,237,.15);
  border-color:rgba(124,58,237,.4);
}
.danger{
  color:#ff8097;
}
input[type=file]{
  display:none;
}
.full{
  grid-column:1/-1;
}
.preview-wrap{
  height:520px;
  background:#fff;
  position:relative;
}
.preview-wrap iframe{
  width:100%;
  height:100%;
  border:0;
  background:white;
}
.status{
  padding:10px 14px;
  font-size:11px;
  color:var(--muted);
  border-top:1px solid var(--line);
}
.status.ok{
  color:var(--accent);
}
select{
  background:#080a0d;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:8px;
  padding:8px;
}
.meta{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>HTML → <span>JS</span> Injector Studio</h1>
  <div class="subtitle">
    Converta qualquer conteúdo HTML em um módulo JavaScript injetável.
  </div>
</header>
<div class="grid">
<!-- INPUT -->
<section class="card">
  <div class="card-head">
    <div class="card-title">01 · SOURCE</div>
<div class="meta">
  <span class="badge" id="fileType">TEXT</span>
  <label class="file-label">
    UPLOAD
    <input id="fileInput" type="file">
  </label>
</div>
  </div>
  <textarea
    id="source"
    placeholder="Cole aqui o HTML, TXT ou qualquer conteúdo que deseja transformar em JS..."
  ></textarea>
  <div class="actions">
<button class="primary" id="pasteBtn">
  📋 Paste Clipboard
</button>
<button id="convertBtn">
  ⚡ Converter → JS
</button>
<button id="clearBtn" class="danger">
  Limpar
</button>
  </div>
</section>
<!-- OUTPUT -->
<section class="card">
  <div class="card-head">
<div class="card-title">
  02 · GENERATED JS
</div>
<span class="badge">
  INJECTOR
</span>
  </div>
  <textarea
    id="output"
    readonly
    placeholder="O JavaScript convertido aparecerá aqui..."
  ></textarea>
  <div class="actions">
<button id="copyBtn">
  ⧉ Copiar JS
</button>
<button id="downloadBtn">
  ↓ Baixar .JS
</button>
<button id="previewBtn" class="purple">
  ▶ Sandbox Preview
</button>
  </div>
</section>
<!-- PREVIEW -->
<section class="card full">
  <div class="card-head">
<div class="card-title">
  03 · SANDBOX PREVIEW
</div>
<div class="meta">
  <select id="target">
    <option value="#inject-here">#inject-here</option>
    <option value="body">body</option>
    <option value="main">main</option>
    <option value="#app">#app</option>
  </select>
</div>
  </div>
  <div class="preview-wrap">
    <iframe id="preview"></iframe>
  </div>
  <div class="status" id="status">
    Aguardando conversão...
  </div>
</section>
</div>
</div>
<script>
const source = document.getElementById("source");
const output = document.getElementById("output");
const fileInput = document.getElementById("fileInput");
const fileType = document.getElementById("fileType");
const preview = document.getElementById("preview");
const status = document.getElementById("status");
const target = document.getElementById("target");
// ============================================================
// BASE DO INJECTOR
// ============================================================
function buildInjector(html){
  const safe = html
    .replace(/\\/g,"\\\\")
    .replace(/`/g,"\\`")
    .replace(/\$\{/g,"\\${");
  const selector = target.value;
  return `(function(h,s='${selector}'){
const p=new DOMParser(),
c=p.parseFromString(h,'text/html'),
f=document.createDocumentFragment(),
t=document.querySelector(s)||document.body;
Array.from(c.body.childNodes)
.forEach(n=>f.appendChild(document.importNode(n,true)));
t.appendChild(f);
Array.from(c.querySelectorAll('script'))
.forEach(x=>{
const n=document.createElement('script');
for(const a of x.attributes)
n.setAttribute(a.name,a.value);
n.textContent=x.textContent;
document.body.appendChild(n);
});
})(\`${safe}\`);`;
}
// ============================================================
// CONVERTER
// ============================================================
function convert(){
  const html = source.value.trim();
  if(!html){
    status.textContent="Nada para converter.";
    return;
  }
  output.value = buildInjector(html);
  status.textContent =
    `✓ Conversão concluída · ${html.length} caracteres`;
  status.className="status ok";
}
// ============================================================
// CLIPBOARD
// ============================================================
document.getElementById("pasteBtn")
.addEventListener("click",async()=>{
  try{
    const text =
      await navigator.clipboard.readText();
    source.value=text;
    fileType.textContent="CLIPBOARD";
    status.textContent=
      "✓ Conteúdo colado do Clipboard.";
  }catch(err){
    alert(
      "O navegador bloqueou o Clipboard. " +
      "Cole manualmente no campo."
    );
  }
});
// ============================================================
// UPLOAD
// ============================================================
fileInput.addEventListener("change",async e=>{
  const file=e.target.files[0];
  if(!file)return;
  const text=await file.text();
  source.value=text;
  fileType.textContent=
    file.name.split(".").pop().toUpperCase();
  status.textContent=
    `✓ Arquivo carregado: ${file.name}`;
});
// ============================================================
// CONVERTER
// ============================================================
document.getElementById("convertBtn")
.addEventListener("click",convert);
// ============================================================
// COPIAR
// ============================================================
document.getElementById("copyBtn")
.addEventListener("click",async()=>{
  if(!output.value)return;
  await navigator.clipboard.writeText(
    output.value
  );
  status.textContent=
    "✓ JS copiado para o Clipboard.";
});
// ============================================================
// DOWNLOAD
// ============================================================
document.getElementById("downloadBtn")
.addEventListener("click",()=>{
  if(!output.value)return;
  const blob=new Blob(
    [output.value],
    {type:"application/javascript"}
  );
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="injector-module.js";
  a.click();
  URL.revokeObjectURL(url);
});
// ============================================================
// PREVIEW SANDBOX
// ============================================================
document.getElementById("previewBtn")
.addEventListener("click",()=>{
  if(!output.value){
    convert();
  }
  const baseHTML=`
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<title>Injector Sandbox</title>
<style>
body{
margin:0;
padding:30px;
font-family:system-ui;
background:#101216;
color:white;
}
#inject-here{
min-height:200px;
padding:20px;
border:2px dashed #444;
border-radius:16px;
}
</style>
</head>
<body>
<h2>Sandbox Preview</h2>
<div id="inject-here">
<!-- conteúdo será injetado aqui -->
</div>
<script>
${output.value}
<\/script>
</body>
</html>
`;
  preview.srcdoc=baseHTML;
  status.textContent=
    "✓ Sandbox executado com sucesso.";
  status.className="status ok";
});
// ============================================================
// LIMPAR
// ============================================================
document.getElementById("clearBtn")
.addEventListener("click",()=>{
  source.value="";
  output.value="";
  preview.srcdoc="";
  fileType.textContent="TEXT";
  status.textContent=
    "Aguardando conversão...";
  status.className="status";
});
// ============================================================
// AUTO CONVERSÃO AO MUDAR DESTINO
// ============================================================
target.addEventListener("change",()=>{
  if(source.value.trim()){
    convert();
  }
});
</script>
</body>
</html>
