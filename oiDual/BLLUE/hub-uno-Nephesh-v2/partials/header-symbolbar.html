<!-- HEADER TRANSFORMADO EM SYMBOLBAR HORIZONTAL -->
<header class="mast" id="mastBar">

  <!-- SETA ESQUERDA ← -->
  <button class="mast-arrow" id="mastArrowLeft" title="Anterior" aria-label="Anterior">←</button>

  <!-- CARROSSEL -->
  <div class="mast-carousel-wrap" id="mastCarouselWrap">
    <div class="mast-carousel-track" id="mastCarouselTrack">

      <!-- ITEM: Voltar -->
      <div class="mast-item">
        <button class="ib fx-trans fx-press ring" id="btnBack" title="Voltar" aria-label="Voltar">
          <img src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/svgs/solid/arrow-left.svg" alt="Voltar" width="20" height="20" onerror="this.onerror=null;this.src='icons/arrow-left.svg'">
          <span class="ripple"></span>
        </button>
      </div>

      <!-- ITEM: Geometria -->
      <div class="mast-item">
        <button class="ib fx-trans fx-press ring" id="btnGeometria" title="Testemunhar Geometria" data-opcode="0×08" data-frequency="852Hz" data-geometry="◉">
          <img src="icons/eye.svg" alt="Geometria" width="20" height="20" onerror="this.onerror=null;this.src='icons/eye.svg'">
          <span class="ripple"></span>
        </button>
      </div>

      <!-- SEPARADOR -->
      <div class="mast-item"><div class="mast-sep"></div></div>

      <!-- ITEM: Título HUB UNO -->
      <div class="mast-item mast-title-carousel">
        <h1>HUB UNO</h1>
        <small>Dual · Trinity</small>
      </div>

      <!-- SEPARADOR -->
      <div class="mast-item"><div class="mast-sep"></div></div>

      <!-- ITEM: Download -->
      <div class="mast-item">
        <button class="ib fx-trans fx-press ring" id="btnDownload" title="Baixar HTML">
          <img src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/svgs/solid/download.svg" alt="Download" width="20" height="20" onerror="this.onerror=null;this.src='icons/download.svg'">
          <span class="ripple"></span>
        </button>
      </div>

      <!-- ITEM: Help -->
      <div class="mast-item">
        <button class="ib fx-trans fx-press ring" id="btnHelp" title="Ajuda / Atalhos">
          <img src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/svgs/solid/question-circle.svg" alt="Ajuda" width="20" height="20" onerror="this.onerror=null;this.src='icons/question-circle.svg'">
          <span class="ripple"></span>
        </button>
      </div>

      <!-- ITEM: Brain -->
      <div class="mast-item">
        <button class="ib fx-trans fx-press ring" id="btnBrain" title="Brain">
          <img src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/svgs/solid/brain.svg" alt="Brain" width="20" height="20" onerror="this.onerror=null;this.src='icons/brain.svg'">
          <span class="ripple"></span>
        </button>
      </div>

      <!-- ITEM: LS -->
      <div class="mast-item">
        <button class="ib fx-trans fx-press ring" id="btnLS" title="Local Storage (Brain)" aria-label="Local Storage">
          <span class="ls-badge">LS</span>
          <span class="ripple"></span>
        </button>
      </div>

      <!-- ITEM: KOBLLUX -->
      <div class="mast-item">
        <button class="ib fx-trans fx-press ring" id="btnKobllux" title="KOBLLUX ATIVAR" aria-label="KOBLLUX">
          <img src="icons/bolt.svg" alt="KOBLLUX" width="20" height="20" onerror="this.onerror=null;this.src='icons/bolt.svg'">
          <span class="ripple"></span>
        </button>
      </div>

    </div>
  </div>

  <!-- SETA DIREITA → -->
  <button class="mast-arrow" id="mastArrowRight" title="Próximo" aria-label="Próximo">→</button>

</header>
