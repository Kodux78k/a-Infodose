/* ── CSS ADICIONAL (adicione ao seu kobllux.css ou style inline) ── */

/* Container do header transformado em SymbolBar horizontal */
.mast {
  position: fixed !important;
  top: 0;
  left: 0;
  right: 0;
  z-index: 9999 !important;
  
  display: flex !important;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  
  padding: 6px 10px;
  height: 56px;
  
  background: rgba(10, 14, 26, 0.92);
  backdrop-filter: blur(14px) saturate(180%);
  -webkit-backdrop-filter: blur(14px) saturate(180%);
  border-bottom: 1px solid rgba(201, 168, 76, 0.15);
  box-shadow:
    0 4px 24px rgba(0, 0, 0, 0.5),
    0 0 0 1px rgba(201, 168, 76, 0.05),
    0 0 30px rgba(201, 168, 76, 0.08);
  
  user-select: none;
  touch-action: pan-y;
}

/* Ajuste do body para não ficar escondido sob o header fixo */
body {
  padding-top: 64px !important;
}

/* ── SETAS DE NAVEGAÇÃO ← / → ── */
.mast-arrow {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(201, 168, 76, 0.1);
  border: 1px solid rgba(201, 168, 76, 0.25);
  color: #C9A84C;
  font-size: 1.2rem;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.25s ease;
  position: relative;
  z-index: 2;
}
.mast-arrow:hover {
  background: rgba(201, 168, 76, 0.22);
  transform: scale(1.1);
}
.mast-arrow:active {
  transform: scale(0.92);
}
.mast-arrow:disabled {
  opacity: 0.25;
  cursor: not-allowed;
  transform: none !important;
}

/* ── CARROSSEL DO HEADER ── */
.mast-carousel-wrap {
  flex: 1;
  overflow: hidden;
  position: relative;
  mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
  -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
}

.mast-carousel-track {
  display: flex;
  align-items: center;
  gap: 8px;
  will-change: transform;
  transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
}

.mast-carousel-track.dragging {
  transition: none !important;
  cursor: grabbing;
}

/* Cada item do carrossel */
.mast-item {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Botões do header dentro do carrossel — reutiliza .ib existente */
.mast .ib {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
  transition: all 0.2s ease;
}
.mast .ib:hover {
  background: rgba(201, 168, 76, 0.1);
  border-color: rgba(201, 168, 76, 0.3);
  transform: scale(1.05);
}
.mast .ib:active {
  transform: scale(0.92);
}

/* Título no carrossel */
.mast-title-carousel {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 12px;
  min-width: 80px;
}
.mast-title-carousel h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: 0.85rem;
  font-weight: 700;
  color: #C9A84C;
  letter-spacing: 0.12em;
  margin: 0;
  line-height: 1.2;
  text-shadow: 0 0 12px rgba(201, 168, 76, 0.3);
}
.mast-title-carousel small {
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.55rem;
  color: rgba(232, 224, 240, 0.5);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-top: 2px;
}

/* Separador dourado */
.mast-sep {
  width: 1px;
  height: 24px;
  background: linear-gradient(to bottom, transparent, rgba(201, 168, 76, 0.4), transparent);
  flex-shrink: 0;
  opacity: 0.5;
}

/* Badge LS dentro do carrossel */
.mast .ls-badge {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.65rem;
  font-weight: 700;
  color: #C9A84C;
  letter-spacing: 0.05em;
}

/* Indicador de página (dots) */
.mast-dots {
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  z-index: 2;
}
.mast-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.15);
  transition: all 0.25s ease;
}
.mast-dot.active {
  background: #C9A84C;
  transform: scale(1.5);
}

/* Responsivo: esconde setas em desktop se couber tudo */
@media (min-width: 600px) {
  .mast-arrow {
    display: none;
  }
  .mast-carousel-wrap {
    mask-image: none;
    -webkit-mask-image: none;
  }
  .mast-carousel-track {
    justify-content: center;
  }
}

@media (max-width: 599px) {
  .mast {
    padding: 6px 8px;
    gap: 4px;
  }
  .mast-arrow {
    width: 32px;
    height: 32px;
    font-size: 1rem;
  }
  .mast .ib {
    width: 36px;
    height: 36px;
  }
  .mast-title-carousel h1 {
    font-size: 0.75rem;
  }
}

  
  
</style>

<!-- ════════════════════════════════════════════════════════════════
   JS DO CARROSSEL HORIZONTAL (cole antes do </body>)
   ════════════════════════════════════════════════════════════════ -->
<script>
(function(){
  'use strict';

  const track = document.getElementById('mastCarouselTrack');
  const wrap  = document.getElementById('mastCarouselWrap');
  const btnL  = document.getElementById('mastArrowLeft');
  const btnR  = document.getElementById('mastArrowRight');
  if(!track || !wrap) return;

  let idx = 0;
  let itemW = 48; // largura aproximada de cada item + gap
  let visibleItems = 0;
  let maxIdx = 0;

  function calcMetrics(){
    const wrapW = wrap.offsetWidth;
    const items = track.querySelectorAll('.mast-item');
    if(items.length === 0) return;
    // Calcula largura real do track
    let totalW = 0;
    items.forEach(it => {
      totalW += it.offsetWidth + 8; // 8 = gap
    });
    totalW -= 8; // remove último gap
    
    visibleItems = Math.floor(wrapW / itemW);
    maxIdx = Math.max(0, items.length - visibleItems);
    
    // Esconde setas se tudo couber
    const needArrows = totalW > wrapW;
    if(btnL) btnL.style.display = needArrows ? 'flex' : 'none';
    if(btnR) btnR.style.display = needArrows ? 'flex' : 'none';
    
    // Garante idx válido
    idx = Math.min(idx, maxIdx);
    apply();
  }

  function apply(){
    track.style.transform = `translateX(${-idx * itemW}px)`;
    if(btnL) btnL.disabled = idx <= 0;
    if(btnR) btnR.disabled = idx >= maxIdx;
  }

  function scroll(dir){
    idx = Math.max(0, Math.min(idx + dir, maxIdx));
    apply();
  }

  // Eventos das setas
  if(btnL) btnL.addEventListener('click', () => scroll(-1));
  if(btnR) btnR.addEventListener('click', () => scroll(1));

  // Swipe / drag no carrossel
  let dragStart = 0, dragDelta = 0, isDragging = false;

  wrap.addEventListener('touchstart', e => {
    dragStart = e.touches[0].clientX;
    isDragging = true;
    track.classList.add('dragging');
  }, {passive: true});

  wrap.addEventListener('touchmove', e => {
    if(!isDragging) return;
    dragDelta = e.touches[0].clientX - dragStart;
    track.style.transform = `translateX(${-idx * itemW + dragDelta}px)`;
  }, {passive: true});

  wrap.addEventListener('touchend', () => {
    if(!isDragging) return;
    isDragging = false;
    track.classList.remove('dragging');
    if(Math.abs(dragDelta) > 40){
      scroll(dragDelta > 0 ? -1 : 1);
    } else {
      apply();
    }
    dragDelta = 0;
  }, {passive: true});

  // Mouse drag (desktop)
  wrap.addEventListener('mousedown', e => {
    dragStart = e.clientX;
    isDragging = true;
    track.classList.add('dragging');
  });
  wrap.addEventListener('mousemove', e => {
    if(!isDragging) return;
    dragDelta = e.clientX - dragStart;
    track.style.transform = `translateX(${-idx * itemW + dragDelta}px)`;
  });
  wrap.addEventListener('mouseup', () => {
    if(!isDragging) return;
    isDragging = false;
    track.classList.remove('dragging');
    if(Math.abs(dragDelta) > 40){
      scroll(dragDelta > 0 ? -1 : 1);
    } else {
      apply();
    }
    dragDelta = 0;
  });
  wrap.addEventListener('mouseleave', () => {
    if(!isDragging) return;
    isDragging = false;
    track.classList.remove('dragging');
    apply();
    dragDelta = 0;
  });

  // Recalcula no resize
  window.addEventListener('resize', () => {
    clearTimeout(window._mastResizeT);
    window._mastResizeT = setTimeout(calcMetrics, 150);
  });

  // Inicializa
  calcMetrics();
  console.log('[KBLX·HEADER] SymbolBar horizontal ativada · ∆1134');
})();
</script>
