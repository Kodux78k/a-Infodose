<!DOCTYPE html>
<html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>NEBULA PRO · Screen Panel</title>

    <!-- Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap">

    <!-- PWA Icons -->
    <link rel="apple-touch-icon" href="https://www.infodose.com.br/oiDual/KODUX/78K/APPS/78HERO/icon-192.png">
    <link rel="manifest" href="https://www.infodose.com.br/oiDual/KODUX/78K/APPS/78HERO/manifest.json">

    <!-- External CSS -->
    
<style>/* style  */

        @import url("https://www.infodose.com.br/oiDual/KODUX/78K/APPS/78HERO/css/main-vi4.css");
        @import url("https://www.infodose.com.br/oiDual/KODUX/78K/APPS/78HERO/css/main-v6.css");
        @import url("https://www.infodose.com.br/oiDual/KODUX/78K/APPS/78HERO/css/main-uv0.css");
        :root { --z-base: 0; --z-content: 100; --z-widget: 500; --z-overlay: 1000; --z-system: 5000; }

        /* Layout fixo: header fixo + iframe ocupando o resto */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .dual-app {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        header {
            flex-shrink: 0;
            z-index: 100;
        }
        main {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .tab-iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease;
            background: transparent;
        }
        .tab-iframe.active {
            opacity: 1;
            visibility: visible;
        }
    
</style></head>
<body>
    <div class="dual-app">
        <!-- ============================================================
        HEADER — mantido original
        ============================================================ -->
        <header>
            <div class="topbar header-visible" id="main-headerr">
                <!-- Left: Brand -->
                <div class="kodux-nav">
                    <div class="kodux-brand" id="main-header" title="KODUX iCloud">
                        <svg viewBox="0 0 24 24">
                            <path d="M17.5,19c-3.6,0-6.5-2.9-6.5-6.5s2.9-6.5,6.5-6.5s6.5,2.9,6.5,6.5S21.1,19,17.5,19z M17.5,8c-2.5,0-4.5,2-4.5,4.5s2,4.5,4.5,4.5s4.5-2,4.5-4.5S20,8,17.5,8z"></path>
                        </svg>
                    </div>
                    <div class="kodux-avatar" onclick="launchApp('profile')" title="Perfil KODUX"></div>
                </div>

                <!-- Center: Theme Toggle -->
                <button id="theme-dot" class="theme-dot" type="button" aria-label="Alternar tema" title="Alternar tema">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;">
                        <circle cx="12" cy="12" r="5"></circle>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                    </svg>
                </button>

                <!-- Right: Navigation Tabs -->
                <div class="footer-tabs">
                    <button class="tab-btn active" data-tab="inicio">Início</button>
                    <button class="tab-btn" data-tab="biblioteca">Biblioteca</button>
                    <button class="tab-btn" data-tab="cortex">Cortex</button>
                    <button class="tab-btn" data-tab="ajustes">Ajustes</button>
                    <button class="tab-btn" data-tab="kblx">KBLX</button>
                </div>
            </div>
        </header>

        <!-- ============================================================
        MAIN CONTENT — TODAS AS ABAS COMO IFRAME
        ============================================================ -->
        <main id="main-content">
            <!-- Início -->

<iframe class="tab-iframe active" data-tab="inicio" src="https://www.infodose.com.br/oiDual/KODUX/78K/APPS/78Unouno/index.html" loading="lazy" allowfullscreen="">

</iframe>

            <!-- Biblioteca -->

<iframe class="tab-iframe" data-tab="biblioteca" src="https://www.infodose.com.br/oiDual/KODUX/78K/APPS/78HERO/" loading="lazy" allowfullscreen="">

</iframe>

            <!-- Cortex -->
            <iframe class="tab-iframe" data-tab="cortex" src="https://www.infodose.com.br/oiDual/KODUX/78K/APPS/78iFSwOS/" loading="lazy" allowfullscreen=""></iframe>

            <!-- Ajustes -->
            <iframe class="tab-iframe" data-tab="ajustes" src="https://www.infodose.com.br/oiDual/KODUX/78K/APPS/78KARD/" loading="lazy" allowfullscreen=""></iframe>

            <!-- KBLX -->
            <iframe class="tab-iframe" data-tab="kblx" srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;body style='margin:0;background:var(--bg);color:var(--text);font-family:Montserrat,sans-serif;display:flex;align-items:center;justify-content:center;height:100%;'&gt;&lt;h2&gt;KBLX&lt;/h2&gt;&lt;p&gt;Conteúdo da aba KBLX&lt;/p&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
        </main>
    </div>

    <!-- ============================================================
    SCRIPTS — Troca de abas + Tema
    ============================================================ -->
    

</body></html>
