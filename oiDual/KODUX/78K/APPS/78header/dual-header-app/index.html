<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no">
<title>DUAL · Global System</title>

<link rel="stylesheet" href="./css/main.css"></head>
<body>
<div class="dual-app">
<!-- ═══════════════════════════════════════════════════════
     HEADER GLOBAL
     1. TOCAR NO HEADER
        → COLAPSA MAIN
     2. TOCAR NA BOLINHA
        → MUDA TEMA
     3. ROLAR PARA BAIXO
        → HEADER SOBE
     4. ROLAR PARA CIMA
        → HEADER VOLTA
═══════════════════════════════════════════════════════ -->
<header class="topbar header-visible" id="main-header">
    <!-- ÁREA DO SISTEMA -->
    <div class="brandX">
        <span>
            DUAL
        </span>
        <span class="badgeX">
            GLOBAL
        </span>
    </div>
    <!-- ÚNICO CONTROLE DE TEMA -->

  <button id="theme-dot" class="theme-dot" type="button" aria-label="Alternar tema" title="Alternar tema">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
       </button>  


</header>
<!-- ═══════════════════════════════════════════════════════
     MAIN
═══════════════════════════════════════════════════════ -->
<main id="main-content">
    <div class="content">
        <section style="display:none" class="panel demo">
        </section>
    </div>
</main>
</div>


</body></html>
