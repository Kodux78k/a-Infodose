<!-- ═══════════════ BASE TOKENS ═══════════════ -->
<style data-k-id="SI_BASE">

  --CARD:rgba(255,255,255,.035); --CARD-BRD:rgba(255,255,255,.075);
  --LINE:rgba(255,255,255,.08); --GLASS:rgba(10,14,26,.88);
  --KBLX_M:#ef4444; --KBLX_Q:#ffd700;
  --active-color:#ffd700; --active-secondary:#c9a84c;
  --kob-voice:#-primary:#FFD700; --kob-voice-secondary:#FFB84D;
  --mono:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
  --orb-speed:7.2s; --z-system:9000;
  /* DUAL tokens */
  --radius:16px; --transition:.25s ease;
  --panel:rgba(255,255,255,.035); --panel-2:rgba(2551,255,255a,.06);
  --1secondary:#FFD700; --primary:#3b82fa6;
  --text22:#f2f0ea; --text-muted:#8a8a95; --bg:#07070a;
}
html[data-theme="light"]{
  --BG:#f6f7fb; --FG:#1a1a22; --GRID:rgba(0,0,0,.03); --DIM:#666;
  --CARD:rgba(0,0,0,.03); --CARD-BRD:rgba(0,0,0,.08);
  --LINE:rgba(0,0,0,.1); --GLASS:rgba(250,250,255,.92);
  --bg:#f6f7fb; --text; --text-muted:#666;
  --panel:rgba(0,0,0,.04); --panel-2:rgba(0,0,0,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none}
html,body{background:var(--BG);color:var(--FG);overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  line-height:1.5;min-height:100vh;position:relative;-webkit-font-smoothing:antialiased;
  transition:background .6s ease,color .6s ease}

.theme-layer{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--BG);transition:background 1.2s ease}
.theme-grad{position:fixed;inset:0;pointer-events:none;z-index:1;background:
  radial-gradient(circle at 20% 10%,color-mix(in srgb,var(--active-color) 9%,transparent),transparent 42%),
  radial-gradient(circle at 85% 60%,color-mix(in srgb,var(--active-secondary) 7%,transparent),transparent 45%)}
.theme-grid{position:fixed;inset:0;pointer-events:none;z-index:2;background-image:
  linear-gradient(var(--GRID) 1px,transparent 1px),
  linear-gradient(90deg,var(--GRID) 1px,transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 75%);
  -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 75%)}
</style>

<!-- ═══════════════ DUAL OS LAYOUT ═══════════════ -->
<style data-k-id="SI_DUAL">
.shell{position:relative;z-index:3;max-width:720px;margin:0 auto;min-height:100vh;
  padding:0 0 140px;display:flex;flex-direction:column}

/* TOPBAR */

  padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:100;

.topbar.header-visible{transform:translateX(-50%) translateY(0)}
.topbar.header-hidden{transform:translateX(-50%) translateY(-110%)}
.topbar#main-header{top:54px;flex-wrap:wrap;gap:6px}

  text-transform:uppercase;color:var(--DIM);font-weight:800;flex-shrink:0}
.brand span{color:var(--kob-voice-primary)}

  display:grid;place-items:center;transition:.2s ease}

  border-color:color-mix(in srgb,var(--kob-voice-primary) 45%,transparent)}
.theme-dot{cursor:pointer}

.win-navrow{display:flex;gap:6px;align-items:center;flex:1;min-width:0;
  padding:4px 6px;border-radius:14px;background:var(--CARD);border:1px solid var(--CARD-BRD)}
.win-urlbar{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--FG);
  font-family:var(--mono);font-size:11px;padding:8px 10px}
.win-go-btn{padding:6px 12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--kob-voice-primary) 40%,transparent);
  background:color-mix(in srgb,var(--kob-voice-primary) 12%,transparent);
  color:var(--kob-voice-primary);font-size:10px;font-weight:800;letter-spacing:.12em;cursor:pointer}
.launcher-btn{width:36px;height:36px;border-radius:12px;border:1px solid var(--CARD-BRD);
  background:var(--CARD);color:var(--kob-voice-primary);cursor:pointer;font-size:15px}

/* MAIN */
main{flex:1;padding:120px 14px 0}
#kxtsk-shell{width:100%}
#stackWrap{position:relative;display:flex;flex-direction:column;gap:16px}
#dock{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 90px);right:14px;
  display:flex;flex-direction:column;gap:8px;z-index:6000}
.dock-bubble{width:52px;height:52px;border-radius:50%;
  border:1px solid var(--kob-voice-primary);background:var(--GLASS);
  color:var(--kob-voice-primary);font-size:18px;cursor:pointer;
  box-shadow:0 4px 20px rgba(0,0,0,.4);display:grid;place-items:center}

/* SESSION WINDOW */
.session-window{position:relative;border:1px solid var(--LINE);border-radius:20px;
  background:var(--CARD);backdrop-filter:blur(12px);overflow:hidden;
  transition:box-shadow .25s ease,transform .3s ease}
.session-window.maximized{position:fixed;inset:12px;z-index:94000}
.session-window.collapsed .win-frame{display:none}
.session-window.collapsed .win-hdr{border-bottom:0}
.session-window.peeked{opacity:.92}
.session-window.minimized{display:none}
.win-hdr{display:flex;align-items:center;gap:6px;padding:8px 10px;
  border-bottom:1px solid var(--LINE);background:rgba(255,255,255,.02);min-height:46px}
.win-controls{display:flex;gap:4px;align-items:center;flex-shrink:0}
.win-controls button{width:30px;height:30px;border-radius:10px;background:var(--CARD);
  border:1px solid transparent;color:var(--FG);font-size:13px;cursor:pointer;
  display:grid;place-items:center;transition:.15s ease}
.win-controls button:hover{background:rgba(255,215,0,.15);color:var(--kob-voice-primary)}
.tab-counter{font-family:var(--mono);font-weight:900;font-size:11px}
.state-badge{margin-left:auto;font-size:10px;padding:3px 8px;border-radius:999px;
  font-family:var(--mono);background:rgba(255,255,255,.06)}
.win-frame{width:100%;height:420px;border:0;display:block;background:#0a0a10}
.session-window.maximized .win-frame{height:calc(100dvh - 90px)}
.resize-handle{position:absolute;z-index:5}
.resize-y{left:0;right:0;bottom:-3px;height:8px;cursor:ns-resize}
.resize-x{right:-3px;top:0;bottom:0;width:8px;cursor:ew-resize}
.resize-corner{right:-3px;bottom:-3px;width:16px;height:16px;cursor:nwse-resize}

/* DRAWER */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
  z-index:8500;opacity:0;pointer-events:none;transition:.25s ease}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);
  background:var(--GLASS);backdrop-filter:blur(18px);
  border-left:1px solid var(--LINE);z-index:8600;
  transform:translateX(102%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;padding:20px}
.drawer.open{transform:translateX(0)}

/* TAB SWITCHER */
.tab-switcher-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);
  z-index:8800;display:none;align-items:center;justify-content:center;padding:16px}
.tab-switcher-overlay.open{display:flex}
.tab-switcher-panel{width:100%;max-width:520px;max-height:80dvh;background:var(--BG);
  border:1px solid var(--kob-voice-primary);border-radius:22px;overflow:auto;padding:14px}

  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tab-card .tab-state-dot{width:6px;height:6px;border-radius:50%;background:#39ffb6}
.tab-card .tab-close,.tab-card .tab-fav{position:absolute;top:6px;width:22px;height:22px;
  border-radius:8px;border:0;background:rgba(255,255,255,.08);color:var(--FG);
  font-size:11px;cursor:pointer}
.tab-card .tab-close{right:6px}
.tab-card .tab-fav{right:32px}
.tab-card .tab-fav.active{color:var(--kob-voice-primary)}

/* BOTTOM NAV */
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:720px;
  padding:8px 14px calc(env(safe-area-inset-bottom) + 12px);
  background:linear-gradient(0deg,color-mix(in srgb,var(--BG) 96%,transparent),transparent 90%);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  z-index:100;min-height:64px}
.nav-cta{font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--kob-voice-primary);font-weight:800;padding:10px 16px;border-radius:999px;
  border:1px solid color-mix(in srgb,var(--kob-voice-primary) 50%,transparent);
  background:color-mix(in srgb,var(--kob-voice-primary) 14%,transparent);
  cursor:pointer;font-family:inherit;flex-shrink:0}
.mxp-footer-slot{display:flex;gap:6px;align-items:center;flex:1;justify-content:center;flex-wrap:wrap}
</style>

<!-- ═══════════════ MXP SYSTEM ═══════════════ -->
<style data-k-id="SI_MXP">
[data-drop-target]{border-radius:14px;outline:2px solid transparent;outline-offset:4px;
  transition:outline-color .18s ease,background .18s ease,box-shadow .18s ease;position:relative}
[data-drop-target].is-drop-ready{outline-color:var(--kob-voice-primary);
  background:color-mix(in srgb,var(--kob-voice-primary) 6%,transparent);
  box-shadow:0 0 24px color-mix(in srgb,var(--kob-voice-primary) 25%,transparent)}
.mxp-slot{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-height:60px}
.mxp-slot.is-inline{min-height:0;flex-wrap:nowrap}
.mxp-slot:not(.is-inline):empty::after{content:"◌ vazio · solte botões aqui";
  font-size:10px;color:var(--DIM);opacity:.5;padding:14px 6px;pointer-events:none;
  font-family:var(--mono);letter-spacing:.08em}
.mxp-slot.is-inline:empty{display:none}

.mxp-btn{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  touch-action:none;font-family:var(--mono);font-weight:800;
  transition:transform .15s ease,opacity .15s ease,box-shadow .15s ease,
    background .15s ease,border-color .15s ease;transform:translateZ(0)}
.mxp-btn.is-holding{transform:scale(.88);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--kob-voice-primary) 25%,transparent),
    0 0 28px color-mix(in srgb,var(--kob-voice-primary) 35%,transparent)}
.mxp-btn.is-source{opacity:.28}
.mxp-btn.is-firing{box-shadow:0 0 0 3px color-mix(in srgb,var(--kob-voice-primary) 60%,transparent),
  0 0 40px color-mix(in srgb,var(--kob-voice-primary) 50%,transparent)}
.mxp-btn .mxp-icon{line-height:1;flex-shrink:0}
.mxp-btn .mxp-label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mxp-btn.slot-header{padding:6px 11px;border-radius:999px;

.mxp-btn.slot-aside{width:40px;height:40px;border-radius:12px;flex:0 0 40px;

.mxp-btn.slot-loose .mxp-label{position:absolute;left:50%;top:calc(100% + 4px);

<!-- ═══════════════ ENGINE DUAL OS ═══════════════ -->
<script>
(function(){
'use strict';
const ROOT = document.documentElement;
const THEME_KEY = 'dual-theme';
const stackWrap = document.getElementById('stackWrap');
const dock = document.getElementById('dock') || (()=>{
  const d = document.createElement('div'); d.id='dock'; document.body.appendChild(d); return d;
})();
const sessionStore = new Map();
const tabDataMap = new WeakMap();
const timers = new Map();
let counter = 1;
let activeWindow = null;

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const getWin = id => document.getElementById(id);
const isMax = w => !!w?.classList.contains('maximized');

/* state badge helper */
function tagState(win, state){
  if (!win) return;
  win.dataset.state = state;
  const b = win.querySelector('.state-badge');
  if (b){
    const colors = {active:'#39ffb6',loading:'#00e5ff',idle:'#ffd700',
      suspended:'#ff6b6b',created:'#aaa',closed:'#555'};
    b.style.color = colors[state] || '#aaa';
    b.textContent = '● ' + state;
  }
}

/* z-stack */
const zStack = [];
function bringToFront(win){
  if (!win) return;
  const i = zStack.indexOf(win);
  if (i !== -1) zStack.splice(i,1);
  zStack.push(win);
  zStack.forEach((w,idx)=>{ if(!w.classList.contains('maximized')) w.style.zIndex = String(1000+idx*10); });
  setActiveWindow(win);
}
function setActiveWindow(win){ activeWindow = win; syncHeader(); }
function syncHeader(){
  const inp = document.getElementById('urlInputNav');
  if (!inp) return;
  if (!activeWindow) return inp.value='';
  const d = tabDataMap.get(activeWindow);
  const t = d?.tabs.find(x=>x.id===d.activeId);
  inp.value = t?.url || '';
}

/* tab data */
function getTabData(win){
  if (!tabDataMap.has(win)){
    const src = win.querySelector('.win-frame')?.src || 'https://www.infodose.com.br/splash';
    const tab = { id:'tab-'+Date.now(), url:src,
      title:src.replace(/^https?:\/\//,'').split('/')[0]||'Nova Aba',
      fav:false, icon:'◉', createdAt:Date.now() };
    tabDataMap.set(win,{tabs:[tab],activeId:tab.id});
  }
  return tabDataMap.get(win);
}
function getActiveTab(win){
  const d = tabDataMap.get(win);
  return d?.tabs.find(t=>t.id===d.activeId) || d?.tabs[0] || null;
}
function addTab(win, url='https://www.infodose.com.br/splash'){
  const d = tabDataMap.get(win); if(!d) return;
  const tab = { id:'tab-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),
    url, title:url.replace(/^https?:\/\//,'').split('/')[0]||'Nova Aba',
    fav:false, icon:'◉', createdAt:Date.now() };
  d.tabs.push(tab); d.activeId = tab.id;
  renderTabCounter(win);
  const f = win.querySelector('.win-frame'); if (f) f.src = url;
  closeTabSwitcher();
}
function removeTab(win, tabId){
  const d = tabDataMap.get(win); if(!d || d.tabs.length<=1) return;
  const i = d.tabs.findIndex(t=>t.id===tabId); if(i<0) return;
  d.tabs.splice(i,1);
  if (d.activeId===tabId) d.activeId = d.tabs[Math.min(i,d.tabs.length-1)].id;
  renderTabCounter(win);
  const f = win.querySelector('.win-frame'); const a = getActiveTab(win);
  if (f && a) f.src = a.url;
  if (document.getElementById('tabSwitcherOverlay').classList.contains('open'))
    renderTabSwitcher(win);
}
function setActiveTab(win, tabId){
  const d = tabDataMap.get(win); if(!d) return;
  if (!d.tabs.some(t=>t.id===tabId)) return;
  d.activeId = tabId; renderTabCounter(win);
  const f = win.querySelector('.win-frame'); const a = getActiveTab(win);
  if (f && a) f.src = a.url;
  bringToFront(win);
}
function renderTabCounter(win){
  const d = tabDataMap.get(win); if(!d) return;
  const b = win.querySelector('.tab-counter');
  if (b) b.textContent = d.tabs.length;
}

/* tab switcher */
let switcherWin = null;
function openTabSwitcher(win){
  switcherWin = win;
  renderTabSwitcher(win);
  document.getElementById('tabSwitcherOverlay').classList.add('open');
}
function closeTabSwitcher(){
  document.getElementById('tabSwitcherOverlay').classList.remove('open');
  if (switcherWin) bringToFront(switcherWin);
  switcherWin = null;
}
function renderTabSwitcher(win){
  const grid = document.getElementById('tabGrid');
  const d = tabDataMap.get(win);
  if (!d) return grid.innerHTML='';
  grid.innerHTML='';
  d.tabs.forEach(tab=>{
    const c = document.createElement('div');
    c.className = 'tab-card' + (tab.id===d.activeId ? ' active' : '');
    c.innerHTML = `
      <div class="tab-title">${tab.title}</div>
      <div class="tab-url">${tab.url}</div>
      <div class="tab-state"><span class="tab-state-dot"></span> ATIVA</div>
      <button class="tab-close" title="Fechar">×</button>
      <button class="tab-fav ${tab.fav?'active':''}" title="Fav">${tab.fav?'★':'☆'}</button>`;
    c.addEventListener('click', e=>{
      if (e.target.closest('.tab-close') || e.target.closest('.tab-fav')) return;
      setActiveTab(win, tab.id); closeTabSwitcher();
    });
    c.querySelector('.tab-close').addEventListener('click', e=>{
      e.stopPropagation(); removeTab(win, tab.id);
    });
    c.querySelector('.tab-fav').addEventListener('click', e=>{
      e.stopPropagation(); tab.fav = !tab.fav; renderTabSwitcher(win);
    });
    grid.appendChild(c);
  });
}

/* WINDOW ACTIONS */
function toggleCollapse(id){
  const w = getWin(id); if(!w) return;
  if (isMax(w)){ w.classList.remove('maximized'); w.style.zIndex=''; }
  w.classList.toggle('collapsed');
  bringToFront(w);
}
function togglePeek(id){
  const w = getWin(id); if(!w) return;
  w.classList.toggle('peeked');
  bringToFront(w);
}
function maximizeWindow(id){
  const w = getWin(id); if(!w) return;
  if (isMax(w)){ w.classList.remove('maximized'); w.style.zIndex=''; }
  else { w.classList.add('maximized'); w.style.zIndex='94000'; }
  bringToFront(w);
}
function minimizeWindow(id){
  const w = getWin(id); if(!w) return;
  w.classList.remove('maximized');
  w.classList.add('minimized');
  document.getElementById('dock-'+id)?.remove();
  const b = document.createElement('button');
  b.type='button'; b.className='dock-bubble'; b.id='dock-'+id; b.textContent='۞';
  b.addEventListener('click', ()=>{
    w.classList.remove('minimized');
    bringToFront(w);
    b.remove();
  });
  dock.appendChild(b);
}
function closeWindow(id){
  const w = getWin(id); if(!w) return;
  document.getElementById('dock-'+id)?.remove();
  w.remove();
  sessionStore.delete(id);
  if (activeWindow === w) setActiveWindow(null);
}

/* create session window (from DUAL) */
function createSessionWindow({src='https://www.infodose.com.br/splash'}={}){
  const id = 'session-'+Date.now()+'-'+counter++;
  const w = document.createElement('section');
  w.className = 'session-window peeked';
  w.id = id;
  w.innerHTML = `
    <div class="win-hdr">
      <div class="win-controls">
        <button type="button" data-action="collapse" data-dual-target data-dual-action="win:collapse">−</button>
        <button type="button" data-action="tab-switcher" class="tab-counter" data-dual-target data-dual-action="win:tabs">1</button>
        <button type="button" data-action="maximize" data-dual-target data-dual-action="win:maximize">⛶</button>
        <button type="button" data-action="minimize" data-dual-target data-dual-action="win:minimize">۞</button>
        <button type="button" data-action="close" data-dual-target data-dual-action="win:close">×</button>
      </div>
      <div class="win-navrow" style="flex:2;min-width:0;pointer-events:auto">
        <input class="win-urlbar" type="text" value="${src}" placeholder="URL...">
        <button class="win-go-btn" type="button" data-dual-target data-dual-action="nav:go">Go</button>
      </div>
    </div>
    <iframe class="win-frame" data-runtime="nav" src="${src}"></iframe>`;
  stackWrap.appendChild(w);
  wireSession(w);
  bringToFront(w);
  tagState(w, 'loading');
  setTimeout(()=>tagState(w, 'active'), 500);
  return id;
}

/* wire controls */
function wireSession(w){
  if (!w || w.dataset.wired==='1') return;
  w.dataset.wired='1';

  // badge
  const hdr = w.querySelector('.win-hdr');
  if (hdr && !hdr.querySelector('.state-badge')){
    const b = document.createElement('span');
    b.className='state-badge'; b.textContent='●';
    hdr.appendChild(b);
  }
  tagState(w, 'active');

  w.addEventListener('pointerdown', ()=>bringToFront(w), {passive:true});
  w.addEventListener('focusin', ()=>bringToFront(w), {passive:true});

  const controls = w.querySelector('.win-controls');
  controls?.addEventListener('click', e=>{
    e.preventDefault(); e.stopPropagation();
    const btn = e.target.closest('button'); if(!btn) return;
    const a = btn.dataset.action;
    if (a==='collapse') toggleCollapse(w.id);
    else if (a==='maximize') maximizeWindow(w.id);
    else if (a==='minimize') minimizeWindow(w.id);
    else if (a==='close') closeWindow(w.id);
    else if (a==='tab-switcher') openTabSwitcher(w);
  });

  const inp = w.querySelector('.win-urlbar');
  const go = w.querySelector('.win-go-btn');
  go?.addEventListener('click', e=>{
    e.preventDefault(); e.stopPropagation();
    let url = inp.value.trim(); if(!url) return;
    if (!/^https?:\/\//i.test(url)) url = 'https://'+url;
    const f = w.querySelector('.win-frame'); if (f) f.src = url;
    const a = getActiveTab(w); if (a){ a.url = url; a.title = url.replace(/^https?:\/\//,'').split('/')[0]; }
    inp.value = url;
  });
  inp?.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.stopPropagation(); go?.click(); } });

  getTabData(w);
  renderTabCounter(w);
}

/* header scroll behavior */
const HEADER = document.getElementById('main-header');
let lastY = 0, ticking = false;
function updateHeader(){
  if (!HEADER) return;
  const y = window.scrollY;
  if (y<=10){ HEADER.classList.remove('header-hidden'); HEADER.classList.add('header-visible'); }
  else if (y > lastY + 8){ HEADER.classList.remove('header-visible'); HEADER.classList.add('header-hidden'); }
  else if (y < lastY - 8){ HEADER.classList.remove('header-hidden'); HEADER.classList.add('header-visible'); }
  lastY = y; ticking = false;
}
window.addEventListener('scroll', ()=>{ if(!ticking){ requestAnimationFrame(updateHeader); ticking=true; } }, {passive:true});

/* theme */
function applyTheme(t){
  const next = (t==='light') ? 'light' : 'dark';
  ROOT.dataset.theme = next;
  try { localStorage.setItem(THEME_KEY, next); } catch(_){}
  $$('.theme-dot').forEach(b=>{
    if (b.textContent.includes('☀') || b.textContent.includes('🌙'))
      b.textContent = next==='light' ? '☀' : '🌙';
  });
  window.dispatchEvent(new CustomEvent('dual:theme-change',{detail:{theme:next}}));
}
function getInitialTheme(){
  try { const s = localStorage.getItem(THEME_KEY); if(s) return s; } catch(_){}
  return 'dark';
}
window.DualTheme = {
  set: applyTheme,
  toggle(){ applyTheme(ROOT.dataset.theme==='light'?'dark':'light'); },
  get(){ return ROOT.dataset.theme || 'dark'; }
};
$$('.theme-dot').forEach(b=>b.addEventListener('click', e=>{
  e.preventDefault(); e.stopPropagation(); DualTheme.toggle();
}));
applyTheme(getInitialTheme());

/* global url */
const navInp = document.getElementById('urlInputNav');
const goNav = document.getElementById('goNavBtn');
function applyGlobalUrl(){
  if (!activeWindow) { createSessionWindow(); return; }
  let url = navInp.value.trim(); if(!url) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://'+url;
  const f = activeWindow.querySelector('.win-frame'); if (f) f.src = url;
  const a = getActiveTab(activeWindow); if (a){ a.url = url; a.title = url.replace(/^https?:\/\//,'').split('/')[0]; }
  navInp.value = url;
}
navInp?.addEventListener('keydown', e=>{ if(e.key==='Enter') applyGlobalUrl(); });
goNav?.addEventListener('click', applyGlobalUrl);

document.getElementById('newTabBtn')?.addEventListener('click', ()=>{
  if (switcherWin) addTab(switcherWin);
});
document.getElementById('closeTabSwitcher')?.addEventListener('click', closeTabSwitcher);

/* drawer */
window.toggleDrawer = function(id){
  const dr = document.getElementById(id || 'drawerProfile');
  const ov = document.getElementById('drawerOverlay');
  if (!dr) return;
  const open = dr.classList.toggle('open');
  ov.classList.toggle('open', open);
  dr.setAttribute('aria-hidden', open ? 'false' : 'true');
};
document.getElementById('orbToggle')?.addEventListener('click', ()=>toggleDrawer('drawerProfile'));
document.getElementById('menuBtn')?.addEventListener('click', ()=>toggleDrawer('drawerProfile'));

/* boot existing session */
$$('.session-window').forEach(w=>{
  wireSession(w);
  if (!activeWindow) setActiveWindow(w);
});
syncHeader();

/* expose */
window.createSessionWindow = createSessionWindow;
window.toggleCollapse = toggleCollapse;
window.maximizeWindow = maximizeWindow;
window.minimizeWindow = minimizeWindow;
window.closeWindow = closeWindow;
window.Dual = {
  get activeWindow(){ return activeWindow; },
  getWin, isMax, bringToFront,
  createSessionWindow, toggleCollapse, maximizeWindow, minimizeWindow, closeWindow,
  toggleDrawer, openTabSwitcher, closeTabSwitcher,
};
console.log('[DUAL] OS online');
})();
</script>

<!-- ═══════════════ MXP ENGINE + BRIDGE ═══════════════ -->
<script>
(function(){
'use strict';

const STORE = "mxp_alfabeta_v2";
const HOLD_MS = 400;
const MOVE_THRESHOLD = 14;
const DRAG_THRESHOLD = 20;

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = (p="x")=>p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ─── CATALOG ─── */
const CATALOG = [
  { category:"DUAL · SYSTEM", items:[
    ["dual:theme-toggle", "☼", "TEMA"],
    ["dual:drawer",       "🔅", "COCKPIT"],
    ["dual:theme-dot",    "🌙", "DIA/NOITE"],
    ["state:reset",       "⌦", "RESET"],
  ]},
  { category:"DUAL · WINDOW", items:[
    ["dual:new-session", "＋", "NOVA"],
    ["dual:win-max",     "⛶", "MAX"],
    ["dual:win-min",     "۞", "MIN"],
    ["dual:win-collapse","−", "COLLAPSE"],
    ["dual:win-close",   "×", "FECHAR"],
    ["dual:win-tabs",    "⊞", "ABAS"],
  ]},
  { category:"DUAL · NAV", items:[
    ["dual:nav-go",    "➤", "GO"],
    ["dual:focus-url", "⌨", "URL"],
  ]},
  { category:"MXP", items:[
    ["factory:open",   "◈", "FACTORY"],
    ["aside:toggle",   "☰", "TOGGLE"],
    ["session:new",    "◉", "SESSION"],
    ["orb:theme",      "◐", "THEME"],
    ["slot:clear",     "⌫", "CLEAR"],
  ]},
  { category:"MEDIA", items:[
    ["media:play",  "▶", "PLAY"],
    ["media:pause", "Ⅱ", "PAUSE"],
    ["media:stop",  "■", "STOP"],
  ]},
];

/* ─── STATE ─── */
function defaultState(){
  return { version:2, slots:{ header:[], aside:[], footer:[], loose:[] }, sessions:[] };
}
function load(){
  try { const r = localStorage.getItem(STORE); if(!r) return defaultState();
    return Object.assign(defaultState(), JSON.parse(r)); }
  catch(_){ return defaultState(); }
}
let state = load();
const save = ()=>{ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(_){} };

/* ─── DUAL BRIDGE ─── */
function activeDualWin(){
  const D = window.Dual;
  return D?.activeWindow || document.querySelector('.session-window:not(.minimized)') || null;
}
const BRIDGE = {
  "dual:theme-toggle": ()=>window.DualTheme?.toggle(),
  "dual:theme-dot":    ()=>window.DualTheme?.toggle(),
  "dual:drawer":       ()=>window.toggleDrawer?.("drawerProfile"),
  "dual:new-session":  ()=>window.createSessionWindow?.(),
  "dual:win-max":      ()=>{ const w = activeDualWin(); if (w) window.maximizeWindow?.(w.id); },
  "dual:win-min":      ()=>{ const w = activeDualWin(); if (w) window.minimizeWindow?.(w.id); },
  "dual:win-collapse": ()=>{ const w = activeDualWin(); if (w) window.toggleCollapse?.(w.id); },
  "dual:win-close":    ()=>{ const w = activeDualWin(); if (w) window.closeWindow?.(w.id); },
  "dual:win-tabs":     ()=>{ const w = activeDualWin(); if (w) window.Dual?.openTabSwitcher?.(w); },
  "dual:nav-go":       ()=>{
    const url = document.getElementById('urlInputNav')?.value?.trim();
    if (!url) return;
    document.getElementById('goNavBtn')?.click();
  },
  "dual:focus-url":    ()=>{ document.getElementById('urlInputNav')?.focus(); },
  "nav:next":          ()=>window.createSessionWindow?.(),
  "media:play":        ()=>{ if (window.Nebula?.toggleSpeech) window.Nebula.toggleSpeech();
                              else window.speechSynthesis?.resume?.(); },
  "media:pause":       ()=>window.speechSynthesis?.pause(),
  "media:stop":        ()=>window.speechSynthesis?.cancel(),
  "orb:theme":         ()=>window.DualTheme?.toggle(),
  "aside:toggle":      ()=>{ document.getElementById('symbolBar')?.classList.toggle('is-collapsed'); },
  "factory:open":      ()=>document.getElementById('mxd-factory')?.classList.add('is-open'),
  "factory:close":     ()=>document.getElementById('mxd-factory')?.classList.remove('is-open'),
  "session:new":       ()=>createSession(),
  "state:reset":       ()=>{
    if (!confirm("Resetar MXP?")) return;
    state = defaultState(); save(); renderAll(); toast("estado resetado");
  },
  "slot:clear":        (ctx)=>{ const s = ctx?.slot||"loose";
    if (state.slots[s]){ state.slots[s]=[]; save(); renderSlot(s); toast(`"${s}" limpo`); } },
};

function fire(action, ctx={}){
  if (!action) return;
  if (BRIDGE[action]) return BRIDGE[action](ctx);
  window.dispatchEvent(new CustomEvent("MXP_ACTION",{detail:{action,ctx}}));
}

/* ─── UI HELPERS ─── */
let toastTimer=null;
function toast(msg){
  const el = $("#mxd-toast"); if(!el) return;
  el.textContent = msg; el.classList.add("is-live");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("is-live"),1600);
}
function hud(msg){
  const el = $("#mxd-hud"); if(!el) return;
  if (msg){ el.textContent = msg; el.classList.add("is-live"); }
  else el.classList.remove("is-live");
}

/* ─── BUTTON FACTORY ─── */
function makeButton(item, slot){
  const b = document.createElement("button");
  b.type = "button";
  b.className = "mxp-btn";
  if (slot === "__factory__") b.classList.add("slot-factory");
  else if (slot.startsWith("session:")) b.classList.add("slot-session");
  else b.classList.add("slot-"+slot);

  b.dataset.id = item.id || uid("btn");
  b.dataset.action = item.action || "";
  b.dataset.label = item.label || "";
  b.dataset.icon = item.icon || "";
  b.dataset.slot = slot;
  if (item.binding) b.dataset.binding = item.binding;

  b.title = `${item.label} · ${item.action}`;
  b.innerHTML = `<span class="mxp-icon" data-part="icon">${item.icon||"•"}</span>
                 <span class="mxp-label" data-part="label">${item.label||""}</span>`;
  if (item.binding) b.classList.add("is-bound");
  return b;
}
function itemFromButton(btn){
  return { id:btn.dataset.id, action:btn.dataset.action, label:btn.dataset.label,
           icon:btn.dataset.icon, binding:btn.dataset.binding||"" };
}

/* ─── RENDER ─── */
function renderSlot(slot){
  const el = document.querySelector(`[data-slot="${slot}"]`); if(!el) return;
  el.innerHTML = "";
  (state.slots[slot]||[]).forEach(it=>el.appendChild(makeButton(it, slot)));
}
function renderFactory(){
  const root = $("#mxd-catalog"); if(!root) return;
  root.innerHTML = "";
  CATALOG.forEach(cat=>{
    const wrap = document.createElement("section");
    wrap.className = "mxd-cat";
    wrap.innerHTML = `<div class="mxd-cat-name">${cat.category}</div>`;
    const grid = document.createElement("div"); grid.className = "mxd-cat-grid";
    cat.items.forEach(([action,icon,label])=>{
      grid.appendChild(makeButton({id:uid("factory"),action,icon,label}, "__factory__"));
    });
    wrap.appendChild(grid); root.appendChild(wrap);
  });
}
function renderSessions(){
  const root = $("#mxd-sessions") || document.createElement("section");
  root.id = "mxd-sessions"; if (!root.parentNode) document.querySelector(".shell main")?.appendChild(root);
  root.innerHTML = "";
  state.sessions.forEach(s=>{
    const node = $("#tpl-session").content.cloneNode(true);
    const win = $(".mxd-window, .session-window[data-type='session']", node);
    win.dataset.sessionId = s.id;
    $("[data-part='title']", win).textContent = s.name;
    const slot = $("[data-part='slot']", win);
    slot.dataset.slot = "session:"+s.id;
    slot.dataset.sessionId = s.id;
    root.appendChild(node);
    state.slots["session:"+s.id] ??= [];
    renderSlot("session:"+s.id);
    attachSessionInteractions(win, s);
  });
}
function renderAll(){
  renderFactory(); renderSlot("header"); renderSlot("aside");
  renderSlot("footer"); renderSlot("loose"); renderSessions();
}

/* ─── MUTATIONS ─── */
function addToSlot(item, slot){
  state.slots[slot] ??= [];
  const copy = { ...item, id:item.id||uid("btn") };
  state.slots[slot].push(copy); save(); renderSlot(slot);
  toast(`+ ${copy.label||copy.action} → ${slot}`);
}
function removeItem(id, slot){
  if (!state.slots[slot]) return;
  state.slots[slot] = state.slots[slot].filter(x=>x.id!==id);
  save(); renderSlot(slot); toast("removido");
}
function moveItem(id, from, to){
  if (from === to) return;
  const list = state.slots[from]||[]; const i = list.findIndex(x=>x.id===id);
  if (i<0) return;
  const item = list.splice(i,1)[0];
  state.slots[to] ??= []; state.slots[to].push(item);
  save(); renderSlot(from); renderSlot(to); toast(`movido → ${to}`);
}

/* ─── SESSIONS (MXP) ─── */
function createSession(name="SESSION"){
  const s = { id:uid("session"), name };
  state.sessions.push(s); state.slots["session:"+s.id]=[];
  save(); renderSessions(); toast(`session "${name}" criada`);
  return s;
}
function attachSessionInteractions(win, session){
  const title = $("[data-part='title']", win);
  title?.addEventListener("click", ()=>{
    const novo = prompt("Nome:", session.name);
    if (novo && novo.trim()){ session.name = novo.trim(); title.textContent = novo.trim(); save(); toast("renomeada"); }
  });
}

/* ─── CLICK DISPATCH ─── */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-action]");
  if (!el) return;
  if (el.hasAttribute("data-win-action")) return;
  if (el.dataset.gestureConsumed === "1"){ delete el.dataset.gestureConsumed; return; }
  fire(el.dataset.action, { element:el, slot:el.dataset.slot });
});

/* ─── WIN ACTIONS (MXP templates) ─── */
document.addEventListener("click", e=>{
  const btn = e.target.closest("[data-win-action]"); if(!btn) return;
  const win = btn.closest("[data-type='session']"); if(!win) return;
  const id = win.dataset.sessionId; const a = btn.dataset.action;
  if (a==="win:minimize") win.classList.toggle("is-min");
  if (a==="win:maximize") win.classList.toggle("is-max");
  if (a==="win:close"){
    if (!confirm("Fechar session?")) return;
    state.sessions = state.sessions.filter(s=>s.id!==id);
    delete state.slots["session:"+id]; save(); renderSessions();
  }
  if (a==="win:run"){
    const items = state.slots["session:"+id]||[];
    if (!items.length) return toast("session vazia");
    items.forEach((it,i)=>setTimeout(()=>fire(it.action,{slot:"session:"+id}), i*180));
    toast(`executando ${items.length} ações`);
  }
});

/* ─── UNIVERSAL DRAG ENGINE ─── */
let gesture = null;

document.addEventListener("pointerdown", e=>{
  const btn = e.target.closest(".mxp-btn"); if(!btn) return;
  if (btn.closest("[data-win-action]")) return;
  if (e.pointerType==="mouse" && e.button!==0) return;
  e.preventDefault();

  gesture = {
    btn, pointerId:e.pointerId, startX:e.clientX, startY:e.clientY,
    x:e.clientX, y:e.clientY, slot:btn.dataset.slot,
    item:itemFromButton(btn), dragging:false, timer:null, ghost:null,
    dualHover:null,
  };
  btn.classList.add("is-holding");
  gesture.timer = setTimeout(startFakeDrag, HOLD_MS);
}, { passive:false });

document.addEventListener("pointermove", e=>{
  if (!gesture || gesture.pointerId!==e.pointerId) return;
  gesture.x = e.clientX; gesture.y = e.clientY;
  const dx = e.clientX-gesture.startX, dy = e.clientY-gesture.startY;
  if (!gesture.dragging && Math.hypot(dx,dy) > MOVE_THRESHOLD){ cancelGesture(); return; }
  if (!gesture.dragging) return;
  e.preventDefault();
  moveGhost(e.clientX, e.clientY);
  updateDropTargets(e.clientX, e.clientY);
  updateDualTargets(e.clientX, e.clientY);
}, { passive:false });

document.addEventListener("pointerup", e=>{
  if (!gesture || gesture.pointerId!==e.pointerId) return;
  if (gesture.dragging){
    const dx = Math.abs(e.clientX-gesture.startX), dy = Math.abs(e.clientY-gesture.startY);
    const moved = Math.hypot(dx,dy) > DRAG_THRESHOLD;
    if (moved) finishFakeDrag(e.clientX, e.clientY);
    else {
      const { btn, slot } = gesture;
      cleanupDrag(); gesture = null;
      openContext(btn, slot); return;
    }
  } else {
    clearTimeout(gesture.timer);
    gesture.btn.classList.remove("is-holding");
    gesture = null;
  }
}, { passive:false });

document.addEventListener("pointercancel", cancelGesture);

function startFakeDrag(){
  if (!gesture) return;
  gesture.dragging = true;
  gesture.btn.classList.remove("is-holding");
  gesture.btn.classList.add("is-source");
  document.body.classList.add("mxp-dragging");
  const trash = $("#mxd-trash"); if (trash) trash.classList.add("is-active");
  hud("segure · solte em um slot OU sobre um controle DUAL");
  const ghost = document.createElement("div");
  ghost.id = "mxd-ghost";
  ghost.textContent = gesture.item.icon || "•";
  document.body.appendChild(ghost);
  gesture.ghost = ghost;
  requestAnimationFrame(()=>ghost.classList.add("is-live"));
  moveGhost(gesture.x, gesture.y);
}
function moveGhost(x,y){
  if (!gesture?.ghost) return;
  gesture.ghost.style.left = x+"px"; gesture.ghost.style.top = y+"px";
}
function getDropTarget(x,y){
  if (gesture?.ghost) gesture.ghost.style.display = "none";
  const el = document.elementFromPoint(x,y);
  if (gesture?.ghost) gesture.ghost.style.display = "grid";
  return el?.closest("[data-drop-target]");
}
function getDualTarget(x,y){
  if (gesture?.ghost) gesture.ghost.style.display = "none";
  const el = document.elementFromPoint(x,y);
  if (gesture?.ghost) gesture.ghost.style.display = "grid";
  return el?.closest("[data-dual-target]");
}
function updateDropTargets(x,y){
  $$("[data-drop-target]").forEach(el=>el.classList.remove("is-drop-ready"));
  const trash = $("#mxd-trash"); if (trash) trash.classList.remove("is-over");
  const t = getDropTarget(x,y); if (!t) return;
  if (t.dataset.trash !== undefined){
    trash.classList.add("is-over");
    hud(`soltar para remover · ${gesture.item.label||gesture.item.action}`);
    return;
  }
  t.classList.add("is-drop-ready");
  hud(`soltar em · ${t.dataset.slot || "slot"}`);
}
function updateDualTargets(x,y){
  $$("[data-dual-target].is-dual-hover").forEach(el=>el.classList.remove("is-dual-hover"));
  gesture.dualHover = null;
  const d = getDualTarget(x,y);
  if (d){
    d.classList.add("is-dual-hover");
    gesture.dualHover = d;
    hud(`⛓ vincular a · ${d.dataset.dualAction || 'DUAL'}`);
  }
}
function finishFakeDrag(x,y){
  clearTimeout(gesture.timer);
  const dualTarget = getDualTarget(x,y);
  const target = getDropTarget(x,y);

  // 1. DUAL binding has priority
  if (dualTarget && gesture.slot !== "__factory__"){
    const dualAction = dualTarget.dataset.dualAction;
    // Persist binding on the item
    const list = state.slots[gesture.slot]||[];
    const idx = list.findIndex(i=>i.id===gesture.item.id);
    if (idx >= 0){
      list[idx].binding = dualAction;
      list[idx].action = "dual:"+dualAction; // remap action
      save();
      renderSlot(gesture.slot);
      toast(`⛓ vinculado a ${dualAction}`);
    }
    cleanupDrag(); gesture=null; return;
  }

  // 2. trash
  if (target && target.dataset.trash !== undefined){
    if (gesture.slot !== "__factory__") removeItem(gesture.item.id, gesture.slot);
    cleanupDrag(); gesture=null; return;
  }

  // 3. slot drop
  if (target){
    const to = target.dataset.slot;
    if (gesture.slot === "__factory__") addToSlot({...gesture.item, id:uid("btn")}, to);
    else moveItem(gesture.item.id, gesture.slot, to);
    cleanupDrag(); gesture=null; return;
  }

  cleanupDrag(); gesture=null;
}
function cleanupDrag(){
  if (!gesture) return;
  gesture.btn.classList.remove("is-source");
  gesture.ghost?.remove(); gesture.ghost=null;
  const trash = $("#mxd-trash"); if (trash) trash.classList.remove("is-active","is-over");
  $$("[data-drop-target]").forEach(el=>el.classList.remove("is-drop-ready"));
  $$("[data-dual-target].is-dual-hover").forEach(el=>el.classList.remove("is-dual-hover"));
  document.body.classList.remove("mxp-dragging");
  hud("");
}
function cancelGesture(){
  if (!gesture) return;
  clearTimeout(gesture.timer);
  gesture.btn.classList.remove("is-holding","is-source");
  gesture.ghost?.remove();
  const trash = $("#mxd-trash"); if (trash) trash.classList.remove("is-active","is-over");
  $$("[data-drop-target]").forEach(el=>el.classList.remove("is-drop-ready"));
  $$("[data-dual-target].is-dual-hover").forEach(el=>el.classList.remove("is-dual-hover"));
  document.body.classList.remove("mxp-dragging");
  hud(""); gesture=null;
}

/* ─── CONTEXT MENU ─── */
let contextItem = null;
function openContext(btn, slot){
  if (slot === "__factory__") return;
  contextItem = { btn, item:itemFromButton(btn), slot };
  const menu = $("#mxd-context");
  const head = $("#mxd-ctx-head");
  if (head) head.textContent = contextItem.item.label || contextItem.item.action;
  const r = btn.getBoundingClientRect();
  menu.style.left = Math.min(window.innerWidth-200, Math.max(10,r.left))+"px";
  menu.style.top  = Math.min(window.innerHeight-240, r.bottom+8)+"px";
  menu.classList.add("is-open");
}
function closeContext(){
  $("#mxd-context").classList.remove("is-open");
  contextItem = null;
}
$("#mxd-context").addEventListener("click", e=>{
  const a = e.target.closest("[data-context-action]")?.dataset.contextAction;
  if (!a || !contextItem) return;
  const { item, slot } = contextItem;
  if (a==="fire") fire(item.action, { item, slot });
  if (a==="duplicate") addToSlot({...item, id:uid("copy"), binding:""}, slot);
  if (a==="unbind"){
    const list = state.slots[slot]||[]; const i = list.findIndex(x=>x.id===item.id);
    if (i>=0){ list[i].binding = ""; save(); renderSlot(slot); toast("desvinculado"); }
  }
  if (a==="favorite"){
    const s = createSession("fav:"+(item.label||item.action));
    addToSlot({...item, id:uid("fav")}, "session:"+s.id);
  }
  if (a==="remove") removeItem(item.id, slot);
  closeContext();
});
document.addEventListener("pointerdown", e=>{
  if ($("#mxd-context").classList.contains("is-open") &&
      !e.target.closest("#mxd-context")) closeContext();
});

/* ─── FACTORY backdrop ─── */
$("#mxd-factory").addEventListener("click", e=>{
  if (e.target.id === "mxd-factory") $("#mxd-factory").classList.remove("is-open");
});

/* ─── KEYBOARD ─── */
document.addEventListener("keydown", e=>{
  if ((e.ctrlKey||e.metaKey) && e.shiftKey && e.key.toLowerCase()==="b"){
    e.preventDefault();
    $("#mxd-factory").classList.toggle("is-open");
  }
  if (e.key === "Escape"){
    $("#mxd-factory").classList.remove("is-open");
    closeContext();
  }
});

/* ─── SEED ─── */
function seed(){
  const empty = !state.slots.header?.length && !state.slots.aside?.length &&
    !state.slots.footer?.length && !state.slots.loose?.length && !state.sessions.length;
  if (!empty) return;
  state.slots.header = [
    { id:uid("s"), action:"dual:theme-toggle", icon:"☼", label:"TEMA" },
  ];
  state.slots.aside = [
    { id:uid("s"), action:"factory:open",     icon:"◈", label:"FACTORY" },
    { id:uid("s"), action:"dual:new-session", icon:"＋", label:"NOVA" },
    { id:uid("s"), action:"aside:toggle",     icon:"☰", label:"TOGGLE" },
  ];
  state.slots.footer = [
    { id:uid("s"), action:"dual:win-max", icon:"⛶", label:"MAX" },
    { id:uid("s"), action:"dual:drawer",  icon:"🔅", label:"COCKPIT" },
  ];
  state.slots.loose = [
    { id:uid("s"), action:"dual:win-tabs", icon:"⊞", label:"ABAS" },
    { id:uid("s"), action:"dual:nav-go",   icon:"➤", label:"GO" },
  ];
  save();
}

/* ─── BOOT ─── */
seed();
renderAll();

/* ─── PUBLIC API ─── */
window.MXP = {
  get state(){ return state; },
  BRIDGE, CATALOG, fire,
  createSession, addToSlot, removeItem, moveItem,
  toast, render: renderAll,
  reset(){ state = defaultState(); save(); renderAll(); },
  on(action, cb){
    window.addEventListener("MXP_ACTION", e=>{
      if (e.detail?.action === action) cb(e.detail.ctx);
    });
  },
};
console.log('[MXP] Universal online · bridge ready');
})();
</script>
