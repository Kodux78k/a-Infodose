<!DOCTYPE html>
<html lang="pt-BR" data-arch="" data-opcode="" data-camada="METΔ0" data-sistema="KOBLLUX-INFODOSE" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ALFABETA · DUAL OS · MXP UNIVERSAL</title>

<style>
:root{
  --BG:#07070a; --FG:#f2f0ea; --GRID:rgba(255,255,255,.022); --DIM:#8a8a95;
  --CARD:rgba(255,255,255,.035); --CARD-BRD:rgba(255,255,255,.075);
  --LINE:rgba(255,255,255,.08); --GLASS:rgba(10,14,26,.88); --GLASS-2:rgba(8,8,16,.94);
  --KBLX_A:#3b82f6;--KBLX_B:#00f5ff;--KBLX_C:#ec4899;--KBLX_D:#ff4bff;
  --KBLX_E:#f59e0b;--KBLX_F:#c9a84c;--KBLX_G:#10b981;--KBLX_H:#94a3b8;
  --KBLX_I:#00e5ff;--KBLX_J:#8b5cf6;--KBLX_K:#34d399;--KBLX_L:#fbbf24;
  --KBLX_M:#ef4444;--KBLX_N:#06b6d4;--KBLX_O:#a855f7;--KBLX_P:#818cf8;
  --KBLX_Q:#ffd700;--KBLX_R:#6B44AD;--KBLX_T:#e8e0f0;--KBLX_X:#ff4b6b;
  --active-color:var(--KBLX_Q); --active-secondary:var(--KBLX_F);
  --active-glow:rgba(255,215,0,.4); --active-hz:777;
  --kob-voice-primary:#FFD700; --kob-voice-secondary:#FFB84D;
  --mono:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
  --orb-speed:7.2s; --z-system:9000;
  --z-base:0;--z-content:100;--z-widget:500;--z-overlay:1000;
  --nb-bg:#050608; --nb-text:#f4f7fa; --nb-muted:#77828d;
  --nb-cyan:#00f2ff; --nb-green:#39ffb6; --nb-border:rgba(255,255,255,.10);
  --nb-reader-radius:28px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-right:env(safe-area-inset-right,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --topbar-h:58px; --header-h:52px;
  --session-radius:22px; --session-gap:16px;
  --collapsed-h:52px; --peek-h:178px;
  --resize-corner:54px;
  --z-session:1000; --z-dock:97000;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
html,body{background:var(--BG);color:var(--FG);overflow-x:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
body{position:relative;transition:background .6s,color .6s}

/* arch voices */
body[data-voice-arch="kobllux"]{--kob-voice-primary:#22D3EE;--kob-voice-secondary:#0E7C9E}
body[data-voice-arch="kodux"]  {--kob-voice-primary:#F97316;--kob-voice-secondary:#C2410C}
body[data-voice-arch="atlas"]  {--kob-voice-primary:#38BDF8;--kob-voice-secondary:#1E3A8A}
body[data-voice-arch="nova"]   {--kob-voice-primary:#F72585;--kob-voice-secondary:#7209B7}
body[data-voice-arch="vitalis"]{--kob-voice-primary:#22C55E;--kob-voice-secondary:#166534}
body[data-voice-arch="pulse"]  {--kob-voice-primary:#EC4899;--kob-voice-secondary:#831843}
body[data-voice-arch="artemis"]{--kob-voice-primary:#A855F7;--kob-voice-secondary:#5B21B6}
body[data-voice-arch="serena"] {--kob-voice-primary:#38BDF8;--kob-voice-secondary:#1E3A8A}
body[data-voice-arch="kaos"]   {--kob-voice-primary:#FACC15;--kob-voice-secondary:#B45309}
body[data-voice-arch="genus"]  {--kob-voice-primary:#E5E7EB;--kob-voice-secondary:#4B5563}
body[data-voice-arch="lumine"] {--kob-voice-primary:#FDE047;--kob-voice-secondary:#CA8A04}
body[data-voice-arch="solus"]  {--kob-voice-primary:#0EA5E9;--kob-voice-secondary:#0369A1}
body[data-voice-arch="rhea"]   {--kob-voice-primary:#22C55E;--kob-voice-secondary:#166534}
body[data-voice-arch="aion"]   {--kob-voice-primary:#4F46E5;--kob-voice-secondary:#3730A3}
body[data-voice-arch="jesus"]  {--kob-voice-primary:#FFD700;--kob-voice-secondary:#FFB84D}

/* solar modes */
body.mode-day{background:#f5f7fb;color:#1a1a22;--BG:#f5f7fb;--FG:#1a1a22;--CARD:rgba(0,0,0,.03);--CARD-BRD:rgba(0,0,0,.08);--LINE:rgba(0,0,0,.1)}
body.mode-sunset{background:#1a0d18;color:#fbe6d4;--BG:#1a0d18}
body.mode-night{background:var(--BG);color:var(--FG)}

.theme-layer{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--BG);transition:background 1.2s ease}
.theme-grad{position:fixed;inset:0;pointer-events:none;z-index:1;background:
  radial-gradient(circle at 20% 10%,color-mix(in srgb,var(--active-color) 9%,transparent),transparent 42%),
  radial-gradient(circle at 85% 60%,color-mix(in srgb,var(--active-secondary) 7%,transparent),transparent 45%)}
.theme-grid{position:fixed;inset:0;pointer-events:none;z-index:2;background-image:
  linear-gradient(var(--GRID) 1px,transparent 1px),
  linear-gradient(90deg,var(--GRID) 1px,transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 75%);
  -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 75%)}

/* ambient blobs (kxt-solar) */
.ambient-light{position:fixed;inset:0;z-index:0;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.14;animation:float 25s infinite alternate ease-in-out}
.blob-1{width:60vw;height:60vw;background:var(--kob-voice-primary);top:-20%;left:-20%}
.blob-2{width:50vw;height:50vw;background:var(--kob-voice-secondary);bottom:-20%;right:-20%;animation-delay:-5s}
@keyframes float{from{transform:translate(0,0)}to{transform:translate(30px,40px)}}

#bg-fake-custom{position:fixed;inset:0;z-index:-1;pointer-events:none;background-size:cover;background-position:center;opacity:0;transition:opacity .4s ease;mix-blend-mode:overlay}

/* ═══════════════════════════════════════════════════════════
     1 · LOADER · PROGRESS · RIPLE
     ═══════════════════════════════════════════════════════════ */
#loader{position:fixed;inset:0;background:var(--BG);z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity .7s,visibility .7s}
#loader.hide{opacity:0;visibility:hidden}
.loader-orb{width:120px;height:120px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 35% 30%,var(--kob-voice-primary) 0%,rgba(255,255,255,.05) 20%,transparent 55%),
    radial-gradient(circle at 70% 72%,var(--kob-voice-secondary) 0%,var(--kob-voice-primary) 100%);
  box-shadow:0 0 60px var(--kob-voice-primary),0 0 120px var(--kob-voice-secondary);
  animation:orbSpin 7.2s linear infinite}
.loader-orb::after{content:"∆";position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:900;color:var(--BG);animation:orbSpin 7.2s linear infinite reverse}
@keyframes orbSpin{to{transform:rotate(360deg)}}
.loader-track{position:absolute;bottom:28%;left:50%;transform:translateX(-50%);width:180px;height:1px;background:var(--CARD-BRD);overflow:hidden;border-radius:2px}
.loader-track::after{content:"";position:absolute;left:0;top:0;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--kob-voice-primary),transparent);animation:loadSlide 1.2s infinite ease-in-out}
@keyframes loadSlide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

.progress{position:fixed;left:0;top:0;height:2px;background:linear-gradient(90deg,var(--active-color),var(--active-secondary),var(--KBLX_F));z-index:200;width:0;transition:width .15s linear;box-shadow:0 0 12px var(--active-glow)}

.chroma-ripple{position:fixed;inset:0;z-index:calc(var(--z-system) - 1);pointer-events:none;opacity:0;background:radial-gradient(circle at var(--ripple-x,50%) var(--ripple-y,50%),var(--kob-voice-primary) 0%,color-mix(in srgb,var(--kob-voice-secondary) 60%,transparent) 30%,transparent 70%)}
.chroma-ripple.fire{animation:chromaFire .75s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes chromaFire{0%{opacity:.24;transform:scale(.2)}40%{opacity:.18;transform:scale(1.4)}100%{opacity:0;transform:scale(2.2)}}

/* ═══════════════════════════════════════════════════════════
     2 · TOPBAR · HERO · TRINITY
     ═══════════════════════════════════════════════════════════ */
.topbar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  z-index:100;background:linear-gradient(180deg,color-mix(in srgb,var(--BG) 94%,transparent),transparent 70%);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-height:56px}
@media(min-width:640px){.topbar{max-width:720px}}
.brand{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--DIM);font-weight:800;flex-shrink:0}
.brand-dot{width:6px;height:6px;border-radius:50%;background:var(--active-color);
  box-shadow:0 0 12px var(--active-color);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.top-pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;flex:1}
.pill{font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;
  padding:6px 11px;border-radius:999px;border:1px solid var(--CARD-BRD);background:var(--CARD);
  color:var(--DIM);font-family:var(--mono);white-space:nowrap}
.pill.arch{border-color:color-mix(in srgb,var(--kob-voice-primary) 50%,transparent);
  color:var(--kob-voice-primary);background:color-mix(in srgb,var(--kob-voice-primary) 12%,transparent);
  box-shadow:0 0 12px color-mix(in srgb,var(--kob-voice-primary) 40%,transparent)}

.app{position:relative;z-index:3;max-width:520px;margin:0 auto;min-height:100vh;padding:0 0 140px;overflow:hidden}
@media(min-width:640px){.app{max-width:720px}}
.hero{position:relative;min-height:68vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:80px 24px 40px;overflow:hidden}
.hero-layer{position:absolute;inset:0;pointer-events:none}
.layer-ring{border-radius:50%;border:1px solid color-mix(in srgb,var(--active-color) 18%,transparent);left:50%;top:50%;position:absolute}
.ring-1{width:340px;height:340px;margin:-170px 0 0 -170px;border-color:color-mix(in srgb,var(--active-color) 28%,transparent)}
.ring-2{width:500px;height:500px;margin:-250px 0 0 -250px;border-color:color-mix(in srgb,var(--active-secondary) 18%,transparent)}
.ring-3{width:700px;height:700px;margin:-350px 0 0 -350px;border-color:rgba(201,168,76,.12)}
.ring-4{width:920px;height:920px;margin:-460px 0 0 -460px;border-color:color-mix(in srgb,var(--FG) 4%,transparent)}
.layer-orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.42}
.orb-a{width:260px;height:260px;background:var(--active-color);top:15%;left:-60px}
.orb-b{width:300px;height:300px;background:var(--active-secondary);bottom:10%;right:-80px}
.orb-c{width:200px;height:200px;background:var(--KBLX_F);top:45%;right:20%}
.hero-content{position:relative;z-index:5;text-align:center;width:100%}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--DIM);font-weight:700;padding:7px 14px;border-radius:999px;border:1px solid var(--CARD-BRD);background:var(--CARD);margin-bottom:28px;font-family:var(--mono)}
.kicker span{color:var(--kob-voice-primary)}
.word-main{font-size:clamp(34px,10vw,58px);font-weight:200;letter-spacing:-.03em;line-height:1;background:linear-gradient(180deg,var(--FG),color-mix(in srgb,var(--FG) 75%,transparent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;position:relative}
.word-main::after{content:"";position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);width:80px;height:2px;background:linear-gradient(90deg,transparent,var(--kob-voice-primary),transparent)}
.dual-scripts{display:flex;flex-direction:column;gap:6px;margin-top:28px;align-items:center}
.script-hi{font-size:22px;color:var(--KBLX_E);text-shadow:0 0 24px rgba(245,158,11,.35)}
.script-ur{font-size:26px;color:var(--KBLX_N);text-shadow:0 0 24px rgba(6,182,212,.35);direction:rtl;line-height:1.6}
.meaning-short{margin-top:26px;font-size:12px;color:var(--DIM);max-width:340px;margin-left:auto;margin-right:auto;font-family:var(--mono)}

#trinityBar{position:relative;z-index:5;display:flex;align-items:stretch;justify-content:center;gap:6px;padding:6px 16px 12px;max-width:520px;margin:0 auto}
@media(min-width:640px){#trinityBar{max-width:720px}}
.tri-seg{flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:9px 8px;border-radius:14px;border:1px solid var(--CARD-BRD);background:var(--CARD);opacity:.55}
.tri-seg.active{opacity:1;border-color:var(--tri-c,var(--active-color));background:color-mix(in srgb,var(--tri-c,var(--active-color)) 10%,transparent)}
.tri-seg.tri-master{--tri-c:var(--KBLX_Q)}
.tri-seg[data-tri="UNO"]{--tri-c:var(--KBLX_A)}
.tri-seg[data-tri="DUO"]{--tri-c:var(--KBLX_G)}
.tri-seg[data-tri="TRINITY"]{--tri-c:var(--KBLX_Q)}
.tri-k{font-family:var(--mono);font-size:8px;letter-spacing:.28em;color:var(--tri-c);font-weight:900}
.tri-n{font-size:12px;font-weight:800;color:var(--FG);margin-top:2px}
.tri-r{font-family:var(--mono);font-size:7px;color:var(--DIM);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.tri-v{font-size:9px;color:color-mix(in srgb,var(--FG) 50%,transparent);font-style:italic;margin-top:3px;line-height:1.35}
.tri-arrow{align-self:center;color:var(--DIM);font-size:10px}
@media(max-width:520px){.tri-v{display:none}}

/* ═══════════════════════════════════════════════════════════
     3 · SECTIONS · DOSE · TEXTAREA · ACTIONS
     ═══════════════════════════════════════════════════════════ */
.section{padding:30px 20px 0;position:relative;max-width:520px;margin:0 auto}
@media(min-width:640px){.section{max-width:720px}}
.section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
.section-num{font-size:10px;letter-spacing:.2em;color:var(--kob-voice-primary);font-weight:800;font-family:var(--mono)}
.section-title{font-size:19px;font-weight:300;color:var(--FG)}
.section-sub{font-size:11px;color:var(--DIM);margin-top:3px}
.dose{position:relative;padding:22px 20px;border:1px solid var(--CARD-BRD);background:var(--CARD);border-radius:18px;backdrop-filter:blur(12px);overflow:hidden}
.dose::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--arch-color,var(--active-color)),transparent);opacity:.7}
textarea{width:100%;min-height:150px;resize:vertical;padding:16px;border-radius:14px;border:1px solid var(--CARD-BRD);background:color-mix(in srgb,var(--BG) 60%,transparent);color:var(--FG);font:13px/1.6 var(--mono);outline:none}
textarea:focus{border-color:color-mix(in srgb,var(--kob-voice-primary) 55%,transparent)}
.counter{font-size:9px;color:var(--DIM);font-family:var(--mono)}
.input-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.label{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--DIM)}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.action{min-height:44px;padding:10px 12px;border:1px solid var(--CARD-BRD);border-radius:14px;background:var(--CARD);color:var(--FG);cursor:pointer;font-size:10px;font-weight:900;letter-spacing:.06em;font-family:inherit;transition:transform .16s}
.action:active{transform:scale(.97)}
.action.primary{border-color:color-mix(in srgb,var(--kob-voice-primary) 55%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--kob-voice-primary) 25%,transparent),color-mix(in srgb,var(--kob-voice-secondary) 12%,transparent))}
.action.slicer{border-color:rgba(0,242,255,.45);background:linear-gradient(135deg,rgba(0,242,255,.18),rgba(57,255,182,.08));color:#c9f6ff}
.action.audio{border-color:color-mix(in srgb,var(--KBLX_G) 40%,transparent);background:color-mix(in srgb,var(--KBLX_G) 8%,transparent)}
.action.full{grid-column:1/-1}
@media(max-width:420px){.actions{grid-template-columns:1fr}}

.bank{display:flex;flex-wrap:wrap;gap:6px;max-height:220px;overflow-y:auto;padding-top:4px}
.token{display:inline-flex;align-items:center;min-height:26px;padding:5px 10px;border:1px solid var(--CARD-BRD);border-radius:999px;background:var(--CARD);color:color-mix(in srgb,var(--FG) 78%,transparent);font:10px var(--mono)}
.token.prep{color:var(--KBLX_E);border-color:rgba(245,158,11,.25)}
.token.conn{color:var(--KBLX_N);border-color:rgba(6,182,212,.25)}
.token.pron{color:var(--KBLX_J);border-color:rgba(139,92,246,.25)}

.chat-window{position:relative;max-height:min(62vh,620px);min-height:220px;overflow-y:auto;padding:14px;border-radius:20px;border:1px solid var(--CARD-BRD);background:linear-gradient(180deg,color-mix(in srgb,var(--BG) 45%,transparent),color-mix(in srgb,var(--BG) 15%,transparent));box-shadow:inset 0 2px 18px rgba(0,0,0,.55);overscroll-behavior:contain}
.conversation{display:flex;flex-direction:column;gap:12px}
.empty{padding:50px 20px;text-align:center;border:1px dashed color-mix(in srgb,var(--FG) 12%,transparent);border-radius:18px;color:color-mix(in srgb,var(--FG) 45%,transparent);font-size:12px;line-height:1.6}
.empty b{color:color-mix(in srgb,var(--FG) 70%,transparent);font-weight:700}
.round{font-family:var(--mono);font-size:9px;color:var(--DIM)}
.message{position:relative;max-width:84%;padding:12px 14px 11px;border:1px solid var(--CARD-BRD);background:var(--CARD);border-radius:16px;overflow:hidden;animation:msgIn .42s cubic-bezier(.2,.8,.2,1) both}
.message::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--arch-color,var(--active-color)),transparent);opacity:.85}
.message.alpha{margin-right:auto;border-bottom-left-radius:5px;background:linear-gradient(135deg,color-mix(in srgb,var(--arch-color,var(--active-color)) 12%,transparent),var(--CARD))}
.message.beta{margin-left:auto;border-bottom-right-radius:5px;background:linear-gradient(225deg,color-mix(in srgb,var(--arch-color,var(--active-color)) 10%,transparent),var(--CARD))}
.message.playing{border-color:var(--arch-color,var(--active-color));box-shadow:0 0 28px color-mix(in srgb,var(--arch-color,var(--active-color)) 32%,transparent)}
@keyframes msgIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.msg-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.msg-who{font-size:9px;font-weight:900;letter-spacing:.14em;color:var(--arch-color,var(--active-color));font-family:var(--mono)}
.msg-type{margin-left:auto;font-size:8px;color:var(--DIM);font-family:var(--mono)}
.arch-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;border:1px solid color-mix(in srgb,var(--arch-color,var(--gold)) 50%,transparent);background:color-mix(in srgb,var(--arch-color,var(--gold)) 14%,transparent);color:var(--arch-color,var(--gold));font-size:7px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;font-family:var(--mono)}
.arch-chip i{width:4px;height:4px;border-radius:50%;background:currentColor}
.msg-text{color:var(--FG);font-size:13px;line-height:1.6;white-space:pre-wrap}
.msg-actions{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.msg-mini{min-width:34px;min-height:26px;padding:5px 9px;border:1px solid var(--CARD-BRD);border-radius:9px;background:var(--CARD);color:color-mix(in srgb,var(--FG) 55%,transparent);cursor:pointer;font-size:9px;font-weight:800;font-family:var(--mono);touch-action:manipulation;user-select:none}
.msg-mini:active{transform:scale(.94)}
.msg-mini.slicer{color:#c9f6ff;border-color:rgba(0,242,255,.35)}
.import-input{display:none!important}

/* ═══════════════════════════════════════════════════════════
     4 · NEBULA READER (compacto)
     ═══════════════════════════════════════════════════════════ */
#readerApp{position:relative;width:100%;margin:0;padding:0;min-height:520px;display:flex;flex-direction:column;color:var(--nb-text);background:radial-gradient(circle at 50% 10%,rgba(0,242,255,.08),transparent 38%),radial-gradient(circle at 90% 90%,rgba(255,43,214,.05),transparent 35%),var(--nb-bg);border:1px solid var(--nb-border);border-radius:var(--nb-reader-radius);overflow:hidden;z-index:3}

#readerApp .icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--nb-border);border-radius:12px;background:rgba(255,255,255,.035);color:#dfe5e9;cursor:pointer;font-family:inherit;font-size:13px}

#sliceStage{position:absolute;inset:0}
#readerApp slice{position:absolute;inset:0;overflow:auto;padding:30px clamp(20px,6vw,60px) 110px;opacity:0;visibility:hidden;transform:translateY(20px) scale(.985);transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}

.slice-meta{display:flex;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
#readerApp slice label{display:inline-flex;padding:6px 10px;border:1px solid rgba(0,242,255,.30);border-radius:999px;color:var(--nb-cyan);background:rgba(0,242,255,.04);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.slice-arch-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;border:1px solid color-mix(in srgb,var(--slice-arch-color,var(--nb-cyan)) 55%,transparent);background:color-mix(in srgb,var(--slice-arch-color,var(--nb-cyan)) 14%,transparent);color:var(--slice-arch-color,var(--nb-cyan));font-family:var(--mono);font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}

#readerApp .empty-state{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center}

/* ═══════════════════════════════════════════════════════════
     5 · SYMBOLBAR
     ═══════════════════════════════════════════════════════════ */
#symbolBar{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:var(--z-system);display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 6px 10px;width:66px;background:var(--GLASS);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border:1px solid color-mix(in srgb,var(--kob-voice-primary) 30%,var(--CARD-BRD));border-radius:22px;box-shadow:0 4px 24px rgba(0,0,0,.45),0 0 32px color-mix(in srgb,var(--kob-voice-primary) 25%,transparent);user-select:none;touch-action:none;transition:opacity .5s ease,top .35s cubic-bezier(.175,.885,.32,1.275),left .35s cubic-bezier(.175,.885,.32,1.275),right .35s cubic-bezier(.175,.885,.32,1.275),bottom .35s cubic-bezier(.175,.885,.32,1.275)}
#symbolBar.is-dragging{opacity:.94;transition:none!important;will-change:top,left,right}
#symbolBar.snap-left{left:0!important;right:auto!important;border-radius:0 22px 22px 0;border-left:0}
#symbolBar.snap-right{right:0!important;left:auto!important;border-radius:22px 0 0 22px;border-right:0}
#symbolBar.snap-top{top:70px!important;bottom:auto!important;border-radius:0 0 22px 22px;border-top:0;transform:none!important}
#symbolBar.snap-bottom{top:auto!important;bottom:90px!important;border-radius:22px 22px 0 0;border-bottom:0;transform:none!important}
#symbolBar.collapsed{width:46px;padding:8px 4px;gap:6px}
#symbolBar.collapsed .sb-carousel,#symbolBar.collapsed .sb-dots,#symbolBar.collapsed .sb-info,#symbolBar.collapsed .sb-actions,#symbolBar.collapsed .sb-sep,#symbolBar.collapsed .sb-hud,#symbolBar.collapsed .sb-extras,#symbolBar.collapsed .sb-extras-head{display:none!important}
#symbolBar .sb-grip{display:grid;place-items:center;cursor:grab;width:34px;height:20px;color:color-mix(in srgb,var(--FG) 35%,transparent);border-radius:8px;flex-shrink:0;touch-action:none}
#symbolBar .sb-grip i{display:block;width:16px;height:2px;border-radius:2px;background:currentColor;box-shadow:0 5px 0 currentColor,0 -5px 0 currentColor}
.sb-toggle{width:32px;height:32px;border-radius:50%;background:color-mix(in srgb,var(--kob-voice-primary) 12%,transparent);border:1px solid color-mix(in srgb,var(--kob-voice-primary) 40%,transparent);color:var(--kob-voice-primary);font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
#sbOrb{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--kob-voice-primary);background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--FG) 8%,transparent),color-mix(in srgb,var(--BG) 65%,transparent));display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:visible;box-shadow:0 0 20px color-mix(in srgb,var(--kob-voice-primary) 40%,transparent);transition:all .5s ease;flex-shrink:0;font-size:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#sbOrb::before{content:"";position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--kob-voice-primary) 0%,transparent 55%),radial-gradient(circle at 70% 72%,var(--kob-voice-secondary) 0%,var(--kob-voice-primary) 100%);animation:orbSpin var(--orb-speed) linear infinite}
#sbOrb.speaking::before{animation:orbSpin 1.8s linear infinite}
.sb-info{width:100%;text-align:center;padding:2px 2px 0;flex-shrink:0}
.sb-title{font-family:var(--mono);font-size:9px;color:var(--kob-voice-primary);letter-spacing:.08em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-sub{font-family:var(--mono);font-size:7px;color:var(--DIM);letter-spacing:.06em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-actions{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%;flex-shrink:0}
.sb-act{width:100%;aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--CARD-BRD);border-radius:10px;background:color-mix(in srgb,var(--BG) 40%,transparent);color:color-mix(in srgb,var(--FG) 65%,transparent);font-size:12px;font-family:inherit;cursor:pointer}
.sb-act:hover{background:color-mix(in srgb,var(--kob-voice-primary) 15%,transparent);color:var(--kob-voice-primary)}
.sb-act.wide{grid-column:1/-1;aspect-ratio:auto;height:24px;font-size:11px}

.sb-sep{width:22px;height:1px;background:linear-gradient(90deg,transparent,var(--kob-voice-primary),transparent);opacity:.4;margin:1px 0;flex-shrink:0}
#symbolBar .sb-extras{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%;flex-shrink:0}

#symbolBar .sb-extras .sb-act.wide{grid-column:1/-1;aspect-ratio:auto;height:24px;font-size:10px}
#symbolBar.carousel-hidden .sb-carousel,#symbolBar.carousel-hidden .sb-dots{display:none!important}
#symbolBar.extras-hidden .sb-extras{display:none!important}
#symbolBar .sb-extras-head{width:100%;display:flex;align-items:center;justify-content:space-between;padding:2px 4px;margin-bottom:2px;font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--DIM);cursor:pointer;user-select:none}
#symbolBar .sb-extras-head:hover{color:var(--kob-voice-primary)}
#symbolBar .sb-extras-head .x-chev{font-size:9px}
#symbolBar.extras-hidden .sb-extras-head .x-chev{transform:rotate(-90deg)}
#symbolBar .sb-carousel{position:relative;width:100%;height:140px;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y proximity;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;mask-image:linear-gradient(to bottom,transparent 0%,black 18%,black 82%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,transparent 0%,black 18%,black 82%,transparent 100%)}

#symbolBar .sb-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--BG) 40%,transparent);border:1px solid var(--CARD-BRD);color:var(--btn-c,var(--kob-voice-primary));font-size:16px;cursor:pointer;flex-shrink:0;font-family:inherit}
#symbolBar .sb-btn:hover{background:color-mix(in srgb,var(--btn-c,var(--kob-voice-primary)) 15%,transparent);border-color:color-mix(in srgb,var(--btn-c,var(--kob-voice-primary)) 50%,transparent)}
#symbolBar .sb-btn.on{background:color-mix(in srgb,var(--btn-c,var(--kob-voice-primary)) 22%,transparent);outline:1px solid var(--btn-c,var(--kob-voice-primary))}

/* ═══════════════════════════════════════════════════════════
     8 · COCKPIT DRAWER (kxt-solar style · slide-in)
     ═══════════════════════════════════════════════════════════ */

.btn-block{flex:1;padding:9px 12px;border-radius:12px;border:1px solid var(--CARD-BRD);background:var(--CARD);color:var(--FG);cursor:pointer;font-family:inherit;font-size:10px;font-weight:800;letter-spacing:.06em}

<!-- ═══════════════ ENGINE DUAL OS ═══════════════ -->
<script>
(function(){
'use strict';
const ROOT = document.documentElement;
const THEME_KEY = 'dual-theme';
const stackWrap = document.getElementById('stackWrap');
const dock = document.getElementById('dock') || (()=>{
  const d = document.createElement('div'); d.id='dock'; document.body.appendChild(d); return d;
})();
const sessionStore = new Map();
const tabDataMap = new WeakMap();
const timers = new Map();
let counter = 1;
let activeWindow = null;

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const getWin = id => document.getElementById(id);
const isMax = w => !!w?.classList.contains('maximized');

/* state badge helper */
function tagState(win, state){
  if (!win) return;
  win.dataset.state = state;
  const b = win.querySelector('.state-badge');
  if (b){
    const colors = {active:'#39ffb6',loading:'#00e5ff',idle:'#ffd700',
      suspended:'#ff6b6b',created:'#aaa',closed:'#555'};
    b.style.color = colors[state] || '#aaa';
    b.textContent = '● ' + state;
  }
}

/* z-stack */
const zStack = [];
function bringToFront(win){
  if (!win) return;
  const i = zStack.indexOf(win);
  if (i !== -1) zStack.splice(i,1);
  zStack.push(win);
  zStack.forEach((w,idx)=>{ if(!w.classList.contains('maximized')) w.style.zIndex = String(1000+idx*10); });
  setActiveWindow(win);
}
function setActiveWindow(win){ activeWindow = win; syncHeader(); }
function syncHeader(){
  const inp = document.getElementById('urlInputNav');
  if (!inp) return;
  if (!activeWindow) return inp.value='';
  const d = tabDataMap.get(activeWindow);
  const t = d?.tabs.find(x=>x.id===d.activeId);
  inp.value = t?.url || '';
}

/* tab data */
function getTabData(win){
  if (!tabDataMap.has(win)){
    const src = win.querySelector('.win-frame')?.src || 'https://www.infodose.com.br/splash';
    const tab = { id:'tab-'+Date.now(), url:src,
      title:src.replace(/^https?:\/\//,'').split('/')[0]||'Nova Aba',
      fav:false, icon:'◉', createdAt:Date.now() };
    tabDataMap.set(win,{tabs:[tab],activeId:tab.id});
  }
  return tabDataMap.get(win);
}
function getActiveTab(win){
  const d = tabDataMap.get(win);
  return d?.tabs.find(t=>t.id===d.activeId) || d?.tabs[0] || null;
}
function addTab(win, url='https://www.infodose.com.br/splash'){
  const d = tabDataMap.get(win); if(!d) return;
  const tab = { id:'tab-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),
    url, title:url.replace(/^https?:\/\//,'').split('/')[0]||'Nova Aba',
    fav:false, icon:'◉', createdAt:Date.now() };
  d.tabs.push(tab); d.activeId = tab.id;
  renderTabCounter(win);
  const f = win.querySelector('.win-frame'); if (f) f.src = url;
  closeTabSwitcher();
}
function removeTab(win, tabId){
  const d = tabDataMap.get(win); if(!d || d.tabs.length<=1) return;
  const i = d.tabs.findIndex(t=>t.id===tabId); if(i<0) return;
  d.tabs.splice(i,1);
  if (d.activeId===tabId) d.activeId = d.tabs[Math.min(i,d.tabs.length-1)].id;
  renderTabCounter(win);
  const f = win.querySelector('.win-frame'); const a = getActiveTab(win);
  if (f && a) f.src = a.url;
  if (document.getElementById('tabSwitcherOverlay').classList.contains('open'))
    renderTabSwitcher(win);
}
function setActiveTab(win, tabId){
  const d = tabDataMap.get(win); if(!d) return;
  if (!d.tabs.some(t=>t.id===tabId)) return;
  d.activeId = tabId; renderTabCounter(win);
  const f = win.querySelector('.win-frame'); const a = getActiveTab(win);
  if (f && a) f.src = a.url;
  bringToFront(win);
}
function renderTabCounter(win){
  const d = tabDataMap.get(win); if(!d) return;
  const b = win.querySelector('.tab-counter');
  if (b) b.textContent = d.tabs.length;
}

/* tab switcher */
let switcherWin = null;
function openTabSwitcher(win){
  switcherWin = win;
  renderTabSwitcher(win);
  document.getElementById('tabSwitcherOverlay').classList.add('open');
}
function closeTabSwitcher(){
  document.getElementById('tabSwitcherOverlay').classList.remove('open');
  if (switcherWin) bringToFront(switcherWin);
  switcherWin = null;
}
function renderTabSwitcher(win){
  const grid = document.getElementById('tabGrid');
  const d = tabDataMap.get(win);
  if (!d) return grid.innerHTML='';
  grid.innerHTML='';
  d.tabs.forEach(tab=>{
    const c = document.createElement('div');
    c.className = 'tab-card' + (tab.id===d.activeId ? ' active' : '');
    c.innerHTML = `
      <div class="tab-title">${tab.title}</div>
      <div class="tab-url">${tab.url}</div>
      <div class="tab-state"><span class="tab-state-dot"></span> ATIVA</div>
      <button class="tab-close" title="Fechar">×</button>
      <button class="tab-fav ${tab.fav?'active':''}" title="Fav">${tab.fav?'★':'☆'}</button>`;
    c.addEventListener('click', e=>{
      if (e.target.closest('.tab-close') || e.target.closest('.tab-fav')) return;
      setActiveTab(win, tab.id); closeTabSwitcher();
    });
    c.querySelector('.tab-close').addEventListener('click', e=>{
      e.stopPropagation(); removeTab(win, tab.id);
    });
    c.querySelector('.tab-fav').addEventListener('click', e=>{
      e.stopPropagation(); tab.fav = !tab.fav; renderTabSwitcher(win);
    });
    grid.appendChild(c);
  });
}

/* WINDOW ACTIONS */
function toggleCollapse(id){
  const w = getWin(id); if(!w) return;
  if (isMax(w)){ w.classList.remove('maximized'); w.style.zIndex=''; }
  w.classList.toggle('collapsed');
  bringToFront(w);
}
function togglePeek(id){
  const w = getWin(id); if(!w) return;
  w.classList.toggle('peeked');
  bringToFront(w);
}
function maximizeWindow(id){
  const w = getWin(id); if(!w) return;
  if (isMax(w)){ w.classList.remove('maximized'); w.style.zIndex=''; }
  else { w.classList.add('maximized'); w.style.zIndex='94000'; }
  bringToFront(w);
}
function minimizeWindow(id){
  const w = getWin(id); if(!w) return;
  w.classList.remove('maximized');
  w.classList.add('minimized');
  document.getElementById('dock-'+id)?.remove();
  const b = document.createElement('button');
  b.type='button'; b.className='dock-bubble'; b.id='dock-'+id; b.textContent='۞';
  b.addEventListener('click', ()=>{
    w.classList.remove('minimized');
    bringToFront(w);
    b.remove();
  });
  dock.appendChild(b);
}
function closeWindow(id){
  const w = getWin(id); if(!w) return;
  document.getElementById('dock-'+id)?.remove();
  w.remove();
  sessionStore.delete(id);
  if (activeWindow === w) setActiveWindow(null);
}

/* create session window (from DUAL) */
function createSessionWindow({src='https://www.infodose.com.br/splash'}={}){
  const id = 'session-'+Date.now()+'-'+counter++;
  const w = document.createElement('section');
  w.className = 'session-window peeked';
  w.id = id;
  w.innerHTML = `
    <div class="win-hdr">
      <div class="win-controls">
        <button type="button" data-action="collapse" data-dual-target data-dual-action="win:collapse">−</button>
        <button type="button" data-action="tab-switcher" class="tab-counter" data-dual-target data-dual-action="win:tabs">1</button>
        <button type="button" data-action="maximize" data-dual-target data-dual-action="win:maximize">⛶</button>
        <button type="button" data-action="minimize" data-dual-target data-dual-action="win:minimize">۞</button>
        <button type="button" data-action="close" data-dual-target data-dual-action="win:close">×</button>
      </div>
      <div class="win-navrow" style="flex:2;min-width:0;pointer-events:auto">
        <input class="win-urlbar" type="text" value="${src}" placeholder="URL...">
        <button class="win-go-btn" type="button" data-dual-target data-dual-action="nav:go">Go</button>
      </div>
    </div>
    <iframe class="win-frame" data-runtime="nav" src="${src}"></iframe>`;
  stackWrap.appendChild(w);
  wireSession(w);
  bringToFront(w);
  tagState(w, 'loading');
  setTimeout(()=>tagState(w, 'active'), 500);
  return id;
}

/* wire controls */
function wireSession(w){
  if (!w || w.dataset.wired==='1') return;
  w.dataset.wired='1';

  // badge
  const hdr = w.querySelector('.win-hdr');
  if (hdr && !hdr.querySelector('.state-badge')){
    const b = document.createElement('span');
    b.className='state-badge'; b.textContent='●';
    hdr.appendChild(b);
  }
  tagState(w, 'active');

  w.addEventListener('pointerdown', ()=>bringToFront(w), {passive:true});
  w.addEventListener('focusin', ()=>bringToFront(w), {passive:true});

  const controls = w.querySelector('.win-controls');
  controls?.addEventListener('click', e=>{
    e.preventDefault(); e.stopPropagation();
    const btn = e.target.closest('button'); if(!btn) return;
    const a = btn.dataset.action;
    if (a==='collapse') toggleCollapse(w.id);
    else if (a==='maximize') maximizeWindow(w.id);
    else if (a==='minimize') minimizeWindow(w.id);
    else if (a==='close') closeWindow(w.id);
    else if (a==='tab-switcher') openTabSwitcher(w);
  });

  const inp = w.querySelector('.win-urlbar');
  const go = w.querySelector('.win-go-btn');
  go?.addEventListener('click', e=>{
    e.preventDefault(); e.stopPropagation();
    let url = inp.value.trim(); if(!url) return;
    if (!/^https?:\/\//i.test(url)) url = 'https://'+url;
    const f = w.querySelector('.win-frame'); if (f) f.src = url;
    const a = getActiveTab(w); if (a){ a.url = url; a.title = url.replace(/^https?:\/\//,'').split('/')[0]; }
    inp.value = url;
  });
  inp?.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.stopPropagation(); go?.click(); } });

  getTabData(w);
  renderTabCounter(w);
}

/* header scroll behavior */
const HEADER = document.getElementById('main-header');
let lastY = 0, ticking = false;
function updateHeader(){
  if (!HEADER) return;
  const y = window.scrollY;
  if (y<=10){ HEADER.classList.remove('header-hidden'); HEADER.classList.add('header-visible'); }
  else if (y > lastY + 8){ HEADER.classList.remove('header-visible'); HEADER.classList.add('header-hidden'); }
  else if (y < lastY - 8){ HEADER.classList.remove('header-hidden'); HEADER.classList.add('header-visible'); }
  lastY = y; ticking = false;
}
window.addEventListener('scroll', ()=>{ if(!ticking){ requestAnimationFrame(updateHeader); ticking=true; } }, {passive:true});

/* theme */
function applyTheme(t){
  const next = (t==='light') ? 'light' : 'dark';
  ROOT.dataset.theme = next;
  try { localStorage.setItem(THEME_KEY, next); } catch(_){}
  $$('.theme-dot').forEach(b=>{
    if (b.textContent.includes('☀') || b.textContent.includes('🌙'))
      b.textContent = next==='light' ? '☀' : '🌙';
  });
  window.dispatchEvent(new CustomEvent('dual:theme-change',{detail:{theme:next}}));
}
function getInitialTheme(){
  try { const s = localStorage.getItem(THEME_KEY); if(s) return s; } catch(_){}
  return 'dark';
}
window.DualTheme = {
  set: applyTheme,
  toggle(){ applyTheme(ROOT.dataset.theme==='light'?'dark':'light'); },
  get(){ return ROOT.dataset.theme || 'dark'; }
};
$$('.theme-dot').forEach(b=>b.addEventListener('click', e=>{
  e.preventDefault(); e.stopPropagation(); DualTheme.toggle();
}));
applyTheme(getInitialTheme());

/* global url */
const navInp = document.getElementById('urlInputNav');
const goNav = document.getElementById('goNavBtn');
function applyGlobalUrl(){
  if (!activeWindow) { createSessionWindow(); return; }
  let url = navInp.value.trim(); if(!url) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://'+url;
  const f = activeWindow.querySelector('.win-frame'); if (f) f.src = url;
  const a = getActiveTab(activeWindow); if (a){ a.url = url; a.title = url.replace(/^https?:\/\//,'').split('/')[0]; }
  navInp.value = url;
}
navInp?.addEventListener('keydown', e=>{ if(e.key==='Enter') applyGlobalUrl(); });
goNav?.addEventListener('click', applyGlobalUrl);

document.getElementById('newTabBtn')?.addEventListener('click', ()=>{
  if (switcherWin) addTab(switcherWin);
});
document.getElementById('closeTabSwitcher')?.addEventListener('click', closeTabSwitcher);

/* drawer */
window.toggleDrawer = function(id){
  const dr = document.getElementById(id || 'drawerProfile');
  const ov = document.getElementById('drawerOverlay');
  if (!dr) return;
  const open = dr.classList.toggle('open');
  ov.classList.toggle('open', open);
  dr.setAttribute('aria-hidden', open ? 'false' : 'true');
};
document.getElementById('orbToggle')?.addEventListener('click', ()=>toggleDrawer('drawerProfile'));
document.getElementById('menuBtn')?.addEventListener('click', ()=>toggleDrawer('drawerProfile'));

/* boot existing session */
$$('.session-window').forEach(w=>{
  wireSession(w);
  if (!activeWindow) setActiveWindow(w);
});
syncHeader();

/* expose */
window.createSessionWindow = createSessionWindow;
window.toggleCollapse = toggleCollapse;
window.maximizeWindow = maximizeWindow;
window.minimizeWindow = minimizeWindow;
window.closeWindow = closeWindow;
window.Dual = {
  get activeWindow(){ return activeWindow; },
  getWin, isMax, bringToFront,
  createSessionWindow, toggleCollapse, maximizeWindow, minimizeWindow, closeWindow,
  toggleDrawer, openTabSwitcher, closeTabSwitcher,
};
console.log('[DUAL] OS online');
})();
</script>

<!-- ═══════════════ MXP ENGINE + BRIDGE ═══════════════ -->
<script>
(function(){
'use strict';

const STORE = "mxp_alfabeta_v2";
const HOLD_MS = 400;
const MOVE_THRESHOLD = 14;
const DRAG_THRESHOLD = 20;

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = (p="x")=>p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ─── CATALOG ─── */
const CATALOG = [
  { category:"DUAL · SYSTEM", items:[
    ["dual:theme-toggle", "☼", "TEMA"],
    ["dual:drawer",       "🔅", "COCKPIT"],
    ["dual:theme-dot",    "🌙", "DIA/NOITE"],
    ["state:reset",       "⌦", "RESET"],
  ]},
  { category:"DUAL · WINDOW", items:[
    ["dual:new-session", "＋", "NOVA"],
    ["dual:win-max",     "⛶", "MAX"],
    ["dual:win-min",     "۞", "MIN"],
    ["dual:win-collapse","−", "COLLAPSE"],
    ["dual:win-close",   "×", "FECHAR"],
    ["dual:win-tabs",    "⊞", "ABAS"],
  ]},
  { category:"DUAL · NAV", items:[
    ["dual:nav-go",    "➤", "GO"],
    ["dual:focus-url", "⌨", "URL"],
  ]},
  { category:"MXP", items:[
    ["factory:open",   "◈", "FACTORY"],
    ["aside:toggle",   "☰", "TOGGLE"],
    ["session:new",    "◉", "SESSION"],
    ["orb:theme",      "◐", "THEME"],
    ["slot:clear",     "⌫", "CLEAR"],
  ]},
  { category:"MEDIA", items:[
    ["media:play",  "▶", "PLAY"],
    ["media:pause", "Ⅱ", "PAUSE"],
    ["media:stop",  "■", "STOP"],
  ]},
];

/* ─── STATE ─── */
function defaultState(){
  return { version:2, slots:{ header:[], aside:[], footer:[], loose:[] }, sessions:[] };
}
function load(){
  try { const r = localStorage.getItem(STORE); if(!r) return defaultState();
    return Object.assign(defaultState(), JSON.parse(r)); }
  catch(_){ return defaultState(); }
}
let state = load();
const save = ()=>{ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(_){} };

/* ─── DUAL BRIDGE ─── */
function activeDualWin(){
  const D = window.Dual;
  return D?.activeWindow || document.querySelector('.session-window:not(.minimized)') || null;
}
const BRIDGE = {
  "dual:theme-toggle": ()=>window.DualTheme?.toggle(),
  "dual:theme-dot":    ()=>window.DualTheme?.toggle(),
  "dual:drawer":       ()=>window.toggleDrawer?.("drawerProfile"),
  "dual:new-session":  ()=>window.createSessionWindow?.(),
  "dual:win-max":      ()=>{ const w = activeDualWin(); if (w) window.maximizeWindow?.(w.id); },
  "dual:win-min":      ()=>{ const w = activeDualWin(); if (w) window.minimizeWindow?.(w.id); },
  "dual:win-collapse": ()=>{ const w = activeDualWin(); if (w) window.toggleCollapse?.(w.id); },
  "dual:win-close":    ()=>{ const w = activeDualWin(); if (w) window.closeWindow?.(w.id); },
  "dual:win-tabs":     ()=>{ const w = activeDualWin(); if (w) window.Dual?.openTabSwitcher?.(w); },
  "dual:nav-go":       ()=>{
    const url = document.getElementById('urlInputNav')?.value?.trim();
    if (!url) return;
    document.getElementById('goNavBtn')?.click();
  },
  "dual:focus-url":    ()=>{ document.getElementById('urlInputNav')?.focus(); },
  "nav:next":          ()=>window.createSessionWindow?.(),
  "media:play":        ()=>{ if (window.Nebula?.toggleSpeech) window.Nebula.toggleSpeech();
                              else window.speechSynthesis?.resume?.(); },
  "media:pause":       ()=>window.speechSynthesis?.pause(),
  "media:stop":        ()=>window.speechSynthesis?.cancel(),
  "orb:theme":         ()=>window.DualTheme?.toggle(),
  "aside:toggle":      ()=>{ document.getElementById('symbolBar')?.classList.toggle('is-collapsed'); },
  "factory:open":      ()=>document.getElementById('mxd-factory')?.classList.add('is-open'),
  "factory:close":     ()=>document.getElementById('mxd-factory')?.classList.remove('is-open'),
  "session:new":       ()=>createSession(),
  "state:reset":       ()=>{
    if (!confirm("Resetar MXP?")) return;
    state = defaultState(); save(); renderAll(); toast("estado resetado");
  },
  "slot:clear":        (ctx)=>{ const s = ctx?.slot||"loose";
    if (state.slots[s]){ state.slots[s]=[]; save(); renderSlot(s); toast(`"${s}" limpo`); } },
};

function fire(action, ctx={}){
  if (!action) return;
  if (BRIDGE[action]) return BRIDGE[action](ctx);
  window.dispatchEvent(new CustomEvent("MXP_ACTION",{detail:{action,ctx}}));
}

/* ─── UI HELPERS ─── */
let toastTimer=null;
function toast(msg){
  const el = $("#mxd-toast"); if(!el) return;
  el.textContent = msg; el.classList.add("is-live");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("is-live"),1600);
}
function hud(msg){
  const el = $("#mxd-hud"); if(!el) return;
  if (msg){ el.textContent = msg; el.classList.add("is-live"); }
  else el.classList.remove("is-live");
}

/* ─── BUTTON FACTORY ─── */
function makeButton(item, slot){
  const b = document.createElement("button");
  b.type = "button";
  b.className = "mxp-btn";
  if (slot === "__factory__") b.classList.add("slot-factory");
  else if (slot.startsWith("session:")) b.classList.add("slot-session");
  else b.classList.add("slot-"+slot);

  b.dataset.id = item.id || uid("btn");
  b.dataset.action = item.action || "";
  b.dataset.label = item.label || "";
  b.dataset.icon = item.icon || "";
  b.dataset.slot = slot;
  if (item.binding) b.dataset.binding = item.binding;

  b.title = `${item.label} · ${item.action}`;
  b.innerHTML = `<span class="mxp-icon" data-part="icon">${item.icon||"•"}</span>
                 <span class="mxp-label" data-part="label">${item.label||""}</span>`;
  if (item.binding) b.classList.add("is-bound");
  return b;
}
function itemFromButton(btn){
  return { id:btn.dataset.id, action:btn.dataset.action, label:btn.dataset.label,
           icon:btn.dataset.icon, binding:btn.dataset.binding||"" };
}

/* ─── RENDER ─── */
function renderSlot(slot){
  const el = document.querySelector(`[data-slot="${slot}"]`); if(!el) return;
  el.innerHTML = "";
  (state.slots[slot]||[]).forEach(it=>el.appendChild(makeButton(it, slot)));
}
function renderFactory(){
  const root = $("#mxd-catalog"); if(!root) return;
  root.innerHTML = "";
  CATALOG.forEach(cat=>{
    const wrap = document.createElement("section");
    wrap.className = "mxd-cat";
    wrap.innerHTML = `<div class="mxd-cat-name">${cat.category}</div>`;
    const grid = document.createElement("div"); grid.className = "mxd-cat-grid";
    cat.items.forEach(([action,icon,label])=>{
      grid.appendChild(makeButton({id:uid("factory"),action,icon,label}, "__factory__"));
    });
    wrap.appendChild(grid); root.appendChild(wrap);
  });
}
function renderSessions(){
  const root = $("#mxd-sessions") || document.createElement("section");
  root.id = "mxd-sessions"; if (!root.parentNode) document.querySelector(".shell main")?.appendChild(root);
  root.innerHTML = "";
  state.sessions.forEach(s=>{
    const node = $("#tpl-session").content.cloneNode(true);
    const win = $(".mxd-window, .session-window[data-type='session']", node);
    win.dataset.sessionId = s.id;
    $("[data-part='title']", win).textContent = s.name;
    const slot = $("[data-part='slot']", win);
    slot.dataset.slot = "session:"+s.id;
    slot.dataset.sessionId = s.id;
    root.appendChild(node);
    state.slots["session:"+s.id] ??= [];
    renderSlot("session:"+s.id);
    attachSessionInteractions(win, s);
  });
}
function renderAll(){
  renderFactory(); renderSlot("header"); renderSlot("aside");
  renderSlot("footer"); renderSlot("loose"); renderSessions();
}

/* ─── MUTATIONS ─── */
function addToSlot(item, slot){
  state.slots[slot] ??= [];
  const copy = { ...item, id:item.id||uid("btn") };
  state.slots[slot].push(copy); save(); renderSlot(slot);
  toast(`+ ${copy.label||copy.action} → ${slot}`);
}
function removeItem(id, slot){
  if (!state.slots[slot]) return;
  state.slots[slot] = state.slots[slot].filter(x=>x.id!==id);
  save(); renderSlot(slot); toast("removido");
}
function moveItem(id, from, to){
  if (from === to) return;
  const list = state.slots[from]||[]; const i = list.findIndex(x=>x.id===id);
  if (i<0) return;
  const item = list.splice(i,1)[0];
  state.slots[to] ??= []; state.slots[to].push(item);
  save(); renderSlot(from); renderSlot(to); toast(`movido → ${to}`);
}

/* ─── SESSIONS (MXP) ─── */
function createSession(name="SESSION"){
  const s = { id:uid("session"), name };
  state.sessions.push(s); state.slots["session:"+s.id]=[];
  save(); renderSessions(); toast(`session "${name}" criada`);
  return s;
}
function attachSessionInteractions(win, session){
  const title = $("[data-part='title']", win);
  title?.addEventListener("click", ()=>{
    const novo = prompt("Nome:", session.name);
    if (novo && novo.trim()){ session.name = novo.trim(); title.textContent = novo.trim(); save(); toast("renomeada"); }
  });
}

/* ─── CLICK DISPATCH ─── */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-action]");
  if (!el) return;
  if (el.hasAttribute("data-win-action")) return;
  if (el.dataset.gestureConsumed === "1"){ delete el.dataset.gestureConsumed; return; }
  fire(el.dataset.action, { element:el, slot:el.dataset.slot });
});

/* ─── WIN ACTIONS (MXP templates) ─── */
document.addEventListener("click", e=>{
  const btn = e.target.closest("[data-win-action]"); if(!btn) return;
  const win = btn.closest("[data-type='session']"); if(!win) return;
  const id = win.dataset.sessionId; const a = btn.dataset.action;
  if (a==="win:minimize") win.classList.toggle("is-min");
  if (a==="win:maximize") win.classList.toggle("is-max");
  if (a==="win:close"){
    if (!confirm("Fechar session?")) return;
    state.sessions = state.sessions.filter(s=>s.id!==id);
    delete state.slots["session:"+id]; save(); renderSessions();
  }
  if (a==="win:run"){
    const items = state.slots["session:"+id]||[];
    if (!items.length) return toast("session vazia");
    items.forEach((it,i)=>setTimeout(()=>fire(it.action,{slot:"session:"+id}), i*180));
    toast(`executando ${items.length} ações`);
  }
});

/* ─── UNIVERSAL DRAG ENGINE ─── */
let gesture = null;

document.addEventListener("pointerdown", e=>{
  const btn = e.target.closest(".mxp-btn"); if(!btn) return;
  if (btn.closest("[data-win-action]")) return;
  if (e.pointerType==="mouse" && e.button!==0) return;
  e.preventDefault();

  gesture = {
    btn, pointerId:e.pointerId, startX:e.clientX, startY:e.clientY,
    x:e.clientX, y:e.clientY, slot:btn.dataset.slot,
    item:itemFromButton(btn), dragging:false, timer:null, ghost:null,
    dualHover:null,
  };
  btn.classList.add("is-holding");
  gesture.timer = setTimeout(startFakeDrag, HOLD_MS);
}, { passive:false });

document.addEventListener("pointermove", e=>{
  if (!gesture || gesture.pointerId!==e.pointerId) return;
  gesture.x = e.clientX; gesture.y = e.clientY;
  const dx = e.clientX-gesture.startX, dy = e.clientY-gesture.startY;
  if (!gesture.dragging && Math.hypot(dx,dy) > MOVE_THRESHOLD){ cancelGesture(); return; }
  if (!gesture.dragging) return;
  e.preventDefault();
  moveGhost(e.clientX, e.clientY);
  updateDropTargets(e.clientX, e.clientY);
  updateDualTargets(e.clientX, e.clientY);
}, { passive:false });

document.addEventListener("pointerup", e=>{
  if (!gesture || gesture.pointerId!==e.pointerId) return;
  if (gesture.dragging){
    const dx = Math.abs(e.clientX-gesture.startX), dy = Math.abs(e.clientY-gesture.startY);
    const moved = Math.hypot(dx,dy) > DRAG_THRESHOLD;
    if (moved) finishFakeDrag(e.clientX, e.clientY);
    else {
      const { btn, slot } = gesture;
      cleanupDrag(); gesture = null;
      openContext(btn, slot); return;
    }
  } else {
    clearTimeout(gesture.timer);
    gesture.btn.classList.remove("is-holding");
    gesture = null;
  }
}, { passive:false });

document.addEventListener("pointercancel", cancelGesture);

function startFakeDrag(){
  if (!gesture) return;
  gesture.dragging = true;
  gesture.btn.classList.remove("is-holding");
  gesture.btn.classList.add("is-source");
  document.body.classList.add("mxp-dragging");
  const trash = $("#mxd-trash"); if (trash) trash.classList.add("is-active");
  hud("segure · solte em um slot OU sobre um controle DUAL");
  const ghost = document.createElement("div");
  ghost.id = "mxd-ghost";
  ghost.textContent = gesture.item.icon || "•";
  document.body.appendChild(ghost);
  gesture.ghost = ghost;
  requestAnimationFrame(()=>ghost.classList.add("is-live"));
  moveGhost(gesture.x, gesture.y);
}
function moveGhost(x,y){
  if (!gesture?.ghost) return;
  gesture.ghost.style.left = x+"px"; gesture.ghost.style.top = y+"px";
}
function getDropTarget(x,y){
  if (gesture?.ghost) gesture.ghost.style.display = "none";
  const el = document.elementFromPoint(x,y);
  if (gesture?.ghost) gesture.ghost.style.display = "grid";
  return el?.closest("[data-drop-target]");
}
function getDualTarget(x,y){
  if (gesture?.ghost) gesture.ghost.style.display = "none";
  const el = document.elementFromPoint(x,y);
  if (gesture?.ghost) gesture.ghost.style.display = "grid";
  return el?.closest("[data-dual-target]");
}
function updateDropTargets(x,y){
  $$("[data-drop-target]").forEach(el=>el.classList.remove("is-drop-ready"));
  const trash = $("#mxd-trash"); if (trash) trash.classList.remove("is-over");
  const t = getDropTarget(x,y); if (!t) return;
  if (t.dataset.trash !== undefined){
    trash.classList.add("is-over");
    hud(`soltar para remover · ${gesture.item.label||gesture.item.action}`);
    return;
  }
  t.classList.add("is-drop-ready");
  hud(`soltar em · ${t.dataset.slot || "slot"}`);
}
function updateDualTargets(x,y){
  $$("[data-dual-target].is-dual-hover").forEach(el=>el.classList.remove("is-dual-hover"));
  gesture.dualHover = null;
  const d = getDualTarget(x,y);
  if (d){
    d.classList.add("is-dual-hover");
    gesture.dualHover = d;
    hud(`⛓ vincular a · ${d.dataset.dualAction || 'DUAL'}`);
  }
}
function finishFakeDrag(x,y){
  clearTimeout(gesture.timer);
  const dualTarget = getDualTarget(x,y);
  const target = getDropTarget(x,y);

  // 1. DUAL binding has priority
  if (dualTarget && gesture.slot !== "__factory__"){
    const dualAction = dualTarget.dataset.dualAction;
    // Persist binding on the item
    const list = state.slots[gesture.slot]||[];
    const idx = list.findIndex(i=>i.id===gesture.item.id);
    if (idx >= 0){
      list[idx].binding = dualAction;
      list[idx].action = "dual:"+dualAction; // remap action
      save();
      renderSlot(gesture.slot);
      toast(`⛓ vinculado a ${dualAction}`);
    }
    cleanupDrag(); gesture=null; return;
  }

  // 2. trash
  if (target && target.dataset.trash !== undefined){
    if (gesture.slot !== "__factory__") removeItem(gesture.item.id, gesture.slot);
    cleanupDrag(); gesture=null; return;
  }

  // 3. slot drop
  if (target){
    const to = target.dataset.slot;
    if (gesture.slot === "__factory__") addToSlot({...gesture.item, id:uid("btn")}, to);
    else moveItem(gesture.item.id, gesture.slot, to);
    cleanupDrag(); gesture=null; return;
  }

  cleanupDrag(); gesture=null;
}
function cleanupDrag(){
  if (!gesture) return;
  gesture.btn.classList.remove("is-source");
  gesture.ghost?.remove(); gesture.ghost=null;
  const trash = $("#mxd-trash"); if (trash) trash.classList.remove("is-active","is-over");
  $$("[data-drop-target]").forEach(el=>el.classList.remove("is-drop-ready"));
  $$("[data-dual-target].is-dual-hover").forEach(el=>el.classList.remove("is-dual-hover"));
  document.body.classList.remove("mxp-dragging");
  hud("");
}
function cancelGesture(){
  if (!gesture) return;
  clearTimeout(gesture.timer);
  gesture.btn.classList.remove("is-holding","is-source");
  gesture.ghost?.remove();
  const trash = $("#mxd-trash"); if (trash) trash.classList.remove("is-active","is-over");
  $$("[data-drop-target]").forEach(el=>el.classList.remove("is-drop-ready"));
  $$("[data-dual-target].is-dual-hover").forEach(el=>el.classList.remove("is-dual-hover"));
  document.body.classList.remove("mxp-dragging");
  hud(""); gesture=null;
}

/* ─── CONTEXT MENU ─── */
let contextItem = null;
function openContext(btn, slot){
  if (slot === "__factory__") return;
  contextItem = { btn, item:itemFromButton(btn), slot };
  const menu = $("#mxd-context");
  const head = $("#mxd-ctx-head");
  if (head) head.textContent = contextItem.item.label || contextItem.item.action;
  const r = btn.getBoundingClientRect();
  menu.style.left = Math.min(window.innerWidth-200, Math.max(10,r.left))+"px";
  menu.style.top  = Math.min(window.innerHeight-240, r.bottom+8)+"px";
  menu.classList.add("is-open");
}
function closeContext(){
  $("#mxd-context").classList.remove("is-open");
  contextItem = null;
}
$("#mxd-context").addEventListener("click", e=>{
  const a = e.target.closest("[data-context-action]")?.dataset.contextAction;
  if (!a || !contextItem) return;
  const { item, slot } = contextItem;
  if (a==="fire") fire(item.action, { item, slot });
  if (a==="duplicate") addToSlot({...item, id:uid("copy"), binding:""}, slot);
  if (a==="unbind"){
    const list = state.slots[slot]||[]; const i = list.findIndex(x=>x.id===item.id);
    if (i>=0){ list[i].binding = ""; save(); renderSlot(slot); toast("desvinculado"); }
  }
  if (a==="favorite"){
    const s = createSession("fav:"+(item.label||item.action));
    addToSlot({...item, id:uid("fav")}, "session:"+s.id);
  }
  if (a==="remove") removeItem(item.id, slot);
  closeContext();
});
document.addEventListener("pointerdown", e=>{
  if ($("#mxd-context").classList.contains("is-open") &&
      !e.target.closest("#mxd-context")) closeContext();
});

/* ─── FACTORY backdrop ─── */
$("#mxd-factory").addEventListener("click", e=>{
  if (e.target.id === "mxd-factory") $("#mxd-factory").classList.remove("is-open");
});

/* ─── KEYBOARD ─── */
document.addEventListener("keydown", e=>{
  if ((e.ctrlKey||e.metaKey) && e.shiftKey && e.key.toLowerCase()==="b"){
    e.preventDefault();
    $("#mxd-factory").classList.toggle("is-open");
  }
  if (e.key === "Escape"){
    $("#mxd-factory").classList.remove("is-open");
    closeContext();
  }
});

/* ─── SEED ─── */
function seed(){
  const empty = !state.slots.header?.length && !state.slots.aside?.length &&
    !state.slots.footer?.length && !state.slots.loose?.length && !state.sessions.length;
  if (!empty) return;
  state.slots.header = [
    { id:uid("s"), action:"dual:theme-toggle", icon:"☼", label:"TEMA" },
  ];
  state.slots.aside = [
    { id:uid("s"), action:"factory:open",     icon:"◈", label:"FACTORY" },
    { id:uid("s"), action:"dual:new-session", icon:"＋", label:"NOVA" },
    { id:uid("s"), action:"aside:toggle",     icon:"☰", label:"TOGGLE" },
  ];
  state.slots.footer = [
    { id:uid("s"), action:"dual:win-max", icon:"⛶", label:"MAX" },
    { id:uid("s"), action:"dual:drawer",  icon:"🔅", label:"COCKPIT" },
  ];
  state.slots.loose = [
    { id:uid("s"), action:"dual:win-tabs", icon:"⊞", label:"ABAS" },
    { id:uid("s"), action:"dual:nav-go",   icon:"➤", label:"GO" },
  ];
  save();
}

/* ─── BOOT ─── */
seed();
renderAll();

/* ─── PUBLIC API ─── */
window.MXP = {
  get state(){ return state; },
  BRIDGE, CATALOG, fire,
  createSession, addToSlot, removeItem, moveItem,
  toast, render: renderAll,
  reset(){ state = defaultState(); save(); renderAll(); },
  on(action, cb){
    window.addEventListener("MXP_ACTION", e=>{
      if (e.detail?.action === action) cb(e.detail.ctx);
    });
  },
};
console.log('[MXP] Universal online · bridge ready');
})();
</script>
