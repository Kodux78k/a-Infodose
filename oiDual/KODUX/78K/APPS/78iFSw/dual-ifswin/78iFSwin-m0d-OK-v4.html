<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
<!-- PWA METADATA & VIEWPORT FIX -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f0f11">

<!-- iOS Support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icon-192.png">

<link rel="stylesheet" href="https://infodose.com.br/oiDual/KODUX/78K/APPS/78iFSw/dual-ifswin/css/main.css">

<!-- Manifest -->
<link rel="manifest" href="./manifest.json">

  <link rel="stylesheet" href="https://kodux78k.github.io/oiDual--Y-/css/kob-glass-0.css">
  <link rel="stylesheet" href="https://kodux78k.github.io/oiDual--Y-/css/kob-e.css">
  <link rel="stylesheet" href="https://kodux78k.github.io/oiDual--Y-/css/kxt-solar.css"> 
  <link rel="stylesheet" href="https://kodux78k.github.io/oiDual--Y-/css/kob-nanai.css"> 
</head>

<body class="ui-safe-vertical" data-theme="dark" data-arch="" data-user="" data-zpr="9" data-intensity="0.72">

<!-- <script src="https://kodux78k.github.io/oiDual--Y-/M0D/LS/js/insert-LS-3.js"></script> -->


<!-- =========================================================
       BIBLIOTECA DE ÍCONES SVG INLINE
       ========================================================= -->
  <svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">
    <defs>
      <!-- Ícone da marca (substitui ⏣) -->
      <symbol id="icon-brand" viewBox="0 0 24 24">
        <path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.3L19.5 8 12 11.7 4.5 8 12 4.3zM4 9.7l7 3.5v7.1L4 16.8V9.7zm9 10.6v-7.1l7-3.5v7.1l-7 3.5z"/>
      </symbol>
      <!-- Ícone de globo/navegador (substitui 🌐) -->
      <symbol id="icon-globe" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M2 12h20M12 2a15 15 0 010 20M12 2a15 15 0 000 20" fill="none" stroke="currentColor" stroke-width="2"/>
      </symbol>
      <!-- Ícone de colapsar (substitui —) -->
      <symbol id="icon-minimize" viewBox="0 0 24 24">
        <rect x="4" y="11" width="16" height="2" rx="1"/>
      </symbol>
      <!-- Ícone de maximizar (substitui ⬜) -->
      <symbol id="icon-maximize" viewBox="0 0 24 24">
        <rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
      </symbol>
      <!-- Ícone de restaurar/abaixar (substitui 🌐 no botão) -->
      <symbol id="icon-restore" viewBox="0 0 24 24">
        <rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M8 4v4H4M16 4v4h4M8 20v-4H4M16 20v-4h4" fill="none" stroke="currentColor" stroke-width="2"/>
      </symbol>
      <!-- Ícone de fechar (substitui ✕) -->
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
      <!-- Ícone de adicionar/mais (substitui +) -->
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <div id="kxtsk-shell">

    <!-- TOPBAR -->
    <div class="os-topbar">
      <div class="os-brand">
        <svg class="icon-svg" aria-hidden="true"><use href="#icon-brand"/></svg>
      </div>
      <div class="top-actions">
        <div class="win-navrow" onclick="event.stopPropagation()">
          <input class="win-urlbar" type="text" id="urlInputNav" placeholder="Digite uma URL..." spellcheck="false" autocomplete="off">
          <button class="win-go-btn" type="button" id="goNavBtn">Go</button>
          <button class="launcher-btn" id="openKobBtn" title="Nova janela">
            <svg class="icon-svg" aria-hidden="true"><use href="#icon-plus"/></svg>
          </button>
          <button class="soft-btn" id="openLogsBtn">Logs</button>
        </div>
      </div>
    </div>

    <!-- DOCK -->
    <div id="dock"></div>

    <!-- STACK -->
    <div id="stackWrap">
      <!-- SESSÃO INICIAL -->
      <div class="session-window" id="session-iframe">
        <div class="win-hdr">
          <span class="win-title">
            <svg class="icon-svg" aria-hidden="true"><use href="#icon-globe"/></svg>
            infodose
          </span>
          <div class="win-navrow" style="flex:1; min-width:0;">
          </div>
          <div class="win-controls">
                         <button type="button" data-action="collapse" title="Colapsar">
                <svg class="icon-svg" aria-hidden="true"><use href="#icon-minimize"/></svg>
              </button>
              <button type="button" data-action="maximize" title="Maximizar">
                <svg class="icon-svg" aria-hidden="true"><use href="#icon-maximize"/></svg>
              </button>
 <button type="button" data-action="minimize" title="Minimizar">
              <svg class="icon-svg" aria-hidden="true"><use href="#icon-globe"/></svg>
            </button>
            <button type="button" data-action="close" title="Fechar">
              <svg class="icon-svg" aria-hidden="true"><use href="#icon-close"/></svg>
            </button>
          </div>
        </div>
        <iframe class="win-frame" data-runtime="nav" id="navFrame" src="https://www.infodose.com.br" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox" allow="fullscreen; accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture" loading="lazy"></iframe>
      </div>
    </div>

  </div>

  <script src="https://infodose.com.br/oiDual/KODUX/78K/APPS/78iFSw/dual-ifswin/js/modules/resize-handles.js"></script>

<link rel="stylesheet" href="https://kodux78k.github.io/oiDual--Y-/M0D/di_Pad/css/zpr.css">
  <script src="https://kodux78k.github.io/oiDual-KxT-di_oi/js/modules/bgPanel.js"></script>
  <div class="theme-switch" id="themeSwitch" title="Alternar tema"></div>
<style> body, html{
overflow-y:auto ;}
</style>

</body>
</html>
