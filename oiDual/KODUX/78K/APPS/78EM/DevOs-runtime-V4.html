        /* ========================================== */
        /* COMPONENTES DA INTERFACE                   */
        /* ========================================== */
        .glass {
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(12px);
        }
        .glass-top {
            border-bottom: 1px solid #30363d;
        }
        .glass-bottom {
            border-top: 1px solid #30363d;
        }

        .view-panel {
            display: none;
            flex: 1;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            position: relative;
        }
        .view-panel.active {
            display: flex;
            flex-direction: column;
        }

        .btn-cyber {
            background: transparent;
            border: 1px solid #30363d;
            color: var(--text-main);
            border-radius: 8px;
            transition: all 0.2s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-cyber:active {
            transform: scale(0.96);
        }
        .btn-cyber.primary {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
        }
        .btn-cyber.primary:active {
            background: rgba(0, 255, 255, 0.1);
        }
        .btn-cyber.danger {
            border-color: var(--neon-magenta);
            color: var(--neon-magenta);
        }
        .btn-cyber.warning {
            border-color: var(--neon-yellow);
            color: var(--neon-yellow);
        }

        .CodeMirror {
            height: 100% !important;
            font-family: 'JetBrains Mono', monospace;
            font-size: var(--font-size-base);
            background: var(--bg-dark) !important;
        }

        #mobileNav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(var(--nav-height) + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            z-index: 100;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            height: 100%;
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-item svg {
            margin-bottom: 4px;
            transition: transform 0.2s;
        }
        .nav-item.active {
            color: var(--neon-cyan);
        }
        .nav-item.active.runtime {
            color: var(--neon-magenta);
        }
        .nav-item.active svg {
            transform: translateY(-2px);
        }

        #drawer {
            position: fixed;
            top: 0;
            left: -100%;
            width: 300px;
            bottom: 0;
            background: var(--bg-panel);
            border-right: 1px solid #30363d;
            z-index: 1000;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding-top: var(--safe-top);
        }
        #drawer.open {
            left: 0;
        }
        #drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        #drawer-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .accordion-header {
            background: #161b22;
            padding: 12px;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #30363d;
            border-bottom: 1px solid #30363d;
            position: sticky;
            top: 0;
            z-index: 10;
            cursor: pointer;
        }
        .card-resource {
            background: var(--bg-card);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: var(--card-p);
            margin: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #runtime-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(13, 17, 23, 0.95);
            border-top: 1px solid var(--neon-magenta);
            backdrop-filter: blur(10px);
            z-index: 50;
            display: flex;
            flex-direction: column;
            max-height: 40%;
            transform: translateY(100%);
            transition: transform 0.3s;
        }
        #runtime-overlay.open {
            transform: translateY(0);
        }

        #preview-wrapper {
            width: 100%;
            height: 100%;
            background: #fff;
            transition: all 0.3s;
            margin: 0 auto;
            position: relative;
        }
        #sandbox-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--neon-magenta);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-magenta);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(1.2);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        #preview-wrapper.runtime-fullscreen {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100dvh !important;
            max-width: none !important;
            max-height: none !important;
            z-index: 99999 !important;
            margin: 0 !important;
            background: #fff !important;
        }
        #preview-wrapper.runtime-fullscreen #sandbox-frame {
            width: 100% !important;
            height: 100% !important;
        }
        #btn-fullscreen.is-active {
            color: #00ffff;
            border-color: #00ffff;
            background: rgba(0, 255, 255, .12);
            box-shadow: 0 0 15px rgba(0, 255, 255, .25);
        }
        #preview-wrapper:fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            background: #fff;
        }
        #preview-wrapper:fullscreen #sandbox-frame {
            width: 100%;
            height: 100%;
        }
        #preview-wrapper:-webkit-full-screen {
            width: 100vw !important;
            height: 100vh !important;
        }

        #btn-exit-full {
            display: none;
        }
        #preview-wrapper:fullscreen #btn-exit-full,
        #preview-wrapper:-webkit-full-screen #btn-exit-full,
        #preview-wrapper.runtime-fullscreen #btn-exit-full {
            display: flex !important;
        }

        /* Snapshot item */
        .snapshot-item {
            background: var(--bg-card);
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            transition: border-color 0.2s;
        }
        .snapshot-item:hover {
            border-color: #4b5563;
        }
        .snapshot-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
            cursor: pointer;
        }
        .snapshot-info .name {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .snapshot-info .meta {
            font-size: 9px;
            color: var(--text-muted);
            font-family: ui-monospace, monospace;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .snapshot-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .snapshot-actions button {
            background: transparent;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: var(--text-muted);
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 12px;
            padding: 0;
        }
        .snapshot-actions button:hover {
            border-color: #4b5563;
            color: var(--text-main);
        }
        .snapshot-actions .btn-preview {
            color: var(--neon-cyan);
            border-color: rgba(0, 255, 255, 0.3);
        }
        .snapshot-actions .btn-preview:hover {
            border-color: var(--neon-cyan);
            background: rgba(0, 255, 255, 0.08);
            color: #fff;
        }
        .snapshot-actions .btn-delete {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.2);
        }
        .snapshot-actions .btn-delete:hover {
            border-color: #f87171;
            background: rgba(248, 113, 113, 0.08);
            color: #fff;
        }
        .snapshot-actions .btn-load {
            color: var(--neon-yellow);
            border-color: rgba(251, 191, 36, 0.2);
        }
        .snapshot-actions .btn-load:hover {
            border-color: var(--neon-yellow);
            background: rgba(251, 191, 36, 0.08);
            color: #fff;
        }
        .snapshot-empty {
            color: var(--text-muted);
            font-size: 11px;
            text-align: center;
            padding: 16px 0;
        }

        #snapshot-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 260px;
            overflow-y: auto;
            padding-right: 2px;
        }
        #snapshot-list::-webkit-scrollbar {
            width: 4px;
        }
        #snapshot-list::-webkit-scrollbar-track {
            background: transparent;
        }
        #snapshot-list::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }
    </style>

    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 bg-cyan-900/90 text-cyan-50 border border-cyan-400 px-4 py-2 rounded-full text-xs font-bold transition-opacity duration-300 opacity-0 pointer-events-none z-[9999]"></div>

    <script>
        // =============================================
        // STATE & VAULT (dual_vault_data)
        // =============================================
        const State = {
            rawHTML: '',
            dom: null,
            resources: [],
            liveModules: [],
            stats: { size: 0, cdns: 0, dupes: 0 },
            editor: null,
            cy: null,
            surgeryMode: false,
            isMobile: window.innerWidth < 768,
            lastUploadedFileName: null,
            vault: { stacks: [] } // será carregado do localStorage
        };

        // Carrega o vault do localStorage
        function loadVault() {
            try {
                const raw = localStorage.getItem('dual_vault_data');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    State.vault = parsed;
                    if (!State.vault.stacks) State.vault.stacks = [];
                } else {
                    State.vault = { stacks: [] };
                }
            } catch (e) {
                State.vault = { stacks: [] };
            }
        }

        function saveVault() {
            try {
                localStorage.setItem('dual_vault_data', JSON.stringify(State.vault));
            } catch (e) { /* ignore */ }
        }

        // =============================================
        // getDocumentName (inteligente)
        // =============================================
        function getDocumentName(content, fallbackName = '') {
            // 1. Nome original do arquivo
            if (fallbackName) {
                const cleanFile = fallbackName.replace(/\.[^/.]+$/, '').trim();
                if (cleanFile) return cleanFile;
            }
            // 2. Título do HTML
            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(content, 'text/html');
                const title = doc.querySelector('title')?.textContent?.trim();
                if (title) return title;
                // 3. Primeiro ID relevante
                const firstId = doc.querySelector('[id]')?.id?.trim();
                if (firstId) return firstId;
            } catch (e) {}
            // 4. Fallback
            return 'Snapshot sem título';
        }

        // =============================================
        // Bridge Script (mesmo)
        // =============================================
        const BridgeScript = `
        <script id="kodux-devos-bridge">
          (function() {
            window.__DEVOS_BRIDGE = true;
            const post = (msg) => window.parent.postMessage(msg, '*');
            const _err = console.error;
            console.error = function(...args) {
              post({ type: 'LOG', level: 'error', data: args.join(' ') });
              _err.apply(console, args);
            };
            const _warn = console.warn;
            console.warn = function(...args) {
              post({ type: 'LOG', level: 'warn', data: args.join(' ') });
              _warn.apply(console, args);
            };
            document.addEventListener('click', (e) => {
              if(window.__SURGERY_MODE) {
                e.preventDefault(); e.stopPropagation();
                post({ type: 'SURGERY', tag: e.target.tagName, id: e.target.id, className: e.target.className });
              }
            }, true);
            window.addEventListener('load', () => {
              const knownModules = ['CallAI', 'DualBook', 'SplitTest', 'KRA', 'Archetypes', 'Player', 'ThemeEngine'];
              const found = knownModules.filter(m => typeof window[m] !== 'undefined');
              post({ type: 'MODULES', modules: found });
              post({ type: 'LOG', level: 'sys', data: 'DevOS Bridge Injetado e Ativo.' });
            });
          })();
        <\/script>
        `;

        // =============================================
        // RUNTIME (mesmo)
        // =============================================
        const Runtime = {
            init() {
                window.addEventListener('message', (e) => {
                    const msg = e.data;
                    if (!msg || !msg.type) return;
                    if (msg.type === 'LOG') {
                        this.appendLog(msg.level, msg.data);
                    } else if (msg.type === 'MODULES') {
                        State.liveModules = msg.modules;
                        this.appendLog('sys', `Módulos Runtime: ${msg.modules.join(', ') || 'Nenhum'}`);
                        UI.initLazyGraph(true);
                    } else if (msg.type === 'SURGERY') {
                        this.appendLog('warn', `🔍 CIRURGIA: <${msg.tag.toLowerCase()} id="${msg.id}" class="${msg.className}">`);
                        UI.showToast('Elemento capturado! Verifique os Logs.');
                    }
                });

                const syncFullscreen = () => {
                    const wrapper = document.getElementById('preview-wrapper');
                    const btn = document.getElementById('btn-fullscreen');
                    const nativeFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
                    const visualFullscreen = wrapper.classList.contains('runtime-fullscreen');
                    btn.classList.toggle('is-active', nativeFullscreen || visualFullscreen);
                    if (!nativeFullscreen && !visualFullscreen) {
                        wrapper.classList.remove('runtime-fullscreen');
                    }
                };
                document.addEventListener('fullscreenchange', syncFullscreen);
                document.addEventListener('webkitfullscreenchange', syncFullscreen);
            },

            appendLog(level, text) {
                const container = document.getElementById('live-logs');
                const colors = { error: 'text-red-400', warn: 'text-yellow-400', sys: 'text-cyan-400', default: 'text-gray-300' };
                const time = new Date().toLocaleTimeString();
                const color = colors[level] || colors.default;
                container.insertAdjacentHTML('afterbegin', `<div class="${color}">[${time}] ${text}</div>`);
            },

            toggleSurgery() {
                State.surgeryMode = !State.surgeryMode;
                const btn = document.getElementById('btn-surgery');
                btn.classList.toggle('bg-magenta-900/50', State.surgeryMode);
                btn.classList.toggle('text-white', State.surgeryMode);
                const frame = document.getElementById('sandbox-frame');
                if (frame.contentWindow) {
                    frame.contentWindow.__SURGERY_MODE = State.surgeryMode;
                    this.appendLog('sys', `Modo Cirurgia ${State.surgeryMode ? 'ATIVADO' : 'DESATIVADO'}`);
                }
            },

            async toggleFullscreen() {
                const wrapper = document.getElementById('preview-wrapper');
                const btn = document.getElementById('btn-fullscreen');
                if (wrapper.classList.contains('runtime-fullscreen')) {
                    wrapper.classList.remove('runtime-fullscreen');
                    btn.classList.remove('is-active');
                    UI.showToast('Fullscreen encerrado');
                    return;
                }
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    try {
                        if (document.exitFullscreen) await document.exitFullscreen();
                        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    } catch (err) { console.warn('Erro ao sair:', err); }
                    wrapper.classList.remove('runtime-fullscreen');
                    btn.classList.remove('is-active');
                    UI.showToast('Fullscreen encerrado');
                    return;
                }
                try {
                    if (wrapper.requestFullscreen) {
                        await wrapper.requestFullscreen();
                        btn.classList.add('is-active');
                        UI.showToast('Runtime em tela cheia');
                        return;
                    }
                    if (wrapper.webkitRequestFullscreen) {
                        wrapper.webkitRequestFullscreen();
                        btn.classList.add('is-active');
                        UI.showToast('Runtime em tela cheia');
                        return;
                    }
                } catch (err) { console.warn('Nativo indisponível:', err); }
                wrapper.classList.add('runtime-fullscreen');
                btn.classList.add('is-active');
                UI.showToast('Runtime expandido');
            },

            loadSnapshotIntoRuntime(html) {
                const frame = document.getElementById('sandbox-frame');
                frame.srcdoc = html;
                document.getElementById('live-logs').innerHTML = `<div class="text-gray-500">Snapshot carregado — aguardando telemetria...</div>`;
                State.liveModules = [];
                // Switch to runtime view
                const runtimeNav = document.querySelector('.nav-item:nth-child(3)');
                if (runtimeNav) App.switchTab('runtime', runtimeNav);
            }
        };

        // =============================================
        // ENGINE (mesmo, sem alterações)
        // =============================================
        const Engine = {
            parseHTML() {
                const parser = new DOMParser();
                State.dom = parser.parseFromString(State.rawHTML, 'text/html');
                State.resources = [];
                State.stats.size = new Blob([State.rawHTML]).size;
                State.stats.cdns = 0;
                State.stats.dupes = 0;
                const urlSet = new Set();
                State.dom.querySelectorAll('link[rel="stylesheet"]').forEach((el, i) => {
                    const href = el.getAttribute('href') || '';
                    const isDupe = urlSet.has(href);
                    if (isDupe) State.stats.dupes++;
                    urlSet.add(href);
                    State.resources.push({ id: `L_${i}`, type: 'style', url: href, inline: false, node: el, active: true,
                        isDupe });
                    State.stats.cdns++;
                });
                State.dom.querySelectorAll('style').forEach((el, i) => {
                    State.resources.push({ id: `SI_${i}`, type: 'style', url: '', inline: true, node: el, active: true,
                        isDupe: false });
                });
                State.dom.querySelectorAll('script').forEach((el, i) => {
                    if (el.id === 'kodux-devos-bridge') return;
                    const src = el.getAttribute('src');
                    if (src) {
                        const isDupe = urlSet.has(src);
                        if (isDupe) State.stats.dupes++;
                        urlSet.add(src);
                        State.resources.push({ id: `JS_${i}`, type: 'script', url: src, inline: false, node: el,
                            active: true, isDupe });
                        State.stats.cdns++;
                    } else {
                        State.resources.push({ id: `JSI_${i}`, type: 'script', url: '', inline: true, node: el,
                            active: true, isDupe: false });
                    }
                });
                this.scanStaticModules();
                UI.updateStats();
                UI.renderInspector();
                if (State.cy) UI.initLazyGraph(true);
            },

            scanStaticModules() {
                const code = State.rawHTML;
                const dualModules = ['KDevPanel', 'dual-engine', 'CallAI', 'ThemeEngine'];
                const found = dualModules.filter(m => code.includes(m));
                const cont = document.getElementById('dual-modules-static');
                if (found.length > 0) {
                    cont.innerHTML = found.map(m =>
                        `<span class="bg-cyan-900/50 text-cyan-300 border border-cyan-800 px-2 py-0.5 rounded uppercase tracking-wider">${m}</span>`
                        ).join('');
                } else {
                    cont.innerHTML = '<span class="text-gray-500">Nenhum módulo Dual App detectado estaticamente.</span>';
                }
            },

            toggleResource(id) {
                const res = State.resources.find(r => r.id === id);
                if (res) {
                    res.active = !res.active;
                    UI.renderInspector();
                    UI.showToast(`Recurso ${res.active?'ON':'OFF'}. Atualize o Preview.`);
                }
            },

            toggleGroup(type, state) {
                State.resources.forEach(r => { if (r.type === type || (type === 'js' && r.type === 'script')) r.active =
                    state; });
                UI.renderInspector();
                UI.showToast(`Grupo ${type} alterado. Atualize o Preview.`);
            },

            quickClean() {
                if (!State.dom) return;
                let rem = 0;
                const cleanDom = State.dom.cloneNode(true);
                const seen = new Set();
                ['link[rel="stylesheet"]', 'script[src]'].forEach(sel => {
                    cleanDom.querySelectorAll(sel).forEach(el => {
                        const attr = sel.includes('link') ? el.getAttribute('href') : el.getAttribute('src');
                        if (attr) { if (seen.has(attr)) { el.remove();
                                rem++; } else seen.add(attr); }
                    });
                });
                if (rem > 0) {
                    State.editor.setValue('<!DOCTYPE html>\n' + cleanDom.documentElement.outerHTML);
                    UI.showToast(`🔥 ${rem} duplicatas removidas!`);
                } else {
                    UI.showToast('✨ Código limpo.');
                }
            },

            refactorHTML() {
                if (!State.dom) return;
                const cleanDom = State.dom.cloneNode(true);
                const head = cleanDom.querySelector('head');
                cleanDom.querySelectorAll('style').forEach(el => head.appendChild(el));
                const newHtml = '<!DOCTYPE html>\n' + cleanDom.documentElement.outerHTML.replace(/\n\s*\n/g, '\n');
                State.editor.setValue(newHtml);
                UI.showToast('🚀 Refatoração concluída!');
            }
        };

        // =============================================
        // UI (mesmo, mas com atualização da lista via vault)
        // =============================================
        const UI = {
            initEditor() {
                State.editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
                    mode: 'htmlmixed',
                    theme: 'material-ocean',
                    lineNumbers: !State.isMobile,
                    lineWrapping: true,
                    viewportMargin: State.isMobile ? 20 : Infinity,
                    matchBrackets: true,
                    autoCloseTags: true
                });
                State.editor.on('change', () => {
                    clearTimeout(State.updateTimeout);
                    State.updateTimeout = setTimeout(() => {
                        State.rawHTML = State.editor.getValue();
                        Engine.parseHTML();
                    }, 800);
                });
            },

            showToast(msg) {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.style.opacity = '1';
                setTimeout(() => t.style.opacity = '0', 3000);
            },

            updateStats() {
                const kb = (State.stats.size / 1024).toFixed(1);
                document.getElementById('top-size').textContent = `${kb} KB`;
            },

            toggleAccordion(id) {
                const el = document.getElementById(id);
                const icon = document.getElementById('icon-' + id);
                if (el.style.display === 'none') { el.style.display = 'flex';
                    icon.style.transform = 'rotate(0deg)'; } else { el.style.display = 'none';
                    icon.style.transform = 'rotate(-90deg)'; }
            },

            toggleRuntimePanel() { document.getElementById('runtime-overlay').classList.toggle('open'); },
            searchEditor() { State.editor.execCommand('find');
                UI.showToast("Dica: Use Cmd/Ctrl+F no editor."); },

            renderInspector() {
                const ext = document.getElementById('acc-external');
                const int = document.getElementById('acc-internal');
                ext.innerHTML = '';
                int.innerHTML = '';
                State.resources.forEach(res => {
                    const isJS = res.type === 'script';
                    const col = isJS ? 'text-yellow-400' : 'text-magenta-400';
                    let name = res.inline ? `[Inline] ${isJS?'Script':'Style'}` : res.url.split('/').pop() || res
                        .url;
                    if (name.length > 40) name = name.substring(0, 40) + '...';
                    const btn = res.active ? 'border-cyan-500 text-cyan-400' : 'border-gray-600 text-gray-500';
                    const dupe = res.isDupe ?
                        `<span class="bg-red-900 text-red-300 px-1 text-[9px] rounded">DUPE</span>` : '';
                    const html = `
                <div class="card-resource" style="border-color:${res.active?'#30363d':'#ef444450'}; opacity:${res.active?1:0.5}">
                    <div class="flex justify-between items-center text-xs truncate font-mono">${name} ${dupe}</div>
                    <div class="flex justify-between items-center mt-1">
                        <span class="text-[9px] uppercase ${col}">● ${isJS?'JS':'CSS'}</span>
                        <button onclick="Engine.toggleResource('${res.id}')" class="btn-cyber px-3 py-1 text-[9px] ${btn}">${res.active?'ON':'OFF'}</button>
                    </div>
                </div>`;
                    if (res.inline) int.insertAdjacentHTML('beforeend', html);
                    else ext.insertAdjacentHTML('beforeend', html);
                });
            },

            changeDevice() {
                const v = document.getElementById('device-select').value;
                const w = document.getElementById('preview-wrapper');
                w.style.width = v;
                w.style.height = (v === '100%') ? '100%' : '800px';
            },

            initLazyGraph(force = false) {
                if (State.cy && !force) return;
                const elements = [{ data: { id: 'html', label: 'HTML DOM', type: 'root' } }];
                State.resources.forEach(r => {
                    if (!r.active) return;
                    elements.push({ data: { id: r.id, label: r.inline ? `Inline ${r.type}` : r.url.split('/')
                            .pop().substring(0, 12), type: r.type } });
                    elements.push({ data: { id: `e_${r.id}`, source: 'html', target: r.id } });
                });
                State.liveModules.forEach(m => {
                    elements.push({ data: { id: `mod_${m}`, label: m, type: 'module' } });
                    elements.push({ data: { id: `e_mod_${m}`, source: 'html', target: `mod_${m}` } });
                });
                if (State.cy) State.cy.destroy();
                State.cy = cytoscape({
                    container: document.getElementById('cy-container'),
                    elements: elements,
                    style: [
                        { selector: 'node', style: { 'label': 'data(label)', 'color': '#fff', 'font-size': '10px',
                                'text-valign': 'center', 'text-halign': 'right', 'background-color': '#333' } },
                        { selector: 'node[type="root"]', style: { 'background-color': '#00ffff', 'width': 30,
                                'height': 30 } },
                        { selector: 'node[type="script"]', style: { 'background-color': '#fbbf24',
                                'shape': 'rectangle' } },
                        { selector: 'node[type="style"]', style: { 'background-color': '#ff00ff',
                                'shape': 'ellipse' } },
                        { selector: 'node[type="module"]', style: { 'background-color': '#4ade80',
                                'shape': 'triangle' } },
                        { selector: 'edge', style: { 'width': 1, 'line-color': '#30363d',
                                'target-arrow-color': '#30363d', 'target-arrow-shape': 'triangle',
                                'curve-style': 'bezier' } }
                    ],
                    layout: { name: 'concentric', minNodeSpacing: 50 }
                });
            }
        };

        // =============================================
        // APP (integrado ao vault)
        // =============================================
        const App = {
            async init() {
                loadVault();
                UI.initEditor();
                Runtime.init();

                // Upload
                document.getElementById('file-upload').addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    State.lastUploadedFileName = file.name;
                    const r = new FileReader();
                    r.onload = (ev) => {
                        const html = ev.target.result;
                        State.editor.setValue(html);
                        UI.showToast(`📂 ${file.name} carregado!`);
                        // Cria snapshot com nome extraído
                        this.createSnapshot(null, file.name);
                    };
                    r.readAsText(file);
                    e.target.value = '';
                });

                // Autosave (localforage)
                const lastState = await localforage.getItem('autosave');
                if (lastState) {
                    State.editor.setValue(lastState);
                } else {
                    State.editor.setValue(`<!DOCTYPE html>\n<html>\n<head>\n<style>\nbody { background: black; color: white; padding: 1rem; font-family: sans-serif; }\n</style>\n</head>\n<body>\n<div id="app"><h1>DevOS v3 Ready</h1></div>\n<script>\n window.CallAI = () => console.log('AI Module');\n console.warn('Iniciando...');\n<\/script>\n</body>\n</html>`);
                }

                this.updateSnapshotsList();
                setTimeout(() => this.updatePreview(), 500);

                setInterval(() => { if (State.rawHTML) localforage.setItem('autosave', State.rawHTML); }, 5000);
            },

            switchTab(viewName, navEl) {
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active', 'runtime'));
                navEl.classList.add('active');
                if (viewName === 'runtime') navEl.classList.add('runtime');
                document.querySelectorAll('.view-panel').forEach(el => el.classList.remove('active'));
                document.getElementById(`view-${viewName}`).classList.add('active');
                if (viewName === 'graph') setTimeout(() => UI.initLazyGraph(), 100);
            },

            toggleDrawer() {
                document.getElementById('drawer').classList.toggle('open');
                document.getElementById('drawer-overlay').classList.toggle('open');
            },

            updatePreview() {
                if (!State.dom) Engine.parseHTML();
                document.getElementById('live-logs').innerHTML = '';
                State.liveModules = [];
                const modDom = State.dom.cloneNode(true);
                State.resources.forEach(res => { if (res.node) res.node.setAttribute('data-k-id', res.id); });
                State.resources.forEach(res => {
                    if (!res.active) {
                        const el = modDom.querySelector(`[data-k-id="${res.id}"]`);
                        if (el) {
                            const cmt = modDom.createComment(` OFF DEVOS: ${el.outerHTML} `);
                            el.parentNode.replaceChild(cmt, el);
                        }
                    }
                });
                modDom.querySelectorAll('[data-k-id]').forEach(el => el.removeAttribute('data-k-id'));
                const head = modDom.querySelector('head');
                if (head) head.insertAdjacentHTML('afterbegin', BridgeScript);
                const htmlStr = '<!DOCTYPE html>\n' + modDom.documentElement.outerHTML;
                document.getElementById('sandbox-frame').srcdoc = htmlStr;
            },

            exportFile() {
                const blob = new Blob([State.editor.getValue()], { type: "text/html" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "devos-export.html";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                UI.showToast('HTML Exportado!');
            },

            // =============================================
            // SNAPSHOTS VIA VAULT (dual_vault_data)
            // =============================================
            createSnapshot(customName = null, fileName = null) {
                if (!State.rawHTML) {
                    UI.showToast('⚠️ Nenhum HTML para salvar.');
                    return;
                }
                const content = State.rawHTML;
                const title = customName || getDocumentName(content, fileName || State.lastUploadedFileName);
                const id = Date.now();
                const newStack = {
                    id: id,
                    title: title,
                    fileName: fileName || State.lastUploadedFileName || null,
                    content: content,
                    type: 'text/html',
                    date: new Date().toLocaleString('pt-BR'),
                    source: 'local-vault',
                    previewable: true
                };
                // Adiciona no início (mais recente)
                State.vault.stacks.unshift(newStack);
                saveVault();
                UI.showToast(`📸 Snapshot salvo: "${title}"`);
                this.updateSnapshotsList();
            },

            // Carrega um snapshot no editor
            async loadSnapshot(id) {
                const stack = State.vault.stacks.find(s => s.id === id);
                if (!stack) {
                    UI.showToast('⚠️ Snapshot não encontrado.');
                    return;
                }
                State.editor.setValue(stack.content);
                UI.showToast(`📂 Restaurado: "${stack.title}"`);
                this.toggleDrawer();
            },

            // Preview em fullscreen
            async previewSnapshot(id) {
                const stack = State.vault.stacks.find(s => s.id === id);
                if (!stack) {
                    UI.showToast('⚠️ Snapshot não encontrado.');
                    return;
                }
                Runtime.loadSnapshotIntoRuntime(stack.content);
                UI.showToast(`▶️ Preview: "${stack.title}"`);
                setTimeout(() => {
                    Runtime.toggleFullscreen();
                }, 400);
                this.toggleDrawer();
            },

            // Deleta do vault
            async deleteSnapshot(id) {
                State.vault.stacks = State.vault.stacks.filter(s => s.id !== id);
                saveVault();
                this.updateSnapshotsList();
                UI.showToast('🗑️ Snapshot removido.');
            },

            // Atualiza a lista no drawer
            updateSnapshotsList() {
                const cont = document.getElementById('snapshot-list');
                const stacks = State.vault.stacks;
                document.getElementById('snap-count').textContent = stacks.length;

                if (stacks.length === 0) {
                    cont.innerHTML = `<div class="snapshot-empty">Nenhum snapshot salvo ainda.</div>`;
                    return;
                }

                // Ordena por data (mais recente primeiro) – assumindo que stacks já está ordenado, mas garantimos
                const sorted = [...stacks].sort((a, b) => b.id - a.id);

                cont.innerHTML = '';
                for (let s of sorted) {
                    cont.insertAdjacentHTML('beforeend', `
                    <div class="snapshot-item">
                        <div class="snapshot-info" onclick="App.loadSnapshot(${s.id})">
                            <div class="name">📄 ${s.title}</div>
                            <div class="meta">🕒 ${s.date || 'Data desconhecida'}</div>
                        </div>
                        <div class="snapshot-actions">
                            <button class="btn-preview" onclick="App.previewSnapshot(${s.id})" title="Preview em tela cheia">▶</button>
                            <button class="btn-load" onclick="App.loadSnapshot(${s.id})" title="Restaurar no editor">⤓</button>
                            <button class="btn-delete" onclick="App.deleteSnapshot(${s.id})" title="Deletar">✕</button>
                        </div>
                    </div>
                    `);
                }
            }
        };

        // Inicialização
        window.onload = () => App.init();
    </script>
</body>
</html>
