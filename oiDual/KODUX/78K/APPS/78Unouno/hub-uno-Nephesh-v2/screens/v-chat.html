<section id="v-chat" class="view">
                                                                                                                                                                                  <!-- Feed de mensagens do chat -->
                                                                                                                                                                                    <div id="chatFeed" style="flex:1;overflow-y:auto;padding-bottom:4px">
                                                                                                                                                                                    </div>
                                                                                                                                                                                  <!-- INPUT BAR KCHAT STYLE -->
                                                                                                                                                                                  <div id="chatInputBar">
                                                                                                                                                                                    <textarea id="chatInputTA" placeholder="Mensagem para KOBLLUX… (Enter envia, Shift+Enter nova linha)" rows="1"
                                                                                                                                                                                      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"
                                                                                                                                                                                      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();chatInputSend()}"
                                                                                                                                                                                    ></textarea>
                                                                                                                                                                                    <button id="chatSendBtn" onclick="chatInputSend()" title="Enviar">⚡</button>
                                                                                                                                                                                  </div>
                                                                                                                                                                                  </section>
