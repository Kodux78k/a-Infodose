<section id="v-img" class="view">
  <div class="grid">
    <div class="card fx-trans fx-lift" style="display:block">
      <div style="font-weight:900;letter-spacing:.08em;font-size:var(--fs-d6);margin-bottom:12px">🖼 GALERIA VISUAL · IMAGEM</div>
      <div style="font-size:var(--fs-d2);color:rgba(200,216,240,.6);margin-bottom:16px">Gerador de imagens e galeria do ecossistema KOBLLUX.</div>
      <!-- Upload zone -->
      <label id="imgDropZone" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:160px;border:2px dashed rgba(74,158,255,.35);border-radius:12px;cursor:pointer;gap:10px;background:rgba(74,158,255,.04);transition:.3s">
        <img src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/svgs/solid/image.svg" width="36" height="36" style="opacity:.4">
        <span style="font-size:var(--fs-d2);color:rgba(200,216,240,.5)">Arraste uma imagem ou clique para selecionar</span>
        <input type="file" id="imgFileInput" accept="image/*" style="display:none">
      </label>
      <!-- Preview -->
      <div id="imgPreviewGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:16px"></div>
    </div>
    <!-- Prompt box for image generation hint -->
    <div class="card fx-trans fx-lift" style="display:block">
      <div style="font-weight:700;font-size:var(--fs-d3);margin-bottom:8px;color:#4a9eff">Δ PROMPT VISUAL</div>
      <textarea id="imgPromptTA" rows="3" placeholder="Descreva a imagem KOBLLUX que deseja visualizar…"
        style="width:100%;background:#12122a;border:1px solid rgba(74,158,255,.25);color:#f5f7ff;border-radius:8px;padding:10px;font-family:'Space Mono',monospace;font-size:var(--fs-d2);resize:vertical;outline:none;box-sizing:border-box"></textarea>
      <div style="margin-top:8px;font-size:var(--fs-d1);color:rgba(200,216,240,.4)">
        Integração com gerador de imagem disponível via API key (Settings → Brain)
      </div>
    </div>

    <!-- ── HTML / CODE LIVE PREVIEW ── -->
    <div class="card fx-trans fx-lift" style="display:block;padding:0;overflow:hidden;border:1px solid rgba(74,158,255,.25)">
      <div style="padding:10px 14px;background:rgba(10,12,20,.95);border-bottom:1px solid rgba(74,158,255,.15);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <div>
          <div style="font-weight:900;font-size:var(--fs-d4);color:#4a9eff;letter-spacing:.08em">Δ CODE PREVIEW · HTML / CSS / JS</div>
          <div style="font-size:var(--fs-d1);color:rgba(200,216,240,.4);margin-top:2px">Cole qualquer código — renderiza ao vivo</div>
        </div>
        <div style="display:flex;gap:6px">
          <button id="imgCodeRun" style="padding:5px 12px;background:linear-gradient(135deg,#4a9eff,#00e5ff);border:none;border-radius:7px;color:#000;font-weight:700;font-size:var(--fs-d3);cursor:pointer;letter-spacing:.08em">▶ Run</button>
          <button id="imgCodeFS" style="padding:5px 10px;background:transparent;border:1px solid rgba(74,158,255,.3);border-radius:7px;color:rgba(74,158,255,.7);font-size:var(--fs-d3);cursor:pointer">⤢</button>
          <button id="imgCodeClear" style="padding:5px 10px;background:rgba(255,100,100,.08);border:1px solid rgba(255,100,100,.2);border-radius:7px;color:rgba(255,150,150,.7);font-size:var(--fs-d3);cursor:pointer">✕</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;min-height:240px">
        <div style="display:flex;flex-direction:column;border-right:1px solid rgba(74,158,255,.1)">
          <div style="padding:3px 10px;background:rgba(0,0,0,.35);font-family:'Space Mono',monospace;font-size:var(--fs-d1);color:rgba(74,158,255,.45);letter-spacing:.18em">CÓDIGO</div>
          <textarea id="imgCodeTA" spellcheck="false" autocomplete="off"
            style="flex:1;width:100%;min-height:220px;background:#090910;color:#a0e0ff;
            font-family:'Space Mono',monospace;font-size:var(--fs-d3);line-height:1.6;
            padding:10px;border:none;outline:none;resize:none;box-sizing:border-box;
            tab-size:2;-webkit-overflow-scrolling:touch;white-space:pre"
            placeholder="<!-- Cole HTML, CSS, JS aqui -->&#10;<h1 style=&quot;color:gold&quot;>KOBLLUX</h1>"></textarea>
        </div>
        <div style="display:flex;flex-direction:column">
          <div style="padding:3px 10px;background:rgba(0,0,0,.35);font-family:'Space Mono',monospace;font-size:var(--fs-d1);color:rgba(74,158,255,.45);letter-spacing:.18em">PREVIEW</div>
          <iframe id="imgCodePreview"
            style="flex:1;width:100%;min-height:220px;border:none;background:#fff"
            sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe>
        </div>
      </div>
    </div>

  </div>
</section>
