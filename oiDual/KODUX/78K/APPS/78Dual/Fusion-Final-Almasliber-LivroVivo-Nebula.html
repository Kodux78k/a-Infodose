<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>Fusão KOBLLUX · Almasliber × Livro Vivo × Nebula Pro</title>
<style>
  :root{
    --kob-bg:#0b0b12;
    --kob-bg-2:#14111f;
    --kob-ink:#f4f2fa;
    --kob-muted:#9491a3;
    --kob-primary:#8a55ff;
    --kob-primary-2:#c77cff;
    --kob-line:rgba(255,255,255,.1);
    --kob-dock-h:74px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(circle at 78% 8%, rgba(190,112,255,.22), transparent 40%),
      radial-gradient(circle at 15% 92%, rgba(121,62,255,.16), transparent 45%),
      var(--kob-bg);
    color:var(--kob-ink);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #kob-fusion-shell{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
  }
  #kob-fusion-stage{
    position:relative;
    flex:1 1 auto;
    min-height:0;
  }
  .kob-app-frame{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:0;
    background:#0b0b12;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .18s ease;
  }
  .kob-app-frame.is-active{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
  }
  #kob-fusion-loading{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px;
    color:var(--kob-muted);
    font-size:13px;
    letter-spacing:.02em;
    background:var(--kob-bg);
    z-index:5;
    transition:opacity .25s ease;
  }
  #kob-fusion-loading.hide{opacity:0; pointer-events:none;}
  .kob-spinner{
    width:34px;height:34px;border-radius:50%;
    border:3px solid rgba(255,255,255,.12);
    border-top-color:var(--kob-primary);
    animation:kobspin .8s linear infinite;
  }
  @keyframes kobspin{to{transform:rotate(360deg)}}
  #kob-fusion-dock{
    flex:0 0 auto;
    height:var(--kob-dock-h);
    padding-bottom:env(safe-area-inset-bottom);
    display:flex;
    align-items:stretch;
    justify-content:space-around;
    background:linear-gradient(180deg, rgba(20,17,31,.82), rgba(11,11,18,.96));
    border-top:1px solid var(--kob-line);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }
  .kob-dock-btn{
    flex:1 1 0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px;
    border:0; background:transparent; color:var(--kob-muted);
    font:inherit; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    padding:6px 4px;
  }
  .kob-dock-icon{font-size:20px; filter:grayscale(1) opacity(.7); transition:filter .2s ease, transform .2s ease;}
  .kob-dock-label{font-size:10px; font-weight:800; letter-spacing:.03em;}
  .kob-dock-btn.active{color:var(--kob-primary-2);}
  .kob-dock-btn.active .kob-dock-icon{filter:none; transform:translateY(-2px) scale(1.08);}
  .kob-dock-btn:active .kob-dock-icon{transform:scale(.92);}
</style>
</head>
<body>
<div id="kob-fusion-shell">
  <div id="kob-fusion-stage">
    <div id="kob-fusion-loading"><div class="kob-spinner"></div><span>Carregando fusão KOBLLUX…</span></div>
    <iframe id="frame-al" class="kob-app-frame" data-app="al" title="Almasliber"></iframe>
<iframe id="frame-tl" class="kob-app-frame" data-app="tl" title="Portal"></iframe>
<iframe id="frame-hf" class="kob-app-frame" data-app="hf" title="Nebula"></iframe>
  </div>
  <nav id="kob-fusion-dock" aria-label="Alternar apps da fusão">
    <button class="kob-dock-btn active" data-app="al" type="button"><span class="kob-dock-icon">🧿</span><span class="kob-dock-label">Almasliber</span></button>
<button class="kob-dock-btn" data-app="tl" type="button"><span class="kob-dock-icon">📖</span><span class="kob-dock-label">Portal</span></button>
<button class="kob-dock-btn" data-app="hf" type="button"><span class="kob-dock-icon">🌌</span><span class="kob-dock-label">Nebula</span></button>
  </nav>
</div>

<script>
(function(){
  'use strict';
  var APPS = ["al","tl","hf"];
  var STORE_KEY = 'di_fusion_active_app';
  var loading = document.getElementById('kob-fusion-loading');
  var loaded = 0;

  function b64ToBlobUrl(b64){
    var bin = atob(b64);
    var len = bin.length;
    var bytes = new Uint8Array(len);
    for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
    var blob = new Blob([bytes], {type: 'text/html;charset=utf-8'});
    return URL.createObjectURL(blob);
  }

  function markLoaded(){
    loaded++;
    if (loaded >= APPS.length) {
      loading.classList.add('hide');
    }
  }

  APPS.forEach(function(key){
    var srcEl = document.getElementById('src-' + key);
    var frame = document.getElementById('frame-' + key);
    if (!srcEl || !frame) return;
    var b64 = srcEl.textContent.trim();
    frame.addEventListener('load', markLoaded, { once: true });
    frame.src = b64ToBlobUrl(b64);
  });

  function setActive(key){
    APPS.forEach(function(k){
      var frame = document.getElementById('frame-' + k);
      var btn = document.querySelector('.kob-dock-btn[data-app="' + k + '"]');
      if (frame) frame.classList.toggle('is-active', k === key);
      if (btn) btn.classList.toggle('active', k === key);
    });
    try { localStorage.setItem(STORE_KEY, key); } catch(e){}
  }

  document.getElementById('kob-fusion-dock').addEventListener('click', function(ev){
    var btn = ev.target.closest('.kob-dock-btn');
    if (!btn) return;
    setActive(btn.getAttribute('data-app'));
  });

  var initial = APPS[0];
  try {
    var saved = localStorage.getItem(STORE_KEY);
    if (saved && APPS.indexOf(saved) !== -1) initial = saved;
  } catch(e){}
  setActive(initial);

  window.KOB_FUSION = {
    apps: APPS,
    goTo: setActive
  };
})();
</script>
