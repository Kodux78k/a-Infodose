<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>KODUX Link Forge</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  color-scheme:dark;
  --bg:#08090b;
  --card:#111318;
  --card2:#171a20;
  --line:#292e38;
  --txt:#f4f6f8;
  --muted:#8c94a3;
  --accent:#23ac51;
  --accent2:#f97316;
}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 50% -10%,#17221b 0,transparent 42%),
    var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}

body{
  padding:
    max(14px,env(safe-area-inset-top))
    14px
    max(24px,env(safe-area-inset-bottom));
}

.app{
  width:min(760px,100%);
  margin:auto;
}

header{
  padding:14px 4px 18px;
}

.logo{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.6px;
}

.logo span{
  color:var(--accent);
}

.sub{
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
}

.card{
  background:rgba(17,19,24,.88);
  border:1px solid var(--line);
  border-radius:22px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 15px 45px #0008;
}

label{
  display:block;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.8px;
  margin:0 0 8px 4px;
}

input,select{
  width:100%;
  border:1px solid var(--line);
  outline:none;
  background:#090b0f;
  color:var(--txt);
  border-radius:15px;
  padding:14px;
  font-size:14px;
}

input:focus{
  border-color:var(--accent);
}

.row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
}

button{
  border:0;
  border-radius:15px;
  padding:13px 15px;
  background:var(--card2);
  color:var(--txt);
  font-weight:700;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.primary{
  background:var(--accent);
  color:#031108;
}

.orange{
  background:var(--accent2);
  color:#160b03;
}

.output{
  position:relative;
}

.output-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

.badge{
  font-size:10px;
  padding:5px 8px;
  border-radius:99px;
  background:#20252d;
  color:var(--muted);
}

pre{
  margin:0;
  white-space:pre-wrap;
  word-break:break-all;
  overflow:auto;
  background:#080a0d;
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px;
  color:#dce3ea;
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}

.fav{
  display:flex;
  gap:10px;
  align-items:center;
}

.fav-info{
  flex:1;
  min-width:0;
}

.fav-path{
  font:11px ui-monospace,monospace;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.fav-meta{
  margin-top:4px;
  color:var(--muted);
  font-size:10px;
}

.fav-actions{
  display:flex;
  gap:5px;
}

.small{
  padding:9px 10px;
  font-size:11px;
}

.empty{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  padding:18px 5px;
}

.switch{
  display:flex;
  gap:7px;
  margin-top:9px;
}

.switch button{
  flex:1;
  font-size:11px;
}

.active{
  outline:1px solid var(--accent);
  color:var(--accent);
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">🔗 KODUX <span>Link Forge</span></div>
  <div class="sub">Gerador rápido de links JS · CSS · @import · Infodose</div>
</header>

<div class="card">

  <label>Caminho</label>

  <div class="row">
    <input
      id="path"
      autocomplete="off"
      spellcheck="false"
      placeholder="/oiDual/KODUX/78K/APPS/78iFSw/dual-ifswin/js/modules/resize-handles.js"
    >
    <button class="primary" onclick="generate()">GERAR</button>
  </div>

  <div class="switch">
    <button id="httpsBtn" class="active" onclick="setMode('https')">
      HTTPS
    </button>
    <button id="pathBtn" onclick="setMode('path')">
      CAMINHO
    </button>
  </div>

</div>

<div id="outputs"></div>

<div class="card">

  <div class="output-title">
    <strong>⭐ Favoritos</strong>
    <button class="small" onclick="clearFavorites()">Limpar</button>
  </div>

  <div id="favorites"></div>

</div>

</div>

<script>
const HOST = "https://infodose.com.br";

const pathInput = document.getElementById("path");
const outputs = document.getElementById("outputs");
const favorites = document.getElementById("favorites");

let mode = localStorage.getItem("kodux-link-mode") || "https";

function normalizePath(value){
  value = value.trim();

  if(!value) return "";

  // Se o usuário colar uma URL completa,
  // extrai somente o pathname.
  try{
    if(value.startsWith("http://") || value.startsWith("https://")){
      value = new URL(value).pathname;
    }
  }catch(e){}

  if(!value.startsWith("/")){
    value = "/" + value;
  }

  return value;
}

function fullURL(path){
  return HOST + path;
}

function detectType(path){

  const clean = path.split("?")[0].toLowerCase();

  if(clean.endsWith(".js") || clean.endsWith(".mjs")){
    return "js";
  }

  if(clean.endsWith(".css")){
    return "css";
  }

  return "unknown";
}

function build(path){

  const type = detectType(path);
  const url = mode === "https" ? fullURL(path) : path;

  if(type === "js"){
    return [
      {
        title:"SCRIPT SRC",
        code:`<script src="${url}"><\/script>`
      }
    ];
  }

  if(type === "css"){
    return [
      {
        title:"STYLESHEET",
        code:`<link rel="stylesheet" href="${url}">`
      },
      {
        title:"@IMPORT",
        code:`@import url("${url}");`
      }
    ];
  }

  return [
    {
      title:"URL",
      code:url
    }
  ];
}

function generate(){

  const path = normalizePath(pathInput.value);

  if(!path){
    outputs.innerHTML = "";
    return;
  }

  pathInput.value = path;

  const items = build(path);

  outputs.innerHTML = items.map((item,index)=>`

    <div class="card output">

      <div class="output-title">
        <strong>${item.title}</strong>
        <span class="badge">${detectType(path).toUpperCase()}</span>
      </div>

      <pre id="code-${index}">${escapeHTML(item.code)}</pre>

      <div class="actions">
        <button class="primary"
          onclick="copyCode(${index})">
          📋 COPIAR
        </button>

        <button
          onclick="favorite()">
          ⭐ FAVORITAR
        </button>
      </div>

    </div>

  `).join("");

  window.currentItems = items;
  window.currentPath = path;
}

function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

async function copyCode(index){

  const code = window.currentItems?.[index]?.code;

  if(!code) return;

  try{
    await navigator.clipboard.writeText(code);
  }catch(e){

    const area = document.createElement("textarea");

    area.value = code;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();

  }

  const buttons = document.querySelectorAll(".actions button");

  if(buttons[index*2]){
    const old = buttons[index*2].textContent;
    buttons[index*2].textContent = "✓ COPIADO";

    setTimeout(()=>{
      buttons[index*2].textContent = old;
    },1000);
  }
}

function setMode(newMode){

  mode = newMode;

  localStorage.setItem(
    "kodux-link-mode",
    mode
  );

  document
    .getElementById("httpsBtn")
    .classList.toggle("active",mode==="https");

  document
    .getElementById("pathBtn")
    .classList.toggle("active",mode==="path");

  if(pathInput.value.trim()){
    generate();
  }
}

function getFavorites(){

  try{
    return JSON.parse(
      localStorage.getItem("kodux-link-favorites") || "[]"
    );
  }catch(e){
    return [];
  }

}

function saveFavorites(list){

  localStorage.setItem(
    "kodux-link-favorites",
    JSON.stringify(list)
  );

}

function favorite(){

  const path = window.currentPath;

  if(!path) return;

  const list = getFavorites();

  if(!list.some(x=>x.path===path)){

    list.unshift({
      path,
      type:detectType(path),
      created:Date.now()
    });

    saveFavorites(list);

  }

  renderFavorites();
}

function removeFavorite(path){

  const list = getFavorites()
    .filter(x=>x.path!==path);

  saveFavorites(list);

  renderFavorites();
}

function useFavorite(path){

  pathInput.value = path;
  generate();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function clearFavorites(){

  if(!confirm("Apagar todos os favoritos?")) return;

  localStorage.removeItem(
    "kodux-link-favorites"
  );

  renderFavorites();
}

function renderFavorites(){

  const list = getFavorites();

  if(!list.length){

    favorites.innerHTML = `
      <div class="empty">
        Nenhum link salvo ainda.
      </div>
    `;

    return;
  }

  favorites.innerHTML = list.map(item=>`

    <div class="card fav">

      <div class="fav-info">

        <div class="fav-path">
          ${escapeHTML(item.path)}
        </div>

        <div class="fav-meta">
          ${item.type.toUpperCase()} · Infodose
        </div>

      </div>

      <div class="fav-actions">

        <button
          class="small primary"
          onclick='useFavorite(${JSON.stringify(item.path)})'>
          USAR
        </button>

        <button
          class="small"
          onclick='removeFavorite(${JSON.stringify(item.path)})'>
          ×
        </button>

      </div>

    </div>

  `).join("");

}

pathInput.addEventListener("input",()=>{
  generate();
});

pathInput.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    generate();
  }
});

renderFavorites();

</script>

</body>
</html>
