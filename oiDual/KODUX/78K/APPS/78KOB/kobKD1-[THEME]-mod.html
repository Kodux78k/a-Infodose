.topbar {

.theme-dot {

        30px;
    height:
        30px;
    padding:
      0px;
    border:
        1px solid
        var(--border);
    border-radius:
        50%;
    background:
        var(--button-bg);
    color:
        var(--text);
    cursor:
        pointer;
    display:
        grid;
    place-items:
        center;
    transition:
        transform
        .2s ease,
        background
        var(--transition),
        border-color
        var(--transition),
        box-shadow
        var(--transition);

.theme-dot::before {
    content:
        "";
    width:
        10px;
    height:
        10px;
    border-radius:
        50%;

        var(--cyan);
    box-shadow:
        0 0 12px
        var(--cyan);
    transition:
        all
        var(--transition);
}
.theme-dot:hover {
    transform:
        scale(1.08);
    border-color:
        var(--cyan);
    box-shadow:
        0 0 20px
        color-mix(
            in srgb,
            var(--cyan) 20%,
            transparent

}

        ease,

        ease,

        ease;
}
/* ═══════════════════════════════════════════════════════
   HEADER COLLAPSE

═══════════════════════════════════════════════════════ */
#main-content.hidden {

        0;

        (function() {
            function syncBodyTheme() {
                const html = document.documentElement;
                const body = document.body;
                if (!body) return;
                body.dataset.arch = html.dataset.arch || "";
                const inline = html.style;
                for (let i = 0; i < inline.length; i++) {
                    const prop = inline[i];
                    if (prop.indexOf("--") === 0) {
                        body.style.setProperty(prop, inline.getPropertyValue(prop));
                    }
                }
            }
            syncBodyTheme();
            new MutationObserver(syncBodyTheme).observe(document.documentElement, {
                attributes: true,
