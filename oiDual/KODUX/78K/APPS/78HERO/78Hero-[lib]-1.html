<html lang="pt-BR">
<head>
    <meta charset="UTF-78">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>NEBULA PRO · Screen Panel</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
    <link rel="apple-touch-icon" href="https://www.infodose.com.br/oiDual/KODUX/78K/APPS/78HERO/icon-192.png">
    <link rel="manifest" href="https://www.infodose.com.br/oiDual/KODUX/78K/APPS/78HERO/manifest.json">
   
 <style>
@import url("https://www.infodose.com.br/oiDual/KODUX/78K/APPS/78HERO/css/main-v0000.css");
    </style>
</head>
<body>

<script src="https://www.infodose.com.br/oiDual/KODUX/78K/APPS/78HERO/js/modules/inline-1.js"></script>

<script src="https://www.infodose.com.br/oiDual/KODUX/78K/APPS/78HERO/js/modules/inline-1.js"></script>

    <script type="module" src="https://www.infodose.com.br/js/modules/Dual_[Theme].js"></script>

    <div class="dual-app">
        <header class="topbar header-visible" id="main-header">
            <div class="brand">
                <span>DUAL</span>
                <span class="badge">GLOBAL</span>
            </div>
            <button id="theme-dot" class="theme-dot" type="button" aria-label="Alternar tema" title="Alternar tema">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;">
                    <circle cx="12" cy="12" r="5"></circle>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                </svg>
            </button>
        </header>

        <main id="main-content">
            <div id="inject-here" class="content">
                <div class="app">
                   <!-- <header class="header">
                        <div class="brand">
                            <small>NEBULA LIBRARY</small>
                            <h1>Espaço da Mente</h1>
                        </div>
                        <div class="status"><span></span></div>
                    </header> -->

                    <!-- RECENT INTELLIGENCE HERO -->
                    <section class="hero" id="hero-section">
                        <div class="hero-header">
                            <h3 id="hero-title-label">Inteligência Recente</h3>
                            <div style="display: flex; gap: 6px; align-items: center;">
                                <button id="toggle-autoplay" class="btn-icon" style="width: 28px; height: 28px; font-size: 12px;" title="Pausar/Retomar Autoplay">⏸</button>
                                <button id="toggle-hero" class="btn-icon" style="width: 28px; height: 28px; font-size: 12px; transition: transform 0.3s;" title="Minimizar / Expandir Hero">▼</button>
                            </div>
                        </div>
                        
                        <div class="hero-groups" id="hero-groups">
                            <button class="group-pill active" data-group="recentes">Recentes</button>
                            <button class="group-pill" data-group="pdf">PDFs</button>
                            <button class="group-pill" data-group="html">HTML / WebFrames</button>
                            <button class="group-pill" data-group="markdown">Markdown</button>
                            <button class="group-pill" data-group="txt">TXT</button>
                            <button class="group-pill" data-group="favoritos">Favoritos</button>
                            <button class="group-pill" data-group="cortex">Cortex</button>
                        </div>

                        <div class="hero-carousel-wrap">
                            <div class="hero-carousel" id="hero-carousel"></div>
                            <div class="hero-dots" id="hero-dots"></div>
                        </div>
                    </section>

                    <section class="actions">
                        <button class="action primary" id="add-file">
                            <div class="action-icon">＋</div>
                            <div class="action-label">Adicionar</div>
                        </button>
                        <button class="action" id="search-file">
                            <div class="action-icon">⌕</div>
                            <div class="action-label">Buscar</div>
                        </button>
                        <button class="action" id="open-url">
                            <div class="action-icon">↗</div>
                            <div class="action-label">Abrir</div>
                        </button>
                    </section>

                    <div class="search-box" id="search-box">
                        <input type="text" id="search-input" placeholder="Buscar documentos...">
                    </div>

                    <section class="section">
                        <div class="section-head">
                            <h3>Biblioteca</h3>
                            <span>DESLIZE →</span>
                        </div>
                        <div class="carousel" id="recentes"></div>
                        <div class="dots" id="dots"></div>
                    </section>

                    <section class="section">
                        <div class="section-head">
                            <h3>Explorar</h3>
                            <span>COLEÇÃO</span>
                        </div>
                        <div class="carousel">
                            <article class="feature-slide">
                                <div class="tag">WEB-FRAMES INBOX</div>
                                <h3>Biblioteca Universal</h3>
                                <button id="feature-open">Explorar coleção →</button>
                            </article>
                            <article class="feature-slide">
                                <div class="tag">COLEÇÃO 02</div>
                                <h3>Projetos e arquivos recentes</h3>
                                <button>Ver arquivos →</button>
                            </article>
                            <article class="feature-slide">
                                <div class="tag">COLEÇÃO 03</div>
                                <h3>Conteúdo salvo no Cortex</h3>
                                <button>Abrir Cortex →</button>
                            </article>
                        </div>
                    </section>

                   <!-- <nav class="bottom-nav">
                        <button class="nav-item active"><span>⌂</span>Início</button>
                        <button class="nav-item"><span>▤</span>Biblioteca</button>
                        <button class="nav-item"><span>◉</span>Cortex</button>
                        <button class="nav-item"><span>⚙</span>Ajustes</button>
                    </nav> -->

                    <!-- PAINEL ARQUÉTIPOS -->
                    <div id="ciclo-painel" style="
                        margin: 20px 22px 0; padding: 16px 20px; border-radius: 16px;
                        background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.06);
                        display: flex; flex-wrap: wrap; gap: 8px 16px;
                        font-size: 10px; font-family: monospace;
                    ">
                        <span><span style="color:var(--accent);">∅ PASSO:</span> <span id="ciclo-passo" style="color:#fff;">01</span></span>
                        <span><span style="color:var(--accent);">⍟ ARQ:</span> <span id="ciclo-arq" style="color:#fff;">ATLAS</span></span>
                        <span><span style="color:var(--accent);">∅ PESO:</span> <span id="ciclo-peso" style="color:#fff;">0.180</span></span>
                        <span><span style="color:var(--accent);">∆:</span> <span id="ciclo-delta" style="color:#fff;">0.001</span></span>
                        <span><span style="color:var(--accent);">∅ EQUAÇÃO:</span> <span style="color:#888;">01→02→03→∆ⁿ</span></span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <input type="file" id="file-input" multiple="" accept=".txt,.md,.html,.pdf">

    <div class="reader" id="reader">
        <div class="reader-head">
            <div class="reader-title" id="reader-title">Título do Documento</div>
            <button class="reader-close" id="reader-close">×</button>
        </div>
        <div class="reader-body" id="reader-body"></div>
    </div>

    <script src="https://www.infodose.com.br/oiDual/KODUX/78K/APPS/78HERO/js/modules/nebula-unified.js"></script>

   <!-- <script src="https://www.infodose.com.br/oiDual/KODUX/78K/APPS/78HERO/js/modules/inline-1.js"></script> -->
</body>
</html>
