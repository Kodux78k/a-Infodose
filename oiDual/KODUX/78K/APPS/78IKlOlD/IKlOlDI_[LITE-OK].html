<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DUAL iCloud · Home Hero</title>
<style>
/* =========================================================
   CORE TOKENS (DUAL GLOBAL SYSTEM)[span_0](start_span)[span_0](end_span)
========================================================= */
:root {
    color-scheme: dark;
    --bg: #050507;
    --panel: rgba(18, 18, 22, .68);
    --text: #f5f5f7;
    --text-strong: #ffffff;
    --muted: rgba(255, 255, 255, .58);
    --border: rgba(255, 255, 255, .08);
    --glass-bg: rgba(255, 255, 255, .055);
    --glass-blur: 24px;
    --glass-saturate: 150%;
    --shadow: 0 20px 60px rgba(0, 0, 0, .28);
    --radius: 39px;
    --radius-small: 20px;
    --transition: .25s ease;
    
    /* Cores de Destaque */
    --accent: #22D3EE;
    --accent-glow: color-mix(in srgb, var(--accent) 20%, transparent);
}

/* Light Theme Overrides[span_1](start_span)[span_1](end_span) */
html[data-theme="light"] {
    color-scheme: light;
    --bg: #f5f5f7;
    --panel: rgba(255, 255, 255, .72);
    --text: #1c1c1e;
    --text-strong: #000000;
    --muted: rgba(28, 28, 30, .60);
    --border: rgba(0, 0, 0, .07);
    --glass-bg: rgba(255, 255, 255, .64);
    --shadow: 0 20px 60px rgba(0, 0, 0, .10);
    --accent: #007aff;
}

/* =========================================================
   GLOBAL RESET & BASE
========================================================= */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
    margin: 0; padding: 0; width: 100%; min-height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, system-ui, sans-serif;
    transition: background var(--transition), color var(--transition);
}

/* =========================================================
   SMART TOPBAR (DUAL)[span_2](start_span)[span_2](end_span)
========================================================= */
.topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: space-between;
    min-height: 56px; padding: 10px 16px;
    background: var(--glass-bg);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    transition: transform .32s cubic-bezier(.22, 1, .36, 1), opacity .25s ease;
}
.topbar.header-hidden { transform: translateY(calc(-100% - 12px)); opacity: .15; pointer-events: none; }
.topbar.header-visible { transform: translateY(0); opacity: 1; pointer-events: auto; }

.status-bar { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 14px; }
.theme-dot {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--glass-bg);
    color: var(--text); cursor: pointer; display: grid; place-items: center;
    transition: transform .2s ease;
}
.theme-dot:hover { transform: scale(1.08); box-shadow: 0 0 20px var(--accent-glow); }

/* =========================================================
   HERO & CONTENT (KODUX Integrado)[span_3](start_span)[span_3](end_span)
========================================================= */
#main-content { padding-top: 76px; width: 100%; min-height: 100vh; }
.content { width: min(900px, 100%); margin: 0 auto; padding: 20px 18px 120px; display: flex; flex-direction: column; gap: 24px; }

/* Glass Panel Base[span_4](start_span)[span_4](end_span) */
.glass-panel {
    background: var(--glass-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
    border: 1px solid var(--border);
    transition: transform .2s ease;
}

/* Home Hero Card[span_5](start_span)[span_5](end_span) */
.hero-card {
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 12%, transparent), transparent);
}
.hero-card::before {
    content: ""; position: absolute; top: -50px; left: -50px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, var(--accent), transparent 70%);
    opacity: 0.15; filter: blur(40px); pointer-events: none;
}

.avatar-large {
    width: 88px; height: 88px; border-radius: 50%; margin-bottom: 16px;
    background: radial-gradient(circle at 30% 30%, #333, #000);
    border: 2px solid var(--border); position: relative;
    animation: spin 6s linear infinite;
}
.avatar-large::after {
    content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 12px; height: 12px; background: var(--accent); border-radius: 50%;
}
@keyframes spin { to { transform: rotate(360deg); } }

.hero-title { font-size: 28px; font-weight: 700; margin: 0 0 4px; color: var(--text-strong); }
.hero-subtitle { color: var(--muted); font-size: 14px; margin-bottom: 16px; letter-spacing: 0.05em; }
.badge-icloud {
    padding: 6px 14px; border-radius: 99px; font-size: 11px; font-weight: 700;
    letter-spacing: 0.08em; color: var(--accent); background: var(--glass-bg);
    border: 1px solid var(--border); text-transform: uppercase;
}

/* App Grid UI[span_6](start_span)[span_6](end_span) */
.app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 10px 0; }
.app-item {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    background: none; border: none; cursor: pointer; color: var(--text);
}
.app-icon {
    width: 64px; height: 64px; border-radius: 20px;
    background: var(--glass-bg); border: 1px solid var(--border);
    display: grid; place-items: center; font-size: 30px;
    box-shadow: var(--shadow); transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.app-item:active .app-icon { transform: scale(0.9); }
.app-label { font-size: 12px; font-weight: 500; color: var(--muted); }

@media (max-width: 480px) {
    .app-icon { width: 56px; height: 56px; font-size: 26px; }
}
</style>
</head>
<body>

<div class="dual-app">
    <!-- Header Inteligente[span_7](start_span)[span_7](end_span) -->
    <header class="topbar header-visible" id="main-header">
        <div class="status-bar">
            <span id="clock">--:--</span>
            <span>KODUX Cloud</span>
        </div>
        <button id="theme-dot" class="theme-dot" type="button" aria-label="Alternar tema">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;">
                <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
        </button>
    </header>

    <!-- Conteúdo Principal[span_8](start_span)[span_8](end_span) -->
    <main id="main-content">
        <div class="content">
            
            <!-- Hero Unificado -->
            <section class="glass-panel hero-card">
                <div class="avatar-large"></div>
                <h1 class="hero-title">Espaço da Mente</h1>
                <p class="hero-subtitle">iCloud · VisionOS</p>
                <div class="badge-icloud">KOBLLUX · Toque para entrar</div>
            </section>

            <!-- Grid de Módulos (SPA Behavior Ready) -->
            <div class="app-grid">
                <button class="app-item">
                    <div class="app-icon" style="background:linear-gradient(to bottom, #22D3EE, #0a7ea4);">✦</div>
                    <span class="app-label">Nébula</span>
                </button>
                <button class="app-item">
                    <div class="app-icon" style="background:linear-gradient(to bottom, #7a57ff, #5cc6ff);">◈</div>
                    <span class="app-label">Grito Vivo</span>
                </button>
                <button class="app-item">
                    <div class="app-icon">📁</div>
                    <span class="app-label">Library</span>
                </button>
                <button class="app-item">
                    <div class="app-icon" style="background:#FF9500;">🎧</div>
                    <span class="app-label">Player</span>
                </button>
            </div>

        </div>
    </main>
</div>

<script type="module" src="https://www.infodose.com.br/js/modules/Dual_[Theme]-semDiv.js"></script>

<script>

    // ============================================================
    // RELÓGIO (Manipulação Segura de DOM)
    // ============================================================
    const clock = document.getElementById('clock');
    function updateClock() {
        if(!clock) return;
        const d = new Date();
        clock.textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }
    updateClock();
    setInterval(updateClock, 15000);
</script>
</body>
</html>
