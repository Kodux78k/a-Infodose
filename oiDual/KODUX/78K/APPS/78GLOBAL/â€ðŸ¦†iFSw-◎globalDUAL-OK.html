/* =========================================================
CORE TOKENS
========================================================= */

:root {

color-scheme:
    dark;
/* BASE */
--bg:
    #050507;
--bg-elevated:
    #0a0a0e;
--panel:
    rgba(18, 18, 22, .68);
--panel-solid:
    #121216;
--surface:
    rgba(255, 255, 255, .045);
--surface-hover:
    rgba(255, 255, 255, .08);
/* TEXTO */
--text:
    #f5f5f7;
--text-strong:
    #ffffff;
--muted:
    rgba(255, 255, 255, .58);
--subtle:
    rgba(255, 255, 255, .38);
/* BORDAS */
--border:
    rgba(255, 255, 255, .08);
--border-strong:
    rgba(255, 255, 255, .15);
/* INPUT */
--input-bg:
    rgba(255, 255, 255, .055);
--input-text:
    var(--text);
--placeholder:
    rgba(255, 255, 255, .35);
/* BUTTON */
--button-bg:
    rgba(255, 255, 255, .07);
--button-hover:
    rgba(255, 255, 255, .12);
--button-text:
    var(--text);
/* GLASS */
--glass-bg:
    rgba(255, 255, 255, .055);
--glass-border:
    rgba(255, 255, 255, .08);
--glass-blur:
    24px;
--glass-saturate:
    150%;
/* SHADOW */
--shadow:
    0 20px 60px
    rgba(0, 0, 0, .28);
/* GEOMETRIA */
--radius:
    39px;
--radius-small:
    20px;
/* SISTEMA */
--transition:
    .25s ease;

}

/* =========================================================
LIGHT MODE
========================================================= */

html[data-theme=“light”] {

color-scheme:
    light;
/* BASE CLARA */
--bg:
    #f5f5f7;
--bg-elevated:
    #ffffff;
/* GLASS CLARO */
--panel:
    rgba(255, 255, 255, .72);
--panel-solid:

--surface:

/* TEXTO */

--muted:

--subtle:

/* BORDAS */

--border-strong:

--input-bg:
    rgba(0, 0, 0, .035);
--input-text:
    #1c1c1e;
--placeholder:
    rgba(28, 28, 30, .38);
/* BUTTON */
--button-bg:
    rgba(0, 0, 0, .045);
--button-hover:
    rgba(0, 0, 0, .08);
--button-text:
    #1c1c1e;
/* GLASS */
--glass-bg:
    rgba(255, 255, 255, .64);
--glass-border:

transparent;

/* ═══════════════════════════════════════════════════════
   HEADER FLUTUANTE
   ═══════════════════════════════════════════════════════ */
.topbar {
    position:
        fixed;
    top:
        0;
    left:
        0;
    right:
        0;
  
    display:
        flex;
    align-items:
        center;
    justify-content:

transparent;

none;

none;

none;

        translateY(0);
    transition:
        transform
        .32s
        cubic-bezier(.22, 1, .36, 1),
        opacity
        .25s
        ease,
        background
        var(--transition),

        var(--transition);

/* ═══════════════════════════════════════════════════════
   HEADER ESCONDIDO DURANTE SCROLL DOWN
   ═══════════════════════════════════════════════════════ */
.topbar.header-hidden {
    transform:
        translateY(
            calc(-100% - 12px)
        );
    opacity:
        .15;
    pointer-events:
        none;
}
/* ═══════════════════════════════════════════════════════
   HEADER VISÍVEL
   ═══════════════════════════════════════════════════════ */
.topbar.header-visible {
    transform:
        translateY(0);
    opacity:
        1;
    pointer-events:
        auto;
}

}
/* ═══════════════════════════════════════════════════════
   THEME DOT
   UMA ÚNICA BOLINHA
   ═══════════════════════════════════════════════════════ */
.theme-dot {
    position:
        relative;
    width:
        30px;
    height:
        30px;
    padding:
        0;
    border:
        1px solid
        var(--border);
    border-radius:
        50%;
    background:
        var(--button-bg);
    color:
        var(--text);
    cursor:
        pointer;
    display:
        grid;
    place-items:
        center;
    transition:
        transform
        .2s ease,
        background
        var(--transition),
        border-color
        var(--transition),
        box-shadow
        var(--transition);
}
.theme-dot::before {
    content:
        "";
    width:
        10px;
    height:
        10px;
    border-radius:
        50%;
    background:
        var(--cyan);
    box-shadow:
        0 0 12px
        var(--cyan);
    transition:
        all
        var(--transition);
}
.theme-dot:hover {
    transform:
        scale(1.08);
    border-color:
        var(--cyan);
    box-shadow:
        0 0 20px
        color-mix(
            in srgb,
            var(--cyan) 20%,
            transparent
        );
}
/* ═══════════════════════════════════════════════════════

/* ═══════════════════════════════════════════════════════

/* ═══════════════════════════════════════════════════════
   2º BLOCO
   BASE (V10) + componentes Almasliber + Hero
   ═══════════════════════════════════════════════════════ */

    /* ===== BASE (V10) ===== */
    :root {
      --bg: #fff;
      --card: #fff;
      --ink: #14151b;
      --muted: #777b88;
      --line: #e5e6ed;
      --soft: #f0f1f6;
      --primary: #8a55ff;
      --primary-2: #c77cff;
      --success: #31c875;
      --warning: #f5a400;
      --danger: #e94b65;
      --dark: #0b0b12;
      --dark-2: #151420;
      --radius: 29px;
      --shadow: 0 18px 55px rgba(25, 18, 55, .09);
    }

    /* Tema escuro */
    .theme-dark {
      --bg: #12121a;
      --card: #1e1e28;
      --ink: #ececf0;
      --muted: #9a9aa8;
      --line: #2c2c3a;
      --soft: #2a2a36;
      --primary: #a78bfa;
      --primary-2: #c4b5fd;
      --shadow: 0 18px 55px rgba(0, 0, 0, .5);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background .3s, color .3s;
    }

    button {
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .almasliber {
      width: 100%;
      min-height: 100vh;
      padding: max(12px, env(safe-area-inset-top)) 12px calc(92px + env(safe-area-inset-bottom));
    }

    .shell {
      width: min(100vw, 100%);
      margin: auto;
    }

    /* ===== TOPBAR ===== */
    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, .88);
      display: grid;
      place-items: center;
      color: var(--ink);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .04);
      font-size: 20px;
      line-height: 1;
      transition: background .2s;
    }

    .icon-btn:hover {
      background: var(--soft);
    }

    .brand {
      font-weight: 950;
      letter-spacing: -.055em;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand span {
      color: #858896;
    }

    /* mini orb na topbar */
    .mini-orb-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
    }

    .mini-orb-wrap .dual-orb-wrap {
      --orb-size: 32px;
    }

    /* ===== COMMON ===== */
    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
      transition: background .3s, border-color .3s, box-shadow .3s;
    }

    .section {
      margin-top: 16px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 4px 13px;
    }

    .section-title {
      margin: 0;
      font-size: 19px;
      letter-spacing: -.035em;
    }

    .section-link {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
      font-size: 13px;
      padding: 8px 2px;
      cursor: pointer;
      transition: color .2s;
    }

    .section-link:hover {
      color: var(--primary);
    }

    /* ===== HERO (PERFIL) ===== */
    .hero {
      position: relative;
      overflow: hidden;
      min-height: 430px;
      padding: 26px 20px 20px;
      color: #fff;
      background:
        radial-gradient(circle at 78% 18%, rgba(190, 112, 255, .58), transparent 22%),
        radial-gradient(circle at 22% 38%, rgba(121, 62, 255, .28), transparent 30%),
        linear-gradient(145deg, #080813 0%, #121021 48%, #090911 100%);
    }

    .hero:before {
      content: "";
      position: absolute;
      width: 360px;
      height: 360px;
      right: -150px;
      top: -120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(180, 100, 255, .34), transparent 64%);
      filter: blur(12px);
    }

    .hero:after {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      left: -120px;
      bottom: -130px;
      border-radius: 50%;
      background: rgba(123, 67, 255, .22);
      filter: blur(25px);
    }

    .hero>* {
      position: relative;
      z-index: 1;
    }

    .hero-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hero-actions-right {
      display: flex;
      gap: 8px;
    }

    .hero .icon-btn {
      color: #fff;
      background: rgba(255, 255, 255, .08);
      border-color: rgba(255, 255, 255, .14);
      box-shadow: none;
      backdrop-filter: blur(14px);
    }

    .avatar-wrap {
      width: 126px;
      height: 126px;
      margin: 18px auto 10px;
      padding: 4px;
      border-radius: 50%;
      background: conic-gradient(#b879ff, #fff, #7c42ff, #b879ff);
      box-shadow: 0 0 35px rgba(155, 75, 255, .6);
    }

    .avatar-wrap .dual-orb-wrap {
      --orb-size: 118px;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      display: block;
      background: #08080d;
    }

    .online {
      position: absolute;
      right: 4px;
      bottom: 9px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--success);
      border: 3px solid #12101d;
      z-index: 2;
    }

    .hero-center {
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 999px;
      background: rgba(255, 255, 255, .07);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .hero h1 {
      margin: 10px 0 1px;
      font-size: 34px;
      line-height: 1;
      letter-spacing: -.065em;
    }

    .verified {
      display: inline-grid;
      place-items: center;
      width: 19px;
      height: 19px;
      margin-left: 4px;
      border-radius: 50%;
      background: var(--primary);
      font-size: 11px;
      vertical-align: middle;
    }

    .handle {
      color: #b9b7c4;
      font-size: 14px;
    }

    .bio {
      max-width: 430px;
      margin: 13px auto 0;
      color: #d6d3df;
      font-size: 13px;
      line-height: 1.5;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-top: 22px;
    }

    .stat {
      min-width: 0;
      padding: 13px 8px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, .12);
      background: rgba(255, 255, 255, .06);
      backdrop-filter: blur(14px);
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 21px;
      letter-spacing: -.04em;
    }

    .stat span {
      font-size: 10px;
      color: #bbb9c5;
    }

    #main-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: var(--header-height);
      padding: 10px 18px;
      background: var(--topbar-bg);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
      transition: transform var(--transition), opacity var(--transition);
    }
    #main-header.header-hidden {
      transform: translateY(calc(-100% - 12px));
      opacity: .12;
      pointer-events: none;
    }
    #main-header.header-visível {
      transform: translateY(0);
      opacity: .7021;
      pointer-events: auto;
      mix-blend-mode: screen;
    }

      color: var(--muted);
      font-size: 10px;
      letter-spacing: .08em;
      font-weight: 600;
    }
    .theme-dot {
      position: relative;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--button-bg);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform .2s ease, background var(--transition), border-color var(--transition), box-shadow var(--transition);
      flex-shrink: 0;
    }
    .theme-dot svg {
      width: 16px;
      height: 16px;
      stroke: var(--text);
      transition: stroke var(--transition);
    }
    .theme-dot:hover {
      transform: scale(1.08);
      border-color: var(--cyan);
      box-shadow: 0 0 20px color-mix(in srgb, var(--cyan) 20%, transparent);

<script src="https://kodux78k.github.io/a-Infodose/js/modules/iFSw-base.js"></script>

<!-- ═══════════════════════════════════════════════════════
     PONTE DE TEMA (override-first, roda por último)
     Antes existiam DOIS sistemas de tema desencontrados:
       1) #theme-dot (SVG) → data-theme no <html>, via
          Dual_[Theme]-minuz.js — esse é o principal e já
          funciona certinho.
       2) #themeToggle (🌙) → classe .theme-dark no <body> +
          localStorage('theme') — um sistema paralelo que não
          mexia em nenhum token realmente usado na tela.
     Agora o #themeToggle só repassa o clique pro #theme-dot,
     então os dois botões acabam controlando o MESMO tema real,
     sem lógica duplicada e sem risco de dessincronizar.
     ═══════════════════════════════════════════════════════ -->

<script>
  (function () {
    var canonBtn = document.getElementById('theme-dot');
    var themeToggleBtn = document.getElementById('themeToggle');

    if (!canonBtn) return;

    // Qualquer .theme-dot redireciona para o botão canônico
    document.addEventListener('click', function (e) {
      var trigger = e.target.closest('.theme-dot');

      if (trigger && trigger !== canonBtn) {
        canonBtn.click();
      }
    });

    // Botão externo #themeToggle também redireciona
    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', function () {
        canonBtn.click();
      });

      // Espelha o emoji conforme o data-theme real
      var syncIcon = function () {
        var t = document.documentElement.getAttribute('data-theme') || 'dark';
        themeToggleBtn.textContent = t === 'light' ? '☀️' : '🌙';
      };

      syncIcon();

      new MutationObserver(syncIcon).observe(
        document.documentElement,
        {
          attributes: true,
          attributeFilter: ['data-theme']
        }
      );
    }
  })();
</script>
