  <style>
    :root{
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);

      --os-bg:#080808;
      --os-panel:rgba(30,30,30,.72);
      --os-glass:rgba(255,255,255,.07);
      --os-border:rgba(255,255,255,.10);
      --os-text:#f5f5f5;
      --os-muted:#9ca3af;
      --os-blue:#0A84FF;
      --os-purple:#a855ff;
      --os-green:#23ac51;
      --os-orange:#f97316;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,
    body{
      width:100%;
      height:100%;
      overflow:hidden;
    }

    body{
      background:var(--os-bg);
      color:var(--os-text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    button,
    input,
    textarea{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    ::-webkit-scrollbar{
      display:none;
    }

    .glass{
      background:rgba(0,0,0,.18);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }

    .glass-panel{
      background:rgba(40,40,40,.25);
      border:1px solid var(--os-border);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
    }

    /* =========================================================
       APP VIEWS
       ========================================================= */

    .app-view{
      position:absolute;
      inset:0;

      transition:
        transform .3s cubic-bezier(.25,.8,.25,1),
        opacity .3s ease;

      transform:scale(.96) translateY(18px);
      opacity:0;

      pointer-events:none;
      overflow:hidden;
    }

    .app-view.active{
      transform:scale(1) translateY(0);
      opacity:1;
      pointer-events:auto;
    }

    /* =========================================================
       BOOT
       ========================================================= */

    #boot-screen{
      position:absolute;
      inset:0;
      z-index:9000;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;

      background:var(--os-bg);

      transition:opacity .7s ease;
    }

    #boot-progress-wrap{
      margin-top:32px;
      width:192px;
      height:4px;

      background:#1f2937;
      border-radius:99px;
      overflow:hidden;
    }

    #boot-progress{
      height:100%;
      width:0;

      background:#fff;

      transition:width .3s ease;
    }

    /* =========================================================
       HOME
       ========================================================= */

    #home-screen{
      position:absolute;
      inset:0;

      z-index:1;

      display:flex;
      flex-direction:column;

      padding:
        calc(70px + var(--safe-top))
        24px
        calc(96px + var(--safe-bottom));

      background:var(--os-bg);

      overflow-y:auto;
    }

    .grid-apps{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:28px 16px;
    }

    .app-tile{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
    }

    .app-icon{
      width:64px;
      height:64px;

      display:grid;
      place-items:center;

      border-radius:18px;

      font-size:30px;
      color:#fff;

      box-shadow:0 8px 20px rgba(0,0,0,.4);

      transition:transform .15s ease;
    }

    .app-tile:active .app-icon{
      transform:scale(.9);
    }

    .app-name{
      font-size:11px;
      color:#e5e7eb;
    }

    /* =========================================================
       TOPBAR
       ========================================================= */

    .topbar{
      display:flex;
      align-items:center;
      gap:12px;

      padding:
        12px
        16px
        12px;

      padding-top:
        calc(12px + var(--safe-top));
    }

    /* =========================================================
       BUTTONS
       ========================================================= */

    .btn{
      border:none;

      background:rgba(255,255,255,.10);
      color:#fff;

      padding:8px 12px;
      border-radius:10px;

      font-size:12px;
    }

    .btn:active{
      background:rgba(255,255,255,.2);
    }

    .btn-primary{
      border:none;

      background:var(--os-blue);
      color:#fff;

      border-radius:12px;
      padding:10px 16px;

      font-weight:700;
    }

    /* =========================================================
       DOCK / SYMBOL BAR
       ========================================================= */

    .dock-nav{
      position:absolute;
      bottom:0;
      left:0;

      width:100%;

      z-index:500;

      padding:
        0
        16px
        var(--safe-bottom);

      pointer-events:none;
    }

    .dock-nav-inner{
      margin:0 auto;

      max-width:360px;
      height:64px;

      display:flex;
      align-items:center;
      justify-content:space-around;

      padding:0 8px;

      border-radius:28px;

      pointer-events:auto;
    }

    .icon-btn{
      width:48px;
      height:48px;

      border:0;
      border-radius:16px;

      display:grid;
      place-items:center;

      color:#9ca3af;
      background:transparent;

      font-size:22px;
    }

    .icon-btn:active{
      background:rgba(255,255,255,.10);
      color:#fff;
    }

    /* =========================================================
       BROWSER
       ========================================================= */

    .browser-topbar{
      display:flex;
      align-items:center;
      gap:10px;

      padding:
        8px
        12px
        8px;

      padding-top:
        calc(8px + var(--safe-top));
    }

    .address{
      flex:1;

      display:flex;
      align-items:center;

      background:rgba(255,255,255,.10);

      border-radius:12px;

      padding:8px 10px;
    }

    .address input{
      width:100%;

      border:0;
      outline:0;

      background:transparent;

      color:#fff;

      font-size:13px;
    }

    .tab-badge{
      width:34px;
      height:34px;

      border:0;
      border-radius:10px;

      display:grid;
      place-items:center;

      color:#fff;
      background:rgba(255,255,255,.10);

      font-size:11px;
      font-weight:800;
    }

    #iframe-container{
      position:relative;
      flex:1;

      background:#111;
    }

    #iframe-container iframe{
      width:100%;
      height:100%;

      border:0;

      background:var(--os-bg);
    }

    /* =========================================================
       TABS
       ========================================================= */

    #tab-switcher{
      z-index:700;

      background:rgba(0,0,0,.30);

      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);

        calc(64px + var(--safe-top))
        16px
        calc(96px + var(--safe-bottom));
    }

    #tabs-grid{
      display:grid;

      grid-template-columns:1fr 1fr;

      gap:16px;

      overflow-y:auto;
    }

    /* =========================================================
       NOTES
       ========================================================= */

    #app-notes{
      background:#111;
    }

    .notes-toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:8px;

      padding:
        10px
        12px;

      padding-top:
        calc(10px + var(--safe-top));
    }

    .notes-body{
      flex:1;

      display:flex;
      flex-direction:column;

      overflow:hidden;
    }

    #notes-content{
      flex:1;

      width:100%;

      border:0;
      outline:0;
      resize:none;

      padding:24px;

      color:#e5e7eb;

      font-size:17px;
      line-height:1.6;

      font-family:

        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,

    }

    #notes-preview{

      flex:1;

      overflow-y:auto;

      padding:24px;

      line-height:1.65;
    }

    #notes-preview.active{
      display:block;
    }

    /* =========================================================
       PLUGINS
       ========================================================= */

    #app-plugins{
      background:#050505;
    }

    #plugins-list{
      flex:1;

      overflow-y:auto;

      padding:16px;
    }

    .plugin-card{
      padding:14px;

      border-radius:16px;

      margin-bottom:10px;

      border:1px solid var(--os-border);
    }

    /* =========================================================
       CDN MANAGER
       ========================================================= */

    .cdn-section{
      padding:16px;
      overflow-y:auto;
    }

    .cdn-input{
      width:100%;

      border:1px solid var(--os-border);

      background:rgba(0,0,0,.35);

      color:#fff;

      outline:0;

      padding:12px;

      border-radius:12px;
    }

    .cdn-item{

      display:flex;

      justify-content:space-between;

    }

    /* =========================================================
       POPUP
       ========================================================= */

    #popup-layer{
      position:absolute;
      inset:0;

      z-index:2000;

      display:none;

      align-items:center;
      justify-content:center;

      padding:24px;

      background:rgba(0,0,0,.65);

      opacity:0;

      transition:opacity .3s ease;
    }

    #popup-box{

    }

    /* =========================================================

      right:0;
      bottom:0;

      overflow:auto;
      padding:14px;
      border-radius:12px;
      background:#050505;
    }

    .markdown ul{
      padding-left:24px;
    }
  </style>
</head>

<!-- =========================================================
     KODUX OS KERNEL
     ========================================================= -->

<script>
(() => {

  "use strict";


  /* =========================================================
     CORE
     ========================================================= */

  const OS = {

    version:"2.0.0",

    state:{
      activeApp:"home",
      booted:false
    },


    /* =======================================================
       STORAGE
       ======================================================= */

    Storage:{

      prefix:"kodux_os_",

      save(key,value){
        try{
          localStorage.setItem(
            this.prefix + key,
            JSON.stringify(value)
          );
        }catch(e){
          console.warn("Storage save:",e);
        }
      },

      load(key, fallback=null){
        try{

          const raw =
            localStorage.getItem(
              this.prefix + key
            );

          return raw
            ? JSON.parse(raw)
            : fallback;

        }catch(e){
          return fallback;
        }
      },

      remove(key){
        localStorage.removeItem(
          this.prefix + key
        );
      }

    },


    /* =======================================================
       EVENT BUS
       ======================================================= */

    Bus:{

      events:{},

      on(name,fn){

        if(!this.events[name])
          this.events[name]=[];

        this.events[name].push(fn);

      },

      emit(name,data){

        (this.events[name]||[])
          .forEach(fn => {
            try{
              fn(data);
            }catch(e){
              console.error(
                "OS.Bus:",
                name,
                e
              );
            }
          });

      }

    },

    /* =======================================================
       TAB ENGINE
       ======================================================= */

    TabEngine:{

      tabs:[],
      activeTabId:null,

      init(){

        this.tabs =
          OS.Storage.load(
            "tabs",
            []
          );

        if(!this.tabs.length){

          this.createTab();

        }else{

          this.activeTabId =
            this.tabs[0].id;

          this.renderActiveTab();

        }

        this.updateUI();

      },

      createTab(url=""){

        const id =
          "tab_"+Date.now();

        this.tabs.push({

          id,
          url,
          title:"Nova Aba"

        });

        this.activeTabId=id;

        this.saveState();

        this.renderActiveTab();

        this.updateUI();

        OS.UI.openApp("browser");

      },

      newTab(){
        this.createTab();
      },

      closeTab(id){

        this.tabs =
          this.tabs.filter(
            tab=>tab.id!==id
          );

        const iframe =
          document.getElementById(
            "iframe_"+id
          );

        if(iframe)
          iframe.remove();

        if(!this.tabs.length){

          this.createTab();

          return;

        }

        if(this.activeTabId===id){

          this.activeTabId =
            this.tabs[
              this.tabs.length-1
            ].id;

        }

        this.saveState();
        this.renderActiveTab();
        this.renderSwitcherGrid();
        this.updateUI();

      },

      switchTab(id){

        this.activeTabId=id;

        this.renderActiveTab();

        this.hideTabSwitcher();

        this.updateUI();

      },

      saveState(){

        OS.Storage.save(
          "tabs",
          this.tabs
        );

      },

      renderActiveTab(){

        const container =
          document.getElementById(
            "iframe-container"
          );

        const empty =
          document.getElementById(
            "browser-empty-state"
          );

        const address =
          document.getElementById(
            "address-bar"
          );

        container
          .querySelectorAll("iframe")
          .forEach(frame=>{
            frame.style.display="none";
          });

        const tab =
          this.tabs.find(
            t=>t.id===this.activeTabId
          );

        if(!tab)
          return;

        address.value=tab.url||"";

        if(!tab.url){

          empty.style.display="flex";

          return;

        }

        empty.style.display="none";

        let iframe =
          document.getElementById(
            "iframe_"+tab.id
          );

        if(!iframe){

          iframe =
            document.createElement(
              "iframe"
            );

          iframe.id=
            "iframe_"+tab.id;

          iframe.sandbox=
            "allow-scripts allow-same-origin allow-forms allow-popups";

          iframe.src=tab.url;

          iframe.onload=()=>{

            try{

              tab.title =
                iframe.contentDocument.title
                ||
                tab.url;

            }catch{

              tab.title =
                tab.url
                  .replace(
                    /^https?:\/\//,
                    ""
                  )
                  .split("/")[0];

            }

            this.saveState();

          };

          container.appendChild(
            iframe
          );

        }

        iframe.style.display="block";

      },

      updateActiveTabUrl(url){

        const tab =
          this.tabs.find(
            t=>t.id===this.activeTabId
          );

        if(!tab)
          return;

        tab.url=url;
        tab.title=url;

        const iframe =
          document.getElementById(
            "iframe_"+tab.id
          );

        if(iframe)
          iframe.remove();

        this.saveState();

        this.renderActiveTab();

      },

      updateUI(){

        const counter =
          document.getElementById(
            "tab-count"
          );

        if(counter)
          counter.textContent=
            this.tabs.length;

      },

      showTabSwitcher(){

        this.renderSwitcherGrid();

        const view =
          document.getElementById(
            "tab-switcher"
          );

        view.classList.add("active");

      },

      hideTabSwitcher(){

        document
          .getElementById(
            "tab-switcher"
          )
          .classList.remove("active");

      },

      renderSwitcherGrid(){

        const grid =
          document.getElementById(
            "tabs-grid"
          );

        grid.innerHTML="";

        this.tabs.forEach(tab=>{

          const card =
            document.createElement(
              "div"
            );

          card.className=
            "glass-panel";

          card.style.cssText=`
            border-radius:16px;
            padding:12px;
            height:160px;
            display:flex;
            flex-direction:column;
            position:relative;
          `;

          if(
            tab.id===
            this.activeTabId
          ){

            card.style.outline=
              "2px solid var(--os-blue)";

          }

          card.innerHTML=`

            <div
              style="
                display:flex;
                justify-content:space-between;
              "
            >

              <strong
                style="
                  font-size:11px;
                  overflow:hidden;
                  text-overflow:ellipsis;
                  white-space:nowrap;
                "
              >
                ${tab.title||"Nova Aba"}
              </strong>

              <button
                class="btn"
                data-close
              >
                ×
              </button>

            </div>

            <button
              data-open
              style="
                flex:1;
                margin-top:8px;
                border:0;
                border-radius:12px;
                background:rgba(255,255,255,.05);
                color:#fff;
                font-size:28px;
              "
            >
              ◍
            </button>

          `;

          card
            .querySelector("[data-close]")
            .onclick=()=>{
              this.closeTab(tab.id);
            };

          card
            .querySelector("[data-open]")
            .onclick=()=>{
              this.switchTab(tab.id);
            };

          grid.appendChild(card);

        });

      }

    },

      init(){

      save(){

        const value =
          document

              "notes-content"
            )
            .value;

        OS.Storage.save(
          "notes",
          value
        );

        OS.Bus.emit(
          "notes:save",
          value
        );

        OS.Popup.show(
          "Notas",
          "Documento salvo localmente."
        );

      },

      togglePreview(){

        const editor =
          document.getElementById(
            "notes-content"
          );

        const preview =
          document.getElementById(
            "notes-preview"
          );

        if(
          preview.classList.contains(
            "active"
          )
        ){

          preview.classList.remove(
            "active"
          );

          editor.style.display="block";

          return;

        }

        preview.innerHTML =
          this.markdown(
            editor.value
          );

        preview.classList.add(
          "active"
        );

        editor.style.display="none";

      },

      markdown(text){

        let html =
          String(text||"")
            .replace(
              /&/g,
              "&amp;"
            )
            .replace(
              /</g,
              "&lt;"
            )
            .replace(
              />/g,
              "&gt;"
            );

        html =
          html.replace(
            /^### (.*)$/gm,
            "<h3>$1</h3>"
          );

        html =
          html.replace(
            /^## (.*)$/gm,
            "<h2>$1</h2>"
          );

        html =
          html.replace(
            /^# (.*)$/gm,
            "<h1>$1</h1>"
          );

        html =
          html.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
          );

        html =
          html.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
          );

        html =
          html.replace(
            /^- (.*)$/gm,
            "<li>$1</li>"
          );

        html =
          html.replace(
            /(<li>.*<\/li>)/gs,
            "<ul>$1</ul>"
          );

        html =
          html.replace(
            /\n\n/g,
            "</p><p>"
          );

        return "<p>"+html+"</p>";

      }

    },

    /* =======================================================
       CDN ENGINE
       ======================================================= */

    CDN:{

      list:[],

      init(){

        this.list =
          OS.Storage.load(
            "cdn",
            []
          );

        this.render();

      },

      loadJS(url){

        return new Promise(
          (resolve,reject)=>{

            if(
              document.querySelector(
                `script[data-os-cdn="${url}"]`
              )
            ){

              resolve();

              return;

            }

            const script =
              document.createElement(
                "script"
              );

            script.src=url;

            script.dataset.osCdn=url;

            script.onload=()=>{

              OS.Bus.emit(
                "cdn:loaded",
                {
                  type:"js",
                  url
                }
              );

              resolve();

            };

            script.onerror=reject;

            document.head.appendChild(
              script
            );

          }
        );

      },

      loadCSS(url){

        if(
          document.querySelector(
            `link[data-os-cdn="${url}"]`
          )
        )
          return;

        const link =
          document.createElement(
            "link"
          );

        link.rel="stylesheet";

        link.href=url;

        link.dataset.osCdn=url;

        document.head.appendChild(
          link
        );

        OS.Bus.emit(
          "cdn:loaded",
          {
            type:"css",
            url
          }
        );

      },

      detect(url){

        const clean =
          url.toLowerCase();

        if(
          /\.css(?:\?|#|$)/.test(clean)
        )
          return "css";

        if(
          /\.m?js(?:\?|#|$)/.test(clean)
        )
          return "js";

        if(
          clean.includes("unpkg.com") ||
          clean.includes("jsdelivr.net") ||
          clean.includes("cdnjs.com")
        )
          return "js";

        return "unknown";

      },

      add(url,type){

        const detected =
          type||
          this.detect(url);

        if(
          detected==="unknown"
        ){

          OS.Popup.show(
            "CDN",
            "Não consegui identificar o tipo automaticamente."
          );

          return;

        }

        const item={

          id:"cdn_"+Date.now(),

          url,

          type:detected,

          active:true

        };

        this.list.push(item);

        OS.Storage.save(
          "cdn",
          this.list
        );

        if(detected==="js")
          this.loadJS(url);

        if(detected==="css")
          this.loadCSS(url);

        this.render();

      },

      remove(id){

        this.list =
          this.list.filter(
            x=>x.id!==id
          );

        OS.Storage.save(
          "cdn",
          this.list
        );

        this.render();

      },

              }

            }

          ]

      },

      render(){

              onClick:()=>OS.Popup.hide()
            },

            {
              text:"Criar",
              primary:true,

              onClick:()=>{

                const title =
                  document.getElementById(
                    "lib-title"
                  ).value;

                const type =
                  document.getElementById(
                    "lib-type"
                  ).value;

                if(!title)
                  return;

                this.items.unshift({

                  id:"doc_"+Date.now(),

                  title,

                  type,

                  created:
                    new Date().toISOString()

                });

                OS.Storage.save(
                  "library",
                  this.items
                );

                this.render();

                OS.Popup.hide();

              }

            }

          ]
        );

      },

      render(){

        const list =
          document.getElementById(
            "library-list"
          );

        list.innerHTML="";

        if(!this.items.length){

          list.innerHTML=`

            <div
              style="
                text-align:center;
                padding:40px;
                color:#6b7280;
              "
            >
              <div style="font-size:42px">
                📚
              </div>

              <p style="margin-top:10px">
                Library vazia.
              </p>

            </div>

          `;

          return;

        }

        this.items.forEach(item=>{

          const card =
            document.createElement(
              "article"
            );

          card.className=
            "glass-panel";

          card.style.cssText=`
            padding:16px;
            border-radius:16px;
            margin-bottom:10px;
          `;

          card.innerHTML=`

            <div
              style="
                display:flex;
                align-items:center;
                gap:12px;
              "
            >

              <div
                style="
                  width:42px;
                  height:42px;
                  border-radius:12px;
                  display:grid;
                  place-items:center;
                  background:rgba(255,255,255,.08);
                "
              >
                ${item.type==="markdown"
                  ?"◇"
                  :item.type==="link"
                  ?"↗"
                  :"▤"}
              </div>

              <div>

                <strong>
                  ${item.title}
                </strong>

                <div
                  style="
                    font-size:10px;
                    color:#9ca3af;
                    margin-top:4px;
                  "
                >
                  ${item.type}
                </div>

              </div>

            </div>

          `;

          list.appendChild(card);

        });

      }

    },


    /* =======================================================
       SYMBOL BAR BRIDGE
       ======================================================= */

    SymbolBar:{

      init(){

        /*
          Aqui entra sua Symbol Bar existente.

          A regra é:

          SymbolBar -> OS.Bus -> qualquer módulo.

          Assim a Symbol Bar não precisa conhecer
          Browser, Notes, Library ou Plugins.
        */

        document.addEventListener(
          "click",
          event=>{

            const button =
              event.target.closest(
                ".symbol-button,[data-os-action]"
              );

            if(!button)
              return;

            const action =
              button.dataset.osAction;

            if(!action)
              return;

            this.dispatch(action,button);

          }
        );

      },

      dispatch(action,element){

        OS.Bus.emit(
          "symbol:action",
          {
            action,
            element
          }
        );

        switch(action){

          case "home":
            OS.UI.goHome();
            break;

          case "browser":
            OS.UI.openApp("browser");
            break;

          case "library":
            OS.UI.openApp("library");
            break;

          case "notes":
            OS.UI.openApp("notes");
            break;

          case "plugins":
            OS.UI.openApp("plugins");
            break;

          case "cdn":
            OS.UI.openApp("cdn");
            break;

        }

      }

    },


    /* =======================================================
       BOOT
       ======================================================= */

    boot(){

      const bar =
        document.getElementById(
          "boot-progress"
        );

      let progress=0;

      const timer =
        setInterval(()=>{

          progress +=
            Math.random()*24;

          if(progress>=100){

            progress=100;

            clearInterval(timer);

            setTimeout(
              ()=>this.finishBoot(),
              350
            );

          }

          bar.style.width=
            progress+"%";

        },100);

    },

    finishBoot(){

      this.UI.buildHome();

      this.TabEngine.init();

      this.Notes.init();

      this.Plugins.init();

      this.CDN.init();

      this.Library.init();

      this.SymbolBar.init();

      this.state.booted=true;

      const boot =
        document.getElementById(
          "boot-screen"
        );

      boot.style.opacity="0";

      setTimeout(()=>{
        boot.remove();
      },700);

      this.Bus.emit(
        "os:ready",
        this
      );

    }

  };


  /* =========================================================
     GLOBAL BRIDGE
     ========================================================= */

  window.OS=OS;

  /*
    Qualquer módulo externo agora pode fazer:

      OS.UI.openApp("notes")

      OS.CDN.add(url)

      OS.Plugins.register(...)

      OS.Bus.emit("evento",dados)

      OS.Bus.on("evento",fn)

      OS.Storage.save("chave",dados)

    Sem criar outro sistema global.
  */


  window.addEventListener(
    "load",
    ()=>OS.boot()
  );


})();
</script>
