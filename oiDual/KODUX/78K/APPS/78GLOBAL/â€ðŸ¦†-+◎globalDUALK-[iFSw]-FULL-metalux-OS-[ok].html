<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb">
  <title>Almasliber · KODUX — Fusão de Abas</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- ====== ESTILOS ALMASLIBER (core) + KODUX (abas) ====== -->
  <style id="ifsw-unified-core">
    /* =========================================================
       ALMASLIBER / iFSw — UNIFIED CORE (base)
       ========================================================= */
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);

      --topbar-h: 58px;
      --header-h: 52px;

      --session-radius: 29px;
      --session-gap: 20px;

      --collapsed-h: 52px;
      --peek-h: 178px;

      --resize-hit: 0px;
      --resize-corner: 54px;

      --dock-bottom-gap: 80px;
      --dock-offset-x: -12px;

      --z-base: 1;
      --z-content: 100;
      --z-header-system: 900;
      --z-header-main: 910;
      --z-session: 1000;
      --z-session-header: 1010;
      --z-session-controls: 1020;
      --z-maximized: 94000;
      --z-maximized-header: 94010;
      --z-maximized-controls: 94020;
      --z-resize: 94030;
      --z-dock: 97000;
      --z-tab-switcher: 98000;
      --z-popup: 99000;
      --z-boot: 99999;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-width: 0;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    html { overflow-y: auto; -webkit-overflow-scrolling: touch; }
    body {
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 0%, #2a2a35 0%, #0f0f15 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body.ui-safe-vertical {
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }
    body.ui-immersive { padding: 0; overflow: hidden !important; }

    #kxtsk-shell {
      position: relative;
      width: 100%;
      min-height: 100dvh;
      overflow: visible;
      z-index: var(--z-base);
    }
    .almasliber, .almasliber .shell, #main-content {
      position: relative;
      width: 100%;
      min-width: 0;
    }
    .almasliber { min-height: 100dvh; }

    /* HEADER SYSTEM */
    .topbar {
      position: relative;
      width: 100%;
      min-width: 0;
      height: var(--topbar-h);
      min-height: var(--topbar-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 12px;
      z-index: var(--z-header-system);
      isolation: isolate;
    }
    #system-topbar { z-index: var(--z-header-system); }
    #main-header { z-index: var(--z-header-main); }

    #main-header.header-visible {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    #main-header.header-hidden {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }
    #main-header { transition: transform .25s ease, opacity .2s ease; }

    .brand, .brandX, .os-brand {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      min-width: 0;
      font-weight: 800;
    }
    .brandX { gap: 7px; font-size: 13px; letter-spacing: 1.3px; }
    .badgeX { font-size: 9px; opacity: .55; }

    .top-actions {
      min-width: 0;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }
    .icon-btn, .soft-btn, .launcher-btn, .win-go-btn {
      flex: 0 0 auto;
      border: 0;
      border-radius: 12px;
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn { width: 34px; height: 34px; padding: 0; background: rgba(255,255,255,.08); }
    .soft-btn { padding: 10px 12px; background: rgba(255,255,255,.08); }
    .launcher-btn { padding: 10px 12px; background: rgba(0,242,255,.12); border: 1px solid rgba(0,242,255,.3); }
    .win-go-btn { padding: 10px 12px; background: rgba(0,242,255,.12); }
    .icon-btn:active, .win-controls button:active, .dock-bubble:active { transform: scale(.94); }

    .win-navrow {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-width: 0;
      padding: 0 16px 10px;
    }
    .win-urlbar {
      flex: 1 1 auto;
      min-width: 139px;
      padding: 11px 13px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: #fff;
      outline: none;
      font-size: 10px;
    }
    .win-urlbar::placeholder { color: rgba(255,255,255,.45); }
    .win-urlbar:focus {
      border-color: rgba(0,242,255,.45);
      background: rgba(255,255,255,.09);
      box-shadow: 0 0 0 3px rgba(0,242,255,.08);
    }

    main, #main-content { position: relative; z-index: var(--z-content); }

    #stackWrap {
      position: relative;
      width: 100%;
      max-width: 800px;
      min-height: calc(100dvh - var(--topbar-h));
      margin: 0 auto;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: var(--session-gap);
      overflow: visible;
      z-index: var(--z-content);
      isolation: isolate;
    }

    /* SESSION WINDOW */
    .session-window {
      position: relative;
      width: 100%;
      height: calc(100dvh - var(--topbar-h));
      min-height: 0;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: rgba(30,30,35,.40);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--session-radius);
      z-index: var(--z-session);
      transition: height .28s cubic-bezier(.16,1,.3,1), width .28s cubic-bezier(.16,1,.3,1), transform .28s ease, opacity .28s ease;
    }

    .session-window .win-hdr {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: var(--header-h);
      min-height: var(--header-h);
      display: flex;
      align-items: center;
      padding: 10px 14px;
      z-index: var(--z-session-header);
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
      touch-action: manipulation;
      isolation: isolate;
    }

    .win-controls {
      position: relative;
      z-index: var(--z-session-controls);
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 7px;
      pointer-events: auto;
    }
    .win-controls button {
      width: 30px;
      height: 30px;
      min-width: 30px;
      min-height: 30px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.10);
      color: #fff;
      cursor: pointer;
      font-family: "Noto Sans Symbols 2", "Noto Sans Symbols", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 17px;
      font-weight: 300;
      line-height: 1;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .win-controls button:hover { background: rgba(255,255,255,.17); }

    /* Botão de abas (estilo KODUX) */
    .win-controls .tab-badge {
      width: auto;
      min-width: 30px;
      padding: 0 10px;
      border-radius: 20px;
      background: rgba(0,242,255,.15);
      font-size: 12px;
      font-weight: 600;
      color: #7af;
      letter-spacing: 0.3px;
      border: 1px solid rgba(0,242,255,.2);
      cursor: pointer;
    }
    .win-controls .tab-badge:active { transform: scale(.94); }

    .session-window .win-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      border: 0;
      background: transparent;
      z-index: 1;
      display: block;
    }

    .session-window.collapsed {
      height: var(--collapsed-h) !important;
      min-height: var(--collapsed-h) !important;
      overflow: hidden !important;
    }
    .session-window.collapsed .win-frame { visibility: hidden; pointer-events: none; }

    .session-window.peeked {
      height: var(--peek-h) !important;
      min-height: var(--peek-h) !important;
    }
    .session-window.peeked .win-frame { visibility: visible; pointer-events: auto; }

    .session-window.minimized {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      min-width: 1px !important;
      min-height: 1px !important;
      opacity: 0 !important;
      pointer-events: none !important;
      transform: scale(.90) translateY(50px);
      overflow: hidden !important;
    }

    .session-window.maximized {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      min-width: 0 !important;
      min-height: 0 !important;
      max-width: none !important;
      max-height: none !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      overflow: hidden !important;
      z-index: var(--z-maximized) !important;
      transition: none !important;
    }
    .session-window.maximized .win-hdr {
      position: absolute !important;
      inset: 0 0 auto 0 !important;
      width: 100% !important;
      height: var(--header-h) !important;
      z-index: var(--z-maximized-header) !important;
      pointer-events: none !important;
    }
    .session-window.maximized .win-controls { pointer-events: auto !important; z-index: var(--z-maximized-controls) !important; }
    .session-window.maximized .win-frame {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1 !important;
    }

    body.has-maximized { overflow: hidden !important; }
    body.has-maximized .topbar { pointer-events: none; }
    body.has-maximized .session-window.maximized .win-controls,
    body.has-maximized .session-window.maximized .win-hdr { pointer-events: auto; }

    .session-window .resize-handle {
      position: absolute;
      z-index: var(--z-resize);
      background: transparent;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .session-window .resize-y { left: 0; right: 0; bottom: 0; height: var(--resize-hit); cursor: ns-resize; }
    .session-window .resize-x { top: var(--header-h); right: 0; bottom: 0; width: var(--resize-hit); cursor: ew-resize; }
    .session-window .resize-corner { right: 0; bottom: 0; width: var(--resize-corner); height: var(--resize-corner); cursor: nwse-resize; }
    .session-window .resize-corner::before {
      content: "";
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.25);
      box-shadow: 0 0 14px rgba(0,242,255,.18);
      pointer-events: none;
    }
    .session-window.maximized .resize-handle { display: none !important; }

    .session-window.suspended .win-frame { display: none; }
    .session-window.suspended::after {
      content: "⏸";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      opacity: .3;
      pointer-events: none;
    }

    .session-window.state-idle { filter: saturate(.82); }
    .session-window.state-idle .win-hdr::before {
      content: "";
      position: absolute;
      top: 8px;
      right: 8px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,200,60,.75);
      pointer-events: none;
    }
    .session-window.state-loading .win-hdr::before {
      content: "";
      position: absolute;
      top: 8px;
      right: 8px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(0,242,255,.8);
      animation: session-loading-pulse 1s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes session-loading-pulse {
      0%, 100% { opacity: .3; }
      50% { opacity: 1; }
    }

    /* DOCK (Almasliber) */
    #dock {
      position: fixed;
      left: var(--dock-offset-x);
      bottom: calc(var(--dock-bottom-gap) + var(--safe-bottom));
      z-index: var(--z-dock);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 12px 10px;
      border-radius: 24px;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,.1);
    }
    #dock:empty { opacity: 0; pointer-events: none; }
    .dock-bubble {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.20);
      color: #fff;
      cursor: pointer;
      font-family: "Noto Sans Symbols 2", "Noto Sans Symbols", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 19px;
      line-height: 1;
      touch-action: manipulation;
    }

    /* ====== ESTILOS DO KODUX (painel de abas) ====== */
    .glass-panel { background: rgba(40,40,40,.17); }
    .app-view {
      position: fixed;
      inset: 0;
      z-index: var(--z-tab-switcher);
      background: rgba(0,0,0,.92);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      padding: 64px 16px 96px;
      overflow-y: auto;
      transition: transform .3s cubic-bezier(.25,.8,.25,1), opacity .3s ease;
      transform: scale(.95) translateY(20px);
      opacity: 0;
      pointer-events: none;
    }
    .app-view.active {
      transform: scale(1) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .app-view .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .app-view .header h2 {
      font-size: 24px;
      font-weight: 800;
    }
    .app-view .footer {
      margin-top: auto;
      padding-top: 32px;
      display: flex;
      justify-content: center;
    }
    .app-view .footer button {
      padding: 12px 28px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      border: none;
      cursor: pointer;
      background: rgba(40,40,40,.17);
    }
    .btn-primary {
      background: #0A84FF;
      color: #fff;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    #tabs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .tab-card-glass {
      background: rgba(40,40,40,.17);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      height: 160px;
      position: relative;
      cursor: pointer;
      transition: .2s;
      border: 1px solid transparent;
    }
    .tab-card-glass:active { transform: scale(.96); }
    .tab-card-glass.active { outline: 2px solid #0A84FF; border-color: #0A84FF; }
    .tab-card-glass .title {
      font-size: 11px;
      font-weight: 700;
      color: #D1D5DB;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 24px;
    }
    .tab-card-glass .close-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      border-radius: 99px;
      background: rgba(239,68,68,.2);
      color: #F87171;
      border: none;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .tab-card-glass .preview {
      flex: 1;
      background: rgba(255,255,255,.05);
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 28px;
      margin-top: 8px;
    }

    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }

    @media (max-width: 600px) {
      :root { --session-radius: 22px; --session-gap: 10px; }
      .session-window { width: 100%; }
      #tabs-grid { grid-template-columns: 1fr; }
    }
  </style>

  <!-- ====== ESTILOS ADICIONAIS (tema, painéis) ====== -->
  <style>
    :root {
      color-scheme: dark;
      --bg: #050507;
      --panel: rgba(18,18,22,.82);
      --panel-solid: #121216;
      --border: rgba(255,255,255,.10);
      --text: #f5f5f7;
      --muted: rgba(255,255,255,.52);
      --cyan: #00e5ff;
      --purple: #bf5af2;
      --gold: #ffd60a;
      --input-bg: rgba(255,255,255,.055);
      --button-bg: rgba(255,255,255,.07);
      --topbar-bg: rgba(5,5,7,.82);
      --dock-bg: rgba(10,10,13,.92);
      --shadow: 0 10px 40px rgba(0,0,0,.35);
      --radius: 18px;
      --transition: .25s ease;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f5f5f7;
      --panel: rgba(255,255,255,.85);
      --panel-solid: #ffffff;
      --border: rgba(0,0,0,.08);
      --text: #1a1a1e;
      --muted: rgba(0,0,0,.50);
      --cyan: #007aff;
      --purple: #af52de;
      --gold: #d4a017;
      --input-bg: rgba(0,0,0,.035);
      --button-bg: rgba(0,0,0,.045);
      --topbar-bg: rgba(255,255,255,.82);
      --dock-bg: rgba(255,255,255,.92);
      --shadow: 0 10px 40px rgba(0,0,0,.10);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, system-ui, sans-serif; transition: background-color var(--transition), color var(--transition); }
    .dual-app { min-height: 100vh; background: var(--bg); color: var(--text); }

    /* HEADER FLUTUANTE (já existe no core) */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 56px;
      padding: 10px 16px;
      background: var(--topbar-bg);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      transform: translateY(0);
      transition: transform .32s cubic-bezier(.22,1,.36,1), opacity .25s ease, background var(--transition), border-color var(--transition);
    }
    .topbar.header-hidden {
      transform: translateY(calc(-100% - 12px));
      opacity: .15;
      pointer-events: none;
    }
    .topbar.header-visible {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .brandX { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .08em; }
    .badgeX { padding: 5px 9px; border-radius: 999px; background: var(--button-bg); color: var(--muted); font-size: 10px; letter-spacing: .08em; }
    .theme-dot {
      position: relative;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--button-bg);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform .2s ease, background var(--transition), border-color var(--transition), box-shadow var(--transition);
    }
    .theme-dot::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
      transition: all var(--transition);
    }
    .theme-dot:hover { transform: scale(1.08); border-color: var(--cyan); box-shadow: 0 0 20px color-mix(in srgb, var(--cyan) 20%, transparent); }

    #main-content {
      padding-top: 56px;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      max-height: 50000px;
      overflow: hidden;
      transition: opacity .35s ease, max-height .35s ease, visibility .35s ease, padding .35s ease;
    }
    #main-content.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
    }

    .panel, .card, .modal, .drawer, .sidebar, .sheet, .deck, .overlay-panel, .fractal-block, .preview-card {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: background var(--transition), border-color var(--transition), color var(--transition), box-shadow var(--transition);
    }

    /* HOME SCREEN */
    #home-screen {
      position: relative;
      width: 100%;
      min-height: calc(100dvh - var(--topbar-h) - 80px);
      padding: 28px 18px 120px;
      z-index: 1;
      display: flex;
      flex-direction: column;
    }
    #home-screen .home-title {
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 32px;
      padding-left: 8px;
      letter-spacing: -0.5px;
    }
    .grid-apps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 28px 16px;
    }
    .app-tile {
      display: flex;
      flex-direction: column;
      align-items: center;

<!-- ============================================================
     SCRIPT — FUSÃO COMPLETA (Almasliber + KODUX TabEngine)
     ============================================================ -->
<script>
(function () {
  'use strict';

  // ============================================================
  // 1. ALMASLIBER CORE (janelas, dock, lifecycle)
  // ============================================================

  const ROOT = document.documentElement;
  const THEME_KEY = 'dual-theme';

  const stackWrap = document.getElementById('stackWrap');
  const dock = document.getElementById('dock');

  const timers = new Map();
  const sessionStore = new Map();
  const suspendedQueue = [];
  const MAX_SUSPENDED = 5;
  let counter = 1;
  let activeWindow = null;

  const SessionState = {
    CREATED:   'created',
    LOADING:   'loading',
    ACTIVE:    'active',
    IDLE:      'idle',
    SUSPENDED: 'suspended',
    CLOSED:    'closed'
  };

  const Tier = { FREE: 'free', PRO: 'pro', PREMIUM: 'premium' };
  const TIER_LIMITS = {
    [Tier.FREE]:    { maxActive: 2, maxSuspended: 3,  maxSessions: 5  },
    [Tier.PRO]:     { maxActive: 4, maxSuspended: 6,  maxSessions: 12 },
    [Tier.PREMIUM]: { maxActive: 8, maxSuspended: 12, maxSessions: 30 }
  };
  const IDLE_AFTER_MS = 45000;
  const SUSPEND_AFTER_IDLE_MS = 90000;
  let currentTier = Tier.FREE;
  const sessionMeta = new Map();

  function currentLimits() { return TIER_LIMITS[currentTier] || TIER_LIMITS[Tier.FREE]; }
  function countByStates(...states) {
    let n = 0;
    sessionMeta.forEach(meta => { if (states.includes(meta.state)) n++; });
    return n;
  }
  function setSessionState(id, state) {
    const win = getWin(id);
    const meta = sessionMeta.get(id) || { createdAt: Date.now() };
    meta.state = state;
    if (state === SessionState.ACTIVE || state === SessionState.LOADING) {
      meta.lastActive = Date.now();
    }
    if (state === SessionState.CLOSED) {
      sessionMeta.delete(id);
    } else {
      sessionMeta.set(id, meta);
    }
    if (win) {
      win.dataset.state = state;
      win.classList.remove('state-created','state-loading','state-active','state-idle','state-suspended','state-closed');
      win.classList.add('state-' + state);
    }
    window.dispatchEvent(new CustomEvent('session:state-change', { detail: { id, state } }));
  }
  function getSessionState(id) { return sessionMeta.get(id)?.state || null; }
  function touchSession(id) {
    const meta = sessionMeta.get(id);
    if (!meta) return;
    meta.lastActive = Date.now();
    if (meta.state === SessionState.IDLE) setSessionState(id, SessionState.ACTIVE);
  }
  function leastRecentlyActiveSession(excludeId) {
    let oldestId = null, oldestTime = Infinity;
    sessionMeta.forEach((meta, id) => {
      if (id === excludeId) return;
      const win = getWin(id);
      if (win && isMaximized(win)) return;
      if (![SessionState.ACTIVE, SessionState.IDLE, SessionState.LOADING].includes(meta.state)) return;
      const t = meta.lastActive || 0;
      if (t < oldestTime) { oldestTime = t; oldestId = id; }
    });
    return oldestId;
  }
  function enforceActiveBudget(excludeId) {
    const limits = currentLimits();
    let guard = 0;
    while (
      countByStates(SessionState.ACTIVE, SessionState.LOADING, SessionState.IDLE) >= limits.maxActive &&
      guard++ < 50
    ) {
      const victim = leastRecentlyActiveSession(excludeId);
      if (!victim) break;
      suspendSession(victim);
    }
  }
  function setTier(tier) { if (TIER_LIMITS[tier]) { currentTier = tier; enforceActiveBudget(); } }

  setInterval(() => {
    const now = Date.now();
    sessionMeta.forEach((meta, id) => {
      const win = getWin(id);
      if (!win) return;
      if (isMaximized(win)) { touchSession(id); return; }
      if (meta.state === SessionState.ACTIVE && now - (meta.lastActive || 0) > IDLE_AFTER_MS) {
        setSessionState(id, SessionState.IDLE);
      } else if (meta.state === SessionState.IDLE && now - (meta.lastActive || 0) > SUSPEND_AFTER_IDLE_MS) {
        suspendSession(id);
      }
    });
  }, 10000);

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  function getWin(id) { return document.getElementById(id); }
  function isMaximized(win) { return !!win?.classList.contains('maximized'); }

  const zStack = [];
  function bringToFront(win) {
    if (!win) return;
    const index = zStack.indexOf(win);
    if (index !== -1) zStack.splice(index, 1);
    zStack.push(win);
    zStack.forEach((item, i) => {
      if (!item.classList.contains('maximized')) {
        item.style.zIndex = String(1000 + i * 10);
      }
    });
    setActiveWindow(win);
  }

  function setActiveWindow(win) {
    if (activeWindow === win) return;
    activeWindow = win;
    syncGlobalHeader();
  }

  function syncGlobalHeader() {
    const urlInput = document.getElementById('urlInputNav');
    if (!activeWindow) { if (urlInput) urlInput.value = ''; return; }
    // Usa a aba ativa do OS.TabEngine
    const activeTab = OS.TabEngine.getActiveTab();
    if (activeTab && urlInput) {
      urlInput.value = activeTab.url || '';
    } else if (urlInput) {
      urlInput.value = '';
    }
  }

  // ============================================================
  // SUSPEND / RESTORE / DESTROY
  // ============================================================
  function suspendSession(id) {
    const win = getWin(id);
    if (!win) return;
    const frame = win.querySelector('.win-frame');
    if (!frame) return;
    sessionStore.set(id, { url: frame.src });
    frame.remove();
    win.dataset.suspended = 'true';
    win.classList.add('suspended');
    setSessionState(id, SessionState.SUSPENDED);
    if (!suspendedQueue.includes(id)) suspendedQueue.push(id);
    while (suspendedQueue.length > MAX_SUSPENDED) {
      const oldest = suspendedQueue.shift();
      destroySession(oldest);
    }
  }
  function restoreSession(id) {
    const win = getWin(id);
    if (!win) return;
    const data = sessionStore.get(id);
    if (!data) return;
    enforceActiveBudget(id);
    setSessionState(id, SessionState.LOADING);
    const frame = document.createElement('iframe');
    frame.className = 'win-frame';
    frame.dataset.runtime = 'nav';
    frame.addEventListener('load', () => setSessionState(id, SessionState.ACTIVE), { once: true });
    frame.src = data.url;
    win.appendChild(frame);
    win.dataset.suspended = 'false';
    win.classList.remove('suspended');
    sessionStore.delete(id);
    const index = suspendedQueue.indexOf(id);
    if (index !== -1) suspendedQueue.splice(index, 1);
  }
  function destroySession(id) {
    const win = getWin(id);
    setSessionState(id, SessionState.CLOSED);
    document.getElementById('dock-' + id)?.remove();
    win?.remove();
    sessionStore.delete(id);
    const index = suspendedQueue.indexOf(id);
    if (index !== -1) suspendedQueue.splice(index, 1);
    syncShell();
    if (activeWindow === win) setActiveWindow(null);
    // Se não houver mais janelas, mostrar a home
    if (document.querySelectorAll('.session-window').length === 0) {
      document.getElementById('home-screen').style.display = 'flex';
      stackWrap.style.display = 'none';
      dock.style.display = 'none';
      document.querySelectorAll('.dock-btn').forEach(b => b.classList.toggle('active', b.dataset.app === 'home'));
    }
  }

  // ============================================================
  // WINDOW CONTROLS
  // ============================================================
  function toggleCollapse(id) {
    const win = getWin(id);
    if (!win) return;
    if (isMaximized(win)) { win.classList.remove('maximized'); win.style.zIndex = ''; syncShell(); }
    win.classList.toggle('collapsed');
    win.classList.remove('peeked');
    if (win.classList.contains('collapsed') && win.dataset.suspended === 'true') restoreSession(id);
    bringToFront(win);
    syncShell();
  }
  function togglePeek(id) {
    const win = getWin(id);
    if (!win) return;
    if (isMaximized(win)) { win.classList.remove('maximized'); win.style.zIndex = ''; syncShell(); }
    win.classList.toggle('peeked');
    if (win.classList.contains('peeked')) {
      win.classList.remove('collapsed');
      if (win.dataset.suspended === 'true') restoreSession(id);
    }
    bringToFront(win);
    syncShell();
  }
  function maximizeWindow(id) {
    const win = getWin(id);
    if (!win) return;
    if (isMaximized(win)) {
      win.classList.remove('maximized');
      win.style.zIndex = '';
      if (win.dataset.suspended === 'true') restoreSession(id);
      bringToFront(win);
      syncShell();
      return;
    }
    win.classList.remove('collapsed', 'peeked', 'minimized', 'header-hidden', 'resizing');
    ['top','left','right','bottom','width','height','maxWidth','maxHeight'].forEach(p => win.style[p] = '');
    if (win.dataset.suspended === 'true') restoreSession(id);
    win.classList.add('maximized');
    win.style.zIndex = '94000';
    bringToFront(win);
    syncShell();
  }
  function minimizeWindow(id) {
    const win = getWin(id);
    if (!win) return;
    timers.delete(id);
    win.classList.remove('maximized', 'collapsed', 'peeked', 'header-hidden', 'resizing');
    syncShell();
    suspendSession(id);
    win.classList.add('minimized');
    document.getElementById('dock-' + id)?.remove();
    const bubble = document.createElement('button');
    bubble.type = 'button';
    bubble.className = 'dock-bubble';
    bubble.id = 'dock-' + id;
    bubble.title = 'Restaurar janela';
    bubble.setAttribute('aria-label', 'Restaurar janela');
    bubble.textContent = '۞';
    bubble.addEventListener('click', function(e) {
      e.preventDefault(); e.stopPropagation();
      win.classList.remove('minimized');
      if (win.dataset.suspended === 'true') restoreSession(id);
      bringToFront(win);
      requestAnimationFrame(() => { bringToFront(win); syncShell(); });
      bubble.remove();
    });
    dock?.appendChild(bubble);
    syncShell();
  }
  function closeWindow(id) { destroySession(id); }

  function handleHeaderClick(e, id) {
    if (e.target.closest('.win-controls') || e.target.closest('button') || e.target.closest('input') || e.target.closest('.win-navrow')) return;
    const win = getWin(id);
    if (!win) return;
    bringToFront(win);
    const old = timers.get(id);
    if (old) { clearTimeout(old); timers.delete(id); maximizeWindow(id); return; }
    const timer = setTimeout(() => { timers.delete(id); togglePeek(id); }, 250);
    timers.set(id, timer);
  }

  // ============================================================
  // RESIZE
  // ============================================================
  function makeResizeHandles(win) {
    if (win.dataset.resizeReady === '1') return;
    win.dataset.resizeReady = '1';
    const hy = document.createElement('div'); hy.className = 'resize-handle resize-y';
    const hx = document.createElement('div'); hx.className = 'resize-handle resize-x';
    const hc = document.createElement('div'); hc.className = 'resize-handle resize-corner';
    win.append(hy, hx, hc);
    bindResizeY(win, hy);
    bindResizeX(win, hx);
    bindResizeCorner(win, hc);
  }
  function freeFromMaximize(win, rect) {
    if (isMaximized(win)) {
      win.classList.remove('maximized');
      win.style.position = 'fixed';
      win.style.left = Math.max(0, rect.left) + 'px';
      win.style.top = Math.max(0, rect.top) + 'px';
      win.style.right = 'auto';
      win.style.bottom = 'auto';
      win.style.width = Math.min(rect.width, window.innerWidth) + 'px';
      win.style.height = Math.min(rect.height, window.innerHeight) + 'px';
      win.style.maxWidth = 'none';
      win.style.maxHeight = 'none';
      if (win.dataset.suspended === 'true') restoreSession(win.id);
    }
    win.classList.remove('collapsed', 'peeked');
    win.classList.add('resizing');
    syncShell();
  }
  function finishResize(win) { win.classList.remove('resizing'); syncShell(); }

  function bindResizeY(win, handle) {
    let active = false, pointerId = null, startY = 0, startH = 0;
    handle.addEventListener('pointerdown', function(e) {
      if (e.button != null && e.button !== 0) return;
      const rect = win.getBoundingClientRect();
      active = true; pointerId = e.pointerId;
      startY = e.clientY; startH = rect.height;
      freeFromMaximize(win, rect);
      handle.setPointerCapture?.(pointerId);
      e.preventDefault();
      const move = ev => { if (!active || ev.pointerId !== pointerId) return; ev.preventDefault(); const next = Math.max(44, Math.min(window.innerHeight, startH + (ev.clientY - startY))); win.style.height = next + 'px'; };
      const up = ev => { if (ev && ev.pointerId !== pointerId) return; active = false; window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); finishResize(win); };
      window.addEventListener('pointermove', move, { passive: false });
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
    }, { passive: false });
  }
  function bindResizeX(win, handle) {
    let active = false, pointerId = null, startX = 0, startW = 0;
    handle.addEventListener('pointerdown', function(e) {
      if (e.button != null && e.button !== 0) return;
      const rect = win.getBoundingClientRect();
      active = true; pointerId = e.pointerId;
      startX = e.clientX; startW = rect.width;
      freeFromMaximize(win, rect);
      handle.setPointerCapture?.(pointerId);
      e.preventDefault();
      const move = ev => { if (!active || ev.pointerId !== pointerId) return; ev.preventDefault(); const next = Math.max(280, Math.min(window.innerWidth, startW + (ev.clientX - startX))); win.style.width = next + 'px'; };
      const up = ev => { if (ev && ev.pointerId !== pointerId) return; active = false; window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); finishResize(win); };
      window.addEventListener('pointermove', move, { passive: false });
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
    }, { passive: false });
  }
  function bindResizeCorner(win, handle) {
    let active = false, pointerId = null, startX = 0, startY = 0, startW = 0, startH = 0;
    handle.addEventListener('pointerdown', function(e) {
      if (e.button != null && e.button !== 0) return;
      const rect = win.getBoundingClientRect();
      active = true; pointerId = e.pointerId;
      startX = e.clientX; startY = e.clientY;
      startW = rect.width; startH = rect.height;
      freeFromMaximize(win, rect);
      handle.setPointerCapture?.(pointerId);
      e.preventDefault();
      const move = ev => { if (!active || ev.pointerId !== pointerId) return; ev.preventDefault(); const width = Math.max(280, Math.min(window.innerWidth, startW + (ev.clientX - startX))); const height = Math.max(44, Math.min(window.innerHeight, startH + (ev.clientY - startY))); win.style.width = width + 'px'; win.style.height = height + 'px'; };
      const up = ev => { if (ev && ev.pointerId !== pointerId) return; active = false; window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); finishResize(win); };
      window.addEventListener('pointermove', move, { passive: false });
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
    }, { passive: false });
  }

  // ============================================================
  // SYNC SHELL
  // ============================================================
  function syncShell() {
    const maximized = !!document.querySelector('.session-window.maximized:not(.minimized)');
    document.body.classList.toggle('has-maximized', maximized);
    document.body.classList.toggle('ui-immersive', maximized);
  }

  // ============================================================
  // WIRE SESSION (sem abas próprias, usa OS.TabEngine)
  // ============================================================
  function wireSession(win) {
    if (!win || win.dataset.wired === '1') return;
    win.dataset.wired = '1';

    win.addEventListener('pointerdown', () => touchSession(win.id), { passive: true });

    makeResizeHandles(win);

    const header = $('.win-hdr', win);
    header?.addEventListener('click', e => handleHeaderClick(e, win.id));

    const controls = $('.win-controls', win);
    controls?.addEventListener('click', function(e) {
      e.preventDefault(); e.stopPropagation();
      const btn = e.target.closest('button');
      if (!btn) return;
      const action = btn.dataset.action;
      if (action === 'collapse') toggleCollapse(win.id);
      else if (action === 'maximize') maximizeWindow(win.id);
      else if (action === 'minimize') minimizeWindow(win.id);
      else if (action === 'close') closeWindow(win.id);
      else if (action === 'tab-switcher') {
        // Abre o painel de abas do KODUX
        OS.TabEngine.showTabSwitcher();
      }
    });

    // Navegação local (dentro da janela)
    const input = $('.win-urlbar', win);
    const go = $('.win-go-btn', win);
    go?.addEventListener('click', function(e) {
      e.preventDefault(); e.stopPropagation();
      if (!input) return;
      let url = input.value.trim();
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      // Atualiza a aba ativa e o iframe
      const activeTab = OS.TabEngine.getActiveTab();
      if (activeTab) {
        OS.TabEngine.updateActiveTabUrl(url);
      }
      input.value = url;
    });
    input?.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.stopPropagation(); go?.click(); } });

    // Sincroniza o iframe com a aba ativa
    const frame = win.querySelector('.win-frame');
    const activeTab = OS.TabEngine.getActiveTab();
    if (frame && activeTab && frame.src !== activeTab.url) {
      frame.src = activeTab.url || 'about:blank';
    }

    // Quando o iframe carregar, atualiza o título da aba
    frame?.addEventListener('load', function() {
      try {
        const doc = this.contentDocument;
        if (doc && doc.title) {
          const active = OS.TabEngine.getActiveTab();
          if (active) {
            active.title = doc.title;
            OS.TabEngine.saveState();
            OS.TabEngine.updateUI();
          }
        }
      } catch (_) {}
      if (this.src) {
        const active = OS.TabEngine.getActiveTab();
        if (active && active.url !== this.src) {
          active.url = this.src;
          OS.TabEngine.saveState();
          OS.TabEngine.updateUI();
        }
        const localInput = win.querySelector('.win-urlbar');
        if (localInput) localInput.value = this.src;
        syncGlobalHeader();
      }
    });

    // Traz para frente ao clicar no frame (se não estiver maximizado)
    frame?.addEventListener('click', function() {
      if (!win.classList.contains('maximized')) bringToFront(win);
    });

    // Atualiza o contador de abas na janela
    const updateTabCounter = () => {
      const counter = win.querySelector('.tab-badge span');
      if (counter) counter.textContent = OS.TabEngine.tabs.length;
    };
    // Insere hook no TabEngine para atualizar todos os contadores
    const origUpdateUI = OS.TabEngine.updateUI;
    OS.TabEngine.updateUI = function() {
      origUpdateUI.call(this);
      document.querySelectorAll('.session-window .tab-badge span').forEach(el => {
        el.textContent = this.tabs.length;
      });
    };
    // Inicializa o contador
    updateTabCounter();

    if (!activeWindow) setActiveWindow(win);
  }

  // ============================================================
  // CREATE SESSION
  // ============================================================
  function createSessionWindow({ src = 'https://www.infodose.com.br' } = {}) {
    const id = 'session-' + Date.now() + '-' + counter++;
    const win = document.createElement('section');

  // ============================================================
  // THEME
  // ============================================================
  function applyTheme(theme) {
    const next = theme === 'light' ? 'light' : 'dark';
    ROOT.dataset.theme = next;
    try { localStorage.setItem(THEME_KEY, next); } catch (_) {}
    $$('.theme-dot').forEach(btn => {
      if (btn.textContent.includes('☀') || btn.textContent.includes('🌙')) {
        btn.textContent = next === 'light' ? '☀️' : '🌙';
      }
    });
    window.dispatchEvent(new CustomEvent('dual:theme-change', { detail: { theme: next } }));
  }
  function getInitialTheme() {
    try { const saved = localStorage.getItem(THEME_KEY); if (saved === 'light' || saved === 'dark') return saved; } catch (_) {}
    return 'dark';
  }
  const DualTheme = {
    set: applyTheme,
    toggle() { applyTheme(ROOT.dataset.theme === 'light' ? 'dark' : 'light'); },
    get() { return ROOT.dataset.theme || 'dark'; }
  };
  $$('.theme-dot').forEach(btn => {
    btn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); DualTheme.toggle(); });
  });

    if (!navInput || !activeWindow) return;

  const HEADER = document.getElementById('main-header');
  const MAIN = document.getElementById('main-content');
  HEADER?.addEventListener('click', e => {
    if (e.target.closest('button') || e.target.closest('input') || e.target.closest('.win-navrow') || e.target.closest('.theme-dot')) return;
    MAIN?.classList.toggle('hidden');

  });

  // ============================================================
  // SMART SCROLL
  // ============================================================
  let lastScrollY = window.scrollY, ticking = false;
  const SCROLL_THRESHOLD = 8;
  function updateHeader() {
    if (!HEADER) return;
    const current = window.scrollY;
    if (current <= 10) {
      HEADER.classList.remove('header-hidden');
      HEADER.classList.add('header-visible');
      lastScrollY = current; ticking = false; return;
    }
    if (current > lastScrollY + SCROLL_THRESHOLD) {
      HEADER.classList.remove('header-visible');
      HEADER.classList.add('header-hidden');
    } else if (current < lastScrollY - SCROLL_THRESHOLD) {
      HEADER.classList.remove('header-hidden');
      HEADER.classList.add('header-visible');
    }
    lastScrollY = current; ticking = false;
  }
  window.addEventListener('scroll', () => { if (!ticking) { requestAnimationFrame(updateHeader); ticking = true; } }, { passive: true });


  // ============================================================

  const OS = {

          { text: 'Cancelar', type: 'secondary', onClick: () => OS.Popup.hide() },
          { text: 'Instalar', type: 'primary', onClick: () => {
            const code = document.getElementById('plugin-code').value;
            const name = document.getElementById('plugin-name').value || 'Plugin ' + (this.list.length + 1);
            if (code) {
              this.list.push({ id: Date.now(), name, code, active: true });
              OS.Storage.save('plugins', this.list);
              this.renderList();
              this.execute(code);
              OS.Popup.show("Sucesso", "Plugin instalado.");
            }
          }}
        ]);
      },
      remove(id) {
        this.list = this.list.filter(p => p.id !== id);
        OS.Storage.save('plugins', this.list);
        this.renderList();
      },
      renderList() {
        const c = document.getElementById('plugins-list');
        if (!this.list.length) {
          c.innerHTML = `<div class="plugins-empty"><div class="big">◫</div><p>Nenhum plugin</p></div>`;
          return;
        }
        c.innerHTML = this.list.map(p =>
          `<div class="plugin-item">
            <div><div class="name">${p.name}</div><div class="status">Ativo</div></div>
            <button class="del-btn" onclick="OS.Plugins.remove(${p.id})">✕</button>
          </div>`
        ).join('');
      },
      execute(code) {
        try { const fn = new Function('OS', code); fn(OS); } catch (e) { OS.Popup.show('Erro no Plugin', `<p style="color:#F87171;font-size:11px;">${e.message}</p>`); }
      },
      executeAll() { this.list.filter(p => p.active).forEach(p => this.execute(p.code)); }
    },
    Apps: {
      registry: [
        { id: 'browser', name: 'Navegador', icon: '◍', color: '#0A84FF' },
        { id: 'notes', name: 'Notas', icon: '✎', color: '#FBBF24' },
        { id: 'plugins', name: 'Plugins', icon: '◫', color: '#A855F7' },
        { id: 'settings', name: 'Ajustes', icon: '⚙', color: '#6B7280', action: () => OS.Popup.show('Sistema', 'KODUX OS v1.0<br>Sem dependências<br>LocalStorage OK') }
      ],
      Notes: {
        init() { const el = document.getElementById('notes-content'); if (el) el.value = OS.Storage.load('notes_data', ''); },
        save() {
          const el = document.getElementById('notes-content');
          if (el) OS.Storage.save('notes_data', el.value);
          OS.Popup.show('Notas', 'Salvo local!');
        }
      }
    },
    UI: {
      buildHome() {
        const g = document.getElementById('app-grid');
        g.innerHTML = OS.Apps.registry.map(app => {
          let action = `OS.UI.openApp('${app.id}')`;
          if (app.id === 'browser') action = `OS.UI.openBrowser()`;
          return `<div class="app-tile" onclick="${action}">
            <div class="app-icon" style="background:${app.color}">${app.icon}</div>
            <span class="app-name">${app.name}</span>
          </div>`;
        }).join('');
        // Nova janela
        const tile = document.createElement('div');
        tile.className = 'app-tile';
        tile.innerHTML = `<div class="app-icon" style="background:#00e5ff;font-size:28px;">⊞</div><span class="app-name">Nova Janela</span>`;
        tile.onclick = () => { createSessionWindow(); };
        g.appendChild(tile);
      },
      openBrowser() {
        let existing = document.querySelector('.session-window:not(.minimized)');
        if (existing) {
          bringToFront(existing);
          if (existing.dataset.suspended === 'true') restoreSession(existing.id);
          document.getElementById('home-screen').style.display = 'none';
          stackWrap.style.display = 'flex';
          dock.style.display = 'flex';
          document.querySelectorAll('.dock-btn').forEach(b => b.classList.toggle('active', b.dataset.app === 'browser'));
          OS.state.activeApp = 'browser';
          return;
        }
        createSessionWindow({ src: 'https://www.infodose.com.br/splash' });
        OS.state.activeApp = 'browser';
        document.querySelectorAll('.dock-btn').forEach(b => b.classList.toggle('active', b.dataset.app === 'browser'));
      },
      openApp(id) {
        document.querySelectorAll('.app-view-app').forEach(el => el.classList.remove('active'));
        OS.TabEngine.hideTabSwitcher();
        if (id === 'home') {
          document.getElementById('home-screen').style.display = 'flex';
          stackWrap.style.display = 'none';
          dock.style.display = 'none';
          OS.state.activeApp = 'home';
          document.querySelectorAll('.dock-btn').forEach(b => b.classList.toggle('active', b.dataset.app === 'home'));
          return;
        }
        if (id === 'browser') {
          this.openBrowser();
          return;
        }
        document.getElementById('home-screen').style.display = 'none';
        stackWrap.style.display = 'none';
        dock.style.display = 'none';
        const el = document.getElementById('app-' + id);
        if (el) {
          el.classList.add('active');
          OS.state.activeApp = id;
          document.querySelectorAll('.dock-btn').forEach(b => b.classList.toggle('active', b.dataset.app === id));
        }
      },
      goHome() {
        document.querySelectorAll('.app-view-app').forEach(el => el.classList.remove('active'));
        OS.TabEngine.hideTabSwitcher();
        document.getElementById('home-screen').style.display = 'flex';
        stackWrap.style.display = 'none';
        dock.style.display = 'none';
        OS.state.activeApp = 'home';
        document.querySelectorAll('.dock-btn').forEach(b => b.classList.toggle('active', b.dataset.app === 'home'));
      }
    },
    boot() {
      const bar = document.getElementById('boot-progress');
      let p = 0;
      const it = setInterval(() => {
        p += Math.random() * 25;
        if (p >= 100) { p = 100; clearInterval(it); setTimeout(() => this.finishBoot(), 400); }
        if (bar) bar.style.width = p + '%';
      }, 120);
    },
    finishBoot() {
      const boot = document.getElementById('boot-screen');
      if (boot) { boot.style.opacity = '0'; setTimeout(() => boot.remove(), 700); }

      // Inicializa o TabEngine antes das janelas
      this.TabEngine.init();

      // Inicializa janelas existentes
      $$('.session-window').forEach(win => {
        wireSession(win);
        const hasFrame = !!win.querySelector('.win-frame');
        setSessionState(win.id, hasFrame ? SessionState.ACTIVE : SessionState.CREATED);
        if (!activeWindow) setActiveWindow(win);
      });
      syncGlobalHeader();
      syncShell();

      // Inicializa apps
      this.UI.buildHome();
      this.Apps.Notes.init();
      this.Plugins.init();

      // Mostra home por padrão, esconde stackWrap
      document.getElementById('home-screen').style.display = 'flex';
      stackWrap.style.display = 'none';
      dock.style.display = 'none';

      // Configura dock buttons
      document.querySelectorAll('.dock-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const app = this.dataset.app;
          if (app === 'home') OS.UI.goHome();
          else OS.UI.openApp(app);
        });
      });

      // Atualiza contadores das janelas
      OS.TabEngine.updateUI();

      this.state.booted = true;
      console.log('🚀 Fusão completa: Almasliber + KODUX TabEngine.');
    }
  };

  // ============================================================
  // 3. EXPOSIÇÃO GLOBAL
  // ============================================================

  window.createSessionWindow = createSessionWindow;
  window.togglePeek = togglePeek;
  window.toggleCollapse = toggleCollapse;
  window.maximizeWindow = maximizeWindow;
  window.minimizeWindow = minimizeWindow;
  window.closeWindow = closeWindow;
  window.syncShellMode = syncShell;
  window.DualTheme = DualTheme;
  window.OS = OS;

  // Atualiza o estado do botão "browser" no dock quando uma janela é criada/fechada
  document.addEventListener('session:state-change', function(e) {
    const hasWindows = document.querySelectorAll('.session-window:not(.minimized)').length > 0;
    const browserBtn = document.querySelector('.dock-btn[data-app="browser"]');
    if (browserBtn) browserBtn.classList.toggle('active', hasWindows);
  });

  window.addEventListener('load', () => OS.boot());

})();
</script>

</body>
