<style id="ifsw-unified-core">
/* =========================================================
   ALMASLIBER / iFSw — UNIFIED CORE
   HEADER + SESSION + DOCK + MAXIMIZE/MINIMIZE + TABS
   ========================================================= */

:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);

  --topbar-h: 58px;
  --header-h: 52px;

  --session-radius: 29px;
  --session-gap: 20px;

  --collapsed-h: 52px;
  --peek-h: 178px;

  --resize-hit: 0px;
  --resize-corner: 54px;

  --dock-bottom-gap: 80px;
  --dock-offset-x: -12px;

  --z-base: 1;
  --z-content: 100;
  --z-header-system: 900;
  --z-header-main: 910;
  --z-session: 1000;
  --z-session-header: 1010;
  --z-session-controls: 1020;
  --z-maximized: 94000;
  --z-maximized-header: 94010;
  --z-maximized-controls: 94020;
  --z-resize: 94030;
  --z-dock: 97000;
  --z-tab-switcher: 98000;
}

* { box-sizing: border-box; }
html, body {
  width: 100%;
  min-width: 0;
  min-height: 100%;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}
html { overflow-y: auto; -webkit-overflow-scrolling: touch; }
body {
  min-height: 100dvh;
  background: radial-gradient(circle at 50% 0%, #2a2a35 0%, #0f0f15 100%);
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
body.ui-safe-vertical {
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}
body.ui-immersive { padding: 0; overflow: hidden !important; }

#kxtsk-shell {
  position: relative;
  width: 100%;
  min-height: 100dvh;
  overflow: visible;
  z-index: var(--z-base);
}
.almasliber, .almasliber .shell, #main-content {
  position: relative;
  width: 100%;
  min-width: 0;
}
.almasliber { min-height: 100dvh; }

/* HEADER SYSTEM */
.topbar {
  position: relative;
  width: 100%;
  min-width: 0;
  height: var(--topbar-h);
  min-height: var(--topbar-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 12px;
  z-index: var(--z-header-system);
  isolation: isolate;
}
#system-topbar { z-index: var(--z-header-system); }
#main-header { z-index: var(--z-header-main); }

#main-header.header-visible {
  transform: translateY(0);
  opacity: 1;
  pointer-events: auto;
}
#main-header.header-hidden {
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
}
#main-header { transition: transform .25s ease, opacity .2s ease; }

.brand, .brandX, .os-brand {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  min-width: 0;
  font-weight: 800;
}
.brandX { gap: 7px; font-size: 13px; letter-spacing: 1.3px; }
.badgeX { font-size: 9px; opacity: .55; }

.top-actions {
  min-width: 0;
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}
.icon-btn, .soft-btn, .launcher-btn, .win-go-btn {
  flex: 0 0 auto;
  border: 0;
  border-radius: 12px;
  min-height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  cursor: pointer;
  font-weight: 600;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.icon-btn { width: 34px; height: 34px; padding: 0; background: rgba(255,255,255,.08); }
.soft-btn { padding: 10px 12px; background: rgba(255,255,255,.08); }
.launcher-btn { padding: 10px 12px; background: rgba(0,242,255,.12); border: 1px solid rgba(0,242,255,.3); }
.win-go-btn { padding: 10px 12px; background: rgba(0,242,255,.12); }
.icon-btn:active, .win-controls button:active, .dock-bubble:active { transform: scale(.94); }

.win-navrow {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-width: 0;
  padding: 0 16px 10px;
}
.win-urlbar {
  flex: 1 1 auto;
  min-width: 139px;
  padding: 11px 13px;
  border-radius: 13px;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.06);
  color: #fff;
  outline: none;
  font-size: 10px;
}
.win-urlbar::placeholder { color: rgba(255,255,255,.45); }
.win-urlbar:focus {
  border-color: rgba(0,242,255,.45);
  background: rgba(255,255,255,.09);
  box-shadow: 0 0 0 3px rgba(0,242,255,.08);
}

main, #main-content { position: relative; z-index: var(--z-content); }

#stackWrap {
  position: relative;
  width: 100%;
  max-width: 800px;
  min-height: calc(100dvh - var(--topbar-h));
  margin: 0 auto;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--session-gap);
  overflow: visible;
  z-index: var(--z-content);
  isolation: isolate;
}

/* SESSION WINDOW */
.session-window {
  position: relative;
  width: 100%;
  height: calc(100dvh - var(--topbar-h));
  min-height: 0;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: rgba(30,30,35,.40);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: var(--session-radius);
  z-index: var(--z-session);
  transition: height .28s cubic-bezier(.16,1,.3,1), width .28s cubic-bezier(.16,1,.3,1), transform .28s ease, opacity .28s ease;
}

.session-window .win-hdr {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  width: 100%;
  height: var(--header-h);
  min-height: var(--header-h);
  display: flex;
  align-items: center;
  padding: 10px 14px;
  z-index: var(--z-session-header);
  background: transparent;
  user-select: none;
  -webkit-user-select: none;
  pointer-events: none;
  touch-action: manipulation;
  isolation: isolate;
}

.win-controls {
  position: relative;
  z-index: var(--z-session-controls);
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 7px;
  pointer-events: auto;
}
.win-controls button {
  width: 30px;
  height: 30px;
  min-width: 30px;
  min-height: 30px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.10);
  color: #fff;
  cursor: pointer;
  font-family: "Noto Sans Symbols 2", "Noto Sans Symbols", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 17px;
  font-weight: 300;
  line-height: 1;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.win-controls button:hover { background: rgba(255,255,255,.17); }

/* Tab counter button */
.win-controls .tab-counter {
  width: auto;
  min-width: 30px;
  padding: 0 10px;
  border-radius: 20px;
  background: rgba(0,242,255,.15);
  font-size: 12px;
  font-weight: 600;
  color: #7af;
  letter-spacing: 0.3px;
}

.session-window .win-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  border: 0;
  background: transparent;
  z-index: 1;
  display: block;
}

.session-window.collapsed {
  height: var(--collapsed-h) !important;
  min-height: var(--collapsed-h) !important;
  overflow: hidden !important;
}
.session-window.collapsed .win-frame { visibility: hidden; pointer-events: none; }

.session-window.peeked {
  height: var(--peek-h) !important;
  min-height: var(--peek-h) !important;
}
.session-window.peeked .win-frame { visibility: visible; pointer-events: auto; }

.session-window.minimized {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  min-width: 1px !important;
  min-height: 1px !important;
  opacity: 0 !important;
  pointer-events: none !important;
  transform: scale(.90) translateY(50px);
  overflow: hidden !important;
}

.session-window.maximized {
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100dvh !important;
  min-width: 0 !important;
  min-height: 0 !important;
  max-width: none !important;
  max-height: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  overflow: hidden !important;
  z-index: var(--z-maximized) !important;
  transition: none !important;
}
.session-window.maximized .win-hdr {
  position: absolute !important;
  inset: 0 0 auto 0 !important;
  width: 100% !important;
  height: var(--header-h) !important;
  z-index: var(--z-maximized-header) !important;
  pointer-events: none !important;
}
.session-window.maximized .win-controls { pointer-events: auto !important; z-index: var(--z-maximized-controls) !important; }
.session-window.maximized .win-frame {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  z-index: 1 !important;
}

body.has-maximized { overflow: hidden !important; }
body.has-maximized .topbar { pointer-events: none; }
body.has-maximized .session-window.maximized .win-controls,
body.has-maximized .session-window.maximized .win-hdr { pointer-events: auto; }

/* Resize handles */
.session-window .resize-handle {
  position: absolute;
  z-index: var(--z-resize);
  background: transparent;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.session-window .resize-y { left: 0; right: 0; bottom: 0; height: var(--resize-hit); cursor: ns-resize; }
.session-window .resize-x { top: var(--header-h); right: 0; bottom: 0; width: var(--resize-hit); cursor: ew-resize; }
.session-window .resize-corner { right: 0; bottom: 0; width: var(--resize-corner); height: var(--resize-corner); cursor: nwse-resize; }
.session-window .resize-corner::before {
  content: "";
  position: absolute;
  right: 10px;
  bottom: 10px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: rgba(255,255,255,.18);
  border: 1px solid rgba(255,255,255,.25);
  box-shadow: 0 0 14px rgba(0,242,255,.18);
  pointer-events: none;
}
.session-window.maximized .resize-handle { display: none !important; }

.session-window.suspended .win-frame { display: none; }
.session-window.suspended::after {
  content: "⏸";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 2rem;
  opacity: .3;
  pointer-events: none;
}

/* SESSION LIFECYCLE — indicador visual de estado */
.session-window.state-idle { filter: saturate(.82); }
.session-window.state-idle .win-hdr::before {
  content: "";
  position: absolute;
  top: 8px;
  right: 8px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255, 200, 60, .75);
  pointer-events: none;
}
.session-window.state-loading .win-hdr::before {
  content: "";
  position: absolute;
  top: 8px;
  right: 8px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(0, 242, 255, .8);
  animation: session-loading-pulse 1s ease-in-out infinite;
  pointer-events: none;
}
@keyframes session-loading-pulse {
  0%, 100% { opacity: .3; }
  50% { opacity: 1; }
}

/* DOCK */
#dock {
  position: fixed;
  left: var(--dock-offset-x);
  bottom: calc(var(--dock-bottom-gap) + var(--safe-bottom));
  z-index: var(--z-dock);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 12px 10px;
  border-radius: 24px;
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,.1);
}
#dock:empty { opacity: 0; pointer-events: none; }
.dock-bubble {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(255,255,255,.10);
  border: 1px solid rgba(255,255,255,.20);
  color: #fff;
  cursor: pointer;
  font-family: "Noto Sans Symbols 2", "Noto Sans Symbols", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 19px;
  line-height: 1;
  touch-action: manipulation;
}

/* TAB SWITCHER OVERLAY */
.tab-switcher-overlay {
  position: fixed;
  inset: 0;
  z-index: var(--z-tab-switcher);
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(10px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  transition: opacity .25s ease;
}
.tab-switcher-overlay.open {
  display: flex;
  opacity: 1;
}
.tab-switcher-panel {
  background: rgba(30,30,40,0.95);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 32px;
  max-width: 640px;
  width: 100%;
  max-height: 80vh;
  padding: 24px 20px 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  overflow-y: auto;
}
.tab-switcher-panel .panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}
.tab-switcher-panel .panel-header h2 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.tab-switcher-panel .panel-actions {
  display: flex;
  gap: 10px;
}
.tab-switcher-panel .panel-actions button {
  background: rgba(255,255,255,0.08);
  border: 0;
  border-radius: 30px;
  padding: 8px 16px;
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
.tab-switcher-panel .panel-actions button:hover { background: rgba(255,255,255,0.15); }

.tab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}
.tab-card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 18px;
  padding: 14px 12px;
  cursor: pointer;
  transition: background .15s, transform .15s;
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: relative;
}
.tab-card:hover { background: rgba(255,255,255,0.10); transform: scale(1.01); }
.tab-card.active { border-color: #4af; background: rgba(0,150,255,0.12); }
.tab-card .tab-title {
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tab-card .tab-url {
  font-size: 10px;
  opacity: 0.5;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tab-card .tab-close {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 0;
  background: rgba(255,0,0,0.2);
  color: #f66;
  display: grid;
  place-items: center;
  cursor: pointer;
  opacity: 0;
  transition: opacity .15s;
  font-size: 14px;
}
.tab-card:hover .tab-close { opacity: 1; }
.tab-card .tab-close:hover { background: rgba(255,0,0,0.4); }

.tab-card .tab-fav {
  position: absolute;
  top: 6px;
  left: 6px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 0;
  background: transparent;
  color: #fa0;
  display: grid;
  place-items: center;
  cursor: pointer;
  font-size: 14px;
  opacity: 0.4;
  transition: opacity .15s;
}
.tab-card .tab-fav.active { opacity: 1; }
.tab-card .tab-fav:hover { opacity: 1; }

/* Responsive */
@media (max-width: 600px) {
  :root { --session-radius: 22px; --session-gap: 10px; }
  .session-window { width: 100%; }
  .tab-grid { grid-template-columns: 1fr 1fr; }
}
@media (hover:none) and (pointer:coarse) {
  .session-window .resize-corner { width: 58px; height: 58px; }
  .tab-card .tab-close { opacity: 1; }
}
</style>

<script>
(function () {
  'use strict';

  const ROOT = document.documentElement;
  const THEME_KEY = 'dual-theme';

  const stackWrap = document.getElementById('stackWrap');
  const dock = document.getElementById('dock');

  const timers = new Map();
  const sessionStore = new Map();
  const suspendedQueue = [];

  const MAX_SUSPENDED = 5;

  let counter = 1;
  let activeWindow = null;               // referência à janela ativa (para header global)
  const tabDataMap = new WeakMap();      // associa window -> { tabs, activeId }

  /* =======================================================
     SESSION LIFECYCLE MANAGER
     -------------------------------------------------------
     "Session window" (visual) e "iframe vivo" (computacional)
     são desacoplados. A window pode existir só como metadata
     (CREATED/SUSPENDED/CLOSED) sem custo real de app rodando.

     Controle comercial (FREE/PRO/PREMIUM = quanto o usuário
     PODE usar) fica separado do controle computacional
     (ACTIVE/IDLE/SUSPENDED = quanto o dispositivo AGUENTA
     manter vivo ao mesmo tempo).
     ======================================================= */

  const SessionState = {
    CREATED:   'created',
    LOADING:   'loading',
    ACTIVE:    'active',
    IDLE:      'idle',
    SUSPENDED: 'suspended',
    CLOSED:    'closed'
  };

  const Tier = {
    FREE:    'free',
    PRO:     'pro',
    PREMIUM: 'premium'
  };

  const TIER_LIMITS = {
    [Tier.FREE]:    { maxActive: 2, maxSuspended: 3,  maxSessions: 5  },
    [Tier.PRO]:     { maxActive: 4, maxSuspended: 6,  maxSessions: 12 },
    [Tier.PREMIUM]: { maxActive: 8, maxSuspended: 12, maxSessions: 30 }
  };

  const IDLE_AFTER_MS = 45000;         // ACTIVE sem interação → IDLE
  const SUSPEND_AFTER_IDLE_MS = 90000; // IDLE sem interação → SUSPENDED

  let currentTier = Tier.FREE;

  // Metadata por sessão: { state, createdAt, lastActive }
  const sessionMeta = new Map();

  function currentLimits() {
    return TIER_LIMITS[currentTier] || TIER_LIMITS[Tier.FREE];
  }

  function countByStates(...states) {
    let n = 0;
    sessionMeta.forEach(meta => { if (states.includes(meta.state)) n++; });
    return n;
  }

  function setSessionState(id, state) {
    const win = getWin(id);
    const meta = sessionMeta.get(id) || { createdAt: Date.now() };

    meta.state = state;

    if (state === SessionState.ACTIVE || state === SessionState.LOADING) {
      meta.lastActive = Date.now();
    }

    if (state === SessionState.CLOSED) {
      sessionMeta.delete(id);
    } else {
      sessionMeta.set(id, meta);
    }

    if (win) {
      win.dataset.state = state;
      win.classList.remove(
        'state-created', 'state-loading', 'state-active',
        'state-idle', 'state-suspended', 'state-closed'
      );
      win.classList.add('state-' + state);
    }

    window.dispatchEvent(
      new CustomEvent('session:state-change', { detail: { id, state } })
    );
  }

  function getSessionState(id) {
    return sessionMeta.get(id)?.state || null;
  }

  function touchSession(id) {
    const meta = sessionMeta.get(id);
    if (!meta) return;

    meta.lastActive = Date.now();

    if (meta.state === SessionState.IDLE) {
      setSessionState(id, SessionState.ACTIVE);
    }
  }

  // Sessão viva (ACTIVE/IDLE/LOADING) usada há mais tempo,
  // candidata a ser suspensa para liberar orçamento.
  function leastRecentlyActiveSession(excludeId) {
    let oldestId = null;
    let oldestTime = Infinity;

    sessionMeta.forEach((meta, id) => {
      if (id === excludeId) return;

      const win = getWin(id);
      if (win && isMaximized(win)) return; // janela em foco não é vítima

      if (
        meta.state !== SessionState.ACTIVE &&
        meta.state !== SessionState.IDLE &&
        meta.state !== SessionState.LOADING
      ) return;

      const t = meta.lastActive || 0;

      if (t < oldestTime) {
        oldestTime = t;
        oldestId = id;
      }
    });

    return oldestId;
  }

  // Garante que abrir/restaurar uma sessão não estoure o
  // orçamento de sessões computacionalmente vivas do tier atual.
  function enforceActiveBudget(excludeId) {
    const limits = currentLimits();
    let guard = 0;

    while (
      countByStates(
        SessionState.ACTIVE,
        SessionState.LOADING,
        SessionState.IDLE
      ) >= limits.maxActive &&
      guard++ < 50
    ) {
      const victim = leastRecentlyActiveSession(excludeId);
      if (!victim) break;

      suspendSession(victim);
    }
  }

  function setTier(tier) {
    if (!TIER_LIMITS[tier]) return;
    currentTier = tier;
    enforceActiveBudget();
  }

  // Ronda periódica do ciclo de vida.
  setInterval(() => {
    const now = Date.now();

    sessionMeta.forEach((meta, id) => {
      const win = getWin(id);
      if (!win) return;

      if (isMaximized(win)) {
        touchSession(id);
        return;
      }

      if (
        meta.state === SessionState.ACTIVE &&
        now - (meta.lastActive || 0) > IDLE_AFTER_MS
      ) {
        setSessionState(id, SessionState.IDLE);
      }

      else if (
        meta.state === SessionState.IDLE &&
        now - (meta.lastActive || 0) > SUSPEND_AFTER_IDLE_MS
      ) {
        suspendSession(id);
      }
    });
  }, 10000);

  window.SessionLifecycle = {
    States: SessionState,
    Tiers: Tier,

    getState: getSessionState,

    listSessions() {
      return [...sessionMeta.entries()].map(([id, meta]) => ({ id, ...meta }));
    },

    setTier,
    getTier: () => currentTier,

    touch: touchSession,

    suspend: id => suspendSession(id),
    restore: id => restoreSession(id),
    close: id => destroySession(id),

    limits: () => currentLimits()
  };

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

  function getWin(id) { return document.getElementById(id); }
  function isMaximized(win) { return !!win?.classList.contains('maximized'); }

  /* =======================================================
     Z STACK
     ======================================================= */
  const zStack = [];

  function bringToFront(win) {
    if (!win) return;
    const index = zStack.indexOf(win);
    if (index !== -1) zStack.splice(index, 1);
    zStack.push(win);
    zStack.forEach((item, i) => {
      if (!item.classList.contains('maximized')) {
        item.style.zIndex = String(1000 + i * 10);
      }
    });
    // Define como janela ativa para o header global
    setActiveWindow(win);
  }

  /* =======================================================
     ACTIVE WINDOW (para sincronia com header global)
     ======================================================= */
  function setActiveWindow(win) {
    if (activeWindow === win) return;
    activeWindow = win;
    syncGlobalHeader();
  }

  function syncGlobalHeader() {
    const urlInput = document.getElementById('urlInputNav');
    if (!activeWindow) {
      urlInput.value = '';
      return;
    }
    const data = tabDataMap.get(activeWindow);
    if (!data) return;
    const activeTab = data.tabs.find(t => t.id === data.activeId);
    if (activeTab) {
      urlInput.value = activeTab.url || '';
    } else {
      urlInput.value = '';
    }
  }

  /* =======================================================
     TABS MANAGEMENT
     ======================================================= */
  function getTabData(win) {
    if (!tabDataMap.has(win)) {
      // Inicializa com uma aba padrão
      const initialUrl = win.querySelector('.win-frame')?.src || 'https://www.infodose.com.br/splash';
      const tabs = [{ id: 'tab-' + Date.now(), url: initialUrl, title: 'Nova Aba', fav: false }];
      const activeId = tabs[0].id;
      tabDataMap.set(win, { tabs, activeId });
    }
    return tabDataMap.get(win);
  }

  function saveTabs(win) {
    const data = tabDataMap.get(win);
    if (!data) return;
    try {
      localStorage.setItem('dual_tabs_' + win.id, JSON.stringify(data));
    } catch (_) {}
  }

  function loadTabs(win) {
    try {
      const raw = localStorage.getItem('dual_tabs_' + win.id);
      if (raw) {
        const data = JSON.parse(raw);
        if (data && data.tabs && data.tabs.length) {
          tabDataMap.set(win, data);
          return true;
        }
      }
    } catch (_) {}
    return false;
  }

  function getActiveTab(win) {
    const data = tabDataMap.get(win);
    if (!data) return null;
    return data.tabs.find(t => t.id === data.activeId) || data.tabs[0] || null;
  }

  function setActiveTab(win, tabId) {
    const data = tabDataMap.get(win);
    if (!data) return;
    const exists = data.tabs.some(t => t.id === tabId);
    if (!exists) return;
    data.activeId = tabId;
    saveTabs(win);
    renderTabCounter(win);
    syncGlobalHeader();
    // Atualiza o iframe com a URL da nova aba ativa
    const frame = win.querySelector('.win-frame');
    const tab = getActiveTab(win);
    if (frame && tab) {
      frame.src = tab.url || 'about:blank';
    }
  }

  function addTab(win, url = '') {
    const data = tabDataMap.get(win);
    if (!data) return;
    const newTab = {
      id: 'tab-' + Date.now(),
      url: url || 'https://www.infodose.com.br/splash',
      title: url ? url.replace(/^https?:\/\//, '').split('/')[0] : 'Nova Aba',
      fav: false
    };
    data.tabs.push(newTab);
    data.activeId = newTab.id;
    saveTabs(win);
    renderTabCounter(win);
    syncGlobalHeader();
    // Atualiza iframe
    const frame = win.querySelector('.win-frame');
    if (frame) frame.src = newTab.url;
    // Fecha switcher se estiver aberto
    closeTabSwitcher();
  }

  function removeTab(win, tabId) {
    const data = tabDataMap.get(win);
    if (!data || data.tabs.length <= 1) return; // mantém pelo menos uma aba
    const index = data.tabs.findIndex(t => t.id === tabId);
    if (index === -1) return;
    data.tabs.splice(index, 1);
    if (data.activeId === tabId) {
      data.activeId = data.tabs[Math.min(index, data.tabs.length - 1)].id;
    }
    saveTabs(win);
    renderTabCounter(win);
    syncGlobalHeader();
    // Atualiza iframe
    const frame = win.querySelector('.win-frame');
    const active = getActiveTab(win);
    if (frame && active) frame.src = active.url;
    // Re-renderiza switcher se aberto
    if (document.getElementById('tabSwitcherOverlay').classList.contains('open')) {
      renderTabSwitcher(win);
    }
  }

  function updateTabUrl(win, tabId, newUrl) {
    const data = tabDataMap.get(win);
    if (!data) return;
    const tab = data.tabs.find(t => t.id === tabId);
    if (!tab) return;
    tab.url = newUrl;
    tab.title = newUrl.replace(/^https?:\/\//, '').split('/')[0] || 'Nova Aba';
    saveTabs(win);
    syncGlobalHeader();
    // Atualiza iframe se for a aba ativa
    if (data.activeId === tabId) {
      const frame = win.querySelector('.win-frame');
      if (frame) frame.src = newUrl;
    }
    if (document.getElementById('tabSwitcherOverlay').classList.contains('open')) {
      renderTabSwitcher(win);
    }
  }

  function toggleFav(win, tabId) {
    const data = tabDataMap.get(win);
    if (!data) return;
    const tab = data.tabs.find(t => t.id === tabId);
    if (!tab) return;
    tab.fav = !tab.fav;
    saveTabs(win);
    if (document.getElementById('tabSwitcherOverlay').classList.contains('open')) {
      renderTabSwitcher(win);
    }
  }

  function renderTabCounter(win) {
    const data = tabDataMap.get(win);
    if (!data) return;
    const btn = win.querySelector('.tab-counter');
    if (btn) btn.textContent = data.tabs.length;
  }

  /* =======================================================
     TAB SWITCHER UI (global overlay)
     ======================================================= */
  let currentSwitcherWin = null;

  function openTabSwitcher(win) {
    currentSwitcherWin = win;
    const overlay = document.getElementById('tabSwitcherOverlay');
    const title = document.getElementById('tabSwitcherTitle');
    title.textContent = 'Abas — ' + (win.querySelector('.win-title')?.textContent || 'janela');
    renderTabSwitcher(win);
    overlay.classList.add('open');
    // Fecha ao clicar fora do painel
    overlay.onclick = function(e) {
      if (e.target === overlay) closeTabSwitcher();
    };
  }

  function closeTabSwitcher() {
    document.getElementById('tabSwitcherOverlay').classList.remove('open');
    currentSwitcherWin = null;
  }

function renderTabSwitcher(win) {
  const grid = document.getElementById('tabGrid');
  const data = tabDataMap.get(win);

  if (!data) {
    grid.innerHTML = `
      <div class="tab-empty">
        <div class="tab-empty-icon">◌</div>
        <div class="tab-empty-title">Nenhuma aba</div>
        <div class="tab-empty-text">Abra uma nova aba para começar.</div>
      </div>
    `;
    return;
  }

  grid.innerHTML = '';

  data.tabs.forEach(tab => {
    const card = document.createElement('div');

    card.className =
      'tab-card' +
      (tab.id === data.activeId ? ' active' : '');

    card.dataset.tabId = tab.id;

    card.innerHTML = `
      <div class="tab-card-inner">

        <div class="tab-card-main">

          <div class="tab-card-head">
            <div class="tab-favicon">
              ${tab.favicon || '◉'}
            </div>

            <div class="tab-card-info">
              <div class="tab-title">
                ${tab.title || 'Nova Aba'}
              </div>

              <div class="tab-url">
                ${tab.url || ''}
              </div>
            </div>

          </div>

          <div class="tab-status">
            ${tab.id === data.activeId
              ? '<span class="tab-active-dot"></span> Ativa'
              : ''}
          </div>

        </div>

        <div class="tab-card-actions">

          <button
            type="button"
            class="tab-action tab-fav ${tab.fav ? 'active' : ''}"
            data-tabid="${tab.id}"
            title="${tab.fav ? 'Remover favorito' : 'Favoritar aba'}"
            aria-label="${tab.fav ? 'Remover favorito' : 'Favoritar aba'}"
          >
            ${tab.fav ? '★' : '☆'}
          </button>

          <button
            type="button"
            class="tab-action tab-close"
            data-tabid="${tab.id}"
            title="Fechar aba"
            aria-label="Fechar aba"
          >
            ×
          </button>

        </div>

      </div>
    `;

    /* =========================================
       ABRIR / ATIVAR ABA
       ========================================= */

    card.addEventListener('click', function (e) {
      if (
        e.target.closest('.tab-close') ||
        e.target.closest('.tab-fav')
      ) {
        return;
      }

      setActiveTab(win, tab.id);
      closeTabSwitcher();
    });

    /* =========================================
       FECHAR ABA
       ========================================= */

    const closeBtn = card.querySelector('.tab-close');

    closeBtn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();

      removeTab(win, tab.id);
    });

    /* =========================================
       FAVORITO
       ========================================= */

    const favBtn = card.querySelector('.tab-fav');

    favBtn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();

      toggleFav(win, tab.id);
    });

    grid.appendChild(card);
  });
}

  /* =======================================================
     SHELL STATE
     ======================================================= */
  function syncShell() {
    const maximized = !!document.querySelector('.session-window.maximized:not(.minimized)');
    document.body.classList.toggle('has-maximized', maximized);
    document.body.classList.toggle('ui-immersive', maximized);
  }

  /* =======================================================
     SUSPEND / RESTORE / DESTROY (adaptado para preservar abas)
     ======================================================= */
  function suspendSession(id) {
    const win = getWin(id);
    if (!win) return;
    const frame = win.querySelector('.win-frame');
    if (!frame) return;
    // Salva a URL atual no objeto de dados (já está salvo)
    sessionStore.set(id, { url: frame.src });
    frame.remove();
    win.dataset.suspended = 'true';
    win.classList.add('suspended');
    setSessionState(id, SessionState.SUSPENDED);
    if (!suspendedQueue.includes(id)) suspendedQueue.push(id);
    while (suspendedQueue.length > MAX_SUSPENDED) {
      const oldest = suspendedQueue.shift();
      destroySession(oldest);
    }
  }

  function restoreSession(id) {
    const win = getWin(id);
    if (!win) return;
    const data = sessionStore.get(id);
    if (!data) return;

    // Restaurar um iframe é reativar consumo real de recurso:
    // antes de reviver, garante orçamento (pode suspender outra
    // sessão ociosa para abrir espaço para esta).
    enforceActiveBudget(id);
    setSessionState(id, SessionState.LOADING);

    const frame = document.createElement('iframe');
    frame.className = 'win-frame';
    frame.dataset.runtime = 'nav';
    frame.addEventListener(
      'load',
      () => setSessionState(id, SessionState.ACTIVE),
      { once: true }
    );
    frame.src = data.url;
    win.appendChild(frame);
    win.dataset.suspended = 'false';
    win.classList.remove('suspended');
    sessionStore.delete(id);
    const index = suspendedQueue.indexOf(id);
    if (index !== -1) suspendedQueue.splice(index, 1);
  }

  function destroySession(id) {
    const win = getWin(id);
    setSessionState(id, SessionState.CLOSED);
    document.getElementById('dock-' + id)?.remove();
    win?.remove();
    sessionStore.delete(id);
    const index = suspendedQueue.indexOf(id);
    if (index !== -1) suspendedQueue.splice(index, 1);
    tabDataMap.delete(win);
    syncShell();
    if (activeWindow === win) setActiveWindow(null);
  }

  /* =======================================================
     COLLAPSE / PEEK / MAXIMIZE / MINIMIZE (mantidos)
     ======================================================= */
  function toggleCollapse(id) {
    const win = getWin(id);
    if (!win) return;
    if (isMaximized(win)) {
      win.classList.remove('maximized');
      win.style.zIndex = '';
      syncShell();
    }
    win.classList.toggle('collapsed');
    win.classList.remove('peeked');
    if (win.classList.contains('collapsed')) {
      if (win.dataset.suspended === 'true') restoreSession(id);
    }
    bringToFront(win);
    syncShell();
  }

  function togglePeek(id) {
    const win = getWin(id);
    if (!win) return;
    if (isMaximized(win)) {
      win.classList.remove('maximized');
      win.style.zIndex = '';
      syncShell();
    }
    win.classList.toggle('peeked');
    if (win.classList.contains('peeked')) {
      win.classList.remove('collapsed');
      if (win.dataset.suspended === 'true') restoreSession(id);
    }
    bringToFront(win);
    syncShell();
  }

  function maximizeWindow(id) {
    const win = getWin(id);
    if (!win) return;
    if (isMaximized(win)) {
      win.classList.remove('maximized');
      win.style.zIndex = '';
      if (win.dataset.suspended === 'true') restoreSession(id);
      bringToFront(win);
      syncShell();
      return;
    }
    win.classList.remove('collapsed', 'peeked', 'minimized', 'header-hidden', 'resizing');
    ['top','left','right','bottom','width','height','maxWidth','maxHeight'].forEach(p => win.style[p] = '');
    if (win.dataset.suspended === 'true') restoreSession(id);
    win.classList.add('maximized');
    win.style.zIndex = '94000';
    bringToFront(win);
    syncShell();
  }

  function minimizeWindow(id) {
    const win = getWin(id);
    if (!win) return;
    timers.delete(id);
    win.classList.remove('maximized', 'collapsed', 'peeked', 'header-hidden', 'resizing');
    syncShell();
    suspendSession(id);
    win.classList.add('minimized');
    document.getElementById('dock-' + id)?.remove();
    const bubble = document.createElement('button');
    bubble.type = 'button';
    bubble.className = 'dock-bubble';
    bubble.id = 'dock-' + id;
    bubble.title = 'Restaurar janela';
    bubble.setAttribute('aria-label', 'Restaurar janela');
    bubble.textContent = '۞';
    bubble.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      win.classList.remove('minimized');
      if (win.dataset.suspended === 'true') restoreSession(id);
      bringToFront(win);
      requestAnimationFrame(() => { bringToFront(win); syncShell(); });
      bubble.remove();
    });
    dock?.appendChild(bubble);
    syncShell();
  }

  function closeWindow(id) {
    destroySession(id);
  }

  /* =======================================================
     HEADER CLICK (para foco)
     ======================================================= */
  function handleHeaderClick(e, id) {
    if (e.target.closest('.win-controls') || e.target.closest('button') || e.target.closest('input') || e.target.closest('.win-navrow')) {
      return;
    }
    const win = getWin(id);
    if (!win) return;
    bringToFront(win);
    const old = timers.get(id);
    if (old) {
      clearTimeout(old);
      timers.delete(id);
      maximizeWindow(id);
      return;
    }
    const timer = setTimeout(() => {
      timers.delete(id);
      togglePeek(id);
    }, 250);
    timers.set(id, timer);
  }

  /* =======================================================
     RESIZE (mantido)
     ======================================================= */
  function makeResizeHandles(win) {
    if (win.dataset.resizeReady === '1') return;
    win.dataset.resizeReady = '1';
    const hy = document.createElement('div');
    hy.className = 'resize-handle resize-y';
    const hx = document.createElement('div');
    hx.className = 'resize-handle resize-x';
    const hc = document.createElement('div');
    hc.className = 'resize-handle resize-corner';
    win.append(hy, hx, hc);
    bindResizeY(win, hy);
    bindResizeX(win, hx);
    bindResizeCorner(win, hc);
  }

  function freeFromMaximize(win, rect) {
    if (isMaximized(win)) {
      win.classList.remove('maximized');
      win.style.position = 'fixed';
      win.style.left = Math.max(0, rect.left) + 'px';
      win.style.top = Math.max(0, rect.top) + 'px';
      win.style.right = 'auto';
      win.style.bottom = 'auto';
      win.style.width = Math.min(rect.width, window.innerWidth) + 'px';
      win.style.height = Math.min(rect.height, window.innerHeight) + 'px';
      win.style.maxWidth = 'none';
      win.style.maxHeight = 'none';
      if (win.dataset.suspended === 'true') restoreSession(win.id);
    }
    win.classList.remove('collapsed', 'peeked');
    win.classList.add('resizing');
    syncShell();
  }

  function finishResize(win) {
    win.classList.remove('resizing');
    syncShell();
  }

  function bindResizeY(win, handle) {
    let active = false, pointerId = null, startY = 0, startH = 0;
    handle.addEventListener('pointerdown', function(e) {
      if (e.button != null && e.button !== 0) return;
      const rect = win.getBoundingClientRect();
      active = true; pointerId = e.pointerId;
      startY = e.clientY; startH = rect.height;
      freeFromMaximize(win, rect);
      handle.setPointerCapture?.(pointerId);
      e.preventDefault();
      const move = ev => {
        if (!active || ev.pointerId !== pointerId) return;
        ev.preventDefault();
        const next = Math.max(44, Math.min(window.innerHeight, startH + (ev.clientY - startY)));
        win.style.height = next + 'px';
      };
      const up = ev => {
        if (ev && ev.pointerId !== pointerId) return;
        active = false;
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        window.removeEventListener('pointercancel', up);
        finishResize(win);
      };
      window.addEventListener('pointermove', move, { passive: false });
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
    }, { passive: false });
  }

  function bindResizeX(win, handle) {
    let active = false, pointerId = null, startX = 0, startW = 0;
    handle.addEventListener('pointerdown', function(e) {
      if (e.button != null && e.button !== 0) return;
      const rect = win.getBoundingClientRect();
      active = true; pointerId = e.pointerId;
      startX = e.clientX; startW = rect.width;
      freeFromMaximize(win, rect);
      handle.setPointerCapture?.(pointerId);
      e.preventDefault();
      const move = ev => {
        if (!active || ev.pointerId !== pointerId) return;
        ev.preventDefault();
        const next = Math.max(280, Math.min(window.innerWidth, startW + (ev.clientX - startX)));
        win.style.width = next + 'px';
      };
      const up = ev => {
        if (ev && ev.pointerId !== pointerId) return;
        active = false;
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        window.removeEventListener('pointercancel', up);
        finishResize(win);
      };
      window.addEventListener('pointermove', move, { passive: false });
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
    }, { passive: false });
  }

  function bindResizeCorner(win, handle) {
    let active = false, pointerId = null, startX = 0, startY = 0, startW = 0, startH = 0;
    handle.addEventListener('pointerdown', function(e) {
      if (e.button != null && e.button !== 0) return;
      const rect = win.getBoundingClientRect();
      active = true; pointerId = e.pointerId;
      startX = e.clientX; startY = e.clientY;
      startW = rect.width; startH = rect.height;
      freeFromMaximize(win, rect);
      handle.setPointerCapture?.(pointerId);
      e.preventDefault();
      const move = ev => {
        if (!active || ev.pointerId !== pointerId) return;
        ev.preventDefault();
        const width = Math.max(280, Math.min(window.innerWidth, startW + (ev.clientX - startX)));
        const height = Math.max(44, Math.min(window.innerHeight, startH + (ev.clientY - startY)));
        win.style.width = width + 'px';
        win.style.height = height + 'px';
      };
      const up = ev => {
        if (ev && ev.pointerId !== pointerId) return;
        active = false;
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        window.removeEventListener('pointercancel', up);
        finishResize(win);
      };
      window.addEventListener('pointermove', move, { passive: false });
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
    }, { passive: false });
  }

  /* =======================================================
     WIRE SESSION (com tabs)
     ======================================================= */
  function wireSession(win) {
    if (!win || win.dataset.wired === '1') return;
    win.dataset.wired = '1';

    // Qualquer interação real na sessão conta como sinal de uso —
    // tira do estado IDLE e adia o próximo auto-suspend.
    win.addEventListener(
      'pointerdown',
      () => touchSession(win.id),
      { passive: true }
    );

    // Inicializa dados de abas (carrega do localStorage ou cria default)
    if (!loadTabs(win)) {
      // fallback: cria a partir do iframe existente
      const frame = win.querySelector('.win-frame');
      const src = frame ? frame.src : 'https://www.infodose.com.br/splash';
      const tabs = [{ id: 'tab-' + Date.now(), url: src, title: src.replace(/^https?:\/\//, '').split('/')[0] || 'Nova Aba', fav: false }];
      tabDataMap.set(win, { tabs, activeId: tabs[0].id });
      saveTabs(win);
    }
    renderTabCounter(win);

    makeResizeHandles(win);

    const header = $('.win-hdr', win);
    header?.addEventListener('click', e => handleHeaderClick(e, win.id));

    const controls = $('.win-controls', win);
    controls?.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      const btn = e.target.closest('button');
      if (!btn) return;
      const action = btn.dataset.action;
      if (action === 'collapse') toggleCollapse(win.id);
      else if (action === 'maximize') maximizeWindow(win.id);
      else if (action === 'minimize') minimizeWindow(win.id);
      else if (action === 'close') closeWindow(win.id);
      else if (action === 'tab-switcher') openTabSwitcher(win);
    });

    // Navegação local (dentro da janela)
    const input = $('.win-urlbar', win);
    const go = $('.win-go-btn', win);
    go?.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      if (!input) return;
      let url = input.value.trim();
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      const activeTab = getActiveTab(win);
      if (activeTab) {
        updateTabUrl(win, activeTab.id, url);
      }
      input.value = url;
    });
    input?.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.stopPropagation();
        go?.click();
      }
    });

    // Sincroniza com o iframe (quando carregar, atualiza título)
    const frame = win.querySelector('.win-frame');
    frame?.addEventListener('load', function() {
      try {
        const doc = this.contentDocument;
        if (doc && doc.title) {
          const data = tabDataMap.get(win);
          const active = getActiveTab(win);
          if (active) {
            active.title = doc.title;
            saveTabs(win);
          }
        }
      } catch (_) {}
      // Atualiza URL no input local e global
      if (this.src) {
        const data = tabDataMap.get(win);
        const active = getActiveTab(win);
        if (active && active.url !== this.src) {
          active.url = this.src;
          saveTabs(win);
        }
        const localInput = win.querySelector('.win-urlbar');
        if (localInput) localInput.value = this.src;
        syncGlobalHeader();
      }
    });

    // Traz para frente ao clicar no frame (se não estiver maximizado)
    frame?.addEventListener('click', function() {
      if (!win.classList.contains('maximized')) {
        bringToFront(win);
      }
    });

    // Se a janela já estiver criada com um iframe, garante que a aba ativa tenha a URL correta
    const active = getActiveTab(win);
    if (frame && active && frame.src !== active.url) {
      frame.src = active.url;
    }
    if (frame && active) {
      // atualiza input local
      const localInput = win.querySelector('.win-urlbar');
      if (localInput) localInput.value = active.url;
    }

    // Se esta é a primeira janela, define como ativa
    if (!activeWindow) setActiveWindow(win);
  }

  /* =======================================================
     CRIAÇÃO DE NOVA JANELA (com abas)
     ======================================================= */
  function createSessionWindow({ title = '//', src = 'https://www.infodose.com.br' } = {}) {
    const id = 'session-' + Date.now() + '-' + counter++;
    const win = document.createElement('section');
    win.className = 'session-window peeked';
    win.id = id;
    win.innerHTML = `
      <div class="win-hdr">
        <div class="win-controls">
          <button type="button" data-action="collapse" title="Colapsar" aria-label="Colapsar">−</button>
          <button type="button" data-action="tab-switcher" class="tab-counter">1</button>
          <button type="button" data-action="maximize" title="Maximizar" aria-label="Maximizar">⛶</button>
          <button type="button" data-action="minimize" title="Minimizar" aria-label="Minimizar">۞</button>
          <button type="button" data-action="close" title="Fechar" aria-label="Fechar">×</button>
        </div>
        <div class="win-navrow" style="flex:2;min-width:0;pointer-events:auto;">
          <input class="win-urlbar" type="text" value="${src}" placeholder="Digite uma URL..." spellcheck="false" autocomplete="off">
          <button class="win-go-btn" type="button">Go</button>
        </div>
      </div>
      <iframe class="win-frame" data-runtime="nav" src="${src}"></iframe>
    `;
    stackWrap.appendChild(win);

    setSessionState(id, SessionState.CREATED);

    // Nova sessão nasce pedindo um "slot ativo" — se o orçamento
    // do tier já estiver cheio, uma sessão ociosa é suspensa antes.
    enforceActiveBudget(id);
    setSessionState(id, SessionState.LOADING);

    const newFrame = win.querySelector('.win-frame');
    newFrame?.addEventListener(
      'load',
      () => setSessionState(id, SessionState.ACTIVE),
      { once: true }
    );

    wireSession(win);
    bringToFront(win);
    return id;
  }

  /* =======================================================
     THEME
     ======================================================= */
  function applyTheme(theme) {
    const next = theme === 'light' ? 'light' : 'dark';
    ROOT.dataset.theme = next;
    try { localStorage.setItem(THEME_KEY, next); } catch (_) {}
    $$('.theme-dot').forEach(btn => {
      if (btn.textContent.includes('☀') || btn.textContent.includes('🌙')) {
        btn.textContent = next === 'light' ? '☀️' : '🌙';
      }
    });
    window.dispatchEvent(new CustomEvent('dual:theme-change', { detail: { theme: next } }));
  }
  function getInitialTheme() {
    try { const saved = localStorage.getItem(THEME_KEY); if (saved === 'light' || saved === 'dark') return saved; } catch (_) {}
    return 'dark';
  }
  window.DualTheme = {
    set: applyTheme,
    toggle() { applyTheme(ROOT.dataset.theme === 'light' ? 'dark' : 'light'); },
    get() { return ROOT.dataset.theme || 'dark'; }
  };

  $$('.theme-dot').forEach(btn => {
    btn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); DualTheme.toggle(); });
  });
  applyTheme(getInitialTheme());

  /* =======================================================
     HEADER GLOBAL NAVEGAÇÃO (com janela ativa)
     ======================================================= */
  const navInput = document.getElementById('urlInputNav');
  const goNavBtn = document.getElementById('goNavBtn');
  const favBtn = document.getElementById('favBtn');

  function applyGlobalUrl() {
    if (!navInput || !activeWindow) return;
    let url = navInput.value.trim();
    if (!url) return;
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    const activeTab = getActiveTab(activeWindow);
    if (activeTab) {
      updateTabUrl(activeWindow, activeTab.id, url);
    }
    navInput.value = url;
  }

  navInput?.addEventListener('keydown', e => { if (e.key === 'Enter') applyGlobalUrl(); });
  goNavBtn?.addEventListener('click', applyGlobalUrl);

  // Favoritar aba atual
  favBtn?.addEventListener('click', function() {
    if (!activeWindow) return;
    const activeTab = getActiveTab(activeWindow);
    if (activeTab) {
      toggleFav(activeWindow, activeTab.id);
    }
  });

  // Atualiza o header global quando a URL da aba ativa muda (já chamado em updateTabUrl)
  // Mas também precisamos atualizar quando o iframe carrega
  // Já temos no load do frame.

  /* =======================================================
     BOTÃO NOVA ABA (no switcher)
     ======================================================= */
  document.getElementById('newTabBtn')?.addEventListener('click', function() {
    if (currentSwitcherWin) {
      addTab(currentSwitcherWin);
    }
  });

  document.getElementById('closeTabSwitcher')?.addEventListener('click', closeTabSwitcher);

  /* =======================================================
     CRIAÇÃO DE NOVA JANELA VIA BOTÃO +
     ======================================================= */
  document.getElementById('openKobBtn')?.addEventListener('click', () => createSessionWindow());

  /* =======================================================
     HEADER GLOBAL COLLAPSE (conteúdo)
     ======================================================= */
  const HEADER = document.getElementById('main-header');
  const MAIN = document.getElementById('main-content');
  HEADER?.addEventListener('click', e => {
    if (e.target.closest('button') || e.target.closest('input') || e.target.closest('.win-navrow') || e.target.closest('.theme-dot')) return;
    MAIN?.classList.toggle('hidden');
    const collapsed = MAIN?.classList.contains('hidden');
    HEADER.classList.toggle('is-collapsed', collapsed);
    window.dispatchEvent(new CustomEvent('dual:content-collapse', { detail: { collapsed } }));
  });

  /* =======================================================
     SMART SCROLL (header)
     ======================================================= */
  let lastScrollY = window.scrollY, ticking = false;
  const SCROLL_THRESHOLD = 8;
  function updateHeader() {
    if (!HEADER) return;
    const current = window.scrollY;
    if (current <= 10) {
      HEADER.classList.remove('header-hidden');
      HEADER.classList.add('header-visible');
      lastScrollY = current; ticking = false; return;
    }
    if (current > lastScrollY + SCROLL_THRESHOLD) {
      HEADER.classList.remove('header-visible');
      HEADER.classList.add('header-hidden');
    } else if (current < lastScrollY - SCROLL_THRESHOLD) {
      HEADER.classList.remove('header-hidden');
      HEADER.classList.add('header-visible');
    }
    lastScrollY = current; ticking = false;
  }
  window.addEventListener('scroll', () => { if (!ticking) { requestAnimationFrame(updateHeader); ticking = true; } }, { passive: true });

  /* =======================================================
     INICIALIZAÇÃO DAS JANELAS EXISTENTES
     ======================================================= */
  $$('.session-window').forEach(win => {
    wireSession(win);

    // Sessões já presentes no markup inicial entram direto como
    // ACTIVE se já têm iframe vivo, ou CREATED caso contrário.
    const hasFrame = !!win.querySelector('.win-frame');
    setSessionState(
      win.id,
      hasFrame ? SessionState.ACTIVE : SessionState.CREATED
    );

    // Se for a primeira, ativa
    if (!activeWindow) setActiveWindow(win);
  });

  // Sincroniza o header global com a janela ativa inicial
  syncGlobalHeader();

  syncShell();

  /* =======================================================
     DEBUG / API
     ======================================================= */
  window.createSessionWindow = createSessionWindow;
  window.togglePeek = togglePeek;
  window.toggleCollapse = toggleCollapse;
  window.maximizeWindow = maximizeWindow;
  window.minimizeWindow = minimizeWindow;
  window.closeWindow = closeWindow;
  window.syncShellMode = syncShell;

  console.log('🚀 Almasliber OS — Unified Core com Abas e Persistência carregado.');

})();
</script>

<style>
:root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;height:100%;width:100vw;display:flex;flex-direction:column;}
.glass{background:rgba(0,0,0,.18);}
.glass-panel{background:rgba(40,40,40,.17);}
.app-view{position:absolute;inset:0;transition:transform.3s cubic-bezier(.25,.8,.25,1),opacity.3s ease;transform:scale(.95) translateY(20px);opacity:0;pointer-events:none}
.app-view.active{transform:scale(1) translateY(0);opacity:1;pointer-events:auto}
iframe{background:var(--bg);width:100%;height:99dvh;border:none}
#boot-screen{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity.8s ease-out}
.safe-pt{padding-top:var(--safe-top)}.safe-pb{padding-bottom:var(--safe-bottom)}
.btn{border:none;background:rgba(255,255,255,.1);color:#fff;padding:8px 12px;border-radius:10px;cursor:pointer;font-size:12px}
.btn:active{background:rgba(255,255,255,.2)}
.btn-primary{background:#0A84FF;color:#fff;border-radius:12px;padding:10px 16px;font-weight:700}
.dock-nav{position:absolute;bottom:0;width:100%;z-index:21;padding-bottom:var(--safe-bottom);padding-left:16px;padding-right:16px;padding-bottom:20px;pointer-events:none}
.dock-nav-inner{margin:0 auto;max-width:360px;border-radius:28px;height:64px;display:flex;align-items:center;justify-content:space-around;padding:0 8px;pointer-events:auto}
.icon-btn{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:#9CA3AF;font-size:22px;cursor:pointer}
.icon-btn:active{background:rgba(255,255,255,.1);color:#fff}
.home4{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;padding-top:80px;padding-bottom:96px;padding-left:24px;padding-right:24px;background:var(--bg);overflow-y:auto}
.grid-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 16px}
.app-tile{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.app-icon{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:32px;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.app-icon:active{transform:scale(.9)}
.app-name{font-size:11px;color:#E5E7EB}
.topbar-mtlx{display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:calc(78px + var(--safe-top))}
.addr{flex:1;display:flex;align-items:center;background:rgba(255,255,255,.1);border-radius:12px;padding:8px 12px;border:1px solid rgba(255,255,255,.05)}
.addr input{background:transparent;border:none;outline:none;width:100%;color:#fff;font-size:13px}
.tab-badge{width:32px;height:32px;border-radius:10px;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;font-size:11px;font-weight:800}
#popup-layer{position:absolute;inset:0;z-index:100;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity.3s}
#popup-box{width:100%;max-width:360px;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px;transform:scale(.95);transition:transform.3s}
#tabs-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
::-webkit-scrollbar{display:none}
</style>

<script>
const OS={
state:{activeApp:'home',booted:false},
Storage:{prefix:'kodux_',save(k,d){try{localStorage.setItem(this.prefix+k,JSON.stringify(d))}catch(e){}},load(k,def=null){try{const i=localStorage.getItem(this.prefix+k);return i?JSON.parse(i):def}catch(e){return def}},remove(k){localStorage.removeItem(this.prefix+k)}},
Popup:{show(title,html,buttons=[]){const layer=document.getElementById('popup-layer'),box=document.getElementById('popup-box'),t=document.getElementById('popup-title'),b=document.getElementById('popup-body'),a=document.getElementById('popup-actions');t.innerText=title;b.innerHTML=html;a.innerHTML='';if(!buttons.length)buttons=[{text:'OK',type:'primary',onClick:()=>OS.Popup.hide()}];buttons.forEach(btn=>{const el=document.createElement('button');el.innerText=btn.text;el.className=btn.type==='primary'?'btn-primary':'btn';el.style.flex='1';el.onclick=()=>{if(btn.onClick)btn.onClick();};a.appendChild(el)});layer.style.display='flex';requestAnimationFrame(()=>{layer.style.opacity='1';box.style.transform='scale(1)'})},hide(){const layer=document.getElementById('popup-layer'),box=document.getElementById('popup-box');layer.style.opacity='0';box.style.transform='scale(.95)';setTimeout(()=>layer.style.display='none',300)},prompt(title,ph,cb){const html=`<input type="text" id="popup-input" style="width:100%;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px;color:#fff;outline:none;margin-top:8px" placeholder="${ph}">`;this.show(title,html,[{text:'Cancelar',type:'secondary',onClick:()=>this.hide()},{text:'Confirmar',type:'primary',onClick:()=>{const v=document.getElementById('popup-input').value;cb(v);this.hide()}}]);setTimeout(()=>document.getElementById('popup-input').focus(),100)}},
TabEngine:{tabs:[],activeTabId:null,init(){this.tabs=OS.Storage.load('tabs',[]);if(!this.tabs.length)this.createTab();else{this.activeTabId=this.tabs[0].id;this.renderActiveTab()}this.updateUI()},createTab(url=''){const id='tab_'+Date.now();this.tabs.push({id,url,title:'Nova Aba'});this.activeTabId=id;this.saveState();this.renderActiveTab();this.updateUI();OS.UI.openApp('browser')},closeTab(id){this.tabs=this.tabs.filter(t=>t.id!==id);const ifr=document.getElementById(`iframe_${id}`);if(ifr)ifr.remove();if(!this.tabs.length)this.createTab();else if(this.activeTabId===id){this.activeTabId=this.tabs[this.tabs.length-1].id;this.renderActiveTab()}this.saveState();this.renderSwitcherGrid();this.updateUI()},switchTab(id){this.activeTabId=id;this.renderActiveTab();this.hideTabSwitcher();this.updateUI()},saveState(){OS.Storage.save('tabs',this.tabs)},renderActiveTab(){const c=document.getElementById('iframe-container'),e=document.getElementById('browser-empty-state'),addr=document.getElementById('address-bar');c.querySelectorAll('iframe').forEach(f=>f.style.display='none');const t=this.tabs.find(x=>x.id===this.activeTabId);if(!t)return;addr.value=t.url;if(!t.url)e.style.display='flex';else{e.style.display='none';let ifr=document.getElementById(`iframe_${t.id}`);if(!ifr){ifr=document.createElement('iframe');ifr.id=`iframe_${t.id}`;ifr.sandbox="allow-scripts allow-same-origin allow-forms allow-popups";ifr.src=t.url;ifr.onload=()=>{try{t.title=ifr.contentDocument.title||t.url}catch{ t.title=t.url.replace(/^https?:\/\//,'').split('/')[0]}this.saveState()};c.appendChild(ifr)}ifr.style.display='block'}},updateActiveTabUrl(url){const t=this.tabs.find(x=>x.id===this.activeTabId);if(t){t.url=url;t.title=url;const old=document.getElementById(`iframe_${t.id}`);if(old)old.remove();this.saveState();this.renderActiveTab()}},updateUI(){document.getElementById('tab-count').innerText=this.tabs.length},showTabSwitcher(){this.renderSwitcherGrid();document.getElementById('tab-switcher').classList.add('active')},hideTabSwitcher(){document.getElementById('tab-switcher').classList.remove('active')},renderSwitcherGrid(){const g=document.getElementById('tabs-grid');g.innerHTML='';this.tabs.forEach(tab=>{const is=tab.id===this.activeTabId;const el=document.createElement('div');el.className=`glass-panel`;el.style.cssText=`border-radius:16px;padding:12px;display:flex;flex-direction:column;height:160px;position:relative;${is?'outline:2px solid #0A84FF':''}`;el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:11px;font-weight:700;color:#D1D5DB;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:24px">${tab.title||'Nova Aba'}</span><button onclick="event.stopPropagation();OS.TabEngine.closeTab('${tab.id}')" style="position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:99px;background:rgba(239,68,68,.2);color:#F87171;border:none">×</button></div><div style="flex:1;background:rgba(255,255,255,.05);border-radius:12px;display:grid;place-items:center;cursor:pointer" onclick="OS.TabEngine.switchTab('${tab.id}')"><span style="font-size:28px">◍</span></div>`;g.appendChild(el)})},newTab(){this.createTab();this.hideTabSwitcher()}},
Browser:{navigate(e){e.preventDefault();let url=document.getElementById('address-bar').value.trim();if(!url)return;if(!/^https?:\/\//i.test(url)){if(url.includes('.')&&!url.includes(' '))url='https://'+url;else url='https://www.bing.com/search?q='+encodeURIComponent(url)}OS.TabEngine.updateActiveTabUrl(url)},reload(){const t=OS.TabEngine.tabs.find(x=>x.id===OS.TabEngine.activeTabId);if(t&&t.url){const ifr=document.getElementById(`iframe_${t.id}`);if(ifr)ifr.src=ifr.src}},loadUrl(url){document.getElementById('address-bar').value=url;OS.TabEngine.updateActiveTabUrl(url)}},
Plugins:{list:[],init(){this.list=OS.Storage.load('plugins',[]);this.renderList();this.executeAll()},promptInstall(){const html=`<p style="text-align:left;font-size:11px;margin-bottom:6px">Código JS do plugin:</p><textarea id="plugin-code" style="width:100%;height:96px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px;color:#fff;font-family:monospace;font-size:11px;outline:none" placeholder="OS.Popup.show('Hello','Plugin rodando!')"></textarea><input type="text" id="plugin-name" style="width:100%;margin-top:8px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px;color:#fff;font-size:13px;outline:none" placeholder="Nome do Plugin">`;OS.Popup.show("Novo Plugin",html,[{text:'Cancelar',type:'secondary',onClick:()=>OS.Popup.hide()},{text:'Instalar',type:'primary',onClick:()=>{const code=document.getElementById('plugin-code').value;const name=document.getElementById('plugin-name').value||'Plugin '+(this.list.length+1);if(code){this.list.push({id:Date.now(),name,code,active:true});OS.Storage.save('plugins',this.list);this.renderList();this.execute(code);OS.Popup.show("Sucesso","Plugin instalado.");}}}])},remove(id){this.list=this.list.filter(p=>p.id!==id);OS.Storage.save('plugins',this.list);this.renderList()},renderList(){const c=document.getElementById('plugins-list');if(!this.list.length){c.innerHTML=`<div style="text-align:center;color:#6B7280;margin-top:40px"><div style="font-size:36px">◫</div><p style="font-size:13px;margin-top:8px">Nenhum plugin</p></div>`;return}c.innerHTML=this.list.map(p=>`<div class="glass-panel" style="padding:14px;border-radius:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center"><div><h4 style="font-weight:700;font-size:13px">${p.name}</h4><p style="font-size:11px;color:#34D399">Ativo</p></div><button onclick="OS.Plugins.remove(${p.id})" style="width:32px;height:32px;border-radius:99px;background:rgba(239,68,68,.2);color:#F87171;border:none">✕</button></div>`).join('')},execute(code){try{const fn=new Function('OS',code);fn(OS)}catch(e){OS.Popup.show("Erro no Plugin",`<p style="color:#F87171;font-size:11px">${e.message}</p>`)}},executeAll(){this.list.filter(p=>p.active).forEach(p=>this.execute(p.code))}},
Apps:{registry:[{id:'browser',name:'Navegador',icon:'◍',color:'#0A84FF'},{id:'notes',name:'Notas',icon:'✎',color:'#FBBF24'},{id:'plugins',name:'Plugins',icon:'◫',color:'#A855F7'},{id:'settings',name:'Ajustes',icon:'⚙',color:'#6B7280',action:()=>OS.Popup.show('Sistema','KODUX OS v1.0<br>Sem dependências<br>LocalStorage OK')}],Notes:{init(){document.getElementById('notes-content').value=OS.Storage.load('notes_data','')},save(){OS.Storage.save('notes_data',document.getElementById('notes-content').value);OS.Popup.show("Notas","Salvo local!")}}},
UI:{buildHome(){const g=document.getElementById('app-grid');g.innerHTML=OS.Apps.registry.map(app=>`<div class="app-tile" onclick="${app.action?`(${app.action.toString()})()`: `OS.UI.openApp('${app.id}')`}"><div class="app-icon" style="background:${app.color}">${app.icon}</div><span class="app-name">${app.name}</span></div>`).join('')},openApp(id){document.querySelectorAll('.app-view').forEach(el=>el.classList.remove('active'));OS.TabEngine.hideTabSwitcher();if(id==='home'){OS.state.activeApp='home';return}const el=document.getElementById(`app-${id}`);if(el){el.classList.add('active');OS.state.activeApp=id}},goHome(){this.openApp('home')}},
boot(){const bar=document.getElementById('boot-progress');let p=0;const it=setInterval(()=>{p+=Math.random()*25;if(p>=100){p=100;clearInterval(it);setTimeout(()=>this.finishBoot(),400)}bar.style.width=p+'%'},120)},
finishBoot(){document.getElementById('boot-screen').style.opacity='0';setTimeout(()=>document.getElementById('boot-screen').remove(),700);this.UI.buildHome();this.TabEngine.init();this.Apps.Notes.init();this.Plugins.init();this.state.booted=true}
};
window.addEventListener('load',()=>OS.boot());
</script>
