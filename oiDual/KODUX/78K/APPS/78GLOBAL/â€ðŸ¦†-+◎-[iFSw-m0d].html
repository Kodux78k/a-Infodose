<style>
@import url("https://infodose.com.br/css/a€ArXx.css");
@import url("https://infodose.com.br/css/iFSw-clean.css");

 </style>
  

<div id="root">
  <div id="kxtsk-shell">

<div id="dock"> </div>

    <!-- TOPBAR (original) -->
    <div class="os-topbar">
      <div class="os-brand">
        <svg class="icon-svg" aria-hidden="true"><use href="#icon-brand"></use></svg>
      </div>
      <div class="top-actions">
        <div class="win-navrow" onclick="event.stopPropagation()">
          <input class="win-urlbar" type="text" id="urlInputNav" placeholder="Digite uma URL..." spellcheck="false" autocomplete="off">
          <button class="win-go-btn" type="button" id="goNavBtn">Go</button>
          <button class="launcher-btn" id="openKobBtn" title="Nova janela">
+
          </button>
          <button class="soft-btn" id="openLogsBtn">Logs</button>
        </div>
      </div>
    </div>

    <!-- STACK -->
    <div id="stackWrap">

 <!-- ======== TAB SWITCHER (overlay) ======== -->
      <div class="session-window peeked" id="tab-switcher">
        <div class="win-hdr">
          <span class="win-title">
            <svg class="icon-svg" aria-hidden="true"><use href="#icon-globe"></use></svg>
            Abas
          </span>

          <div class="win-controls">
           <button
              class="tab-badge"
              onclick="OS.TabEngine.showTabSwitcher()"
            >
              <span id="tab-count">1</span>
            </button>
  <button type="button" data-action="collapse" title="Colapsar">
            −
            </button>
            <button type="button" data-action="maximize" title="Maximizar">

            ⛶

            </button>
            <button type="button" data-action="minimize" title="Minimizar">
            ۞
           </button>
    <button type="button" onclick="OS.TabEngine.newTab()" style="background:transparent; border:none; color:#fff; font-size:20px; padding:0 8px;">+</button>
            <button type="button" onclick="OS.TabEngine.hideTabSwitcher()" style="background:transparent; border:none; color:#fff; padding:0 8px;">✕</button>
          </div>
        </div>
        <div style="padding:16px; display:flex; flex-direction:column; height:calc(100% - 48px);">
          <div id="tabs-grid"></div>
          <div style="margin-top:auto; padding-top:32px; display:flex; justify-content:center;">
            <button class="glass-panel" onclick="OS.TabEngine.hideTabSwitcher()" style="padding:12px 28px; border-radius:99px; border:none; color:#fff; background:rgba(255,255,255,0.1);">Concluído</button>
          </div>
        </div>
      </div>

      <!-- ======== SESSÃO DO NAVEGADOR ======== -->
      <div class="session-window" id="browser-session">
        <div class="win-hdr">
          <span class="win-title">
            <svg class="icon-svg" aria-hidden="true"><use href="#icon-globe"></use></svg>

          </span>
          <div class="win-navrow" style="flex:1; min-width:0; gap:6px;">
            <button
              class="tab-badge"
              onclick="OS.TabEngine.showTabSwitcher()"
            >
              <span id="tab-count">1</span>
            </button>
          </div>
          <div class="win-controls">
            <button type="button" data-action="collapse" title="Colapsar">
            −
            </button>
            <button type="button" data-action="maximize" title="Maximizar">

            ⛶

            </button>
            <button type="button" data-action="minimize" title="Minimizar">
            ۞
           </button>
            <button type="button" data-action="close" title="Fechar">
            ×
            </button>
  <span style="color:#9ca3af; font-size:10px;"></span>
            <input
              id="address-bar"
              class="win-urlbar"
              type="text"
              autocomplete="off"
              placeholder="Pesquisar ou URL"
              style="flex:2;"
            >
            <button class="win-go-btn" type="button" onclick="OS.Browser.reload()" style="background:transparent; border:none; color:#fff;">↻</button>
          
          </div>
        </div>

        <!-- Container para iframes e estado vazio -->
        <div id="iframe-container">
          <div id="browser-empty-state">
            <div style="font-size:48px; margin-bottom:16px;">🌐</div>
            <p style="font-size:13px; max-width:280px;">Navegador KODUX. Alguns sites bloqueiam iframe por segurança.</p>
            <div style="margin-top:24px; display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
              <button class="btn" onclick="OS.Browser.loadUrl('https://infodose.com.br/splash.html')">infodose</button>
              <button class="btn" onclick="OS.Browser.loadUrl('https://infodose.com.br')">Almasliber</button>
              <button class="btn" onclick="OS.Browser.loadUrl('https://www.infodose.com.br/oiDual/KODUX/78K/APPS/78F.html')">78Frames</button>
              <button class="btn" onclick="OS.Browser.loadUrl('https://kodux78k.github.io/oiDual--Y-/M0D/DBZP/')">DualPlayer</button>
            </div>
          </div>
        </div>
      </div>

     
    </div><!-- fim #stackWrap -->

    <!-- elementos decorativos -->
    <div class="bg-gradient"></div>
    <div class="ambient-light" aria-hidden="true">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
    </div>

<script src="https://infodose.com.br/js/modules/iFSw-base-nephesh.js">
</script>
