<body>

<script type="module" src="https://www.infodose.com.br/js/modules/Dual_[Theme]-js.js"></script> 

  <div class="almasliber" data-app="almasliber">
    <div class="shell">

      <!-- ===== TOPBAR ===== -->
      <header style="z-index:0" class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="Abrir menu">☰</button>
        <div class="brand">
          A.<span>INFODOSE</span>
          <span class="mini-orb-wrap" id="topbarMiniOrb"></span>
        </div>
        <div style="z-index:1; display:flex;gap:8px;">
          <button class="icon-btn" id="themeToggle" aria-label="Alternar tema">🌙</button>
          <button class="icon-btn" id="notifBtn" aria-label="Notificações">♧</button>
        </div>
      </header>

<!--
<script type="module" src="https://www.infodose.com.br/Nebula/NEB.js"></script>

     <div class="wrap">
<!-- ═══════════════════════════════════════════════════════
     HEADER GLOBAL
     1. TOCAR NO HEADER
        → COLAPSA MAIN
     2. TOCAR NA BOLINHA
        → MUDA TEMA
     3. ROLAR PARA BAIXO
        → HEADER SOBE
     4. ROLAR PARA CIMA
        → HEADER VOLTA
═══════════════════════════════════════════════════════ -->
<header class="topbar header-visible" id="main-header">
    <!-- ÁREA DO SISTEMA -->
    <div class="brandX">
        <span>
            DUAL
        </span>
        <span class="badgeX">
            GLOBAL
        </span>
    </div>
    <!-- ÚNICO CONTROLE DE TEMA -->

 <button id="theme-dot2" class="theme-dot" type="button" aria-label="Alternar tema" title="Alternar tema">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
       </button>  

                <!--    <button class="launcher-btn" id="openKobBtn">+</button> -->
<!-- 
-->

</header>
<!-- ═══════════════════════════════════════════════════════
     MAIN
═══════════════════════════════════════════════════════ -->

 
    <!-- ═══════════════════════════════════════════════════════
             MAIN · agora hospeda o #kxtsk-shell (dock + stackWrap)
             ═══════════════════════════════════════════════════════ -->
        <main>
          <div id="main-content">

            <div id="dock"></div>

            <!-- STACK -->
            <div id="stackWrap">

              <!-- SESSÃO INICIAL -->
              <div class="session-window peeked" id="session-iframe">

                <div class="win-hdr">
                  <div class="win-controls">

                    <button type="button" data-action="collapse" title="Colapsar" aria-label="Colapsar">−</button>

                    <span class="win-title">۞ //</span>

                    <button type="button" data-action="maximize" title="Maximizar" aria-label="Maximizar">⛶</button>

                    <button type="button" data-action="minimize" title="Minimizar" aria-label="Minimizar">۞</button>

                    <!-- ÚNICO CONTROLE DE TEMA "CANÔNICO" — é o que já
                         está confirmado funcionando; os outros dois
                         (themeToggle e theme-dot-header) apenas
                         disparam um clique nele, ver script no fim -->
                    <button id="theme-dot" class="theme-dot" type="button" aria-label="Alternar tema" title="Alternar tema">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
                    </button>

                    <button class="launcher-btn" id="openKobBtn">+</button>

                  </div>
                </div>

                <iframe class="win-frame" data-runtime="nav" id="navFrame" src="https://www.infodose.com.br"></iframe>

              </div>
            </div>
            <!-- /STACK -->

          </div>
          <!-- /#kxtsk-shell -->
        </main>

      <!-- ===== BOTTOM NAV ===== -->
      <nav style="display:none" class="symbol-bar bottom-nav" data-module="navigation" aria-label="Navegação principal">
        <button class="nav-item active" data-tab="home"><span class="nav-icon">⌂</span><span>Início</span></button>
        <button class="nav-item" id="navLibraryBtn"><span class="nav-icon">▣</span><span>Library</span></button>
        <button class="nav-main" id="navCreateBtn">+</button>
        <button class="nav-item" id="navResultsBtn"><span class="nav-icon">▥</span><span>Resultados</span></button>
        <button class="nav-item" id="navProfileBtn"><span class="nav-icon">♙</span><span>Perfil</span></button>
      </nav>

    </div>
  </div>

  <!-- TOASTER -->
  <div class="toaster-wrap" id="toasterWrap"></div>

  <input type="file" id="nebulaFileInput" multiple="" accept=".txt,.md,.html,.pdf" style="display:none">
