<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05070a">
<link rel="apple-touch-icon" href="./icon-192">
<link rel="icon" href="./icon-192">
<title>KOBLLUX Maker Dash Mobile</title>
<style>
:root{
  --bg:#05070a;--panel:rgba(13,16,22,.88);--panel2:rgba(19,24,32,.92);
  --line:rgba(255,255,255,.10);--text:#eef4f8;--muted:#8b98a6;
  --cyan:#00eaff;--blue:#2d7cff;--violet:#8b5cf6;--green:#35e27f;
  --danger:#ff5570;--shadow:0 18px 50px rgba(0,0,0,.45);--r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,rgba(0,174,255,.12),transparent 34%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden;padding-bottom:86px}
button,input,select,textarea{font:inherit}
button{color:inherit}
.app{width:min(100%,760px);margin:auto;padding:14px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 2px 14px;background:linear-gradient(180deg,#05070a 72%,transparent)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}.orb{width:42px;height:42px;border-radius:50%;border:1px solid rgba(0,234,255,.35);background:radial-gradient(circle,#00eaff 0 5%,rgba(0,234,255,.22) 20%,transparent 65%);box-shadow:0 0 24px rgba(0,234,255,.22)}
.brand h1{font-size:15px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:2px 0 0}.status{font-size:10px;padding:6px 8px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04)}
.card{background:linear-gradient(145deg,rgba(21,27,36,.92),rgba(10,13,18,.92));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin:10px 0;backdrop-filter:blur(18px)}
.card h2{font-size:13px;margin:0 0 12px;letter-spacing:.04em}.sub{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
input,select,textarea{width:100%;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--text);border-radius:14px;outline:none;padding:11px 12px}.mono,input.mono,textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.textarea{min-height:84px;resize:vertical}
.btns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.btn{border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.025));padding:11px 10px;font-weight:700;font-size:12px;cursor:pointer}.btn:active{transform:scale(.98)}.primary{border-color:rgba(0,234,255,.35);background:linear-gradient(135deg,rgba(0,234,255,.18),rgba(45,124,255,.12))}.danger{border-color:rgba(255,85,112,.32);color:#ff93a5}
.presets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.preset{position:relative;min-height:62px;text-align:left;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.035);padding:10px;cursor:pointer}.preset strong{display:block;font-size:12px}.preset span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.preset::after{content:"";position:absolute;left:10px;right:10px;bottom:8px;height:2px;background:var(--cyan);opacity:.55;box-shadow:0 0 10px var(--cyan)}
.preview-wrap{display:flex;gap:12px;align-items:flex-start}.preview{flex:1;min-width:0;border:1px solid var(--line);border-radius:18px;padding:12px;background:#070b10}.preview-box{position:relative;min-height:140px;border:1px dashed rgba(255,255,255,.12);border-radius:15px;padding:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}.sample-stack{width:100%;max-width:340px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.03);padding:12px}.sample-stack .row{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid rgba(255,255,255,.06)}.sample-stack .row:last-child{border-bottom:0}.mini{font-size:10px;color:var(--muted)}
.code{white-space:pre-wrap;word-break:break-word;background:#040608;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px;font-family:ui-monospace,monospace;font-size:11px;color:#c8d6df;max-height:280px;overflow:auto}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(5,7,10,.92) 28%);pointer-events:none}.dock{width:min(100%,720px);margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;pointer-events:auto}.dock button{border:1px solid var(--line);background:rgba(12,16,22,.88);border-radius:15px;padding:9px 5px;font-size:10px}.dock button.active{border-color:rgba(0,234,255,.42);box-shadow:0 0 20px rgba(0,234,255,.08)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(15px);opacity:0;pointer-events:none;background:#10161d;border:1px solid var(--line);padding:10px 13px;border-radius:999px;font-size:11px;transition:.22s;z-index:100;max-width:calc(100% - 32px);text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Injetáveis */
.stack-wipe{isolation:isolate;overflow:hidden}
.traco-azul{position:relative}
.traco-azul::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:#00eaff;box-shadow:0 0 12px #00eaff}
.glow{box-shadow:0 0 28px rgba(0,234,255,.12)}
.pulse{animation:kPulse 1.7s ease-in-out infinite}@keyframes kPulse{50%{filter:brightness(1.18)}}
@media(max-width:380px){.grid,.presets,.btns{grid-template-columns:1fr}.field.full{grid-column:auto}.topbar{padding-top:7px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="orb"></div><div><h1>KOBLLUX · MAKER DASH</h1><p>Injector / Stack / Patch Studio</p></div></div>
    <div class="status" id="status">READY</div>
  </header>

  <section class="card" id="maker">
    <h2>INJETOR</h2>
    <div class="grid">
      <label class="field full"><span class="label">Alvo / selector</span><input id="target" class="mono" value="#sample-stack" placeholder="#id ou .classe"></label>
      <label class="field"><span class="label">Tipo</span><select id="type"><option value="class">Classe</option><option value="id">ID</option><option value="attr">Atributo</option><option value="fn">Função</option></select></label>
      <label class="field"><span class="label">Valor</span><input id="value" class="mono" value="stack-wipe" placeholder="nome / valor"></label>
      <label class="field full" id="attrNameWrap" hidden><span class="label">Nome do atributo</span><input id="attrName" class="mono" value="data-k-mode"></label>
      <label class="field full" id="fnWrap" hidden><span class="label">Função JS</span><textarea id="fnCode" class="mono textarea">el.classList.add('glow'); el.dataset.state = 'patched';</textarea></label>
    </div>
    <div class="btns">
      <button class="btn primary" id="apply">⚡ Aplicar injeção</button>
      <button class="btn" id="generate">⌘ Gerar código</button>
      <button class="btn" id="copy">⧉ Copiar</button>
      <button class="btn danger" id="reset">↺ Reset preview</button>
    </div>
  </section>

  <section class="card">
    <h2>PRESETS</h2>
    <div class="presets">
      <button class="preset" data-class="stack-wipe"><strong>STACK WIPE</strong><span>isolamento + overflow</span></button>
      <button class="preset" data-class="traco-azul"><strong>TRAÇO AZUL</strong><span>linha luminosa inferior</span></button>
      <button class="preset" data-class="glow"><strong>GLOW</strong><span>halo ciano suave</span></button>
      <button class="preset" data-class="pulse"><strong>PULSE</strong><span>pulso de estado</span></button>
    </div>
  </section>

  <section class="card">
    <h2>PREVIEW</h2>
    <div class="preview-wrap">
      <div class="preview">
        <div class="mini" style="margin-bottom:8px">TARGET: <span id="previewTarget">#sample-stack</span></div>
        <div class="preview-box" id="previewBox">
          <div class="sample-stack" id="sample-stack">
            <div class="row"><b>Dual Core</b><span class="mini">LIVE</span></div>
            <div class="row"><span>Session Window</span><span class="mini">iFS</span></div>
            <div class="row"><span>Injector</span><span class="mini">78K</span></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>CÓDIGO GERADO</h2>
    <div class="code" id="output">// selecione um alvo e gere a injeção</div>
  </section>
</div>

<div class="bottom"><nav class="dock">
  <button class="active" data-scroll="maker">⚡ Maker</button>
  <button data-scroll="maker">◉ Inject</button>
  <button data-scroll="maker">▣ Preview</button>
  <button data-scroll="output">⌘ Code</button>
</nav></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const target = $('#target'), type = $('#type'), value = $('#value');
  const attrNameWrap = $('#attrNameWrap'), fnWrap = $('#fnWrap');
  const output = $('#output'), status = $('#status'), toast = $('#toast');
  const sample = $('#sample-stack');
  let lastCode = '';

  const elOf = t => {
    try { return typeof t === 'string' ? document.querySelector(t) : t; }
    catch { return null; }
  };

  const KInject = {
    el: elOf,
    class(t, ...classes){ const el = this.el(t); if (!el) return null; el.classList.add(...classes.filter(Boolean)); return el; },
    id(t, id){ const el = this.el(t); if (!el) return null; el.id = id; return el; },
    attr(t, name, value=''){ const el = this.el(t); if (!el) return null; el.setAttribute(name, value); return el; },
    fn(t, callback){ const el = this.el(t); if (!el || typeof callback !== 'function') return null; callback(el); return el; }
  };
  window.KInject = KInject;

  function showToast(msg){ toast.textContent = msg; toast.classList.add('show'); clearTimeout(showToast.t); showToast.t=setTimeout(()=>toast.classList.remove('show'),1800); }

  function syncType(){
    const t = type.value;
    attrNameWrap.hidden = t !== 'attr';
    fnWrap.hidden = t !== 'fn';
    if(t==='class') value.value ||= 'stack-wipe';
    if(t==='id') value.value ||= 'dual-root';
  }
  type.addEventListener('change', syncType); syncType();

  function codeFor(){
    const t = target.value.trim() || '#sample-stack';
    const kind = type.value;
    if(kind==='class') return `KInject.class(${JSON.stringify(t)}, ${JSON.stringify(value.value.trim())});`;
    if(kind==='id') return `KInject.id(${JSON.stringify(t)}, ${JSON.stringify(value.value.trim())});`;
    if(kind==='attr') return `KInject.attr(${JSON.stringify(t)}, ${JSON.stringify($('#attrName').value.trim())}, ${JSON.stringify(value.value)});`;
    return `KInject.fn(${JSON.stringify(t)}, el => {\n  ${$('#fnCode').value}\n});`;
  }

  function apply(){
    const t = target.value.trim() || '#sample-stack';
    let result = null;
    if(type.value==='class') result = KInject.class(t, value.value.trim());
    if(type.value==='id') result = KInject.id(t, value.value.trim());
    if(type.value==='attr') result = KInject.attr(t, $('#attrName').value.trim(), value.value);
    if(type.value==='fn'){
      try { result = KInject.fn(t, new Function('el', $('#fnCode').value)); }
      catch(e){ showToast('Função inválida: '+e.message); status.textContent='ERROR'; return; }
    }
    if(!result){ showToast('Alvo não encontrado'); status.textContent='MISS'; return; }
    lastCode = codeFor(); output.textContent = lastCode; status.textContent='PATCHED';
    $('#previewTarget').textContent=t; showToast('Injeção aplicada');
  }

  $('#apply').addEventListener('click', apply);
  $('#generate').addEventListener('click',()=>{ lastCode=codeFor(); output.textContent=lastCode; status.textContent='CODE'; showToast('Código gerado'); });
  $('#copy').addEventListener('click',async()=>{
    if(!lastCode) lastCode=codeFor(); output.textContent=lastCode;
    try{ await navigator.clipboard.writeText(lastCode); showToast('Código copiado'); }
    catch{ showToast('Clipboard indisponível'); }
  });
  $('#reset').addEventListener('click',()=>{
    sample.className='sample-stack'; sample.removeAttribute('data-k-mode'); sample.removeAttribute('data-state');
    output.textContent='// preview resetado'; status.textContent='READY'; showToast('Preview resetado');
  });

  document.querySelectorAll('.preset').forEach(btn=>btn.addEventListener('click',()=>{
    type.value='class'; value.value=btn.dataset.class; syncType(); apply();
  }));

  document.querySelectorAll('.dock button').forEach(btn=>btn.addEventListener('click',()=>{
    document.getElementById(btn.dataset.scroll).scrollIntoView({behavior:'smooth',block:'start'});
    document.querySelectorAll('.dock button').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
  }));
})();
</script>
</body>
</html>
