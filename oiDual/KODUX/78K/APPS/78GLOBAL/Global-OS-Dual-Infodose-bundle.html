<!DOCTYPE html>
<html lang="pt-BR"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb">
  <title>Almasliber-OS-Dual-Infodose</title>

  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>/* =========================================================
   ALMASLIBER / iFSw — UNIFIED CORE
   HEADER + SESSION + DOCK + MAXIMIZE/MINIMIZE + TABS
   ========================================================= */

:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);

  --topbar-h: 58px;
  --header-h: 52px;

  --session-radius: 29px;
  --session-gap: 20px;

  --collapsed-h: 52px;
  --peek-h: 178px;

  --resize-hit: 0px;
  --resize-corner: 54px;

  --dock-bottom-gap: 80px;
  --dock-offset-x: -12px;

  --z-base: 1;
  --z-content: 100;
  --z-header-system: 900;
  --z-header-main: 910;
  --z-session: 1000;
  --z-session-header: 1010;
  --z-session-controls: 1020;
  --z-maximized: 94000;
  --z-maximized-header: 94010;
  --z-maximized-controls: 94020;
  --z-resize: 94030;
  --z-dock: 97000;
  --z-tab-switcher: 98000;
}

* { box-sizing: border-box; }
html, body {
  width: 100%;
  min-width: 0;
  min-height: 100%;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}
html { overflow-y: auto; -webkit-overflow-scrolling: touch; }
body {
  min-height: 100dvh;
  background: radial-gradient(circle at 50% 0%, #2a2a35 0%, #0f0f15 100%);
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
body.ui-safe-vertical {
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}
body.ui-immersive { padding: 0; overflow: hidden !important; }

#kxtsk-shell {
  position: relative;
  width: 100%;
  min-height: 100dvh;
  overflow: visible;
  z-index: var(--z-base);
}
.almasliber, .almasliber .shell, #main-content {
  position: relative;
  width: 100%;
  min-width: 0;
}
.almasliber { min-height: 100dvh; }

/* HEADER SYSTEM */
.topbar {
  position: relative;
  width: 100%;
  min-width: 0;
  height: var(--topbar-h);
  min-height: var(--topbar-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 12px;
  z-index: var(--z-header-system);
  isolation: isolate;
}
#system-topbar { z-index: var(--z-header-system); }
#main-header { z-index: var(--z-header-main); }

#main-header.header-visible {
  transform: translateY(0);
  opacity: 1;
  pointer-events: auto;
}
#main-header.header-hidden {
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
}
#main-header { transition: transform .25s ease, opacity .2s ease; }

.brand, .brandX, .os-brand {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  min-width: 0;
  font-weight: 800;
}
.brandX { gap: 7px; font-size: 13px; letter-spacing: 1.3px; }
.badgeX { font-size: 9px; opacity: .55; }

.top-actions {
  min-width: 0;
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}
.icon-btn, .soft-btn, .launcher-btn, .win-go-btn {
  flex: 0 0 auto;
  border: 0;
  border-radius: 12px;
  min-height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  cursor: pointer;
  font-weight: 600;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.icon-btn { width: 34px; height: 34px; padding: 0; background: rgba(255,255,255,.08); }
.soft-btn { padding: 10px 12px; background: rgba(255,255,255,.08); }
.launcher-btn { padding: 10px 12px; background: rgba(0,242,255,.12); border: 1px solid rgba(0,242,255,.3); }
.win-go-btn { padding: 10px 12px; background: rgba(0,242,255,.12); }
.icon-btn:active, .win-controls button:active, .dock-bubble:active { transform: scale(.94); }

.win-navrow {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-width: 0;
  padding: 0 16px 10px;
}
.win-urlbar {
  flex: 1 1 auto;
  min-width: 139px;
  padding: 11px 13px;
  border-radius: 13px;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.06);
  color: #fff;
  outline: none;
  font-size: 10px;
}
.win-urlbar::placeholder { color: rgba(255,255,255,.45); }
.win-urlbar:focus {
  border-color: rgba(0,242,255,.45);
  background: rgba(255,255,255,.09);
  box-shadow: 0 0 0 3px rgba(0,242,255,.08);
}

main, #main-content { position: relative; z-index: var(--z-content); }

#stackWrap {
  position: relative;
  width: 100%;
  max-width: 800px;
  min-height: calc(100dvh - var(--topbar-h));
  margin: 0 auto;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--session-gap);
  overflow: visible;
  z-index: var(--z-content);
  isolation: isolate;
}

/* SESSION WINDOW */
.session-window {
  position: relative;
  width: 100%;
  height: calc(100dvh - var(--topbar-h));
  min-height: 0;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: rgba(30,30,35,.40);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: var(--session-radius);
  z-index: var(--z-session);
  transition: height .28s cubic-bezier(.16,1,.3,1), width .28s cubic-bezier(.16,1,.3,1), transform .28s ease, opacity .28s ease;
}

.session-window .win-hdr {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  width: 100%;
  height: var(--header-h);
  min-height: var(--header-h);
  display: flex;
  align-items: center;
  padding: 10px 14px;
  z-index: var(--z-session-header);
  background: transparent;
  user-select: none;
  -webkit-user-select: none;
  pointer-events: none;
  touch-action: manipulation;
  isolation: isolate;
}

.win-controls {
  position: relative;
  z-index: var(--z-session-controls);
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 7px;
  pointer-events: auto;
}
.win-controls button {
  width: 30px;
  height: 30px;
  min-width: 30px;
  min-height: 30px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.10);
  color: #fff;
  cursor: pointer;
  font-family: "Noto Sans Symbols 2", "Noto Sans Symbols", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 17px;
  font-weight: 300;
  line-height: 1;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.win-controls button:hover { background: rgba(255,255,255,.17); }

/* Tab counter button */
.win-controls .tab-counter {
  width: auto;
  min-width: 30px;
  padding: 0 10px;
  border-radius: 20px;
  background: rgba(0,242,255,.15);
  font-size: 12px;
  font-weight: 600;
  color: #7af;
  letter-spacing: 0.3px;
}

.session-window .win-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  border: 0;
  background: transparent;
  z-index: 1;
  display: block;
}

.session-window.collapsed {
  height: var(--collapsed-h) !important;
  min-height: var(--collapsed-h) !important;
  overflow: hidden !important;
}
.session-window.collapsed .win-frame { visibility: hidden; pointer-events: none; }

.session-window.peeked {
  height: var(--peek-h) !important;
  min-height: var(--peek-h) !important;
}
.session-window.peeked .win-frame { visibility: visible; pointer-events: auto; }

.session-window.minimized {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  min-width: 1px !important;
  min-height: 1px !important;
  opacity: 0 !important;
  pointer-events: none !important;
  transform: scale(.90) translateY(50px);
  overflow: hidden !important;
}

.session-window.maximized {
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100dvh !important;
  min-width: 0 !important;
  min-height: 0 !important;
  max-width: none !important;
  max-height: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  overflow: hidden !important;
  z-index: var(--z-maximized) !important;
  transition: none !important;
}
.session-window.maximized .win-hdr {
  position: absolute !important;
  inset: 0 0 auto 0 !important;
  width: 100% !important;
  height: var(--header-h) !important;
  z-index: var(--z-maximized-header) !important;
  pointer-events: none !important;
}
.session-window.maximized .win-controls { pointer-events: auto !important; z-index: var(--z-maximized-controls) !important; }
.session-window.maximized .win-frame {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  z-index: 1 !important;
}

body.has-maximized { overflow: hidden !important; }
body.has-maximized .topbar { pointer-events: none; }
body.has-maximized .session-window.maximized .win-controls,
body.has-maximized .session-window.maximized .win-hdr { pointer-events: auto; }

/* Resize handles */
.session-window .resize-handle {
  position: absolute;
  z-index: var(--z-resize);
  background: transparent;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.session-window .resize-y { left: 0; right: 0; bottom: 0; height: var(--resize-hit); cursor: ns-resize; }
.session-window .resize-x { top: var(--header-h); right: 0; bottom: 0; width: var(--resize-hit); cursor: ew-resize; }
.session-window .resize-corner { right: 0; bottom: 0; width: var(--resize-corner); height: var(--resize-corner); cursor: nwse-resize; }
.session-window .resize-corner::before {
  content: "";
  position: absolute;
  right: 10px;
  bottom: 10px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: rgba(255,255,255,.18);
  border: 1px solid rgba(255,255,255,.25);
  box-shadow: 0 0 14px rgba(0,242,255,.18);
  pointer-events: none;
}
.session-window.maximized .resize-handle { display: none !important; }

.session-window.suspended .win-frame { display: none; }
.session-window.suspended::after {
  content: "⏸";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 2rem;
  opacity: .3;
  pointer-events: none;
}

/* SESSION LIFECYCLE — indicador visual de estado */
.session-window.state-idle { filter: saturate(.82); }
.session-window.state-idle .win-hdr::before {
  content: "";
  position: absolute;
  top: 8px;
  right: 8px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255, 200, 60, .75);
  pointer-events: none;
}
.session-window.state-loading .win-hdr::before {
  content: "";
  position: absolute;
  top: 8px;
  right: 8px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(0, 242, 255, .8);
  animation: session-loading-pulse 1s ease-in-out infinite;
  pointer-events: none;
}
@keyframes session-loading-pulse {
  0%, 100% { opacity: .3; }
  50% { opacity: 1; }
}

/* DOCK */
#dock {
  position: fixed;
  left: var(--dock-offset-x);
  bottom: calc(var(--dock-bottom-gap) + var(--safe-bottom));
  z-index: var(--z-dock);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 12px 10px;
  border-radius: 24px;
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,.1);
}
#dock:empty { opacity: 0; pointer-events: none; }
.dock-bubble {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(255,255,255,.10);
  border: 1px solid rgba(255,255,255,.20);
  color: #fff;
  cursor: pointer;
  font-family: "Noto Sans Symbols 2", "Noto Sans Symbols", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 19px;
  line-height: 1;
  touch-action: manipulation;
}

/* TAB SWITCHER OVERLAY */
.tab-switcher-overlay{
  position:fixed;
  inset:0;
  z-index:var(--z-tab-switcher,98000);
  display:none;
  align-items:center;
  justify-content:center;
  padding:
    calc(16px + var(--safe-top,0px))
    14px
    calc(16px + var(--safe-bottom,0px));
  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(0,229,255,.10),
      transparent 42%
    ),
    rgba(2,3,8,.78);
  backdrop-filter:blur(24px) saturate(1.2);
  -webkit-backdrop-filter:blur(24px) saturate(1.2);
  opacity:0;
  transition:opacity .722s ease;
}

.tab-switcher-overlay.open{
  display:flex;
  opacity:1;
}

.tab-switcher-panel{
  position:relative;
  width:min(760px,100%);
  max-height:min(86dvh,900px);
  overflow:auto;

  padding:16px;

  border:
    1px solid rgba(255,255,255,.11);

  border-radius:
    clamp(22px,5vw,32px);

  background:
    linear-gradient(
      145deg,
      rgba(22,23,31,.94),
      rgba(8,9,14,.91)
    );

  box-shadow:
    0 30px 90px rgba(0,0,0,.65),
    inset 0 1px 0 rgba(255,255,255,.06);

  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.tab-switcher-panel::-webkit-scrollbar{
  display:none;
}

/* HEADER */

.tab-switcher-panel .panel-header{
  position:sticky;
  top:0;
  z-index:3;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;

  margin:-4px -4px 14px;
  padding:10px 8px 14px;

  background:
    linear-gradient(
      to bottom,
      rgba(15,16,22,.98),
      rgba(15,16,22,.82),
      transparent
    );

  backdrop-filter:blur(12px);
}

.tab-switcher-panel .panel-header h2{
  margin:0;

  font-size:18px;
  line-height:1.1;
  font-weight:750;
  letter-spacing:-.02em;

  color:var(--text,#f5f5f7);
}

.tab-switcher-panel .panel-header h2::before{
  content:"◉";
  margin-right:8px;
  color:var(--cyan,#00e5ff);
  font-size:.72em;
  vertical-align:2px;
}

.tab-switcher-panel .panel-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.tab-switcher-panel .panel-actions button{
  min-height:34px;

  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;

  padding:7px 11px;

  border:1px solid rgba(255,255,255,.09);
  border-radius:12px;

  background:rgba(255,255,255,.055);
  color:rgba(255,255,255,.86);

  font-size:12px;
  font-weight:650;

  cursor:pointer;
  transition:
    transform .16s ease,
    background .16s ease,
    border-color .16s ease;
}

.tab-switcher-panel .panel-actions button:hover{
  background:rgba(255,255,255,.10);
  border-color:rgba(255,255,255,.16);
}

.tab-switcher-panel .panel-actions button:active{
  transform:scale(.96);
}

/* GRID */

.tab-grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(210px,1fr));

  gap:10px;
}

/* CARD */

.tab-card{
  position:relative;
  min-height:126px;

  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  gap:7px;

  padding:15px;

  overflow:hidden;

  border:1px solid rgba(255,255,255,.075);
  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.065),
      rgba(255,255,255,.025)
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.035);

  cursor:pointer;

  transition:
    transform .18s ease,
    border-color .18s ease,
    background .18s ease,
    box-shadow .18s ease;
}

.tab-card::before{
  content:"";
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle at 15% 0%,
      rgba(0,229,255,.11),
      transparent 48%
    );

  opacity:0;
  transition:opacity .18s ease;
  pointer-events:none;
}

.tab-card:hover{
  transform:translateY(-2px);
  border-color:rgba(0,229,255,.20);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.035)
    );

  box-shadow:
    0 12px 30px rgba(0,0,0,.24);
}

.tab-card:hover::before{
  opacity:1;
}

/* ACTIVE */

.tab-card.active{
  border-color:rgba(0,229,255,.48);

  background:
    linear-gradient(
      145deg,
      rgba(0,229,255,.12),
      rgba(255,255,255,.035)
    );

  box-shadow:
    0 0 0 1px rgba(0,229,255,.08),
    0 12px 35px rgba(0,0,0,.28),
    inset 0 0 30px rgba(0,229,255,.035);
}

.tab-card.active::after{
  content:"ATIVA";

  position:absolute;
  top:11px;
  left:12px;

  padding:4px 7px;

  border-radius:999px;

  background:rgba(0,229,255,.10);
  border:1px solid rgba(0,229,255,.18);

  color:#00e5ff;

  font-size:8px;
  font-weight:800;
  letter-spacing:.08em;
}

/* ICON / ORB */

.tab-card::marker{
  display:none;
}

.tab-card .tab-icon{
  width:38px;
  height:38px;

  display:grid;
  place-items:center;

  margin-bottom:auto;

  border-radius:13px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.10),
      rgba(255,255,255,.035)
    );

  border:1px solid rgba(255,255,255,.08);

  font-size:18px;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07);
}

/* TITLE */

.tab-card .tab-title{
  position:relative;
  z-index:1;

  padding-right:28px;

  font-size:13px;
  line-height:1.2;
  font-weight:720;

  color:#fff;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* URL */

.tab-card .tab-url{
  position:relative;
  z-index:1;

  font-size:9px;
  line-height:1.25;

  color:rgba(255,255,255,.43);

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* STATE */

.tab-card .tab-state{
  position:absolute;
  right:12px;
  bottom:13px;

  display:flex;
  align-items:center;
  gap:5px;

  font-size:8px;
  font-weight:750;
  letter-spacing:.05em;

  color:rgba(255,255,255,.42);
}

.tab-card .tab-state-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#777;
}

.tab-card[data-state="active"] .tab-state-dot{
  background:#39ffb6;
  box-shadow:0 0 8px rgba(57,255,182,.6);
}

.tab-card[data-state="loading"] .tab-state-dot{
  background:#00e5ff;
  animation:tabStatePulse 1s infinite;
}

.tab-card[data-state="idle"] .tab-state-dot{
  background:#ffd60a;
}

.tab-card[data-state="suspended"] .tab-state-dot{
  background:#ff6b6b;
}

.tab-card[data-keepalive="true"] .tab-state::after{
  content:" · KEEP";
  color:#00e5ff;
}

@keyframes tabStatePulse{
  50%{opacity:.3;transform:scale(.65)}
}

/* CLOSE */

.tab-card .tab-close{
  position:absolute;
  top:9px;
  right:9px;

  width:28px;
  height:28px;

  display:grid;
  place-items:center;

  border:1px solid rgba(255,255,255,.07);
  border-radius:10px;

  background:rgba(0,0,0,.18);
  color:rgba(255,255,255,.45);

  opacity:0;

  cursor:pointer;

  transition:
    opacity .15s ease,
    background .15s ease,
    color .15s ease;
}

.tab-card:hover .tab-close,
.tab-card:focus-within .tab-close{
  opacity:1;
}

.tab-card .tab-close:hover{
  background:rgba(255,70,90,.14);
  color:#ff6b6b;
}

/* FAVORITE */

.tab-card .tab-fav{
  position:absolute;
  top:10px;
  left:10px;

  width:27px;
  height:27px;

  display:grid;
  place-items:center;

  border:0;
  background:transparent;

  color:rgba(255,255,255,.3);

  opacity:.7;
}

.tab-card .tab-fav.active{
  color:#ffd60a;
  opacity:1;
}

/* EMPTY */

.tab-empty{
  grid-column:1/-1;

  padding:42px 20px;

  <script type="module">/* ============================================================
   KOB BUS
   Universal Cross-Frame Bridge
   KOBLLUX / Dual.Infodose
   ============================================================

   FUNÇÃO:

   SHELL
      │
      ├── same-origin
      │      └── acessa contentDocument diretamente
      │
      └── cross-origin
             └── postMessage()

   RESULTADO:

   Cortex ───────────────┐
   Nexus ────────────────┤
   DualTube ─────────────┤
   iframe same-origin ──┤──> KOB BUS ──> KOB TTS
   iframe cross-origin ─┘

   ============================================================ */

(function KOB_BUS(global) {

  'use strict';

  const VERSION = 'KOB-BUS.v1.0.0';

  const CONFIG = {

    debug: false,

    maxText: 1200,

    minText: 2,

    debounce: 180,

    iframeSelector: 'iframe',

    /*
      "*" permite comunicação entre origens.

      Em produção, você pode trocar por uma lista
      de hosts permitidos.
    */
    targetOrigin: '*',

    /*
      Não captura controles por padrão.
    */
    ignoredTags: [
      'SCRIPT',
      'STYLE',
      'NOSCRIPT',
      'INPUT',
      'TEXTAREA',
      'SELECT',
      'OPTION'
    ]

  };


  /* ==========================================================
     STATE
     ========================================================== */

  const STATE = {

    started: false,

    frames: new Map(),

    documents: new WeakSet(),

    lastText: '',

    lastTime: 0,

    observer: null

  };


  /* ==========================================================
     LOG
     ========================================================== */

  function log(...args) {

    if (!CONFIG.debug) return;

    console.log(
      '%c[KOB BUS]',
      'color:#00ffff;font-weight:900',
      ...args
    );

  }


  /* ==========================================================
     NORMALIZE
     ========================================================== */

  function cleanText(text) {

    return String(text || '')
      .replace(/\u200B/g, '')
      .replace(/\u00A0/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, CONFIG.maxText);

  }


  /* ==========================================================
     ELEMENT IGNORE
     ========================================================== */

  function ignored(el) {

    if (!el || el.nodeType !== 1) {
      return true;
    }

    if (
      CONFIG.ignoredTags.includes(
        el.tagName
      )
    ) {
      return true;
    }

    if (
      el.closest?.(
        '[data-kob-ignore],[data-tts-ignore],.kob-tts-ignore'
      )
    ) {
      return true;
    }

    return false;

  }


  /* ==========================================================
     EXTRACT TEXT
     ========================================================== */

  function extractText(target) {

    if (!target) {
      return '';
    }

    let el = target;

    /*
      SVG / path / use
    */

    if (
      el.tagName === 'SVG' ||
      el.tagName === 'PATH' ||
      el.tagName === 'USE'
    ) {

      el =
        el.closest?.(
          'button,a,[role="button"]'
        ) ||
        el.parentElement;

    }

    /*
      Se clicou num controle,
      somente fala se explicitamente marcado.
    */

    const control =
      el.closest?.(
        'button,input,textarea,select'
      );

    if (control) {

      if (
        !control.hasAttribute(
          'data-kob-tts'
        )
      ) {

        return '';

      }

      el = control;

    }

    if (ignored(el)) {
      return '';
    }


    /*
      Primeiro tenta o próprio elemento.
    */

    let text =
      cleanText(
        el.innerText ||
        el.textContent ||
        el.getAttribute?.(
          'aria-label'
        ) ||
        el.getAttribute?.(
          'title'
        ) ||
        ''
      );


    /*
      Se o elemento contém muito texto,
      procura um bloco menor.
    */

    if (
      text.length > CONFIG.maxText
    ) {

      const candidates = [
        'article',
        'section',
        'p',
        'h1',
        'h2',
        'h3',
        'h4',
        'h5',
        'h6',
        '.card',
        '.v-glass',
        '[data-kob-content]'
      ];

      for (
        const selector of candidates
      ) {

        const parent =
          el.closest?.(
            selector
          );

        if (!parent) continue;

        const candidate =
          cleanText(
            parent.innerText ||
            parent.textContent ||
            ''
          );

        if (
          candidate &&
          candidate.length <
          text.length
        ) {

          text = candidate;

        }

      }

    }

    return cleanText(text);

  }


  /* ==========================================================
     FIND TTS
     ========================================================== */

  function getTTS() {

    /*
      Seu motor principal.
    */

    if (
      global.CobTTS &&
      typeof global.CobTTS.speak ===
        'function'
    ) {

      return text =>
        global.CobTTS.speak(text);

    }


    /*
      Outras formas que seu ecossistema
      pode ter exposto.
    */

    const objects = [

      global.KOB_TTS,

      global.KOBTTS,

      global.COB_TTS,

      global.TTS,

      global.tts

    ];

    for (
      const obj of objects
    ) {

      if (!obj) continue;

      if (
        typeof obj.speak ===
        'function'
      ) {

        return text =>
          obj.speak(text);

      }

      if (
        typeof obj.say ===
        'function'
      ) {

        return text =>
          obj.say(text);

      }

      if (
        typeof obj.speakText ===
        'function'
      ) {

        return text =>
          obj.speakText(text);

      }

    }


    /*
      Funções globais.
    */

    const functions = [

      'kobSpeak',

      'KOBSpeak',

      'speakText',

      'speak',

      'ttsSpeak',

      'speakTTS'

    ];

    for (
      const name of functions
    ) {

      if (
        typeof global[name] ===
        'function'
      ) {

        return text =>
          global[name](text);

      }

    }


    /*
      Último fallback.
    */

    if (
      global.speechSynthesis
    ) {

      return text => {

        try {

          global.speechSynthesis.cancel();

          const u =
            new SpeechSynthesisUtterance(
              text
            );

          u.lang = 'pt-BR';

          global.speechSynthesis.speak(
            u
          );

        } catch (err) {

          log(
            'Speech fallback error',
            err
          );

        }

      };

    }

    return null;

  }


  /* ==========================================================
     SPEAK
     ========================================================== */

  function speak(
    text,
    meta = {}
  ) {

    text =
      cleanText(text);

    if (
      text.length <
      CONFIG.minText
    ) {
      return false;
    }


    const now =
      Date.now();

    if (
      text === STATE.lastText &&
      now - STATE.lastTime <
      CONFIG.debounce
    ) {

      return false;

    }

    STATE.lastText =
      text;

    STATE.lastTime =
      now;


    const tts =
      getTTS();

    if (!tts) {

      console.warn(
        '[KOB BUS] KOB TTS não encontrado.'
      );

      return false;

    }


    log(
      'TTS',
      meta,
      text
    );


    try {

      tts(text);

      return true;

    } catch (err) {

      console.error(
        '[KOB BUS] TTS error',
        err
      );

      return false;

    }

  }


  /* ==========================================================
     FRAME ID
     ========================================================== */

  function frameId(iframe) {

    if (
      iframe.dataset.kobBusId
    ) {

      return iframe.dataset.kobBusId;

    }

    const id =
      'kob-frame-' +
      Math.random()
        .toString(36)
        .slice(2, 10);

    iframe.dataset.kobBusId =
      id;

    return id;

  }


  /* ==========================================================
     FRAME ORIGIN
     ========================================================== */

  function getFrameOrigin(iframe) {

    try {

      return new URL(
        iframe.src ||
        iframe.getAttribute('src') ||
        location.href,
        location.href
      ).origin;

    } catch (_) {

      return location.origin;

    }

  }


  /* ==========================================================
     SAME ORIGIN
     ========================================================== */

  function isSameOrigin(iframe) {

    try {

      const origin =
        getFrameOrigin(
          iframe
        );

      return (
        origin ===
        location.origin
      );

    } catch (_) {

      return false;

    }

  }


  /* ==========================================================
     SAME-ORIGIN BRIDGE
     ========================================================== */

  function connectSameOrigin(
    iframe
  ) {

    try {

      const doc =
        iframe.contentDocument ||
        iframe.contentWindow?.document;

      if (!doc) {

        return false;

      }


      /*
        Instala somente uma vez
        naquele document.
      */

      if (
        STATE.documents.has(doc)
      ) {

        return true;

      }

      STATE.documents.add(doc);


      doc.addEventListener(
        'click',
        event => {

          const text =
            extractText(
              event.target
            );

          if (!text) return;

          speak(
            text,
            {
              source:
                'same-origin',
              iframe:
                frameId(iframe),
              url:
                iframe.src
            }
          );

        },
        true
      );


      log(
        'SAME-ORIGIN conectado',
        iframe.src
      );


      return true;

    } catch (err) {

      log(
        'Same-origin falhou',
        err
      );

      return false;

    }

  }


  /* ==========================================================
     CROSS ORIGIN BOOTSTRAP
     ========================================================== */

  function connectCrossOrigin(
    iframe
  ) {

    const id =
      frameId(iframe);

    const origin =
      getFrameOrigin(
        iframe
      );


    STATE.frames.set(
      id,
      {
        iframe,
        origin,
        crossOrigin: true
      }
    );


    /*
      O iframe recebe o sinal de inicialização.

      Se ele tiver KOB-BUS receptor,
      ativa a ponte.
    */

    try {

      iframe.contentWindow.postMessage(
        {
          type:
            'KOB_BUS_INIT',

          bus:
            VERSION,

          frameId:
            id,

          parentOrigin:
            location.origin

        },
        CONFIG.targetOrigin
      );

    } catch (err) {

      log(
        'postMessage INIT error',
        err
      );

    }


    log(
      'CROSS-ORIGIN conectado',
      {
        id,
        origin
      }
    );

  }


  /* ==========================================================
     CONNECT FRAME
     ========================================================== */

  function connectFrame(
    iframe
  ) {

    if (!iframe) {
      return;
    }


    const id =
      frameId(iframe);


    /*
      Evita duplicar listener de load.
    */

    if (
      !iframe.__kobBusLoad
    ) {

      iframe.__kobBusLoad =
        true;

      iframe.addEventListener(
        'load',
        () => {

          /*
            Novo document pode ter surgido.
          */

          if (
            isSameOrigin(
              iframe
            )
          ) {

            connectSameOrigin(
              iframe

          } else {

            connectCrossOrigin(
              iframe

      );

    */

      isSameOrigin(

        iframe
      );

    } else {

      connectCrossOrigin(
        iframe
      );

    }


    log(
      'FRAME',
      id,
      iframe.src
    );

  }

    );

      return;

                )

        ) + 'px';

      win.style.height =
        Math.min(
          rect.height,
          window.innerHeight
        ) + 'px';

      win.style.maxWidth =
        'none';

      win.style.maxHeight =
        'none';

    }


    win.classList.remove(
      'collapsed',
      'peeked'
    );

    win.classList.add(
      'resizing'
    );

    syncShell();

  }


  function finishResize(win) {

    win.classList.remove(
      'resizing'
    );

    syncShell();

  }


  /* =======================================================
     RESIZE Y
     ======================================================= */

  function bindResizeY(
    win,
    handle
  ) {

    let active = false;

    let pointerId = null;

    let startY = 0;

    let startH = 0;


    handle.addEventListener(
      'pointerdown',
      e => {

        if (
          e.button != null &&
          e.button !== 0
        ) return;


        const rect =
          win.getBoundingClientRect();


        active = true;

        pointerId =
          e.pointerId;

        startY =
          e.clientY;

        startH =
          rect.height;


        freeFromMaximize(
          win,
          rect
        );


        handle.setPointerCapture?.(
          pointerId
        );


        e.preventDefault();


        const move = ev => {

          if (
            !active ||
            ev.pointerId !== pointerId
          ) return;


          ev.preventDefault();


          const next =
            Math.max(
              44,
              Math.min(
                window.innerHeight,
                startH +
                (ev.clientY - startY)
              )
            );


          win.style.height =
            next + 'px';

        };


        const up = ev => {

          if (
            ev &&
            ev.pointerId !== pointerId
          ) return;


          active = false;


          window.removeEventListener(
            'pointermove',
            move
          );

          window.removeEventListener(
            'pointerup',
            up
          );

          window.removeEventListener(
            'pointercancel',
            up
          );


          finishResize(win);

        };


        window.addEventListener(
          'pointermove',
          move,
          { passive: false }
        );

        window.addEventListener(
          'pointerup',
          up,
          { passive: true }
        );

        window.addEventListener(
          'pointercancel',
          up,
          { passive: true }
        );

      },
      { passive: false }
    );

  }

  /* =======================================================
     WIRE SESSION
     ======================================================= */

  function wireSession(win) {

    if (
      !win ||
      win.dataset.wired === '1'
    ) return;


    win.dataset.wired = '1';


    makeResizeHandles(win);


    const header =
      $('.win-hdr', win);


    if (header) {

      header.addEventListener(
        'click',
        e =>
          handleHeaderClick(
            e,
            win.id
          )
      );

    }


    const controls =
      $('.win-controls', win);


    controls?.addEventListener(
      'click',
      e => {

        e.preventDefault();

        e.stopPropagation();


        const btn =
          e.target.closest('button');


        if (!btn) return;


        const action =
          btn.dataset.action;


        if (
          action === 'collapse'
        ) {

          toggleCollapse(win.id);

        }

        else if (
          action === 'maximize'
        ) {

          maximizeWindow(win.id);

        }

        else if (
          action === 'minimize'
        ) {

          minimizeWindow(win.id);

        }

        else if (
          action === 'close'
        ) {

          closeWindow(win.id);

        }

      }
    );


    const input =
      $('.win-urlbar', win);


    const go =
      $('.win-go-btn', win);


    go?.addEventListener(
      'click',
      e => {

        e.preventDefault();

        e.stopPropagation();

        setFrameUrl(
          win,
          input?.value
        );

      }
    );


    input?.addEventListener(
      'keydown',
      e => {

        if (
          e.key === 'Enter'
        ) {

          e.stopPropagation();

          setFrameUrl(
            win,
            input.value
          );

        }

      }
    );

  }


  /* =======================================================
     CREATE SESSION
     ======================================================= */

  function createSessionWindow({
    title = DEFAULT_TITLE,
    src = DEFAULT_SRC
  } = {}) {

    const id =
      'session-' +
      Date.now() +
      '-' +
      counter++;


    const win =
      document.createElement(
        'section'
      );


    win.className =
      'session-window peeked';


    win.id =
      id;


    win.innerHTML = `

      <div class="win-hdr">

        <div class="win-controls">

 <button
            type="button"
            data-action="collapse"
            title="Colapsar"
            aria-label="Colapsar"
          >
            −
          </button>

       <!-- <span style="pointer-events:auto" 
class="win-title">
          ۞ ${title}
        </span> -->

<button
            type="button"
            data-action="maximize"
            title="Maximizar"
            aria-label="Maximizar"
          >
            ⛶
          </button>


          <button
            type="button"
            data-action="minimize"
            title="Minimizar"
            aria-label="Minimizar"
          >
            ۞
          </button>
                    <button
            type="button"
            data-action="close"
            title="Fechar"
            aria-label="Fechar"
            style="color:red"
          >
            ×
          </button>
</div>
        

      <div
          class="win-navrow"
          style="flex:2; min-width:0;"
        >

          <input
            class="win-urlbar"
            type="text"
            value="${src}"
            placeholder="Digite uma URL..."
            spellcheck="false"
            autocomplete="off"
          >


          <button
            class="win-go-btn"
            type="button"
          >
            Go
          </button>

        </div>


      </div>


      <iframe
        class="win-frame"
        data-runtime="nav"
        src="${src}"
      ></iframe>

    `;


    stackWrap.appendChild(win);


    wireSession(win);

    bringToFront(win);


    return id;

  }


  /* =======================================================
     GLOBAL NAV
     ======================================================= */

  const navInput =
    document.getElementById(
      'urlInputNav'
    );


  const navFrame =
    document.getElementById(
      'navFrame'
    );


  function applyGlobalUrl() {

    if (
      !navInput ||
      !navFrame
    ) return;


    setFrameUrl(
      document.getElementById(
        'session-iframe'
      ),
      navInput.value
    );

  }


  navInput?.addEventListener(
    'keydown',
    e => {

      if (
        e.key === 'Enter'
      ) {

        applyGlobalUrl();

      }

    }
  );


  document
    .getElementById('goNavBtn')
    ?.addEventListener(
      'click',
      applyGlobalUrl
    );

    .getElementById('openKobBtn')
    ?.addEventListener(

    );

    .getElementById('openLogsBtn')

        )
    );


  /* =======================================================

  $$('.session-window')
    .forEach(wireSession);


  if (
    navInput &&
    navFrame
  ) {

    navInput.value =
      navFrame.src;

  }


  syncShell();

})();
