  <style>
        /* ═══════════════════════════════════════════════════════
           DUAL CORE · GLOBAL TOKENS (HERDADO DO HEADER-BASE)
           ═══════════════════════════════════════════════════════ */
        :root {
            color-scheme: dark;
            --bg: #050507;
            --panel: rgba(18, 18, 22, .82);
            --panel-solid: #121216;
            --border: rgba(255, 255, 255, .10);
            --text: #f5f5f7;
            --muted: rgba(255, 255, 255, .52);
            --cyan: #00e5ff;
            --purple: #bf5af2;
            --gold: #ffd60a;
            --input-bg: rgba(255, 255, 255, .055);
            --button-bg: rgba(255, 255, 255, .07);
            --topbar-bg: rgba(5, 5, 7, .82);
            --dock-bg: rgba(10, 10, 13, .92);
            --shadow: 0 10px 40px rgba(0, 0, 0, .35);
            --radius: 18px;
            --transition: .25s ease;
            --header-height: 56px;
        }

        /* ═══════════════════════════════════════════════════════
           LIGHT (HERDADO DO HEADER-BASE)
           ═══════════════════════════════════════════════════════ */
        html[data-theme="light"] {
            color-scheme: light;
            --bg: #f5f5f7;
            --panel: rgba(255, 255, 255, .85);
            --panel-solid: #ffffff;
            --border: rgba(0, 0, 0, .08);
            --text: #1a1a1e;
            --muted: rgba(0, 0, 0, .50);
            --cyan: #007aff;
            --purple: #af52de;
            --gold: #d4a017;
            --input-bg: rgba(0, 0, 0, .035);
            --button-bg: rgba(0, 0, 0, .045);
            --topbar-bg: rgba(255, 255, 255, .82);
            --dock-bg: rgba(255, 255, 255, .92);
            --shadow: 0 10px 40px rgba(0, 0, 0, .10);
        }

        /* ═══════════════════════════════════════════════════════
           RESET
           ═══════════════════════════════════════════════════════ */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, system-ui, sans-serif;
            transition: background-color var(--transition), color var(--transition);
            overflow-y: auto;
        }

        /* ═══════════════════════════════════════════════════════
           HEADER FLUTUANTE (HERDADO DO HEADER-BASE)
           ═══════════════════════════════════════════════════════ */
        .topbar {
            position: relative;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: var(--header-height);
            padding: 10px 18px;
            background: var(--topbar-bg);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            transform: translateY(0);
            opacity: 1;
            transition: transform .32s cubic-bezier(.22, 1, .36, 1), opacity .25s ease, background var(--transition), border-color var(--transition);
            pointer-events: auto;
        }
        .topbar.header-hidden {
            transform: translateY(calc(-100% - 12px));
            opacity: .12;
            pointer-events: none;
        }
        .topbar.header-visible {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .brandX {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            letter-spacing: .08em;
            font-size: 15px;
        }
        .brandX small {
            font-weight: 400;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: .04em;
        }
        .badgeX {
            padding: 4px 9px;
            border-radius: 999px;
            background: var(--button-bg);
            color: var(--muted);
            font-size: 10px;
            letter-spacing: .08em;
            font-weight: 600;
        }

        /* TEMA · BOLINHA */
        .theme-dot {
            position: relative;
            width: 34px;
            height: 34px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: var(--button-bg);
            color: var(--text);
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: transform .2s ease, background var(--transition), border-color var(--transition), box-shadow var(--transition);
            flex-shrink: 0;
        }
        .theme-dot svg {
            width: 16px;
            height: 16px;
            stroke: var(--text);
            transition: stroke var(--transition);
        }
        .theme-dot:hover {
            transform: scale(1.08);
            border-color: var(--cyan);
            box-shadow: 0 0 20px color-mix(in srgb, var(--cyan) 20%, transparent);
        }

        /* ═══════════════════════════════════════════════════════
           MAIN CONTENT · COLAPSÁVEL
           ═══════════════════════════════════════════════════════ */
        #main-content {
            padding-top: var(--header-height);
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            max-height: 50000px;
            overflow: hidden;
            transition: opacity .35s ease, max-height .35s ease, visibility .35s ease, padding .35s ease;
        }
        #main-content.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
        }

       

      
    </style>
