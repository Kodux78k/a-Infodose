<body class="field-closed mode-night">

  <!-- Ambient Blobs -->
  <div class="ambient-light"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>
  <div id="snap-zone"></div>
  <div class="toaster-wrap" id="toasterWrap"></div>

<div class="almasliber" data-app="almasliber">
  <div class="shello">

    <!-- TOPBAR SISTEMA -->
    <header style="z-index:0" class="topbar" id="system-topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Abrir menu">☰</button>
      <div class="brand">
        A.<span>INFODOSE</span>
        <span class="mini-orb-wrap" id="topbarMiniOrb"></span>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="icon-btn theme-dot" id="themeToggle" aria-label="Alternar tema">🌙</button>
        <button class="icon-btn" id="notifBtn" aria-label="Notificações">♧</button>
      </div>
    </header>

    <!-- HEADER GLOBAL (barra de navegação unificada) -->
    <header class="topbar header-visible" id="main-header">
      <div class="brandX">

        <span class="badgeX">GLOBAL</span>
      </div>
      <div class="win-navrow" onclick="event.stopPropagation()">
        <input class="win-urlbar" type="text" id="urlInputNav" placeholder="Digite uma URL..." spellcheck="false" autocomplete="off">
        <button class="win-go-btn" type="button" id="goNavBtn">Go</button>
                        <button class="launcher-btn" id="orbToggle" title="Acessar Cockpit do Usuário" onclick="toggleDrawer('drawerProfile')">
🔅
 </button> 
<!--  <button class="win-go-btn" type="button" id="favBtn" title="Favoritos" style="padding:10px 12px;background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.3);">★
</button> -->
      </div>
      <button id="theme-dot-canon" class="theme-dot" type="button" aria-label="Alternar tema" title="Alternar tema">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;">
          <circle cx="12" cy="12" r="5"></circle>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
      </button>
    </header>

    <!-- MAIN -->
    <main>
      <div id="main-content">
        <div id="kxtsk-shell">
          <div id="inject-here"></div>
          <div id="dock"></div>
          <div id="stackWrap">
            <!-- Sessão inicial (será gerenciada) -->
            <div class="session-window peeked" id="session-iframe">
              <div class="win-hdr">
                <div class="win-controls">
                  <button type="button" data-action="collapse" title="Colapsar" aria-label="Colapsar">−</button>
                  <button type="button" data-action="tab-switcher" class="tab-counter" id="tabCounterInit">1</button>
                  <button type="button" data-action="maximize" title="Maximizar" aria-label="Maximizar">⛶</button>
                  <button type="button" data-action="minimize" title="Minimizar" aria-label="Minimizar">۞</button>
                  <button id="theme-dot" class="theme-dot" type="button" aria-label="Alternar tema" title="Alternar tema">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;">
                      <circle cx="12" cy="12" r="5"></circle>
                      <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                    </svg>
                  </button>
                  <button class="launcher-btn" id="openKobBtn">+</button>
</div>
              </div>
              <iframe class="win-frame" data-runtime="nav" id="navFrame" src="https://www.infodose.com.br/splash"></iframe>
            </div>
          </div><!-- /stackWrap -->
        </div><!-- /kxtsk-shell -->
      </div>
    </main>

    <nav style="display:none" class="symbol-bar bottom-nav" data-module="navigation" aria-label="Navegação principal">
      <button class="nav-item active" data-tab="home"><span class="nav-icon">⌂</span><span>Início</span></button>
      <button class="nav-item" id="navLibraryBtn"><span class="nav-icon">▣</span><span>Library</span></button>
      <button class="nav-main" id="navCreateBtn">+</button>
      <button class="nav-item" id="navResultsBtn"><span class="nav-icon">▥</span><span>Resultados</span></button>
      <button class="nav-item" id="navProfileBtn"><span class="nav-icon">♙</span><span>Perfil</span></button>
    </nav>

  </div><!-- /shell -->
</div><!-- /almasliber -->

<!-- ===== TAB SWITCHER OVERLAY (global) ===== -->
<div class="session-window peeked tab-switcher-overlay" id="tabSwitcherOverlay">
  <div class="tab-switcher-panel" id="tabSwitcherPanel">
  <div class="win-hdr">
                <div class="win-controls">
                  <div class="panel-header">

      <div class="panel-actions">
        <button id="newTabBtn"><span>+</span></button>
        <button id="closeTabSwitcher">✕</button>
      </div>
    </div>
   <button type="button" data-action="collapse" title="Colapsar" aria-label="Colapsar">−</button>

                      <small id="tabSwitcherTitle">Abas da janela</small> 

                  <button type="button" data-action="maximize" title="Maximizar" aria-label="Maximizar">⛶</button>
                  <button type="button" data-action="minimize" title="Minimizar" aria-label="Minimizar">۞</button>
    

                </div>
              </div>

    <div class="tab-grid" id="tabGrid"></div>
  </div>
</div>

  <div id="drawerOverlay" class="drawer-overlay" onclick="toggleDrawer()"></div>

  <div id="drawerProfile" class="drawer" aria-hidden="true">
    <div class="drawer-content">
      <div class="drawer-header">
        <h3>
          <svg style="width:20px;height:20px;margin-right:8px;stroke:var(--secondary)"><use href="#icon-orb"></use></svg>
          Cockpit Solar
        </h3>
        <button class="btn-icon" style="width:38px;height:38px;border-radius:12px;" onclick="toggleDrawer('drawerProfile')">✕</button>
      </div>

      <div class="drawer-body">

  <div class="cockpit-item">
            <div class="cockpit-label">Background</div>
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span id="bgStatusText" style="font-size:0.8rem;color:var(--text-muted)">Nenhum</span>
              <label class="btn-icon" style="width:30px;height:30px;border-radius:5px;">
                <input type="file" id="bgUploadInput" accept="image/*" style="display:none">
                <svg><use href="#icon-cards"></use></svg>
              </label>
            </div>
          </div>

          <div id="bgThumbPanel" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px;"></div>

        <div class="cockpit-item" style="text-align:center;margin-bottom:15px;">
          <div class="cockpit-label">Ciclo Solar</div>
          <div id="statusSolarMode" style="font-size:1.2rem;font-weight:bold;margin:5px 0;">AUTO</div>
          <div class="control-row">
            <button class="btn-block" id="btnCycleSolar">Manual ☀️/🌙</button>
            <button class="btn-block" id="btnAutoSolar">Auto 🕒</button>
          </div>
        </div>

        <div class="cockpit-grid">
          <div class="cockpit-item">
            <div class="cockpit-label">Identificação</div>
            <input type="text" id="inputUserId" class="cockpit-input" placeholder="Viajante">
          </div>

          <div class="cockpit-item">
            <div class="cockpit-label">Modelo IA</div>
            <input type="text" id="inputModel" class="cockpit-input" placeholder="google/gemini-2.0-flash-exp">
          </div>

        
     <div class="drawer-header">

    <h2>⚙️ Background Engine</h2>

    <button class="drawer-close" onclick="toggleDrawer()" title="Fechar">×</button>

  </div>

  <div class="drawer-body">

    <div class="panel-section">

      <label class="section-label">

        <span>Opacidade</span>

        <span id="val-op">15%</span>

      </label>

      <input id="bgOpacity" type="range" min="0" max="100" value="15"

        oninput="updateBgAttr('opacity', this.value)">

    </div>

    <div class="panel-section">

      <label class="section-label">

        <span>Modos</span>

        <span>CSS</span>

      </label>

      <select id="bgBlend" onchange="updateBgAttr('blend', this.value)">

        <option value="normal">Normal</option>

        <option value="multiply">Multiply</option>

        <option value="screen">Screen</option>

        <option value="overlay" selected>Overlay</option>

        <option value="soft-light">Soft Light</option>

        <option value="luminosity">Luminosity</option>

      </select>

    </div>

    <div class="panel-section">

      <label class="section-label">

        <span>Presets rápidos</span>

        <span>BG</span>

      </label>

      <div class="preset-grid">

        <button class="preset-btn" onclick="updateBgAttr('opacity', 0)">0%</button>

        <button class="preset-btn" onclick="updateBgAttr('opacity', 15)">15%</button>

        <button class="preset-btn" onclick="updateBgAttr('opacity', 35)">35%</button>

        <button class="preset-btn" onclick="updateBgAttr('opacity', 60)">60%</button>

        <button class="preset-btn" onclick="updateBgAttr('opacity', 100)">100%</button>

      </div>

    </div>   

  </div>

    </div>
